<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Dragon Turf — Chinatown Gang War</title>
<meta name="description" content="A top-down open-world crime sandbox set in a neon Chinatown. Steal cars, fight for turf, outrun the cops." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a8231d'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23f1c64a'%3E%E9%BE%8D%3C/text%3E%3C/svg%3E" />
<style>:root{
  --ink:#120c18; --ink2:#1c1424; --panel:#171020; --lac:#a8231d; --red:#e23b2e; --gold:#f1c64a; --jade:#2fd07a; --cream:#efe3c4; --dim:#8f86a0; --neon:#37e6ff; --pink:#ff3d6e;
  --font:"Arial Black","Avenir Next Condensed",Impact,"PingFang SC",sans-serif; --ui:"Avenir Next","Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05060a;color:var(--cream);font-family:var(--ui);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;display:block;cursor:none}
[hidden]{display:none!important}
.o{text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}

/* ================= HUD ================= */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--font);color:#fff;transition:opacity .3s}
#hud.inactive{opacity:0}
.hud-tl{position:absolute;left:22px;top:20px;display:flex;gap:12px;align-items:center}
.portrait{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a2a4a,#120c18);border:3px solid var(--gold);box-shadow:0 0 0 2px #000,0 6px 14px #000a;display:grid;place-items:center;font-size:26px;color:var(--gold);text-shadow:0 0 12px #f1c64a88}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{position:relative;width:230px;height:15px;background:#0009;border:2px solid #000;border-radius:3px;box-shadow:0 0 0 1px #ffffff22;overflow:hidden;transform:skewX(-12deg)}
.bar i{display:block;height:100%;width:100%;transition:width .18s}
.bar.hp i{background:repeating-linear-gradient(90deg,#ff5a4a 0 8px,#d63a30 8px 10px)}
.bar.armor i{background:repeating-linear-gradient(90deg,#6fb8ff 0 8px,#3f86cc 8px 10px)}
.bar.armor{height:10px;width:190px}.bar.armor.empty{display:none}
.bar b{position:absolute;left:6px;top:-2px;font-size:11px;color:#fff;transform:skewX(12deg);text-shadow:0 0 3px #000;font-weight:400}
.bar.hp.low{animation:lowhp .6s steps(2) infinite}
@keyframes lowhp{50%{box-shadow:0 0 0 2px #ff2a2a,0 0 14px #ff2a2a}}
.hud-tr{position:absolute;right:26px;top:16px;text-align:right}
.cash{display:flex;flex-direction:column;align-items:flex-end}
.cash small{font-size:10px;letter-spacing:4px;color:#9be8a8aa}
.cash span{font-size:38px;color:#7ed957;letter-spacing:1px;text-shadow:2px 3px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;line-height:1}
.cash span.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.28);color:#d8ffd0}100%{transform:scale(1)}}
.stars{display:flex;gap:3px;justify-content:flex-end;margin-top:8px}
.stars em{width:30px;height:30px;display:block}
.stars svg{width:100%;height:100%;fill:#2a2433;stroke:#000;stroke-width:1.2;filter:drop-shadow(0 2px 0 #000)}
.stars em.on svg{fill:var(--gold);filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 7px #f1c64a)}
.stars em.flash svg{animation:starflash .32s steps(2) infinite}
@keyframes starflash{50%{fill:#ff3b3b}}
.weapon{margin-top:10px;display:inline-flex;gap:10px;align-items:baseline;background:linear-gradient(90deg,#0000,#000a);padding:4px 10px 4px 26px;border-right:3px solid var(--gold)}
.wname{font-size:14px;color:#eee;letter-spacing:1px;text-shadow:1px 1px 0 #000}.wammo{font-size:22px;color:var(--gold);text-shadow:2px 2px 0 #000}
.clock{font-size:13px;color:#c9c0e0;margin-top:6px;letter-spacing:2px;text-shadow:1px 1px 0 #000}
.hud-bl{position:absolute;left:22px;bottom:22px}
.radar{position:relative;width:190px;height:190px;border-radius:50%;background:#0b0e16;box-shadow:0 8px 24px #000b,0 0 0 4px #0b0610,0 0 0 6px var(--gold),0 0 0 8px #000}
.radar canvas{position:absolute;inset:0;border-radius:50%}
.radar .ring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 22px 8px #000b;pointer-events:none}
.loc{margin:14px 0 0 6px;font-size:17px;letter-spacing:1px;text-shadow:2px 2px 0 #000;display:flex;flex-direction:column;line-height:1.1}
.loc small{font-size:11px;letter-spacing:2px;font-family:var(--ui);font-weight:700;text-transform:uppercase}
.radio{margin:5px 0 0 6px;font-size:11px;color:#c9c0e0;opacity:.85;letter-spacing:1px;font-family:var(--ui);font-weight:700}
.objective{position:absolute;left:50%;top:18px;transform:translate(-50%,-90px);max-width:min(700px,60vw);background:linear-gradient(90deg,#0000,#000c 20%,#000c 80%,#0000);padding:9px 46px;font-size:17px;color:var(--gold);text-align:center;letter-spacing:.5px;transition:transform .35s cubic-bezier(.2,1.2,.4,1);text-shadow:2px 2px 0 #000;border-bottom:2px solid #f1c64a55}
.objective.on{transform:translate(-50%,0)}
.prompt{position:absolute;left:50%;bottom:104px;transform:translate(-50%,24px);opacity:0;display:flex;gap:10px;align-items:center;background:#000c;border:2px solid var(--gold);border-radius:30px;padding:7px 18px 7px 8px;font-size:15px;letter-spacing:1px;transition:.18s}
.prompt.on{opacity:1;transform:translate(-50%,0)}
.prompt kbd{display:grid;place-items:center;min-width:28px;height:28px;border-radius:7px;background:linear-gradient(#ffe28a,#f1c64a);color:#1a1020;font-family:var(--font);font-size:14px;box-shadow:0 3px 0 #8a6a1a}
.toasts{position:absolute;right:26px;bottom:36px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.toast{background:#000c;border-right:4px solid var(--gold);padding:7px 16px;font-size:14px;letter-spacing:.5px;animation:tin .25s ease-out;text-shadow:1px 1px 0 #000;max-width:360px;text-align:right;transition:.35s}
.toast.tip{border-color:#37e6ff;background:#05202acc;font-size:15px}.toast.tip::before{content:'TIP  ';color:#37e6ff;font-size:11px;letter-spacing:.2em}
.toast.mini{font-size:12px;padding:4px 12px;border-color:#fff4}
.toast.bad{border-color:var(--red)}.toast.good{border-color:var(--jade)}
.toast.out{opacity:0;transform:translateX(30px)}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
.banner{position:absolute;left:0;right:0;top:20%;text-align:center;opacity:0;pointer-events:none}
.banner.show{animation:bannerIn 3.2s ease-out forwards}
.banner .b1{font-size:clamp(34px,6vw,76px);letter-spacing:.14em;color:var(--c,#fc3);text-shadow:3px 4px 0 #000,0 0 30px var(--cg,rgba(255,204,51,.55));-webkit-text-stroke:1.5px #000}
.banner .b2{font-size:15px;letter-spacing:.5em;margin-top:6px;color:#fff;text-shadow:2px 2px 0 #000;font-family:var(--ui);font-weight:800;text-transform:uppercase}
@keyframes bannerIn{0%{opacity:0;transform:scale(1.3)}10%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.vig{position:absolute;inset:0;opacity:0;transition:opacity .15s}
.vig.hurt{box-shadow:inset 0 0 150px 40px #e00}
.vig.wanted{box-shadow:inset 0 0 180px 30px var(--phase,#2a4aff)}
.speedo{position:absolute;right:30px;bottom:24px;font-size:42px;font-style:italic;opacity:0;transition:.2s;text-shadow:3px 3px 0 #000;transform:translateY(10px);display:flex;gap:6px;align-items:baseline}
.speedo.on{opacity:1;transform:none}.speedo small{font-size:12px;letter-spacing:2px;color:var(--dim)}
.subtitle{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);max-width:70vw;text-align:center;font-size:20px;opacity:0;transition:.25s;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;background:#0008;padding:6px 18px;border-radius:6px}
.subtitle.on{opacity:1}

.bigtext{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:clamp(60px,13vw,170px);letter-spacing:.12em;color:var(--c,#e23b2e);opacity:0;transition:opacity .5s;text-shadow:5px 7px 0 #000,0 0 50px var(--cg,rgba(226,59,46,.6));-webkit-text-stroke:2px #000}
.bigtext.on{opacity:1}
#hud.inactive .bigtext.on{opacity:1}

/* ================= SCREENS ================= */
#screens{position:fixed;inset:0;pointer-events:none;z-index:30}
.screen{position:absolute;inset:0;pointer-events:auto;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .22s;background:radial-gradient(ellipse at center,#120a1ccc,#05030aee)}
.screen.show{opacity:1}
.screen.clear{background:none}
.panel{position:relative;background:linear-gradient(180deg,#201428f2,#150e1cf5);border:2px solid #000;border-radius:6px;box-shadow:0 0 0 2px var(--gold),0 0 0 5px #000,0 24px 60px #000c;padding:22px 26px;max-height:92vh;overflow:auto}
.panel::before,.panel::after{content:"";position:absolute;width:26px;height:26px;border:3px solid var(--gold);pointer-events:none}
.panel::before{left:8px;top:8px;border-right:none;border-bottom:none}.panel::after{right:8px;bottom:8px;border-left:none;border-top:none}
.panel h2{font-family:var(--font);margin:0 0 4px;font-size:26px;letter-spacing:.12em;color:var(--gold);text-shadow:2px 2px 0 #000}
.panel .sub{color:var(--dim);font-size:13px;letter-spacing:.1em;margin-bottom:14px;font-family:var(--ui)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font);letter-spacing:.14em;font-size:14px;color:var(--cream);background:linear-gradient(180deg,#3a1c2a,#241220);border:2px solid #000;box-shadow:0 0 0 2px #7a5a28,0 4px 0 #000;padding:11px 24px;cursor:pointer;transform:skewX(-8deg);transition:.12s;text-transform:uppercase}
.btn>*{transform:skewX(8deg)}
.btn:hover{background:linear-gradient(180deg,#a8231d,#6a1410);box-shadow:0 0 0 2px var(--gold),0 4px 0 #000,0 0 18px #e23b2e88;color:#fff;transform:skewX(-8deg) translateY(-1px)}
.btn:active{transform:skewX(-8deg) translateY(2px);box-shadow:0 0 0 2px var(--gold),0 1px 0 #000}
.btn.primary{background:linear-gradient(180deg,#e8b83a,#b5801a);color:#1a1020;box-shadow:0 0 0 2px #000,0 4px 0 #6a4a0a}
.btn.primary:hover{background:linear-gradient(180deg,#ffd45a,#d9a02a);color:#000}
.btn.small{font-size:11px;padding:6px 12px}
.btn[disabled]{opacity:.35;pointer-events:none;filter:grayscale(.6)}
.btn.ghost{background:#0006;box-shadow:0 0 0 1px #ffffff33}
.row{display:flex;gap:10px;align-items:center}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid #000}
.tab{font-family:var(--font);font-size:12px;letter-spacing:.14em;padding:9px 18px;color:var(--dim);cursor:pointer;background:#0006;border:2px solid #000;border-bottom:none;transform:skewX(-10deg);margin-right:2px;transition:.12s}
.tab>*{display:inline-block;transform:skewX(10deg)}
.tab:hover{color:#fff}.tab.on{background:linear-gradient(180deg,#a8231d,#6a1410);color:#fff;box-shadow:0 -2px 0 var(--gold)}
kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:5px;background:linear-gradient(#ffe28a,#f1c64a);color:#1a1020;font-family:var(--font);font-size:11px;box-shadow:0 2px 0 #8a6a1a}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#ffffff0a;border:1px solid #ffffff14;padding:9px 14px;border-radius:4px;transition:.12s}
.item:hover{background:#ffffff14;border-color:#f1c64a66}
.item .ico{font-size:22px;width:34px;text-align:center}
.item .t{font-family:var(--font);font-size:14px;letter-spacing:.06em;color:#fff}
.item .d{font-size:12px;color:var(--dim);font-family:var(--ui);margin-top:2px}
.price{font-family:var(--font);color:#7ed957;font-size:15px}
.pill{display:inline-block;font-family:var(--font);font-size:10px;letter-spacing:.14em;padding:3px 9px;border-radius:20px;background:#0008;border:1px solid #ffffff33}
.pill.good{color:#7ed957;border-color:#7ed95766}.pill.bad{color:#ff6a5a;border-color:#ff6a5a66}.pill.gold{color:var(--gold);border-color:#f1c64a66}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.hint{font-family:var(--ui);font-size:12px;color:var(--dim)}
.sep{height:1px;background:linear-gradient(90deg,#0000,#f1c64a55,#0000);margin:14px 0}
input[type=range]{accent-color:var(--gold);width:180px}

/* title */
.screen.title{background:linear-gradient(180deg,#06040ccc 0%,#06040c66 40%,#06040ccc 100%)}
.title-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.logo{font-family:var(--font);font-size:clamp(46px,9vw,120px);letter-spacing:.06em;line-height:.95;color:var(--gold);text-shadow:4px 6px 0 #6a1410,8px 10px 0 #000,0 0 50px #f1c64a55;-webkit-text-stroke:2px #000}
.logo small{display:block;font-size:.34em;letter-spacing:.5em;color:#fff;text-shadow:3px 3px 0 #000;-webkit-text-stroke:1px #000}
.logo-cn{font-size:clamp(30px,5vw,64px);color:#e23b2e;text-shadow:3px 4px 0 #000;letter-spacing:.4em;margin:-4px 0 18px;-webkit-text-stroke:1.5px #000}
.menu{display:flex;flex-direction:column;gap:12px;width:min(340px,80vw)}
.menu .btn{width:100%;font-size:16px;padding:13px 20px}
.tagline{font-family:var(--ui);color:var(--dim);letter-spacing:.3em;font-size:12px;margin-top:22px;text-transform:uppercase}
.ver{position:absolute;right:18px;bottom:12px;color:#ffffff44;font-size:11px;letter-spacing:.2em;font-family:var(--ui)}

/* comic dialogue */
.screen.comic{background:linear-gradient(120deg,var(--tintA,#2a1a2a),#0b0710 60%);align-items:flex-end}
.comic .halftone{position:absolute;inset:0;background:radial-gradient(circle,#ffffff14 1.5px,transparent 2px) 0 0/12px 12px;opacity:.7;mask-image:linear-gradient(120deg,#000 0%,#0000 70%)}
.comic .letterbox{position:absolute;left:0;right:0;height:9vh;background:#000}.comic .letterbox.top{top:0}.comic .letterbox.bot{bottom:0}
.comic .cast{position:absolute;inset:9vh 0 9vh 0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;padding:0 4vw}
.comic canvas{height:76vh;width:auto;max-width:44vw;filter:drop-shadow(8px 10px 0 #0009);transition:.25s}
.comic canvas.dim{filter:brightness(.4) saturate(.6) drop-shadow(8px 10px 0 #0009);transform:translateY(14px) scale(.97)}
.comic.flash{animation:cflash .12s}
@keyframes cflash{0%{filter:brightness(2)}}
.bubble{position:relative;width:min(900px,80vw);margin:0 auto 11vh;background:#f6efdc;color:#1a1020;border:4px solid #000;border-radius:10px;padding:18px 26px 22px;box-shadow:8px 8px 0 #000;z-index:3;font-family:var(--ui)}
.bubble .who{position:absolute;left:18px;top:-18px;font-family:var(--font);font-size:15px;letter-spacing:.14em;background:var(--c,#f1c64a);color:#0b0710;padding:4px 16px;border:3px solid #000;transform:skewX(-10deg);text-shadow:none}
.bubble .said{font-size:clamp(17px,2.2vw,24px);line-height:1.45;min-height:3.2em;font-weight:600}
.bubble .next{position:absolute;right:18px;bottom:8px;font-size:12px;font-family:var(--font);color:#7a5a28}
.bubble.left{margin-left:4vw}
.skip{position:absolute;right:20px;top:calc(9vh + 10px);font-size:11px;color:#fff8;letter-spacing:.1em;font-family:var(--ui);z-index:4}

/* PDA */
.pda{width:min(1220px,96vw);height:min(820px,92vh);display:flex;flex-direction:column}
.pda-head{display:flex;align-items:flex-end;gap:20px;border-bottom:2px solid #000;margin-bottom:12px}
.pda-head h2{margin:0 8px 10px 0}.pda-head .tabs{border:none;margin:0;flex:1}
.pda-clock{font-family:var(--font);font-size:12px;color:var(--dim);letter-spacing:.1em;margin-bottom:12px}
.pda-body{flex:1;overflow:auto;padding-right:6px}.pda-foot{margin-top:8px}
.pda h3{font-family:var(--font);font-size:13px;letter-spacing:.2em;color:var(--gold);margin:0 0 8px}
.map-wrap{display:grid;grid-template-columns:1fr 250px;gap:14px;height:100%;min-height:0}
canvas.map{width:100%;height:100%;object-fit:contain;min-height:0;border:2px solid #000;box-shadow:0 0 0 2px #7a5a28;border-radius:4px;cursor:crosshair;background:#070a10}
.map-side .lg{display:flex;align-items:center;gap:8px;font-family:var(--ui);font-size:13px;margin:5px 0}.lg i{width:12px;height:12px;border-radius:3px;border:1px solid #000}.lg b{margin-left:auto;color:var(--gold)}
.turf-card{border:2px solid;padding:10px 12px;border-radius:5px;background:#0006}.turf-card .tn{font-family:var(--font);font-size:16px;margin-bottom:2px}
table.market{width:100%;border-collapse:collapse;margin-top:12px;font-family:var(--ui);font-size:13px}
table.market th{font-family:var(--font);font-size:10px;letter-spacing:.1em;color:var(--dim);padding:6px 8px;text-align:center;border-bottom:2px solid #000}
table.market th.here{color:var(--gold)}
table.market td{padding:9px 8px;text-align:center;border-bottom:1px solid #ffffff12}
table.market td.g{text-align:left;font-family:var(--font);font-size:13px}.market td.g small{display:block;color:var(--dim);font-family:var(--ui);font-size:11px;margin-top:2px}
table.market td.hi{color:#7ed957;font-weight:800;background:#7ed95712}table.market td.lo{color:#ff7a6a;background:#ff7a6a10}

/* hotwire */
.hw{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);text-align:center;background:#000d;border:3px solid var(--gold);padding:16px 30px 14px;border-radius:8px;box-shadow:0 0 0 3px #000,0 10px 40px #000}
.hw-title{font-family:var(--font);letter-spacing:.2em;color:var(--gold);margin-bottom:10px;font-size:14px}
.hw-seq{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.hw .k b{display:block;font-size:24px;line-height:1}
.hw .hint{max-width:380px;margin:0 auto;line-height:1.6}
.hw .k{display:grid;place-items:center;width:52px;height:52px;border:3px solid #fff4;border-radius:8px;font-size:28px;color:#fff;background:#ffffff0c;transition:.1s}
.hw .k.ok{background:#2fd07a;color:#04200f;border-color:#000;transform:scale(1.08)}
.hw .k.bad{background:#e23b2e;border-color:#000;animation:shake .2s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hw-bar{height:12px;background:#0008;border:2px solid #000;border-radius:3px;margin-bottom:8px;overflow:hidden}
.hw-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e23b2e,#f1c64a,#2fd07a);transition:none}
.screen.failed .hw{border-color:var(--red);animation:shake .3s}

/* shop layout: header with cash + leave, scrolling body that fits 720p */
.panel.shop{display:flex;flex-direction:column;max-height:92vh}
.shop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:10px}
.shop-cash{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.shop-cash .price{font-size:24px}
.shop-body{overflow:auto;min-height:0;padding-right:4px}
h3.sh{font-family:var(--font);font-size:13px;letter-spacing:.2em;color:var(--gold);margin:0 0 8px}
.item.locked{opacity:.5}
.item .pill{white-space:nowrap}
.legend2{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-family:var(--ui);font-size:12px;color:#c9c0e0}.legend2 b{display:inline-block;width:16px;text-align:center}
.howto p{margin:4px 0 8px;line-height:1.9;font-family:var(--ui);font-size:13px}.howto .hint{line-height:1.6}.howto h3.sh{margin-top:12px}

/* rank chip under the vitals */
.rankchip{margin-top:6px;display:flex;flex-direction:column;gap:3px;width:190px}
.rankchip b{font:800 11px/1 "Arial Black",Impact,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7dff6a;text-shadow:1px 1px 0 #000}
.rankchip i{display:block;height:4px;background:#0009;border:1px solid #000;border-radius:2px;overflow:hidden}
.rankchip s{display:block;height:100%;width:0;background:linear-gradient(90deg,#2fd07a,#b6ff7a);transition:width .4s}
.stars.none{visibility:hidden}
.toasts.lift{bottom:110px}
.xpbar{height:10px;background:#0008;border:1px solid #000;border-radius:5px;overflow:hidden}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#2fd07a,#ffd23a)}

/* cheat menu */
.cheats{max-height:92vh;overflow-y:auto}
.cheat-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
