<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Browse the public files and projects in mw_lab.">
  <title>Files · mw_lab</title>
  <link rel="stylesheet" href="assets/file-browser.css">
  <script src="assets/file-browser.js" defer></script>
</head>
<body>
  <main class="browser" aria-label="mw_lab files">
    <header class="browser-header">
      <a class="brand" href="./">mw_lab</a>
      <span class="header-label">Files</span>
    </header>

    <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>

    <div class="toolbar">
      <div class="folder-heading">
        <h1 id="folder-name">Files</h1>
        <span id="item-count" aria-live="polite"></span>
      </div>
      <label class="filter-label">
        <span class="visually-hidden">Filter this folder</span>
        <input id="filter" type="search" placeholder="Filter this folder…" autocomplete="off">
      </label>
    </div>

    <div class="file-list" role="table" aria-label="Files and folders">
      <div class="file-list-header" role="row">
        <span role="columnheader">Name</span>
        <span role="columnheader">Type</span>
        <span role="columnheader">Open</span>
      </div>
      <div id="file-rows" role="rowgroup"></div>
    </div>
    <button id="load-more" class="load-more" type="button" hidden>Show more files</button>
    <p id="message" class="message" role="status" hidden></p>
  </main>
</body>
</html>
