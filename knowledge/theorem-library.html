"120\" width=\"480\"></rect>\n<text fill=\"#e2e8f0\" font-size=\"14\" x=\"24\" y=\"35\">n even ⇔ n² even | n odd ⇒ n² odd</text>\n<text fill=\"#6eb5ff\" font-size=\"14\" x=\"24\" y=\"65\">a²=2b² ⇒ a² even ⇒ a even ⇒ a=2k</text>\n<text fill=\"#fbbf24\" font-size=\"14\" x=\"24\" y=\"95\">⇒ b²=2k² ⇒ b is even ⇒ contradicts the conventional contract</text>\n</svg></div>\n<p>Use unique decomposition: the exponent of 2 in a² is even, and the exponent of 2b² is odd, which is a contradiction. Can be generalized to √m (m is non-square).</p>\n</div>", "deep": "\n<h3>Use the only decomposed version</h3>\n<p>a²=2b². Compare the exponents of the prime factor 2 on both sides: the left is even (squared), the right = 1 + (the exponent of 2 in b²) is odd. contradiction.</p>\n<h3>promotion</h3>\n<p>For positive integers m that are not perfectly square, √m is irrational: similarly a² = m b², given some prime number with an odd exponent in m.</p>\n<h3>Geometry version (infinite descent)</h3>\n<p>If the waist and hypotenuse of an isosceles right triangle are commensurable, smaller commensurable triangles of the same type can be constructed, infinitely decreasing - contradicting \"positive integers cannot become infinitely small\".</p>\n", "why": "\n<p>Forcing us to accept \"irrational numbers\". Without it, subsequent real numbers and calculus would not be stable.</p>\n", "try": "\n<ul>\n<li>Go through the proof steps: Assume that √2=a/b is reduced, and it follows that a and b are both even numbers - a contradiction.</li>\n<li>Try squaring a few fractions to see which one is closest to 2, but it's always a little closer.</li>\n</ul>\n"}, "field": "math"}}, "title": "√2 is an irrational number", "subtitle": "For some lengths, the score can never be determined", "difficultyLabel": "Easy to use", "tags": ["number theory", "Irrational numbers", "proof by contradiction"], "era": "Pythagoreans around 5th century B.C.", "oneLiner": "The diagonal of a square ÷ the length of the side cannot be written as the ratio of two integers. First discovery: Not enough points.", "people": [{"role": "Discovery (Legend)", "name": "Hippasus/Pythagoreans", "years": "ca. 5th century BC"}, {"role": "Classic textbook proof method", "name": "The odd-odd proof method recorded by Aristotle and others", "years": "ancient greece"}], "sections": {"story": "\n<p>A square with side length 1 has a diagonal of √2. The ancient Greeks once believed that all lengths are ratios of whole numbers. The result √2 shattered the fantasy.</p>\n<p>It's not that \"the calculation is inaccurate\", but<strong>Doesn't exist at all</strong>Two integers a and b let a/b be exactly equal to √2.</p>\n<div class=\"fun-box\"><strong>On the calculator:</strong>1.414213… keeps going, but it never becomes a clean cyclic fraction (rational number).</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>√2 cannot be written as the ratio of two integers.</p>\n<div class=\"formula\" data-latex=\"\\sqrt{2}\\notin\\mathbb{Q}\"></div>\n<p>That is: there is no integer <span data-latex=\"a,b\">a,b</span>（<span data-latex=\"b\\ne 0\">b≠0</span>)make <span data-latex=\"(a/b)^2=2\">(a/b)²=2</span>。</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Agreement</div>\n<p>The rational number a/b can always be written as<strong>reduced fraction</strong>:gcd(a,b)=1,b&gt;0. An even number is a multiple of 2; an odd number is a non-even number.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma: Parity of Squares</div>\n<p>n is an even number ⇔ n² is an even number. Equivalent: n odd ⇒ n² odd.</p>\n<p><em>prove:</em>n=2k ⇒ n²=4k² is even; n=2k+1 ⇒ n²=4k(k+1)+1 is odd.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Pretending that √2 is a reduced fraction, with one square on both sides, you will find that both the numerator and denominator must be even numbers, fighting against \"reduced\".</p><div class=\"interactive\" data-widget=\"sqrt2-proof\"></div>\n<div class=\"proof-nav\"><span>Counterevidence</span><span>agreed</span><span>Occasional contradictions</span></div>\n<ol class=\"steps\">\n<li>Suppose √2 = a/b, where a,b∈ℤ, b&gt;0, gcd(a,b)=1.</li>\n<li>Square both sides: a² / b² = 2 ⇒ <strong>a² = 2b²</strong>。</li>\n<li>The right-hand side is an even number ⇒ a² even ⇒ By the lemma <strong>a even</strong>. Write a=2k.</li>\n<li>Substitute: (2k)² = 2b² ⇒ 4k² = 2b² ⇒ <strong>b² = 2k²</strong>. Therefore b² even ⇒ <strong>b even</strong>。</li>\n<li>Both a and b are even numbers ⇒ gcd(a,b)≥2, which is inconsistent with the reduction.</li>\n<li>Therefore √2 is not a rational number.</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>Parity table (core reasoning)</h3>\n<div class=\"diagram\"><svg viewbox=\"0 0 480 120\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#0f172a\" height=\"120\" width=\"480\"></rect>\n<text fill=\"#e2e8f0\" font-size=\"14\" x=\"24\" y=\"35\">n even ⇔ n² even | n odd ⇒ n² odd</text>\n<text fill=\"#6eb5ff\" font-size=\"14\" x=\"24\" y=\"65\">a²=2b² ⇒ a² even ⇒ a even ⇒ a=2k</text>\n<text fill=\"#fbbf24\" font-size=\"14\" x=\"24\" y=\"95\">⇒ b²=2k² ⇒ b is even ⇒ contradicts the conventional contract</text>\n</svg></div>\n<p>Use unique decomposition: the exponent of 2 in a² is even, and the exponent of 2b² is odd, which is a contradiction. Can be generalized to √m (m is non-square).</p>\n</div>", "deep": "\n<h3>Use the only decomposed version</h3>\n<p>a²=2b². Compare the exponents of the prime factor 2 on both sides: the left is even (squared), the right = 1 + (the exponent of 2 in b²) is odd. contradiction.</p>\n<h3>promotion</h3>\n<p>For positive integers m that are not perfectly square, √m is irrational: similarly a² = m b², given some prime number with an odd exponent in m.</p>\n<h3>Geometry version (infinite descent)</h3>\n<p>If the waist and hypotenuse of an isosceles right triangle are commensurable, smaller commensurable triangles of the same type can be constructed, infinitely decreasing - contradicting \"positive integers cannot become infinitely small\".</p>\n", "why": "\n<p>Forcing us to accept \"irrational numbers\". Without it, subsequent real numbers and calculus would not be stable.</p>\n", "try": "\n<ul>\n<li>Go through the proof steps: Assume that √2=a/b is reduced, and it follows that a and b are both even numbers - a contradiction.</li>\n<li>Try squaring a few fractions to see which one is closest to 2, but it's always a little closer.</li>\n</ul>\n"}}, {"id": "euler-polyhedron", "field": "math", "difficulty": "medium", "emoji": "🎲", "iconClass": "purple", "related": ["four-color", "pick", "kakeya", "gauss-bonnet", "euler-bridges"], "__i18n": {"zh": {"id": "euler-polyhedron", "title": "欧拉公式 V − E + F = 2", "subtitle": "数角、数边、数面，有个固定关系", "emoji": "🎲", "iconClass": "purple", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["拓扑", "几何", "欧拉"], "era": "1750 年代", "oneLiner": "凸多面体：顶点数 − 棱数 + 面数，算完永远是 2。换足球、金字塔都一样。", "people": [{"role": "系统研究", "name": "莱昂哈德·欧拉", "years": "1707–1783"}, {"role": "严格化与拓扑视角", "name": "柯西、庞加莱等", "years": "19–20 世纪"}], "related": ["four-color", "pick", "kakeya", "gauss-bonnet", "euler-bridges"], "sections": {"story": "\n        <p>拿骰子（立方体）：8 个角、12 条棱、6 个面。算 8−12+6=2。金字塔、足球缝线多面体……只要中间没洞、表面像气球，答案总是 2。</p>\n        <p>欧拉发现：形状可以变，这个数字雷打不动。后来知道它其实是在说「球面」的拓扑身份证。</p>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>凸多面体顶点数减棱数加面数，永远等于 2。</p>\n        <div class=\"formula\" data-latex=\"V-E+F=2\"></div>\n        <p><span data-latex=\"V\">V</span> 顶点，<span data-latex=\"E\">E</span> 棱，<span data-latex=\"F\">F</span> 面（含底面）。</p>\n      ", "setup": "\n        <div class=\"def-box\">\n          <div class=\"def-title\">假设（教学版）</div>\n          <ul>\n            <li>每个面是与圆盘同胚的多边形；</li>\n            <li>任意两面至多共一条棱；每条棱恰属两个面；</li>\n            <li>多面体「实心」同胚于球（无洞，非环面）。</li>\n          </ul>\n        </div>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">握手引理（平面图）</div>\n          <p>∑_面 (面的边数) = 2E。因为每条棱被两个面各数一次。</p>\n        </div>\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">顶点度数和</div>\n          <p>∑_v deg(v) = 2E。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>把多面体拆平、三角化，每步保持「V−E+F」不变，最后化到最简单情况直接数出 2。</p>\n        <div class=\"proof-nav\"><span>去面摊平</span><span>树形收缩</span><span>χ 不变</span></div>\n        <p><strong>证明（柯西风格的组合版，细化）。</strong></p>\n        <ol class=\"steps\">\n          <li><strong>去掉一个面：</strong>把多面体表面其余部分「压平」成平面连通图 G，外轮廓是被去掉那面的边界。此时平面区域数（有界面）F′=F−1，而 V,E 不变。目标变为证 V−E+F′=1。</li>\n          <li><strong>三角剖分：</strong>在每个面（含可能的非三角面）加对角线，不改变 V，每加一条对角线 E 与 F′ 各 +1，故 V−E+F′ 不变。可设所有有界面都是三角形，且外边界是简单多边形。</li>\n          <li><strong>逐步删三角形：</strong>\n            <ul class=\"substeps\">\n              <li>若某三角形有一条边在外边界、另两边在内部：删去该三角形的「外棱」及外顶点的方式需分类；标准教材采用：删去一个有且仅有一边在边界上的三角形时，E−1，F′−1，V 不变，χ 不变；或删去有两边在边界的「耳朵」时 V−1,E−2,F′−1，χ 仍不变。</li>\n              <li>重复直到只剩一个三角形：此时 V=3,E=3,F′=1，V−E+F′=1。</li>\n            </ul>\n          </li>\n          <li>故原式 V−E+(F−1)=1，即 <strong>V−E+F=2</strong>。</li>\n        </ol>\n        <p class=\"qed\">∎</p>\n        <div class=\"idea-box\">关键是：允许的手术保持 χ=V−E+F 不变，而最终物体的 χ 可直接数出来。</div>\n      ", "deep": "\n        <h3>用双计数直接推立方体类型不等式</h3>\n        <p>由 2E ≥ 3F（每面至少 3 边）及 2E ≥ 3V（每顶点至少 3 棱），结合 V−E+F=2，可推 E ≤ 3V−6（V≥3 的简单平面图）。这是四色定理与平面图理论的基本不等式。</p>\n        <h3>环面</h3>\n        <p>轮胎面 χ=0：例如适当的矩形网格识别对边后 V−E+F=0。洞的个数（亏格 g）满足 χ=2−2g。</p>\n      ", "why": "\n        <p>不看长短，只看「怎么连在一起」——拓扑学入门钥匙。足球为什么是五边形配六边形，也能用它约束。</p>\n      ", "try": "\n        <ul>\n          <li>数家里纸箱、金字塔摆件的 V、E、F，验证是不是 2。</li>\n          <li>甜甜圈（中间有洞）为什么不是 2？值得想一想。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "euler-polyhedron", "title": "Euler's formula V − E + F = 2", "subtitle": "There is a fixed relationship between counting angles, counting sides, and counting faces.", "emoji": "🎲", "iconClass": "purple", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["Topology", "geometry", "Euler"], "era": "1750s", "oneLiner": "Convex polyhedron: number of vertices − number of edges + number of faces, which is always 2. It's the same if it's a football or a pyramid.", "people": [{"role": "Systematic research", "name": "Leonhard Euler", "years": "1707–1783"}, {"role": "Rigorous and topological perspectives", "name": "Cauchy, Poincaré, etc.", "years": "19th–20th century"}], "related": ["four-color", "pick", "kakeya", "gauss-bonnet", "euler-bridges"], "sections": {"story": "\n<p>Take the dice (cube): 8 corners, 12 edges, 6 faces. Calculate 8−12+6=2. Pyramids, football stitch polyhedra... as long as there are no holes in the middle and the surface looks like a balloon, the answer is always 2.</p>\n<p>Euler discovered: the shape can be changed, but this number is unshakable. Later I learned that it was actually talking about the \"spherical\" topological ID card.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>The number of vertices of a convex polyhedron minus the number of edges plus the number of faces is always equal to 2.</p>\n<div class=\"formula\" data-latex=\"V-E+F=2\"></div>\n<p><span data-latex=\"V\">V</span> vertex,<span data-latex=\"E\">E</span> edge,<span data-latex=\"F\">F</span> surface (including bottom surface).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Hypothesis (Teaching Edition)</div>\n<ul>\n<li>Each face is a polygon that is homeomorphic to the disk;</li>\n<li>Any two faces have at most one edge in common; each edge belongs to exactly two faces;</li>\n<li>The polyhedron is \"solid\" homeomorphic to the sphere (no holes, no torus).</li>\n</ul>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Handshake Lemma (Plan View)</div>\n<p>∑_face (number of sides of face) = 2E. Because each edge is counted once by two faces.</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">vertex degree sum</div>\n<p>∑_v deg(v) = 2E。</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Flatten and triangulate the polyhedron, keeping \"V-E+F\" unchanged at each step, and finally count 2 directly in the simplest case.</p>\n<div class=\"proof-nav\"><span>Flatten the noodles</span><span>tree shrink</span><span>χ remains unchanged</span></div>\n<p><strong>Proof (Cauchy-style combined version, refined).</strong></p>\n<ol class=\"steps\">\n<li><strong>Remove a face:</strong>The remaining part of the polyhedron surface is \"flattened\" into a planar connected graph G, and the outer contour is the boundary of the removed face. At this time, the number of plane areas (with interfaces) F′=F−1, while V and E remain unchanged. The goal becomes to prove that V−E+F′=1.</li>\n<li><strong>Triangulation:</strong>Add a diagonal to each surface (including possible non-triangular surfaces) without changing V. Each time a diagonal is added, E and F′ each increase by 1, so V−E+F′ remains unchanged. It can be assumed that all interfaces are triangles and the outer boundaries are simple polygons.</li>\n<li><strong>Delete triangles step by step:</strong>\n<ul class=\"substeps\">\n<li>If a triangle has one side on the outer boundary and the other two sides on the inside: the method of deleting the \"outer edges\" and outer vertices of the triangle needs to be classified; the standard textbook adopts: when deleting a triangle with one and only one side on the boundary, E−1, F′−1, V remains unchanged, and χ remains unchanged; or when deleting the \"ears\" with two sides on the boundary, V−1, E−2, F′−1, and χ remain unchanged.</li>\n<li>Repeat until only one triangle remains: now V=3,E=3,F′=1, V−E+F′=1.</li>\n</ul>\n</li>\n<li>Therefore, the original formula V−E+(F−1)=1, that is <strong>V−E+F=2</strong>。</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div class=\"idea-box\">The key is: the allowed operations remain constant χ=V−E+F, and the χ of the final object can be directly counted.</div>\n", "deep": "\n<h3>Use double counting to push cube type inequalities directly</h3>\n<p>From 2E ≥ 3F (at least 3 edges per face) and 2E ≥ 3V (at least 3 edges per vertex), combined with V−E+F=2, it can be deduced that E ≤ 3V−6 (a simple planar graph with V ≥ 3). This is the basic inequality of the four-color theorem and plane graph theory.</p>\n<h3>torus</h3>\n<p>Tread χ=0: e.g. a proper rectangular grid identifies opposite sides after V−E+F=0. The number of holes (genus g) satisfies χ=2−2g.</p>\n", "why": "\n<p>Don't look at length, just look at \"how they are connected together\" - the key to entry into topology. Why is football a pentagon and a hexagon? It can also be constrained by it.</p>\n", "try": "\n<ul>\n<li>Count V, E, and F on cardboard boxes and pyramid ornaments at home to verify whether they are 2.</li>\n<li>Why not 2 for donuts (with holes in the middle)? It's worth thinking about.</li>\n</ul>\n"}, "field": "math"}}, "title": "Euler's formula V − E + F = 2", "subtitle": "There is a fixed relationship between counting angles, counting sides, and counting faces.", "difficultyLabel": "Spend some time thinking", "tags": ["Topology", "geometry", "Euler"], "era": "1750s", "oneLiner": "Convex polyhedron: number of vertices − number of edges + number of faces, which is always 2. It's the same if it's a football or a pyramid.", "people": [{"role": "Systematic research", "name": "Leonhard Euler", "years": "1707–1783"}, {"role": "Rigorous and topological perspectives", "name": "Cauchy, Poincaré, etc.", "years": "19th–20th century"}], "sections": {"story": "\n<p>Take the dice (cube): 8 corners, 12 edges, 6 faces. Calculate 8−12+6=2. Pyramids, football stitch polyhedra... as long as there are no holes in the middle and the surface looks like a balloon, the answer is always 2.</p>\n<p>Euler discovered: the shape can be changed, but this number is unshakable. Later I learned that it was actually talking about the \"spherical\" topological ID card.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>The number of vertices of a convex polyhedron minus the number of edges plus the number of faces is always equal to 2.</p>\n<div class=\"formula\" data-latex=\"V-E+F=2\"></div>\n<p><span data-latex=\"V\">V</span> vertex,<span data-latex=\"E\">E</span> edge,<span data-latex=\"F\">F</span> surface (including bottom surface).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Hypothesis (Teaching Edition)</div>\n<ul>\n<li>Each face is a polygon that is homeomorphic to the disk;</li>\n<li>Any two faces have at most one edge in common; each edge belongs to exactly two faces;</li>\n<li>The polyhedron is \"solid\" homeomorphic to the sphere (no holes, no torus).</li>\n</ul>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Handshake Lemma (Plan View)</div>\n<p>∑_face (number of sides of face) = 2E. Because each edge is counted once by two faces.</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">vertex degree sum</div>\n<p>∑_v deg(v) = 2E。</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Flatten and triangulate the polyhedron, keeping \"V-E+F\" unchanged at each step, and finally count 2 directly in the simplest case.</p>\n<div class=\"proof-nav\"><span>Flatten the noodles</span><span>tree shrink</span><span>χ remains unchanged</span></div>\n<p><strong>Proof (Cauchy-style combined version, refined).</strong></p>\n<ol class=\"steps\">\n<li><strong>Remove a face:</strong>The remaining part of the polyhedron surface is \"flattened\" into a planar connected graph G, and the outer contour is the boundary of the removed face. At this time, the number of plane areas (with interfaces) F′=F−1, while V and E remain unchanged. The goal becomes to prove that V−E+F′=1.</li>\n<li><strong>Triangulation:</strong>Add a diagonal to each surface (including possible non-triangular surfaces) without changing V. Each time a diagonal is added, E and F′ each increase by 1, so V−E+F′ remains unchanged. It can be assumed that all interfaces are triangles and the outer boundaries are simple polygons.</li>\n<li><strong>Delete triangles step by step:</strong>\n<ul class=\"substeps\">\n<li>If a triangle has one side on the outer boundary and the other two sides on the inside: the method of deleting the \"outer edges\" and outer vertices of the triangle needs to be classified; the standard textbook adopts: when deleting a triangle with one and only one side on the boundary, E−1, F′−1, V remains unchanged, and χ remains unchanged; or when deleting the \"ears\" with two sides on the boundary, V−1, E−2, F′−1, and χ remain unchanged.</li>\n<li>Repeat until only one triangle remains: now V=3,E=3,F′=1, V−E+F′=1.</li>\n</ul>\n</li>\n<li>Therefore, the original formula V−E+(F−1)=1, that is <strong>V−E+F=2</strong>。</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div class=\"idea-box\">The key is: the allowed operations remain constant χ=V−E+F, and the χ of the final object can be directly counted.</div>\n", "deep": "\n<h3>Use double counting to push cube type inequalities directly</h3>\n<p>From 2E ≥ 3F (at least 3 edges per face) and 2E ≥ 3V (at least 3 edges per vertex), combined with V−E+F=2, it can be deduced that E ≤ 3V−6 (a simple planar graph with V ≥ 3). This is the basic inequality of the four-color theorem and plane graph theory.</p>\n<h3>torus</h3>\n<p>Tread χ=0: e.g. a proper rectangular grid identifies opposite sides after V−E+F=0. The number of holes (genus g) satisfies χ=2−2g.</p>\n", "why": "\n<p>Don't look at length, just look at \"how they are connected together\" - the key to entry into topology. Why is football a pentagon and a hexagon? It can also be constrained by it.</p>\n", "try": "\n<ul>\n<li>Count V, E, and F on cardboard boxes and pyramid ornaments at home to verify whether they are 2.</li>\n<li>Why not 2 for donuts (with holes in the middle)? It's worth thinking about.</li>\n</ul>\n"}}, {"id": "ftc", "field": "math", "difficulty": "medium", "emoji": "∫", "iconClass": "green", "related": ["ivt", "euler-identity", "mvt", "taylor", "sandwich"], "__i18n": {"zh": {"id": "ftc", "title": "微积分基本定理", "subtitle": "速度表和里程表，其实在说同一件事", "emoji": "∫", "iconClass": "green", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["微积分", "牛顿", "莱布尼茨"], "era": "17 世纪创立；19 世纪严格化", "oneLiner": "「此刻有多快」和「一共走了多远」是一对反操作：一个求导，一个积分。", "people": [{"role": "创立", "name": "牛顿、莱布尼茨", "years": "17 世纪"}, {"role": "严格化", "name": "柯西、黎曼等", "years": "19 世纪"}], "related": ["ivt", "euler-identity", "mvt", "taylor", "sandwich"], "sections": {"story": "\n        <p>开车时：速度表看「现在多快」（变化率），里程表看「总共多远」（累积）。微积分基本定理说：里程就是速度一点点加起来；速度就是里程的变化快慢。</p>\n        <p>牛顿、莱布尼茨把这两套问题焊成一套语言，近代科学才真正起飞。</p>\n        <div class=\"fun-box\"><strong>一句话：</strong>积分是「加总」，导数是「看陡」；基本定理说它们互为逆运算，像加减、像乘除。</div>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>「此刻有多快」和「一共走了多远」是一对反操作。</p>\n        <p>设 <span data-latex=\"f\">f</span> 在 <span data-latex=\"[a,b]\">[a,b]</span> 上连续。定义</p>\n        <div class=\"formula\" data-latex=\"A(x)=\\int_a^x f(t)\\,dt\"></div>\n        <p><strong>FTC-1：</strong></p>\n        <div class=\"formula\" data-latex=\"A'(x)=f(x)\"></div>\n        <p><strong>FTC-2：</strong>若 <span data-latex=\"F'=f\">F'=f</span>，则</p>\n        <div class=\"formula\" data-latex=\"\\int_a^b f(x)\\,dx=F(b)-F(a)\"></div>\n      ", "setup": "\n        <div class=\"def-box\">\n          <div class=\"def-title\">黎曼积分直觉</div>\n          <p>把 <span data-latex=\"[a,b]\">[a,b]</span> 分成小段，作上和/下和；当网径 <span data-latex=\"\\to 0\">→0</span> 时上下和趋于同一极限，则称可积，极限为定积分。连续函数在闭区间上可积。</p>\n        </div>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理（积分中值不等式）</div>\n          <p>若 <span data-latex=\"m\\le f(t)\\le M\">m≤f(t)≤M</span> 在 <span data-latex=\"[x,x+h]\">[x,x+h]</span> 上，则（<span data-latex=\"h\\gt 0\">h>0</span>）</p>\n          <div class=\"calc-line\" data-latex=\"mh \\le \\int_x^{x+h} f(t)\\,dt \\le Mh\"></div>\n        </div>\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理（连续函数局部几乎常值）</div>\n          <p><span data-latex=\"f\">f</span> 在 <span data-latex=\"x_0\">x₀</span> 连续 <span data-latex=\"\\Rightarrow\">⇒</span> 对任意 <span data-latex=\"\\varepsilon\\gt 0\">ε>0</span>，存在 <span data-latex=\"\\delta\\gt 0\">δ>0</span>，当 <span data-latex=\"|t-x_0|\\lt \\delta\">|t−x₀|lt δ</span> 时 <span data-latex=\"|f(t)-f(x_0)|\\lt \\varepsilon\">|f(t)−f(x₀)|lt ε</span>。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>面积函数 A(x) 在 x 处「多长出来的细条」高度约等于 f(x)，所以 A 的变化率就是 f。</p><div class=\"interactive\" data-widget=\"ftc-area\"></div>\n        <div class=\"proof-nav\"><span>FTC-1</span><span>差商夹逼</span><span>FTC-2 望远镜</span></div>\n        <h3>证明 FTC-1</h3>\n        <ol class=\"steps\">\n          <li>固定 <span data-latex=\"x\\in(a,b)\">x∈(a,b)</span>，取 <span data-latex=\"h\">h</span> 使 <span data-latex=\"x+h\\in[a,b]\">x+h∈[a,b]</span>，<span data-latex=\"h\\ne 0\">h≠0</span>。则\n            <div class=\"calc-line\" data-latex=\"A(x+h)-A(x)=\\int_x^{x+h} f(t)\\,dt\"></div>\n          </li>\n          <li>差商：\n            <div class=\"calc-line\" data-latex=\"\\dfrac{A(x+h)-A(x)}{h}=\\dfrac{1}{h}\\int_x^{x+h} f(t)\\,dt\"></div>\n          </li>\n          <li>由连续性：对 <span data-latex=\"\\varepsilon\\gt 0\">ε>0</span>，取 <span data-latex=\"\\delta\">δ</span> 使 <span data-latex=\"|t-x|\\lt \\delta\\Rightarrow|f(t)-f(x)|\\lt \\varepsilon\">|t−x|lt δ⇒|f(t)−f(x)|lt ε</span>。当 <span data-latex=\"0\\lt |h|\\lt \\delta\">0lt |h|lt δ</span> 时，在积分区间上\n            <div class=\"calc-line\" data-latex=\"f(x)-\\varepsilon \\lt f(t) \\lt f(x)+\\varepsilon\"></div>\n            用引理积分并除以 <span data-latex=\"h\">h</span>（注意 <span data-latex=\"h\\lt 0\">hlt 0</span> 时不等式方向与除法，最终同样得到）\n            <div class=\"calc-line\" data-latex=\"f(x)-\\varepsilon \\lt \\dfrac{A(x+h)-A(x)}{h} \\lt f(x)+\\varepsilon\"></div>\n          </li>\n          <li>故差商当 <span data-latex=\"h\\to 0\">h→0</span> 时趋于 <span data-latex=\"f(x)\">f(x)</span>。即\n            <div class=\"calc-line\" data-latex=\"A'(x)=f(x)\"></div>\n          </li>\n        </ol>\n        <h3>证明 FTC-2</h3>\n        <ol class=\"steps\">\n          <li>设 <span data-latex=\"F'=f\">F'=f</span>。考虑 <span data-latex=\"G(x)=A(x)-F(x)\">G(x)=A(x)−F(x)</span>。则 <span data-latex=\"G'=f-f=0\">G'=0</span>，故 <span data-latex=\"G\">G</span> 为常数。</li>\n          <li><span data-latex=\"G(a)=A(a)-F(a)=-F(a)\">G(a)=−F(a)</span>，故 <span data-latex=\"G(x)=-F(a)\">G(x)=−F(a)</span>，即 <span data-latex=\"A(x)=F(x)-F(a)\">A(x)=F(x)−F(a)</span>。</li>\n          <li>令 <span data-latex=\"x=b\">x=b</span>：\n            <div class=\"calc-line\" data-latex=\"\\int_a^b f=F(b)-F(a)\"></div>\n          </li>\n        </ol>\n        <p class=\"qed\">∎</p>\n      <div data-more-detail>\n    <h3>差商夹逼（细节重述）</h3>\n    <div class=\"calc-line\" data-latex=\"f(x)-\\varepsilon \\le [A(x+h)-A(x)]/h \\le f(x)+\\varepsilon （|h| \\text{充分小}）\"></div>\n    <p>令 h→0 得 A'(x)=f(x)。直观：x 处「长出」的薄条面积 ≈ 高 f(x)×宽 h。</p>\n    </div>", "deep": "\n        <h3>为什么 F'=0 ⇒ F 常数？</h3>\n        <p>用中值定理：对 x₁lt x₂，存在 ξ 使 F(x₂)−F(x₁)=F'(ξ)(x₂−x₁)=0。无需中值定理时，可用「上确界论证」或直接从导数定义控制增量。</p>\n        <h3>不连续的情况</h3>\n        <p>若 f 仅黎曼可积而不连续，A 仍几乎处处可导且 A'=f a.e.（勒贝格理论）。教学中连续已足够。</p>\n        <h3>换元与分部的来源</h3>\n        <p>链式法则 + FTC ⇒ 换元公式；乘积法则 + FTC ⇒ 分部积分。</p>\n      ", "why": "\n        <p>物理、工程、经济、机器学习里，几乎所有「连续变化」的计算都靠它。没有它，微积分只是两堆互不相干的技巧。</p>\n      ", "try": "\n        <ul>\n          <li>f=2x 时，从 0 积到 x 的面积是 x²，再求导应回到 2x——自己验算。</li>\n          <li>看手机计步：每分钟步数像「导数」，总步数像「积分」。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "ftc", "title": "Fundamental Theorem of Calculus", "subtitle": "Speedometer and odometer are actually saying the same thing", "emoji": "∫", "iconClass": "green", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["Calculus", "newton", "Leibniz"], "era": "Founded in the 17th century; stricted in the 19th century", "oneLiner": "\"How fast is it now\" and \"how far has it traveled in total\" are a pair of inverse operations: one is derivation and the other is integral.", "people": [{"role": "Founded", "name": "Newton, Leibniz", "years": "17th century"}, {"role": "strict", "name": "Cauchy, Riemann, etc.", "years": "19th century"}], "related": ["ivt", "euler-identity", "mvt", "taylor", "sandwich"], "sections": {"story": "\n<p>When driving: The speedometer looks at \"how fast it is now\" (rate of change), and the odometer looks at \"how far in total\" (accumulation). The basic theorem of calculus says: mileage is the sum of speed bit by bit; speed is the speed of change of mileage.</p>\n<p>Newton and Leibniz welded these two sets of questions into one language, and modern science really took off.</p>\n<div class=\"fun-box\"><strong>In one sentence:</strong>Integral is \"adding up\" and derivative is \"seeing steepness\"; the basic theorem says that they are inverse operations of each other, like addition, subtraction, multiplication and division.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>\"How fast is it now\" and \"how far have we traveled in total\" are a pair of opposite operations.</p>\n<p>set up <span data-latex=\"f\">f</span> exist <span data-latex=\"[a,b]\">[a,b]</span> on continuous. definition</p>\n<div class=\"formula\" data-latex=\"A(x)=\\int_a^x f(t)\\,dt\"></div>\n<p><strong>FTC-1：</strong></p>\n<div class=\"formula\" data-latex=\"A'(x)=f(x)\"></div>\n<p><strong>FTC-2：</strong>like <span data-latex=\"F'=f\">F'=f</span>,but</p>\n<div class=\"formula\" data-latex=\"\\int_a^b f(x)\\,dx=F(b)-F(a)\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Riemann integral intuition</div>\n<p>Bundle <span data-latex=\"[a,b]\">[a,b]</span> Divide it into small sections and make upper and lower sums; when the network diameter <span data-latex=\"\\to 0\">→0</span> When the upper and lower sums tend to the same limit, it is said to be integrable, and the limit is a definite integral. Continuous functions are integrable on closed intervals.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (Integral Mean Inequality)</div>\n<p>like <span data-latex=\"m\\le f(t)\\le M\">m≤f(t)≤M</span> exist <span data-latex=\"[x,x+h]\">[x,x+h]</span> above, then (<span data-latex=\"h\\gt 0\">h&gt;0</span>）</p>\n<div class=\"calc-line\" data-latex=\"mh \\le \\int_x^{x+h} f(t)\\,dt \\le Mh\"></div>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (continuous functions are locally almost constant)</div>\n<p><span data-latex=\"f\">f</span> exist <span data-latex=\"x_0\">x₀</span> continuous <span data-latex=\"\\Rightarrow\">⇒</span> to any <span data-latex=\"\\varepsilon\\gt 0\">ε&gt;0</span>,exist <span data-latex=\"\\delta\\gt 0\">δ&gt;0</span>,when <span data-latex=\"|t-x_0|\\lt \\delta\">|t−x₀|lt δ</span> hour <span data-latex=\"|f(t)-f(x_0)|\\lt \\varepsilon\">|f(t)−f(x₀)|lt ε</span>。</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>The height of the \"thin strip\" of the area function A(x) at x is approximately equal to f(x), so the rate of change of A is f.</p><div class=\"interactive\" data-widget=\"ftc-area\"></div>\n<div class=\"proof-nav\"><span>FTC-1</span><span>Bad businessmen pinched</span><span>FTC-2 telescope</span></div>\n<h3>Certification FTC-1</h3>\n<ol class=\"steps\">\n<li>fixed <span data-latex=\"x\\in(a,b)\">x∈(a,b)</span>,Pick <span data-latex=\"h\">h</span> make <span data-latex=\"x+h\\in[a,b]\">x+h∈[a,b]</span>，<span data-latex=\"h\\ne 0\">h≠0</span>. but\n            <div class=\"calc-line\" data-latex=\"A(x+h)-A(x)=\\int_x^{x+h} f(t)\\,dt\"></div>\n</li>\n<li>Difference quotient:\n            <div class=\"calc-line\" data-latex=\"\\dfrac{A(x+h)-A(x)}{h}=\\dfrac{1}{h}\\int_x^{x+h} f(t)\\,dt\"></div>\n</li>\n<li>by continuity: right <span data-latex=\"\\varepsilon\\gt 0\">ε&gt;0</span>,Pick <span data-latex=\"\\delta\">δ</span> make <span data-latex=\"|t-x|\\lt \\delta\\Rightarrow|f(t)-f(x)|\\lt \\varepsilon\">|t−x|lt δ⇒|f(t)−f(x)|lt ε</span>. when <span data-latex=\"0\\lt |h|\\lt \\delta\">0lt |h|lt δ</span> when, on the integration interval\n            <div class=\"calc-line\" data-latex=\"f(x)-\\varepsilon \\lt f(t) \\lt f(x)+\\varepsilon\"></div>\n            Integrate using the lemma and divide by <span data-latex=\"h\">h</span>(Notice <span data-latex=\"h\\lt 0\">hlt 0</span> When the direction of inequality and division, we finally get the same)\n            <div class=\"calc-line\" data-latex=\"f(x)-\\varepsilon \\lt \\dfrac{A(x+h)-A(x)}{h} \\lt f(x)+\\varepsilon\"></div>\n</li>\n<li>Therefore, the businessman should <span data-latex=\"h\\to 0\">h→0</span> tend to <span data-latex=\"f(x)\">f(x)</span>. Right now\n            <div class=\"calc-line\" data-latex=\"A'(x)=f(x)\"></div>\n</li>\n</ol>\n<h3>Certification FTC-2</h3>\n<ol class=\"steps\">\n<li>set up <span data-latex=\"F'=f\">F'=f</span>. consider <span data-latex=\"G(x)=A(x)-F(x)\">G(x)=A(x)−F(x)</span>. but <span data-latex=\"G'=f-f=0\">G'=0</span>, so <span data-latex=\"G\">G</span> is a constant.</li>\n<li><span data-latex=\"G(a)=A(a)-F(a)=-F(a)\">G(a)=−F(a)</span>, so <span data-latex=\"G(x)=-F(a)\">G(x)=−F(a)</span>,Right now <span data-latex=\"A(x)=F(x)-F(a)\">A(x)=F(x)−F(a)</span>。</li>\n<li>make <span data-latex=\"x=b\">x=b</span>：\n            <div class=\"calc-line\" data-latex=\"\\int_a^b f=F(b)-F(a)\"></div>\n</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>Bad businessmen pinched each other (details recounted)</h3>\n<div class=\"calc-line\" data-latex=\"f(x)-\\varepsilon \\le [A(x+h)-A(x)]/h \\le f(x)+\\varepsilon （|h| \\text{充分小}）\"></div>\n<p>Let h→0 get A'(x)=f(x). Intuitively: the area of ​​the thin strip that \"grows out\" at x ≈ height f(x)×width h.</p>\n</div>", "deep": "\n<h3>Why F'=0 ⇒ F constant?</h3>\n<p>Use the mean value theorem: for x₁lt x₂, there exists ξ such that F(x₂)−F(x₁)=F'(ξ)(x₂−x₁)=0. When there is no need for the mean value theorem, the \"superb bound argument\" can be used or the control increment can be defined directly from the derivative.</p>\n<h3>Discontinuity</h3>\n<p>If f is only Riemannian integrable but not continuous, A is still differentiable almost everywhere and A'=f a.e. (Lebesgue's theory). Continuity is enough in teaching.</p>\n<h3>Sources of dollar exchanges and divisions</h3>\n<p>Chain rule + FTC ⇒ Substitution formula; Product rule + FTC ⇒ Integral by parts.</p>\n", "why": "\n<p>Almost all \"continuously changing\" calculations in physics, engineering, economics, and machine learning rely on it. Without it, calculus is just a bunch of unrelated techniques.</p>\n", "try": "\n<ul>\n<li>When f=2x, the area from 0 to x is x², and then the derivation should return to 2x - check it yourself.</li>\n<li>Look at the pedometer on your mobile phone: the number of steps per minute is like a \"derivative\" and the total number of steps is like an \"integral\".</li>\n</ul>\n"}, "field": "math"}}, "title": "Fundamental Theorem of Calculus", "subtitle": "Speedometer and odometer are actually saying the same thing", "difficultyLabel": "Spend some time thinking", "tags": ["Calculus", "newton", "Leibniz"], "era": "Founded in the 17th century; stricted in the 19th century", "oneLiner": "\"How fast is it now\" and \"how far has it traveled in total\" are a pair of inverse operations: one is derivation and the other is integral.", "people": [{"role": "Founded", "name": "Newton, Leibniz", "years": "17th century"}, {"role": "strict", "name": "Cauchy, Riemann, etc.", "years": "19th century"}], "sections": {"story": "\n<p>When driving: The speedometer looks at \"how fast it is now\" (rate of change), and the odometer looks at \"how far in total\" (accumulation). The basic theorem of calculus says: mileage is the sum of speed bit by bit; speed is the speed of change of mileage.</p>\n<p>Newton and Leibniz welded these two sets of questions into one language, and modern science really took off.</p>\n<div class=\"fun-box\"><strong>In one sentence:</strong>Integral is \"adding up\" and derivative is \"seeing steepness\"; the basic theorem says that they are inverse operations of each other, like addition, subtraction, multiplication and division.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>\"How fast is it now\" and \"how far have we traveled in total\" are a pair of opposite operations.</p>\n<p>set up <span data-latex=\"f\">f</span> exist <span data-latex=\"[a,b]\">[a,b]</span> on continuous. definition</p>\n<div class=\"formula\" data-latex=\"A(x)=\\int_a^x f(t)\\,dt\"></div>\n<p><strong>FTC-1：</strong></p>\n<div class=\"formula\" data-latex=\"A'(x)=f(x)\"></div>\n<p><strong>FTC-2：</strong>like <span data-latex=\"F'=f\">F'=f</span>,but</p>\n<div class=\"formula\" data-latex=\"\\int_a^b f(x)\\,dx=F(b)-F(a)\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Riemann integral intuition</div>\n<p>Bundle <span data-latex=\"[a,b]\">[a,b]</span> Divide it into small sections and make upper and lower sums; when the network diameter <span data-latex=\"\\to 0\">→0</span> When the upper and lower sums tend to the same limit, it is said to be integrable, and the limit is a definite integral. Continuous functions are integrable on closed intervals.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (Integral Mean Inequality)</div>\n<p>like <span data-latex=\"m\\le f(t)\\le M\">m≤f(t)≤M</span> exist <span data-latex=\"[x,x+h]\">[x,x+h]</span> above, then (<span data-latex=\"h\\gt 0\">h&gt;0</span>）</p>\n<div class=\"calc-line\" data-latex=\"mh \\le \\int_x^{x+h} f(t)\\,dt \\le Mh\"></div>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (continuous functions are locally almost constant)</div>\n<p><span data-latex=\"f\">f</span> exist <span data-latex=\"x_0\">x₀</span> continuous <span data-latex=\"\\Rightarrow\">⇒</span> to any <span data-latex=\"\\varepsilon\\gt 0\">ε&gt;0</span>,exist <span data-latex=\"\\delta\\gt 0\">δ&gt;0</span>,when <span data-latex=\"|t-x_0|\\lt \\delta\">|t−x₀|lt δ</span> hour <span data-latex=\"|f(t)-f(x_0)|\\lt \\varepsilon\">|f(t)−f(x₀)|lt ε</span>。</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>The height of the \"thin strip\" of the area function A(x) at x is approximately equal to f(x), so the rate of change of A is f.</p><div class=\"interactive\" data-widget=\"ftc-area\"></div>\n<div class=\"proof-nav\"><span>FTC-1</span><span>Bad businessmen pinched</span><span>FTC-2 telescope</span></div>\n<h3>Certification FTC-1</h3>\n<ol class=\"steps\">\n<li>fixed <span data-latex=\"x\\in(a,b)\">x∈(a,b)</span>,Pick <span data-latex=\"h\">h</span> make <span data-latex=\"x+h\\in[a,b]\">x+h∈[a,b]</span>，<span data-latex=\"h\\ne 0\">h≠0</span>. but\n            <div class=\"calc-line\" data-latex=\"A(x+h)-A(x)=\\int_x^{x+h} f(t)\\,dt\"></div>\n</li>\n<li>Difference quotient:\n            <div class=\"calc-line\" data-latex=\"\\dfrac{A(x+h)-A(x)}{h}=\\dfrac{1}{h}\\int_x^{x+h} f(t)\\,dt\"></div>\n</li>\n<li>by continuity: right <span data-latex=\"\\varepsilon\\gt 0\">ε&gt;0</span>,Pick <span data-latex=\"\\delta\">δ</span> make <span data-latex=\"|t-x|\\lt \\delta\\Rightarrow|f(t)-f(x)|\\lt \\varepsilon\">|t−x|lt δ⇒|f(t)−f(x)|lt ε</span>. when <span data-latex=\"0\\lt |h|\\lt \\delta\">0lt |h|lt δ</span> when, on the integration interval\n            <div class=\"calc-line\" data-latex=\"f(x)-\\varepsilon \\lt f(t) \\lt f(x)+\\varepsilon\"></div>\n            Integrate using the lemma and divide by <span data-latex=\"h\">h</span>(Notice <span data-latex=\"h\\lt 0\">hlt 0</span> When the direction of inequality and division, we finally get the same)\n            <div class=\"calc-line\" data-latex=\"f(x)-\\varepsilon \\lt \\dfrac{A(x+h)-A(x)}{h} \\lt f(x)+\\varepsilon\"></div>\n</li>\n<li>Therefore, the businessman should <span data-latex=\"h\\to 0\">h→0</span> tend to <span data-latex=\"f(x)\">f(x)</span>. Right now\n            <div class=\"calc-line\" data-latex=\"A'(x)=f(x)\"></div>\n</li>\n</ol>\n<h3>Certification FTC-2</h3>\n<ol class=\"steps\">\n<li>set up <span data-latex=\"F'=f\">F'=f</span>. consider <span data-latex=\"G(x)=A(x)-F(x)\">G(x)=A(x)−F(x)</span>. but <span data-latex=\"G'=f-f=0\">G'=0</span>, so <span data-latex=\"G\">G</span> is a constant.</li>\n<li><span data-latex=\"G(a)=A(a)-F(a)=-F(a)\">G(a)=−F(a)</span>, so <span data-latex=\"G(x)=-F(a)\">G(x)=−F(a)</span>,Right now <span data-latex=\"A(x)=F(x)-F(a)\">A(x)=F(x)−F(a)</span>。</li>\n<li>make <span data-latex=\"x=b\">x=b</span>：\n            <div class=\"calc-line\" data-latex=\"\\int_a^b f=F(b)-F(a)\"></div>\n</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>Bad businessmen pinched each other (details recounted)</h3>\n<div class=\"calc-line\" data-latex=\"f(x)-\\varepsilon \\le [A(x+h)-A(x)]/h \\le f(x)+\\varepsilon （|h| \\text{充分小}）\"></div>\n<p>Let h→0 get A'(x)=f(x). Intuitively: the area of ​​the thin strip that \"grows out\" at x ≈ height f(x)×width h.</p>\n</div>", "deep": "\n<h3>Why F'=0 ⇒ F constant?</h3>\n<p>Use the mean value theorem: for x₁lt x₂, there exists ξ such that F(x₂)−F(x₁)=F'(ξ)(x₂−x₁)=0. When there is no need for the mean value theorem, the \"superb bound argument\" can be used or the control increment can be defined directly from the derivative.</p>\n<h3>Discontinuity</h3>\n<p>If f is only Riemannian integrable but not continuous, A is still differentiable almost everywhere and A'=f a.e. (Lebesgue's theory). Continuity is enough in teaching.</p>\n<h3>Sources of dollar exchanges and divisions</h3>\n<p>Chain rule + FTC ⇒ Substitution formula; Product rule + FTC ⇒ Integral by parts.</p>\n", "why": "\n<p>Almost all \"continuously changing\" calculations in physics, engineering, economics, and machine learning rely on it. Without it, calculus is just a bunch of unrelated techniques.</p>\n", "try": "\n<ul>\n<li>When f=2x, the area from 0 to x is x², and then the derivation should return to 2x - check it yourself.</li>\n<li>Look at the pedometer on your mobile phone: the number of steps per minute is like a \"derivative\" and the total number of steps is like an \"integral\".</li>\n</ul>\n"}}, {"id": "ivt", "field": "math", "difficulty": "medium", "emoji": "📈", "iconClass": "", "related": ["ftc", "mvt", "fta"], "__i18n": {"zh": {"id": "ivt", "title": "中间值定理", "subtitle": "连续的路，不能瞬移跳过中间值", "emoji": "📈", "iconClass": "", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["分析", "连续", "存在性"], "era": "波尔查诺 1817；柯西等完善", "oneLiner": "连续曲线从负数走到正数，中途一定经过 0——不用公式也能断定「有根」。", "people": [{"role": "早期严格证明", "name": "波尔查诺", "years": "1817"}, {"role": "分析奠基", "name": "柯西、魏尔斯特拉斯", "years": "19 世纪"}], "related": ["ftc", "mvt", "fta"], "sections": {"story": "\n        <p>解方程不一定有求根公式，但若函数连续，左边是负、右边是正，中间就一定有根。这是所有「二分法」数值求根的理论底气。</p>\n        <div class=\"fun-box\"><strong>生活感：</strong>温度从 −3°C 连续升到 5°C，过程中一定经过 0°C——你不可能「跳过去」。</div>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>连续曲线从负走到正，中途必经过 0。</p>\n        <div class=\"formula\" data-latex=\"f\\text{ 连续},\\ f(a)<0<f(b)\\ \\Rightarrow\\ \\exists c\\in(a,b):\\ f(c)=0\"></div>\n        <p>更一般：连续函数取到两端之间的一切中间值。</p>\n      ", "setup": "\n        <div class=\"def-box\">\n          <div class=\"def-title\">实数完备性（要用的形式）</div>\n          <p>ℝ 的<strong>确界原理</strong>：非空有上界的集合有上确界（最小上界）。这是实数区别于有理数的关键性质。</p>\n        </div>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理：连续保持符号</div>\n          <p>若 f 在 c 连续且 f(c)>0，则存在邻域使 f 在该邻域内 >0。（对 lt 0 类似。）</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>在「f≤0 的点」里取最靠右的边界点，连续性能保证这里只能是 0，不能是正也不能是负。</p><div class=\"interactive\" data-widget=\"ivt-bisection\"></div>\n        <div class=\"proof-nav\"><span>集合 S</span><span>取上确界 c</span><span>排除 f(c)≠0</span></div>\n        <ol class=\"steps\">\n          <li>设 f(a)lt 0lt f(b)，f 在 [a,b] 连续。定义\n            <div class=\"calc-line\" data-latex=\"S = { x\\in [a,b] : f \\text{在} [a,x] \\text{上处处} \\le 0 }\"></div>\n            更常用的经典定义：S={x∈[a,b]: f(x)≤0}。此处采用：\n            <div class=\"calc-line\" data-latex=\"S = { x\\in [a,b] : f(x) \\le 0 }\"></div>\n            则 a∈S，S 非空有上界 b，令 c = sup S ∈[a,b]。\n          </li>\n          <li><strong>不能 f(c)gt 0：</strong>若 f(c)>0，由连续，在 c 左侧小邻域 f 仍为正，与 c 是「f≤0 的点」的上确界矛盾（左侧应仍有 S 中的点逼近 c，那些点 f≤0）。更细：存在 δ 使 (c−δ,c+δ) 上 f>0，则 c−δ/2 已是比 c 小的上界，矛盾。</li>\n          <li><strong>不能 f(c)lt 0：</strong>若 f(c)lt 0，则邻域内 flt 0，于是 c 右侧仍有点属于 S，与上确界矛盾。</li>\n          <li>故 f(c)=0。又因 f(a)≠0、f(b)≠0（严格异号），有 c∈(a,b)。</li>\n        </ol>\n        <p class=\"qed\">∎</p>\n        <div class=\"warn-box\">若只在 ℚ 上讨论，「连续」函数 g(x)=x²−2 在有理数上异号但不取 0——完备性不可或缺。</div>\n      <div data-more-detail>\n    <h3>上确界论证的图示要点</h3>\n    <ol class=\"steps\">\n      <li>S={x∈[a,b]: f(x)≤0}，c=sup S。</li>\n      <li>若 f(c)≥0：连续性 ⇒ 左侧一小段 f≥0，与「c 是上确界」矛盾（左侧应有 S 中的点逼近 c）。</li>\n      <li>若 f(c)≤0：右侧一小段 f≤0，c 不是上界。</li>\n      <li>故 f(c)=0。上图二分法给出<strong>可计算</strong>的逼近序列，误差 ≤(b−a)/2ⁿ。</li>\n    </ol>\n    </div>", "deep": "\n        <h3>一般值形式</h3>\n        <p>要证 f 取到 f(a) 与 f(b) 之间的 γ，考虑 h(x)=f(x)−γ，化为过零点问题。</p>\n        <h3>二分法算法</h3>\n        <ol class=\"steps\">\n          <li>若 f(a)f(b)lt 0，取中点 m。(a+b)/2。</li>\n          <li>若 f(m)=0 结束；若 f(a)f(m)lt 0 则改 b:=m，否则 a:=m。</li>\n          <li>区间长度每次减半，由区间套/完备性，唯一极限点即为根（或一串趋于某根）。</li>\n        </ol>\n        <p>误差 ≤ (b−a)/2ⁿ，可明确给出步数。</p>\n      ", "why": "\n        <p>很多「存在性」结论的母亲定理。电脑求根、证明奇次多项式必有实根，都用它。</p>\n      ", "try": "\n        <ul>\n          <li>用上图二分法多点几步，看区间如何锁住根。</li>\n          <li>想：f(x)=1/x 在 −1 到 1 为什么不能套用？（中间断开了。）</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "ivt", "title": "intermediate value theorem", "subtitle": "Continuous roads, cannot teleport to skip intermediate values", "emoji": "📈", "iconClass": "", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["analyze", "continuous", "existence"], "era": "Bolzano 1817; Cauchy et al.", "oneLiner": "When a continuous curve goes from a negative number to a positive number, it must pass through 0 in the middle - it can be concluded that it \"has roots\" without using a formula.", "people": [{"role": "early rigorous proof", "name": "bolzano", "years": "1817"}, {"role": "Analysis foundation", "name": "Cauchy, Weierstrass", "years": "19th century"}], "related": ["ftc", "mvt", "fta"], "sections": {"story": "\n<p>There is not necessarily a root formula to solve an equation, but if the function is continuous, with the left side being negative and the right side being positive, there must be a root in the middle. This is the theoretical basis for all \"dichotomy\" numerical root finding.</p>\n<div class=\"fun-box\"><strong>Sense of life:</strong>When the temperature continuously rises from −3°C to 5°C, it must pass through 0°C in the process - you cannot \"jump over\" it.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>When a continuous curve goes from negative to positive, it must pass through 0 in the middle.</p>\n<div class=\"formula\" data-latex=\"f\\text{ 连续},\\ f(a)&lt;0&lt;f(b)\\ \\Rightarrow\\ \\exists c\\in(a,b):\\ f(c)=0\"></div>\n<p>More generally: a continuous function takes any intermediate value between its two ends.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Real number completeness (form to be used)</div>\n<p>ℝ of<strong>principle of certainty</strong>: A non-empty set with an upper bound has a supremum (minimum upper bound). This is the key property that distinguishes real numbers from rational numbers.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma: Continuity Preserves Symbols</div>\n<p>If f is continuous in c and f(c)&gt;0, then there is a neighborhood such that f &gt;0 in that neighborhood. (Similar to lt 0.)</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Take the rightmost boundary point among the \"points of f≤0\". Continuity guarantees that it can only be 0, not positive or negative.</p><div class=\"interactive\" data-widget=\"ivt-bisection\"></div>\n<div class=\"proof-nav\"><span>Set S</span><span>Take the supremum c</span><span>Exclude f(c)≠0</span></div>\n<ol class=\"steps\">\n<li>Let f(a)lt 0lt f(b), f is continuous in [a,b]. definition\n            <div class=\"calc-line\" data-latex=\"S = { x\\in [a,b] : f \\text{在} [a,x] \\text{上处处} \\le 0 }\"></div>\n            The more commonly used classical definition: S={x∈[a,b]: f(x)≤0}. Used here:\n            <div class=\"calc-line\" data-latex=\"S = { x\\in [a,b] : f(x) \\le 0 }\"></div>\n            Then a∈S, S is non-empty and has an upper bound b, let c = sup S ∈[a,b].\n          </li>\n<li><strong>Cannot f(c)gt 0:</strong>If f(c)&gt;0, by continuity, the small neighborhood f on the left side of c is still positive, which is inconsistent with c being the supremum bound of \"points with f ≤ 0\" (there should still be points in S approaching c on the left side, and those points f ≤ 0). More detailed: There exists δ such that f&gt;0 on (c−δ,c+δ), then c−δ/2 is already an upper bound smaller than c, which is a contradiction.</li>\n<li><strong>Cannot f(c)lt 0:</strong>If f(c)lt 0, then flt 0 in the neighborhood, so the point on the right side of c still belongs to S, which is inconsistent with the supremum.</li>\n<li>Therefore f(c)=0. And because f(a)≠0 and f(b)≠0 (strictly different signs), we have c∈(a,b).</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div class=\"warn-box\">If only discussed on ℚ, the \"continuous\" function g(x)=x²−2 has different signs on rational numbers but does not take 0 - indispensable for completeness.</div>\n<div data-more-detail=\"\">\n<h3>Illustrated key points of the supremacy argument</h3>\n<ol class=\"steps\">\n<li>S={x∈[a,b]: f(x)≤0}，c=sup S。</li>\n<li>If f(c)≥0: Continuity ⇒ A small segment of f≥0 on the left side is inconsistent with \"c is the supremum\" (there should be points in S approaching c on the left side).</li>\n<li>If f(c)≤0: A small segment on the right side is f≤0, and c is not an upper bound.</li>\n<li>Therefore f(c)=0. The dichotomy in the figure above gives<strong>Computable</strong>The approximation sequence of , the error is ≤(b−a)/2ⁿ.</li>\n</ol>\n</div>", "deep": "\n<h3>General value form</h3>\n<p>To prove that f takes γ between f(a) and f(b), consider h(x)=f(x)−γ and turn it into a zero-crossing problem.</p>\n<h3>bisection algorithm</h3>\n<ol class=\"steps\">\n<li>If f(a)f(b)lt 0, take the midpoint m. (a+b)/2.</li>\n<li>If f(m)=0, end; if f(a)f(m)lt 0, change b:=m, otherwise a:=m.</li>\n<li>The length of the interval is halved each time. Due to the set/completeness of the interval, the only limit point is the root (or a string tends to a certain root).</li>\n</ol>\n<p>Error ≤ (b−a)/2ⁿ, the number of steps can be given explicitly.</p>\n", "why": "\n<p>The mother theorem of many \"existence\" conclusions. Computers are used to find roots and prove that odd degree polynomials must have real roots.</p>\n", "try": "\n<ul>\n<li>Use the dichotomy method in the figure above to take a few more steps and see how the interval locks the root.</li>\n<li>Think: Why can’t f(x)=1/x be applied from −1 to 1? (Disconnected in the middle.)</li>\n</ul>\n"}, "field": "math"}}, "title": "intermediate value theorem", "subtitle": "Continuous roads, cannot teleport to skip intermediate values", "difficultyLabel": "Spend some time thinking", "tags": ["analyze", "continuous", "existence"], "era": "Bolzano 1817; Cauchy et al.", "oneLiner": "When a continuous curve goes from a negative number to a positive number, it must pass through 0 in the middle - it can be concluded that it \"has roots\" without using a formula.", "people": [{"role": "early rigorous proof", "name": "bolzano", "years": "1817"}, {"role": "Analysis foundation", "name": "Cauchy, Weierstrass", "years": "19th century"}], "sections": {"story": "\n<p>There is not necessarily a root formula to solve an equation, but if the function is continuous, with the left side being negative and the right side being positive, there must be a root in the middle. This is the theoretical basis for all \"dichotomy\" numerical root finding.</p>\n<div class=\"fun-box\"><strong>Sense of life:</strong>When the temperature continuously rises from −3°C to 5°C, it must pass through 0°C in the process - you cannot \"jump over\" it.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>When a continuous curve goes from negative to positive, it must pass through 0 in the middle.</p>\n<div class=\"formula\" data-latex=\"f\\text{ 连续},\\ f(a)&lt;0&lt;f(b)\\ \\Rightarrow\\ \\exists c\\in(a,b):\\ f(c)=0\"></div>\n<p>More generally: a continuous function takes any intermediate value between its two ends.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Real number completeness (form to be used)</div>\n<p>ℝ of<strong>principle of certainty</strong>: A non-empty set with an upper bound has a supremum (minimum upper bound). This is the key property that distinguishes real numbers from rational numbers.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma: Continuity Preserves Symbols</div>\n<p>If f is continuous in c and f(c)&gt;0, then there is a neighborhood such that f &gt;0 in that neighborhood. (Similar to lt 0.)</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Take the rightmost boundary point among the \"points of f≤0\". Continuity guarantees that it can only be 0, not positive or negative.</p><div class=\"interactive\" data-widget=\"ivt-bisection\"></div>\n<div class=\"proof-nav\"><span>Set S</span><span>Take the supremum c</span><span>Exclude f(c)≠0</span></div>\n<ol class=\"steps\">\n<li>Let f(a)lt 0lt f(b), f is continuous in [a,b]. definition\n            <div class=\"calc-line\" data-latex=\"S = { x\\in [a,b] : f \\text{在} [a,x] \\text{上处处} \\le 0 }\"></div>\n            The more commonly used classical definition: S={x∈[a,b]: f(x)≤0}. Used here:\n            <div class=\"calc-line\" data-latex=\"S = { x\\in [a,b] : f(x) \\le 0 }\"></div>\n            Then a∈S, S is non-empty and has an upper bound b, let c = sup S ∈[a,b].\n          </li>\n<li><strong>Cannot f(c)gt 0:</strong>If f(c)&gt;0, by continuity, the small neighborhood f on the left side of c is still positive, which is inconsistent with c being the supremum bound of \"points with f ≤ 0\" (there should still be points in S approaching c on the left side, and those points f ≤ 0). More detailed: There exists δ such that f&gt;0 on (c−δ,c+δ), then c−δ/2 is already an upper bound smaller than c, which is a contradiction.</li>\n<li><strong>Cannot f(c)lt 0:</strong>If f(c)lt 0, then flt 0 in the neighborhood, so the point on the right side of c still belongs to S, which is inconsistent with the supremum.</li>\n<li>Therefore f(c)=0. And because f(a)≠0 and f(b)≠0 (strictly different signs), we have c∈(a,b).</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div class=\"warn-box\">If only discussed on ℚ, the \"continuous\" function g(x)=x²−2 has different signs on rational numbers but does not take 0 - indispensable for completeness.</div>\n<div data-more-detail=\"\">\n<h3>Illustrated key points of the supremacy argument</h3>\n<ol class=\"steps\">\n<li>S={x∈[a,b]: f(x)≤0}，c=sup S。</li>\n<li>If f(c)≥0: Continuity ⇒ A small segment of f≥0 on the left side is inconsistent with \"c is the supremum\" (there should be points in S approaching c on the left side).</li>\n<li>If f(c)≤0: A small segment on the right side is f≤0, and c is not an upper bound.</li>\n<li>Therefore f(c)=0. The dichotomy in the figure above gives<strong>Computable</strong>The approximation sequence of , the error is ≤(b−a)/2ⁿ.</li>\n</ol>\n</div>", "deep": "\n<h3>General value form</h3>\n<p>To prove that f takes γ between f(a) and f(b), consider h(x)=f(x)−γ and turn it into a zero-crossing problem.</p>\n<h3>bisection algorithm</h3>\n<ol class=\"steps\">\n<li>If f(a)f(b)lt 0, take the midpoint m. (a+b)/2.</li>\n<li>If f(m)=0, end; if f(a)f(m)lt 0, change b:=m, otherwise a:=m.</li>\n<li>The length of the interval is halved each time. Due to the set/completeness of the interval, the only limit point is the root (or a string tends to a certain root).</li>\n</ol>\n<p>Error ≤ (b−a)/2ⁿ, the number of steps can be given explicitly.</p>\n", "why": "\n<p>The mother theorem of many \"existence\" conclusions. Computers are used to find roots and prove that odd degree polynomials must have real roots.</p>\n", "try": "\n<ul>\n<li>Use the dichotomy method in the figure above to take a few more steps and see how the interval locks the root.</li>\n<li>Think: Why can’t f(x)=1/x be applied from −1 to 1? (Disconnected in the middle.)</li>\n</ul>\n"}}, {"id": "mvt", "field": "math", "difficulty": "medium", "emoji": "🚗", "iconClass": "warm", "related": ["ftc", "ivt", "pythagoras", "taylor", "sandwich"], "__i18n": {"zh": {"id": "mvt", "title": "拉格朗日中值定理", "subtitle": "平均有多快，就有一刻真有多快", "emoji": "🚗", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["微积分", "分析", "罗尔"], "era": "拉格朗日；罗尔更早有特例", "oneLiner": "平均速度是 80，那么过程中至少有一瞬间，速度表也正好指着 80。", "people": [{"role": "罗尔定理", "name": "米歇尔·罗尔", "years": "1691"}, {"role": "中值定理", "name": "拉格朗日等", "years": "18 世纪"}], "related": ["ftc", "ivt", "pythagoras", "taylor", "sandwich"], "sections": {"story": "\n        <p>1 小时开了 80 公里，平均 80。只要车速变化是「光滑」的，中途必有一瞬间速度刚好 80——不能全程低于 80 又平均到 80（在可导模型里）。</p>\n        <p>数学上：曲线两端割线的斜率，一定等于某点切线的斜率。</p>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>平均速度若是 80，过程中至少有一瞬速度表也指 80。</p>\n        <p><strong>罗尔：</strong><span data-latex=\"f(a)=f(b)\">f(a)=f(b)</span> 时，中间有水平切线。</p>\n        <div class=\"formula\" data-latex=\"\\exists\\xi\\in(a,b):\\ f'(\\xi)=0\"></div>\n        <p><strong>拉格朗日中值定理：</strong></p>\n        <div class=\"formula\" data-latex=\"f'(\\xi)=\\dfrac{f(b)-f(a)}{b-a}\"></div>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">极值点导数</div>\n          <p>若 f 在 c∈(a,b) 可导且取局部极值，则 f'(c)=0。（费马内点定理：差商左右符号迫使导数为 0。）</p>\n        </div>\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">连续函数极值</div>\n          <p>闭区间上连续函数达到最大、最小值。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>先把曲线「减去割线」变成两端一样高，再用罗尔定理：两端一样高时，中间必有水平切线。</p><div class=\"interactive\" data-widget=\"mvt-visual\"></div>\n        <div class=\"proof-nav\"><span>先罗尔</span><span>再辅助函数</span></div>\n        <h3>罗尔定理</h3>\n        <ol class=\"steps\">\n          <li>f 在 [a,b] 连续 ⇒ 有最大值 M 与最小值 m。</li>\n          <li>若 M=m，则 f 常数，任意 ξ 都有 f'=0。</li>\n          <li>若 M>m，因 f(a)=f(b)，最大值或最小值至少有一个在开区间 (a,b) 内达到（两端同值，若都只在端点取极值则函数常值）。更精确：M、m 不能同时仅在端点且不相等——若最大只在端点，则最大=f(a)=f(b)，若内部都严格小于它，最小在内部或端点；标准写法：\n            <ul class=\"substeps\">\n              <li>若 f 非常数，则 Mgt f(a) 或 mlt f(a)；</li>\n              <li>若 Mgt f(a)，最大点 c∈(a,b)，由引理 f'(c)=0；</li>\n              <li>若 mlt f(a)，最小点同理。</li>\n            </ul>\n          </li>\n        </ol>\n        <h3>中值定理</h3>\n        <ol class=\"steps\">\n          <li>构造辅助函数（减去割线）：\n            <div class=\"calc-line\" data-latex=\"g(x) = f(x) - f(a) - [(f(b)-f(a))/(b-a)](x-a)\"></div>\n          </li>\n          <li>则 g(a)=g(b)=0，g 满足罗尔条件 ⇒ 存在 ξ，g'(ξ)=0。</li>\n          <li>但 g'(x)=f'(x) − [f(b)−f(a)]/(b−a)，故 f'(ξ)=[f(b)−f(a)]/(b−a)。</li>\n        </ol>\n        <p class=\"qed\">∎</p>\n      <div data-more-detail>\n    <h3>从罗尔到拉格朗日的几何</h3>\n    <div class=\"diagram\"><svg viewBox=\"0 0 480 100\" xmlns=\"http://www.w3.org/2000/svg\">\n      <rect width=\"480\" height=\"100\" fill=\"#0f172a\"/>\n      <text x=\"24\" y=\"40\" fill=\"#e2e8f0\" font-size=\"13\">g(x)=f(x)−[割线]，使 g(a)=g(b)=0</text>\n      <text x=\"24\" y=\"70\" fill=\"#fbbf24\" font-size=\"13\">罗尔 ⇒ g'(ξ)=0 ⇒ f'(ξ)=割线斜率</text>\n    </svg></div>\n    <p>上图对 f=x² 可显式看到 ξ 与割线平行。一般 f 只需可导，不必二阶光滑。</p>\n    </div>", "deep": "\n        <h3>柯西中值定理</h3>\n        <p>f,g 可导，g'≠0，则存在 ξ 使 [f(b)−f(a)]/[g(b)−g(a)] = f'(ξ)/g'(ξ)。用于洛必达法则的证明。</p>\n        <h3>推论</h3>\n        <ul>\n          <li>f'=0 ⇒ f 常数；</li>\n          <li>f'>0 ⇒ 严格递增；</li>\n          <li>用泰勒定理的余项形式继续强化。</li>\n        </ul>\n      ", "why": "\n        <p>连接「局部（导数）」和「整体（从头到尾差多少）」。估误差、证不等式、写泰勒展开，都靠它。</p>\n      ", "try": "\n        <ul>\n          <li>对 f(x)=x² 在 [0,2] 上，亲手找出那个 ξ。</li>\n          <li>解释：为什么「瞬时速度一直 ≤80」能推出「平均也 ≤80」。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "mvt", "title": "Lagrange's mean value theorem", "subtitle": "How fast it is on average is how fast it really is at a moment", "emoji": "🚗", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["Calculus", "analyze", "Roll"], "era": "Lagrange; Rolle has earlier special case", "oneLiner": "If the average speed is 80, then the speedometer will be pointing at 80 for at least a moment.", "people": [{"role": "Rolle's theorem", "name": "Michel Rolle", "years": "1691"}, {"role": "mean value theorem", "name": "Lagrange et al.", "years": "18th century"}], "related": ["ftc", "ivt", "pythagoras", "taylor", "sandwich"], "sections": {"story": "\n<p>Driving 80 kilometers in 1 hour, average 80. As long as the speed change is \"smooth\", there must be a moment in the middle when the speed is exactly 80 - it cannot be lower than 80 the whole way and then average to 80 (in the differentiable model).</p>\n<p>Mathematically: the slope of the secant line at both ends of the curve must be equal to the slope of the tangent line at a certain point.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>If the average speed is 80, the speedometer will also read 80 for at least an instant.</p>\n<p><strong>Roll:</strong><span data-latex=\"f(a)=f(b)\">f(a)=f(b)</span> When , there is a horizontal tangent line in the middle.</p>\n<div class=\"formula\" data-latex=\"\\exists\\xi\\in(a,b):\\ f'(\\xi)=0\"></div>\n<p><strong>Lagrange's mean value theorem:</strong></p>\n<div class=\"formula\" data-latex=\"f'(\\xi)=\\dfrac{f(b)-f(a)}{b-a}\"></div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">extreme point derivative</div>\n<p>If f is differentiable in c∈(a,b) and takes a local minimum, then f'(c)=0. (Fermat's Interior Point Theorem: The left and right signs of the difference quotient force the derivative to 0.)</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">extreme value of continuous function</div>\n<p>A continuous function on a closed interval reaches its maximum and minimum values.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>First, \"subtract the secant\" from the curve to make both ends the same height, and then use Rolle's theorem: when both ends are the same height, there must be a horizontal tangent line in the middle.</p><div class=\"interactive\" data-widget=\"mvt-visual\"></div>\n<div class=\"proof-nav\"><span>Sirol</span><span>Auxiliary function</span></div>\n<h3>Rolle's theorem</h3>\n<ol class=\"steps\">\n<li>f is continuous in [a,b] ⇒ has a maximum value M and a minimum value m.</li>\n<li>If M=m, then f is constant, and f'=0 for any ξ.</li>\n<li>If M&gt;m, since f(a)=f(b), at least one of the maximum value or the minimum value is reached in the open interval (a,b) (the two ends have the same value, and if they only take extreme values ​​at the endpoints, the function is constant). More precise: M and m cannot be only at the endpoints and not equal at the same time - if the maximum is only at the endpoints, then the maximum = f (a) = f (b), if the interior is strictly smaller than it, the minimum is at the interior or the endpoint; standard writing:\n            <ul class=\"substeps\">\n<li>If f is non-constant, then Mgt f(a) or mlt f(a);</li>\n<li>If Mgt f(a), the maximum point c∈(a,b), by Lemma f'(c)=0;</li>\n<li>If mlt f(a), the same is true for the minimum point.</li>\n</ul>\n</li>\n</ol>\n<h3>mean value theorem</h3>\n<ol class=\"steps\">\n<li>Construct helper function (minus secant):\n            <div class=\"calc-line\" data-latex=\"g(x) = f(x) - f(a) - [(f(b)-f(a))/(b-a)](x-a)\"></div>\n</li>\n<li>Then g(a)=g(b)=0, g satisfies Rolle's condition ⇒ there exists ξ, g'(ξ)=0.</li>\n<li>But g'(x)=f'(x) − [f(b)−f(a)]/(b−a), so f'(ξ)=[f(b)−f(a)]/(b−a).</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>Geometry from Rolle to Lagrange</h3>\n<div class=\"diagram\"><svg viewbox=\"0 0 480 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#0f172a\" height=\"100\" width=\"480\"></rect>\n<text fill=\"#e2e8f0\" font-size=\"13\" x=\"24\" y=\"40\">g(x)=f(x)−[secant], so that g(a)=g(b)=0</text>\n<text fill=\"#fbbf24\" font-size=\"13\" x=\"24\" y=\"70\">Rolle ⇒ g'(ξ)=0 ⇒ f'(ξ)=secant slope</text>\n</svg></div>\n<p>In the figure above we can see explicitly that ξ is parallel to the secant for f=x². Generally f only needs to be differentiable and does not need to be second-order smooth.</p>\n</div>", "deep": "\n<h3>Cauchy's mean value theorem</h3>\n<p>f,g are differentiable, g'≠0, then there exists ξ such that [f(b)−f(a)]/[g(b)−g(a)] = f'(ξ)/g'(ξ). Used in the proof of Lópida's law.</p>\n<h3>inference</h3>\n<ul>\n<li>f'=0 ⇒ f constant;</li>\n<li>f'&gt;0 ⇒ strictly increasing;</li>\n<li>Continue to strengthen with the remainder form of Taylor's theorem.</li>\n</ul>\n", "why": "\n<p>Connect \"local (derivative)\" and \"whole (how much is the difference from beginning to end)\". Estimating errors, proving inequalities, and writing Taylor expansions all rely on it.</p>\n", "try": "\n<ul>\n<li>For f(x)=x² on [0,2], find out by yourself which ξ.</li>\n<li>Explanation: Why \"instantaneous speed is always ≤80\" can deduce \"average is also ≤80\".</li>\n</ul>\n"}, "field": "math"}}, "title": "Lagrange's mean value theorem", "subtitle": "How fast it is on average is how fast it really is at a moment", "difficultyLabel": "Spend some time thinking", "tags": ["Calculus", "analyze", "Roll"], "era": "Lagrange; Rolle has earlier special case", "oneLiner": "If the average speed is 80, then the speedometer will be pointing at 80 for at least a moment.", "people": [{"role": "Rolle's theorem", "name": "Michel Rolle", "years": "1691"}, {"role": "mean value theorem", "name": "Lagrange et al.", "years": "18th century"}], "sections": {"story": "\n<p>Driving 80 kilometers in 1 hour, average 80. As long as the speed change is \"smooth\", there must be a moment in the middle when the speed is exactly 80 - it cannot be lower than 80 the whole way and then average to 80 (in the differentiable model).</p>\n<p>Mathematically: the slope of the secant line at both ends of the curve must be equal to the slope of the tangent line at a certain point.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>If the average speed is 80, the speedometer will also read 80 for at least an instant.</p>\n<p><strong>Roll:</strong><span data-latex=\"f(a)=f(b)\">f(a)=f(b)</span> When , there is a horizontal tangent line in the middle.</p>\n<div class=\"formula\" data-latex=\"\\exists\\xi\\in(a,b):\\ f'(\\xi)=0\"></div>\n<p><strong>Lagrange's mean value theorem:</strong></p>\n<div class=\"formula\" data-latex=\"f'(\\xi)=\\dfrac{f(b)-f(a)}{b-a}\"></div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">extreme point derivative</div>\n<p>If f is differentiable in c∈(a,b) and takes a local minimum, then f'(c)=0. (Fermat's Interior Point Theorem: The left and right signs of the difference quotient force the derivative to 0.)</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">extreme value of continuous function</div>\n<p>A continuous function on a closed interval reaches its maximum and minimum values.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>First, \"subtract the secant\" from the curve to make both ends the same height, and then use Rolle's theorem: when both ends are the same height, there must be a horizontal tangent line in the middle.</p><div class=\"interactive\" data-widget=\"mvt-visual\"></div>\n<div class=\"proof-nav\"><span>Sirol</span><span>Auxiliary function</span></div>\n<h3>Rolle's theorem</h3>\n<ol class=\"steps\">\n<li>f is continuous in [a,b] ⇒ has a maximum value M and a minimum value m.</li>\n<li>If M=m, then f is constant, and f'=0 for any ξ.</li>\n<li>If M&gt;m, since f(a)=f(b), at least one of the maximum value or the minimum value is reached in the open interval (a,b) (the two ends have the same value, and if they only take extreme values ​​at the endpoints, the function is constant). More precise: M and m cannot be only at the endpoints and not equal at the same time - if the maximum is only at the endpoints, then the maximum = f (a) = f (b), if the interior is strictly smaller than it, the minimum is at the interior or the endpoint; standard writing:\n            <ul class=\"substeps\">\n<li>If f is non-constant, then Mgt f(a) or mlt f(a);</li>\n<li>If Mgt f(a), the maximum point c∈(a,b), by Lemma f'(c)=0;</li>\n<li>If mlt f(a), the same is true for the minimum point.</li>\n</ul>\n</li>\n</ol>\n<h3>mean value theorem</h3>\n<ol class=\"steps\">\n<li>Construct helper function (minus secant):\n            <div class=\"calc-line\" data-latex=\"g(x) = f(x) - f(a) - [(f(b)-f(a))/(b-a)](x-a)\"></div>\n</li>\n<li>Then g(a)=g(b)=0, g satisfies Rolle's condition ⇒ there exists ξ, g'(ξ)=0.</li>\n<li>But g'(x)=f'(x) − [f(b)−f(a)]/(b−a), so f'(ξ)=[f(b)−f(a)]/(b−a).</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>Geometry from Rolle to Lagrange</h3>\n<div class=\"diagram\"><svg viewbox=\"0 0 480 100\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#0f172a\" height=\"100\" width=\"480\"></rect>\n<text fill=\"#e2e8f0\" font-size=\"13\" x=\"24\" y=\"40\">g(x)=f(x)−[secant], so that g(a)=g(b)=0</text>\n<text fill=\"#fbbf24\" font-size=\"13\" x=\"24\" y=\"70\">Rolle ⇒ g'(ξ)=0 ⇒ f'(ξ)=secant slope</text>\n</svg></div>\n<p>In the figure above we can see explicitly that ξ is parallel to the secant for f=x². Generally f only needs to be differentiable and does not need to be second-order smooth.</p>\n</div>", "deep": "\n<h3>Cauchy's mean value theorem</h3>\n<p>f,g are differentiable, g'≠0, then there exists ξ such that [f(b)−f(a)]/[g(b)−g(a)] = f'(ξ)/g'(ξ). Used in the proof of Lópida's law.</p>\n<h3>inference</h3>\n<ul>\n<li>f'=0 ⇒ f constant;</li>\n<li>f'&gt;0 ⇒ strictly increasing;</li>\n<li>Continue to strengthen with the remainder form of Taylor's theorem.</li>\n</ul>\n", "why": "\n<p>Connect \"local (derivative)\" and \"whole (how much is the difference from beginning to end)\". Estimating errors, proving inequalities, and writing Taylor expansions all rely on it.</p>\n", "try": "\n<ul>\n<li>For f(x)=x² on [0,2], find out by yourself which ξ.</li>\n<li>Explanation: Why \"instantaneous speed is always ≤80\" can deduce \"average is also ≤80\".</li>\n</ul>\n"}}, {"id": "euler-identity", "field": "math", "difficulty": "medium", "emoji": "🌀", "iconClass": "purple", "related": ["ftc", "fta", "basel", "riemann-mapping"], "__i18n": {"zh": {"id": "euler-identity", "title": "欧拉公式与欧拉恒等式", "subtitle": "指数转一圈，居然等于 −1", "emoji": "🌀", "iconClass": "purple", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["复数", "分析", "最美公式"], "era": "18 世纪", "oneLiner": "e、i、π、1、0 五个最重要的数，被一个式子轻轻拴在一起：e^{iπ}+1=0。", "people": [{"role": "系统建立", "name": "欧拉", "years": "1707–1783"}], "related": ["ftc", "fta", "basel", "riemann-mapping"], "sections": {"story": "\n        <p>很多人票选「最美公式」，冠军常是 e^{iπ}+1=0。它把增长（e）、虚数（i）、圆（π）、算术（0 和 1）捏成一句话。</p>\n        <p>背后是：e 的指数往虚方向走，竟然在绕圆。转到 180° 时，刚好停在 −1。</p>\n        <div class=\"fun-box\"><strong>图像：</strong>e^{iθ} 是单位圆上的点；θ=π 就是走到对面那一点。</div>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>e、i、π、1、0 被一个式子拴在一起。</p>\n        <div class=\"formula\" data-latex=\"e^{i\\theta}=\\cos\\theta+i\\sin\\theta\"></div>\n        <p>令 <span data-latex=\"\\theta=\\pi\">θ=π</span>：</p>\n        <div class=\"formula\" data-latex=\"e^{i\\pi}+1=0\"></div>\n      ", "setup": "\n        <div class=\"def-box\">\n          <div class=\"def-title\">幂级数定义（分析路径）</div>\n          <div class=\"calc-line\" data-latex=\"e^z = \\sum_{n=0}^\\infty z^n / n!\"></div>\n          <div class=\"calc-line\" data-latex=\"cos \\theta = \\sum (-1)^k \\theta ^{2k}/(2k)! ， sin \\theta = \\sum (-1)^k \\theta ^{2k+1}/(2k+1)!\"></div>\n          <p>对实 θ，这些级数绝对收敛，可合法重排。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>把 e 的级数里代入 iθ，按 i 的幂分类，实部凑成 cos，虚部凑成 sin。</p><div class=\"interactive\" data-widget=\"euler-circle\"></div>\n        <div class=\"proof-nav\"><span>代入 z=iθ</span><span>按 i 的幂归类</span><span>对齐级数</span></div>\n        <ol class=\"steps\">\n          <li>写 e^{iθ} = ∑ (iθ)^n / n! = ∑ i^n θ^n / n!。</li>\n          <li>i 的循环：i^0=1, i^1=i, i^2=−1, i^3=−i，然后重复。</li>\n          <li>拆成 n=4k, 4k+1, 4k+2, 4k+3 四类：\n            <ul class=\"substeps\">\n              <li>n=4k：贡献 + θ^{4k}/(4k)! （实）</li>\n              <li>n=4k+1：贡献 + i θ^{4k+1}/(4k+1)! （虚）</li>\n              <li>n=4k+2：贡献 − θ^{4k+2}/(4k+2)! （实）</li>\n              <li>n=4k+3：贡献 − i θ^{4k+3}/(4k+3)! （虚）</li>\n            </ul>\n          </li>\n          <li>全体实部 = ∑ (−1)^k θ^{2k}/(2k)! = cos θ。</li>\n          <li>全体虚部系数 = ∑ (−1)^k θ^{2k+1}/(2k+1)! = sin θ。</li>\n          <li>故 e^{iθ}=cosθ + i sinθ。θ=π 时得恒等式。</li>\n        </ol>\n        <p class=\"qed\">∎</p>\n      <div data-more-detail>\n    <h3>与幂级数对齐</h3>\n    <p>拖动 θ 观察单位圆。θ=π 时点在 (−1,0)。级数证明：e^{iθ} 的实部/虚部分别拼成 cos/sin 的泰勒级数。</p>\n    </div>", "deep": "\n        <h3>微分方程路径</h3>\n        <p>令 f(θ)=cosθ + i sinθ。则 f'= −sinθ + i cosθ = i f，且 f(0)=1。而 g(θ)=e^{iθ} 满足同一 ODE 与初值，由唯一性 f≡g。</p>\n        <h3>几何：模长</h3>\n        <p>|e^{iθ}|² = cos²θ + sin²θ = 1，故在单位圆上；θ 增加对应辐角增加（角速度 1）。</p>\n        <h3>棣莫弗</h3>\n        <p>(cosθ+i sinθ)^n = cos(nθ)+i sin(nθ) 由欧拉公式立即得到。</p>\n      ", "why": "\n        <p>信号、交流电、量子相位，都爱把「振动」写成 e 的虚指数——算起来像乘法，比角公式省事。</p>\n      ", "try": "\n        <ul>\n          <li>拖动交互图，看 θ=90°、180° 时点落在哪。</li>\n          <li>用级数前几项手算，感受它一点点靠近 cos+i sin。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "euler-identity", "title": "Euler's formula and Euler's identity", "subtitle": "The index rotates once, and it is equal to −1", "emoji": "🌀", "iconClass": "purple", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["plural", "analyze", "The most beautiful formula"], "era": "18th century", "oneLiner": "The five most important numbers, e, i, π, 1, and 0, are gently tied together by a formula: e^{iπ}+1=0.", "people": [{"role": "System establishment", "name": "Euler", "years": "1707–1783"}], "related": ["ftc", "fta", "basel", "riemann-mapping"], "sections": {"story": "\n<p>Many people vote for \"the most beautiful formula\", and the winner is often e^{iπ}+1=0. It combines growth (e), imaginary numbers (i), the circle (π), and arithmetic (0 and 1) into one sentence.</p>\n<p>Behind the scenes is: the exponent of e goes in the imaginary direction, actually going around a circle. When turned to 180°, it stops exactly at −1.</p>\n<div class=\"fun-box\"><strong>image:</strong>e^{iθ} is the point on the unit circle; θ=π is the point on the opposite side.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>e, i, π, 1, and 0 are tied together by a formula.</p>\n<div class=\"formula\" data-latex=\"e^{i\\theta}=\\cos\\theta+i\\sin\\theta\"></div>\n<p>make <span data-latex=\"\\theta=\\pi\">θ=π</span>：</p>\n<div class=\"formula\" data-latex=\"e^{i\\pi}+1=0\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Power series definition (analysis path)</div>\n<div class=\"calc-line\" data-latex=\"e^z = \\sum_{n=0}^\\infty z^n / n!\"></div>\n<div class=\"calc-line\" data-latex=\"cos \\theta = \\sum (-1)^k \\theta ^{2k}/(2k)! ， sin \\theta = \\sum (-1)^k \\theta ^{2k+1}/(2k+1)!\"></div>\n<p>For real θ, these series converge absolutely and can be legally rearranged.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Substitute iθ into the series of e and classify them according to the power of i. The real part becomes cos and the imaginary part becomes sin.</p><div class=\"interactive\" data-widget=\"euler-circle\"></div>\n<div class=\"proof-nav\"><span>Substitute z=iθ</span><span>Sort by power of i</span><span>Alignment series</span></div>\n<ol class=\"steps\">\n<li>Write e^{iθ} = ∑ (iθ)^n / n! = ∑ i^n θ^n / n!.</li>\n<li>Loop for i: i^0=1, i^1=i, i^2=−1, i^3=−i, and repeat.</li>\n<li>Split into four categories: n=4k, 4k+1, 4k+2, 4k+3:\n            <ul class=\"substeps\">\n<li>n=4k: Contribution + θ^{4k}/(4k)! (real)</li>\n<li>n=4k+1: Contribution + i θ^{4k+1}/(4k+1)! (virtual)</li>\n<li>n=4k+2: Contribution − θ^{4k+2}/(4k+2)! (real)</li>\n<li>n=4k+3: Contribution − i θ^{4k+3}/(4k+3)! (virtual)</li>\n</ul>\n</li>\n<li>Overall real part = ∑ (−1)^k θ^{2k}/(2k)! = cos θ.</li>\n<li>Overall imaginary part coefficient = ∑ (−1)^k θ^{2k+1}/(2k+1)! = sin θ.</li>\n<li>Therefore, e^{iθ}=cosθ + i sinθ. The identity is obtained when θ=π.</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>Align with power series</h3>\n<p>Drag θ to observe the unit circle. The point when θ=π is (−1,0). Series proof: The real and imaginary parts of e^{iθ} form the Taylor series of cos/sin respectively.</p>\n</div>", "deep": "\n<h3>differential equation path</h3>\n<p>Let f(θ)=cosθ + i sinθ. Then f'= −sinθ + i cosθ = i f, and f(0)=1. And g(θ)=e^{iθ} satisfies the same ODE and initial value, by the uniqueness f≡g.</p>\n<h3>Geometry: Module length</h3>\n<p>|e^{iθ}|² = cos²θ + sin²θ = 1, so on the unit circle; an increase in θ corresponds to an increase in the argument (angular velocity 1).</p>\n<h3>Demoivre</h3>\n<p>(cosθ+i sinθ)^n = cos(nθ)+i sin(nθ) is immediately obtained from Euler’s formula.</p>\n", "why": "\n<p>Signals, alternating currents, and quantum phases all like to write \"vibration\" as the imaginary exponent of e - the calculation is like multiplication, which is less troublesome than the angle formula.</p>\n", "try": "\n<ul>\n<li>Drag the interactive graph to see where the points fall when θ=90° and 180°.</li>\n<li>Use the first few steps of the series to calculate by hand and feel that it is getting closer to cos+i sin.</li>\n</ul>\n"}, "field": "math"}}, "title": "Euler's formula and Euler's identity", "subtitle": "The index rotates once, and it is equal to −1", "difficultyLabel": "Spend some time thinking", "tags": ["plural", "analyze", "The most beautiful formula"], "era": "18th century", "oneLiner": "The five most important numbers, e, i, π, 1, and 0, are gently tied together by a formula: e^{iπ}+1=0.", "people": [{"role": "System establishment", "name": "Euler", "years": "1707–1783"}], "sections": {"story": "\n<p>Many people vote for \"the most beautiful formula\", and the winner is often e^{iπ}+1=0. It combines growth (e), imaginary numbers (i), the circle (π), and arithmetic (0 and 1) into one sentence.</p>\n<p>Behind the scenes is: the exponent of e goes in the imaginary direction, actually going around a circle. When turned to 180°, it stops exactly at −1.</p>\n<div class=\"fun-box\"><strong>image:</strong>e^{iθ} is the point on the unit circle; θ=π is the point on the opposite side.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>e, i, π, 1, and 0 are tied together by a formula.</p>\n<div class=\"formula\" data-latex=\"e^{i\\theta}=\\cos\\theta+i\\sin\\theta\"></div>\n<p>make <span data-latex=\"\\theta=\\pi\">θ=π</span>：</p>\n<div class=\"formula\" data-latex=\"e^{i\\pi}+1=0\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Power series definition (analysis path)</div>\n<div class=\"calc-line\" data-latex=\"e^z = \\sum_{n=0}^\\infty z^n / n!\"></div>\n<div class=\"calc-line\" data-latex=\"cos \\theta = \\sum (-1)^k \\theta ^{2k}/(2k)! ， sin \\theta = \\sum (-1)^k \\theta ^{2k+1}/(2k+1)!\"></div>\n<p>For real θ, these series converge absolutely and can be legally rearranged.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Substitute iθ into the series of e and classify them according to the power of i. The real part becomes cos and the imaginary part becomes sin.</p><div class=\"interactive\" data-widget=\"euler-circle\"></div>\n<div class=\"proof-nav\"><span>Substitute z=iθ</span><span>Sort by power of i</span><span>Alignment series</span></div>\n<ol class=\"steps\">\n<li>Write e^{iθ} = ∑ (iθ)^n
