=P(B|A)P(A)</span>。</li>\n<li>When P(B)&gt;0, divide both sides by P(B) to get Bayes' formula.</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p><strong>Classic pit:</strong>The disease prevalence is 0.1%, the test has a true positive rate of 99% and a false positive rate of 1%. When you test positive, the probability that you actually have the disease is often only about 9%, not 99%. Please use the total probability formula to calculate the denominator.</p>\n", "why": "<p>Medical tests, spam, recommendation systems, and navigation are all about \"changing your mind based on data.\"</p>", "try": "<ul><li>Calculate the true prevalence of a rare disease after testing positive.</li><li>Coin problem: fair vs double-sided, posterior after tossing a suit.</li></ul>"}}, {"id": "binomial", "field": "math", "difficulty": "easy", "emoji": "➕", "iconClass": "green", "related": ["pythagoras", "amgm", "fermat-little"], "__i18n": {"zh": {"id": "binomial", "title": "二项式定理", "subtitle": "展开式一次说清", "emoji": "➕", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["代数", "组合", "必学经典"], "era": "古代有特例；牛顿推广到一般指数", "oneLiner": "(a+b)ⁿ 展开后，每一项系数都是组合数——杨辉三角那一行。", "people": [{"role": "一般形式与系数", "name": "帕斯卡、牛顿等", "years": "17 世纪前后系统化"}], "related": ["pythagoras", "amgm", "fermat-little"], "sections": {"story": "<p>平方、立方你会背，更高次呢？二项式定理：n 个括号每个选 a 或 b，选了 k 次 b 的系数就是 C(n,k)。</p>", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>(a+b)ⁿ 按组合数展开。</p>\n        <div class=\"formula\" data-latex=\"(a+b)^n=\\sum_{k=0}^{n}\\binom{n}{k}a^{n-k}b^{k}\"></div>\n      ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">组合意义</div>\n            <p><span data-latex=\"\\binom{n}{k}\">C(n,k)</span>：从 n 个因子里选 k 个贡献 b、其余贡献 a 的方式数。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">帕斯卡恒等式</div>\n            <div class=\"calc-line\" data-latex=\"\\binom{n}{k}=\\binom{n-1}{k}+\\binom{n-1}{k-1}\"></div>\n          </div>\n        ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>n 个 (a+b) 相乘，从每个括号挑 a 或 b；挑 k 次 b 的方式数是 C(n,k)。</p><div class=\"interactive\" data-widget=\"binomial\"></div>\n          <p class=\"plain-lead\"><strong>人话版：</strong>(a+b)…(a+b) 共 n 份，每一份从 a 或 b 里挑一个相乘；挑了 k 次 b 的项系数就是 C(n,k)。</p>\n          <ol class=\"steps\">\n            <li>把 (a+b)^n 看成 n 个括号 (a+b)(a+b)…(a+b)。</li>\n            <li>展开时每一项来自：每个括号选 a 或 b，再相乘。</li>\n            <li>若恰好选了 k 次 b（因而 n−k 次 a），该项为 a^{n−k}b^k，出现次数 = 从 n 个括号选 k 个给 b 的方法数 = C(n,k)。</li>\n            <li>对 k 从 0 到 n 求和，即得定理。</li>\n          </ol>\n          <p class=\"qed\">∎（组合证明）</p>\n          <p>也可用数学归纳 + 帕斯卡恒等式证明。</p>\n        ", "deep": "\n          <p>牛顿把指数推广到实数/复数，得到无穷级数（|x| 小时 (1+x)^α 的展开），是微积分的基本工具。</p>\n        ", "why": "<p>二项分布、近似 (1+x)ⁿ、代数变形，基础中的基础。</p>", "try": "<ul><li>写出 (a+b)⁴ 对照杨辉三角。</li><li>用前两项近似 1.01⁵。</li></ul>"}, "field": "math"}, "en": {"id": "binomial", "title": "binomial theorem", "subtitle": "Explain the expansion in one go", "emoji": "➕", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["algebra", "combination", "Must learn classics"], "era": "There were special cases in ancient times; Newton generalized to general exponents", "oneLiner": "After (a+b)ⁿ is expanded, each coefficient is a combination number - the row of Yang Hui's triangle.", "people": [{"role": "General form and coefficients", "name": "Pascal, Newton, etc.", "years": "Systematization around the 17th century"}], "related": ["pythagoras", "amgm", "fermat-little"], "sections": {"story": "<p>You can memorize squares and cubes, but what about higher levels? Binomial theorem: Each of n brackets chooses a or b, and the coefficient of b chosen k times is C(n,k).</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>(a+b)ⁿ Expand according to the number of combinations.</p>\n<div class=\"formula\" data-latex=\"(a+b)^n=\\sum_{k=0}^{n}\\binom{n}{k}a^{n-k}b^{k}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">combination meaning</div>\n<p><span data-latex=\"\\binom{n}{k}\">C(n,k)</span>: The number of ways to select k contributions b and the remaining contributions a from n factors.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Pascal's Identity</div>\n<div class=\"calc-line\" data-latex=\"\\binom{n}{k}=\\binom{n-1}{k}+\\binom{n-1}{k-1}\"></div>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>To multiply n (a+b), pick a or b from each bracket; the number of ways to pick b k times is C(n,k).</p><div class=\"interactive\" data-widget=\"binomial\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>(a+b)…(a+b) There are n parts in total, and each part is multiplied by selecting one from a or b; the coefficient of the term b selected k times is C(n,k).</p>\n<ol class=\"steps\">\n<li>Think of (a+b)^n as n brackets (a+b)(a+b)…(a+b).</li>\n<li>When expanding, each term comes from: choose a or b for each bracket, and then multiply.</li>\n<li>If b is chosen exactly k times (and thus a n−k times), the term is a^{n−k}b^k, and the number of occurrences = the number of ways to choose k from n brackets for b = C(n,k).</li>\n<li>Summing k from 0 to n gives us the theorem.</li>\n</ol>\n<p class=\"qed\">∎ (combination proof)</p>\n<p>It can also be proved by mathematical induction + Pascal's identity.</p>\n", "deep": "\n<p>Newton generalized exponents to real/complex numbers, resulting in infinite series (the expansion of |x| hours (1+x)^α), which is a basic tool of calculus.</p>\n", "why": "<p>Binomial distribution, approximation (1+x)ⁿ, algebraic transformations, the basics of basics.</p>", "try": "<ul><li>Write (a+b)⁴ and compare it with Yang Hui’s triangle.</li><li>Use the first two terms to approximate 1.01⁵.</li></ul>"}, "field": "math"}}, "title": "binomial theorem", "subtitle": "Explain the expansion in one go", "difficultyLabel": "Easy to use", "tags": ["algebra", "combination", "Must learn classics"], "era": "There were special cases in ancient times; Newton generalized to general exponents", "oneLiner": "After (a+b)ⁿ is expanded, each coefficient is a combination number - the row of Yang Hui's triangle.", "people": [{"role": "General form and coefficients", "name": "Pascal, Newton, etc.", "years": "Systematization around the 17th century"}], "sections": {"story": "<p>You can memorize squares and cubes, but what about higher levels? Binomial theorem: Each of n brackets chooses a or b, and the coefficient of b chosen k times is C(n,k).</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>(a+b)ⁿ Expand according to the number of combinations.</p>\n<div class=\"formula\" data-latex=\"(a+b)^n=\\sum_{k=0}^{n}\\binom{n}{k}a^{n-k}b^{k}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">combination meaning</div>\n<p><span data-latex=\"\\binom{n}{k}\">C(n,k)</span>: The number of ways to select k contributions b and the remaining contributions a from n factors.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Pascal's Identity</div>\n<div class=\"calc-line\" data-latex=\"\\binom{n}{k}=\\binom{n-1}{k}+\\binom{n-1}{k-1}\"></div>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>To multiply n (a+b), pick a or b from each bracket; the number of ways to pick b k times is C(n,k).</p><div class=\"interactive\" data-widget=\"binomial\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>(a+b)…(a+b) There are n parts in total, and each part is multiplied by selecting one from a or b; the coefficient of the term b selected k times is C(n,k).</p>\n<ol class=\"steps\">\n<li>Think of (a+b)^n as n brackets (a+b)(a+b)…(a+b).</li>\n<li>When expanding, each term comes from: choose a or b for each bracket, and then multiply.</li>\n<li>If b is chosen exactly k times (and thus a n−k times), the term is a^{n−k}b^k, and the number of occurrences = the number of ways to choose k from n brackets for b = C(n,k).</li>\n<li>Summing k from 0 to n gives us the theorem.</li>\n</ol>\n<p class=\"qed\">∎ (combination proof)</p>\n<p>It can also be proved by mathematical induction + Pascal's identity.</p>\n", "deep": "\n<p>Newton generalized exponents to real/complex numbers, resulting in infinite series (the expansion of |x| hours (1+x)^α), which is a basic tool of calculus.</p>\n", "why": "<p>Binomial distribution, approximation (1+x)ⁿ, algebraic transformations, the basics of basics.</p>", "try": "<ul><li>Write (a+b)⁴ and compare it with Yang Hui’s triangle.</li><li>Use the first two terms to approximate 1.01⁵.</li></ul>"}}, {"id": "law-of-cosines", "field": "math", "difficulty": "easy", "emoji": "📐", "iconClass": "warm", "related": ["pythagoras", "amgm", "fta"], "__i18n": {"zh": {"id": "law-of-cosines", "title": "余弦定理", "subtitle": "带夹角的勾股", "emoji": "📐", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["几何", "三角", "测量"], "era": "欧几里得有几何版；现代形式用余弦", "oneLiner": "任意三角形 c²=a²+b²−2ab cos C；直角时多出来那项消失，变回勾股。", "people": [{"role": "古典几何", "name": "欧几里得《原本》", "years": "约前 300 年"}], "related": ["pythagoras", "amgm", "fta"], "sections": {"story": "<p>斜三角形测第三边，不能硬套勾股。余弦定理补上夹角，量地、导航、游戏里算距离都靠它。</p>", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>任意三角形的边角关系；直角时变回勾股。</p>\n        <div class=\"formula\" data-latex=\"c^{2}=a^{2}+b^{2}-2ab\\cos C\"></div>\n      ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">记号</div>\n            <p>边 a,b,c 分别对顶角 A,B,C。余弦在锐角为正、钝角为负，所以钝角时 c² > a²+b²。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">坐标引理</div>\n            <p>把角 C 放在原点，两边沿坐标轴方向放置，用距离公式即得。</p>\n          </div>\n        ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>两边当向量，对边是差向量；长度平方一展开，点积变成 cos。</p><div class=\"interactive\" data-widget=\"law-of-cosines\"></div>\n          <p class=\"plain-lead\"><strong>人话版：</strong>把顶点 C 放原点，两边向量点积，长度平方一拆开就是余弦定理。</p>\n          <ol class=\"steps\">\n            <li>令向量 <span data-latex=\"\\vec{u},\\vec{v}\">u→,v→</span> 表示夹角 C 的两边，|u|=b，|v|=a，对边向量 u−v 长度是 c。</li>\n            <li><span data-latex=\"c^{2}=\\|\\vec{u}-\\vec{v}\\|^{2}=\\|\\vec{u}\\|^{2}+\\|\\vec{v}\\|^{2}-2\\langle\\vec{u},\\vec{v}\\rangle\">c²=‖u−v‖²=‖u‖²+‖v‖²−2⟨u,v⟩</span>。</li>\n            <li>而 <span data-latex=\"\\langle\\vec{u},\\vec{v}\\rangle=ab\\cos C\">⟨u,v⟩=ab cos C</span>，代入即得\n              <div class=\"calc-line\" data-latex=\"c^{2}=a^{2}+b^{2}-2ab\\cos C\"></div>\n            </li>\n            <li>当 C=90°，cos C=0，回到勾股定理。</li>\n          </ol>\n          <p class=\"qed\">∎</p>\n        ", "deep": "\n          <p>正弦定理 a/sin A = 2R（外接圆直径）与余弦定理一起，构成解斜三角形的基本武器。</p>\n        ", "why": "<p>解斜三角形、图形学夹角、测量第三边。</p>", "try": "<ul><li>边 3、4 夹角 60° 求对边。</li><li>夹角改 90°，看是否回到 5。</li></ul>"}, "field": "math"}, "en": {"id": "law-of-cosines", "title": "cosine theorem", "subtitle": "Pythagorean with angle", "emoji": "📐", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["geometry", "triangle", "Measurement"], "era": "Euclid has a geometric version; the modern form uses cosines", "oneLiner": "Any triangle c²=a²+b²−2ab cos C; in the case of a right angle, the extra term disappears and becomes Pythagorean.", "people": [{"role": "classical geometry", "name": "Euclid's \"Elements\"", "years": "about 300 BC"}], "related": ["pythagoras", "amgm", "fta"], "sections": {"story": "<p>Measuring the third side of an oblique triangle cannot be applied to Pythagorean. The cosine theorem supplements the included angle, and it is relied upon for measuring land, navigating, and calculating distances in games.</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>The relationship between the sides and angles of any triangle; when it is a right angle, it changes back to Pythagorean.</p>\n<div class=\"formula\" data-latex=\"c^{2}=a^{2}+b^{2}-2ab\\cos C\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">mark</div>\n<p>Sides a, b, and c are opposite to vertex angles A, B, and C respectively. Cosine is positive at acute angles and negative at obtuse angles, so at obtuse angles c² &gt; a²+b².</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Coordinate Lemma</div>\n<p>Place angle C at the origin, place both sides along the coordinate axis, and use the distance formula to get it.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>The two sides are vectors, and the opposite side is the difference vector; once the length is squared and expanded, the dot product becomes cos.</p><div class=\"interactive\" data-widget=\"law-of-cosines\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>Put the vertex C at the origin, take the dot product of the vectors on both sides, and split the square of the length to get the cosine theorem.</p>\n<ol class=\"steps\">\n<li>Let vector <span data-latex=\"\\vec{u},\\vec{v}\">u→,v→</span> Representing the two sides of the angle C, |u|=b, |v|=a, the length of the opposite side vector u−v is c.</li>\n<li><span data-latex=\"c^{2}=\\|\\vec{u}-\\vec{v}\\|^{2}=\\|\\vec{u}\\|^{2}+\\|\\vec{v}\\|^{2}-2\\langle\\vec{u},\\vec{v}\\rangle\">c²=‖u−v‖²=‖u‖²+‖v‖²−2⟨u,v⟩</span>。</li>\n<li>and <span data-latex=\"\\langle\\vec{u},\\vec{v}\\rangle=ab\\cos C\">⟨u,v⟩=ab cos C</span>, you can get it by substituting\n              <div class=\"calc-line\" data-latex=\"c^{2}=a^{2}+b^{2}-2ab\\cos C\"></div>\n</li>\n<li>When C=90°, cos C=0, returning to the Pythagorean theorem.</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>The sine theorem a/sin A = 2R (diameter of the circumscribed circle), together with the cosine theorem, form the basic weapon for solving oblique triangles.</p>\n", "why": "<p>Solving oblique triangles, angles in graphics, and measuring the third side.</p>", "try": "<ul><li>The angle between sides 3 and 4 is 60°. Find the opposite side.</li><li>Change the angle to 90° and see if it returns to 5.</li></ul>"}, "field": "math"}}, "title": "cosine theorem", "subtitle": "Pythagorean with angle", "difficultyLabel": "Easy to use", "tags": ["geometry", "triangle", "Measurement"], "era": "Euclid has a geometric version; the modern form uses cosines", "oneLiner": "Any triangle c²=a²+b²−2ab cos C; in the case of a right angle, the extra term disappears and becomes Pythagorean.", "people": [{"role": "classical geometry", "name": "Euclid's \"Elements\"", "years": "about 300 BC"}], "sections": {"story": "<p>Measuring the third side of an oblique triangle cannot be applied to Pythagorean. The cosine theorem supplements the included angle, and it is relied upon for measuring land, navigating, and calculating distances in games.</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>The relationship between the sides and angles of any triangle; when it is a right angle, it changes back to Pythagorean.</p>\n<div class=\"formula\" data-latex=\"c^{2}=a^{2}+b^{2}-2ab\\cos C\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">mark</div>\n<p>Sides a, b, and c are opposite to vertex angles A, B, and C respectively. Cosine is positive at acute angles and negative at obtuse angles, so at obtuse angles c² &gt; a²+b².</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Coordinate Lemma</div>\n<p>Place angle C at the origin, place both sides along the coordinate axis, and use the distance formula to get it.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>The two sides are vectors, and the opposite side is the difference vector; once the length is squared and expanded, the dot product becomes cos.</p><div class=\"interactive\" data-widget=\"law-of-cosines\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>Put the vertex C at the origin, take the dot product of the vectors on both sides, and split the square of the length to get the cosine theorem.</p>\n<ol class=\"steps\">\n<li>Let vector <span data-latex=\"\\vec{u},\\vec{v}\">u→,v→</span> Representing the two sides of the angle C, |u|=b, |v|=a, the length of the opposite side vector u−v is c.</li>\n<li><span data-latex=\"c^{2}=\\|\\vec{u}-\\vec{v}\\|^{2}=\\|\\vec{u}\\|^{2}+\\|\\vec{v}\\|^{2}-2\\langle\\vec{u},\\vec{v}\\rangle\">c²=‖u−v‖²=‖u‖²+‖v‖²−2⟨u,v⟩</span>。</li>\n<li>and <span data-latex=\"\\langle\\vec{u},\\vec{v}\\rangle=ab\\cos C\">⟨u,v⟩=ab cos C</span>, you can get it by substituting\n              <div class=\"calc-line\" data-latex=\"c^{2}=a^{2}+b^{2}-2ab\\cos C\"></div>\n</li>\n<li>When C=90°, cos C=0, returning to the Pythagorean theorem.</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>The sine theorem a/sin A = 2R (diameter of the circumscribed circle), together with the cosine theorem, form the basic weapon for solving oblique triangles.</p>\n", "why": "<p>Solving oblique triangles, angles in graphics, and measuring the third side.</p>", "try": "<ul><li>The angle between sides 3 and 4 is 60°. Find the opposite side.</li><li>Change the angle to 90° and see if it returns to 5.</li></ul>"}}, {"id": "euler-bridges", "field": "math", "difficulty": "easy", "emoji": "🌉", "iconClass": "purple", "related": ["euler-polyhedron", "four-color", "pigeonhole"], "__i18n": {"zh": {"id": "euler-bridges", "title": "欧拉七桥问题", "subtitle": "一笔画与图论起源", "emoji": "🌉", "iconClass": "purple", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["图论", "欧拉", "拓扑直觉"], "era": "1736，柯尼斯堡七桥", "oneLiner": "柯尼斯堡七桥：每座桥只走一次走得完吗？不能——奇度路口太多。", "people": [{"role": "提出与解决", "name": "莱昂哈德·欧拉", "years": "1736"}], "related": ["euler-polyhedron", "four-color", "pigeonhole"], "sections": {"story": "<p>城里七座桥，居民打赌一笔画。欧拉证明不可能，并发明「点线」语言：不管桥弯不弯，只看谁连谁。</p>", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>一笔画回路要所有点度数为偶；路径最多两个奇度点。</p>\n        <div class=\"formula\" data-latex=\"\\text{欧拉回路}\\Leftrightarrow\\text{连通且所有顶点度数为偶数}\"></div>\n      ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">图与度数</div>\n            <p>图 = 顶点 + 边。顶点的<strong>度数</strong> = 连出的边数。七桥对应 4 个点、7 条边，四个点度数分别为 3,3,3,5（皆奇）。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">握手引理</div>\n            <p>所有顶点度数之和 = 2×边数，故奇度顶点必有偶数个。</p>\n          </div>\n        ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>走过路口要一进一出，边成对用；奇度点只能当起点或终点，多了就画不成。</p><div class=\"interactive\" data-widget=\"euler-bridges\"></div>\n          <p class=\"plain-lead\"><strong>人话版：</strong>一笔画走进一个路口再离开，边成对用掉；只有起点和终点可以「单着」。奇度路口太多就画不成。</p>\n          <ol class=\"steps\">\n            <li>若存在欧拉回路：在每一中间经过的顶点，进一条边必出一条边，度数被成对用完 → 全为偶数。</li>\n            <li>反之（连通 + 全偶度）：可构造回路（标准证明用「走最大闭迹再拼接剩余」）。</li>\n            <li>欧拉路径（不闭合）：恰允许两个「端点」为奇度，其余偶度。</li>\n            <li>柯尼斯堡有 4 个奇度点 → 不可能。</li>\n          </ol>\n          <p class=\"qed\">∎</p>\n        ", "deep": "\n          <p>由此发展出欧拉回路算法、邮差问题、电路布线。与哈密顿路径（过每个点恰好一次）看似对偶，难度却天差地别。</p>\n        ", "why": "<p>图论开山之作；网络、地图、布线问题的老祖宗。</p>", "try": "<ul><li>画信封图，数奇度点，判断能否一笔画。</li><li>设计只有 2 个奇度点的图并找出路径。</li></ul>"}, "field": "math"}, "en": {"id": "euler-bridges", "title": "Euler's Seven Bridges Problem", "subtitle": "One-stroke painting and the origin of graph theory", "emoji": "🌉", "iconClass": "purple", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["graph theory", "Euler", "topological intuition"], "era": "1736, Seven Bridges of Königsberg", "oneLiner": "The Seven Bridges of Königsberg: Is it possible to walk on each bridge only once? No - there are too many intersections at Qidu.", "people": [{"role": "raise and resolve", "name": "Leonhard Euler", "years": "1736"}], "related": ["euler-polyhedron", "four-color", "pigeonhole"], "sections": {"story": "<p>There are seven bridges in the city, and residents bet on them. Euler proved it was impossible and invented the \"point-line\" language: no matter whether the bridge is curved or not, it just depends on who connects whom.</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>To draw a loop, all points must have even degrees; the path must have at most two odd points.</p>\n<div class=\"formula\" data-latex=\"\\text{欧拉回路}\\Leftrightarrow\\text{连通且所有顶点度数为偶数}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Figures and Degrees</div>\n<p>Graph = vertices + edges. vertex<strong>degree</strong> = the number of connected sides. The seven bridges correspond to 4 points and 7 sides, and the degrees of the four points are 3, 3, 3, and 5 respectively (all odd).</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Handshake Lemma</div>\n<p>The sum of the degrees of all vertices = 2×number of edges, so there must be an even number of odd-degree vertices.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>When walking through an intersection, you need to enter and exit, and use the edges in pairs; odd points can only be used as starting points or ending points, and if there are too many, it will be impossible to draw.</p><div class=\"interactive\" data-widget=\"euler-bridges\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>When a stroke enters an intersection and then leaves, the edges are used in pairs; only the starting point and end point can be used \"singlely\". There are too many odd intersections and it will be impossible to draw.</p>\n<ol class=\"steps\">\n<li>If there is a Euler circuit: at each intermediate vertex, an incoming edge must be an outgoing edge, and the degrees are used up in pairs → all are even numbers.</li>\n<li>On the contrary (connected + fully even degree): a loop can be constructed (the standard proof is \"take the maximum closed trace and then splice the remainder\").</li>\n<li>Euler path (not closed): Exactly two \"endpoints\" are allowed to be of odd degree, and the rest are of even degree.</li>\n<li>Königsberg has 4 singularity points → Impossible.</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>From this, the Euler loop algorithm, the postman problem, and circuit wiring were developed. It seems to be dual to the Hamiltonian path (passing each point exactly once), but the difficulty is very different.</p>\n", "why": "<p>The pioneering work of graph theory; the ancestor of network, map, and wiring problems.</p>", "try": "<ul><li>Draw a diagram of an envelope and count the odd points to determine whether it can be drawn in one stroke.</li><li>Design a graph with only 2 singularity points and find the path.</li></ul>"}, "field": "math"}}, "title": "Euler's Seven Bridges Problem", "subtitle": "One-stroke painting and the origin of graph theory", "difficultyLabel": "Easy to use", "tags": ["graph theory", "Euler", "topological intuition"], "era": "1736, Seven Bridges of Königsberg", "oneLiner": "The Seven Bridges of Königsberg: Is it possible to walk on each bridge only once? No - there are too many intersections at Qidu.", "people": [{"role": "raise and resolve", "name": "Leonhard Euler", "years": "1736"}], "sections": {"story": "<p>There are seven bridges in the city, and residents bet on them. Euler proved it was impossible and invented the \"point-line\" language: no matter whether the bridge is curved or not, it just depends on who connects whom.</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>To draw a loop, all points must have even degrees; the path must have at most two odd points.</p>\n<div class=\"formula\" data-latex=\"\\text{欧拉回路}\\Leftrightarrow\\text{连通且所有顶点度数为偶数}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Figures and Degrees</div>\n<p>Graph = vertices + edges. vertex<strong>degree</strong> = the number of connected sides. The seven bridges correspond to 4 points and 7 sides, and the degrees of the four points are 3, 3, 3, and 5 respectively (all odd).</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Handshake Lemma</div>\n<p>The sum of the degrees of all vertices = 2×number of edges, so there must be an even number of odd-degree vertices.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>When walking through an intersection, you need to enter and exit, and use the edges in pairs; odd points can only be used as starting points or ending points, and if there are too many, it will be impossible to draw.</p><div class=\"interactive\" data-widget=\"euler-bridges\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>When a stroke enters an intersection and then leaves, the edges are used in pairs; only the starting point and end point can be used \"singlely\". There are too many odd intersections and it will be impossible to draw.</p>\n<ol class=\"steps\">\n<li>If there is a Euler circuit: at each intermediate vertex, an incoming edge must be an outgoing edge, and the degrees are used up in pairs → all are even numbers.</li>\n<li>On the contrary (connected + fully even degree): a loop can be constructed (the standard proof is \"take the maximum closed trace and then splice the remainder\").</li>\n<li>Euler path (not closed): Exactly two \"endpoints\" are allowed to be of odd degree, and the rest are of even degree.</li>\n<li>Königsberg has 4 singularity points → Impossible.</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>From this, the Euler loop algorithm, the postman problem, and circuit wiring were developed. It seems to be dual to the Hamiltonian path (passing each point exactly once), but the difficulty is very different.</p>\n", "why": "<p>The pioneering work of graph theory; the ancestor of network, map, and wiring problems.</p>", "try": "<ul><li>Draw a diagram of an envelope and count the odd points to determine whether it can be drawn in one stroke.</li><li>Design a graph with only 2 singularity points and find the path.</li></ul>"}}, {"id": "taylor", "field": "math", "difficulty": "medium", "emoji": "📈", "iconClass": "", "related": ["ftc", "mvt", "euler-identity"], "__i18n": {"zh": {"id": "taylor", "title": "泰勒定理", "subtitle": "用多项式冒充复杂函数", "emoji": "📈", "iconClass": "", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["微积分", "近似", "分析"], "era": "泰勒 1715；拉格朗日余项等完善", "oneLiner": "光滑函数在一点附近，可以用多项式贴上去，误差由下一阶导数管着。", "people": [{"role": "级数形式", "name": "布鲁克·泰勒", "years": "1715"}, {"role": "余项等形式", "name": "拉格朗日等", "years": "18–19 世纪"}], "related": ["ftc", "mvt", "euler-identity"], "sections": {"story": "<p>sin、e^x 不好算，多项式好算。泰勒：把这一点的导数信息堆成多项式，附近就贴得很近——计算器都在用。</p>", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>光滑函数可用多项式局部逼近，误差由更高阶导数控制。</p>\n        <div class=\"formula\" data-latex=\"f(x)=\\sum_{k=0}^{n}\\dfrac{f^{(k)}(x_0)}{k!}(x-x_0)^k+R_n(x)\"></div>\n        <div class=\"formula\" data-latex=\"R_n(x)=\\dfrac{f^{(n+1)}(\\xi)}{(n+1)!}(x-x_0)^{n+1}\"></div>\n      ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">在 x₀ 处的泰勒多项式</div>\n            <p>前 n 阶导数在 x₀ 处与 f 相同的那个唯一 n 次多项式。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">罗尔定理多次使用</div>\n            <p>构造辅助函数使在多个点取 0，反复用罗尔，逼出余项里的高阶导数。</p>\n          </div>\n        ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>先写出目标多项式，把误差单独拎出；反复用罗尔/中值，误差就被高阶导数钉死。</p><div class=\"interactive\" data-widget=\"taylor\"></div>\n          <p class=\"plain-lead\"><strong>人话版：</strong>先写出你想要的多项式，把「误差」单独拎出来；对误差函数反复用中值/罗尔，误差就被下一阶导数钉死。</p>\n          <ol class=\"steps\">\n            <li>令 P_n 为 n 阶泰勒多项式，写 f(x)=P_n(x)+R_n(x)，目标刻画 R_n。</li>\n            <li>固定 x，构造辅助函数（常见写法之一），使其在 x₀ 处连同前 n 阶导数都为 0，并在 x 处与余项挂钩。</li>\n            <li>对辅助函数在 x₀ 与 x 之间反复应用罗尔定理 n+1 次，得到一点 ξ，使高阶导数条件成立。</li>\n            <li>解出 R_n(x) 的拉格朗日形式。</li>\n          </ol>\n          <p class=\"qed\">∎（纲要；细节见任意微积分教材）</p>\n        ", "deep": "\n          <p>e^x、sin x、cos x 的泰勒级数在全实轴收敛；1/(1−x) 只在 |x|<1。收敛半径是复分析的故事。</p>\n        ", "why": "<p>数值计算、物理近似、机器学习的展开与二阶方法。</p>", "try": "<ul><li>写 e^x 在 0 处前几项估 e^{0.1}。</li><li>比较 sin x 与 x−x³/6。</li></ul>"}, "field": "math"}, "en": {"id": "taylor", "title": "Taylor's theorem", "subtitle": "Using polynomials to pretend to be complex functions", "emoji": "📈", "iconClass": "", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["Calculus", "approximate", "analyze"], "era": "Taylor 1715; Lagrange remainder and other perfections", "oneLiner": "The smooth function is near a point and can be pasted on with a polynomial, and the error is controlled by the next derivative.", "people": [{"role": "Series form", "name": "Brooke Taylor", "years": "1715"}, {"role": "Remainder and other forms", "name": "Lagrange et al.", "years": "18th–19th century"}], "related": ["ftc", "mvt", "euler-identity"], "sections": {"story": "<p>Sin and e^x are difficult to calculate, but polynomials are easy to calculate. Taylor: Stack the derivative information at this point into a polynomial, and it's very close - calculators are using it.</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Smooth functions can be locally approximated by polynomials, with errors controlled by higher-order derivatives.</p>\n<div class=\"formula\" data-latex=\"f(x)=\\sum_{k=0}^{n}\\dfrac{f^{(k)}(x_0)}{k!}(x-x_0)^k+R_n(x)\"></div>\n<div class=\"formula\" data-latex=\"R_n(x)=\\dfrac{f^{(n+1)}(\\xi)}{(n+1)!}(x-x_0)^{n+1}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Taylor polynomial at x₀</div>\n<p>The unique polynomial of degree n whose first n derivatives are the same as f at x₀.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Rolle's theorem used many times</div>\n<p>Construct an auxiliary function to take 0 at multiple points, and use Rolle repeatedly to force out higher-order derivatives in the remainder.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>First write the target polynomial and isolate the error; by repeatedly using Roll/Median, the error will be nailed by the higher-order derivatives.</p><div class=\"interactive\" data-widget=\"taylor\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>First write the polynomial you want and isolate the \"error\"; repeatedly use the median/Roll for the error function, and the error will be nailed by the next derivative.</p>\n<ol class=\"steps\">\n<li>Let P_n be a Taylor polynomial of order n, write f(x)=P_n(x)+R_n(x), and the goal is to describe R_n.</li>\n<li>Fix x, construct the auxiliary function (one of the common ways to write it) so that it is 0 at x₀ together with the first n derivatives, and is linked to the remainder at x.</li>\n<li>Repeatedly apply Rolle's theorem n+1 times to the auxiliary function between x₀ and x to get a point ξ, so that the higher-order derivative condition holds.</li>\n<li>Solve for the Lagrangian form of R_n(x).</li>\n</ol>\n<p class=\"qed\">∎ (Outline; see any calculus textbook for details)</p>\n", "deep": "\n<p>The Taylor series of e^x, sin x, cos x converge in all real axes; 1/(1−x) only in |x|&lt;1. The radius of convergence is the story of complex analysis.</p>\n", "why": "<p>Numerical computation, physical approximation, machine learning expansion and second-order methods.</p>", "try": "<ul><li>Write the first few terms of e^x at 0 to estimate e^{0.1}.</li><li>Compare sin x to x−x³/6.</li></ul>"}, "field": "math"}}, "title": "Taylor's theorem", "subtitle": "Using polynomials to pretend to be complex functions", "difficultyLabel": "Spend some time thinking", "tags": ["Calculus", "approximate", "analyze"], "era": "Taylor 1715; Lagrange remainder and other perfections", "oneLiner": "The smooth function is near a point and can be pasted on with a polynomial, and the error is controlled by the next derivative.", "people": [{"role": "Series form", "name": "Brooke Taylor", "years": "1715"}, {"role": "Remainder and other forms", "name": "Lagrange et al.", "years": "18th–19th century"}], "sections": {"story": "<p>Sin and e^x are difficult to calculate, but polynomials are easy to calculate. Taylor: Stack the derivative information at this point into a polynomial, and it's very close - calculators are using it.</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Smooth functions can be locally approximated by polynomials, with errors controlled by higher-order derivatives.</p>\n<div class=\"formula\" data-latex=\"f(x)=\\sum_{k=0}^{n}\\dfrac{f^{(k)}(x_0)}{k!}(x-x_0)^k+R_n(x)\"></div>\n<div class=\"formula\" data-latex=\"R_n(x)=\\dfrac{f^{(n+1)}(\\xi)}{(n+1)!}(x-x_0)^{n+1}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Taylor polynomial at x₀</div>\n<p>The unique polynomial of degree n whose first n derivatives are the same as f at x₀.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Rolle's theorem used many times</div>\n<p>Construct an auxiliary function to take 0 at multiple points, and use Rolle repeatedly to force out higher-order derivatives in the remainder.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>First write the target polynomial and isolate the error; by repeatedly using Roll/Median, the error will be nailed by the higher-order derivatives.</p><div class=\"interactive\" data-widget=\"taylor\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>First write the polynomial you want and isolate the \"error\"; repeatedly use the median/Roll for the error function, and the error will be nailed by the next derivative.</p>\n<ol class=\"steps\">\n<li>Let P_n be a Taylor polynomial of order n, write f(x)=P_n(x)+R_n(x), and the goal is to describe R_n.</li>\n<li>Fix x, construct the auxiliary function (one of the common ways to write it) so that it is 0 at x₀ together with the first n derivatives, and is linked to the remainder at x.</li>\n<li>Repeatedly apply Rolle's theorem n+1 times to the auxiliary function between x₀ and x to get a point ξ, so that the higher-order derivative condition holds.</li>\n<li>Solve for the Lagrangian form of R_n(x).</li>\n</ol>\n<p class=\"qed\">∎ (Outline; see any calculus textbook for details)</p>\n", "deep": "\n<p>The Taylor series of e^x, sin x, cos x converge in all real axes; 1/(1−x) only in |x|&lt;1. The radius of convergence is the story of complex analysis.</p>\n", "why": "<p>Numerical computation, physical approximation, machine learning expansion and second-order methods.</p>", "try": "<ul><li>Write the first few terms of e^x at 0 to estimate e^{0.1}.</li><li>Compare sin x to x−x³/6.</li></ul>"}}, {"id": "sandwich", "field": "math", "difficulty": "easy", "emoji": "🥪", "iconClass": "green", "related": ["ivt", "ftc", "sqrt2"], "__i18n": {"zh": {"id": "sandwich", "title": "夹逼定理", "subtitle": "三明治夹住极限", "emoji": "🥪", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["微积分", "极限", "基础"], "era": "古典极限理论标准工具", "oneLiner": "上下两条曲线都挤向同一极限，夹在中间的也只能去那儿。", "people": [{"role": "极限理论中的标准定理", "name": "柯西等严格化", "years": "19 世纪"}], "related": ["ivt", "ftc", "sqrt2"], "sections": {"story": "<p>有的极限直接算很烦。若能找到好算的上下界，两边极限一样，中间就定了。sin x / x 在 0 处的经典证明就是夹逼。</p>", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>上下夹住且两边极限相同，中间极限也相同。</p>\n        <div class=\"formula\" data-latex=\"g\\le f\\le h,\\ \\lim g=\\lim h=L\\ \\Rightarrow\\ \\lim f=L\"></div>\n      ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">极限的 ε 语言（直觉）</div>\n            <p>f 逼近 L：只要 x 够靠近 x₀，f(x) 就掉进 L 的任意小邻域。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">不等式传递</div>\n            <p>若 A≤B≤C 且 A、C 都在 (L−ε,L+ε) 内，则 B 也在里面。</p>\n          </div>\n        ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>上下两扇门都关到只剩一条缝，夹在中间的只能进那条缝——写成 ε 语言就是证明。</p><div class=\"interactive\" data-widget=\"sandwich\"></div>\n          <p class=\"plain-lead\"><strong>人话版：</strong>上下两扇门都关到只剩一条缝，夹在中间的人只能进那条缝。</p>\n          <ol class=\"steps\">\n            <li>任给 ε>0。因 g→L，存在 δ₁，使 0≤|x−x₀|≤δ₁ 时 |g(x)−L|≤ε，即 L−ε≤g(x)≤L+ε。</li>\n            <li>同理存在 δ₂，使 h 也落入 (L−ε,L+ε)。</li>\n            <li>取 δ=min(δ₁,δ₂)。当 0≤|x−x₀|≤δ 时，L−ε≤g(x)≤f(x)≤h(x)≤L+ε。</li>\n            <li>故 |f(x)−L|≤ε。由 ε 任意，f→L。</li>\n          </ol>\n          <p class=\"qed\">∎</p>\n        ", "deep": "\n          <p>经典应用：证明 <span data-latex=\"\\lim_{x\\to 0}\\dfrac{\\sin x}{x}=1\">lim (sin x)/x = 1</span>（单位圆几何夹逼）。</p>\n        ", "why": "<p>极限课里最常用的间接招数之一。</p>", "try": "<ul><li>用 −|x|≤x sin(1/x)≤|x| 证明 x→0 时极限为 0。</li><li>想：只夹一边为什么不够。</li></ul>"}, "field": "math"}, "en": {"id": "sandwich", "title": "pinch theorem", "subtitle": "Sandwich to the limit", "emoji": "🥪", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["Calculus", "limit", "Base"], "era": "Standard tools of classical limit theory", "oneLiner": "Both the upper and lower curves are pushing towards the same limit, and the one caught in the middle can only go there.", "people": [{"role": "Standard Theorems in Limit Theory", "name": "Rigorous", "years": "19th century"}], "related": ["ivt", "ftc", "sqrt2"], "sections": {"story": "<p>Some limits are simply annoying. If we can find an easy-to-calculate upper and lower bound, and the limits on both sides are the same, the middle will be determined. The classic proof of sin x / x at 0 is pinching.</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Clamped up and down, the limits on both sides are the same, and the limits in the middle are also the same.</p>\n<div class=\"formula\" data-latex=\"g\\le f\\le h,\\ \\lim g=\\lim h=L\\ \\Rightarrow\\ \\lim f=L\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Extreme ε language (intuition)</div>\n<p>f approaches L: as long as x is close enough to x₀, f(x) falls into any small neighborhood of L.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Inequality transfer</div>\n<p>If A≤B≤C and both A and C are in (L−ε,L+ε), then B is also in it.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>The upper and lower doors are closed until there is only a crack left, and the one caught in the middle can only enter through that crack - the proof is written in the ε language.</p><div class=\"interactive\" data-widget=\"sandwich\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>The upper and lower doors were closed until there was only a crack left, and the person caught in the middle could only enter through that crack.</p>\n<ol class=\"steps\">\n<li>Let ε&gt;0. Since g→L, δ₁ exists, so that when 0≤|x−x₀|≤δ₁, |g(x)−L|≤ε, that is, L−ε≤g(x)≤L+ε.</li>\n<li>In the same way, δ₂ exists, so that h also falls into (L−ε,L+ε).</li>\n<li>Take δ=min(δ₁,δ₂). When 0≤|x−x₀|≤δ, L−ε≤g(x)≤f(x)≤h(x)≤L+ε.</li>\n<li>Therefore |f(x)−L|≤ε. By ε arbitrarily, f→L.</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>Classic application: proof <span data-latex=\"\\lim_{x\\to 0}\\dfrac{\\sin x}{x}=1\">lim (sin x)/x = 1</span>(Unit circle geometric clamping).</p>\n", "why": "<p>One of the most commonly used indirect tricks in extreme classes.</p>", "try": "<ul><li>Use −|x|≤x sin(1/x)≤|x| to prove that the limit is 0 when x→0.</li><li>Think: Why is it not enough to just clip one side?</li></ul>"}, "field": "math"}}, "title": "pinch theorem", "subtitle": "Sandwich to the limit", "difficultyLabel": "Easy to use", "tags": ["Calculus", "limit", "Base"], "era": "Standard tools of classical limit theory", "oneLiner": "Both the upper and lower curves are pushing towards the same limit, and the one caught in the middle can only go there.", "people": [{"role": "Standard Theorems in Limit Theory", "name": "Rigorous", "years": "19th century"}], "sections": {"story": "<p>Some limits are simply annoying. If we can find an easy-to-calculate upper and lower bound, and the limits on both sides are the same, the middle will be determined. The classic proof of sin x / x at 0 is pinching.</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Clamped up and down, the limits on both sides are the same, and the limits in the middle are also the same.</p>\n<div class=\"formula\" data-latex=\"g\\le f\\le h,\\ \\lim g=\\lim h=L\\ \\Rightarrow\\ \\lim f=L\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Extreme ε language (intuition)</div>\n<p>f approaches L: as long as x is close enough to x₀, f(x) falls into any small neighborhood of L.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Inequality transfer</div>\n<p>If A≤B≤C and both A and C are in (L−ε,L+ε), then B is also in it.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>The upper and lower doors are closed until there is only a crack left, and the one caught in the middle can only enter through that crack - the proof is written in the ε language.</p><div class=\"interactive\" data-widget=\"sandwich\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>The upper and lower doors were closed until there was only a crack left, and the person caught in the middle could only enter through that crack.</p>\n<ol class=\"steps\">\n<li>Let ε&gt;0. Since g→L, δ₁ exists, so that when 0≤|x−x₀|≤δ₁, |g(x)−L|≤ε, that is, L−ε≤g(x)≤L+ε.</li>\n<li>In the same way, δ₂ exists, so that h also falls into (L−ε,L+ε).</li>\n<li>Take δ=min(δ₁,δ₂). When 0≤|x−x₀|≤δ, L−ε≤g(x)≤f(x)≤h(x)≤L+ε.</li>\n<li>Therefore |f(x)−L|≤ε. By ε arbitrarily, f→L.</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>Classic application: proof <span data-latex=\"\\lim_{x\\to 0}\\dfrac{\\sin x}{x}=1\">lim (sin x)/x = 1</span>(Unit circle geometric clamping).</p>\n", "why": "<p>One of the most commonly used indirect tricks in extreme classes.</p>", "try": "<ul><li>Use −|x|≤x sin(1/x)≤|x| to prove that the limit is 0 when x→0.</li><li>Think: Why is it not enough to just clip one side?</li></ul>"}}, {"id": "newton-laws", "field": "physics", "difficulty": "easy", "emoji": "🍎", "iconClass": "warm", "related": ["newton-gravity", "momentum", "work-energy", "angular-momentum"], "__i18n": {"zh": {"id": "newton-laws", "field": "physics", "title": "牛顿运动定律", "subtitle": "经典力学的三条基石", "emoji": "🍎", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["力学", "牛顿", "经典物理"], "era": "1687《自然哲学的数学原理》", "oneLiner": "惯性、F=ma、作用力与反作用力——描述宏观低速世界里物体怎么动。", "people": [{"role": "建立体系", "name": "艾萨克·牛顿", "years": "1643–1727"}], "related": ["newton-gravity", "momentum", "work-energy", "angular-momentum"], "sections": {"story": "\n          <p>苹果落地、炮弹飞行，以前靠亚里士多德直觉。牛顿用三条定律把「力」和「运动」焊在一起，经典力学开张。</p>\n          <div class=\"fun-box\"><strong>适用范围：</strong>日常速度、宏观物体很好用；接近光速或原子尺度要换成相对论/量子。</div>\n        ", "statement": "\n          <p class=\"plain-lead\"><strong>先记住：</strong>① 不受力就匀速（或静止）；② 力改变动量，F=ma；③ 你推墙，墙也推你。</p>\n          <p><strong>第一定律（惯性）：</strong>质点不受外力（或合力为零）时，保持静止或匀速直线运动。</p>\n          <p><strong>第二定律：</strong></p>\n          <div class=\"formula\" data-latex=\"\\vec{F}=\\dfrac{d\\vec{p}}{dt}=m\\vec{a}\\quad(\\text{质量恒定时})\"></div>\n          <p><strong>第三定律：</strong>作用力与反作用力等大、反向、共线，分别作用在两个物体上。</p>\n          <div class=\"formula\" data-latex=\"\\vec{F}_{12}=-\\vec{F}_{21}\"></div>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">惯性参考系</div>\n            <p>第一定律成立的参考系叫惯性系。地球近似惯性系；加速的电梯不是。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">动量</div>\n            <p><span data-latex=\"\\vec{p}=m\\vec{v}\">p=mv</span>。第二定律最干净的写法是力等于动量变化率。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>这不是从更简单公理「推」出来的数学定理，而是对自然的高度压缩总结；正确性靠无数实验与工程成功。</p>\n          <ol class=\"steps\">\n            <li><strong>惯性：</strong>在足够光滑的气垫导轨上，滑块近似匀速——外力越小，速度越「懒得变」。</li>\n            <li><strong>F=ma：</strong>同一物体，力翻倍加速度翻倍；质量越大越难加速。这是定义力/验证比例的实验核心。</li>\n            <li><strong>反作用：</strong>两车互撞、溜冰者互推，动量交换等大反向——第三者（地球）有时藏在细节里。</li>\n          </ol>\n          <p class=\"qed\">（物理定律：实验归纳 + 体系自洽）</p>\n        ", "deep": "\n          <p>拉格朗日/哈密顿形式把牛顿力学改写成「极值原理」，为量子与场论铺路。相对论里 F=dp/dt 仍可用，但 p 的定义变了。</p>\n        ", "why": "\n          <p>桥梁、汽车、卫星发射、机器人控制——宏观工程默认牛顿框架。</p>\n        ", "try": "\n          <ul>\n            <li>站在称上突然下蹲，读数如何变？用第二定律解释。</li>\n            <li>为什么开枪会后坐？第三定律 + 动量。</li>\n          </ul>\n        "}}, "en": {"id": "newton-laws", "field": "physics", "title": "Newton's laws of motion", "subtitle": "Three cornerstones of classical mechanics", "emoji": "🍎", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "newton", "classical physics"], "era": "1687 \"Mathematical Principles of Natural Philosophy\"", "oneLiner": "Inertia, F=ma, action force and reaction force - describe how objects move in the macroscopic low-speed world.", "people": [{"role": "Establish a system", "name": "Isaac Newton", "years": "1643–1727"}], "related": ["newton-gravity", "momentum", "work-energy", "angular-momentum"], "sections": {"story": "\n<p>Apples falling to the ground and cannonballs flying used to depend on Aristotle's intuition. Newton used three laws to weld \"force\" and \"motion\" together, and classical mechanics was launched.</p>\n<div class=\"fun-box\"><strong>Scope of application:</strong>It is useful for daily speed and macroscopic objects; when approaching the speed of light or atomic scale, it should be replaced by relativity/quantum.</div>\n", "statement": "\n<p class=\"plain-lead\"><strong>First remember:</strong>① Uniform speed (or rest) without force; ② Force changes momentum, F=ma; ③ If you push the wall, the wall will push you.</p>\n<p><strong>First Law (Inertia):</strong>When there is no external force (or the net force is zero), the particle remains at rest or moves in a straight line at a constant speed.</p>\n<p><strong>Second law:</strong></p>\n<div class=\"formula\" data-latex=\"\\vec{F}=\\dfrac{d\\vec{p}}{dt}=m\\vec{a}\\quad(\\text{质量恒定时})\"></div>\n<p><strong>The third law:</strong>Action force and reaction force are equal, opposite, and collinear, acting on two objects respectively.</p>\n<div class=\"formula\" data-latex=\"\\vec{F}_{12}=-\\vec{F}_{21}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">inertial reference frame</div>\n<p>The reference frame in which the first law is established is called the inertial frame. The earth approximates an inertial frame; an accelerating elevator does not.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">momentum</div>\n<p><span data-latex=\"\\vec{p}=m\\vec{v}\">p=mv</span>. The cleanest way to write the second law is that force equals the rate of change of momentum.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>This is not a mathematical theorem \"deduced\" from simpler axioms, but a highly compressed summary of nature; its correctness depends on countless experiments and engineering success.</p>\n<ol class=\"steps\">\n<li><strong>inertia:</strong>On a sufficiently smooth air cushion guide rail, the slider moves at approximately a constant speed - the smaller the external force, the less \"lazy\" the speed will be.</li>\n<li><strong>F=ma：</strong>For the same object, doubling the force doubles the acceleration; the greater the mass, the harder it is to accelerate. This is the core of the experiment that defines the force/validation ratio.</li>\n<li><strong>reaction:</strong>Two cars collide, skaters push each other, momentum exchanges and other big reverses - the third party (the Earth) is sometimes hidden in the details.</li>\n</ol>\n<p class=\"qed\">(Laws of physics: experimental induction + system self-consistency)</p>\n", "deep": "\n<p>The Lagrangian/Hamiltonian form rewrites Newtonian mechanics into the \"extreme value principle\", paving the way for quantum and field theory. In the theory of relativity, F=dp/dt is still applicable, but the definition of p has changed.</p>\n", "why": "\n<p>Bridges, cars, satellite launches, robot control - macro-engineering defaults to the Newtonian framework.</p>\n", "try": "\n<ul>\n<li>If you stand on the scale and suddenly squat down, how will the reading change? Explain with the second law.</li>\n<li>Why does shooting recoil? Third Law + Momentum.</li>\n</ul>\n"}}}, "title": "Newton's laws of motion", "subtitle": "Three cornerstones of classical mechanics", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "newton", "classical physics"], "era": "1687 \"Mathematical Principles of Natural Philosophy\"", "oneLiner": "Inertia, F=ma, action force and reaction force - describe how objects move in the macroscopic low-speed world.", "people": [{"role": "Establish a system", "name": "Isaac Newton", "years": "1643–1727"}], "sections": {"story": "\n<p>Apples falling to the ground and cannonballs flying used to depend on Aristotle's intuition. Newton used three laws to weld \"force\" and \"motion\" together, and classical mechanics was launched.</p>\n<div class=\"fun-box\"><strong>Scope of application:</strong>It is useful for daily speed and macroscopic objects; when approaching the speed of light or atomic scale, it should be replaced by relativity/quantum.</div>\n", "statement": "\n<p class=\"plain-lead\"><strong>First remember:</strong>① Uniform speed (or rest) without force; ② Force changes momentum, F=ma; ③ If you push the wall, the wall will push you.</p>\n<p><strong>First Law (Inertia):</strong>When there is no external force (or the net force is zero), the particle remains at rest or moves in a straight line at a constant speed.</p>\n<p><strong>Second law:</strong></p>\n<div class=\"formula\" data-latex=\"\\vec{F}=\\dfrac{d\\vec{p}}{dt}=m\\vec{a}\\quad(\\text{质量恒定时})\"></div>\n<p><strong>The third law:</strong>Action force and reaction force are equal, opposite, and collinear, acting on two objects respectively.</p>\n<div class=\"formula\" data-latex=\"\\vec{F}_{12}=-\\vec{F}_{21}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">inertial reference frame</div>\n<p>The reference frame in which the first law is established is called the inertial frame. The earth approximates an inertial frame; an accelerating elevator does not.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">momentum</div>\n<p><span data-latex=\"\\vec{p}=m\\vec{v}\">p=mv</span>. The cleanest way to write the second law is that force equals the rate of change of momentum.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>This is not a mathematical theorem \"deduced\" from simpler axioms, but a highly compressed summary of nature; its correctness depends on countless experiments and engineering success.</p>\n<ol class=\"steps\">\n<li><strong>inertia:</strong>On a sufficiently smooth air cushion guide rail, the slider moves at approximately a constant speed - the smaller the external force, the less \"lazy\" the speed will be.</li>\n<li><strong>F=ma：</strong>For the same object, doubling the force doubles the acceleration; the greater the mass, the harder it is to accelerate. This is the core of the experiment that defines the force/validation ratio.</li>\n<li><strong>reaction:</strong>Two cars collide, skaters push each other, momentum exchanges and other big reverses - the third party (the Earth) is sometimes hidden in the details.</li>\n</ol>\n<p class=\"qed\">(Laws of physics: experimental induction + system self-consistency)</p>\n", "deep": "\n<p>The Lagrangian/Hamiltonian form rewrites Newtonian mechanics into the \"extreme value principle\", paving the way for quantum and field theory. In the theory of relativity, F=dp/dt is still applicable, but the definition of p has changed.</p>\n", "why": "\n<p>Bridges, cars, satellite launches, robot control - macro-engineering defaults to the Newtonian framework.</p>\n", "try": "\n<ul>\n<li>If you stand on the scale and suddenly squat down, how will the reading change? Explain with the second law.</li>\n<li>Why does shooting recoil? Third Law + Momentum.</li>\n</ul>\n"}}, {"id": "newton-gravity", "field": "physics", "difficulty": "easy", "emoji": "🌍", "iconClass": "green", "related": ["newton-laws", "kepler", "escape-velocity", "relativity-gr"], "__i18n": {"zh": {"id": "newton-gravity", "field": "physics", "title": "万有引力定律", "subtitle": "苹果与月亮服从同一条式子", "emoji": "🌍", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["力学", "引力", "牛顿"], "era": "1687；卡文迪许测 G", "oneLiner": "两质点互相吸引，力与质量乘积成正比、与距离平方成反比。", "people": [{"role": "提出", "name": "牛顿", "years": "1687"}, {"role": "测定 G", "name": "卡文迪许", "years": "1798"}], "related": ["newton-laws", "kepler", "escape-velocity", "relativity-gr"], "sections": {"story": "\n          <p>地面落体和天体运行曾是两套故事。牛顿说：都是引力。月亮也在「掉向地球」，只是速度够快，一直掉在轨道上。</p>\n        ", "statement": "\n          <p>两质点质量 <span data-latex=\"m_1,m_2\">m₁,m₂</span>，距离 <span data-latex=\"r\">r</span>：</p>\n          <div class=\"formula\" data-latex=\"F=G\\dfrac{m_1 m_2}{r^2}\"></div>\n          <p>方向沿连线互相吸引。<span data-latex=\"G\">G</span> 为引力常量，约 <span data-latex=\"6.67\\times 10^{-11}\\,\\mathrm{N\\,m^2/kg^2}\">6.67×10⁻¹¹</span>。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">质点与球对称</div>\n            <p>均匀球体对外等效于质量集中在球心（牛顿壳层定理）——所以把地球当地心质点常常够用。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">与开普勒</div>\n            <p>在平方反比引力下，可推出行星轨道为圆锥曲线，周期满足开普勒第三定律。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>定律本身来自观测归纳与数学推演的闭环：假设平方反比 → 推出开普勒；卡文迪许在实验室测出 G。</p>\n          <ol class=\"steps\">\n            <li>从开普勒定律反推：圆周近似下向心力 <span data-latex=\"mv^2/r\">mv²/r</span> 与 <span data-latex=\"1/r^2\">1/r²</span> 一致。</li>\n            <li>推广到任意两质点，引入普适 G。</li>\n            <li>卡文迪许扭秤：测出小球间微弱引力，定出 G 的数量级。</li>\n          </ol>\n        ", "deep": "\n          <p>广义相对论用时空弯曲取代「超距力」，但在弱场低速下精确回到牛顿公式。</p>\n        ", "why": "\n          <p>卫星轨道、潮汐、称重「g」、宇宙大尺度结构的经典起点。</p>\n        ", "try": "\n          <ul>\n            <li>用 g=GM/R² 估算地球质量（已知 g、R、G）。</li>\n            <li>距离加倍，引力变为原来的多少？</li>\n          </ul>\n        "}}, "en": {"id": "newton-gravity", "field": "physics", "title": "law of universal gravitation", "subtitle": "The apple and the moon obey the same formula", "emoji": "🌍", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "gravitational", "newton"], "era": "1687; Cavendish test G", "oneLiner": "Two particles attract each other, and the force is directly proportional to the product of mass and inversely proportional to the square of the distance.", "people": [{"role": "propose", "name": "newton", "years": "1687"}, {"role": "Determine G", "name": "Cavendish", "years": "1798"}], "related": ["newton-laws", "kepler", "escape-velocity", "relativity-gr"], "sections": {"story": "\n<p>Falling objects on the ground and movement of celestial bodies used to be two sets of stories. Newton said: It's all gravity. The moon is also \"falling towards the earth\", but it is fast enough to keep falling in orbit.</p>\n", "statement": "\n<p>mass of two particles <span data-latex=\"m_1,m_2\">m₁,m₂</span>,distance <span data-latex=\"r\">r</span>：</p>\n<div class=\"formula\" data-latex=\"F=G\\dfrac{m_1 m_2}{r^2}\"></div>\n<p>Directions attract each other along the connecting line.<span data-latex=\"G\">G</span> is the gravitational constant, approximately <span data-latex=\"6.67\\times 10^{-11}\\,\\mathrm{N\\,m^2/kg^2}\">6.67×10⁻¹¹</span>。</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Point and ball symmetry</div>\n<p>The external equivalent of a uniform sphere is that the mass is concentrated at the center of the sphere (Newton's shell theorem) - so the earth's center mass is often sufficient.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">with Kepler</div>\n<p>Under the inverse square gravity, it can be deduced that the planet's orbit is a conic section, and its period satisfies Kepler's third law.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The law itself comes from a closed loop of observational induction and mathematical deduction: assuming inverse square → derived from Kepler; Cavendish measured G in the laboratory.</p>\n<ol class=\"steps\">\n<li>Deduced from Kepler's law: centripetal force under circumferential approximation <span data-latex=\"mv^2/r\">mv²/r</span> and <span data-latex=\"1/r^2\">1/r²</span> consistent.</li>\n<li>It is extended to any two material points and universal G is introduced.</li>\n<li>Cavendish torsion scale: measure the weak gravitational force between small balls and determine the order of magnitude of G.</li>\n</ol>\n", "deep": "\n<p>General relativity replaces the \"force at a distance\" with the curvature of space-time, but accurately returns to Newton's formula in weak fields and low speeds.</p>\n", "why": "\n<p>Satellite orbits, tides, weight \"g\", the classic starting point for the large-scale structure of the universe.</p>\n", "try": "\n<ul>\n<li>Estimate the Earth's mass (given g, R, G) using g=GM/R².</li>\n<li>How much does gravity change when the distance doubles?</li>\n</ul>\n"}}}, "title": "law of universal gravitation", "subtitle": "The apple and the moon obey the same formula", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "gravitational", "newton"], "era": "1687; Cavendish test G", "oneLiner": "Two particles attract each other, and the force is directly proportional to the product of mass and inversely proportional to the square of the distance.", "people": [{"role": "propose", "name": "newton", "years": "1687"}, {"role": "Determine G", "name": "Cavendish", "years": "1798"}], "sections": {"story": "\n<p>Falling objects on the ground and movement of celestial bodies used to be two sets of stories. Newton said: It's all gravity. The moon is also \"falling towards the earth\", but it is fast enough to keep falling in orbit.</p>\n", "statement": "\n<p>mass of two particles <span data-latex=\"m_1,m_2\">m₁,m₂</span>,distance <span data-latex=\"r\">r</span>：</p>\n<div class=\"formula\" data-latex=\"F=G\\dfrac{m_1 m_2}{r^2}\"></div>\n<p>Directions attract each other along the connecting line.<span data-latex=\"G\">G</span> is the gravitational constant, approximately <span data-latex=\"6.67\\times 10^{-11}\\,\\mathrm{N\\,m^2/kg^2}\">6.67×10⁻¹¹</span>。</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Point and ball symmetry</div>\n<p>The external equivalent of a uniform sphere is that the mass is concentrated at the center of the sphere (Newton's shell theorem) - so the earth's center mass is often sufficient.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">with Kepler</div>\n<p>Under the inverse square gravity, it can be deduced that the planet's orbit is a conic section, and its period satisfies Kepler's third law.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The law itself comes from a closed loop of observational induction and mathematical deduction: assuming inverse square → derived from Kepler; Cavendish measured G in the laboratory.</p>\n<ol class=\"steps\">\n<li>Deduced from Kepler's law: centripetal force under circumferential approximation <span data-latex=\"mv^2/r\">mv²/r</span> and <span data-latex=\"1/r^2\">1/r²</span> consistent.</li>\n<li>It is extended to any two material points and universal G is introduced.</li>\n<li>Cavendish torsion scale: measure the weak gravitational force between small balls and determine the order of magnitude of G.</li>\n</ol>\n", "deep": "\n<p>General relativity replaces the \"force at a distance\" with the curvature of space-time, but accurately returns to Newton's formula in weak fields and low speeds.</p>\n", "why": "\n<p>Satellite orbits, tides, weight \"g\", the classic starting point for the large-scale structure of the universe.</p>\n", "try": "\n<ul>\n<li>Estimate the Earth's mass (given g, R, G) using g=GM/R².</li>\n<li>How much does gravity change when the distance doubles?</li>\n</ul>\n"}}, {"id": "energy-conservation", "field": "physics", "difficulty": "easy", "emoji": "⚡", "iconClass": "", "related": ["newton-laws", "work-energy", "thermo-1", "momentum"], "__i18n": {"zh": {"id": "energy-conservation", "field": "physics", "title": "机械能守恒与能量守恒", "subtitle": "能量不会无故消失，只会换张脸", "emoji": "⚡", "iconClass": "", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["力学", "能量", "守恒"], "era": "19 世纪能量概念成熟；力学守恒更早", "oneLiner": "只有保守力做功时，动能+势能不变；更一般地，孤立系统总能量守恒。", "people": [{"role": "力学发展", "name": "惠更斯、莱布尼茨等", "years": "17 世纪"}, {"role": "普遍能量守恒", "name": "迈尔、焦耳、亥姆霍兹等", "years": "19 世纪"}], "related": ["newton-laws", "work-energy", "thermo-1", "momentum"], "sections": {"story": "\n          <p>过山车最高点最慢、最低点最快——高度换成速度。能量守恒说：账本两边要平，可以变形，不能凭空造或毁（在适用条件下）。</p>\n        ", "statement": "\n          <p><strong>机械能守恒：</strong>仅保守力做功时</p>\n          <div class=\"formula\" data-latex=\"E_k+E_p=\\mathrm{const}\"></div>\n          <p>例如重力附近：</p>\n          <div class=\"formula\" data-latex=\"\\tfrac12 mv^2+mgh=\\mathrm{const}\"></div>\n          <p><strong>普遍能量守恒：</strong>孤立系统总能量（含热、化学、电磁…）保持不变——热力学第一定律的灵魂。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">保守力</div>\n            <p>做功与路径无关（只取决于起点终点），如重力、静电力。摩擦力通常不保守，机械能会「漏」成热。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">动能定理</div>\n            <p>合力做功 = 动能变化：<span data-latex=\"W=\\Delta E_k\">W=ΔE_k</span>。保守力功 = −ΔE_p，故 E_k+E_p 不变。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>力做的功变成动能；若这功又能写成势能差的减少，两项一加就守恒。</p>\n          <ol class=\"steps\">\n            <li>由牛顿第二定律沿路径积分：<div class=\"calc-line\" data-latex=\"\\int \\vec{F}\\cdot d\\vec{r}=\\Delta(\\tfrac12 mv^2)\"></div></li>\n            <li>若 <span data-latex=\"\\vec{F}=-\\nabla V\">F=−∇V</span>（保守），则左边 = <span data-latex=\"-\\Delta V\">−ΔV</span>。</li>\n            <li>故 <span data-latex=\"\\Delta(\\tfrac12 mv^2+V)=0\">Δ(½mv²+V)=0</span>。</li>\n          </ol>\n        ", "deep": "\n          <p>诺特定理：时间平移对称性 ↔ 能量守恒。现代物理把守恒律和对称性绑在一起。</p>\n        ", "why": "\n          <p>估测速、设计过山车、分析碰撞（常配合动量）、理解永动机为何不可能。</p>\n        ", "try": "\n          <ul>\n            <li>从高 h 静止滑下（无摩擦），落地速度？</li>\n            <li>有摩擦时机械能去哪了？</li>\n          </ul>\n        "}}, "en": {"id": "energy-conservation", "field": "physics", "title": "Conservation of Mechanical Energy and Conservation of Energy", "subtitle": "Energy will not disappear for no reason, it will only change its face", "emoji": "⚡", "iconClass": "", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "energy", "conservation"], "era": "The concept of energy matured in the 19th century; conservation of mechanics was earlier", "oneLiner": "When only conservative forces do work, kinetic energy + potential energy remain unchanged; more generally, the total energy of an isolated system is conserved.", "people": [{"role": "Development of mechanics", "name": "Huygens, Leibniz, etc.", "years": "17th century"}, {"role": "universal conservation of energy", "name": "Mayer, Joule, Helmholtz, etc.", "years": "19th century"}], "related": ["newton-laws", "work-energy", "thermo-1", "momentum"], "sections": {"story": "\n<p>A roller coaster is slowest at its highest point and fastest at its lowest point—height is exchanged for speed. Energy conservation theory: The ledger must be flat on both sides, can be deformed, and cannot be created or destroyed out of thin air (under applicable conditions).</p>\n", "statement": "\n<p><strong>Conservation of mechanical energy:</strong>When only conservative force does work</p>\n<div class=\"formula\" data-latex=\"E_k+E_p=\\mathrm{const}\"></div>\n<p>For example, near gravity:</p>\n<div class=\"formula\" data-latex=\"\\tfrac12 mv^2+mgh=\\mathrm{const}\"></div>\n<p><strong>Universal conservation of energy:</strong>The total energy of an isolated system (including heat, chemistry, electromagnetism...) remains unchanged - the soul of the first law of thermodynamics.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">conservative force</div>\n<p>The work done has nothing to do with the path (it only depends on the starting point and the end point), such as gravity and electrostatic force. Friction is usually not conservative and mechanical energy \"leaks\" into heat.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Kinetic energy theorem</div>\n<p>Resultant work = change in kinetic energy:<span data-latex=\"W=\\Delta E_k\">W=ΔE_k</span>. Conservative force work = −ΔE_p, so E_k+E_p remains unchanged.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The work done by the force becomes kinetic energy; if this work can be written as the reduction of the potential energy difference, the addition of the two terms will be conserved.</p>\n<ol class=\"steps\">\n<li>Integrate along the path by Newton's second law:<div class=\"calc-line\" data-latex=\"\\int \\vec{F}\\cdot d\\vec{r}=\\Delta(\\tfrac12 mv^2)\"></div></li>\n<li>like <span data-latex=\"\\vec{F}=-\\nabla V\">F=−∇V</span>(conservative), then the left side = <span data-latex=\"-\\Delta V\">−ΔV</span>。</li>\n<li>Therefore <span data-latex=\"\\Delta(\\tfrac12 mv^2+V)=0\">Δ(½mv²+V)=0</span>。</li>\n</ol>\n", "deep": "\n<p>Noether's theorem: Time translation symmetry ↔ Energy conservation. Modern physics ties conservation laws and symmetries together.</p>\n", "why": "\n<p>Estimating speed, designing roller coasters, analyzing collisions (often with momentum), and understanding why perpetual motion is impossible.</p>\n", "try": "\n<ul>\n<li>When sliding down from a height h at rest (no friction), what is the landing speed?</li>\n<li>Where does the mechanical energy go when there is friction?</li>\n</ul>\n"}}}, "title": "Conservation of Mechanical Energy and Conservation of Energy", "subtitle": "Energy will not disappear for no reason, it will only change its face", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "energy", "conservation"], "era": "The concept of energy matured in the 19th century; conservation of mechanics was earlier", "oneLiner": "When only conservative forces do work, kinetic energy + potential energy remain unchanged; more generally, the total energy of an isolated system is conserved.", "people": [{"role": "Development of mechanics", "name": "Huygens, Leibniz, etc.", "years": "17th century"}, {"role": "universal conservation of energy", "name": "Mayer, Joule, Helmholtz, etc.", "years": "19th century"}], "sections": {"story": "\n<p>A roller coaster is slowest at its highest point and fastest at its lowest point—height is exchanged for speed. Energy conservation theory: The ledger must be flat on both sides, can be deformed, and cannot be created or destroyed out of thin air (under applicable conditions).</p>\n", "statement": "\n<p><strong>Conservation of mechanical energy:</strong>When only conservative force does work</p>\n<div class=\"formula\" data-latex=\"E_k+E_p=\\mathrm{const}\"></div>\n<p>For example, near gravity:</p>\n<div class=\"formula\" data-latex=\"\\tfrac12 mv^2+mgh=\\mathrm{const}\"></div>\n<p><strong>Universal conservation of energy:</strong>The total energy of an isolated system (including heat, chemistry, electromagnetism...) remains unchanged - the soul of the first law of thermodynamics.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">conservative force</div>\n<p>The work done has nothing to do with the path (it only depends on the starting point and the end point), such as gravity and electrostatic force. Friction is usually not conservative and mechanical energy \"leaks\" into heat.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Kinetic energy theorem</div>\n<p>Resultant work = change in kinetic energy:<span data-latex=\"W=\\Delta E_k\">W=ΔE_k</span>. Conservative force work = −ΔE_p, so E_k+E_p remains unchanged.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The work done by the force becomes kinetic energy; if this work can be written as the reduction of the potential energy difference, the addition of the two terms will be conserved.</p>\n<ol class=\"steps\">\n<li>Integrate along the path by Newton's second law:<div class=\"calc-line\" data-latex=\"\\int \\vec{F}\\cdot d\\vec{r}=\\Delta(\\tfrac12 mv^2)\"></div></li>\n<li>like <span data-latex=\"\\vec{F}=-\\nabla V\">F=−∇V</span>(conservative), then the left side = <span data-latex=\"-\\Delta V\">−ΔV</span>。</li>\n<li>Therefore <span data-latex=\"\\Delta(\\tfrac12 mv^2+V)=0\">Δ(½mv²+V)=0</span>。</li>\n</ol>\n", "deep": "\n<p>Noether's theorem: Time translation symmetry ↔ Energy conservation. Modern physics ties conservation laws and symmetries together.</p>\n", "why": "\n<p>Estimating speed, designing roller coasters, analyzing collisions (often with momentum), and understanding why perpetual motion is impossible.</p>\n", "try": "\n<ul>\n<li>When sliding down from a height h at rest (no friction), what is the landing speed?</li>\n<li>Where does the mechanical energy go when there is friction?</li>\n</ul>\n"}}, {"id": "momentum", "field": "physics", "difficulty": "easy", "emoji": "🏒", "iconClass": "warm", "related": ["newton-laws", "angular-momentum", "work-energy", "energy-conservation"], "__i18n": {"zh": {"id": "momentum", "field": "physics", "title": "动量守恒定律", "subtitle": "内力再怎么推，总动量不变", "emoji": "🏒", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["力学", "守恒", "碰撞"], "era": "笛卡儿、惠更斯、牛顿时代形成", "oneLiner": "系统不受外力（或外力矢量和为零）时，总动量保持不变。", "people": [{"role": "体系化", "name": "牛顿等", "years": "17 世纪"}], "related": ["newton-laws", "angular-momentum", "work-energy", "energy-conservation"], "sections": {"story": "\n          <p>两冰球相撞，各速度变了，但「质量×速度」加起来可以不变。火箭喷气向前走，也是动量守恒：往后喷气，箭体往前。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"\\sum_i \\vec{p}_i = \\mathrm{const}\\quad(\\sum \\vec{F}_{\\mathrm{ext}}=0)\"></div>\n          <p>一维碰撞常用：</p>\n          <div class=\"formula\" data-latex=\"m_1 v_1+m_2 v_2=m_1 v_1'+m_2 v_2'\"></div>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">内力与外力</div>\n            <p>系统内物体间的力成对出现（第三定律），对总动量的贡献抵消；只有外力能改变总动量。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">冲量</div>\n            <p><span data-latex=\"\\vec{J}=\\int\\vec{F}dt=\\Delta\\vec{p}\">J=∫F dt=Δp</span>。短时间大力（碰撞）用冲量分析很方便。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>把系统里所有牛顿第二定律加起来，内力两两抵消，剩下外力管总动量变化。</p>\n          <ol class=\"steps\">\n            <li>对每个质点：<span data-latex=\"\\dot{\\vec{p}}_i=\\vec{F}_i^{\\mathrm{ext}}+\\sum_j\\vec{F}_{ji}\">ṗᵢ=F_ext+内力</span>。</li>\n            <li>求和：内力成对反向，和为零。</li>\n            <li>故 <span data-latex=\"\\frac{d}{dt}\\sum\\vec{p}_i=\\sum\\vec{F}^{\\mathrm{ext}}\">dP/dt=F_ext</span>。外力为零则总动量守恒。</li>\n          </ol>\n        ", "deep": "\n          <p>弹性碰撞还守恒动能；完全非弹性碰撞动能不守恒，但动量仍守恒（无外力时）。</p>\n        ", "why": "\n          <p>碰撞分析、火箭方程、粒子物理「看不见的粒子」用动量缺口反推。</p>\n        ", "try": "\n          <ul>\n            <li>等质量一维弹性碰撞，交换速度——用守恒验证。</li>\n            <li>人在船上走路，船怎么动？</li>\n          </ul>\n        "}}, "en": {"id": "momentum", "field": "physics", "title": "law of conservation of momentum", "subtitle": "No matter how hard the internal force pushes, the total momentum remains unchanged.", "emoji": "🏒", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "conservation", "collision"], "era": "Formed in the era of Descartes, Huygens and Newton", "oneLiner": "When there are no external forces on the system (or the vector sum of the external forces is zero), the total momentum remains unchanged.", "people": [{"role": "Systematization", "name": "Newton et al.", "years": "17th century"}], "related": ["newton-laws", "angular-momentum", "work-energy", "energy-conservation"], "sections": {"story": "\n<p>When two ice balls collide, their respective velocities change, but the sum of \"mass x velocity\" remains unchanged. When a rocket jet moves forward, momentum is conserved: when it jets backward, the rocket body moves forward.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\sum_i \\vec{p}_i = \\mathrm{const}\\quad(\\sum \\vec{F}_{\\mathrm{ext}}=0)\"></div>\n<p>One-dimensional collision is commonly used:</p>\n<div class=\"formula\" data-latex=\"m_1 v_1+m_2 v_2=m_1 v_1'+m_2 v_2'\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Internal and external forces</div>\n<p>Forces between objects in a system appear in pairs (third law), and their contributions to the total momentum cancel out; only external forces can change the total momentum.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Impulse</div>\n<p><span data-latex=\"\\vec{J}=\\int\\vec{F}dt=\\Delta\\vec{p}\">J=∫F dt=Δp</span>. It is very convenient to use impulse analysis for short-term strong forces (collision).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Adding up all Newton's second laws in the system, the internal forces cancel each other out, leaving the external force to account for the total momentum change.</p>\n<ol class=\"steps\">\n<li>For each particle:<span data-latex=\"\\dot{\\vec{p}}_i=\\vec{F}_i^{\\mathrm{ext}}+\\sum_j\\vec{F}_{ji}\">ṗᵢ=F_ext+内力</span>。</li>\n<li>Summation: Internal forces are in opposite directions and the sum is zero.</li>\n<li>Therefore <span data-latex=\"\\frac{d}{dt}\\sum\\vec{p}_i=\\sum\\vec{F}^{\\mathrm{ext}}\">dP/dt=F_ext</span>. If the external force is zero then total momentum is conserved.</li>\n</ol>\n", "deep": "\n<p>Elastic collisions also conserve kinetic energy; completely inelastic collisions do not conserve kinetic energy, but momentum is still conserved (when there are no external forces).</p>\n", "why": "\n<p>Collision analysis, rocket equations, and particle physics \"invisible particles\" are inferred using momentum gaps.</p>\n", "try": "\n<ul>\n<li>One-dimensional elastic collision of equal masses, exchange of velocities - verified by conservation.</li>\n<li>If people walk on the boat, how will the boat move?</li>\n</ul>\n"}}}, "title": "law of conservation of momentum", "subtitle": "No matter how hard the internal force pushes, the total momentum remains unchanged.", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "conservation", "collision"], "era": "Formed in the era of Descartes, Huygens and Newton", "oneLiner": "When there are no external forces on the system (or the vector sum of the external forces is zero), the total momentum remains unchanged.", "people": [{"role": "Systematization", "name": "Newton et al.", "years": "17th century"}], "sections": {"story": "\n<p>When two ice balls collide, their respective velocities change, but the sum of \"mass x velocity\" remains unchanged. When a rocket jet moves forward, momentum is conserved: when it jets backward, the rocket body moves forward.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\sum_i \\vec{p}_i = \\mathrm{const}\\quad(\\sum \\vec{F}_{\\mathrm{ext}}=0)\"></div>\n<p>One-dimensional collision is commonly used:</p>\n<div class=\"formula\" data-latex=\"m_1 v_1+m_2 v_2=m_1 v_1'+m_2 v_2'\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Internal and external forces</div>\n<p>Forces between objects in a system appear in pairs (third law), and their contributions to the total momentum cancel out; only external forces can change the total momentum.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Impulse</div>\n<p><span data-latex=\"\\vec{J}=\\int\\vec{F}dt=\\Delta\\vec{p}\">J=∫F dt=Δp</span>. It is very convenient to use impulse analysis for short-term strong forces (collision).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Adding up all Newton's second laws in the system, the internal forces cancel each other out, leaving the external force to account for the total momentum change.</p>\n<ol class=\"steps\">\n<li>For each particle:<span data-latex=\"\\dot{\\vec{p}}_i=\\vec{F}_i^{\\mathrm{ext}}+\\sum_j\\vec{F}_{ji}\">ṗᵢ=F_ext+内力</span>。</li>\n<li>Summation: Internal forces are in opposite directions and the sum is zero.</li>\n<li>Therefore <span data-latex=\"\\frac{d}{dt}\\sum\\vec{p}_i=\\sum\\vec{F}^{\\mathrm{ext}}\">dP/dt=F_ext</span>. If the external force is zero then total momentum is conserved.</li>\n</ol>\n", "deep": "\n<p>Elastic collisions also conserve kinetic energy; completely inelastic collisions do not conserve kinetic energy, but momentum is still conserved (when there are no external forces).</p>\n", "why": "\n<p>Collision analysis, rocket equations, and particle physics \"invisible particles\" are inferred using momentum gaps.</p>\n", "try": "\n<ul>\n<li>One-dimensional elastic collision of equal masses, exchange of velocities - verified by conservation.</li>\n<li>If people walk on the boat, how will the boat move?</li>\n</ul>\n"}}, {"id": "thermo-1", "field": "physics", "difficulty": "easy", "emoji": "🔥", "iconClass": "warm", "related": ["thermo-2", "ideal-gas", "equipartition", "energy-conservation"], "__i18n": {"zh": {"id": "thermo-1", "field": "physics", "title": "热力学第一定律", "subtitle": "能量守恒的热学版", "emoji": "🔥", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["热力学", "能量", "热机"], "era": "焦耳、亥姆霍兹、克劳修斯等，19 世纪中叶", "oneLiner": "系统内能变化 = 吸收的热 − 对外做的功（符号约定以教材为准）。", "people": [{"role": "热功当量", "name": "焦耳", "years": "1840s"}, {"role": "表述完善", "name": "克劳修斯等", "years": "19 世纪"}], "related": ["thermo-2", "ideal-gas", "equipartition", "energy-conservation"], "sections": {"story": "\n          <p>永动机梦碎于此：你不能无中生有能量。给系统加热、对系统做功，内能就变；热机把热部分变成功，但账必须平。</p>\n        ", "statement": "\n          <p>常见约定（系统吸热为正、系统对外做功为正）：</p>\n          <div class=\"formula\" data-latex=\"\\Delta U=Q-W\"></div>\n          <p>微分形式：</p>\n          <div class=\"formula\" data-latex=\"dU=\\delta Q-\\delta W\"></div>\n
