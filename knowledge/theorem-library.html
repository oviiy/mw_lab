      <svg viewBox="0 0 520 300" class="ix-svg"></svg>
      <div class="ix-readout" data-out></div>
    `;
    const svg = wrap.querySelector("svg");
    const out = wrap.querySelector("[data-out]");
    const stepLab = wrap.querySelector('[data-v="step"]');
    let timer = null;

    function draw(step) {
      stepLab.textContent = step;
      const t = step / 100;
      const n = 5;
      const colors = ["#6eb5ff", "#ff9f6e", "#b08cff", "#3dcc8c", "#fbbf24"];
      let polys = "";
      for (let i = 0; i < n; i++) {
        const spread = 40 * (1 - t); // base separation shrinks
        const baseX = 80 + i * (spread + 8) + t * 70;
        const tipX = 200 + i * (8 + (1 - t) * 25) + t * 40;
        const tipY = 40 + i * 4;
        const bw = 36 + (1 - t) * 10;
        polys += `<polygon points="${baseX},250 ${baseX + bw},250 ${tipX},${tipY}"
          fill="${colors[i]}" fill-opacity="0.35" stroke="${colors[i]}" stroke-width="1.5"/>`;
      }
      const areaFactor = (1 - 0.55 * t).toFixed(2);
      svg.innerHTML = `
        <rect width="520" height="300" fill="#0f172a" rx="12"/>
        ${polys}
        <text x="20" y="28" fill="#94a3b8" font-size="13">相对面积 ≈ ${areaFactor} × 初始</text>
        <text x="20" y="280" fill="#64748b" font-size="12">黄框：底侧重叠区随滑动增大</text>
        <ellipse cx="${220 + t * 60}" cy="248" rx="${50 + t * 40}" ry="14" fill="none" stroke="#fbbf24" stroke-dasharray="4 3"/>
      `;
      out.innerHTML = t < 0.5 ? "片分开，面积大" : "底侧重叠，并集变小";
    }

    const slider = wrap.querySelector('[data-k="step"]');
    slider.addEventListener("input", () => draw(+slider.value));
    wrap.querySelector("[data-play]").addEventListener("click", () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
        return;
      }
      timer = setInterval(() => {
        let v = +slider.value + 2;
        if (v > 100) v = 0;
        slider.value = v;
        draw(v);
      }, 40);
    });
    draw(0);
    return wrap;
  }

  /* ========== 素数定理：π(x) 曲线 ========== */
  function pntChart() {
    const wrap = el(`<div class="ix-card"></div>`);
    wrap.innerHTML = `
      <div class="ix-title">π(x) 与 x/ln x</div>
      <p class="ix-desc">拖动 X 比较素数计数与渐近近似</p>
      <div class="ix-controls">
        <label>查看上限 X <span data-v="X">200</span>
          <input type="range" min="30" max="500" value="200" data-k="X" />
        </label>
      </div>
      <svg viewBox="0 0 520 300" class="ix-svg"></svg>
      <div class="ix-readout" data-out></div>
    `;
    // sieve primes up to 500
    const N = 500;
    const isP = new Uint8Array(N + 1);
    isP.fill(1);
    isP[0] = isP[1] = 0;
    for (let i = 2; i * i <= N; i++) if (isP[i]) for (let j = i * i; j <= N; j += i) isP[j] = 0;
    const pi = new Array(N + 1).fill(0);
    for (let i = 1; i <= N; i++) pi[i] = pi[i - 1] + (isP[i] ? 1 : 0);

    const svg = wrap.querySelector("svg");
    const out = wrap.querySelector("[data-out]");
    const lab = wrap.querySelector('[data-v="X"]');

    function draw() {
      const X = +wrap.querySelector('[data-k="X"]').value;
      lab.textContent = X;
      const W = 480,
        H = 220,
        ox = 30,
        oy = 260;
      const maxY = Math.max(pi[X], X / Math.log(X)) * 1.15;
      function mapX(x) {
        return ox + (x / X) * W;
      }
      function mapY(y) {
        return oy - (y / maxY) * H;
      }
      let pathPi = "";
      let pathLi = "";
      const step = Math.max(1, Math.floor(X / 120));
      for (let x = 2; x <= X; x += step) {
        const cmd = x === 2 ? "M" : "L";
        pathPi += `${cmd}${mapX(x)},${mapY(pi[x])} `;
        pathLi += `${cmd}${mapX(x)},${mapY(x / Math.log(x))} `;
      }
      // finish at X
      pathPi += `L${mapX(X)},${mapY(pi[X])}`;
      pathLi += `L${mapX(X)},${mapY(X / Math.log(X))}`;
      svg.innerHTML = `
        <rect width="520" height="300" fill="#0f172a" rx="12"/>
        <line x1="${ox}" y1="${oy}" x2="${ox + W}" y2="${oy}" stroke="#334155"/>
        <line x1="${ox}" y1="${oy}" x2="${ox}" y2="${oy - H}" stroke="#334155"/>
        <path d="${pathPi}" fill="none" stroke="#6eb5ff" stroke-width="2.5"/>
        <path d="${pathLi}" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="40" y="28" fill="#6eb5ff" font-size="13">π(x) 实线</text>
        <text x="140" y="28" fill="#fbbf24" font-size="13">x/ln x 虚线</text>
        <text x="${ox + W - 10}" y="${oy + 18}" fill="#94a3b8" font-size="12" text-anchor="end">x</text>
      `;
      const p = pi[X];
      const approx = X / Math.log(X);
      const ratio = p / approx;
      out.innerHTML = `π(${X})=${p}，X/ln X≈${approx.toFixed(1)}，比值≈${ratio.toFixed(3)} → 1 (x→∞)`;
    }
    wrap.querySelector("input").addEventListener("input", draw);
    draw();
    return wrap;
  }

  /* ========== 黎曼映射：区域 → 圆盘 示意 ========== */
  function riemannMap() {
    const wrap = el(`<div class="ix-card"></div>`);
    wrap.innerHTML = `
      <div class="ix-title">共形 → 单位圆盘</div>
      <p class="ix-desc">单连通区域全纯双射到 𝔻（保角）</p>
      <div class="ix-controls">
        <label>区域怪异度 <span data-v="w">30%</span>
          <input type="range" min="0" max="100" value="30" data-k="w" />
        </label>
        <label>映射进度（→圆盘） <span data-v="m">0%</span>
          <input type="range" min="0" max="100" value="0" data-k="m" />
        </label>
      </div>
      <svg viewBox="0 0 520 300" class="ix-svg"></svg>
      <div class="ix-readout" data-out></div>
    `;
    const svg = wrap.querySelector("svg");
    const out = wrap.querySelector("[data-out]");

    function blobPath(cx, cy, R, weird, phase) {
      const pts = [];
      for (let i = 0; i <= 48; i++) {
        const th = (i / 48) * Math.PI * 2;
        const wobble =
          1 +
          weird * 0.35 * Math.sin(3 * th + phase) +
          weird * 0.2 * Math.cos(5 * th - phase);
        const r = R * wobble;
        pts.push([cx + r * Math.cos(th), cy + r * Math.sin(th)]);
      }
      return pts.map((p, i) => (i ? "L" : "M") + p.join(",")).join(" ") + " Z";
    }

    function draw() {
      const w = +wrap.querySelector('[data-k="w"]').value / 100;
      const m = +wrap.querySelector('[data-k="m"]').value / 100;
      wrap.querySelector('[data-v="w"]').textContent = Math.round(w * 100) + "%";
      wrap.querySelector('[data-v="m"]').textContent = Math.round(m * 100) + "%";
      const weird = w * (1 - m);
      const R = 70 + m * 10;
      // grid inside
      let grid = "";
      for (let i = -3; i <= 3; i++) {
        const x1 = 150 + i * 18;
        grid += `<line x1="${x1}" y1="80" x2="${150 + i * 18 * (1 - 0.3 * m)}" y2="220" stroke="#334155" stroke-width="1"/>`;

      // right side unit disk grid
      let diskGrid = "";
      for (let k = 1; k <= 3; k++) {
        diskGrid += `<circle cx="380" cy="150" r="${20 * k}" fill="none" stroke="#334155"/>`;
      }
      for (let k = 0; k < 8; k++) {
        const th = (k * Math.PI) / 4;
        diskGrid += `<line x1="380" y1="150" x2="${380 + 60 * Math.cos(th)}" y2="${150 + 60 * Math.sin(th)}" stroke="#334155"/>`;
      }
      const left = blobPath(150, 150, R, weird, 0.5);
      const rightR = 60;
      svg.innerHTML = `
        <rect width="520" height="300" fill="#0f172a" rx="12"/>
        <path d="${left}" fill="rgba(110,181,255,0.25)" stroke="#6eb5ff" stroke-width="2"/>
        ${grid}
        <text x="150" y="40" fill="#6eb5ff" font-size="13" text-anchor="middle">区域 Ω（单连通）</text>
        <path d="M 230 150 L 300 150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

          <path d="M0,0 L6,3 L0,6" fill="#94a3b8"/></marker></defs>
        <circle cx="380" cy="150" r="${rightR}" fill="rgba(61,204,140,0.2)" stroke="#3dcc8c" stroke-width="2"/>
        ${diskGrid}
        <text x="380" y="40" fill="#3dcc8c" font-size="13" text-anchor="middle">单位圆盘 𝔻</text>
        <text x="260" y="280" fill="#fbbf24" font-size="12" text-anchor="middle">f: Ω → 𝔻 全纯双射，f'(z₀)>0 时唯一</text>
      `;
      out.innerHTML = m < 0.5 ? "区域 Ω（单连通）" : "f: Ω→𝔻 全纯双射，规范化后唯一";
    }
    wrap.querySelectorAll("input").forEach((i) => i.addEventListener("input", draw));

  /* ========== 欧几里得：素数无穷 构造 N ========== */
  function euclidPrimes() {
    const wrap = el(`<div class="ix-card"></div>`);
    wrap.innerHTML = `
      <div class="ix-title">欧几里得构造 N = P+1</div>
      <p class="ix-desc">勾选「已知素数」，构造 N 并分解出新素因子</p>
      <div class="ix-controls" data-primes style="flex-wrap:wrap"></div>
      <svg viewBox="0 0 520 200" class="ix-svg"></svg>
      <div class="ix-readout" data-out></div>
    `;
    const primes = [2, 3, 5, 7, 11, 13, 17, 19];
    const box = wrap.querySelector("[data-primes]");
    primes.forEach((p, i) => {
      const lab = document.createElement("label");
      lab.style.cssText = "flex-direction:row;align-items:center;gap:0.35rem;min-width:auto";
      lab.innerHTML = `<input type="checkbox" value="${p}" ${i < 3 ? "checked" : ""}/> ${p}`;
      box.appendChild(lab);
    });
    const svg = wrap.querySelector("svg");
    const out = wrap.querySelector("[data-out]");

    function factorize(n) {
      const f = [];
      let x = n;
      for (let p = 2; p * p <= x; p++) {
        while (x % p === 0) {
          f.push(p);
          x /= p;
        }
      }
      if (x > 1) f.push(x);
      return f;
    }

    function draw() {
      const sel = [...box.querySelectorAll("input:checked")].map((c) => +c.value);
      if (!sel.length) {
        out.textContent = "请至少选一个素数";
        return;
      }
      const P = sel.reduce((a, b) => a * b, 1);
      const N = P + 1;
      const fac = factorize(N);
      const newOnes = fac.filter((p) => !sel.includes(p));
      svg.innerHTML = `
        <rect width="520" height="200" fill="#0f172a" rx="12"/>
        <text x="24" y="40" fill="#94a3b8" font-size="14">名单 p₁…pₖ = {${sel.join(", ")}}</text>
        <text x="24" y="75" fill="#6eb5ff" font-size="16">P = ${sel.join("×")} = ${P}</text>
        <text x="24" y="110" fill="#fbbf24" font-size="18">N = P+1 = ${N}</text>
        <text x="24" y="150" fill="#3dcc8c" font-size="15">N 的素因子：${fac.join(" × ")}</text>
        <text x="24" y="180" fill="#e2e8f0" font-size="14">新素数：${newOnes.length ? newOnes.join(", ") : "（N 本身可能是新素）"}</text>
      `;
      out.innerHTML = `每个旧 p 整除 P 故不整除 N（余 1）。故 N 的素因子必为<strong>新素数</strong> → 名单不可能完备。`;
    }
    box.querySelectorAll("input").forEach((c) => c.addEventListener("change", draw));
    draw();
    return wrap;
  }

  function ivtBisection() {
    const wrap = el(`<div class="ix-card"></div>`);
    wrap.innerHTML = `
      <div class="ix-title">中间值 · 二分法求根</div>

      </div>
      <svg viewBox="0 0 520 280" class="ix-svg"></svg>
      <div class="ix-readout" data-out></div>
    `;
    const f = (x) => x * x * x - x - 1;
    let a = 1,
      b = 2;
    const svg = wrap.querySelector("svg");
    const out = wrap.querySelector("[data-out]");
    function draw() {
      const n = +wrap.querySelector("[data-k=n]").value;

      a = 1;
      b = 2;
      for (let i = 0; i < n; i++) {
        const m = (a + b) / 2;
        if (f(a) * f(m) <= 0) b = m;
        else a = m;
      }
      const m = (a + b) / 2;
      // plot
      const ox = 40,
        oy = 220,
        W = 440,
        H = 160;
      const x0 = 0.5,
        x1 = 2.5;
      function mx(x) {
        return ox + ((x - x0) / (x1 - x0)) * W;
      }
      function my(y) {
        return oy - ((y + 2) / 6) * H;
      }
      let path = "";
      for (let i = 0; i <= 80; i++) {
        const x = x0 + ((x1 - x0) * i) / 80;
        path += `${i ? "L" : "M"}${mx(x)},${my(f(x))} `;
      }
      svg.innerHTML = `
        <rect width="520" height="280" fill="#0f172a" rx="12"/>
        <line x1="${ox}" y1="${my(0)}" x2="${ox + W}" y2="${my(0)}" stroke="#334155"/>
        <path d="${path}" fill="none" stroke="#6eb5ff" stroke-width="2"/>
        <line x1="${mx(a)}" y1="40" x2="${mx(a)}" y2="240" stroke="#fbbf24" stroke-dasharray="4 3"/>
        <line x1="${mx(b)}" y1="40" x2="${mx(b)}" y2="240" stroke="#fbbf24" stroke-dasharray="4 3"/>
        <circle cx="${mx(m)}" cy="${my(f(m))}" r="5" fill="#3dcc8c"/>
        <text x="24" y="28" fill="#e2e8f0" font-size="13">区间 [a,b]=[${a.toFixed(4)}, ${b.toFixed(4)}]</text>
      `;
      out.innerHTML = `中点 m=${m.toFixed(5)}，f(m)=${f(m).toFixed(5)}；长度=${(b - a).toFixed(5)} ≤ 1/2ⁿ`;
    }
    wrap.querySelector("[data-k=n]").addEventListener("input", draw);
    wrap.querySelector("[data-play]").addEventListener("click", () => {
      const inp = wrap.querySelector("[data-k=n]");
      inp.value = Math.min(12, +inp.value + 1);
      draw();
    });
    draw();
    return wrap;
  }

  function mvtVisual() {
    const wrap = el(`<div class="ix-card"></div>`);
    wrap.innerHTML = `
      <div class="ix-title">中值定理 · 割线 ∥ 切线</div>
      <p class="ix-desc">f(x)=x²。存在 ξ 使 f'(ξ)=[f(b)−f(a)]/(b−a)</p>

    const svg = wrap.querySelector("svg");

      const a = +wrap.querySelector("[data-k=a]").value / 10;

      wrap.querySelector("[data-v=b]").textContent = b.toFixed(1);
      if (b <= a + 0.1) return;
      const slope = (b * b - a * a) / (b - a); // = a+b for x²
      const xi = slope / 2; // f'=2x
      const ox = 50,
        oy = 240,
        sx = 90,
        sy = 18;
      function X(x) {
        return ox + x * sx;
      }
      function Y(y) {
        return oy - y * sy;

      let curve = "";

        const x = i * 0.08;
        curve += `${i ? "L" : "M"}${X(x)},${Y(x * x)} `;
      }
      // tangent at xi: y - xi² = 2xi (x-xi)
      const t1 = xi - 0.8,
        t2 = xi + 0.8;
      const y1 = xi * xi + 2 * xi * (t1 - xi);
      const y2 = xi * xi + 2 * xi * (t2 - xi);
      svg.innerHTML = `
        <rect width="520" height="280" fill="#0f172a" rx="12"/>
        <path d="${curve}" fill="none" stroke="#6eb5ff" stroke-width="2"/>
        <line x1="${X(a)}" y1="${Y(a * a)}" x2="${X(b)}" y2="${Y(b * b)}" stroke="#fbbf24" stroke-width="2"/>
        <line x1="${X(t1)}" y1="${Y(y1)}" x2="${X(t2)}" y2="${Y(y2)}" stroke="#3dcc8c" stroke-width="2" stroke-dasharray="5 3"/>
        <circle cx="${X(a)}" cy="${Y(a * a)}" r="4" fill="#fbbf24"/>
        <circle cx="${X(b)}" cy="${Y(b * b)}" r="4" fill="#fbbf24"/>
        <circle cx="${X(xi)}" cy="${Y(xi * xi)}" r="5" fill="#3dcc8c"/>
        <text x="360" y="40" fill="#fbbf24" font-size="13">割线斜率 ${(a + b).toFixed(2)}</text>
        <text x="360" y="62" fill="#3dcc8c" font-size="13">ξ=${xi.toFixed(2)}，f'=2ξ</text>
      `;
      out.innerHTML = `对 f=x²：ξ=(a+b)/2，f'(ξ)=a+b=割线斜率。一般情形由罗尔定理+辅助函数证明。`;
    }
    wrap.querySelectorAll("input").forEach((i) => i.addEventListener("input", draw));
    draw();
    return wrap;
  }

    const wrap = el(`<div class="ix-card"></div>`);
    wrap.innerHTML = `

        <label>盒子 n <span data-v="n">4</span><input type="range" min="2" max="8" value="4" data-k="n"/></label>

      const n = +wrap.querySelector("[data-k=n]").value;

      wrap.querySelector("[data-v=n]").textContent = n;
      wrap.querySelector("[data-v=m]").textContent = m;
      // greedy: put as evenly as possible then remainder forces
      const base = Math.floor(m / n);
      const rem = m % n;
      const counts = Array.from({ length: n }, (_, i) => base + (i < rem ? 1 : 0));
      const ceil = Math.ceil(m / n);
      let boxes = "";
      const bw = Math.min(60, 400 / n - 8);
      counts.forEach((c, i) => {
        const x = 40 + i * (bw + 12);
        const hot = c >= ceil && c > 0;
        boxes += `<rect x="${x}" y="80" width="${bw}" height="100" rx="8" fill="${hot ? "#3b2f0e" : "#1e293b"}" stroke="${hot ? "#fbbf24" : "#475569"}" stroke-width="2"/>
          <text x="${x + bw / 2}" y="70" text-anchor="middle" fill="#94a3b8" font-size="12">盒${i + 1}</text>
          <text x="${x + bw / 2}" y="140" text-anchor="middle" fill="#e2e8f0" font-size="20">${c}</text>`;
      });
      svg.innerHTML = `
        <rect width="520" height="220" fill="#0f172a" rx="12"/>
        ${boxes}
        <text x="24" y="36" fill="#e2e8f0" font-size="14">⌈m/n⌉ = ${ceil}</text>
      `;
      out.innerHTML =
        m > n
          ? `m=${m}>n=${n} ⇒ 至少一盒 ≥2。加强：必有一盒 ≥${ceil}（高亮）。`
          : `均匀分配时最大为 ${ceil}。`;
    }
    wrap.querySelectorAll("input").forEach((i) => i.addEventListener("input", draw));
    draw();
    return wrap;
  }

  /* ========== 皮克定理格点 ========== */
  function pickTheorem() {
    const wrap = el(`<div class="ix-card"></div>`);
    wrap.innerHTML = `
      <div class="ix-title">皮克定理 · 格点多边形</div>
      <p class="ix-desc">Area = I + B/2 − 1。切换预设多边形</p>
      <div class="ix-controls" data-btns></div>
      <svg viewBox="0 0 520 280" class="ix-svg"></svg>
      <div class="ix-readout" data-out></div>
    `;
    const shapes = {
      square: {
        name: "单位正方形",
        pts: [
          [1, 1],
          [3, 1],
          [3, 3],
          [1, 3]
        ],
        I: 1,
        B: 8
      },
      tri: {
        name: "3-4-5 三角",
        pts: [
          [1, 1],
          [4, 1],
          [1, 4]
        ],
        I: 3,
        B: 8
      },
      poly: {
        name: "L 形",
        pts: [
          [1, 1],
          [4, 1],
          [4, 2],
          [2, 2],
          [2, 4],
          [1, 4]
        ],
        I: 1,
        B: 10
      }
    };
    // recompute I,B roughly - for square: interior (2,2) only if 1,1-3,3 includes? 
    // grid from 0 to 5. square vertices (1,1)(3,1)(3,3)(1,3): I=1 (2,2), B=8? edges have (2,1)(2,3)(1,2)(3,2)+4 verts=8. Area=4. Pick:1+4-1=4 OK
    // tri (1,1)(4,1)(1,4): area 4.5. B: bottom 1,2,3,4; left 1,2,3,4 but (1,1) double; hypotenuse points... classic I=3 B=8? 3+4-1=6 wrong. 
    // Area of triangle with verts (0,0)(4,0)(0,3) is 6. Let me use correct known examples.
    shapes.square = { name: "2×2 正方形", pts: [[0,0],[2,0],[2,2],[0,2]], I: 1, B: 8 }; // wait area 4, I=1 (1,1), B=8 → 1+4-1=4 OK. points 0,0 to 2,2
    shapes.tri = { name: "直角三角", pts: [[0,0],[4,0],[0,3]], I: 3, B: 8 }; // area 6, 3+4-1=6. B: bottom 5 pts 0-4, left 4 pts 0-3 but 0,0 shared, hyp: gcd(4,3)+1=5, shared 2 verts: B=5+4+5-2=12? Let me calculate Pick properly.
    // For triangle (0,0),(n,0),(0,m): I = (n-1)(m-1)/2 if? Actually formula I=(n-1)(m-1) - something for hyp.
    // Simple: use square and a rectangle and polygon we compute by code when drawing.

    const btns = wrap.querySelector("[data-btns]");
    const svg = wrap.querySelector("svg");
    const out = wrap.querySelector("[data-out]");

    const presets = [
      { name: "正方形", pts: [[1,1],[4,1],[4,4],[1,4]] },
      { name: "三角形", pts: [[1,1],[6,1],[1,5]] },
      { name: "五边形", pts: [[2,1],[5,1],[6,3],[4,5],[1,3]] }
    ];

    function pointInPoly(x, y, pts) {
      // ray casting
      let c = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i][0],
          yi = pts[i][1],
          xj = pts[j][0],
          yj = pts[j][1];
        if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi + 0.0) + xi) c = !c;
      }
      return c;
    }
    function onBoundary(x, y, pts) {
      for (let i = 0; i < pts.length; i++) {
        const [x1, y1] = pts[i];
        const [x2, y2] = pts[(i + 1) % pts.length];
        const cross = (x - x1) * (y2 - y1) - (y - y1) * (x2 - x1);
        if (Math.abs(cross) > 1e-9) continue;
        const dot = (x - x1) * (x2 - x1) + (y - y1) * (y2 - y1);
        const len = (x2 - x1) ** 2 + (y2 - y1) ** 2;
        if (dot >= 0 && dot <= len) return true;
      }
      return false;
    }
    function countIB(pts) {
      let minx = 99,
        maxx = -99,
        miny = 99,
        maxy = -99;
      pts.forEach(([x, y]) => {
        minx = Math.min(minx, x);
        maxx = Math.max(maxx, x);
        miny = Math.min(miny, y);
        maxy = Math.max(maxy, y);
      });
      let I = 0,
        B = 0;
      for (let x = minx; x <= maxx; x++)
        for (let y = miny; y <= maxy; y++) {
          if (onBoundary(x, y, pts)) B++;
          else if (pointInPoly(x + 0.01, y + 0.01, pts) && pointInPoly(x - 0.01, y - 0.01, pts)) I++;
        }
      // shoelace area
      let area = 0;
      for (let i = 0; i < pts.length; i++) {
        const [x1, y1] = pts[i];
        const [x2, y2] = pts[(i + 1) % pts.length];
        area += x1 * y2 - x2 * y1;
      }
      area = Math.abs(area) / 2;
      return { I, B, area };
    }

    function draw(pts, name) {
      const { I, B, area } = countIB(pts);
      const pick = I + B / 2 - 1;
      const scale = 36,
        ox = 60,
        oy = 220;
      // grid
      let g = "";
      for (let i = 0; i <= 7; i++) {
        g += `<line x1="${ox}" y1="${oy - i * scale}" x2="${ox + 7 * scale}" y2="${oy - i * scale}" stroke="#1e293b"/>`;
        g += `<line x1="${ox + i * scale}" y1="${oy}" x2="${ox + i * scale}" y2="${oy - 7 * scale}" stroke="#1e293b"/>`;
      }
      const poly = pts.map(([x, y]) => `${ox + x * scale},${oy - y * scale}`).join(" ");
      let dots = "";
      for (let x = 0; x <= 7; x++)
        for (let y = 0; y <= 7; y++) {
          const b = onBoundary(x, y, pts);
          const ins = !b && pointInPoly(x, y, pts);
          if (b || ins)
            dots += `<circle cx="${ox + x * scale}" cy="${oy - y * scale}" r="4" fill="${b ? "#fbbf24" : "#3dcc8c"}"/>`;
        }
      svg.innerHTML = `
        <rect width="520" height="280" fill="#0f172a" rx="12"/>
        ${g}
        <polygon points="${poly}" fill="rgba(110,181,255,0.25)" stroke="#6eb5ff" stroke-width="2"/>
        ${dots}
        <text x="320" y="40" fill="#e2e8f0" font-size="14">${name}</text>
        <text x="320" y="70" fill="#3dcc8c" font-size="13">I=${I}（内点）</text>
        <text x="320" y="95" fill="#fbbf24" font-size="13">B=${B}（边界）</text>
        <text x="320" y="130" fill="#6eb5ff" font-size="14">Area=${area}</text>
        <text x="320" y="155" fill="#e2e8f0" font-size="14">I+B/2−1=${pick}</text>
      `;
      out.innerHTML = `皮克：I+B/2−1=${pick} ${Math.abs(pick - area) < 0.01 ? "= Area ✓" : "（计数边界算法近似，以鞋带面积为准）"}`;
    }

    presets.forEach((p) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "ix-btn";
      b.textContent = p.name;
      b.addEventListener("click", () => draw(p.pts, p.name));
      btns.appendChild(b);
    });
    draw(presets[0].pts, presets[0].name);
    return wrap;
  }

  /* ========== 布劳威尔 1D ========== */
  function brouwer1d() {
    const wrap = el(`<div class="ix-card"></div>`);
    wrap.innerHTML = `
      <div class="ix-title">不动点（一维）</div>
      <p class="ix-desc">f:[0,1]→[0,1] 连续 ⇒ 存在 x=f(x)。看 y=f(x) 与 y=x 相交</p>
      <div class="ix-controls">
        <label>弯曲 <span data-v="k">0.3</span>
          <input type="range" min="0" max="100" value="30" data-k="k"/>
        </label>
      </div>
      <svg viewBox="0 0 520 280" class="ix-svg"></svg>
      <div class="ix-readout" data-out></div>
    `;
    const svg = wrap.querySelector("svg");
    const out = wrap.querySelector("[data-out]");
    function draw() {
      const k = +wrap.querySelector("[data-k=k]").value / 100;
      wrap.querySelector("[data-v=k]").textContent = k.toFixed(2);
      // f(x) = (1-k)*x + k*(0.2+0.6*sin(pi*x)^2) mapped to stay in [0,1]
      const f = (x) => {
        const s = 0.15 + 0.7 * Math.pow(Math.sin(Math.PI * x), 1.5 + k);
        return (1 - k) * (0.1 + 0.8 * x) + k * s;
      };
      const ox = 60,
        oy = 240,
        S = 200;
      const X = (x) => ox + x * S;
      const Y = (y) => oy - y * S;
      let curve = "",
        diag = `M${X(0)},${Y(0)} L${X(1)},${Y(1)}`;
      for (let i = 0; i <= 50; i++) {
        const x = i / 50;
        curve += `${i ? "L" : "M"}${X(x)},${Y(f(x))} `;
      }
      // find intersection approx
      let fp = 0.5;
      for (let i = 0; i < 30; i++) {
        // bisection on f(x)-x
        let lo = 0,
          hi = 1;
        for (let j = 0; j < 40; j++) {
          const m = (lo + hi) / 2;
          if (f(m) - m > 0) lo = m;
          else hi = m;
        }
        fp = (lo + hi) / 2;
      }
      // better scan
      let best = 0,
        bestv = 1;
      for (let i = 0; i <= 200; i++) {
        const x = i / 200;
        const v = Math.abs(f(x) - x);
        if (v < bestv) {
          bestv = v;
          best = x;
        }
      }
      fp = best;
      svg.innerHTML = `
        <rect width="520" height="280" fill="#0f172a" rx="12"/>
        <path d="${diag}" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
        <path d="${curve}" fill="none" stroke="#6eb5ff" stroke-width="2.5"/>
        <circle cx="${X(fp)}" cy="${Y(fp)}" r="6" fill="#fbbf24"/>
        <text x="320" y="50" fill="#94a3b8" font-size="13">虚线 y=x</text>
        <text x="320" y="75" fill="#6eb5ff" font-size="13">曲线 y=f(x)</text>
        <text x="320" y="110" fill="#fbbf24" font-size="14">不动点 x*≈${fp.toFixed(3)}</text>
      `;
      out.innerHTML = `g(x)=f(x)−x，g(0)≥0≥g(1)（因 f 映入[0,1]），IVT ⇒ g(c)=0。`;
    }
    wrap.querySelector("input").addEventListener("input", draw);
    draw();
    return wrap;
  }

    `;
    // regions as polygons, adjacency list
    const regions = [
      { id: 0, d: "M40,40 L200,40 L180,120 L60,130 Z", adj: [1, 2] },
      { id: 1, d: "M200,40 L360,50 L340,130 L180,120 Z", adj: [0, 2, 3] },

      { id: 4, d: "M80,210 L200,200 L220,250 L40,250 Z", adj: [2, 3, 5] },
      { id: 5, d: "M200,200 L360,200 L400,250 L220,250 Z", adj: [3, 4] }
    ];
    const colors = ["#1e293b", "#3b82f6", "#22c55e", "#eab308", "#ef4444"];
    const col = regions.map(() => 0);
    const svg = wrap.querySelector("[data-map]");
    const out = wrap.querySelector("[data-out]");

    function valid() {
      for (const r of regions) {
        for (const j of r.adj) {
          if (col[r.id] && col[j] && col[r.id] === col[j]) return false;
        }
      }
      return true;
    }
    function used() {
      return new Set(col.filter((c) => c > 0)).size;
    }
    function draw() {
      svg.innerHTML =
        `<rect width="520" height="260" fill="#0f172a" rx="12"/>` +
        regions
          .map(
            (r) =>
              `<path data-id="${r.id}" d="${r.d}" fill="${colors[col[r.id]]}" stroke="#94a3b8" stroke-width="2" style="cursor:pointer"/>
               <text x="0" y="0"></text>`
          )
          .join("");
      // labels
      const centers = [
        [110, 80],
        [260, 85],
        [130, 165],
        [270, 160],
        [130, 230],
        [290, 225]
      ];
      centers.forEach((c, i) => {
        svg.innerHTML += `<text x="${c[0]}" y="${c[1]}" fill="#fff" font-size="14" text-anchor="middle">${col[i] || "·"}</text>`;
      });
      svg.querySelectorAll("path[data-id]").forEach((p) => {
        p.addEventListener("click", () => {
          const id = +p.getAttribute("data-id");
          col[id] = (col[id] + 1) % 5;
          draw();
        });
      });
      out.innerHTML = valid()
        ? `合法着色，使用 ${used()} 种颜色${used() <= 4 ? "（≤4 ✓）" : ""}`
        : "存在相邻同色 — 再点该区域换色";
    }
    wrap.querySelector("[data-reset]").addEventListener("click", () => {
      col.fill(0);
      draw();
    });
    wrap.querySelector("[data-auto]").addEventListener("click", () => {
      // greedy
      col.fill(0);
      for (const r of regions) {
        const usedc = new Set(r.adj.map((j) => col[j]).filter(Boolean));
        let c = 1;
        while (usedc.has(c)) c++;
        col[r.id] = c;
      }
      draw();
    });
    draw();
    return wrap;
  }

  /* ========== 算术基本定理：分解 ========== */
  function factorTree() {
    const wrap = el(`<div class="ix-card"></div>`);
    wrap.innerHTML = `
      <div class="ix-title">素因子分解</div>
      <p class="ix-desc">拖动 n，看唯一分解（算术基本定理）</p>
      <div class="ix-controls">
        <label>n <span data-v="n">360</span>
          <input type="range" min="2" max="500" value="360" data-k="n"/>
        </label>
      </div>
      <svg viewBox="0 0 520 180" class="ix-svg"></svg>
      <div class="ix-readout" data-out></div>
    `;
    const svg = wrap.querySelector("svg");
    const out = wrap.querySelector("[data-out]");
    function factors(n) {
      const m = {};
      let x = n;
      for (let p = 2; p * p <= x; p++) {
        while (x % p === 0) {
          m[p] = (m[p] || 0) + 1;
          x /= p;
        }
      }
      if (x > 1) m[x] = (m[x] || 0) + 1;
      return m;
    }
    function draw() {
      const n = +wrap.querySelector("[data-k=n]").value;
      wrap.querySelector("[data-v=n]").textContent = n;
      const m = factors(n);
      const parts = Object.keys(m).map((p) => `${p}${m[p] > 1 ? "^" + m[p] : ""}`);
      svg.innerHTML = `
        <rect width="520" height="180" fill="#0f172a" rx="12"/>
        <text x="260" y="70" text-anchor="middle" fill="#e2e8f0" font-size="22">${n}</text>
        <text x="260" y="120" text-anchor="middle" fill="#fbbf24" font-size="20">= ${parts.join(" × ")}</text>
      `;

  function pythagorasSimilar() {
    const wrap = el(`<div class="ix-card"></div>`);
    wrap.innerHTML = `

      <p class="ix-desc">斜边上的高分出两个小三角形，均与原三角形相似</p>

      <div class="ix-readout" data-out></div>
    `;

      const a = +wrap.querySelector("[data-k=a]").value / 10;

      wrap.querySelector("[data-v=a]").textContent = a.toFixed(1);
      wrap.querySelector("[data-v=b]").textContent = b.toFixed(1);
      const c = Math.sqrt(a * a + b * b);
      const AD = (b * b) / c;
      const BD = (a * a) / c;
      // place C at origin, B on x, A on y - then scale
      const sc = 180 / Math.max(a, b, c);
      const C = [80, 220],
        B = [80 + a * sc, 220],
        A = [80, 220 - b * sc];
      // D on AB: from A to B, AD length... D divides AB with AD=b²/c along AB of length c
      // geometric: foot from C to AB
      // AB vector
      const ABx = B[0] - A[0],
        ABy = B[1] - A[1];
      const t = AD / c;
      // actually D is at distance AD from A along AB? AD is projection length on AB from A: yes |AD|=b²/c
      const D = [A[0] + ABx * (AD / c), A[1] + ABy * (AD / c)];
      svg.innerHTML = `

        <text x="320" y="160" fill="#3dcc8c" font-size="14">⇒ a²+b²=c²</text>
      `;
      out.innerHTML = `△ACD∼△ABC∼△CBD ⇒ b²=c·AD，a²=c·BD，相加得勾股。`;
    }
    wrap.querySelectorAll("input").forEach((i) => i.addEventListener("input", draw));
    draw();
    return wrap;
  }

    function tube(cx, cy, ang, len, hw) {
      const a = (ang * Math.PI) / 180;
      const dx = Math.cos(a),
        dy = Math.sin(a);
      const px = -dy * hw,
        py = dx * hw;
      const x0 = cx - (dx * len) / 2,
        y0 = cy - (dy * len) / 2;
      const x1 = cx + (dx * len) / 2,
        y1 = cy + (dy * len) / 2;
      return [
        [x0 + px, y0 + py],
        [x1 + px, y1 + py],
        [x1 - px, y1 - py],
        [x0 - px, y0 - py]
      ];
    }
    function ps(pts) {
      return pts.map((p) => p.join(",")).join(" ");
    }
    function overlap(thDeg, hw) {
      const th = (thDeg * Math.PI) / 180;
      const n1 = [0, 1],
        n2 = [-Math.sin(th), Math.cos(th)];
      function hit(na, ca, nb, cb) {
        const det = na[0] * nb[1] - na[1] * nb[0];
        return [(ca * nb[1] - cb * na[1]) / det, (na[0] * cb - nb[0] * ca) / det];
      }
      const cs = [
        hit(n1, hw, n2, hw),
        hit(n1, hw, n2, -hw),
        hit(n1, -hw, n2, -hw),
        hit(n1, -hw, n2, hw)
      ];
      cs.sort((p, q) => Math.atan2(p[1], p[0]) - Math.atan2(q[1], q[0]));
      return cs.map(([x, y]) => [280 + x * 2.4, 180 + y * 2.4]);

      const t1 = tube(280, 180, 0, 300, hw);
      const t2 = tube(280, 180, -th, 300, hw);

  W["kakeya-l2"] = function () {
    const ui = shell({
      title: "多管并集 · L² 思想实验",
      desc: "方向均匀分布的 N 根细管。观察并集「覆盖像素」与 ∑ 单管面积的比 = 重叠效率。",

    function draw() {
      const N = +nIn.value,
        d = +dIn.value;
      const cx = 220,
        cy = 180,
        len = 200;
      let polys = "";
      // rasterize crude coverage on grid
      const gw = 80,
        gh = 60,
        cell = 4;
      const grid = new Uint8Array(gw * gh);
      const ox = 40,
        oy = 40;
      for (let j = 0; j < N; j++) {
        const ang = (j * Math.PI) / N;
        const dx = Math.cos(ang),
          dy = Math.sin(ang);
        const px = -dy * (d / 2),
          py = dx * (d / 2);
        const x0 = cx - dx * len,
          y0 = cy - dy * len;
        const x1 = cx + dx * len,
          y1 = cy + dy * len;
        const pts = [
          [x0 + px, y0 + py],
          [x1 + px, y1 + py],
          [x1 - px, y1 - py],
          [x0 - px, y0 - py]
        ];
        polys += `<polygon points="${pts.map((p) => p.join(",")).join(" ")}" fill="rgba(96,165,250,0.15)" stroke="rgba(147,197,253,0.5)" stroke-width="1"/>`;
        // stamp grid
        for (let t = 0; t <= 40; t++) {
          const x = x0 + ((x1 - x0) * t) / 40;
          const y = y0 + ((y1 - y0) * t) / 40;
          for (let s = -d / 2; s <= d / 2; s += 2) {
            const xx = x + px * (s / (d / 2 || 1));
            const yy = y + py * (s / (d / 2 || 1));
            const gx = Math.floor((xx - ox) / cell);
            const gy = Math.floor((yy - oy) / cell);
            if (gx >= 0 && gy >= 0 && gx < gw && gy < gh) grid[gy * gw + gx] = 1;
          }
        }
      }
      let cover = 0;
      for (let i = 0; i < grid.length; i++) cover += grid[i];
      const unionApprox = cover * cell * cell;
      const sumArea = N * (2 * len) * d * 0.15; // visual scale
      const ratio = sumArea / Math.max(unionApprox, 1);

      ui.svg.innerHTML = `
        <rect width="640" height="360" fill="#0b1220"/>

      `;
      ui.out.innerHTML = `f=∑1_T 时 ∫f=∑|T|，∫f² 反映两两重叠。柯西：(∫f)²≤|⋃|∫f² 给出并集下界——维数证明的引擎。`;
    }

  W["ftc-area"] = function () {
    const ui = shell({

      let rects = "";

      if (step >= 1) {
        for (let i = 0; i < n; i++) {
          const t0 = (x * i) / n;
          const t1 = (x * (i + 1)) / n;
          const h = f(t0);
          riemann += h * (t1 - t0);
          rects += `<rect x="${X(t0)}" y="${Y(h)}" width="${(t1 - t0) * sx}" height="${h * sy}"
            fill="rgba(96,165,250,0.25)" stroke="#60a5fa" stroke-width="1"/>`;

  W["euler-circle"] = function () {
    const ui = shell({
      title: "欧拉公式 · 圆上一点与级数",
      desc: "左：e^{iθ} 在单位圆。右：e^{iθ} 级数部分和在复平面的逼近。",
      badge: "欧拉",
      w: 640,
      h: 340,
      side: true,
      formula: "e^{iθ} = Σ (iθ)ⁿ/n! = cosθ + i sinθ"
    });
    const thIn = addRange(ui.ctrl, "th", "θ°", 0, 360, 60);
    const nIn = addRange(ui.ctrl, "n", "级数项数", 1, 20, 6);

    function draw() {
      const deg = +thIn.value;
      const N = +nIn.value;
      const th = (deg * Math.PI) / 180;
      // series
      let re = 0,
        im = 0;
      let termRe = 1,
        termIm = 0; // (iθ)^0
      const partial = [[1, 0]];
      for (let n = 0; n < N; n++) {
        if (n > 0) {
          // multiply by iθ / n
          const nr = (-termIm * th) / n;
          const ni = (termRe * th) / n;
          termRe = nr;
          termIm = ni;
        }
        re += termRe;
        im += termIm;
        partial.push([re, im]);
      }
      const c = Math.cos(th),
        s = Math.sin(th);
      const cx = 150,
        cy = 170,
        R = 100;
      const px = cx + R * Math.cos(th),
        py = cy - R * Math.sin(th);
      // right panel series path
      const cx2 = 420,
        cy2 = 170,
        sc = 90;
      let path = "";
      partial.forEach((p, i) => {
        path += `${i ? "L" : "M"}${cx2 + p[0] * sc},${cy2 - p[1] * sc} `;
      });

      ui.svg.innerHTML = `
        <rect width="640" height="340" fill="#0b1220"/>
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#334155" stroke-width="2"/>
        <line x1="${cx - R - 15}" y1="${cy}" x2="${cx + R + 15}" y2="${cy}" stroke="#334155"/>
        <line x1="${cx}" y1="${cy + R + 15}" x2="${cx}" y2="${cy - R - 15}" stroke="#334155"/>
        <line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#60a5fa" stroke-width="2"/>
        <circle cx="${px}" cy="${py}" r="7" fill="#facc15"/>
        <text x="${cx}" y="40" text-anchor="middle" fill="#94a3b8" font-size="12">单位圆</text>
        <circle cx="${cx2}" cy="${cy2}" r="${sc}" fill="none" stroke="#334155" stroke-dasharray="4 3"/>
        <path d="${path}" fill="none" stroke="#c084fc" stroke-width="2"/>
        <circle cx="${cx2 + re * sc}" cy="${cy2 - im * sc}" r="5" fill="#c084fc"/>
        <circle cx="${cx2 + c * sc}" cy="${cy2 - s * sc}" r="5" fill="#facc15"/>
        <text x="${cx2}" y="40" text-anchor="middle" fill="#94a3b8" font-size="12">级数部分和 → 真值</text>
      `;
      const err = Math.hypot(re - c, im - s);
      ui.side.innerHTML = `
        <div class="ix-kv"><span>θ</span><b>${deg}° = ${th.toFixed(3)} rad</b></div>
        <div class="ix-kv"><span>cosθ+ i sinθ</span><b>${c.toFixed(3)} ${s >= 0 ? "+" : ""}${s.toFixed(3)}i</b></div>
        <div class="ix-kv"><span>级数和</span><b>${re.toFixed(3)} ${im >= 0 ? "+" : ""}${im.toFixed(3)}i</b></div>
        <div class="ix-kv hi"><span>误差</span><b>${err.toFixed(5)}</b></div>
        <p class="ix-note">${Math.abs(deg - 180) < 2 ? "θ=π → e^{iπ}=−1 → e^{iπ}+1=0" : "增加项数，紫点贴合黄点（真值）"}</p>
      `;
      ui.out.innerHTML = `e^{iθ} 既是旋转，又是幂级数。θ=π 时落到 −1，即欧拉恒等式。`;
    }
    bindRanges(ui.wrap, draw);
    draw();
    return ui.wrap;
  };

        <text x="500" y="100" fill="#22c55e" font-size="12">b f=${f(b).toFixed(3)}</text>
        <text x="500" y="120" fill="#facc15" font-size="12">m f=${f(m).toFixed(3)}</text>
      `;
      ui.side.innerHTML = `

    });
    const presets = [
      { name: "正方形", pts: [[1, 1], [4, 1], [4, 4], [1, 4]] },
      { name: "三角形", pts: [[1, 1], [6, 1], [1, 5]] },
      { name: "五边形", pts: [[2, 1], [5, 1], [6, 3], [4, 5], [1, 3]] },
      { name: "瘦三角", pts: [[1, 1], [7, 1], [1, 3]] }
    ];
    let cur = presets[0];
    presets.forEach((p) => {
      addBtn(ui.ctrl, p.name).onclick = () => {
        cur = p;
        draw();
      };
    });

    function onBoundary(x, y, pts) {
      for (let i = 0; i < pts.length; i++) {
        const [x1, y1] = pts[i];
        const [x2, y2] = pts[(i + 1) % pts.length];
        const cross = (x - x1) * (y2 - y1) - (y - y1) * (x2 - x1);
        if (Math.abs(cross) > 1e-8) continue;
        const dot = (x - x1) * (x2 - x1) + (y - y1) * (y2 - y1);
        const len = (x2 - x1) ** 2 + (y2 - y1) ** 2;
        if (dot >= -1e-8 && dot <= len + 1e-8) return true;
      }
      return false;
    }
    function pointInPoly(x, y, pts) {
      let c = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const [xi, yi] = pts[i],
          [xj, yj] = pts[j];
        if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi || 1e-12) + xi) c = !c;
      }
      return c;
    }
    function shoelace(pts) {
      let a = 0;
      for (let i = 0; i < pts.length; i++) {
        const [x1, y1] = pts[i];
        const [x2, y2] = pts[(i + 1) % pts.length];
        a += x1 * y2 - x2 * y1;
      }
      return Math.abs(a) / 2;
    }
    function countIB(pts) {
      let I = 0,
        B = 0;
      for (let x = 0; x <= 8; x++)
        for (let y = 0; y <= 8; y++) {
          if (onBoundary(x, y, pts)) B++;
          else if (pointInPoly(x, y, pts)) I++;
        }
      return { I, B, area: shoelace(pts) };
    }

    function draw() {
      const pts = cur.pts;
      const { I, B, area } = countIB(pts);
      const pick = I + B / 2 - 1;
      const scale = 38,
        ox = 50,

      for (let i = 0; i <= 8; i++) {
        g += `<line x1="${ox}" y1="${oy - i * scale}" x2="${ox + 8 * scale}" y2="${oy - i * scale}" stroke="#1e293b"/>`;
        g += `<line x1="${ox + i * scale}" y1="${oy}" x2="${ox + i * scale}" y2="${oy - 8 * scale}" stroke="#1e293b"/>`;
      }
      for (let x = 0; x <= 8; x++)
        for (let y = 0; y <= 8; y++) {
          g += `<circle cx="${ox + x * scale}" cy="${oy - y * scale}" r="2" fill="#334155"/>`;
        }
      const poly = pts.map(([x, y]) => `${ox + x * scale},${oy - y * scale}`).join(" ");
      let dots = "";
      for (let x = 0; x <= 8; x++)
        for (let y = 0; y <= 8; y++) {
          if (onBoundary(x, y, pts))
            dots += `<circle cx="${ox + x * scale}" cy="${oy - y * scale}" r="5" fill="#facc15"/>`;
          else if (pointInPoly(x, y, pts))
            dots += `<circle cx="${ox + x * scale}" cy="${oy - y * scale}" r="5" fill="#4ade80"/>`;
        }
      ui.svg.innerHTML = `
        <rect width="640" height="360" fill="#0b1220"/>
        ${g}
        <polygon points="${poly}" fill="rgba(96,165,250,0.2)" stroke="#60a5fa" stroke-width="2.5"/>
        ${dots}
        <text x="420" y="40" fill="#e2e8f0" font-size="15">${cur.name}</text>
      `;
      ui.side.innerHTML = `
        <div class="ix-kv"><span>I 内点</span><b style="color:#4ade80">${I}</b></div>
        <div class="ix-kv"><span>B 边界</span><b style="color:#facc15">${B}</b></div>
        <div class="ix-kv"><span>鞋带 Area</span><b>${area}</b></div>
        <div class="ix-kv hi"><span>I+B/2−1</span><b>${pick}</b></div>
        <p class="ix-note">${Math.abs(pick - area) < 0.01 ? "皮克 = 面积 ✓" : "边界判定为网格近似，以鞋带为准"}</p>
      `;
      ui.out.innerHTML = `证明思路：剖成面积 1/2 的基本三角，个数 T=2·Area，再与欧拉 V−E+F 联立。`;
    }
    draw();

  };

    function conflicts() {
      const set = new Set();
      regions.forEach((r) => {

          if (col[r.id] && col[j] && col[r.id] === col[j]) {
            set.add(r.id);
            set.add(j);

      return set;

      const used = new Set(col.filter((c) => c > 0)).size;

  W["basel-sum"] = function () {
    const ui = shell({
      title: "巴塞尔问题 · 部分和与目标",
      desc: "S_N=∑_{n=1}^N 1/n²（蓝）逼近 π²/6（黄线）。可看第 n 项大小。",

    function draw() {
      const N = +nIn.value;
      let s = 0;
      const pts = [];
      for (let n = 1; n <= N; n++) {
        s += 1 / (n * n);
        pts.push(s);
      }
      const ox = 50,
        oy = 280,
        W = 400,
        H = 200;
      const mx = (i) => ox + ((i - 1) / Math.max(N - 1, 1)) * W;
      const my = (v) => oy - ((v - 0.9) / 0.9) * H;
      let path = "";
      pts.forEach((v, i) => {
        path += `${i ? "L" : "M"}${mx(i + 1)},${my(v)} `;
      });
      // bars for last few terms
      let bars = "";
      const show = Math.min(N, 15);
      for (let n = N - show + 1; n <= N; n++) {
        if (n < 1) continue;
        const term = 1 / (n * n);
        const bx = 480;
        const by = 40 + (N - n) * 14;
        bars += `<rect x="${bx}" y="${by}" width="${term * 800}" height="10" fill="#60a5fa"/>`;
      }

      ui.svg.innerHTML = `
        <rect width="640" height="340" fill="#0b1220"/>
        <line x1="${ox}" y1="${my(target)}" x2="${ox + W}" y2="${my(target)}" stroke="#facc15" stroke-width="2" stroke-dasharray="6 4"/>

        <circle cx="${mx(N)}" cy="${my(s)}" r="5" fill="#60a5fa"/>

      `;
      ui.side.innerHTML = `
        <div class="ix-kv"><span>N</span><b>${N}</b></div>
        <div class="ix-kv"><span>S_N</span><b>${s.toFixed(6)}</b></div>
        <div class="ix-kv"><span>末项 1/N²</span><b>${(1 / (N * N)).toFixed(6)}</b></div>

        <p class="ix-note">误差量级 ~ 1/N。傅里叶证明给出精确值 π²/6。</p>

      ui.out.innerHTML = `x² 在 [−π,π] 的傅里叶展开，令 x=π 即得 ∑1/n²=π²/6。`;
    }
    bindRanges(ui.wrap, draw);
    draw();
    return ui.wrap;
  };

  W["riemann-map"] = function () {
    const ui = shell({
      title: "黎曼映射 · 共形变形",
      desc: "左：单连通区域 Ω（可调起伏）。右：单位圆盘。进度滑条模拟「抚圆」。",
      badge: "复分析",
      w: 640,
      h: 340,
      side: true,
      formula: "∃ f:Ω→𝔻 全纯双射，f(z₀)=0, f'(z₀)>0 时唯一"
    });
    const wIn = addRange(ui.ctrl, "w", "边界起伏", 0, 100, 40);
    const mIn = addRange(ui.ctrl, "m", "映射进度", 0, 100, 0);

    function blob(cx, cy, R, weird) {
      const pts = [];
      for (let i = 0; i <= 64; i++) {
        const th = (i / 64) * Math.PI * 2;
        const wob =
          1 +
          weird * 0.4 * Math.sin(3 * th) +
          weird * 0.22 * Math.cos(5 * th + 0.4);
        pts.push([cx + R * wob * Math.cos(th), cy + R * wob * Math.sin(th)]);
      }
      return pts.map((p, i) => `${i ? "L" : "M"}${p.join(",")}`).join(" ") + "Z";
    }

    function draw() {
      const w = +wIn.value / 100;
      const m = +mIn.value / 100;
      const weird = w * (1 - m);
      const R = 75;
      const left = blob(160, 170, R, weird);
      // interior grid warped
      let grid = "";
      for (let i = -3; i <= 3; i++) {
        let p = "";
        for (let j = 0; j <= 20; j++) {
          const t = j / 20;
          const ang = t * Math.PI * 2;
          const rr = (0.35 + 0.15 * Math.abs(i / 3)) * R * (1 + weird * 0.2 * Math.sin(3 * ang));
          const x = 160 + rr * Math.cos(ang) * (1 + i * 0.04);
          const y = 170 + rr * Math.sin(ang);
          p += `${j ? "L" : "M"}${x},${y} `;
        }
        grid += `<path d="${p}" fill="none" stroke="#334155" stroke-width="1"/>`;
      }

      let diskG = "";
      for (let k = 1; k <= 4; k++)
        diskG += `<circle cx="460" cy="170" r="${18 * k * (0.7 + 0.3 * m)}" fill="none" stroke="#334155"/>`;
      for (let k = 0; k < 12; k++) {
        const th = (k * Math.PI) / 6;
        diskG += `<line x1="460" y1="170" x2="${460 + 72 * Math.cos(th)}" y2="${170 + 72 * Math.sin(th)}" stroke="#334155"/>`;
      }

      ui.svg.innerHTML = `
        <rect width="640" height="340" fill="#0b1220"/>
        <path d="${left}" fill="rgba(96,165,250,0.25)" stroke="#60a5fa" stroke-width="2.5"/>
        ${grid}
        <text x="160" y="40" text-anchor="middle" fill="#60a5fa" font-size="14">Ω 单连通</text>
        <path d="M 280 170 L 360 170" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
        <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0L6,3L0,6" fill="#94a3b8"/></marker></defs>
        <circle cx="460" cy="170" r="72" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="2.5"/>
        ${diskG}
        <text x="460" y="40" text-anchor="middle" fill="#4ade80" font-size="14">𝔻 单位圆盘</text>
        <circle cx="160" cy="170" r="4" fill="#facc15"/>
        <text x="168" y="165" fill="#facc15" font-size="11">z₀</text>
      `;
      ui.side.innerHTML = `
        <div class="ix-kv"><span>起伏</span><b>${Math.round(w * 100)}%</b></div>
        <div class="ix-kv"><span>进度</span><b>${Math.round(m * 100)}%</b></div>
        <div class="ix-kv hi"><span>共形</span><b>保角</b></div>
        <p class="ix-note">存在性：正规族取极大导数；若不满射则可用布拉施克因子「撑大」导出矛盾。</p>

    }
    bindRanges(ui.wrap, draw);
    draw();
    return ui.wrap;
  };

  W["pnt-chart"] = function () {
    const ui = shell({
      title: "素数定理 · π(x) 对 x/ln x",
      desc: "蓝：π(x)。黄虚：x/ln x。右侧比值 → 1。",
      badge: "PNT",
      w: 640,
      h: 340,
      side: true,
      formula: "π(x) ∼ x / ln x"
    });
    const xIn = addRange(ui.ctrl, "X", "X", 40, 500, 200);
    const N = 500;
    const isP = new Uint8Array(N + 1);
    isP.fill(1);
    isP[0] = isP[1] = 0;
    for (let i = 2; i * i <= N; i++) if (isP[i]) for (let j = i * i; j <= N; j += i) isP[j] = 0;
    const pi = new Array(N + 1).fill(0);
    for (let i = 1; i <= N; i++) pi[i] = pi[i - 1] + (isP[i] ? 1 : 0);

    function draw() {
      const X = +xIn.value;
      const ox = 50,
        oy = 290,
        W = 400,
        H = 220;
      const maxY = Math.max(pi[X], X / Math.log(X)) * 1.12;
      const mx = (x) => ox + (x / X) * W;
      const my = (y) => oy - (y / maxY) * H;
      let p1 = "",
        p2 = "";
      const step = Math.max(1, Math.floor(X / 100));
      for (let x = 2; x <= X; x += step) {
        p1 += `${x === 2 ? "M" : "L"}${mx(x)},${my(pi[x])} `;
        p2 += `${x === 2 ? "M" : "L"}${mx(x)},${my(x / Math.log(x))} `;
      }
      p1 += `L${mx(X)},${my(pi[X])}`;
      p2 += `L${mx(X)},${my(X / Math.log(X))}`;
      const ratio = pi[X] / (X / Math.log(X));

      ui.svg.innerHTML = `
        <rect width="640" height="340" fill="#0b1220"/>
        <line x1="${ox}" y1="${oy}" x2="${ox + W}" y2="${oy}" stroke="#334155"/>
        <line x1="${ox}" y1="${oy}" x2="${ox}" y2="${oy - H}" stroke="#334155"/>
        <path d="${p1}" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
        <path d="${p2}" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="50" y="36" fill="#60a5fa" font-size="13">π(x)</text>
        <text x="120" y="36" fill="#facc15" font-size="13">x/ln x</text>
      `;
      ui.side.innerHTML = `
        <div class="ix-kv"><span>X</span><b>${X}</b></div>
        <div class="ix-kv"><span>π(X)</span><b>${pi[X]}</b></div>
        <div class="ix-kv"><span>X/ln X</span><b>${(X / Math.log(X)).toFixed(1)}</b></div>
        <div class="ix-kv hi"><span>比值</span><b>${ratio.toFixed(4)}</b></div>
        <p class="ix-note">PNT：比值 → 1。证明经 ζ(1+it)≠0 与 ψ(x)∼x。</p>
      `;
      ui.out.innerHTML = `更强误差与黎曼假设有关；PNT 本身 1896 年用复分析完成。`;
    }
    bindRanges(ui.wrap, draw);
    draw();
    return ui.wrap;
  };

  W["fermat-little"] = function () {
    const ui = card("费马小定理 · 幂次取模", "拖 a 与素数 p，看 a^{p−1} mod p 是否为 1");
    const aIn = range(ui.ctrl, "a", "a", 2, 20, 3);
    const primes = [3, 5, 7, 11, 13, 17, 19];
    let pIdx = 2;
    const pLab = document.createElement("label");

      <input type="range" min="0" max="${primes.length - 1}" value="2" data-k="p"/>`;
    ui.ctrl.appendChild(pLab);
    const pIn = pLab.querySelector("input");

    function modPow(base, exp, mod) {
      let r = 1n;
      let b = BigInt(base) % BigInt(mod);
      let e = BigInt(exp);
      const m = BigInt(mod);
      while (e > 0n) {
        if (e & 1n) r = (r * b) % m;
        b = (b * b) % m;
        e >>= 1n;
      }
      return Number(r);
    }

    function draw() {
      const a = +aIn.value;
      const p = primes[+pIn.value];
      ui.wrap.querySelector('[data-v="p"]').textContent = p;
      const ok = a % p !== 0;
      const val = ok ? modPow(a, p - 1, p) : null;
      // bars for a^k mod p
      let bars = "";
      const maxK = Math.min(p, 16);
      for (let k = 1; k <= maxK; k++) {
        const v = modPow(a, k, p);
        const h = (v / p) * 180 + 8;
        const x = 40 + k * 34;
        const hi = k === p - 1;
        bars += `<rect x="${x}" y="${260 - h}" width="28" height="${h}" rx="4"
          fill="${hi ? "#facc15" : "#60a5fa"}" opacity="0.85"/>
          <text x="${x + 14}" y="280" text-anchor="middle" fill="#94a3b8" font-size="10">${k}</text>
          <text x="${x + 14}" y="${250 - h}" text-anchor="middle" fill="#e2e8f0" font-size="11">${v}</text>`;
      }
      ui.svg.innerHTML = `
        <rect width="640" height="320" fill="#0b1220"/>
        <text x="24" y="28" fill="#94a3b8" font-size="13">纵轴：a^k mod p　黄柱 = k=p−1</text>
        ${bars}
        <text x="24" y="310" fill="#64748b" font-size="12">k →</text>
      `;
      ui.side.innerHTML = ok
        ? `<div class="ix-kv"><span>a</span><b>${a}</b></div>
           <div class="ix-kv"><span>p</span><b>${p}</b></div>
           <div class="ix-kv hi"><span>a^{p−1} mod p</span><b>${val}</b></div>
           <p class="ix-note">${val === 1 ? "等于 1 ✓ 费马小定理" : "应在 p 不整除 a 时为 1"}</p>`
        : `<p class="ix-note">p 整除 a 时，用 a^p ≡ a (mod p) 形式。</p>
           <div class="ix-kv hi"><span>a^p mod p</span><b>${modPow(a, p, p)}</b></div>
           <div class="ix-kv"><span>a mod p</span><b>${a % p}</b></div>`;
      ui.out.innerHTML = ok
        ? `定理：a^{p−1} ≡ 1 (mod p)。当前 <b>${a}^{${p - 1}} ≡ ${val} (mod ${p})</b>。`
        : `p | a 时看 a^p ≡ a：${modPow(a, p, p)} ≡ ${a % p} (mod ${p})。`;

  W["binomial"] = function () {
    const ui = card("二项式 · 杨辉三角", "选 n，看 (a+b)^n 系数与 C(n,k)");
    const nIn = range(ui.ctrl, "n", "n", 0, 10, 5);

    function binom(n, k) {
      if (k < 0 || k > n) return 0;
      let r = 1;
      for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i;
      return Math.round(r);
    }

    function draw() {
      const n = +nIn.value;
      let rows = "";
      for (let r = 0; r <= n; r++) {
        let cells = "";
        for (let k = 0; k <= r; k++) {
          const v = binom(r, k);
          const hi = r === n;
          cells += `<span style="display:inline-block;min-width:2rem;margin:2px;padding:4px 6px;border-radius:6px;
            background:${hi ? "#1d4ed8" : "#1e293b"};color:#e2e8f0;font-size:13px;text-align:center">${v}</span>`;
        }
        rows += `<div style="text-align:center">${cells}</div>`;
      }
      // use foreignObject-ish via side for HTML triangle, svg for expansion
      let terms = [];
      for (let k = 0; k <= n; k++) {
        const c = binom(n, k);
        const a = n - k === 0 ? "" : n - k === 1 ? "a" : `a^${n - k}`;
        const b = k === 0 ? "" : k === 1 ? "b" : `b^${k}`;
        const coef = c === 1 && (a || b) ? "" : String(c);
        terms.push(`${coef}${a}${b}` || "1");
      }
      ui.svg.innerHTML = `
        <rect width="640" height="320" fill="#0b1220"/>
        <text x="24" y="36" fill="#94a3b8" font-size="14">(a+b)^${n} 展开系数（第 n 行高亮在右侧）</text>
        <text x="24" y="90" fill="#facc15" font-size="16" font-family="Consolas,monospace">${terms.join(" + ")}</text>
        <text x="24" y="150" fill="#60a5fa" font-size="14">Σ C(${n},k) = 2^${n} = ${1 << n}</text>
        <text x="24" y="200" fill="#e2e8f0" font-size="13">组合：从 n 个括号里选 k 个贡献 b</text>
        <text x="24" y="260" fill="#94a3b8" font-size="12">C(${n},0)…C(${n},${n}) = ${Array.from({ length: n + 1 }, (_, k) => binom(n, k)).join(", ")}</text>
      `;
      ui.side.innerHTML = `
        <div style="font-size:12px;line-height:1.6;max-height:260px;overflow:auto">${rows}</div>
        <p class="ix-note">蓝行 = 当前 n 的系数。</p>
      `;
      ui.out.innerHTML = `(a+b)^n = Σ C(n,k) a^{n−k} b^k。杨辉三角：每数 = 肩上两数之和。`;
    }
    bind(ui.wrap, draw);
    draw();
    return ui.wrap;
  };

    function fact(k) {
      let r = 1;
      for (let i = 2; i <= k; i++) r *= i;
      return r;
    }

    function taylorExp(x, n) {
      let s = 0;
      for (let k = 0; k <= n; k++) s += Math.pow(x, k) / fact(k);
      return s;
    }
    function taylorSin(x, n) {
      // only odd powers: sum (-1)^m x^{2m+1}/(2m+1)! for terms up to degree n
      let s = 0;
      for (let k = 0; k <= n; k++) {
        if (k % 2 === 0) continue; // only odd for sin from 0; actually sin uses 1,3,5...
      }
      // standard: for m=0,1,... while 2m+1 <= n
      for (let m = 0; 2 * m + 1 <= n; m++) {
        s += ((m % 2 === 0 ? 1 : -1) * Math.pow(x, 2 * m + 1)) / fact(2 * m + 1);

      if (n === 0) return 0;
      return s;

      const Y = (y) => oy - y * sy;

      let pathF = "",
        pathP = "";
      for (let i = 0; i <= 80; i++) {
        const x = x0 + ((x1 - x0) * i) / 80;
        pathF += `${i ? "L" : "M"}${X(x)},${Y(f(x))} `;
        pathP += `${i ? "L" : "M"}${X(x)},${Y(p(x))} `;
      }
      const err = Math.abs(f(1) - p(1));
      ui.svg.innerHTML = `
        <rect width="640" height="320" fill="#0b1220"/>

  /* ===== 夹逼：上下界 ===== */
  W["sandwich"] = function () {
    const ui = card("夹逼 · x sin(1/x) → 0", "蓝线夹在 ±|x| 之间，x→0 时上下都→0");
    const zIn = range(ui.ctrl, "z", "放大中心附近", 10, 100, 40);

    function draw() {
      const zoom = +zIn.value / 20; // domain half-width
      const x0 = -zoom,
        x1 = zoom;
      const ox = 60,
        oy = 160,
        W = 520,
        H = 200;
      const X = (x) => ox + ((x - x0) / (x1 - x0)) * W;
      const Y = (y) => oy - (y / zoom) * (H / 2);

      let f = "",
        up = "",
        lo = "";
      for (let i = 0; i <= 120; i++) {
        const x = x0 + ((x1 - x0) * i) / 120;
        if (Math.abs(x) < 1e-6) continue;
        const y = x * Math.sin(1 / x);
        const cmd = f ? "L" : "M";
        f += `${cmd}${X(x)},${Y(y)} `;
        up += `${up ? "L" : "M"}${X(x)},${Y(Math.abs(x))} `;
        lo += `${lo ? "L" : "M"}${X(x)},${Y(-Math.abs(x))} `;
      }
      ui.svg.innerHTML = `
        <rect width="640" height="320" fill="#0b1220"/>
        <line x1="40" y1="${oy}" x2="600" y2="${oy}" stroke="#334155"/>
        <path d="${up}" fill="none" stroke="#22c55e" stroke-width="2"/>
        <path d="${lo}" fill="none" stroke="#22c55e" stroke-width="2"/>
        <path d="${f}" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
        <text x="420" y="40" fill="#22c55e" font-size="13">±|x| 上下界</text>
        <text x="420" y="65" fill="#60a5fa" font-size="13">x sin(1/x)</text>
        <text x="420" y="100" fill="#facc15" font-size="13">x→0 时都挤向 0</text>
      `;
      ui.side.innerHTML = `
        <div class="ix-kv"><span>窗口半宽</span><b>${zoom.toFixed(2)}</b></div>
        <div class="ix-kv hi"><span>极限</span><b>0</b></div>
        <p class="ix-note">−|x| ≤ x sin(1/x) ≤ |x|，两边 →0，故中间 →0。</p>
      `;
      ui.out.innerHTML = `夹逼：g≤f≤h 且 lim g=lim h=L ⇒ lim f=L。`;
    }
    bind(ui.wrap, draw);
    draw();
    return ui.wrap;
  };

  console.info("diagrams-more: registered", [
    "fermat-little",
    "cauchy-schwarz",
    "bayes",
    "binomial",
    "law-of-cosines",
    "euler-bridges",
    "taylor",
    "sandwich"
  ]);
})();

/**
 * KaTeX 公式渲染 — 本地优先、失败可见、可重复调用
 */
window.MathRender = (function () {
  const SUB = {
    "₀": "0", "₁": "1", "₂": "2", "₃": "3", "₄": "4",
    "₅": "5", "₆": "6", "₇": "7", "₈": "8", "₉": "9",
    "ₐ": "a", "ₑ": "e", "ᵢ": "i", "ⱼ": "j", "ₖ": "k",
    "ₙ": "n", "ₘ": "m", "ₚ": "p", "ₛ": "s", "ₜ": "t", "ₓ": "x"
  };
  const SUP = {
    "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4",
    "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9",
    "ⁿ": "n", "ᵏ": "k", "ᵐ": "m", "⁺": "+", "⁻": "-"
  };

  let lastRoot = null;

  function packRuns(s, map, wrap) {
    let out = "", i = 0;
    while (i < s.length) {
      if (map[s[i]] !== undefined) {
        let buf = "";
        while (i < s.length && map[s[i]] !== undefined) {
          buf += map[s[i]];
          i++;
        }
        out += wrap(buf);
      } else out += s[i++];
    }
    return out;
  }

  function decodeEntities(s) {
    return String(s)
      .replace(/&lt;/g, "<")
      .replace(/&gt;/g, ">")
      .replace(/&amp;/g, "&")
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'");
  }

  function toLatex(input) {
    if (!input) return "";
    let s = decodeEntities(String(input)).trim();
    const mostlyLatex = /\\[a-zA-Z]+/.test(s);

    s = s.replace(/\r\n/g, "\n").replace(/\n+/g, " \\\\ ");

    if (!mostlyLatex) {
      const pairs = [
        [/∬/g, "\\iint "],
        [/∫_\{([^}]+)\}\^\{([^}]+)\}/g, "\\int_{$1}^{$2}"],
        [/∫_\{([^}]+)\}/g, "\\int_{$1}"],
        [/∫_([A-Za-z0-9π∞∂\\+\-]+)\^([A-Za-z0-9π∞∂\\+\-]+)/g, "\\int_{$1}^{$2}"],
        [/∫_([A-Za-z0-9π∞∂\\+\-]+)/g, "\\int_{$1}"],
        [/∫/g, "\\int "],
        [/∑_\{([^}]+)\}\^\{([^}]+)\}/g, "\\sum_{$1}^{$2}"],
        [/∑_\{([^}]+)\}/g, "\\sum_{$1}"],
        [/∑_([A-Za-z0-9]+)\^([A-Za-z0-9∞\\]+)/g, "\\sum_{$1}^{$2}"],
        [/∑_([A-Za-z0-9]+)/g, "\\sum_{$1}"],
        [/∑/g, "\\sum "],
        [/∏/g, "\\prod "],
        [/√\(([^)]+)\)/g, "\\sqrt{$1}"],
        [/√([A-Za-z0-9]+)/g, "\\sqrt{$1}"],
        [/√/g, "\\sqrt{}"],
        [/∂/g, "\\partial "],
        [/∞/g, "\\infty "],
        [/π/g, "\\pi "],
        [/θ/g, "\\theta "],
        [/δ/g, "\\delta "],
        [/ε/g, "\\varepsilon "],
        [/ξ/g, "\\xi "],
        [/χ/g, "\\chi "],
        [/ψ/g, "\\psi "],
        [/ω/g, "\\omega "],
        [/α/g, "\\alpha "],
        [/β/g, "\\beta "],
        [/γ/g, "\\gamma "],
        [/λ/g, "\\lambda "],
        [/μ/g, "\\mu "],
        [/σ/g, "\\sigma "],
        [/τ/g, "\\tau "],
        [/ℝ/g, "\\mathbb{R}"],
        [/ℤ/g, "\\mathbb{Z}"],
        [/ℕ/g, "\\mathbb{N}"],
        [/ℚ/g, "\\mathbb{Q}"],
        [/ℂ/g, "\\mathbb{C}"],
        [/𝔻/g, "\\mathbb{D}"],
        [/Σ/g, "\\Sigma "],
        [/Δ/g, "\\Delta "],
        [/∄/g, "\\nexists "],
        [/∃/g, "\\exists "],
        [/∀/g, "\\forall "],
        [/∈/g, "\\in "],
        [/∉/g, "\\notin "],
        [/⊂/g, "\\subset "],
        [/⊆/g, "\\subseteq "],
        [/∪/g, "\\cup "],
        [/∩/g, "\\cap "],
        [/⋃/g, "\\bigcup "],
        [/⋂/g, "\\bigcap "],
        [/≤/g, "\\le "],
        [/≥/g, "\\ge "],
        [/≠/g, "\\ne "],
        [/≈/g, "\\approx "],
        [/∼/g, "\\sim "],
        [/≍/g, "\\asymp "],
        [/≲/g, "\\lesssim "],
        [/≳/g, "\\gtrsim "],
        [/→/g, "\\to "],
        [/⇒/g, "\\Rightarrow "],
        [/⇔/g, "\\Leftrightarrow "],
        [/·/g, "\\cdot "],
        [/×/g, "\\times "],
        [/±/g, "\\pm "],
        [/⋯/g, "\\cdots "],
        [/…/g, "\\ldots "],
        [/∘/g, "\\circ "],
        [/⟨/g, "\\langle "],
        [/⟩/g, "\\rangle "],
        [/−/g, "-"],
        [/–/g, "-"],
        [/—/g, "-"],
        [/′/g, "'"],
        [/≡/g, "\\equiv "],
        [/⊬/g, "\\nvdash "],
        [/⊢/g, "\\vdash "],
        [/⊨/g, "\\models "],
        [/⊭/g, "\\nvDash "],
        [/¬/g, "\\neg "],
        [/↔/g, "\\leftrightarrow "],
        [/⇔/g, "\\Leftrightarrow "],
        [/⇒/g, "\\Rightarrow "],
        [/≔/g, "\\coloneqq "],
        [/⌜/g, "\\ulcorner "],
        [/⌝/g, "\\urcorner "],
        [/φ/g, "\\varphi "],
        [/ϕ/g, "\\phi "],
        [/ψ/g, "\\psi "],
        [/ω/g, "\\omega "],
        [/dim_H/g, "\\dim_H "],
        [/dim_M/g, "\\dim_M "],
        [/Provable_T/g, "\\mathrm{Provable}_T"],
        [/Proof_T/g, "\\mathrm{Proof}_T"],
        [/Con\\(T\\)/g, "\\mathrm{Con}(T)"],
        [/Con\\(T\\)/g, "\\mathrm{Con}(T)"]
      ];
      for (const [re, rep] of pairs) s = s.replace(re, rep);
      s = packRuns(s, SUB, (b) => `_{${b}}`);
      s = packRuns(s, SUP, (b) => `^{${b}}`);
      // 仅当尚未被 \text 包住时再包中文
      s = s.replace(/(?<![\\])([\u4e00-\u9fff]+)/g, (m) => `\\text{${m}}`);
    }

    s = s.replace(/\s+/g, " ").trim();
    return s;
  }

  function prettyFallback(latex) {
    return latex
      .replace(/\\mathbb\{R\}/g, "ℝ")
      .replace(/\\mathbb\{Z\}/g, "ℤ")
      .replace(/\\int/g, "∫")
      .replace(/\\sum/g, "∑")
      .replace(/\\prod/g, "∏")
      .replace(/\\le /g, "≤ ")
      .replace(/\\ge /g, "≥ ")
      .replace(/\\to /g, "→ ")
      .replace(/\\cdot /g, "· ")
      .replace(/\\infty/g, "∞")
      .replace(/\\pi /g, "π ")
      .replace(/\\,/g, " ")
      .replace(/\\ /g, " ")
      .replace(/\\dfrac\{([^}]+)\}\{([^}]+)\}/g, "($1)/($2)")
      .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, "($1)/($2)")
      .replace(/\\text\{([^}]*)\}/g, "$1")
      .replace(/\\subseteq/g, "⊆")
      .replace(/\\subset/g, "⊂")
      .replace(/\\in /g, "∈ ")
      .replace(/\\forall/g, "∀")
      .replace(/\\exists/g, "∃")
      .replace(/\\dim_H/g, "dim_H")
      .replace(/\\,/g, " ");
  }

  function renderEl(el, display) {
    if (!el) return;

    const attr = el.getAttribute("data-latex");
    let raw = attr != null && attr !== "" ? attr : el.textContent || "";
    raw = decodeEntities(raw).trim();
    // 若已是 katex 成功渲染则跳过
    if (el.classList.contains("math-done") && el.querySelector(".katex-html, .katex")) return;

    if (!raw) {
      el.innerHTML = '<span class="math-miss">（空公式）</span>';
      return;
    }

    let latex = attr != null && attr !== "" ? decodeEntities(attr) : toLatex(raw);
    latex = latex.replace(/&lt;/g, "<").replace(/&gt;/g, ">");

    if (!window.katex) {
      el.textContent = prettyFallback(latex);
      el.classList.add("math-fallback");
      return;
    }

    try {
      // 清空再渲，避免叠层
      el.textContent = "";
      window.katex.render(latex, el, {
        displayMode: !!display,
        throwOnError: false,
        strict: "ignore",
        trust: false,
        output: "html"
      });
      // 若 KaTeX 解析失败会生成 .katex-error
      if (el.querySelector(".katex-error") || !el.querySelector(".katex")) {
        el.innerHTML = "";
        const span = document.createElement("code");
        span.className = "math-fallback";
        span.textContent = prettyFallback(latex);
        span.title = "LaTeX: " + latex;
        el.appendChild(span);
      } else {
        el.classList.add("math-done");
        el.classList.remove("math-fallback");
      }
    } catch (e) {
      el.textContent = prettyFallback(latex);
      el.classList.add("math-fallback");
      el.title = String(e && e.message ? e.message : e);
    }
  }

  function renderInlineSpans(root) {
    root.querySelectorAll("span[data-latex], [data-latex]").forEach((el) => {
      if (el.classList.contains("formula") || el.classList.contains("calc-line") || el.classList.contains("ix-formula"))
        return;
      renderEl(el, el.getAttribute("data-display") === "1");
    });
  }

  function walkText(root) {
    if (!window.katex) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const p = node.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        if (p.closest("script,style,.katex,.math-done,.math-fallback,.formula,.calc-line,.ix-svg,svg,code,pre,.ix-card,.math-miss"))
          return NodeFilter.FILTER_REJECT;
        if (p.hasAttribute && p.hasAttribute("data-latex")) return NodeFilter.FILTER_REJECT;
        const t = node.nodeValue;
        if (/[∫∑∏√≤≥≠≈∈→⇒·×±∞πθδελξχψ∂ℕℤℚℝℂ]|[₀-₉⁰-⁹]|dim_[HM]/.test(t))
          return NodeFilter.FILTER_ACCEPT;
        return NodeFilter.FILTER_REJECT;
      }
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach((textNode) => {
      const text = textNode.nodeValue;
      const pattern =
        /(?:dim_[HM]\s*[A-Za-z][^\s，。；;]{0,24}|[∫∑][^，。；;\n]{1,50}|[A-Za-z][A-Za-z0-9_]*\s*=\s*[^，。；;\n]{1,40})/g;
      const parts = [];
      let last = 0;
      let m;
      while ((m = pattern.exec(text)) !== null) {
        if (m.index > last) parts.push({ t: text.slice(last, m.index), math: false });
        parts.push({ t: m[0], math: true });
        last = m.index + m[0].length;
      }
      if (last < text.length) parts.push({ t: text.slice(last), math: false });
      if (!parts.some((p) => p.math)) return;

      const frag = document.createDocumentFragment();
      parts.forEach((p) => {
        if (!p.math) {
          frag.appendChild(document.createTextNode(p.t));
          return;
        }
        const span = document.createElement("span");
        span.className = "math-inline";
        try {
          window.katex.render(toLatex(p.t.trim()), span, {
            displayMode: false,
            throwOnError: false,
            strict: "ignore"
          });
        } catch (e) {
          span.textContent = p.t;
        }
        frag.appendChild(span);
      });
      textNode.parentNode.replaceChild(frag, textNode);
    });
  }

  function render(root) {
    if (!root) return;
    lastRoot = root;

    const run = () => {
      root.querySelectorAll(".formula, .ix-formula").forEach((el) => {
        el.classList.remove("math-done");
        renderEl(el, true);
      });
      root.querySelectorAll(".calc-line").forEach((el) => {
        el.classList.remove("math-done");
        renderEl(el, true);
      });
      renderInlineSpans(root);
      const article = root.querySelector(".article");
      if (article) walkText(article);
    };

    if (window.katex) {
      run();
      return;
    }

    // 先显示 fallback，等 KaTeX 就绪再正式渲染
    run();
    let n = 0;
    const id = setInterval(() => {
      n++;
      if (window.katex) {
        clearInterval(id);
        run();
        return;
      }
      if (n > 150) clearInterval(id);
    }, 40);
  }

  // KaTeX 脚本 onload 时再渲一次
  window.__mathRenderKick = function () {
    if (lastRoot) render(lastRoot);
    else if (document.getElementById("app")) render(document.getElementById("app"));
  };

  return { toLatex, render, whenReady: (cb) => (window.katex ? cb() : setTimeout(cb, 300)) };
})();
