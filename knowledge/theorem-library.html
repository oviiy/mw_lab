</li>\n<li><strong>Can't have</strong> <span data-latex=\"T\\vdash G\">T ⊢ G</span>: If so, then G is provable, contradicting the meaning of G (in a consistent system).\n            <div class=\"calc-line\" data-latex=\"T\\vdash G \\ \\Rightarrow\\ T\\text{ 不一致}\"></div>\n</li>\n<li><strong>Nor can there be</strong> <span data-latex=\"T\\vdash\\neg G\">T ⊢ ¬G</span>(Under appropriate consistency assumptions). Rosser's improvement weakens the hypothesis.</li>\n<li>therefore <span data-latex=\"T\\nvdash G\">T ⊬ G</span>, then \"G is not provable\" is true, and G is saying this → G is true.</li>\n</ol>\n<h3>Second Theorem (Outline)</h3>\n<ol class=\"steps\">\n<li>It can be formalized as follows:<div class=\"calc-line\" data-latex=\"T\\vdash \\mathrm{Con}(T)\\rightarrow G\"></div></li>\n<li>like <span data-latex=\"T\\vdash\\mathrm{Con}(T)\">T ⊢ Con(T)</span>,but <span data-latex=\"T\\vdash G\">T ⊢ G</span>, contradicting the first theorem.</li>\n<li>Therefore <div class=\"calc-line\" data-latex=\"T\\nvdash \\mathrm{Con}(T)\"></div></li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<h3>Rother improvements</h3>\n<p>Just simple consistency, not ω-consistency: construct a Rosser sentence using the proof that there is no smaller-numbered ¬G.</p>\n<h3>and downtime issues</h3>\n<p>Turing: There is no algorithm for determining whether any program has halted. The proof also uses diagonal self-reference. The two jointly delineate the \"form/algorithm\" boundary.</p>\n<div class=\"warn-box\">Incomplete ≠ Math is useless. What it limits is the ambition of \"a single system to conquer the world\".</div>\n", "why": "\n<p>Delimiting the boundaries of \"formal proof\". It is a cousin to the computer, \"some problems the algorithm will never be able to solve\".</p>\n", "try": "\n<ul>\n<li>Discussion: Whether \"true\", \"verifiable\" and \"computer can determine\" are the same thing - giving examples from each case.</li>\n<li>Understanding the halting problem: Can a program tell that another program will halt.</li>\n</ul>\n"}}, {"id": "brouwer", "field": "math", "difficulty": "hard", "emoji": "☕", "iconClass": "warm", "related": ["ivt", "euler-polyhedron", "four-color"], "__i18n": {"zh": {"id": "brouwer", "title": "布劳威尔不动点定理", "subtitle": "连续变形，总有一点留在原地", "emoji": "☕", "iconClass": "warm", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["拓扑", "不动点", "应用"], "era": "1910 年代", "oneLiner": "把圆盘连续揉进自己里面，至少有一点没动——搅咖啡、揉地图都是它的亲戚。", "people": [{"role": "证明", "name": "布劳威尔", "years": "1881–1966"}], "related": ["ivt", "euler-polyhedron", "four-color"], "sections": {"story": "\n        <p>理想情况下搅杯咖啡：液体连续动完，必有一点回到原位置。把画了地图的纸揉皱再塞回轮廓里，也总有某地还在「自己正上方」。</p>\n        <p>布劳威尔把这种日常直觉变成定理。博弈论里「均衡一定存在」，也用同类不动点思想。</p>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>把圆盘连续揉进自己里面，至少有一点不动。</p>\n        <div class=\"formula\" data-latex=\"f:D^n\\to D^n\\text{ 连续}\\ \\Rightarrow\\ \\exists x^*:\\ f(x^*)=x^*\"></div>\n        <p><span data-latex=\"D^n\">Dⁿ</span> 是闭单位球（二维就是闭圆盘）。</p>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">无回缩定理</div>\n          <p>不存在连续映射 r:Dⁿ→S^{n−1}=∂Dⁿ 使 r|S^{n−1} = id。（圆盘不能连续缩到边界且边界点不动。）</p>\n          <p>一维即：不存在连续 r:[−1,1]→{−1,1} 在端点为恒等——与 IVT 冲突。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>一维就是中间值定理；高维若没有不动点，会逼出一种「把圆盘压到边界且边界不动」的不可能变形。</p><div class=\"interactive\" data-widget=\"brouwer-1d\"></div>\n        <div class=\"proof-nav\"><span>反设无不动点</span><span>造回缩</span><span>矛盾</span></div>\n        <ol class=\"steps\">\n          <li>反设对所有 x，f(x)≠x。</li>\n          <li>对每个 x，作射线：从 f(x) 出发穿过 x（因不同点，方向唯一），继续延伸与球面 S^{n−1} 交于 r(x)。</li>\n          <li>几何上 r(x) = 解方程 f(x) + t(x−f(x)) 落在球面上的适当 t≥1。公式可显式写出，连续性由 f 连续与分母 |x−f(x)|≠0 保证。</li>\n          <li>若 x 已在边界，则 r(x)=x（射线从内部点 f(x) 穿过边界点 x，交点即 x）。</li>\n          <li>于是 r:Dⁿ→S^{n−1} 是连续回缩，与引理矛盾。</li>\n          <li>故存在不动点。</li>\n        </ol>\n        <p class=\"qed\">∎</p>\n      <div data-more-detail>\n    <h3>高维归约到「无回缩」</h3>\n    <p>一维即 IVT（上图）。高维：若无不动点，从 f(x) 过 x 射到边界得回缩 r:D→∂D，与拓扑矛盾。纳什均衡用的是集值推广（Kakutani）。</p>\n    </div>", "deep": "\n        <h3>一维即 IVT</h3>\n        <p>f:[a,b]→[a,b] 连续。看 g(x)=f(x)−x，g(a)≥0，g(b)≤0，IVT ⇒ g(c)=0。</p>\n        <h3>代数拓扑证明</h3>\n        <p>若无不动点则造回缩 ⇒ 诱导同调/同伦群上 id:H_{n−1}(S^{n−1})→H_{n−1}(S^{n−1}) 经过 H_{n−1}(Dⁿ)=0，矛盾。</p>\n        <h3>卡库塔尼</h3>\n        <p>上半连续的凸值对应也有不动点——用于纳什均衡。</p>\n      ", "why": "\n        <p>保证「解存在」的拓扑自动机。经济均衡、微分方程周期解，常走到这里。</p>\n      ", "try": "\n        <ul>\n          <li>看交互图：曲线 y=f(x) 和 y=x 一定相交——交点就是不动点。</li>\n          <li>想：开区间 (0,1) 上 f(x)=x/2 为什么可以没有不动点？（缺了「闭」和端点。）</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "brouwer", "title": "Brouwer's fixed point theorem", "subtitle": "Continuous deformation, always a little bit remains in place", "emoji": "☕", "iconClass": "warm", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["Topology", "fixed point", "application"], "era": "1910s", "oneLiner": "Continuously kneading the disk into itself, leaving at least a little untouched - stirring coffee and kneading maps are all its relatives.", "people": [{"role": "prove", "name": "Brouwer", "years": "1881–1966"}], "related": ["ivt", "euler-polyhedron", "four-color"], "sections": {"story": "\n<p>Ideally, stir a cup of coffee: after the liquid moves continuously, there must be a point that returns to its original position. Even if I crumple the paper on which the map is drawn and stuff it back into the outline, there will always be a place \"directly above me.\"</p>\n<p>Brouwer turned this everyday intuition into a theorem. In game theory, \"equilibrium must exist\", and the same kind of fixed point thinking is also used.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Continuously rub the disc into yourself, at least a little bit.</p>\n<div class=\"formula\" data-latex=\"f:D^n\\to D^n\\text{ 连续}\\ \\Rightarrow\\ \\exists x^*:\\ f(x^*)=x^*\"></div>\n<p><span data-latex=\"D^n\">Dⁿ</span> It is a closed unit ball (two dimensions is a closed disk).</p>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">No retraction theorem</div>\n<p>There is no continuous mapping r:Dⁿ→S^{n−1}=∂Dⁿ such that r|S^{n−1} = id. (The disc cannot continuously shrink to the boundary and the boundary point does not move.)</p>\n<p>One-dimensional i.e.: there is no continuity r:[−1,1]→{−1,1} that is identical at the endpoints - conflicts with IVT.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>One dimension is the intermediate value theorem; if there are no fixed points in high dimensions, it will force an impossible deformation of \"pressing the disk to the boundary without moving the boundary.\"</p><div class=\"interactive\" data-widget=\"brouwer-1d\"></div>\n<div class=\"proof-nav\"><span>Suppose there are no fixed points</span><span>retraction</span><span>contradiction</span></div>\n<ol class=\"steps\">\n<li>Suppose f(x)≠x for all x.</li>\n<li>For each x, draw a ray: start from f(x) and pass through x (the direction is unique due to different points), continue to extend and intersect the sphere S^{n−1} at r(x).</li>\n<li>Geometrically r(x) = solves the equation f(x) + t(x−f(x)) falling on the sphere for appropriate t≥1. The formula can be written explicitly, and continuity is guaranteed by f being continuous with the denominator |x−f(x)|≠0.</li>\n<li>If x is already on the boundary, then r(x)=x (the ray passes from the internal point f(x) through the boundary point x, and the intersection point is x).</li>\n<li>So r:Dⁿ→S^{n−1} is a continuous shrinkage, which is inconsistent with the lemma.</li>\n<li>Therefore there is a fixed point.</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>High-dimensional reduction to \"no shrinkage\"</h3>\n<p>One dimension is IVT (above). High dimension: If there is no fixed point, the projection from f(x) through x to the boundary will shrink r:D→∂D, which is inconsistent with the topology. Nash equilibrium uses set-valued generalization (Kakutani).</p>\n</div>", "deep": "\n<h3>One-dimensional i.e. IVT</h3>\n<p>f:[a,b]→[a,b] continuous. See g(x)=f(x)−x, g(a)≥0, g(b)≤0, IVT ⇒ g(c)=0.</p>\n<h3>Algebraic topology proof</h3>\n<p>If there is no fixed point, it will cause retraction ⇒ On the induced homology/homology group, id:H_{n−1}(S^{n−1})→H_{n−1}(S^{n−1}) passes through H_{n−1}(Dⁿ)=0, which is a contradiction.</p>\n<h3>Kakutani</h3>\n<p>The upper semi-continuous convex value correspondence also has a fixed point - for Nash equilibria.</p>\n", "why": "\n<p>Topological automaton that guarantees \"solution exists\". Economic equilibrium and periodic solutions to differential equations often come here.</p>\n", "try": "\n<ul>\n<li>Look at the interaction diagram: the curves y=f(x) and y=x must intersect - the point of intersection is the fixed point.</li>\n<li>Think: Why can f(x)=x/2 on the open interval (0,1) have no fixed points? (Missing \"closed\" and endpoint.)</li>\n</ul>\n"}, "field": "math"}}, "title": "Brouwer's fixed point theorem", "subtitle": "Continuous deformation, always a little bit remains in place", "difficultyLabel": "Hardcore challenge", "tags": ["Topology", "fixed point", "application"], "era": "1910s", "oneLiner": "Continuously kneading the disk into itself, leaving at least a little untouched - stirring coffee and kneading maps are all its relatives.", "people": [{"role": "prove", "name": "Brouwer", "years": "1881–1966"}], "sections": {"story": "\n<p>Ideally, stir a cup of coffee: after the liquid moves continuously, there must be a point that returns to its original position. Even if I crumple the paper on which the map is drawn and stuff it back into the outline, there will always be a place \"directly above me.\"</p>\n<p>Brouwer turned this everyday intuition into a theorem. In game theory, \"equilibrium must exist\", and the same kind of fixed point thinking is also used.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Continuously rub the disc into yourself, at least a little bit.</p>\n<div class=\"formula\" data-latex=\"f:D^n\\to D^n\\text{ 连续}\\ \\Rightarrow\\ \\exists x^*:\\ f(x^*)=x^*\"></div>\n<p><span data-latex=\"D^n\">Dⁿ</span> It is a closed unit ball (two dimensions is a closed disk).</p>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">No retraction theorem</div>\n<p>There is no continuous mapping r:Dⁿ→S^{n−1}=∂Dⁿ such that r|S^{n−1} = id. (The disc cannot continuously shrink to the boundary and the boundary point does not move.)</p>\n<p>One-dimensional i.e.: there is no continuity r:[−1,1]→{−1,1} that is identical at the endpoints - conflicts with IVT.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>One dimension is the intermediate value theorem; if there are no fixed points in high dimensions, it will force an impossible deformation of \"pressing the disk to the boundary without moving the boundary.\"</p><div class=\"interactive\" data-widget=\"brouwer-1d\"></div>\n<div class=\"proof-nav\"><span>Suppose there are no fixed points</span><span>retraction</span><span>contradiction</span></div>\n<ol class=\"steps\">\n<li>Suppose f(x)≠x for all x.</li>\n<li>For each x, draw a ray: start from f(x) and pass through x (the direction is unique due to different points), continue to extend and intersect the sphere S^{n−1} at r(x).</li>\n<li>Geometrically r(x) = solves the equation f(x) + t(x−f(x)) falling on the sphere for appropriate t≥1. The formula can be written explicitly, and continuity is guaranteed by f being continuous with the denominator |x−f(x)|≠0.</li>\n<li>If x is already on the boundary, then r(x)=x (the ray passes from the internal point f(x) through the boundary point x, and the intersection point is x).</li>\n<li>So r:Dⁿ→S^{n−1} is a continuous shrinkage, which is inconsistent with the lemma.</li>\n<li>Therefore there is a fixed point.</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>High-dimensional reduction to \"no shrinkage\"</h3>\n<p>One dimension is IVT (above). High dimension: If there is no fixed point, the projection from f(x) through x to the boundary will shrink r:D→∂D, which is inconsistent with the topology. Nash equilibrium uses set-valued generalization (Kakutani).</p>\n</div>", "deep": "\n<h3>One-dimensional i.e. IVT</h3>\n<p>f:[a,b]→[a,b] continuous. See g(x)=f(x)−x, g(a)≥0, g(b)≤0, IVT ⇒ g(c)=0.</p>\n<h3>Algebraic topology proof</h3>\n<p>If there is no fixed point, it will cause retraction ⇒ On the induced homology/homology group, id:H_{n−1}(S^{n−1})→H_{n−1}(S^{n−1}) passes through H_{n−1}(Dⁿ)=0, which is a contradiction.</p>\n<h3>Kakutani</h3>\n<p>The upper semi-continuous convex value correspondence also has a fixed point - for Nash equilibria.</p>\n", "why": "\n<p>Topological automaton that guarantees \"solution exists\". Economic equilibrium and periodic solutions to differential equations often come here.</p>\n", "try": "\n<ul>\n<li>Look at the interaction diagram: the curves y=f(x) and y=x must intersect - the point of intersection is the fixed point.</li>\n<li>Think: Why can f(x)=x/2 on the open interval (0,1) have no fixed points? (Missing \"closed\" and endpoint.)</li>\n</ul>\n"}}, {"id": "crt", "field": "math", "difficulty": "medium", "emoji": "🧮", "iconClass": "green", "related": ["fta-arith", "euclid-primes", "pigeonhole"], "__i18n": {"zh": {"id": "crt", "title": "中国剩余定理", "subtitle": "韩信点兵：几条余数拼出一个数", "emoji": "🧮", "iconClass": "green", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["数论", "中国古代", "算法"], "era": "《孙子算经》；高斯等系统化", "oneLiner": "三三数余二、五五数余三、七七数余二——余数对了，在一个周期里答案就定了。", "people": [{"role": "经典问题", "name": "《孙子算经》", "years": "约 3–5 世纪"}, {"role": "系统化", "name": "秦九韶、欧拉、高斯", "years": "中世纪–近代"}], "related": ["fta-arith", "euclid-primes", "pigeonhole"], "sections": {"story": "\n        <p>《孙子算经》名题：一堆东西，三个三个数剩二，五个五个数剩三，七个七个数剩二，多少？答案 23（每隔 105 再出现）。</p>\n        <p>一般理论叫中国剩余定理：除数两两互素时，余数系统能唯一拼回「大周期」里的答案。今天计算机还用它拆大整数运算。</p>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>几条「除以 m 余 a」的条件，在除数两两互素时，能拼出模 <span data-latex=\"M\">M</span> 唯一的答案。</p>\n        <div class=\"formula\" data-latex=\"x\\equiv a_i\\pmod{m_i},\\ i=1,\\ldots,k\"></div>\n        <p>当 <span data-latex=\"m_i\">m_i</span> 两两互素、<span data-latex=\"M=\\prod m_i\">M=∏m_i</span> 时，解在模 <span data-latex=\"M\">M</span> 下唯一。</p>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理（逆元存在）</div>\n          <p>若 gcd(a,m)=1，则存在 y 使 ay≡1 (mod m)。由贝祖 ax+my=1。</p>\n        </div>\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理（两两互素 ⇒ 与乘积互素）</div>\n          <p>gcd(mᵢ, M/mᵢ)=1。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>每条余数条件贡献一块积木；互素保证积木能严丝合缝，拼出来模大周期唯一。</p><div class=\"interactive\" data-widget=\"crt-visual\"></div>\n        <div class=\"proof-nav\"><span>构造</span><span>验证</span><span>唯一性</span></div>\n        <ol class=\"steps\">\n          <li>令 Mᵢ = M/mᵢ。由引理 gcd(Mᵢ,mᵢ)=1，取 yᵢ 使 Mᵢ yᵢ ≡ 1 (mod mᵢ)。</li>\n          <li>令\n            <div class=\"calc-line\" data-latex=\"x_{0} = \\sum_{i=1}^k a_{i} M_{i} y_{i}\"></div>\n          </li>\n          <li><strong>验证：</strong>固定 j。对 i≠j，mⱼ | Mᵢ（因 Mᵢ 含 mⱼ），故 aᵢ Mᵢ yᵢ ≡0 (mod mⱼ)。而 aⱼ Mⱼ yⱼ ≡ aⱼ ·1 (mod mⱼ)。故 x₀≡aⱼ (mod mⱼ)。</li>\n          <li><strong>唯一性：</strong>若 x,x' 都是解，则 mᵢ|(x−x') 对一切 i。因两两互素，M|(x−x')（可逐步：m₁m₂|差，再乘上去）。故模 M 同类。</li>\n        </ol>\n        <p class=\"qed\">∎</p>\n        <h3>孙子题计算</h3>\n        <div class=\"calc-line\" data-latex=\"m=3,5,7； a=2,3,2； M=105\"></div>\n        <div class=\"calc-line\" data-latex=\"M_{1}=35, y_{1}=2 \\text{因} 35\\cdot 2=70\\equiv 1 (mod 3)\"></div>\n        <div class=\"calc-line\" data-latex=\"M_{2}=21, y_{2}=1 \\text{因} 21\\equiv 1 (mod 5)\"></div>\n        <div class=\"calc-line\" data-latex=\"M_{3}=15, y_{3}=1 \\text{因} 15\\equiv 1 (mod 7)\"></div>\n        <div class=\"calc-line\" data-latex=\"x=2\\cdot 35\\cdot 2 + 3\\cdot 21\\cdot 1 + 2\\cdot 15\\cdot 1 = 140+63+30=233 \\equiv 23 (mod 105)\"></div>\n      <div data-more-detail>\n    <h3>构造公式回顾</h3>\n    <div class=\"calc-line\" data-latex=\"x = \\Sigma a_{i} M_{i} y_{i}， M_{i}=M/m_{i}， M_{i} y_{i} \\equiv 1 (mod m_{i})\"></div>\n    <p>交互图中拖到 23 时三条件全绿；通解 +105k。不互素时需 a≡b (mod gcd) 才有解。</p>\n    </div>", "deep": "\n        <h3>模不互素时</h3>\n        <p>x≡a (mod m)，x≡b (mod n) 有解 ⇔ a≡b (mod gcd(m,n))。解模 lcm(m,n) 唯一。</p>\n        <h3>环论表述</h3>\n        <p>ℤ/Mℤ ≅ ℤ/m₁ℤ × … × ℤ/mₖℤ（两两互素时）。</p>\n      ", "why": "\n        <p>历法、密码实现、编码，都能看到「化整为零再合并」的影子。</p>\n      ", "try": "\n        <ul>\n          <li>拖交互图到 23，看三行是否全绿。</li>\n          <li>自己算一遍：为什么周期是 3×5×7=105？</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "crt", "title": "Chinese Remainder Theorem", "subtitle": "Han Xin points his troops: several remainders spell out a number", "emoji": "🧮", "iconClass": "green", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["number theory", "ancient china", "algorithm"], "era": "\"Sun Zi Suan Jing\"; Gauss and other systematization", "oneLiner": "Three to three will leave two, five to five will leave three, seven to seven will leave two - if the remainder is correct, the answer will be determined within one cycle.", "people": [{"role": "Classic question", "name": "\"Sun Tzu Sutra\"", "years": "ca. 3rd–5th century"}, {"role": "Systematize", "name": "Qin Jiushao, Euler, Gauss", "years": "Medieval – modern times"}], "related": ["fta-arith", "euclid-primes", "pigeonhole"], "sections": {"story": "\n<p>A famous title in \"Sun Tzu's Suan Jing\": A pile of things, when counting three and three, two is left; when five and five are counted, three is left; when seven and seven are counted, two is left, how many? Answer 23 (recurs every 105).</p>\n<p>The general theory is called the Chinese Remainder Theorem: when the divisors are mutually prime, the remainder system can uniquely piece together the answer in the \"Great Cycle\". Computers today still use it to perform large integer operations.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Several conditions for \"dividing m and leaving a\" can spell out the modulus when the divisors are mutually prime. <span data-latex=\"M\">M</span> The only answer.</p>\n<div class=\"formula\" data-latex=\"x\\equiv a_i\\pmod{m_i},\\ i=1,\\ldots,k\"></div>\n<p>when <span data-latex=\"m_i\">m_i</span> Pairs are prime to each other,<span data-latex=\"M=\\prod m_i\">M=∏m_i</span> When, the solution is in the module <span data-latex=\"M\">M</span> Next only.</p>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (existence of inverse elements)</div>\n<p>If gcd(a,m)=1, then there exists y such that ay≡1 (mod m). By bezu ax+my=1.</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (pairwise coprime ⇒ and product coprime)</div>\n<p>gcd(mᵢ, M/mᵢ)=1。</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Each remainder condition contributes a building block; mutual prime ensures that the building blocks fit together perfectly, making the model a unique one.</p><div class=\"interactive\" data-widget=\"crt-visual\"></div>\n<div class=\"proof-nav\"><span>structure</span><span>verify</span><span>uniqueness</span></div>\n<ol class=\"steps\">\n<li>Let Mᵢ = M/mᵢ. According to the lemma gcd(Mᵢ,mᵢ)=1, take yᵢ so that Mᵢ yᵢ ≡ 1 (mod mᵢ).</li>\n<li>make\n            <div class=\"calc-line\" data-latex=\"x_{0} = \\sum_{i=1}^k a_{i} M_{i} y_{i}\"></div>\n</li>\n<li><strong>verify:</strong>Fixed j. For i≠j, mⱼ | Mᵢ (because Mᵢ contains mⱼ), so aᵢ Mᵢ yᵢ ≡0 (mod mⱼ). And aⱼ Mⱼ yⱼ ≡ aⱼ ·1 (mod mⱼ). Therefore x₀≡aⱼ (mod mⱼ).</li>\n<li><strong>Uniqueness:</strong>If x,x' are solutions, then mᵢ|(x−x') for all i. Because the two are mutually prime, M|(x−x') (you can step by step: m₁m₂| difference, and then multiply it). Therefore, the model M is of the same type.</li>\n</ol>\n<p class=\"qed\">∎</p>\n<h3>Sun Tzu's calculation</h3>\n<div class=\"calc-line\" data-latex=\"m=3,5,7； a=2,3,2； M=105\"></div>\n<div class=\"calc-line\" data-latex=\"M_{1}=35, y_{1}=2 \\text{因} 35\\cdot 2=70\\equiv 1 (mod 3)\"></div>\n<div class=\"calc-line\" data-latex=\"M_{2}=21, y_{2}=1 \\text{因} 21\\equiv 1 (mod 5)\"></div>\n<div class=\"calc-line\" data-latex=\"M_{3}=15, y_{3}=1 \\text{因} 15\\equiv 1 (mod 7)\"></div>\n<div class=\"calc-line\" data-latex=\"x=2\\cdot 35\\cdot 2 + 3\\cdot 21\\cdot 1 + 2\\cdot 15\\cdot 1 = 140+63+30=233 \\equiv 23 (mod 105)\"></div>\n<div data-more-detail=\"\">\n<h3>Review of construction formulas</h3>\n<div class=\"calc-line\" data-latex=\"x = \\Sigma a_{i} M_{i} y_{i}， M_{i}=M/m_{i}， M_{i} y_{i} \\equiv 1 (mod m_{i})\"></div>\n<p>When dragging to 23 in the interactive diagram, all three conditions are green; general solution +105k. When not relatively prime, a≡b (mod gcd) is required to have a solution.</p>\n</div>", "deep": "\n<h3>When the models are not mutually prime</h3>\n<p>x≡a (mod m), x≡b (mod n) has the solution ⇔ a≡b (mod gcd(m,n)). Solve the model lcm(m,n) uniquely.</p>\n<h3>ring theory expression</h3>\n<p>ℤ/Mℤ ≅ ℤ/m₁ℤ × … × ℤ/mₖℤ (when the two are mutually prime).</p>\n", "why": "\n<p>Calendars, cryptographic implementations, and coding can all see the shadow of \"breaking them into parts and then merging them again.\"</p>\n", "try": "\n<ul>\n<li>Drag the interaction diagram to 23 and see if the three lines are all green.</li>\n<li>Do the math yourself: Why is the period 3×5×7=105?</li>\n</ul>\n"}, "field": "math"}}, "title": "Chinese Remainder Theorem", "subtitle": "Han Xin points his troops: several remainders spell out a number", "difficultyLabel": "Spend some time thinking", "tags": ["number theory", "ancient china", "algorithm"], "era": "\"Sun Zi Suan Jing\"; Gauss and other systematization", "oneLiner": "Three to three will leave two, five to five will leave three, seven to seven will leave two - if the remainder is correct, the answer will be determined within one cycle.", "people": [{"role": "Classic question", "name": "\"Sun Tzu Sutra\"", "years": "ca. 3rd–5th century"}, {"role": "Systematize", "name": "Qin Jiushao, Euler, Gauss", "years": "Medieval – modern times"}], "sections": {"story": "\n<p>A famous title in \"Sun Tzu's Suan Jing\": A pile of things, when counting three and three, two is left; when five and five are counted, three is left; when seven and seven are counted, two is left, how many? Answer 23 (recurs every 105).</p>\n<p>The general theory is called the Chinese Remainder Theorem: when the divisors are mutually prime, the remainder system can uniquely piece together the answer in the \"Great Cycle\". Computers today still use it to perform large integer operations.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Several conditions for \"dividing m and leaving a\" can spell out the modulus when the divisors are mutually prime. <span data-latex=\"M\">M</span> The only answer.</p>\n<div class=\"formula\" data-latex=\"x\\equiv a_i\\pmod{m_i},\\ i=1,\\ldots,k\"></div>\n<p>when <span data-latex=\"m_i\">m_i</span> Pairs are prime to each other,<span data-latex=\"M=\\prod m_i\">M=∏m_i</span> When, the solution is in the module <span data-latex=\"M\">M</span> Next only.</p>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (existence of inverse elements)</div>\n<p>If gcd(a,m)=1, then there exists y such that ay≡1 (mod m). By bezu ax+my=1.</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (pairwise coprime ⇒ and product coprime)</div>\n<p>gcd(mᵢ, M/mᵢ)=1。</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Each remainder condition contributes a building block; mutual prime ensures that the building blocks fit together perfectly, making the model a unique one.</p><div class=\"interactive\" data-widget=\"crt-visual\"></div>\n<div class=\"proof-nav\"><span>structure</span><span>verify</span><span>uniqueness</span></div>\n<ol class=\"steps\">\n<li>Let Mᵢ = M/mᵢ. According to the lemma gcd(Mᵢ,mᵢ)=1, take yᵢ so that Mᵢ yᵢ ≡ 1 (mod mᵢ).</li>\n<li>make\n            <div class=\"calc-line\" data-latex=\"x_{0} = \\sum_{i=1}^k a_{i} M_{i} y_{i}\"></div>\n</li>\n<li><strong>verify:</strong>Fixed j. For i≠j, mⱼ | Mᵢ (because Mᵢ contains mⱼ), so aᵢ Mᵢ yᵢ ≡0 (mod mⱼ). And aⱼ Mⱼ yⱼ ≡ aⱼ ·1 (mod mⱼ). Therefore x₀≡aⱼ (mod mⱼ).</li>\n<li><strong>Uniqueness:</strong>If x,x' are solutions, then mᵢ|(x−x') for all i. Because the two are mutually prime, M|(x−x') (you can step by step: m₁m₂| difference, and then multiply it). Therefore, the model M is of the same type.</li>\n</ol>\n<p class=\"qed\">∎</p>\n<h3>Sun Tzu's calculation</h3>\n<div class=\"calc-line\" data-latex=\"m=3,5,7； a=2,3,2； M=105\"></div>\n<div class=\"calc-line\" data-latex=\"M_{1}=35, y_{1}=2 \\text{因} 35\\cdot 2=70\\equiv 1 (mod 3)\"></div>\n<div class=\"calc-line\" data-latex=\"M_{2}=21, y_{2}=1 \\text{因} 21\\equiv 1 (mod 5)\"></div>\n<div class=\"calc-line\" data-latex=\"M_{3}=15, y_{3}=1 \\text{因} 15\\equiv 1 (mod 7)\"></div>\n<div class=\"calc-line\" data-latex=\"x=2\\cdot 35\\cdot 2 + 3\\cdot 21\\cdot 1 + 2\\cdot 15\\cdot 1 = 140+63+30=233 \\equiv 23 (mod 105)\"></div>\n<div data-more-detail=\"\">\n<h3>Review of construction formulas</h3>\n<div class=\"calc-line\" data-latex=\"x = \\Sigma a_{i} M_{i} y_{i}， M_{i}=M/m_{i}， M_{i} y_{i} \\equiv 1 (mod m_{i})\"></div>\n<p>When dragging to 23 in the interactive diagram, all three conditions are green; general solution +105k. When not relatively prime, a≡b (mod gcd) is required to have a solution.</p>\n</div>", "deep": "\n<h3>When the models are not mutually prime</h3>\n<p>x≡a (mod m), x≡b (mod n) has the solution ⇔ a≡b (mod gcd(m,n)). Solve the model lcm(m,n) uniquely.</p>\n<h3>ring theory expression</h3>\n<p>ℤ/Mℤ ≅ ℤ/m₁ℤ × … × ℤ/mₖℤ (when the two are mutually prime).</p>\n", "why": "\n<p>Calendars, cryptographic implementations, and coding can all see the shadow of \"breaking them into parts and then merging them again.\"</p>\n", "try": "\n<ul>\n<li>Drag the interaction diagram to 23 and see if the three lines are all green.</li>\n<li>Do the math yourself: Why is the period 3×5×7=105?</li>\n</ul>\n"}}, {"id": "kakeya", "field": "math", "difficulty": "hard", "emoji": "📍", "iconClass": "rose", "related": ["euler-polyhedron", "cantor", "four-color", "gauss-bonnet"], "__i18n": {"zh": {"id": "kakeya", "title": "挂谷猜想（贝西科维奇集）", "subtitle": "针能挤进零面积，却挤不掉满维度", "emoji": "📍", "iconClass": "rose", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["几何测度论", "调和分析", "前沿"], "era": "1917 转针问题；1919 零面积构造；维数猜想；2025 三维突破", "oneLiner": "每个方向都放一根「针」，集合可以薄到面积为 0，但不能薄到「维数」也塌掉。", "people": [{"role": "转针问题", "name": "挂谷宗一", "years": "1917"}, {"role": "零测度构造", "name": "贝西科维奇", "years": "1919 / 1920s"}, {"role": "二维维数", "name": "Davies；Córdoba 等", "years": "1970s"}, {"role": "三维维数猜想", "name": "王虹、Joshua Zahl", "years": "2025 证明"}], "related": ["euler-polyhedron", "cantor", "four-color", "gauss-bonnet"], "sections": {"story": "\n        <p>挂谷问：细针转一圈，扫过面积能多小？后来发现：如果只要求「每个方向有一根针」（不必连续转），面积可以任意小，甚至为 0。</p>\n        <p>但猜想说：再怎么挤，这个集合在「维数」上仍要撑满整个平面/空间——可以没面积，不能变成更瘦的「线状幽灵」。</p>\n        <div class=\"fun-box\"><strong>别踩坑：</strong>无限大无限薄的圆环不行——圆环装不下所有方向的整段针。正确图像是很多方向的细针大量重叠。</div>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>每个方向都放一根「针」，集合可以薄到面积为 0，但不能薄到「维数」也塌掉。</p>\n        <div class=\"def-box\">\n          <div class=\"def-title\">定义：挂谷集 / 贝西科维奇集</div>\n          <p>集合 <span data-latex=\"K\\subset\\mathbb{R}^n\">K ⊂ ℝⁿ</span> 叫挂谷集，意思是：每个方向都有一根长为 1 的针躺在里面。</p>\n          <div class=\"formula\" data-latex=\"\\forall\\,\\omega\\in S^{n-1},\\;\\exists\\,x\\in\\mathbb{R}^n:\\quad\\{x+t\\omega:0\\le t\\le 1\\}\\subset K\"></div>\n        </div>\n        <p><strong>贝西科维奇（平面）：</strong>存在平面挂谷集，面积可以是 0。</p>\n        <div class=\"formula\" data-latex=\"\\exists\\,K\\subset\\mathbb{R}^2:\\ K\\text{ 是挂谷集且 }|K|=0\"></div>\n        <p><strong>挂谷集猜想：</strong>挂谷集的维数必须等于空间维数。</p>\n        <div class=\"formula\" data-latex=\"K\\text{ 是挂谷集 }\\;\\Rightarrow\\;\\dim_H K=n\"></div>\n        <p><strong>已证：</strong><span data-latex=\"n=1\">n=1</span> 平凡；<span data-latex=\"n=2\">n=2</span> 上世纪 70 年代；<span data-latex=\"n=3\">n=3</span> 约 2025 年。更高维仍部分开放。</p>\n      ", "setup": "\n        <div class=\"def-box\">\n          <div class=\"def-title\">细管语言</div>\n          <p>把方向 <span data-latex=\"\\omega\">ω</span> 上的单位线段加粗成宽度 <span data-latex=\"\\delta\">δ</span> 的细管 <span data-latex=\"T_\\omega\">T_ω</span>。</p>\n          <div class=\"formula\" data-latex=\"\\text{关心：}\\quad\\Bigl|\\bigcup_\\omega T_\\omega\\Bigr|\\ \\text{随 }\\delta\\to 0\\text{ 如何变小}\"></div>\n          <p>若体积大约像 <span data-latex=\"\\delta^{n-d}\">δ^{n-d}</span>，就对应「维数约 d」。</p>\n        </div>\n        <div class=\"def-box\">\n          <div class=\"def-title\">Hausdorff 维数（直觉）</div>\n          <p>用边长约 <span data-latex=\"\\varepsilon\">ε</span> 的小球去盖集合，大约要 <span data-latex=\"N(\\varepsilon)\">N(ε)</span> 个。看代价 <span data-latex=\"N(\\varepsilon)\\,\\varepsilon^{s}\">N(ε)·ε^s</span> 在 <span data-latex=\"\\varepsilon\\to 0\">ε→0</span> 时是否仍可有限——临界 <span data-latex=\"s\">s</span> 即维数。</p>\n          <div class=\"formula\" data-latex=\"\\text{曲线 }s=1,\\quad\\text{面片 }s=2,\\quad\\text{康托集可取中间值}\"></div>\n        </div>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理 A（二维管重叠）</div>\n          <p>两根长 1、宽 <span data-latex=\"\\delta\">δ</span>、夹角 <span data-latex=\"\\theta\">θ</span> 的细管，重叠大约：</p>\n          <div class=\"formula\" data-latex=\"|T_1\\cap T_2|\\lesssim\\dfrac{\\delta^2}{\\sin\\theta}\"></div>\n        </div>\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理 B（L² 思想）</div>\n          <div class=\"formula\" data-latex=\"f=\\sum_i 1_{T_i},\\qquad \\int f^2=\\sum_{i,j}|T_i\\cap T_j|\"></div>\n          <p>再配合柯西不等式，推出并集不能太小。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>构造侧：滑动三角形让面积变小；证明侧：不同方向细管重叠有限，并集不能太瘦，维数必须满。</p><div class=\"interactive\" data-widget=\"kakeya-tubes\"></div><div class=\"interactive\" data-widget=\"kakeya-l2\"></div><div class=\"interactive\" data-widget=\"kakeya-perron\"></div>\n        <div class=\"proof-nav\"><span>零测度构造思想</span><span>二维维数：管估计</span><span>三维现状</span></div>\n\n        <h3>一、平面上面积可为 0（贝西科维奇–Perron 树思想）</h3>\n        <ol class=\"steps\">\n          <li><strong>基本积木：</strong>一个三角形包含「一小撮」方向上的单位段（从顶点射出的线段方向落在对边所张的角度内）。</li>\n          <li><strong>二分滑动：</strong>把底边二等分，得到两个窄三角形，方向各覆盖原角度的一半。将两者平移，使底侧重叠尽量多，而顶角方向仍保留。</li>\n          <li>面积：每次滑动后并集面积可严格小于原面积（重叠区只算一次）。对任意 ε>0，有限步后可构造「包含一个角度区间内所有方向的单位段」且面积 lt ε 的集合。</li>\n          <li><strong>铺满圆周：</strong>把 [0,π) 方向分成许多小角度块，每块用上述构造，再把这些「刺」适当安放（可再重叠）。可使总面积任意小，同时每个方向都有单位段。</li>\n          <li><strong>取极限：</strong>取面积 lt 1/n 的挂谷集 K_n 的合适对角线极限 / 闭包操作，得到测度 0 的挂谷集。（严格写法需注意极限仍含各方向段：常用「对每个有理方向保留，再闭包」或一致估计。）</li>\n        </ol>\n        <div class=\"idea-box\"><strong>要点：</strong>圆环装不下所有方向；真正机制是<strong>大量不同方向的细针高度重叠</strong>。</div>\n\n        <h3>二、二维维数必须为 2（Davies / Córdoba 路线的可讲细节）</h3>\n        <ol class=\"steps\">\n          <li>设 K 为平面挂谷集。要证 dim_H K=2。等价地：对任意 slt 2，s 维 Hausdorff 测度在 K 上「不能太小」的否定形式——通常改证 Minkowski 维数 ≥2：δ-邻域面积不能比 δ^{2−s} 衰减得更快（slt 2）。</li>\n          <li><strong>离散化：</strong>取 δgt 0。在半圆周上取约 1/δ 个方向 ω_j，使相邻夹角约 δ。对每个方向取一根含于 K 的 δ-管 T_j（线段的 δ 邻域）。则 ⋃ T_j ⊂ K_δ（K 的 δ 邻域）。</li>\n          <li><strong>目标：</strong>证明 |⋃ T_j| ≳ 1 / log(1/δ) 或至少 ≫ δ^ε（对任意 ε，当 δ→0）——经典结果是 |⋃ T_j| ≳ 1/log(1/δ)，已迫使 Minkowski 维数 =2。</li>\n          <li><strong>L² 计算：</strong>令 f = ∑_j 1_{T_j}。则 ∫ f = ∑ |T_j| ≍ ∑ δ ·1 ≍ 1（约 1/δ 根管，每根面积 ≍δ）。</li>\n          <li>∫ f² = ∑_j ∑_k |T_j ∩ T_k|。当 j=k，|T_j|≍δ；当 j≠k，夹角 θ_{jk}≳δ·|j−k|，由引理 A，|T_j∩T_k| ≲ δ² / θ_{jk}。</li>\n          <li>对固定 j 对 k 求和：∑_{k≠j} δ²/θ_{jk} ≲ δ² · ∑_{m=1}^{1/δ} 1/(mδ) ≲ δ · log(1/δ)。再乘管子数 1/δ，得 ∫f² ≲ log(1/δ)。</li>\n          <li>由柯西–施瓦茨：\n            <div class=\"calc-line\" data-latex=\"\\Bigl(\\int f\\Bigr)^{2}\\ \\le\\ \\bigl|\\bigcup T_j\\bigr|\\cdot\\int f^{2}\"></div>\n            于是得到\n            <div class=\"calc-line\" data-latex=\"\\bigl|K_{\\delta}\\bigr|\\ \\gtrsim\\ \\dfrac{1}{\\log(1/\\delta)}\"></div>\n          </li>\n          <li>若 dim_M K ≤ s lt 2，则 |K_δ| ≲ δ^{2−s}，右边当 δ→0 比任何 1/log 更快趋于 0，矛盾。故 dim_M K=2，从而 dim_H K=2。</li>\n        </ol>\n        <p class=\"qed\">∎（二维维数部分的标准 L² 纲要）</p>\n\n        <h3>三、三维为何陡然变难（思想，非完整证明）</h3>\n        <ol class=\"steps\">\n          <li>三维中两根管可以几乎平行地「粘」很久，重叠体积可以很大；也可以异面而过重叠很小。仅用两两夹角不够。</li>\n          <li>经典进展：Wolff 牙刷（hairbrush）论证——固定一根「柄」管，看穿过它的许多管形成的「刷子」体积；得到维数 ≥5/2 等。</li>\n          <li>「粘性」（sticky）情形：管的方向与位置强相关，最难处理。王虹–Zahl 的工作对 sticky 情形与迭代/多尺度分析作出突破，最终得到三维满维数。</li>\n          <li>完整论文很长（百余页级），此处只强调：<strong>逻辑目标仍是管并集体积的下界</strong>，但需要的几何组合远超二维。</li>\n        </ol>\n      <div data-more-detail>\n    <h3>二维 L² 估计 · 算式串联</h3>\n    <ol class=\"steps\">\n      <li>约 1/δ 根 δ-管，每根面积 ≍ δ，故 ∫f = ∑|Tⱼ| ≍ 1。</li>\n      <li>∫f² = ∑_{j,k}|Tⱼ∩Tₖ| ≲ ∑_j δ + ∑_{j≠k} δ²/θ_{jk} ≲ log(1/δ)。</li>\n      <li>(∫f)² ≤ |⋃|·∫f² ⇒ |⋃| ≳ 1/log(1/δ)。</li>\n      <li>若 Minkowski 维数 ≤ s≤2，则 |K_δ|≲δ^{2−s} 比 1/log 更快→0，矛盾。</li>\n    </ol>\n    <p>上图「两管重叠」对应步骤 2 的几何输入；「滑动三角形」对应零测度构造。</p>\n    </div>", "deep": "\n        <h3>与调和分析的联系</h3>\n        <p>限制猜想、Bochner–Riesz 平均、Kakeya 最大函数猜想彼此纠缠。费弗曼曾用挂谷集说明球乘子在 p≠2 时的失败。挂谷维数若过低，会摧毁一批傅里叶分析不等式；维数满则与「可能成立」的分析猜想兼容。</p>\n        <h3>常见错误图像</h3>\n        <ul>\n          <li>「无限大无限薄圆环面积 0」：圆环不含所有方向的单位段（径向段装不下），且圆周本身无线段。</li>\n          <li>把「转针最小面积」与「维数猜想」混为一谈。</li>\n        </ul>\n        <h3>二维结果历史</h3>\n        <p>Davies (1971) 证明平面挂谷集 Hausdorff 维数 2；Córdoba 给出基于管与 L² 的漂亮论证，与上文纲要一致。</p>\n      ", "why": "\n        <p>几何测度论和傅里叶分析的交叉口。三维由王虹与 Zahl 在 2025 年左右取得重大突破，更高维仍活跃。</p>\n      ", "try": "\n        <ul>\n          <li>拖两管夹角：角越大，重叠黄区越小——这就是二维证明的几何核心。</li>\n          <li>用自己的话解释：为什么「面积 0」和「维数 2」可以同时成立。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "kakeya", "title": "Kakeya Conjecture (Besikovich Set)", "subtitle": "The needle can squeeze into zero area, but not the full dimension", "emoji": "📍", "iconClass": "rose", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["geometric measure theory", "harmonic analysis", "cutting edge"], "era": "1917 Rotating needle problem; 1919 Zero area structure; Dimension conjecture; 2025 Three-dimensional breakthrough", "oneLiner": "Put a \"needle\" in each direction, and the set can be so thin that the area is 0, but it cannot be so thin that the \"dimension\" collapses.", "people": [{"role": "Needle rotation problem", "name": "Soichi Kakeya", "years": "1917"}, {"role": "zero measure construction", "name": "Besikovic", "years": "1919 / 1920s"}, {"role": "two-dimensional dimension", "name": "Davies; Córdoba et al.", "years": "1970s"}, {"role": "Three-dimensional dimension conjecture", "name": "Wang Hong, Joshua Zahl", "years": "2025 Proof"}], "related": ["euler-polyhedron", "cantor", "four-color", "gauss-bonnet"], "sections": {"story": "\n<p>Kakeya asked: How small can the area swept by the fine needle be when it rotates once? Later I discovered: If you only require \"one needle in each direction\" (no need to rotate continuously), the area can be arbitrarily small, even 0.</p>\n<p>But guess what: no matter how crowded it is, this set still has to fill the entire plane/space in terms of \"dimension\" - it can have no area, but it can't become a thinner \"linear ghost\".</p>\n<div class=\"fun-box\"><strong>Don’t step on the trap:</strong>An infinitely large and infinitely thin ring will not work - the ring cannot hold the entire length of needle in all directions. The correct image is a large overlap of fine needles in many directions.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Put a \"needle\" in each direction, and the set can be so thin that the area is 0, but it cannot be so thin that the \"dimension\" collapses.</p>\n<div class=\"def-box\">\n<div class=\"def-title\">Definition: Kakeya Set / Besikovich Set</div>\n<p>gather <span data-latex=\"K\\subset\\mathbb{R}^n\">K ⊂ ℝⁿ</span> It’s called Kakeya Set, which means: there is a needle with a length of 1 lying inside in each direction.</p>\n<div class=\"formula\" data-latex=\"\\forall\\,\\omega\\in S^{n-1},\\;\\exists\\,x\\in\\mathbb{R}^n:\\quad\\{x+t\\omega:0\\le t\\le 1\\}\\subset K\"></div>\n</div>\n<p><strong>Besikovich (Plane):</strong>There is a planar Kakeya set whose area can be 0.</p>\n<div class=\"formula\" data-latex=\"\\exists\\,K\\subset\\mathbb{R}^2:\\ K\\text{ 是挂谷集且 }|K|=0\"></div>\n<p><strong>Kakeya Collection Conjecture:</strong>The dimension of the Kakeya set must be equal to the space dimension.</p>\n<div class=\"formula\" data-latex=\"K\\text{ 是挂谷集 }\\;\\Rightarrow\\;\\dim_H K=n\"></div>\n<p><strong>Certified:</strong><span data-latex=\"n=1\">n=1</span> ordinary;<span data-latex=\"n=2\">n=2</span> 1970s;<span data-latex=\"n=3\">n=3</span> Approximately 2025. Higher dimensions are still partially open.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">thin tube language</div>\n<p>give direction <span data-latex=\"\\omega\">ω</span> The unit line segment on is thickened to width <span data-latex=\"\\delta\">δ</span> thin tube <span data-latex=\"T_\\omega\">T_ω</span>。</p>\n<div class=\"formula\" data-latex=\"\\text{关心：}\\quad\\Bigl|\\bigcup_\\omega T_\\omega\\Bigr|\\ \\text{随 }\\delta\\to 0\\text{ 如何变小}\"></div>\n<p>If the volume is approximately like <span data-latex=\"\\delta^{n-d}\">δ^{n-d}</span>, corresponding to \"the dimension is about d\".</p>\n</div>\n<div class=\"def-box\">\n<div class=\"def-title\">Hausdorff dimension (intuition)</div>\n<p>Use side length approx. <span data-latex=\"\\varepsilon\">ε</span> Collect the small balls to cover them, it will take about <span data-latex=\"N(\\varepsilon)\">N(ε)</span> indivual. Look at the cost <span data-latex=\"N(\\varepsilon)\\,\\varepsilon^{s}\">N(ε)·ε^s</span> exist <span data-latex=\"\\varepsilon\\to 0\">ε→0</span> Can time still be finite - critical <span data-latex=\"s\">s</span> That is the dimension.</p>\n<div class=\"formula\" data-latex=\"\\text{曲线 }s=1,\\quad\\text{面片 }s=2,\\quad\\text{康托集可取中间值}\"></div>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma A (2D tube overlap)</div>\n<p>Two lengths 1 and width <span data-latex=\"\\delta\">δ</span>, included angle <span data-latex=\"\\theta\">θ</span> of thin tubes, overlapping approximately:</p>\n<div class=\"formula\" data-latex=\"|T_1\\cap T_2|\\lesssim\\dfrac{\\delta^2}{\\sin\\theta}\"></div>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma B (L² Thought)</div>\n<div class=\"formula\" data-latex=\"f=\\sum_i 1_{T_i},\\qquad \\int f^2=\\sum_{i,j}|T_i\\cap T_j|\"></div>\n<p>Coupled with Cauchy's inequality, it can be concluded that the union cannot be too small.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Construction side: Sliding triangles make the area smaller; Proof side: The overlap of thin tubes in different directions is limited, the union cannot be too thin, and the dimensions must be full.</p><div class=\"interactive\" data-widget=\"kakeya-tubes\"></div><div class=\"interactive\" data-widget=\"kakeya-l2\"></div><div class=\"interactive\" data-widget=\"kakeya-perron\"></div>\n<div class=\"proof-nav\"><span>Zero measure construction idea</span><span>2D Dimensions: Tube Estimation</span><span>Three-dimensional status quo</span></div>\n<h3>1. The area on the plane can be 0 (Besikovich-Perron tree idea)</h3>\n<ol class=\"steps\">\n<li><strong>Basic building blocks:</strong>A triangle consists of \"a handful\" of unit segments in directions (lines extending from a vertex in directions that fall within the angles of opposite sides).</li>\n<li><strong>Two-part sliding:</strong>Divide the base in half to get two narrow triangles, each with directions covering half of the original angle. Translate the two so that the bottom sides overlap as much as possible, while the direction of the top corners remains.</li>\n<li>Area: The union area after each sliding can be strictly smaller than the original area (the overlapping area is only counted once). For any ε&gt;0, a set of \"unit segments containing all directions within an angular interval\" with an area lt ε can be constructed after finite steps.</li>\n<li><strong>Cover the entire circumference:</strong>Divide the [0,π) direction into many small-angle blocks, use the above structure for each block, and then place these \"thorns\" appropriately (can be overlapping again). The total area can be made arbitrarily small while having unit segments in each direction.</li>\n<li><strong>Take the limit:</strong>Taking the appropriate diagonal limit/closure operation of the Kakeya set K_n of area lt 1/n yields the Kakeya set of measure 0. (When writing strictly, please note that the limit still contains segments in each direction: \"retain each rational direction and then close it\" or consistent estimation is commonly used.)</li>\n</ol>\n<div class=\"idea-box\"><strong>Key points:</strong>The ring cannot fit in all directions; the real mechanism is<strong>A large number of fine needles in different directions are highly overlapping</strong>。</div>\n<h3>2. The two-dimensional dimension must be 2 (tellable details of the Davies / Córdoba route)</h3>\n<ol class=\"steps\">\n<li>Let K be the plane Kakeya set. Prove dim_H K=2. Equivalently: the negative form of the s-dimensional Hausdorff measure \"cannot be too small\" in K for any slt 2 - usually modified for Minkowski dimensions ≥2: the δ-neighborhood area cannot decay faster than δ^{2−s} (slt 2).</li>\n<li><strong>Discretization:</strong>Take δgt 0. Take about 1/δ direction ω_j on the semicircle, so that the adjacent angle is about δ. For each direction take a delta-tube T_j contained in K (delta neighborhood of the line segment). Then ⋃ T_j ⊂ K_δ (the δ neighborhood of K).</li>\n<li><strong>Target:</strong>Show that |⋃ T_j| ≳ 1 / log(1/δ) or at least ≫ δ^ε (for any ε as δ→0) - the classical result is |⋃ T_j| ≳ 1/log(1/δ), which already forces the Minkowski dimension =2.</li>\n<li><strong>L² calculation:</strong>Let f = ∑_j 1_{T_j}. Then ∫ f = ∑ |T_j| ≍ ∑ δ ·1 ≍ 1 (about 1/δ root canal, each root area ≍δ).</li>\n<li>∫ f² = ∑_j ∑_k |T_j ∩ T_k|. When j=k, |T_j|≍δ; when j≠k, the angle θ_{jk}≳δ·|j−k|, by Lemma A, |T_j∩T_k| ≲ δ² / θ_{jk}.</li>\n<li>Summing over k for fixed j: ∑_{k≠j} δ²/θ_{jk} ≲ δ² · ∑_{m=1}^{1/δ} 1/(mδ) ≲ δ · log(1/δ). Multiplied by the number of tubes 1/δ, we get ∫f² ≲ log(1/δ).</li>\n<li>By Cauchy-Schwartz:\n            <div class=\"calc-line\" data-latex=\"\\Bigl(\\int f\\Bigr)^{2}\\ \\le\\ \\bigl|\\bigcup T_j\\bigr|\\cdot\\int f^{2}\"></div>\n            So get\n            <div class=\"calc-line\" data-latex=\"\\bigl|K_{\\delta}\\bigr|\\ \\gtrsim\\ \\dfrac{1}{\\log(1/\\delta)}\"></div>\n</li>\n<li>If dim_M K ≤ s lt 2, then |K_δ| ≲ δ^{2−s}, and the right side when δ→0 tends to 0 faster than any 1/log, which is a contradiction. Therefore dim_M K=2, thus dim_H K=2.</li>\n</ol>\n<p class=\"qed\">∎ (Standard L² outline for the two-dimensional dimension part)</p>\n<h3>3. Why three dimensions suddenly become difficult (thoughts, incomplete proof)</h3>\n<ol class=\"steps\">\n<li>In three dimensions, two tubes can be \"glued\" almost parallel to each other for a long time, and the overlapping volume can be very large; they can also pass through each other with very little overlap. Just two angles is not enough.</li>\n<li>Classic progress: Wolff's hairbrush argument - fix a \"handle\" tube and look at the \"brush\" volume formed by many tubes passing through it; get the dimension ≥5/2, etc.</li>\n<li>\"Sticky\" situation: The direction of the tube is strongly related to its position and is the most difficult to deal with. Wang Hong-Zahl's work made breakthroughs in sticky situations and iterative/multi-scale analysis, and finally obtained three-dimensional full dimensions.</li>\n<li>The complete paper is very long (more than a hundred pages), so I only emphasize:<strong>The logical goal is still a lower bound on the union volume of the tubes</strong>, but the required geometric combinations go far beyond two dimensions.</li>\n</ol>\n<div data-more-detail=\"\">\n<h3>Two-dimensional L² estimation · Formula concatenation</h3>\n<ol class=\"steps\">\n<li>There are about 1/δ δ-tubes, each with an area ≍ δ, so ∫f = ∑|Tⱼ| ≍ 1.</li>\n<li>∫f² = ∑_{j,k}|Tⱼ∩Tₖ| ≲ ∑_j δ + ∑_{j≠k} δ²/θ_{jk} ≲ log(1/δ)。</li>\n<li>(∫f)² ≤ |⋃|·∫f² ⇒ |⋃| ≳ 1/log(1/δ)。</li>\n<li>If the Minkowski dimension ≤ s≤2, then |K_δ|≲δ^{2−s} → 0 faster than 1/log, which is a contradiction.</li>\n</ol>\n<p>The \"two tubes overlapping\" in the above figure correspond to the geometric input of step 2; the \"sliding triangle\" corresponds to the zero-measure structure.</p>\n</div>", "deep": "\n<h3>Link to harmonic analysis</h3>\n<p>The limiting conjecture, the Bochner–Riesz mean, and the Kakeya maximum function conjecture are entangled with each other. Fefferman once used the Kaketani set to illustrate the failure of the ball multiplier when p≠2. If the Kakeya dimension is too low, it will destroy a number of Fourier analysis inequalities; if the dimension is full, it is compatible with \"possibly established\" analytical conjectures.</p>\n<h3>common error images</h3>\n<ul>\n<li>\"Infinitely large and infinitely thin ring area 0\": The ring does not contain unit segments in all directions (radial segments cannot be accommodated), and the circumference itself has no segments.</li>\n<li>Confusing \"minimum area of ​​rotating needle\" with \"dimension guess\".</li>\n</ul>\n<h3>2D result history</h3>\n<p>Davies (1971) proved that the planar Kakeya set has Hausdorff dimension 2; Córdoba gave a nice argument based on tubes and L², consistent with the outline above.</p>\n", "why": "\n<p>The intersection of geometric measure theory and Fourier analysis. Three dimensions were achieved by Wang Hong and Zahl around 2025, and higher dimensions are still active.</p>\n", "try": "\n<ul>\n<li>Drag the angle between the two tubes: the larger the angle, the smaller the overlapping yellow area - this is the geometric core of the two-dimensional proof.</li>\n<li>Explain in your own words: why \"area 0\" and \"dimension 2\" can be true at the same time.</li>\n</ul>\n"}, "field": "math"}}, "title": "Kakeya Conjecture (Besikovich Set)", "subtitle": "The needle can squeeze into zero area, but not the full dimension", "difficultyLabel": "Hardcore challenge", "tags": ["geometric measure theory", "harmonic analysis", "cutting edge"], "era": "1917 Rotating needle problem; 1919 Zero area structure; Dimension conjecture; 2025 Three-dimensional breakthrough", "oneLiner": "Put a \"needle\" in each direction, and the set can be so thin that the area is 0, but it cannot be so thin that the \"dimension\" collapses.", "people": [{"role": "Needle rotation problem", "name": "Soichi Kakeya", "years": "1917"}, {"role": "zero measure construction", "name": "Besikovic", "years": "1919 / 1920s"}, {"role": "two-dimensional dimension", "name": "Davies; Córdoba et al.", "years": "1970s"}, {"role": "Three-dimensional dimension conjecture", "name": "Wang Hong, Joshua Zahl", "years": "2025 Proof"}], "\n<h3>Link to harmonic analysis</h3>\n<p>The limiting conjecture, the Bochner–Riesz mean, and the Kakeya maximum function conjecture are entangled with each other. Fefferman once used the Kaketani set to illustrate the failure of the ball multiplier when p≠2. If the Kakeya dimension is too low, it will destroy a number of Fourier analysis inequalities; if the dimension is full, it is compatible with \"possibly established\" analytical conjectures.</p>\n<h3>common error images</h3>\n<ul>\n<li>\"Infinitely large and infinitely thin ring area 0\": The ring does not contain unit segments in all directions (radial segments cannot be accommodated), and the circumference itself has no segments.</li>\n<li>Confusing \"minimum area of ​​rotating needle\" with \"dimension guess\".</li>\n</ul>\n<h3>2D result history</h3>\n<p>Davies (1971) proved that the planar Kakeya set has Hausdorff dimension 2; Córdoba gave a nice argument based on tubes and L², consistent with the outline above.</p>\n", "why": "\n<p>The intersection of geometric measure theory and Fourier analysis. Three dimensions were achieved by Wang Hong and Zahl around 2025, and higher dimensions are still active.</p>\n", "try": "\n<ul>\n<li>Drag the angle between the two tubes: the larger the angle, the smaller the overlapping yellow area - this is the geometric core of the two-dimensional proof.</li>\n<li>Explain in your own words: why \"area 0\" and \"dimension 2\" can be true at the same time.</li>\n</ul>\n"}}, {"id": "amgm", "field": "math", "difficulty": "medium", "emoji": "⚖️", "iconClass": "green", "related": ["mvt", "pythagoras", "basel", "cauchy-schwarz", "binomial"], "__i18n": {"zh": {"id": "amgm", "title": "算术–几何平均不等式", "subtitle": "定周长矩形，正方形面积最大", "emoji": "⚖️", "iconClass": "green", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["不等式", "分析", "优化"], "era": "古代特例；柯西等系统化", "oneLiner": "一串正数：算术平均 ≥ 几何平均；相等只发生在全部数都一样时。", "people": [{"role": "经典初等证", "name": "柯西等", "years": "19 世纪教材传统"}], "related": ["mvt", "pythagoras", "basel", "cauchy-schwarz", "binomial"], "sections": {"story": "\n        <p>篱笆长度固定，围成矩形，什么时候面积最大？答案是正方形。这就是 AM-GM 的几何影子：算术平均不会小于几何平均。</p>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>正数的算术平均 ≥ 几何平均；全相等时才取等。</p>\n        <div class=\"formula\" data-latex=\"\\dfrac{x_1+\\cdots+x_n}{n}\\ge(x_1\\cdots x_n)^{1/n}\\quad(x_i>0)\"></div>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理（n=2）</div>\n          <p>(√x−√y)²≥0 ⇒ x+y ≥ 2√(xy)。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>先证两个数，再对 2 的幂用归纳「加倍」，再往回缩到任意 n；或用 log 是凹函数一次讲完。</p><div class=\"interactive\" data-widget=\"amgm-rect\"></div>\n        <div class=\"proof-nav\"><span>柯西向前向后归纳</span></div>\n        <h3>柯西的「向前–向后」归纳</h3>\n        <ol class=\"steps\">\n          <li><strong>n=2：</strong>由引理成立。</li>\n          <li><strong>向前：</strong>若对 n=2^k 成立，则对 2^{k+1}：把 2^{k+1} 个数分成两半，各 2^k 个，\n            <div class=\"calc-line\" data-latex=\"A = (S_{1}+S_{2})/2 \\ge \\sqrt{G_{1} G_{2}}\"></div>\n            其中 S_i 是半组算术和/2^k 等——标准写法：\n            <div class=\"calc-line\" data-latex=\"(x_{1}+\\ldots +x_{2m})/(2m) \\ge \\sqrt{ [(x_{1}+\\ldots +x_m}/m] [(x_{m+1}+\\ldots )/m] ) \\ge \\sqrt{ (\\prod _{1}^{m}}^{1/m} (\\prod_{m+1}^{2m})^{1/m} ) = (\\prod \\text{全部})^{1/(2m)}\"></div>\n            对 m=2^k 用归纳假设。\n          </li>\n          <li>于是对所有 2 的幂成立。</li>\n          <li><strong>向后：</strong>设对 n 成立，证 n−1。对正数 y₁,…,y_{n−1}，令\n            <div class=\"calc-line\" data-latex=\"y_n = (y_{1}+\\ldots +y_{n-1})/(n-1)\"></div>\n            为前 n−1 个的算术平均。对 n 个数用 AM-GM：\n            <div class=\"calc-line\" data-latex=\"( (n-1)y_n + y_n )/n \\ge (y_{1}\\ldots y_{n-1} y_n)^{1/n}\"></div>\n            即 y_n ≥ (y₁…y_{n−1} y_n)^{1/n}。两边 n 次方：y_n^n ≥ (∏₁^{n−1} y_i) y_n，故 y_n^{n−1} ≥ ∏₁^{n−1} y_i，即\n            <div class=\"calc-line\" data-latex=\"y_n \\ge (\\prod _{1}^{n-1} y_i)^{1/(n-1)}\"></div>\n            而 y_n 恰是左边 AM。得证。\n          </li>\n          <li>从 2 的幂向后可到达任何 n。</li>\n        </ol>\n        <p class=\"qed\">∎</p>\n      <div data-more-detail>\n    <h3>等号条件</h3>\n    <p>交互图中 a→b 时矩形趋近正方形、面积最大。严格证明中每步 (√x−√y)²≥0 等号 ⇔ x=y，故全体相等。</p>\n    </div>", "deep": "\n        <h3>詹森不等式路径</h3>\n        <p>log 凹（实为 concave）：(log x₁+…+log xₙ)/n ≤ log((x₁+…+xₙ)/n)，指数化即 AM-GM。</p>\n        <h3>等号条件</h3>\n        <p>每步 (√x−√y)²=0 或 log 严格凹 ⇒ 全部 x_i 相等。</p>\n      ", "why": "\n        <p>估大小、做优化、推很多不等式的日用工具。机器学习里的一些界也会用到。</p>\n      ", "try": "\n        <ul>\n          <li>拖交互图：周长固定时，越接近正方形面积越大。</li>\n          <li>用 (√a−√b)²≥0 推出 (a+b)/2≥√(ab)。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "amgm", "title": "Arithmetic – Geometric mean inequalities", "subtitle": "A rectangle with a fixed perimeter, the square has the largest area", "emoji": "⚖️", "iconClass": "green", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["inequality", "analyze", "optimization"], "era": "Special cases in ancient times; systematization by Cauchy and others", "oneLiner": "A string of positive numbers: arithmetic mean ≥ geometric mean; equality only occurs when all numbers are the same.", "people": [{"role": "Classic Elementary Certificate", "name": "Cauchy et al.", "years": "19th century textbook tradition"}], "related": ["mvt", "pythagoras", "basel", "cauchy-schwarz", "binomial"], "sections": {"story": "\n<p>The length of the fence is fixed and it forms a rectangle. When does the area become the largest? The answer is square. This is the geometric shadow of AM-GM: the arithmetic mean will not be smaller than the geometric mean.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>The arithmetic mean of positive numbers ≥ the geometric mean; equality is taken only when all are equal.</p>\n<div class=\"formula\" data-latex=\"\\dfrac{x_1+\\cdots+x_n}{n}\\ge(x_1\\cdots x_n)^{1/n}\\quad(x_i&gt;0)\"></div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (n=2)</div>\n<p>(√x−√y)²≥0 ⇒ x+y ≥ 2√(xy)。</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>First prove two numbers, then use induction to \"double\" the power of 2, and then shrink it back to any n; or use log to be a concave function and finish it all at once.</p><div class=\"interactive\" data-widget=\"amgm-rect\"></div>\n<div class=\"proof-nav\"><span>Cauchy's forward and backward induction</span></div>\n<h3>Cauchy's \"forward-backward\" induction</h3>\n<ol class=\"steps\">\n<li><strong>n=2：</strong>It is established by the lemma.</li>\n<li><strong>forward:</strong>If it is true for n=2^k, then for 2^{k+1}: divide the 2^{k+1} numbers into two halves, 2^k each,\n            <div class=\"calc-line\" data-latex=\"A = (S_{1}+S_{2})/2 \\ge \\sqrt{G_{1} G_{2}}\"></div>\n            where S_i is the half-set arithmetic sum /2^k etc. - standard writing:\n            <div class=\"calc-line\" data-latex=\"(x_{1}+\\ldots +x_{2m})/(2m) \\ge \\sqrt{ [(x_{1}+\\ldots +x_m}/m] [(x_{m+1}+\\ldots )/m] ) \\ge \\sqrt{ (\\prod _{1}^{m}}^{1/m} (\\prod_{m+1}^{2m})^{1/m} ) = (\\prod \\text{全部})^{1/(2m)}\"></div>\n            Use the inductive hypothesis for m=2^k.\n          </li>\n<li>This holds for all powers of 2.</li>\n<li><strong>backward:</strong>Assume it is true for n, prove n−1. For positive numbers y₁,…,y_{n−1}, let\n            <div class=\"calc-line\" data-latex=\"y_n = (y_{1}+\\ldots +y_{n-1})/(n-1)\"></div>\n            is the arithmetic mean of the first n−1. Use AM-GM for n numbers:\n            <div class=\"calc-line\" data-latex=\"( (n-1)y_n + y_n )/n \\ge (y_{1}\\ldots y_{n-1} y_n)^{1/n}\"></div>\n            That is, y_n ≥ (y₁…y_{n−1} y_n)^{1/n}. Both sides to the nth power: y_n^n ≥ (∏₁^{n−1} y_i) y_n, so y_n^{n−1} ≥ ∏₁^{n−1} y_i, that is\n            <div class=\"calc-line\" data-latex=\"y_n \\ge (\\prod _{1}^{n-1} y_i)^{1/(n-1)}\"></div>\n            And y_n is exactly the left AM. Get certified.\n          </li>\n<li>Any n can be reached from powers of 2 backwards.</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>Equal sign condition</h3>\n<p>In the interactive diagram, when a→b, the rectangle approaches a square and has the largest area. Strictly prove that each step (√x−√y)²≥0 equals ⇔ x=y, so all are equal.</p>\n</div>", "deep": "\n<h3>Jensen's inequality path</h3>\n<p>log concave (actually concave): (log x₁+…+log xₙ)/n ≤ log((x₁+…+xₙ)/n), exponentialization is AM-GM.</p>\n<h3>Equal sign condition</h3>\n<p>Each step (√x−√y)²=0 or log strictly concave ⇒ all x_i are equal.</p>\n", "why": "\n<p>A daily tool for estimating sizes, doing optimizations, and inferring many inequalities. Some fields in machine learning will also be used.</p>\n", "try": "\n<ul>\n<li>Drag interactive graph: When the perimeter is fixed, the closer to a square, the larger the area.</li>\n<li>Use (√a−√b)²≥0 to deduce (a+b)/2≥√(ab).</li>\n</ul>\n"}, "field": "math"}}, "title": "Arithmetic – Geometric mean inequalities", "subtitle": "A rectangle with a fixed perimeter, the square has the largest area", "difficultyLabel": "Spend some time thinking", "tags": ["inequality", "analyze", "optimization"], "era": "Special cases in ancient times; systematization by Cauchy and others", "oneLiner": "A string of positive numbers: arithmetic mean ≥ geometric mean; equality only occurs when all numbers are the same.", "people": [{"role": "Classic Elementary Certificate", "name": "Cauchy et al.", "years": "19th century textbook tradition"}], "sections": {"story": "\n<p>The length of the fence is fixed and it forms a rectangle. When does the area become the largest? The answer is square. This is the geometric shadow of AM-GM: the arithmetic mean will not be smaller than the geometric mean.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>The arithmetic mean of positive numbers ≥ the geometric mean; equality is taken only when all are equal.</p>\n<div class=\"formula\" data-latex=\"\\dfrac{x_1+\\cdots+x_n}{n}\\ge(x_1\\cdots x_n)^{1/n}\\quad(x_i&gt;0)\"></div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (n=2)</div>\n<p>(√x−√y)²≥0 ⇒ x+y ≥ 2√(xy)。</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>First prove two numbers, then use induction to \"double\" the power of 2, and then shrink it back to any n; or use log to be a concave function and finish it all at once.</p><div class=\"interactive\" data-widget=\"amgm-rect\"></div>\n<div class=\"proof-nav\"><span>Cauchy's forward and backward induction</span></div>\n<h3>Cauchy's \"forward-backward\" induction</h3>\n<ol class=\"steps\">\n<li><strong>n=2：</strong>It is established by the lemma.</li>\n<li><strong>forward:</strong>If it is true for n=2^k, then for 2^{k+1}: divide the 2^{k+1} numbers into two halves, 2^k each,\n            <div class=\"calc-line\" data-latex=\"A = (S_{1}+S_{2})/2 \\ge \\sqrt{G_{1} G_{2}}\"></div>\n            where S_i is the half-set arithmetic sum /2^k etc. - standard writing:\n            <div class=\"calc-line\" data-latex=\"(x_{1}+\\ldots +x_{2m})/(2m) \\ge \\sqrt{ [(x_{1}+\\ldots +x_m}/m] [(x_{m+1}+\\ldots )/m] ) \\ge \\sqrt{ (\\prod _{1}^{m}}^{1/m} (\\prod_{m+1}^{2m})^{1/m} ) = (\\prod \\text{全部})^{1/(2m)}\"></div>\n            Use the inductive hypothesis for m=2^k.\n          </li>\n<li>This holds for all powers of 2.</li>\n<li><strong>backward:</strong>Assume it is true for n, prove n−1. For positive numbers y₁,…,y_{n−1}, let\n            <div class=\"calc-line\" data-latex=\"y_n = (y_{1}+\\ldots +y_{n-1})/(n-1)\"></div>\n            is the arithmetic mean of the first n−1. Use AM-GM for n numbers:\n            <div class=\"calc-line\" data-latex=\"( (n-1)y_n + y_n )/n \\ge (y_{1}\\ldots y_{n-1} y_n)^{1/n}\"></div>\n            That is, y_n ≥ (y₁…y_{n−1} y_n)^{1/n}. Both sides to the nth power: y_n^n ≥ (∏₁^{n−1} y_i) y_n, so y_n^{n−1} ≥ ∏₁^{n−1} y_i, that is\n            <div class=\"calc-line\" data-latex=\"y_n \\ge (\\prod _{1}^{n-1} y_i)^{1/(n-1)}\"></div>\n            And y_n is exactly the left AM. Get certified.\n          </li>\n<li>Any n can be reached from powers of 2 backwards.</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>Equal sign condition</h3>\n<p>In the interactive diagram, when a→b, the rectangle approaches a square and has the largest area. Strictly prove that each step (√x−√y)²≥0 equals ⇔ x=y, so all are equal.</p>\n</div>", "deep": "\n<h3>Jensen's inequality path</h3>\n<p>log concave (actually concave): (log x₁+…+log xₙ)/n ≤ log((x₁+…+xₙ)/n), exponentialization is AM-GM.</p>\n<h3>Equal sign condition</h3>\n<p>Each step (√x−√y)²=0 or log strictly concave ⇒ all x_i are equal.</p>\n", "why": "\n<p>A daily tool for estimating sizes, doing optimizations, and inferring many inequalities. Some fields in machine learning will also be used.</p>\n", "try": "\n<ul>\n<li>Drag interactive graph: When the perimeter is fixed, the closer to a square, the larger the area.</li>\n<li>Use (√a−√b)²≥0 to deduce (a+b)/2≥√(ab).</li>\n</ul>\n"}}, {"id": "basel", "field": "math", "difficulty": "hard", "emoji": "π", "iconClass": "purple", "related": ["euler-identity", "ftc", "fta"], "__i18n": {"zh": {"id": "basel", "title": "巴塞尔问题", "subtitle": "平方倒数之和，居然冒出圆周率", "emoji": "π", "iconClass": "purple", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["分析", "傅里叶", "欧拉"], "era": "1734 欧拉；严格化后继", "oneLiner": "1 + 1/4 + 1/9 + 1/16 + … 加到无穷，精确等于 π²/6。", "people": [{"role": "求解", "name": "欧拉", "years": "1734"}, {"role": "严格傅里叶路径", "name": "后继分析学家", "years": "19 世纪"}], "related": ["euler-identity", "ftc", "fta"], "sections": {"story": "\n        <p>意大利巴塞尔城里的人盯着 ∑1/n² 很久算不出来。欧拉给出答案 π²/6，把离散级数和圆拴在一起，震惊全场。</p>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>平方倒数无穷加起来，等于 <span data-latex=\"\\pi^2/6\">π²/6</span>。</p>\n        <div class=\"formula\" data-latex=\"\\sum_{n=1}^{\\infty}\\dfrac{1}{n^2}=\\dfrac{\\pi^2}{6}\"></div>\n      ", "setup": "\n        <div class=\"def-box\">\n          <div class=\"def-title\">傅里叶系数</div>\n          <p>f 在 [−π,π] 上分段光滑时，a₀/2 + ∑ (aₙ cos nx + bₙ sin nx)，\n          aₙ=(1/π)∫_{−π}^π f cos nx dx 等。帕塞瓦尔：平均 |f|² 等于系数平方和。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>把 x² 在圆周上展开成余弦波，代入特殊点，级数系数里就蹦出 ∑1/n²。</p><div class=\"interactive\" data-widget=\"basel-sum\"></div>\n        <div class=\"proof-nav\"><span>展开 f(x)=x</span><span>算系数</span><span>代入特殊点/帕塞瓦尔</span></div>\n        <ol class=\"steps\">\n          <li>在 (−π,π) 上取 f(x)=x。则 f 为奇函数，aₙ=0，bₙ = (2/π) ∫_0^π x sin(nx) dx。</li>\n          <li>分部积分：u=x，dv=sin(nx)dx，\n            <div class=\"calc-line\" data-latex=\"\\int_{0}^{\\pi } x sin(nx) dx = [-x cos(nx)/n]_0^\\pi + \\int_{0}^{\\pi } cos(nx)/n dx = -\\pi (-1)^n /n + 0\"></div>\n            更仔细：cos(nπ)=(−1)^n，故 −π cos(nπ)/n = −π(−1)^n /n；在 0 处为 0。∫ cos 项为 0 当 n≥1。\n            实际上 ∫_0^π x sin nx dx = −(π/n)(−1)^n 的符号：cos(nπ)=(−1)^n，−x cos/n 在 π：−π(−1)^n /n。\n            故 bₙ = (2/π)·[−π(−1)^n /n] = −2(−1)^n /n = 2(−1)^{n+1}/n。\n          </li>\n          <li>于是 x = ∑_{n=1}^∞ 2(−1)^{n+1} sin(nx)/n  在 (−π,π) 内。</li>\n          <li>用帕塞瓦尔恒等式更直接：对 f(x)=x，\n            <div class=\"calc-line\" data-latex=\"(1/\\pi )\\int_{-\\pi }^\\pi x^{2} dx /2 \\text{的标准形式}： (1/\\pi )\\int_{-\\pi }^\\pi [f(x)]^{2} dx = 2\\sum b_{n}^{2} \\text{的约定版本}\"></div>\n            常用结论：∫_{−π}^π x² dx = 2π³/3，而系数给出 ∑ 4/n² 型关系。\n          </li>\n          <li><strong>课堂干净版：</strong>考虑 f(x)=x² 在 [−π,π]：\n            <div class=\"calc-line\" data-latex=\"a_{0} = (2/\\pi )\\int_{0}^{\\pi } x^{2} dx = 2\\pi ^{2}/3\"></div>\n            <div class=\"calc-line\" data-latex=\"a_{n} = (2/\\pi )\\int_{0}^{\\pi } x^{2} cos(nx) dx = 4(-1)^n / n^{2}\"></div>\n            （两次分部积分。）\n          </li>\n          <li>傅里叶展开：x² = π²/3 + ∑_{n=1}^∞ 4(−1)^n cos(nx)/n²。</li>\n          <li>令 x=π：π² = π²/3 + ∑ 4(−1)^n (−1)^n /n² = π²/3 + ∑ 4/n²。</li>\n          <li>故 π² − π²/3 = 4 ∑ 1/n² ⇒ (2π²/3)=4 ∑1/n² ⇒ <strong>∑1/n² = π²/6</strong>。</li>\n        </ol>\n        <p class=\"qed\">∎</p>\n      <div data-more-detail>\n    <h3>傅里叶关键代入</h3>\n    <div class=\"calc-line\" data-latex=\"x^{2} = \\pi ^{2}/3 + \\Sigma 4(-1)^{n} cos(nx)/n^{2} \\to x=\\pi \\Rightarrow \\sum 1/n^{2}=\\pi ^{2}/6\"></div>\n    <p>上图部分和展示收敛速度；完整推导见正文分部积分求 aₙ。</p>\n    </div>", "deep": "\n        <h3>欧拉的无穷乘积启发</h3>\n        <p>欧拉类比 sin x /x = ∏ (1−x²/(n²π²))，比较 x² 系数得 ∑1/n²=π²/6。启发正确，严格性后补。</p>\n        <h3>推广</h3>\n        <p>∑1/n^{2k} 是 π^{2k} 的有理倍数（伯努利数）；奇数值 ζ(3) 的无理性到 1979 年阿佩里才证。</p>\n      ", "why": "\n        <p>ζ 函数特殊值的开门炮；傅里叶分析「把函数拆成波」的招牌例子。</p>\n      ", "try": "\n        <ul>\n          <li>拖 N 看部分和逼近 1.64493…。</li>\n          <li>记住关键一招：对 x² 做傅里叶展开，令 x=π。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "basel", "title": "Basel issues", "subtitle": "The sum of the reciprocals of squares actually turns out to be pi", "emoji": "π", "iconClass": "purple", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["analyze", "Fourier", "Euler"], "era": "1734 Euler; rigorous successor", "oneLiner": "1 + 1/4 + 1/9 + 1/16 + … added to infinity is exactly π²/6.", "people": [{"role": "Solve", "name": "Euler", "years": "1734"}, {"role": "Strict Fourier path", "name": "successor analyst", "years": "19th century"}], "related": ["euler-identity", "ftc", "fta"], "sections": {"story": "\n<p>People in the city of Basel, Italy, stared at ∑1/n² for a long time and couldn’t figure it out. Euler gave the answer π²/6, tying the discrete series and the circle together, shocking the audience.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Adding up the reciprocals of squares to infinity equals <span data-latex=\"\\pi^2/6\">π²/6</span>。</p>\n<div class=\"formula\" data-latex=\"\\sum_{n=1}^{\\infty}\\dfrac{1}{n^2}=\\dfrac{\\pi^2}{6}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Fourier coefficient</div>\n<p>When f is piecewise smooth on [−π,π], a₀/2 + ∑ (aₙ cos nx + bₙ sin nx),\n          aₙ=(1/π)∫_{−π}^π f cos nx dx etc. Parseval: The average |f|² is equal to the sum of the squared coefficients.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Expand x² into a cosine wave on the circumference and substitute it into a special point, and ∑1/n² will appear in the series coefficient.</p><div class=\"interactive\" data-widget=\"basel-sum\"></div>\n<div class=\"proof-nav\"><span>Expand f(x)=x</span><span>Calculation coefficient</span><span>Substitute special points/Parseval</span></div>\n<ol class=\"steps\">\n<li>Take f(x)=x on (−π,π). Then f is an odd function, aₙ=0, bₙ = (2/π) ∫_0^π x sin(nx) dx.</li>\n<li>Integral by parts: u=x, dv=sin(nx)dx,\n            <div class=\"calc-line\" data-latex=\"\\int_{0}^{\\pi } x sin(nx) dx = [-x cos(nx)/n]_0^\\pi + \\int_{0}^{\\pi } cos(nx)/n dx = -\\pi (-1)^n /n + 0\"></div>\n            More carefully: cos(nπ)=(−1)^n, so −π cos(nπ)/n = −π(−1)^n /n; which is 0 at 0. ∫ The cos term is 0 when n≥1.\n            In fact the sign of ∫_0^π x sin nx dx = −(π/n)(−1)^n: cos(nπ)=(−1)^n, −x cos/n in π: −π(−1)^n /n.\n            Therefore, bₙ = (2/π)·[−π(−1)^n /n] = −2(−1)^n /n = 2(−1)^{n+1}/n.\n          </li>\n<li>Then x = ∑_{n=1}^∞ 2(−1)^{n+1} sin(nx)/n in (−π,π).</li>\n<li>It is more straightforward to use Parseval’s identity: for f(x)=x,\n            <div class=\"calc-line\" data-latex=\"(1/\\pi )\\int_{-\\pi }^\\pi x^{2} dx /2 \\text{的标准形式}： (1/\\pi )\\int_{-\\pi }^\\pi [f(x)]^{2} dx = 2\\sum b_{n}^{2} \\text{的约定版本}\"></div>\n            A common conclusion: ∫_{−π}^π x² dx = 2π³/3, while the coefficients give a ∑ 4/n² type relationship.\n          </li>\n<li><strong>Classroom clean version:</strong>Consider f(x)=x² at [−π,π]:\n            <div class=\"calc-line\" data-latex=\"a_{0} = (2/\\pi )\\int_{0}^{\\pi } x^{2} dx = 2\\pi ^{2}/3\"></div>\n<div class=\"calc-line\" data-latex=\"a_{n} = (2/\\pi )\\int_{0}^{\\pi } x^{2} cos(nx) dx = 4(-1)^n / n^{2}\"></div>\n            (Two division points.)\n          </li>\n<li>Fourier expansion: x² = π²/3 + ∑_{n=1}^∞ 4(−1)^n cos(nx)/n².</li>\n<li>Let x=π: π² = π²/3 + ∑ 4(−1)^n (−1)^n /n² = π²/3 + ∑ 4/n².</li>\n<li>Therefore π² − π²/3 = 4 ∑ 1/n² ⇒ (2π²/3)=4 ∑1/n² ⇒ <strong>∑1/n² = π²/6</strong>。</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>Fourier key substitution</h3>\n<div class=\"calc-line\" data-latex=\"x^{2} = \\pi ^{2}/3 + \\Sigma 4(-1)^{n} cos(nx)/n^{2} \\to x=\\pi \\Rightarrow \\sum 1/n^{2}=\\pi ^{2}/6\"></div>\n<p>The partial sum in the figure above shows the convergence speed; for the complete derivation, see the text to calculate aₙ by integrating by parts.</p>\n</div>", "deep": "\n<h3>Euler's infinite product inspiration</h3>\n<p>Euler's analogy is sin x /x = ∏ (1−x²/(n²π²)), and comparing the x² coefficients we get ∑1/n²=π²/6. Inspiration is correct, strictness is supplemented.</p>\n<h3>promotion</h3>\n<p>∑1/n^{2k} is a rational multiple of π^{2k} (Bernoulli number); the irrationality of odd values ​​ζ(3) was not proved until 1979 by Appelli.</p>\n", "why": "\n<p>The opening of the special value of the ζ function; the signature example of Fourier analysis \"splitting the function into waves\".</p>\n", "try": "\n<ul>\n<li>Drag N to see the partial sum approximation 1.64493….</li>\n<li>Remember the key trick: do Fourier expansion of x², let x=π.</li>\n</ul>\n"}, "field": "math"}}, "title": "Basel issues", "subtitle": "The sum of the reciprocals of squares actually turns out to be pi", "difficultyLabel": "Hardcore challenge", "tags": ["analyze", "Fourier", "Euler"], "era": "1734 Euler; rigorous successor", "oneLiner": "1 + 1/4 + 1/9 + 1/16 + … added to infinity is exactly π²/6.", "people": [{"role": "Solve", "name": "Euler", "years": "1734"}, {"role": "Strict Fourier path", "name": "successor analyst", "years": "19th century"}], "sections": {"story": "\n<p>People in the city of Basel, Italy, stared at ∑1/n² for a long time and couldn’t figure it out. Euler gave the answer π²/6, tying the discrete series and the circle together, shocking the audience.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Adding up the reciprocals of squares to infinity equals <span data-latex=\"\\pi^2/6\">π²/6</span>。</p>\n<div class=\"formula\" data-latex=\"\\sum_{n=1}^{\\infty}\\dfrac{1}{n^2}=\\dfrac{\\pi^2}{6}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Fourier coefficient</div>\n<p>When f is piecewise smooth on [−π,π], a₀/2 + ∑ (aₙ cos nx + bₙ sin nx),\n          aₙ=(1/π)∫_{−π}^π f cos nx dx etc. Parseval: The average |f|² is equal to the sum of the squared coefficients.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Expand x² into a cosine wave on the circumference and substitute it into a special point, and ∑1/n² will appear in the series coefficient.</p><div class=\"interactive\" data-widget=\"basel-sum\"></div>\n<div class=\"proof-nav\"><span>Expand f(x)=x</span><span>Calculation coefficient</span><span>Substitute special points/Parseval</span></div>\n<ol class=\"steps\">\n<li>Take f(x)=x on (−π,π). Then f is an odd function, aₙ=0, bₙ = (2/π) ∫_0^π x sin(nx) dx.</li>\n<li>Integral by parts: u=x, dv=sin(nx)dx,\n            <div class=\"calc-line\" data-latex=\"\\int_{0}^{\\pi } x sin(nx) dx = [-x cos(nx)/n]_0^\\pi + \\int_{0}^{\\pi } cos(nx)/n dx = -\\pi (-1)^n /n + 0\"></div>\n            More carefully: cos(nπ)=(−1)^n, so −π cos(nπ)/n = −π(−1)^n /n; which is 0 at 0. ∫ The cos term is 0 when n≥1.\n            In fact the sign of ∫_0^π x sin nx dx = −(π/n)(−1)^n: cos(nπ)=(−1)^n, −x cos/n in π: −π(−1)^n /n.\n            Therefore, bₙ = (2/π)·[−π(−1)^n /n] = −2(−1)^n /n = 2(−1)^{n+1}/n.\n          </li>\n<li>Then x = ∑_{n=1}^∞ 2(−1)^{n+1} sin(nx)/n in (−π,π).</li>\n<li>It is more straightforward to use Parseval’s identity: for f(x)=x,\n            <div class=\"calc-line\" data-latex=\"(1/\\pi )\\int_{-\\pi }^\\pi x^{2} dx /2 \\text{的标准形式}： (1/\\pi )\\int_{-\\pi }^\\pi [f(x)]^{2} dx = 2\\sum b_{n}^{2} \\text{的约定版本}\"></div>\n            A common conclusion: ∫_{−π}^π x² dx = 2π³/3, while the coefficients give a ∑ 4/n² type relationship.\n          </li>\n<li><strong>Classroom clean version:</strong>Consider f(x)=x² at [−π,π]:\n            <div class=\"calc-line\" data-latex=\"a_{0} = (2/\\pi )\\int_{0}^{\\pi } x^{2} dx = 2\\pi ^{2}/3\"></div>\n<div class=\"calc-line\" data-latex=\"a_{n} = (2/\\pi )\\int_{0}^{\\pi } x^{2} cos(nx) dx = 4(-1)^n / n^{2}\"></div>\n            (Two division points.)\n          </li>\n<li>Fourier expansion: x² = π²/3 + ∑_{n=1}^∞ 4(−1)^n cos(nx)/n².</li>\n<li>Let x=π: π² = π²/3 + ∑ 4(−1)^n (−1)^n /n² = π²/3 + ∑ 4/n².</li>\n<li>Therefore π² − π²/3 = 4 ∑ 1/n² ⇒ (2π²/3)=4 ∑1/n² ⇒ <strong>∑1/n² = π²/6</strong>。</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>Fourier key substitution</h3>\n<div class=\"calc-line\" data-latex=\"x^{2} = \\pi ^{2}/3 + \\Sigma 4(-1)^{n} cos(nx)/n^{2} \\to x=\\pi \\Rightarrow \\sum 1/n^{2}=\\pi ^{2}/6\"></div>\n<p>The partial sum in the figure above shows the convergence speed; for the complete derivation, see the text to calculate aₙ by integrating by parts.</p>\n</div>", "deep": "\n<h3>Euler's infinite product inspiration</h3>\n<p>Euler's analogy is sin x /x = ∏ (1−x²/(n²π²)), and comparing the x² coefficients we get ∑1/n²=π²/6. Inspiration is correct, strictness is supplemented.</p>\n<h3>promotion</h3>\n<p>∑1/n^{2k} is a rational multiple of π^{2k} (Bernoulli number); the irrationality of odd values ​​ζ(3) was not proved until 1979 by Appelli.</p>\n", "why": "\n<p>The opening of the special value of the ζ function; the signature example of Fourier analysis \"splitting the function into waves\".</p>\n", "try": "\n<ul>\n<li>Drag N to see the partial sum approximation 1.64493….</li>\n<li>Remember the key trick: do Fourier expansion of x², let x=π.</li>\n</ul>\n"}}, {"id": "pick", "field": "math", "difficulty": "medium", "emoji": "🔷", "iconClass": "warm", "related": ["euler-polyhedron", "pythagoras", "amgm"], "__i18n": {"zh": {"id": "pick", "title": "皮克定理", "subtitle": "数点就能算面积", "emoji": "🔷", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["几何", "组合", "格点"], "era": "1899，Georg Pick", "oneLiner": "格子纸上的多边形：面积 = 内部格点数 + 边界格点数/2 − 1。", "people": [{"role": "提出并证明", "name": "格奥尔格·皮克", "years": "1899"}], "related": ["euler-polyhedron", "pythagoras", "amgm"], "sections": {"story": "\n        <p>顶点都扎在格子点上的多边形，面积居然只由「里面几个点、边上几个点」决定——不用剪下来称重。皮克定理是离散几何的可爱结果。</p>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>格子纸上多边形：面积 = 内点 + 边界点/2 − 1。</p>\n        <div class=\"formula\" data-latex=\"\\operatorname{Area}(P)=I+\\dfrac{B}{2}-1\"></div>\n        <p><span data-latex=\"I\">I</span> 内部格点数，<span data-latex=\"B\">B</span> 边界格点数（含顶点）。</p>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理 1（基本三角）</div>\n          <p>若格点三角形内部无点、边界只有 3 个顶点（无其它边界点），则面积为 1/2。</p>\n          <p>由叉积：顶点 (0,0),(a,b),(c,d) 时 Area=|ad−bc|/2，而无其它边界点 + 空内部 ⇔ |ad−bc|=1（Pick 或整数几何）。</p>\n        </div>\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理 2（可加性）</div>\n          <p>若 P 分成 P₁,P₂ 沿公共格点折线，则 I,B,Area 满足可加关系使 Pick 表达式可加：证明公式对两块成立 ⇒ 对合并成立（边界点共享需仔细计）。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>切成许多面积 1/2 的小三角，再和顶点数、边数用欧拉关系联立，公式就出来了。</p><div class=\"interactive\" data-widget=\"pick-theorem\"></div>\n        <div class=\"proof-nav\"><span>基本三角</span><span>剖分</span><span>欧拉核对</span></div>\n        <ol class=\"steps\">\n          <li>把 P 剖分成面积 1/2 的基本格点三角形（可证明任何简单格点多边形都能这样剖分）。</li>\n          <li>设有 T 个基本三角，则 Area = T/2。</li>\n          <li>把剖分看成平面图：V = I+B 个格点顶点；面数 F = T + 1（含外部无限面）。</li>\n          <li>每三角形 3 边，每内部棱算两次，边界棱算一次：3T = 2E_int + E_boundary。而 E = E_int + E_boundary。</li>\n          <li>边界恰有 B 个格点 ⇒ 边界棱数 E_boundary = B（简单闭折线）。</li>\n          <li>欧拉：V−E+F=2（含外面；对圆盘三角剖分 V−E+(T+1)=2 ⇒ V−E+T=1）。</li>\n          <li>联立 3T = 2(E−B) + B = 2E − B，得 2E = 3T + B。代入欧拉：\n            <div class=\"calc-line\" data-latex=\"I+B - (3T+B)/2 + T = 1\"></div>\n            化简：I + B/2 − T/2 = 1 ⇒ T/2 = I + B/2 − 1。\n          </li>\n          <li>但 Area=T/2，故 Area = I + B/2 − 1。</li>\n        </ol>\n        <p class=\"qed\">∎</p>\n      <div data-more-detail>\n    <h3>与欧拉公式的接口</h3>\n    <p>剖成 T 个基本三角（各面积 1/2）⇒ Area=T/2。结合 3T=2E_int+B 与 V−E+T=1（V=I+B）即得 Area=I+B/2−1。交互图中绿点=内点、黄点=边界点。</p>\n    </div>", "deep": "\n        <h3>例子</h3>\n        <p>单位正方形：I=0,B=4，Area=0+2−1=1。对。</p>\n        <p>3-4-5 直角三角形格点版需自己数 I,B。</p>\n        <h3>高维</h3>\n        <p>高维格点多面体体积不能仅由「内点边界点」如此简单给出（需 Ehrhart 理论）。</p>\n      ", "why": "\n        <p>网格地图、像素图形的玩具模型；证明里还能看见欧拉公式的影子。</p>\n      ", "try": "\n        <ul>\n          <li>切换交互图形状，数绿点（内）黄点（边），核对公式。</li>\n          <li>单位正方形：I=0,B=4 → 0+2−1=1，正确。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "pick", "title": "Pick's theorem", "subtitle": "Calculate the area by counting points", "emoji": "🔷", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["geometry", "combination", "Grid points"], "era": "1899，Georg Pick", "oneLiner": "Polygon on grid paper: area = number of internal grid points + number of boundary grid points/2 − 1.", "people": [{"role": "propose and prove", "name": "Georg Peake", "years": "1899"}], "related": ["euler-polyhedron", "pythagoras", "amgm"], "sections": {"story": "\n<p>The area of ​​a polygon whose vertices are all connected to the grid points is actually only determined by \"a few points inside and a few points on the sides\" - there is no need to cut it out and weigh it. Pick's theorem is a lovely consequence of discrete geometry.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Polygon on grid paper: area = interior points + boundary points/2 − 1.</p>\n<div class=\"formula\" data-latex=\"\\operatorname{Area}(P)=I+\\dfrac{B}{2}-1\"></div>\n<p><span data-latex=\"I\">I</span> The number of internal grid points,<span data-latex=\"B\">B</span> Number of boundary grid points (including vertices).</p>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma 1 (Basic Trigonometry)</div>\n<p>If the lattice triangle has no points inside and only 3 vertices on the boundary (no other boundary points), then the area is 1/2.</p>\n<p>By cross product: Area=|ad−bc|/2 for vertices (0,0),(a,b),(c,d) and no other boundary points + empty interior ⇔ |ad−bc|=1 (Pick or integer geometry).</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma 2 (Additivity)</div>\n<p>If P is divided into P₁, P₂ along the common grid point polyline, then I, B, Area satisfy the additive relationship so that the Pick expression is additive: prove that the formula is true for two blocks and ⇒ is true for merging (the sharing of boundary points needs to be calculated carefully).</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Cut it into many small triangles with an area of ​​1/2, and then combine it with the number of vertices and edges using the Euler relationship, and the formula comes out.</p><div class=\"interactive\" data-widget=\"pick-theorem\"></div>\n<div class=\"proof-nav\"><span>basic triangle</span><span>Dissect</span><span>Euler check</span></div>\n<ol class=\"steps\">\n<li>Dissect P into basi
