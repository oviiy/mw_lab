y-time also has form <span data-latex=\"\\Delta E\\Delta t\\gtrsim\\hbar/2\">ΔE Δt ≳ ℏ/2</span>(Interpret with caution).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">It’s not as simple as measuring disturbances</div>\n<p>The introductory metaphor of \"photons kicking electrons away\" is inspiring, but the principle is deeper: the state itself cannot be the eigenstate of both at the same time.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Yizi</div>\n<p><span data-latex=\"[x,p]=i\\hbar\">[x,p]=iℏ</span>. A lower bound on the uncertainty product can be derived from the Cauchy-Schwarz type argument.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The narrower the wave packet (position is certain), the wider the frequency/wavenumber component is required (momentum is uncertain) - the enemy of the Fourier transform.</p>\n<ol class=\"steps\">\n<li>Define variance <span data-latex=\"\\sigma_x^2=\\langle(x-\\bar x)^2\\rangle\">σ_x²</span> wait.</li>\n<li>Use operator inequalities (Robertson relations) for state vectors.</li>\n<li>Substituting [x,p]=iℏ, we get σ_x σ_p ≥ ℏ/2.</li>\n</ol>\n", "deep": "\n<p>The entanglement and complementarity principles in quantum information are all in line with \"you cannot have all the classical labels at the same time.\"</p>\n", "why": "\n<p>Understand the conceptual background of atomic stability, spectral line width, and tunneling effects; deny the classic image of \"decisive trajectory\".</p>\n", "try": "\n<ul>\n<li>If the electron is restricted to Δx≈0.1 nm, the estimated magnitude of Δp and velocity is uncertain.</li>\n<li>Use \"wave packet\" sketches to explain the position-momentum trade-off.</li>\n</ul>\n"}}, {"id": "snell", "field": "physics", "difficulty": "easy", "emoji": "🔦", "iconClass": "green", "related": ["young-slit", "lens-maker", "maxwell", "doppler"], "__i18n": {"zh": {"id": "snell", "field": "physics", "title": "斯涅尔折射定律", "subtitle": "光在界面转弯的规矩", "emoji": "🔦", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["光学", "波动", "几何光学"], "era": "斯涅尔 1621；费马原理更优解释", "oneLiner": "n₁ sin θ₁ = n₂ sin θ₂——折射率×入射角正弦，两边相等。", "people": [{"role": "经验定律", "name": "斯涅尔", "years": "1621"}, {"role": "最短时间原理", "name": "费马", "years": "17 世纪"}], "related": ["young-slit", "lens-maker", "maxwell", "doppler"], "sections": {"story": "\n          <p>筷子在水里「折断」，是光在水面弯折。折射率不同，速度不同；费马说光走时间最短路径，弯折角就服从斯涅尔。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"n_1\\sin\\theta_1=n_2\\sin\\theta_2\"></div>\n          <p><span data-latex=\"n=c/v\">n=c/v</span> 为介质折射率。从光密到光疏，折射角大于入射角，大到 90° 发生全反射。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">相对折射率</div>\n            <p>也可写 <span data-latex=\"\\sin\\theta_1/\\sin\\theta_2=v_1/v_2\">sinθ₁/sinθ₂=v₁/v₂</span>。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">费马原理</div>\n            <p>光取光程极值。在两介质直线路径族里对入射点变分，即得斯涅尔定律。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>救生员跑沙滩+游泳救人要选折线；光也「算」时间。数学变分给出 sin 关系。</p>\n          <ol class=\"steps\">\n            <li>设界面上一点把路径分成两段直线。</li>\n            <li>总时间 t=L₁/v₁+L₂/v₂，对交点坐标求导为零。</li>\n            <li>得到 n₁ sin θ₁ = n₂ sin θ₂。</li>\n          </ol>\n        ", "deep": "\n          <p>波动说用边界条件匹配同样得到折射定律；麦克斯韦方程是更底层。</p>\n        ", "why": "\n          <p>眼镜、镜头、光纤（全反射）、海市蜃楼。</p>\n        ", "try": "\n          <ul>\n            <li>空气→水，入射 30°，n≈1.33，折射角？</li>\n            <li>计算水→空气的临界角。</li>\n          </ul>\n        "}}, "en": {"id": "snell", "field": "physics", "title": "Snell's law of refraction", "subtitle": "Rules for light turning in the interface", "emoji": "🔦", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["Optics", "fluctuation", "geometric optics"], "era": "Snell 1621; a better explanation of Fermat's principle", "oneLiner": "n₁ sin θ₁ = n₂ sin θ₂——Refractive index × sine of incident angle, both sides are equal.", "people": [{"role": "empirical laws", "name": "Snell", "years": "1621"}, {"role": "shortest time principle", "name": "Fermat", "years": "17th century"}], "related": ["young-slit", "lens-maker", "maxwell", "doppler"], "sections": {"story": "\n<p>Chopsticks \"break\" in the water, which is the bending of light on the surface of the water. Different refractive indexes lead to different speeds; Fermat said that light takes the shortest path in time, and the bending angle obeys Snell.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"n_1\\sin\\theta_1=n_2\\sin\\theta_2\"></div>\n<p><span data-latex=\"n=c/v\">n=c/v</span> is the refractive index of the medium. From optical density to optical sparseness, the refraction angle is greater than the incident angle, and total reflection occurs as large as 90°.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">relative refractive index</div>\n<p>You can also write <span data-latex=\"\\sin\\theta_1/\\sin\\theta_2=v_1/v_2\">sinθ₁/sinθ₂=v₁/v₂</span>。</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Fermat's principle</div>\n<p>Light takes the extreme value of the optical path. The variation of the incident point in the family of two-medium straight-line paths is Snell's law.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>When lifeguards run on the beach + swim to save people, they have to choose a broken line; light also \"counts\" time. Mathematical variation gives the sin relation.</p>\n<ol class=\"steps\">\n<li>Set a point on the interface to divide the path into two straight lines.</li>\n<li>The total time t=L₁/v₁+L₂/v₂, and the derivative of the intersection coordinate is zero.</li>\n<li>We get n₁ sin θ₁ = n₂ sin θ₂.</li>\n</ol>\n", "deep": "\n<p>The wave theory also uses boundary condition matching to obtain the law of refraction; Maxwell's equation is at a lower level.</p>\n", "why": "\n<p>Glasses, lenses, fiber optics (total reflection), mirages.</p>\n", "try": "\n<ul>\n<li>Air→water, incident 30°, n≈1.33, refraction angle?</li>\n<li>Calculate the critical angle for water → air.</li>\n</ul>\n"}}}, "title": "Snell's law of refraction", "subtitle": "Rules for light turning in the interface", "difficultyLabel": "Easy to use", "tags": ["Optics", "fluctuation", "geometric optics"], "era": "Snell 1621; a better explanation of Fermat's principle", "oneLiner": "n₁ sin θ₁ = n₂ sin θ₂——Refractive index × sine of incident angle, both sides are equal.", "people": [{"role": "empirical laws", "name": "Snell", "years": "1621"}, {"role": "shortest time principle", "name": "Fermat", "years": "17th century"}], "sections": {"story": "\n<p>Chopsticks \"break\" in the water, which is the bending of light on the surface of the water. Different refractive indexes lead to different speeds; Fermat said that light takes the shortest path in time, and the bending angle obeys Snell.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"n_1\\sin\\theta_1=n_2\\sin\\theta_2\"></div>\n<p><span data-latex=\"n=c/v\">n=c/v</span> is the refractive index of the medium. From optical density to optical sparseness, the refraction angle is greater than the incident angle, and total reflection occurs as large as 90°.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">relative refractive index</div>\n<p>You can also write <span data-latex=\"\\sin\\theta_1/\\sin\\theta_2=v_1/v_2\">sinθ₁/sinθ₂=v₁/v₂</span>。</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Fermat's principle</div>\n<p>Light takes the extreme value of the optical path. The variation of the incident point in the family of two-medium straight-line paths is Snell's law.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>When lifeguards run on the beach + swim to save people, they have to choose a broken line; light also \"counts\" time. Mathematical variation gives the sin relation.</p>\n<ol class=\"steps\">\n<li>Set a point on the interface to divide the path into two straight lines.</li>\n<li>The total time t=L₁/v₁+L₂/v₂, and the derivative of the intersection coordinate is zero.</li>\n<li>We get n₁ sin θ₁ = n₂ sin θ₂.</li>\n</ol>\n", "deep": "\n<p>The wave theory also uses boundary condition matching to obtain the law of refraction; Maxwell's equation is at a lower level.</p>\n", "why": "\n<p>Glasses, lenses, fiber optics (total reflection), mirages.</p>\n", "try": "\n<ul>\n<li>Air→water, incident 30°, n≈1.33, refraction angle?</li>\n<li>Calculate the critical angle for water → air.</li>\n</ul>\n"}}, {"id": "archimedes", "field": "physics", "difficulty": "easy", "emoji": "🛁", "iconClass": "warm", "related": ["pascal", "bernoulli", "newton-laws", "energy-conservation"], "__i18n": {"zh": {"id": "archimedes", "field": "physics", "title": "阿基米德原理", "subtitle": "浮力等于排开液体的重量", "emoji": "🛁", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["力学", "流体", "古典"], "era": "古希腊阿基米德", "oneLiner": "浸在流体里的物体受到向上的浮力，大小等于它挤走的那份流体的重力。", "people": [{"role": "发现", "name": "阿基米德", "years": "约前 3 世纪"}], "related": ["pascal", "bernoulli", "newton-laws", "energy-conservation"], "sections": {"story": "\n          <p>国王皇冠是否掺假？阿基米德在浴池里悟到排水与浮力——「尤里卡」传说讲的就是这件事。船为何浮、热气球为何升，都是同一套账。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"F_{\\mathrm{b}}=\\rho_{\\mathrm{f}} V_{\\mathrm{dis}} g\"></div>\n          <p>方向竖直向上。ρ_f 流体密度，V_dis 排开体积。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">压强随深度</div>\n            <p>静止液体中 <span data-latex=\"p=p_0+\\rho g h\">p=p₀+ρgh</span>。物体上下表面压力差提供浮力。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">压力差</div>\n            <p>对竖直柱体：下表面比上表面深 Δh，压力差 ρgΔh，乘面积 = ρgV。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>底下顶得比上面压得更猛，净力向上，刚好等于「挖掉那块液体」本来的重量。</p>\n          <ol class=\"steps\">\n            <li>静止流体压强随深度线性增加。</li>\n            <li>任意形状物体：把表面压力积分；或用「替换为同形状流体」平衡论证。</li>\n            <li>得浮力 = 排开流体重力，方向向上。</li>\n          </ol>\n        ", "deep": "\n          <p>密度小于液体则上浮至平衡；潜艇靠改变自身平均密度下潜。</p>\n        ", "why": "\n          <p>造船、水文、密度测量、热气球与潜水。</p>\n        ", "try": "\n          <ul>\n            <li>冰山约 90% 在水下，如何用密度比解释？</li>\n            <li>同样质量，铁球与木块谁浮力大（都完全浸没时）？</li>\n          </ul>\n        "}}, "en": {"id": "archimedes", "field": "physics", "title": "Archimedes' principle", "subtitle": "Buoyancy is equal to the weight of the liquid displaced", "emoji": "🛁", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "fluid", "classical"], "era": "Ancient Greece Archimedes", "oneLiner": "An object immersed in a fluid experiences an upward buoyant force equal to the weight of the fluid it displaces.", "people": [{"role": "Discover", "name": "Archimedes", "years": "ca. 3rd century BC"}], "related": ["pascal", "bernoulli", "newton-laws", "energy-conservation"], "sections": {"story": "\n<p>Is the King's Crown adulterated? Archimedes realized drainage and buoyancy in the bath - this is what the legend \"Eureka\" tells. Why a boat floats and why a hot air balloon rises are all based on the same account.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"F_{\\mathrm{b}}=\\rho_{\\mathrm{f}} V_{\\mathrm{dis}} g\"></div>\n<p>The direction is vertically upward. ρ_f fluid density, V_dis displaced volume.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">pressure with depth</div>\n<p>in still liquid <span data-latex=\"p=p_0+\\rho g h\">p=p₀+ρgh</span>. The difference in pressure between the upper and lower surfaces of an object provides buoyancy.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">pressure difference</div>\n<p>For a vertical cylinder: the lower surface is Δh deeper than the upper surface, the pressure difference is ρgΔh, times the area = ρgV.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The bottom is pushing harder than the top, and the net force is upward, which is exactly equal to the original weight of \"dug out the liquid\".</p>\n<ol class=\"steps\">\n<li>Stationary fluid pressure increases linearly with depth.</li>\n<li>Objects of arbitrary shapes: Integrate the surface pressure; or use \"replace with a fluid of the same shape\" to balance the argument.</li>\n<li>Obtain buoyancy = displace the gravity of the fluid and point upward.</li>\n</ol>\n", "deep": "\n<p>If the density is less than that of a liquid, it will float to equilibrium; a submarine will dive by changing its average density.</p>\n", "why": "\n<p>Shipbuilding, hydrography, density measurement, hot air ballooning and diving.</p>\n", "try": "\n<ul>\n<li>About 90% of the iceberg is underwater. How to explain it in terms of density ratio?</li>\n<li>Of the same mass, which one has greater buoyancy, an iron ball or a wooden block (when both are completely submerged)?</li>\n</ul>\n"}}}, "title": "Archimedes' principle", "subtitle": "Buoyancy is equal to the weight of the liquid displaced", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "fluid", "classical"], "era": "Ancient Greece Archimedes", "oneLiner": "An object immersed in a fluid experiences an upward buoyant force equal to the weight of the fluid it displaces.", "people": [{"role": "Discover", "name": "Archimedes", "years": "ca. 3rd century BC"}], "sections": {"story": "\n<p>Is the King's Crown adulterated? Archimedes realized drainage and buoyancy in the bath - this is what the legend \"Eureka\" tells. Why a boat floats and why a hot air balloon rises are all based on the same account.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"F_{\\mathrm{b}}=\\rho_{\\mathrm{f}} V_{\\mathrm{dis}} g\"></div>\n<p>The direction is vertically upward. ρ_f fluid density, V_dis displaced volume.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">pressure with depth</div>\n<p>in still liquid <span data-latex=\"p=p_0+\\rho g h\">p=p₀+ρgh</span>. The difference in pressure between the upper and lower surfaces of an object provides buoyancy.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">pressure difference</div>\n<p>For a vertical cylinder: the lower surface is Δh deeper than the upper surface, the pressure difference is ρgΔh, times the area = ρgV.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The bottom is pushing harder than the top, and the net force is upward, which is exactly equal to the original weight of \"dug out the liquid\".</p>\n<ol class=\"steps\">\n<li>Stationary fluid pressure increases linearly with depth.</li>\n<li>Objects of arbitrary shapes: Integrate the surface pressure; or use \"replace with a fluid of the same shape\" to balance the argument.</li>\n<li>Obtain buoyancy = displace the gravity of the fluid and point upward.</li>\n</ol>\n", "deep": "\n<p>If the density is less than that of a liquid, it will float to equilibrium; a submarine will dive by changing its average density.</p>\n", "why": "\n<p>Shipbuilding, hydrography, density measurement, hot air ballooning and diving.</p>\n", "try": "\n<ul>\n<li>About 90% of the iceberg is underwater. How to explain it in terms of density ratio?</li>\n<li>Of the same mass, which one has greater buoyancy, an iron ball or a wooden block (when both are completely submerged)?</li>\n</ul>\n"}}, {"id": "bernoulli", "field": "physics", "difficulty": "medium", "emoji": "✈️", "iconClass": "", "related": ["archimedes", "pascal", "energy-conservation", "work-energy"], "__i18n": {"zh": {"id": "bernoulli", "field": "physics", "title": "伯努利原理", "subtitle": "流得快的地方压强小", "emoji": "✈️", "iconClass": "", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["流体", "能量", "应用"], "era": "丹尼尔·伯努利 1738", "oneLiner": "理想流体定常流动时，高度、压强与流速满足能量式守恒关系。", "people": [{"role": "提出", "name": "丹尼尔·伯努利", "years": "1738"}], "related": ["archimedes", "pascal", "energy-conservation", "work-energy"], "sections": {"story": "\n          <p>飞机机翼、喷雾器、球场上「香蕉球」——流速与压强的拉扯。伯努利把流体动能、重力势能和压强能写在一条式子里。</p>\n        ", "statement": "\n          <p>不可压缩、无黏、定常流沿流线：</p>\n          <div class=\"formula\" data-latex=\"p+\\rho g h+\\tfrac12\\rho v^2=\\mathrm{const}\"></div>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">理想化条件</div>\n            <p>真实空气有黏性、可能湍流。伯努利是「第一刀」模型，机翼完整解释还需环量与边界层（但压强差图像仍有用）。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">能量观点</div>\n            <p>对流体微团用做功与动能定理，压强做功项变成 p/ρ，加上 gh 与 v²/2。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>管道变窄处流加快（连续性）；要加速就得有净压力推——所以窄处压强往往更低。</p>\n          <ol class=\"steps\">\n            <li>连续方程：ρAv≈const（不可压 A v≈const）。</li>\n            <li>对沿流线的柱体用牛顿定律/能量积分。</li>\n            <li>整理得伯努利方程。</li>\n          </ol>\n        ", "deep": "\n          <p>文丘里管测流速、匹托托管测空速，都是直接应用。</p>\n        ", "why": "\n          <p>航空入门、管道工程、气象直觉（风大处压强）。</p>\n        ", "try": "\n          <ul>\n            <li>两张纸中间吹气，纸为何靠近？</li>\n            <li>水平管截面积减半，流速与压强如何变（定性）？</li>\n          </ul>\n        "}}, "en": {"id": "bernoulli", "field": "physics", "title": "Bernoulli's principle", "subtitle": "Where the flow is fast, the pressure is low", "emoji": "✈️", "iconClass": "", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["fluid", "energy", "application"], "era": "Daniel Bernoulli 1738", "oneLiner": "When an ideal fluid flows steadily, the height, pressure and flow rate satisfy the energy conservation relationship.", "people": [{"role": "propose", "name": "Daniel Bernoulli", "years": "1738"}], "related": ["archimedes", "pascal", "energy-conservation", "work-energy"], "sections": {"story": "\n<p>Airplane wings, sprayers, \"banana balls\" on the field - the pull of flow velocity and pressure. Bernoulli wrote the fluid kinetic energy, gravitational potential energy and pressure energy in one equation.</p>\n", "statement": "\n<p>Incompressible, inviscid, steady flow along streamlines:</p>\n<div class=\"formula\" data-latex=\"p+\\rho g h+\\tfrac12\\rho v^2=\\mathrm{const}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">ideal conditions</div>\n<p>Real air is viscous and may be turbulent. Bernoulli is the \"first knife\" model, and a complete explanation of the wing requires circulation and boundary layers (but the pressure difference image is still useful).</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">energy perspective</div>\n<p>Using the work and kinetic energy theorem for fluid particles, the pressure work term becomes p/ρ, plus gh and v²/2.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Where the pipe narrows, the flow accelerates (continuity); to accelerate, there must be a net pressure push - so the pressure is often lower in narrow places.</p>\n<ol class=\"steps\">\n<li>Continuity equation: ρAv≈const (incompressible A v≈const).</li>\n<li>Use Newton's law/energy integration for a cylinder along a streamline.</li>\n<li>Sort out Bernoulli's equation.</li>\n</ol>\n", "deep": "\n<p>Venturi tubes measure flow velocity and pitot tubes measure airspeed, both of which are directly applicable.</p>\n", "why": "\n<p>Introduction to aviation, pipeline engineering, meteorological intuition (pressure in strong winds).</p>\n", "try": "\n<ul>\n<li>If air is blown between two pieces of paper, why are the papers closer?</li>\n<li>If the cross-sectional area of ​​a horizontal pipe is halved, how will the flow velocity and pressure change (qualitatively)?</li>\n</ul>\n"}}}, "title": "Bernoulli's principle", "subtitle": "Where the flow is fast, the pressure is low", "difficultyLabel": "Spend some time thinking", "tags": ["fluid", "energy", "application"], "era": "Daniel Bernoulli 1738", "oneLiner": "When an ideal fluid flows steadily, the height, pressure and flow rate satisfy the energy conservation relationship.", "people": [{"role": "propose", "name": "Daniel Bernoulli", "years": "1738"}], "sections": {"story": "\n<p>Airplane wings, sprayers, \"banana balls\" on the field - the pull of flow velocity and pressure. Bernoulli wrote the fluid kinetic energy, gravitational potential energy and pressure energy in one equation.</p>\n", "statement": "\n<p>Incompressible, inviscid, steady flow along streamlines:</p>\n<div class=\"formula\" data-latex=\"p+\\rho g h+\\tfrac12\\rho v^2=\\mathrm{const}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">ideal conditions</div>\n<p>Real air is viscous and may be turbulent. Bernoulli is the \"first knife\" model, and a complete explanation of the wing requires circulation and boundary layers (but the pressure difference image is still useful).</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">energy perspective</div>\n<p>Using the work and kinetic energy theorem for fluid particles, the pressure work term becomes p/ρ, plus gh and v²/2.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Where the pipe narrows, the flow accelerates (continuity); to accelerate, there must be a net pressure push - so the pressure is often lower in narrow places.</p>\n<ol class=\"steps\">\n<li>Continuity equation: ρAv≈const (incompressible A v≈const).</li>\n<li>Use Newton's law/energy integration for a cylinder along a streamline.</li>\n<li>Sort out Bernoulli's equation.</li>\n</ol>\n", "deep": "\n<p>Venturi tubes measure flow velocity and pitot tubes measure airspeed, both of which are directly applicable.</p>\n", "why": "\n<p>Introduction to aviation, pipeline engineering, meteorological intuition (pressure in strong winds).</p>\n", "try": "\n<ul>\n<li>If air is blown between two pieces of paper, why are the papers closer?</li>\n<li>If the cross-sectional area of ​​a horizontal pipe is halved, how will the flow velocity and pressure change (qualitatively)?</li>\n</ul>\n"}}, {"id": "kepler", "field": "physics", "difficulty": "medium", "emoji": "🪐", "iconClass": "purple", "related": ["newton-gravity", "escape-velocity", "angular-momentum", "relativity-gr"], "__i18n": {"zh": {"id": "kepler", "field": "physics", "title": "开普勒行星运动定律", "subtitle": "椭圆、面积、周期平方", "emoji": "🪐", "iconClass": "purple", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["天体力学", "开普勒", "引力"], "era": "1609–1619；牛顿后来给出动力学解释", "oneLiner": "行星绕日：轨道是椭圆；相等时间扫过相等面积；T² 正比于半长轴的立方。", "people": [{"role": "经验定律", "name": "约翰内斯·开普勒", "years": "1609–1619"}, {"role": "动力学导出", "name": "牛顿", "years": "1687"}], "related": ["newton-gravity", "escape-velocity", "angular-momentum", "relativity-gr"], "sections": {"story": "\n          <p>第谷留下精密数据，开普勒用椭圆取代完美正圆，写出三条定律。牛顿再用万有引力从「为什么」导出它们。</p>\n        ", "statement": "\n          <p><strong>第一定律：</strong>轨道是椭圆，太阳在一个焦点上。</p>\n          <p><strong>第二定律：</strong>太阳–行星连线在相等时间内扫过相等面积（面积速度恒定）。</p>\n          <p><strong>第三定律：</strong>周期 T 与半长轴 a 满足</p>\n          <div class=\"formula\" data-latex=\"\\dfrac{T^2}{a^3}=\\mathrm{const}\\quad(\\text{对绕同一中心天体})\"></div>\n          <p>牛顿形式（中心质量 M ≫ m）：</p>\n          <div class=\"formula\" data-latex=\"T^2=\\dfrac{4\\pi^2}{GM}a^3\"></div>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">面积定律 = 角动量守恒</div>\n            <p>中心力矩为零 → 角动量守恒 → 面积速度恒定。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">向心力与平方反比</div>\n            <p>圆周近似下 <span data-latex=\"GMm/r^2=m\\omega^2 r\">GMm/r²=mω²r</span> 可推出 T²∝r³。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>开普勒从数据归纳；牛顿用引力 + 微积分证明圆锥曲线轨道与第三定律。</p>\n          <ol class=\"steps\">\n            <li>第二定律 ← 中心力 → 角动量守恒。</li>\n            <li>平方反比引力下，轨道微分方程给出圆锥曲线（椭圆/抛物/双曲）。</li>\n            <li>对椭圆积分周期，得 T²∝a³。</li>\n          </ol>\n        ", "deep": "\n          <p>双星、系外行星测质量仍用第三定律的推广。广义相对论对水星近日点进动作小修正。</p>\n        ", "why": "\n          <p>卫星轨道设计、航天窗口、天文测质量的基本尺子。</p>\n        ", "try": "\n          <ul>\n            <li>地球 a 约 1 AU、T=1 年。若 a 变为 4 AU，周期约几年？</li>\n            <li>近日点为何更快？（第二定律）</li>\n          </ul>\n        "}}, "en": {"id": "kepler", "field": "physics", "title": "Kepler's laws of planetary motion", "subtitle": "Ellipse, area, period squared", "emoji": "🪐", "iconClass": "purple", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["Celestial mechanics", "Kepler", "gravitational"], "era": "1609–1619; Newton later gave a dynamical explanation", "oneLiner": "Planets orbit the Sun: The orbit is an ellipse; equal times sweep out equal areas; T² is proportional to the cube of the semi-major axis.", "people": [{"role": "empirical laws", "name": "Johannes Kepler", "years": "1609–1619"}, {"role": "Dynamic export", "name": "newton", "years": "1687"}], "related": ["newton-gravity", "escape-velocity", "angular-momentum", "relativity-gr"], "sections": {"story": "\n<p>Tycho left behind precise data, and Kepler replaced the perfect circle with an ellipse and wrote three laws. Newton then used gravity to derive them from the \"why\".</p>\n", "statement": "\n<p><strong>First law:</strong>The orbit is elliptical, with the sun at one focus.</p>\n<p><strong>Second law:</strong>The Sun-Planet line sweeps out equal areas in equal times (area velocity is constant).</p>\n<p><strong>The third law:</strong>The period T and the semi-major axis a satisfy</p>\n<div class=\"formula\" data-latex=\"\\dfrac{T^2}{a^3}=\\mathrm{const}\\quad(\\text{对绕同一中心天体})\"></div>\n<p>Newtonian form (central mass M ≫ m):</p>\n<div class=\"formula\" data-latex=\"T^2=\\dfrac{4\\pi^2}{GM}a^3\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Area Law = Conservation of Angular Momentum</div>\n<p>The central moment is zero → angular momentum is conserved → the area velocity is constant.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Centripetal force is inversely proportional to the square</div>\n<p>Circumferential approximation <span data-latex=\"GMm/r^2=m\\omega^2 r\">GMm/r²=mω²r</span> It follows that T²∝r³.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Kepler generalized from data; Newton used gravity + calculus to prove conic orbits and the third law.</p>\n<ol class=\"steps\">\n<li>Second Law ← Central Force → Conservation of Angular Momentum.</li>\n<li>Under inverse square gravity, the orbital differential equation gives a conic section (elliptical/parabolic/hyperbolic).</li>\n<li>Integrating the period of the ellipse gives T²∝a³.</li>\n</ol>\n", "deep": "\n<p>The generalization of the third law is still used to measure the mass of binary stars and exoplanets. General relativity has a small correction to the perihelion motion of Mercury.</p>\n", "why": "\n<p>Basic ruler for satellite orbit design, space window, and astronomical quality measurement.</p>\n", "try": "\n<ul>\n<li>Earth a is about 1 AU, T=1 year. If a becomes 4 AU, how many years is the period?</li>\n<li>Why is perihelion faster? (Second Law)</li>\n</ul>\n"}}}, "title": "Kepler's laws of planetary motion", "subtitle": "Ellipse, area, period squared", "difficultyLabel": "Spend some time thinking", "tags": ["Celestial mechanics", "Kepler", "gravitational"], "era": "1609–1619; Newton later gave a dynamical explanation", "oneLiner": "Planets orbit the Sun: The orbit is an ellipse; equal times sweep out equal areas; T² is proportional to the cube of the semi-major axis.", "people": [{"role": "empirical laws", "name": "Johannes Kepler", "years": "1609–1619"}, {"role": "Dynamic export", "name": "newton", "years": "1687"}], "sections": {"story": "\n<p>Tycho left behind precise data, and Kepler replaced the perfect circle with an ellipse and wrote three laws. Newton then used gravity to derive them from the \"why\".</p>\n", "statement": "\n<p><strong>First law:</strong>The orbit is elliptical, with the sun at one focus.</p>\n<p><strong>Second law:</strong>The Sun-Planet line sweeps out equal areas in equal times (area velocity is constant).</p>\n<p><strong>The third law:</strong>The period T and the semi-major axis a satisfy</p>\n<div class=\"formula\" data-latex=\"\\dfrac{T^2}{a^3}=\\mathrm{const}\\quad(\\text{对绕同一中心天体})\"></div>\n<p>Newtonian form (central mass M ≫ m):</p>\n<div class=\"formula\" data-latex=\"T^2=\\dfrac{4\\pi^2}{GM}a^3\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Area Law = Conservation of Angular Momentum</div>\n<p>The central moment is zero → angular momentum is conserved → the area velocity is constant.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Centripetal force is inversely proportional to the square</div>\n<p>Circumferential approximation <span data-latex=\"GMm/r^2=m\\omega^2 r\">GMm/r²=mω²r</span> It follows that T²∝r³.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Kepler generalized from data; Newton used gravity + calculus to prove conic orbits and the third law.</p>\n<ol class=\"steps\">\n<li>Second Law ← Central Force → Conservation of Angular Momentum.</li>\n<li>Under inverse square gravity, the orbital differential equation gives a conic section (elliptical/parabolic/hyperbolic).</li>\n<li>Integrating the period of the ellipse gives T²∝a³.</li>\n</ol>\n", "deep": "\n<p>The generalization of the third law is still used to measure the mass of binary stars and exoplanets. General relativity has a small correction to the perihelion motion of Mercury.</p>\n", "why": "\n<p>Basic ruler for satellite orbit design, space window, and astronomical quality measurement.</p>\n", "try": "\n<ul>\n<li>Earth a is about 1 AU, T=1 year. If a becomes 4 AU, how many years is the period?</li>\n<li>Why is perihelion faster? (Second Law)</li>\n</ul>\n"}}, {"id": "hooke", "field": "physics", "difficulty": "easy", "emoji": "🌀", "iconClass": "green", "related": ["newton-laws", "shm", "energy-conservation"], "__i18n": {"zh": {"id": "hooke", "field": "physics", "title": "胡克定律", "subtitle": "弹簧：拉力与伸长成正比", "emoji": "🌀", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["力学", "弹性", "振动"], "era": "胡克 1676/1678", "oneLiner": "在弹性限度内，弹簧恢复力 F = −kx，与形变成正比、方向相反。", "people": [{"role": "提出", "name": "罗伯特·胡克", "years": "1676"}], "related": ["newton-laws", "shm", "energy-conservation"], "sections": {"story": "\n          <p>弹簧秤、蹦床、分子键的简化模型，第一步往往是胡克定律：拉得越长，往回拽得越狠——在没拉坏之前。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"F=-kx\"></div>\n          <p>k 为劲度系数，x 为相对平衡位置的位移。弹性势能：</p>\n          <div class=\"formula\" data-latex=\"E_p=\\tfrac12 kx^2\"></div>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">弹性限度</div>\n            <p>超过限度会出现塑性形变，不再回到原点，胡克定律失效。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">串联并联</div>\n            <p>两弹簧串联 1/k=1/k₁+1/k₂；并联 k=k₁+k₂（理想情况）。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>实验归纳的线性本构关系；小形变下固体原子间力的一阶近似。</p>\n          <ol class=\"steps\">\n            <li>实验：力与伸长在小范围内成正比。</li>\n            <li>定义 k = |F|/|x|，写 F=−kx（负号表示恢复）。</li>\n            <li>W=∫kx dx → 势能 ½kx²。</li>\n          </ol>\n        ", "deep": "\n          <p>广义胡克定律用应力–应变张量描述各向异性弹性体。</p>\n        ", "why": "\n          <p>测力计、减震、简谐振动、材料弹性模量入门。</p>\n        ", "try": "\n          <ul>\n            <li>k=200 N/m，伸长 5 cm，弹力？势能？</li>\n            <li>两根相同弹簧并联，等效 k 如何变？</li>\n          </ul>\n        "}}, "en": {"id": "hooke", "field": "physics", "title": "hooke's law", "subtitle": "Spring: Tension is proportional to elongation", "emoji": "🌀", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "elasticity", "vibration"], "era": "Hooker 1676/1678", "oneLiner": "Within the elastic limit, the spring restoring force F = −kx is proportional to the deformation and opposite in direction.", "people": [{"role": "propose", "name": "Robert Hooker", "years": "1676"}], "related": ["newton-laws", "shm", "energy-conservation"], "sections": {"story": "\n<p>In simplified models of spring balances, trampolines, and molecular bonds, the first step is often Hooke's law: the longer you pull, the harder you pull back—before it breaks.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"F=-kx\"></div>\n<p>k is the stiffness coefficient, x is the displacement relative to the equilibrium position. Elastic potential energy:</p>\n<div class=\"formula\" data-latex=\"E_p=\\tfrac12 kx^2\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">elastic limit</div>\n<p>If the limit is exceeded, plastic deformation will occur and Hooke's law will no longer return to the original point.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Series and parallel</div>\n<p>Two springs in series 1/k=1/k₁+1/k₂; in parallel k=k₁+k₂ (ideal case).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Linear constitutive relations induced by experiments; first-order approximation of interatomic forces in solids under small deformations.</p>\n<ol class=\"steps\">\n<li>Experiment: Force is proportional to elongation in a small range.</li>\n<li>Define k = |F|/|x| and write F=−kx (the negative sign indicates recovery).</li>\n<li>W=∫kx dx → potential energy ½kx².</li>\n</ol>\n", "deep": "\n<p>Generalized Hooke's law describes anisotropic elastic bodies in terms of the stress–strain tensor.</p>\n", "why": "\n<p>An introduction to dynamometers, shock absorption, simple harmonic vibration, and elastic modulus of materials.</p>\n", "try": "\n<ul>\n<li>k=200 N/m, extension 5 cm, elastic force? Potential energy?</li>\n<li>If two identical springs are connected in parallel, how does the equivalent k change?</li>\n</ul>\n"}}}, "title": "hooke's law", "subtitle": "Spring: Tension is proportional to elongation", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "elasticity", "vibration"], "era": "Hooker 1676/1678", "oneLiner": "Within the elastic limit, the spring restoring force F = −kx is proportional to the deformation and opposite in direction.", "people": [{"role": "propose", "name": "Robert Hooker", "years": "1676"}], "sections": {"story": "\n<p>In simplified models of spring balances, trampolines, and molecular bonds, the first step is often Hooke's law: the longer you pull, the harder you pull back—before it breaks.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"F=-kx\"></div>\n<p>k is the stiffness coefficient, x is the displacement relative to the equilibrium position. Elastic potential energy:</p>\n<div class=\"formula\" data-latex=\"E_p=\\tfrac12 kx^2\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">elastic limit</div>\n<p>If the limit is exceeded, plastic deformation will occur and Hooke's law will no longer return to the original point.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Series and parallel</div>\n<p>Two springs in series 1/k=1/k₁+1/k₂; in parallel k=k₁+k₂ (ideal case).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Linear constitutive relations induced by experiments; first-order approximation of interatomic forces in solids under small deformations.</p>\n<ol class=\"steps\">\n<li>Experiment: Force is proportional to elongation in a small range.</li>\n<li>Define k = |F|/|x| and write F=−kx (the negative sign indicates recovery).</li>\n<li>W=∫kx dx → potential energy ½kx².</li>\n</ol>\n", "deep": "\n<p>Generalized Hooke's law describes anisotropic elastic bodies in terms of the stress–strain tensor.</p>\n", "why": "\n<p>An introduction to dynamometers, shock absorption, simple harmonic vibration, and elastic modulus of materials.</p>\n", "try": "\n<ul>\n<li>k=200 N/m, extension 5 cm, elastic force? Potential energy?</li>\n<li>If two identical springs are connected in parallel, how does the equivalent k change?</li>\n</ul>\n"}}, {"id": "shm", "field": "physics", "difficulty": "medium", "emoji": "〰️", "iconClass": "", "related": ["hooke", "newton-laws", "energy-conservation"], "__i18n": {"zh": {"id": "shm", "field": "physics", "title": "简谐运动", "subtitle": "最干净的来回振动", "emoji": "〰️", "iconClass": "", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["力学", "振动", "波动"], "era": "经典力学标准模型", "oneLiner": "加速度与位移成正比反向：x=A cos(ωt+φ)，周期与振幅无关（线性时）。", "people": [{"role": "经典分析", "name": "牛顿、惠更斯等", "years": "17 世纪起"}], "related": ["hooke", "newton-laws", "energy-conservation"], "sections": {"story": "\n          <p>钟摆小角度、弹簧振子，都近似简谐：节奏均匀，能量在动能与势能间倒腾。声波、电路 LC 振荡，数学同构。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"\\ddot{x}+\\omega^2 x=0\"></div>\n          <p>通解：</p>\n          <div class=\"formula\" data-latex=\"x(t)=A\\cos(\\omega t+\\varphi)\"></div>\n          <p>弹簧：<span data-latex=\"\\omega=\\sqrt{k/m}\">ω=√(k/m)</span>；单摆小角：<span data-latex=\"\\omega=\\sqrt{g/\\ell}\">ω=√(g/ℓ)</span>。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">相位与振幅</div>\n            <p>A 振幅，φ 初相，ω 角频率，周期 T=2π/ω。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">能量</div>\n            <p><span data-latex=\"E=\\tfrac12 kA^2=\\tfrac12 m\\omega^2 A^2\">E=½kA²</span> 守恒（无阻尼）。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>胡克力 F=−kx 代入牛顿定律，得到「加速度 = −ω²×位移」，解就是正弦/余弦。</p>\n          <ol class=\"steps\">\n            <li>m ẍ = −kx ⇒ ẍ + (k/m)x = 0。</li>\n            <li>特征方程 λ²+ω²=0，ω=√(k/m)。</li>\n            <li>通解 A cos(ωt+φ)；初值定 A、φ。</li>\n          </ol>\n        ", "deep": "\n          <p>阻尼、驱动、共振：在方程中加 −bẋ 与 F₀ cos ωt，工程减震与收音机调谐都靠它。</p>\n        ", "why": "\n          <p>钟表、地震简化模型、交流电、分子振动近似。</p>\n        ", "try": "\n          <ul>\n            <li>m=0.2 kg，k=50 N/m，求 T。</li>\n            <li>振幅加倍，周期变吗？能量变吗？</li>\n          </ul>\n        "}}, "en": {"id": "shm", "field": "physics", "title": "simple harmonic motion", "subtitle": "The cleanest back and forth vibrations", "emoji": "〰️", "iconClass": "", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["Mechanics", "vibration", "fluctuation"], "era": "standard model of classical mechanics", "oneLiner": "Acceleration is proportional to and inversely proportional to displacement: x=A cos(ωt+φ), and the period has nothing to do with amplitude (when linear).", "people": [{"role": "classic analysis", "name": "Newton, Huygens, etc.", "years": "17th century onwards"}], "related": ["hooke", "newton-laws", "energy-conservation"], "sections": {"story": "\n<p>The small angle of the pendulum and the spring oscillator are all similar to simple harmonics: the rhythm is uniform, and the energy alternates between kinetic energy and potential energy. Sound waves, circuit LC oscillations, mathematical isomorphisms.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\ddot{x}+\\omega^2 x=0\"></div>\n<p>General explanation:</p>\n<div class=\"formula\" data-latex=\"x(t)=A\\cos(\\omega t+\\varphi)\"></div>\n<p>spring:<span data-latex=\"\\omega=\\sqrt{k/m}\">ω=√(k/m)</span>;Single pendulum small angle:<span data-latex=\"\\omega=\\sqrt{g/\\ell}\">ω=√(g/ℓ)</span>。</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Phase and Amplitude</div>\n<p>A amplitude, φ initial phase, ω angular frequency, period T=2π/ω.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">energy</div>\n<p><span data-latex=\"E=\\tfrac12 kA^2=\\tfrac12 m\\omega^2 A^2\">E=½kA²</span> Conservation (no damping).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Substituting Hooke's force F=−kx into Newton's law, we get \"acceleration = −ω²×displacement\", and the solution is sine/cosine.</p>\n<ol class=\"steps\">\n<li>m ẍ = −kx ⇒ ẍ + (k/m)x = 0。</li>\n<li>Characteristic equation λ²+ω²=0, ω=√(k/m).</li>\n<li>The general solution is A cos(ωt+φ); the initial values ​​are A and φ.</li>\n</ol>\n", "deep": "\n<p>Damping, driving, resonance: Add −bẋ and F₀ cos ωt to the equation, which is what engineering damping and radio tuning all depend on.</p>\n", "why": "\n<p>Clocks, simplified models of earthquakes, alternating current, molecular vibration approximations.</p>\n", "try": "\n<ul>\n<li>m=0.2 kg, k=50 N/m, find T.</li>\n<li>If the amplitude doubles, does the period change? Does the energy change?</li>\n</ul>\n"}}}, "title": "simple harmonic motion", "subtitle": "The cleanest back and forth vibrations", "difficultyLabel": "Spend some time thinking", "tags": ["Mechanics", "vibration", "fluctuation"], "era": "standard model of classical mechanics", "oneLiner": "Acceleration is proportional to and inversely proportional to displacement: x=A cos(ωt+φ), and the period has nothing to do with amplitude (when linear).", "people": [{"role": "classic analysis", "name": "Newton, Huygens, etc.", "years": "17th century onwards"}], "sections": {"story": "\n<p>The small angle of the pendulum and the spring oscillator are all similar to simple harmonics: the rhythm is uniform, and the energy alternates between kinetic energy and potential energy. Sound waves, circuit LC oscillations, mathematical isomorphisms.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\ddot{x}+\\omega^2 x=0\"></div>\n<p>General explanation:</p>\n<div class=\"formula\" data-latex=\"x(t)=A\\cos(\\omega t+\\varphi)\"></div>\n<p>spring:<span data-latex=\"\\omega=\\sqrt{k/m}\">ω=√(k/m)</span>;Single pendulum small angle:<span data-latex=\"\\omega=\\sqrt{g/\\ell}\">ω=√(g/ℓ)</span>。</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Phase and Amplitude</div>\n<p>A amplitude, φ initial phase, ω angular frequency, period T=2π/ω.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">energy</div>\n<p><span data-latex=\"E=\\tfrac12 kA^2=\\tfrac12 m\\omega^2 A^2\">E=½kA²</span> Conservation (no damping).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Substituting Hooke's force F=−kx into Newton's law, we get \"acceleration = −ω²×displacement\", and the solution is sine/cosine.</p>\n<ol class=\"steps\">\n<li>m ẍ = −kx ⇒ ẍ + (k/m)x = 0。</li>\n<li>Characteristic equation λ²+ω²=0, ω=√(k/m).</li>\n<li>The general solution is A cos(ωt+φ); the initial values ​​are A and φ.</li>\n</ol>\n", "deep": "\n<p>Damping, driving, resonance: Add −bẋ and F₀ cos ωt to the equation, which is what engineering damping and radio tuning all depend on.</p>\n", "why": "\n<p>Clocks, simplified models of earthquakes, alternating current, molecular vibration approximations.</p>\n", "try": "\n<ul>\n<li>m=0.2 kg, k=50 N/m, find T.</li>\n<li>If the amplitude doubles, does the period change? Does the energy change?</li>\n</ul>\n"}}, {"id": "angular-momentum", "field": "physics", "difficulty": "medium", "emoji": "💫", "iconClass": "warm", "related": ["momentum", "newton-laws", "kepler"], "__i18n": {"zh": {"id": "angular-momentum", "field": "physics", "title": "角动量守恒定律", "subtitle": "转起来的「动量」", "emoji": "💫", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["力学", "转动", "守恒"], "era": "经典力学；开普勒第二定律已隐含", "oneLiner": "对某点合力矩为零时，系统对该点的角动量守恒——花滑收臂转得更快。", "people": [{"role": "体系化", "name": "牛顿力学传统", "years": "17–18 世纪"}], "related": ["momentum", "newton-laws", "kepler"], "sections": {"story": "\n          <p>花滑运动员收臂转速变大，不是魔法，是角动量守恒：转动惯量变小，角速度变大。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"\\vec{L}=\\vec{r}\\times\\vec{p},\\quad \\dfrac{d\\vec{L}}{dt}=\\vec{\\tau}\"></div>\n          <p>若总外力矩 <span data-latex=\"\\vec{\\tau}=0\">τ=0</span>，则 <span data-latex=\"\\vec{L}\">L</span> 守恒。刚体绕固定轴：</p>\n          <div class=\"formula\" data-latex=\"L=I\\omega,\\quad \\tau=I\\alpha\"></div>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">转动惯量 I</div>\n            <p>质量分布对轴的「惰性」：<span data-latex=\"I=\\sum m_i r_i^2\">I=∑m r²</span>（质点组）。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">中心力</div>\n            <p>力始终指向中心 ⇒ 力矩为零 ⇒ 角动量守恒 ⇒ 行星面积定律。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>对 r×(F=dp/dt) 整理，力矩等于角动量变化率；无力矩则 L 不变。</p>\n          <ol class=\"steps\">\n            <li>定义 L=r×p。</li>\n            <li>dL/dt = v×p + r×F = r×F = τ（因 v×(mv)=0）。</li>\n            <li>τ_ext 总=0 ⇒ L 守恒。</li>\n          </ol>\n        ", "deep": "\n          <p>量子里角动量量子化；微观粒子自旋是角动量的新篇章。</p>\n        ", "why": "\n          <p>陀螺定向、卫星姿态、天体自转、工程飞轮。</p>\n        ", "try": "\n          <ul>\n            <li>转椅上伸臂/收臂，转速如何变？</li>\n            <li>为何猫空中能转身落地？（内力矩与形变，总角动量仍守恒。）</li>\n          </ul>\n        "}}, "en": {"id": "angular-momentum", "field": "physics", "title": "law of conservation of angular momentum", "subtitle": "The \"momentum\" that spins up", "emoji": "💫", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["Mechanics", "turn", "conservation"], "era": "Classical mechanics; Kepler's second law is implicit", "oneLiner": "When the resultant moment at a certain point is zero, the angular momentum of the system at that point is conserved - the figure skater's arm turns faster.", "people": [{"role": "Systematization", "name": "Newtonian Mechanics Tradition", "years": "17th–18th century"}], "related": ["momentum", "newton-laws", "kepler"], "sections": {"story": "\n<p>When a figure skater retracts his or her arms, the speed increases. This is not magic, but conservation of angular momentum: the moment of inertia becomes smaller and the angular velocity becomes larger.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\vec{L}=\\vec{r}\\times\\vec{p},\\quad \\dfrac{d\\vec{L}}{dt}=\\vec{\\tau}\"></div>\n<p>If the total external moment <span data-latex=\"\\vec{\\tau}=0\">τ=0</span>,but <span data-latex=\"\\vec{L}\">L</span> Conservation. Rigid body around fixed axis:</p>\n<div class=\"formula\" data-latex=\"L=I\\omega,\\quad \\tau=I\\alpha\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Moment of inertia I</div>\n<p>The \"inertness\" of the mass distribution to the axis:<span data-latex=\"I=\\sum m_i r_i^2\">I=∑m r²</span>(particle group).</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">central force</div>\n<p>Force always points toward center ⇒ Torque is zero ⇒ Angular momentum conserved ⇒ Planetary area law.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Sorting out r×(F=dp/dt), the moment is equal to the rate of change of angular momentum; without moment, L remains unchanged.</p>\n<ol class=\"steps\">\n<li>Define L=r×p.</li>\n<li>dL/dt = v×p + r×F = r×F = τ (since v×(mv)=0).</li>\n<li>τ_ext always=0 ⇒ L is conserved.</li>\n</ol>\n", "deep": "\n<p>In quantum, angular momentum is quantized; microscopic particle spin is a new chapter of angular momentum.</p>\n", "why": "\n<p>Gyro orientation, satellite attitude, celestial body rotation, engineering flywheel.</p>\n", "try": "\n<ul>\n<li>How does the rotational speed change when the arm is extended/retracted on the swivel chair?</li>\n<li>Why can cats turn around and land in the air? (Internal moment and deformation, total angular momentum is still conserved.)</li>\n</ul>\n"}}}, "title": "law of conservation of angular momentum", "subtitle": "The \"momentum\" that spins up", "difficultyLabel": "Spend some time thinking", "tags": ["Mechanics", "turn", "conservation"], "era": "Classical mechanics; Kepler's second law is implicit", "oneLiner": "When the resultant moment at a certain point is zero, the angular momentum of the system at that point is conserved - the figure skater's arm turns faster.", "people": [{"role": "Systematization", "name": "Newtonian Mechanics Tradition", "years": "17th–18th century"}], "sections": {"story": "\n<p>When a figure skater retracts his or her arms, the speed increases. This is not magic, but conservation of angular momentum: the moment of inertia becomes smaller and the angular velocity becomes larger.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\vec{L}=\\vec{r}\\times\\vec{p},\\quad \\dfrac{d\\vec{L}}{dt}=\\vec{\\tau}\"></div>\n<p>If the total external moment <span data-latex=\"\\vec{\\tau}=0\">τ=0</span>,but <span data-latex=\"\\vec{L}\">L</span> Conservation. Rigid body around fixed axis:</p>\n<div class=\"formula\" data-latex=\"L=I\\omega,\\quad \\tau=I\\alpha\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Moment of inertia I</div>\n<p>The \"inertness\" of the mass distribution to the axis:<span data-latex=\"I=\\sum m_i r_i^2\">I=∑m r²</span>(particle group).</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">central force</div>\n<p>Force always points toward center ⇒ Torque is zero ⇒ Angular momentum conserved ⇒ Planetary area law.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Sorting out r×(F=dp/dt), the moment is equal to the rate of change of angular momentum; without moment, L remains unchanged.</p>\n<ol class=\"steps\">\n<li>Define L=r×p.</li>\n<li>dL/dt = v×p + r×F = r×F = τ (since v×(mv)=0).</li>\n<li>τ_ext always=0 ⇒ L is conserved.</li>\n</ol>\n", "deep": "\n<p>In quantum, angular momentum is quantized; microscopic particle spin is a new chapter of angular momentum.</p>\n", "why": "\n<p>Gyro orientation, satellite attitude, celestial body rotation, engineering flywheel.</p>\n", "try": "\n<ul>\n<li>How does the rotational speed change when the arm is extended/retracted on the swivel chair?</li>\n<li>Why can cats turn around and land in the air? (Internal moment and deformation, total angular momentum is still conserved.)</li>\n</ul>\n"}}, {"id": "work-energy", "field": "physics", "difficulty": "easy", "emoji": "💪", "iconClass": "green", "related": ["energy-conservation", "newton-laws", "momentum"], "__i18n": {"zh": {"id": "work-energy", "field": "physics", "title": "动能定理", "subtitle": "功是动能的「存款单」", "emoji": "💪", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["力学", "能量", "功"], "era": "经典力学标准定理", "oneLiner": "合力对物体做的功，等于动能的变化量。", "people": [{"role": "经典表述", "name": "力学传统", "years": "18–19 世纪完善"}], "related": ["energy-conservation", "newton-laws", "momentum"], "sections": {"story": "\n          <p>推箱子加速，你做的功变成它的动能。动能定理不要求力保守，摩擦力做的负功也会写进等式。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"W_{\\mathrm{net}}=\\Delta E_k=\\tfrac12 mv_2^2-\\tfrac12 mv_1^2\"></div>\n          <p>变质量/相对论情形要改写，但低速恒质量下就是这式。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">功</div>\n            <p><span data-latex=\"W=\\int\\vec{F}\\cdot d\\vec{r}\">W=∫F·dr</span>。与位移同向的分力才做正功。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">由牛顿定律导出</div>\n            <p>F=ma=m dv/dt，两边点乘 v dt = dr，积分即得。</p>\n          </div>\n        ", "proof": "\n          <ol class=\"steps\">\n            <li><div class=\"calc-line\" data-latex=\"\\vec{F}\\cdot d\\vec{r}=m\\dfrac{d\\vec{v}}{dt}\\cdot\\vec{v}\\,dt=m\\vec{v}\\cdot d\\vec{v}\"></div></li>\n            <li>积分：<div class=\"calc-line\" data-latex=\"\\int_{1}^{2}\\vec{F}\\cdot d\\vec{r}=\\tfrac12 m v_2^2-\\tfrac12 m v_1^2\"></div></li>\n          </ol>\n          <p class=\"qed\">∎</p>\n        ", "deep": "\n          <p>保守力时 W_c=−ΔE_p，与动能定理合并得机械能守恒。</p>\n        ", "why": "\n          <p>不求中间加速度过程，直接用功算末速度——工程估算利器。</p>\n        ", "try": "\n          <ul>\n            <li>质量 2 kg 物体，合力做功 100 J，动能增加多少？</li>\n            <li>摩擦力做负功时，动能一定减少吗？（看净功。）</li>\n          </ul>\n        "}}, "en": {"id": "work-energy", "field": "physics", "title": "Kinetic energy theorem", "subtitle": "Work is the \"deposit certificate\" of kinetic energy", "emoji": "💪", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "energy", "achievement"], "era": "standard theorem of classical mechanics", "oneLiner": "The work done by the resultant force on the object is equal to the change in kinetic energy.", "people": [{"role": "Classic expression", "name": "mechanics tradition", "years": "Perfected in the 18th–19th centuries"}], "related": ["energy-conservation", "newton-laws", "momentum"], "sections": {"story": "\n<p>Pushing the box accelerates, and the work you do becomes its kinetic energy. The kinetic energy theorem does not require the force to be conservative, and the negative work done by the friction force will also be written into the equation.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"W_{\\mathrm{net}}=\\Delta E_k=\\tfrac12 mv_2^2-\\tfrac12 mv_1^2\"></div>\n<p>The variable mass/relativistic situation needs to be rewritten, but this is the formula at low speed and constant mass.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">achievement</div>\n<p><span data-latex=\"W=\\int\\vec{F}\\cdot d\\vec{r}\">W=∫F·dr</span>. Only the force component in the same direction as the displacement does positive work.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Derived from Newton's laws</div>\n<p>F=ma=m dv/dt, dot product v dt = dr on both sides, and then integrate.</p>\n</div>\n", "proof": "\n<ol class=\"steps\">\n<li><div class=\"calc-line\" data-latex=\"\\vec{F}\\cdot d\\vec{r}=m\\dfrac{d\\vec{v}}{dt}\\cdot\\vec{v}\\,dt=m\\vec{v}\\cdot d\\vec{v}\"></div></li>\n<li>integral:<div class=\"calc-line\" data-latex=\"\\int_{1}^{2}\\vec{F}\\cdot d\\vec{r}=\\tfrac12 m v_2^2-\\tfrac12 m v_1^2\"></div></li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>When W_c=−ΔE_p is a conservative force, it is combined with the kinetic energy theorem to obtain the conservation of mechanical energy.</p>\n", "why": "\n<p>Instead of looking for the intermediate acceleration process, directly calculate the final velocity - a powerful tool for engineering estimation.</p>\n", "try": "\n<ul>\n<li>An object with a mass of 2 kg and a combined force of 100 J of work will increase its kinetic energy by how much?</li>\n<li>When friction does negative work, does kinetic energy necessarily decrease? (Look at the net work.)</li>\n</ul>\n"}}}, "title": "Kinetic energy theorem", "subtitle": "Work is the \"deposit certificate\" of kinetic energy", "difficultyLabel": "Easy to use", "tags": ["Mechanics", "energy", "achievement"], "era": "standard theorem of classical mechanics", "oneLiner": "The work done by the resultant force on the object is equal to the change in kinetic energy.", "people": [{"role": "Classic expression", "name": "mechanics tradition", "years": "Perfected in the 18th–19th centuries"}], "sections": {"story": "\n<p>Pushing the box accelerates, and the work you do becomes its kinetic energy. The kinetic energy theorem does not require the force to be conservative, and the negative work done by the friction force will also be written into the equation.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"W_{\\mathrm{net}}=\\Delta E_k=\\tfrac12 mv_2^2-\\tfrac12 mv_1^2\"></div>\n<p>The variable mass/relativistic situation needs to be rewritten, but this is the formula at low speed and constant mass.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">achievement</div>\n<p><span data-latex=\"W=\\int\\vec{F}\\cdot d\\vec{r}\">W=∫F·dr</span>. Only the force component in the same direction as the displacement does positive work.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Derived from Newton's laws</div>\n<p>F=ma=m dv/dt, dot product v dt = dr on both sides, and then integrate.</p>\n</div>\n", "proof": "\n<ol class=\"steps\">\n<li><div class=\"calc-line\" data-latex=\"\\vec{F}\\cdot d\\vec{r}=m\\dfrac{d\\vec{v}}{dt}\\cdot\\vec{v}\\,dt=m\\vec{v}\\cdot d\\vec{v}\"></div></li>\n<li>integral:<div class=\"calc-line\" data-latex=\"\\int_{1}^{2}\\vec{F}\\cdot d\\vec{r}=\\tfrac12 m v_2^2-\\tfrac12 m v_1^2\"></div></li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>When W_c=−ΔE_p is a conservative force, it is combined with the kinetic energy theorem to obtain the conservation of mechanical energy.</p>\n", "why": "\n<p>Instead of looking for the intermediate acceleration process, directly calculate the final velocity - a powerful tool for engineering estimation.</p>\n", "try": "\n<ul>\n<li>An object with a mass of 2 kg and a combined force of 100 J of work will increase its kinetic energy by how much?</li>\n<li>When friction does negative work, does kinetic energy necessarily decrease? (Look at the net work.)</li>\n</ul>\n"}}, {"id": "ohm", "field": "physics", "difficulty": "easy", "emoji": "🔋", "iconClass": "warm", "related": ["coulomb", "maxwell", "faraday"], "__i18n": {"zh": {"id": "ohm", "field": "physics", "title": "欧姆定律", "subtitle": "电压、电流、电阻", "emoji": "🔋", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["电磁学", "电路", "基础"], "era": "欧姆 1827", "oneLiner": "很多导体上，电流与电压成正比：U=IR；R 由材料与几何决定。", "people": [{"role": "提出", "name": "格奥尔格·欧姆", "years": "1827"}], "related": ["coulomb", "maxwell", "faraday"], "sections": {"story": "\n          <p>电路入门第一式。金属里自由电子在电场下漂移，宏观上常常近似线性——欧姆定律。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"U=IR\\quad\\text{或}\\quad \\vec{J}=\\sigma\\vec{E}\"></div>\n          <p>电阻 <span data-latex=\"R=\\rho \\ell/A\">R=ρℓ/A</span>，ρ 电阻率，σ=1/ρ 电导率。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">欧姆器件 vs 非欧姆</div>\n            <p>二极管、灯丝高温时 I–U 非线性。欧姆定律是材料模型，不是宇宙铁律。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">焦耳热</div>\n            <p>功率 <span data-latex=\"P=UI=I^2 R=U^2/R\">P=UI=I²R</span>（纯电阻）。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>实验上许多金属在恒温下 I∝U；微观上漂移速度 ∝ 电场，导致 J=σE。</p>\n          <ol class=\"steps\">\n            <li>欧姆用热电偶与电流扭秤等装置测 V–I 关系。</li>\n            <li>微观：弛豫时间近似下平均漂移速度 ∝ E，得欧姆形式。</li>\n          </ol>\n        ", "deep": "\n          <p>基尔霍夫电压/电流定律 + 欧姆定律 → 线性电路网络可解。</p>\n        ", "why": "\n          <p>家用电路、电子学入门、电费与发热估算。</p>\n        ", "try": "\n          <ul>\n            <li>U=12 V，R=4 Ω，I 与功率？</li>\n            <li>为何电线要够粗？（R 与发热。）</li>\n          </ul>\n        "}}, "en": {"id": "ohm", "field": "physics", "title": "Ohm's law", "subtitle": "voltage, current, resistance", "emoji": "🔋", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["electromagnetism", "circuit", "Base"], "era": "Ohms 1827", "oneLiner": "On many conductors, the current is proportional to the voltage: U=IR; R is determined by the material and geometry.", "people": [{"role": "propose", "name": "Georg Ohm", "years": "1827"}], "related": ["coulomb", "maxwell", "faraday"], "sections": {"story": "\n<p>The first step in getting started with electrical circuits. Free electrons in metals drift under an electric field, which is often approximately linear on a macro scale - Ohm's law.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"U=IR\\quad\\text{或}\\quad \\vec{J}=\\sigma\\vec{E}\"></div>\n<p>resistance <span data-latex=\"R=\\rho \\ell/A\">R=ρℓ/A</span>, ρ resistivity, σ=1/ρ conductivity.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Ohmic devices vs non-ohmic devices</div>\n<p>I–U nonlinearity occurs when the diode and filament are at high temperatures. Ohm's law is a material model, not an iron law of the universe.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Joule fever</div>\n<p>power <span data-latex=\"P=UI=I^2 R=U^2/R\">P=UI=I²R</span>(pure resistance).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Experimentally, many metals have I∝U at constant temperature; microscopically, the drift velocity is ∝ electric field, resulting in J=σE.</p>\n<ol class=\"steps\">\n<li>Ohm uses a thermocouple and a current torsion scale to measure the V–I relationship.</li>\n<li>Microscopically: the average drift velocity ∝ E under the relaxation time approximation is obtained in ohmic form.</li>\n</ol>\n", "deep": "\n<p>Kirchhoff's Voltage/Current Laws + Ohm's Law → Linear circuit networks can be solved.</p>\n", "why": "\n<p>Household circuits, introduction to electronics, electricity bill and heating estimates.</p>\n", "try": "\n<ul>\n<li>U=12 V, R=4 Ω, I and power?</li>\n<li>Why do wires need to be thick enough? (R and fever.)</li>\n</ul>\n"}}}, "title": "Ohm's law", "subtitle": "voltage, current, resistance", "difficultyLabel": "Easy to use", "tags": ["electromagnetism", "circuit", "Base"], "era": "Ohms 1827", "oneLiner": "On many conductors, the current is proportional to the voltage: U=IR; R is determined by the material and geometry.", "people": [{"role": "propose", "name": "Georg Ohm", "years": "1827"}], "sections": {"story": "\n<p>The first step in getting started with electrical circuits. Free electrons in metals drift under an electric field, which is often approximately linear on a macro scale - Ohm's law.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"U=IR\\quad\\text{或}\\quad \\vec{J}=\\sigma\\vec{E}\"></div>\n<p>resistance <span data-latex=\"R=\\rho \\ell/A\">R=ρℓ/A</span>, ρ resistivity, σ=1/ρ conductivity.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Ohmic devices vs non-ohmic devices</div>\n<p>I–U nonlinearity occurs when the diode and filament are at high temperatures. Ohm's law is a material model, not an iron law of the universe.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Joule fever</div>\n<p>power <span data-latex=\"P=UI=I^2 R=U^2/R\">P=UI=I²R</span>(pure resistance).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Experimentally, many metals have I∝U at constant temperature; microscopically, the drift velocity is ∝ electric field, resulting in J=σE.</p>\n<ol class=\"steps\">\n<li>Ohm uses a thermocouple and a current torsion scale to measure the V–I relationship.</li>\n<li>Microscopically: the average drift velocity ∝ E under the relaxation time approximation is obtained in ohmic form.</li>\n</ol>\n", "deep": "\n<p>Kirchhoff's Voltage/Current Laws + Ohm's Law → Linear circuit networks can be solved.</p>\n", "why": "\n<p>Household circuits, introduction to electronics, electricity bill and heating estimates.</p>\n", "try": "\n<ul>\n<li>U=12 V, R=4 Ω, I and power?</li>\n<li>Why do wires need to be thick enough? (R and fever.)</li>\n</ul>\n"}}, {"id": "lorentz-force", "field": "physics", "difficulty": "medium", "emoji": "🧲", "iconClass": "purple", "related": ["maxwell", "faraday", "coulomb"], "__i18n": {"zh": {"id": "lorentz-force", "field": "physics", "title": "洛伦兹力", "subtitle": "电磁场对电荷的力", "emoji": "🧲", "iconClass": "purple", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["电磁学", "磁场", "运动电荷"], "era": "洛伦兹 19 世纪末综合", "oneLiner": "F = q(E + v×B)：电场沿场推拉，磁场只弯轨迹不改速率。", "people": [{"role": "表述", "name": "亨德里克·洛伦兹", "years": "1895 前后"}], "related": ["maxwell", "faraday", "coulomb"], "sections": {"story": "\n          <p>阴极射线、加速器、地磁场引导宇宙线，都靠「运动电荷在磁场里拐弯」。洛伦兹力把电、磁对电荷的作用写在一起。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"\\vec{F}=q(\\vec{E}+\\vec{v}\\times\\vec{B})\"></div>\n          <p>磁场部分永远垂直速度，不做功；只改方向不改速率（均匀 B、无 E 时圆周/螺旋）。</p>\n          <div class=\"formula\" data-latex=\"r=\\dfrac{mv_{\\perp}}{|q|B}\"></div>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">右手定则</div>\n            <p>正电荷：v、B、F 方向满足右手螺旋（负电荷反向）。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">回旋频率</div>\n            <p><span data-latex=\"\\omega=|q|B/m\">ω=|q|B/m</span>，与速率无关（非相对论）。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>实验总结 + 与麦克斯韦动量/能量一致；磁场力 ∝ qvB sinθ。</p>\n          <ol class=\"steps\">\n            <li>电场力 qE 来自库仑/场定义。</li>\n            <li>运动导线与粒子实验给出磁偏转 ∝ qvB。</li>\n            <li>写成叉乘保证方向与不做功性质。</li>\n          </ol>\n        ", "deep": "\n          <p>相对论形式用四维电磁场张量，力与场变换一致。</p>\n        ", "why": "\n          <p>质谱仪、回旋加速器、霍尔效应、电动机（宏观电流元）。</p>\n        ", "try": "\n          <ul>\n            <li>电子垂直射入匀强 B，轨迹是什么？半径公式？</li>\n            <li>为何磁场不能给带电粒子加速（提高速率）？</li>\n          </ul>\n        "}}, "en": {"id": "lorentz-force", "field": "physics", "title": "Lorentz force", "subtitle": "The force of the electromagnetic field on the charge", "emoji": "🧲", "iconClass": "purple", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["electromagnetism", "magnetic field", "moving charge"], "era": "Lorenz late 19th century synthesis", "oneLiner": "F = q(E + v×B): The electric field pushes and pulls along the field, and the magnetic field only bends the trajectory without changing the speed.", "people": [{"role": "express", "name": "Hendrik Lorenz", "years": "Around 1895"}], "related": ["maxwell", "faraday", "coulomb"], "sections": {"story": "\n<p>Cathode rays, accelerators, and cosmic rays guided by the geomagnetic field all rely on \"moving charges to bend in the magnetic field.\" The Lorentz force combines the effects of electricity and magnetism on electric charges.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\vec{F}=q(\\vec{E}+\\vec{v}\\times\\vec{B})\"></div>\n<p>The magnetic field part is always perpendicular to the speed and does no work; it only changes the direction but not the speed (uniform B, circle/spiral without E).</p>\n<div class=\"formula\" data-latex=\"r=\\dfrac{mv_{\\perp}}{|q|B}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">right hand rule</div>\n<p>Positive charge: v, B, F directions satisfy the right-handed helix (negative charge reverses).</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">gyration frequency</div>\n<p><span data-latex=\"\\omega=|q|B/m\">ω=|q|B/m</span>, independent of velocity (non-relativistic).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Experiment Summary + Consistent with Maxwellian momentum/energy; magnetic force ∝ qvB sinθ.</p>\n<ol class=\"steps\">\n<li>The electric field force qE comes from the Coulomb/field definition.</li>\n<li>Experiments with moving wires and particles give the magnetic deflection ∝ qvB.</li>\n<li>Written as a cross product, the direction and the property of doing no work are guaranteed.</li>\n</ol>\n", "deep": "\n<p>The relativistic form uses a four-dimensional electromagnetic field tensor, and the force and field transformations are consistent.</p>\n", "why": "\n<p>Mass spectrometer, cyclotron, Hall effect, electric motor (macroscopic current element).</p>\n", "try": "\n<ul>\n<li>An electron is injected vertically into uniform intensity B. What is its trajectory? Radius formula?</li>\n<li>Why can't magnetic fields accelerate (increase the speed of) charged particles?</li>\n</ul>\n"}}}, "title": "Lorentz force", "subtitle": "The force of the electromagnetic field on the charge", "difficultyLabel": "Spend some time thinking", "tags": ["electromagnetism", "magnetic field", "moving charge"], "era": "Lorenz late 19th century synthesis", "oneLiner": "F = q(E + v×B): The electric field pushes and pulls along the field, and the magnetic field only bends the trajectory without changing the speed.", "people": [{"role": "express", "name": "Hendrik Lorenz", "years": "Around 1895"}], "sections": {"story": "\n<p>Cathode rays, accelerators, and cosmic rays guided by the geomagnetic field all rely on \"moving charges to bend in the magnetic field.\" The Lorentz force combines the effects of electricity and magnetism on electric charges.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\vec{F}=q(\\vec{E}+\\vec{v}\\times\\vec{B})\"></div>\n<p>The magnetic field part is always perpendicular to the speed and does no work; it only changes the direction but not the speed (uniform B, circle/spiral without E).</p>\n<div class=\"formula\" data-latex=\"r=\\dfrac{mv_{\\perp}}{|q|B}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">right hand rule</div>\n<p>Positive charge: v, B, F directions satisfy the right-handed helix (negative charge reverses).</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">gyration frequency</div>\n<p><span data-latex=\"\\omega=|q|B/m\">ω=|q|B/m</span>, independent of velocity (non-relativistic).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Experiment Summary + Consistent with Maxwellian momentum/energy; magnetic force ∝ qvB sinθ.</p>\n<ol class=\"steps\">\n<li>The electric field force qE comes from the Coulomb/field definition.</li>\n<li>Experiments with moving wires and particles give the magnetic deflection ∝ qvB.</li>\n<li>Written as a cross product, the direction and the property of doing no work are guaranteed.</li>\n</ol>\n", "deep": "\n<p>The relativistic form uses a four-dimensional electromagnetic field tensor, and the force and field transformations are consistent.</p>\n", "why": "\n<p>Mass spectrometer, cyclotron, Hall effect, electric motor (macroscopic current element).</p>\n", "try": "\n<ul>\n<li>An electron is injected vertically into uniform intensity B. What is its trajectory? Radius formula?</li>\n<li>Why can't magnetic fields accelerate (increase the speed of) charged particles?</li>\n</ul>\n"}}, {"id": "ampere", "field": "physics", "difficulty": "medium", "emoji": "⭕", "iconClass": "", "related": ["maxwell", "faraday", "lorentz-force"], "__i18n": {"zh": {"id": "ampere", "field": "physics", "title": "安培定律", "subtitle": "电流周围有磁场", "emoji": "⭕", "iconClass": "", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["电磁学", "磁场", "电流"], "era": "1820 奥斯特；安培；麦克斯韦修正", "oneLiner": "电流产生环绕磁场；积分形式：B 沿闭合路径的环流正比于穿过的电流。", "people": [{"role": "发现电流磁效应", "name": "奥斯特", "years": "1820"}, {"role": "定量规律", "name": "安培", "years": "1820s"}], "related": ["maxwell", "faraday", "lorentz-force"], "sections": {"story": "\n          <p>奥斯特发现通电导线让磁针偏转。安培把它变成可算的定律；麦克斯韦再补位移电流，才有完整波动图景。</p>\n        ", "statement": "\n          <p>磁介质真空、稳恒电流时：</p>\n          <div class=\"formula\" data-latex=\"\\oint \\vec{B}\\cdot d\\vec{\\ell}=\\mu_0 I_{\\mathrm{enc}}\"></div>\n          <p>无限长直导线：</p>\n          <div class=\"formula\" data-latex=\"B=\\dfrac{\\mu_0 I}{2\\pi r}\"></div>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">右手螺旋</div>\n            <p>拇指沿电流，四指环绕方向为 B 线方向。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">对称性</div>\n            <p>用安培环路定理算 B，关键是选对对称路径，使 |B| 恒定、方向与 dl 平行。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>实验 + 毕奥–萨伐尔积分；高对称情形用安培环路更快捷。</p>\n          <ol class=\"steps\">\n            <li>毕奥–萨伐尔：<span data-latex=\"d\\vec{B}\\propto I d\\vec{\\ell}\\times\\hat{r}/r^2\">dB∝Idℓ×r̂/r²</span>。</li>\n            <li>对长直导线积分得 1/r 磁场。</li>\n            <li>抽象为环流形式；麦克斯韦加入位移电流推广到非稳恒。</li>\n          </ol>\n        ", "deep": "\n          <p>螺线管内部 B≈μ₀ n I，电磁铁与 MRI 主磁场的简化起点。</p>\n        ", "why": "\n          <p>电机、电磁铁、无线电力传输的磁场源估算。</p>\n        ", "try": "\n          <ul>\n            <li>电流加倍，距导线同样位置的 B？</li>\n            <li>为何两平行同向电流互相吸引？</li>\n          </ul>\n        "}}, "en": {"id": "ampere", "field": "physics", "title": "Ampere's law", "subtitle": "There is a magnetic field around the current", "emoji": "⭕", "iconClass": "", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["electromagnetism", "magnetic field", "current"], "era": "1820 Oersted; Ampere; Maxwell correction", "oneLiner": "The current produces a surrounding magnetic field; integral form: B The circulating current along a closed path is proportional to the current passing through it.", "people": [{"role": "Discovered the magnetic effect of electric current", "name": "oersted", "years": "1820"}, {"role": "Quantitative rules", "name": "ampere", "years": "1820s"}], "related": ["maxwell", "faraday", "lorentz-force"], "sections": {"story": "\n<p>Oersted discovered that an electrified wire deflected a magnetic needle. Ampere turned it into a calculable law; Maxwell added the displacement current to have a complete wave picture.</p>\n", "statement": "\n<p>When the magnetic medium is in vacuum and constant current:</p>\n<div class=\"formula\" data-latex=\"\\oint \\vec{B}\\cdot d\\vec{\\ell}=\\mu_0 I_{\\mathrm{enc}}\"></div>\n<p>Infinitely long straight wire:</p>\n<div class=\"formula\" data-latex=\"B=\\dfrac{\\mu_0 I}{2\\pi r}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">right hand spiral</div>\n<p>The thumb is along the current and the four fingers are circling in the direction of line B.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">symmetry</div>\n<p>Using Ampere's circuit theorem to calculate B, the key is to choose a symmetrical path so that |B| is constant and the direction is parallel to dl.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Experiment + Biot–Savart integral; faster with Ampere loop for high symmetry cases.</p>\n<ol class=\"steps\">\n<li>Biot-Savart:<span data-latex=\"d\\vec{B}\\propto I d\\vec{\\ell}\\times\\hat{r}/r^2\">dB∝Idℓ×r̂/r²</span>。</li>\n<li>Integrating over a long straight wire gives the 1/r magnetic field.</li>\n<li>The abstraction is in the form of a circulating current; Maxwell adds a displacement current and generalizes it to non-steadiness.</li>\n</ol>\n", "deep": "\n<p>Inside the solenoid B≈μ₀ n I, the simplified starting point for the electromagnet and the main magnetic field of the MRI.</p>\n", "why": "\n<p>Estimation of magnetic field sources for motors, electromagnets, and wireless power transmission.</p>\n", "try": "\n<ul>\n<li>Double the current, B at the same location from the wire?</li>\n<li>Why do two parallel currents in the same direction attract each other?</li>\n</ul>\n"}}}, "title": "Ampere's law", "subtitle": "There is a magnetic field around the current", "difficultyLabel": "Spend some time thinking", "tags": ["electromagnetism", "magnetic field", "current"], "era": "1820 Oersted; Ampere; Maxwell correction", "oneLiner": "The current produces a surrounding magnetic field; integral form: B The circulating current along a closed path is proportional to the current passing through it.", "people": [{"role": "Discovered the magnetic effect of electric current", "name": "oersted", "years": "1820"}, {"role": "Quantitative rules", "name": "ampere", "years": "1820s"}], "sections": {"story": "\n<p>Oersted discovered that an electrified wire deflected a magnetic needle. Ampere turned it into a calculable law; Maxwell added the displacement current to have a complete wave picture.</p>\n", "statement": "\n<p>When the magnetic medium is in vacuum and constant current:</p>\n<div class=\"formula\" data-latex=\"\\oint \\vec{B}\\cdot d\\vec{\\ell}=\\mu_0 I_{\\mathrm{enc}}\"></div>\n<p>Infinitely long straight wire:</p>\n<div class=\"formula\" data-latex=\"B=\\dfrac{\\mu_0 I}{2\\pi r}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">right hand spiral</div>\n<p>The thumb is along the current and the four fingers are circling in the direction of line B.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">symmetry</div>\n<p>Using Ampere's circuit theorem to calculate B, the key is to choose a symmetrical path so that |B| is constant and the direction is parallel to dl.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Experiment + Biot–Savart integral; faster with Ampere loop for high symmetry cases.</p>\n<ol class=\"steps\">\n<li>Biot-Savart:<span data-latex=\"d\\vec{B}\\propto I d\\vec{\\ell}\\times\\hat{r}/r^2\">dB∝Idℓ×r̂/r²</span>。</li>\n<li>Integrating over a long straight wire gives the 1/r magnetic field.</li>\n<li>The abstraction is in the form of a circulating current; Maxwell adds a displacement current and generalizes it to non-steadiness.</li>\n</ol>\n", "deep": "\n<p>Inside the solenoid B≈μ₀ n I, the simplified starting point for the electromagnet and the main magnetic field of the MRI.</p>\n", "why": "\n<p>Estimation of magnetic field sources for motors, electromagnets, and wireless power transmission.</p>\n", "try": "\n<ul>\n<li>Double the current, B at the same location from the wire?</li>\n<li>Why do two parallel currents in the same direction attract each other?</li>\n</ul>\n"}}, {"id": "doppler", "field": "physics", "difficulty": "medium", "emoji": "🚑", "iconClass": "warm", "related": ["snell", "relativity-sr", "photoelectric"], "__i18n": {"zh": {"id": "doppler", "field": "physics", "title": "多普勒效应", "subtitle": "声源靠近时音调变高", "emoji": "🚑", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["波动", "声学", "天文"], "era": "多普勒 1842；声学与光学推广", "oneLiner": "波源或观察者相对介质/彼此运动时，接收频率改变——急救车呼啸而过最直观。", "people": [{"role": "提出", "name": "克里斯蒂安·多普勒", "years": "1842"}], "related": ["snell", "relativity-sr", "photoelectric"], "sections": {"story": "\n          <p>火车驶近笛声尖、驶离笛声沉。天文上星系光谱红移，是多普勒在光上的亲戚（相对论版更精确）。</p>\n        ", "statement": "\n          <p>声波（相对空气）：</p>\n          <div class=\"formula\" data-latex=\"f'=f\\,\\dfrac{v\\pm v_o}{v\\mp v_s}\"></div>\n          <p>分子：观察者向源近取上号，源向观察者近取下号（分母）。光速多普勒（沿视线）：</p>\n          <div class=\"formula\" data-latex=\"f'=f\\sqrt{\\dfrac{1-\\beta}{1+\\beta}}\\quad(\\beta=v/c,\\ \\text{退行})\"></div>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">介质 vs 相对论</div>\n            <p>声需要介质，源与观察者角色不对称；光在真空用相对论公式，只依赖相对速度。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">波长图像</div>\n            <p>源追上自己的波前 → 前方波长变短 → 频率变高。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>数一数单位时间碰到耳膜的波峰个数；运动改变「相遇节奏」。</p>\n          <ol class=\"steps\">\n            <li>静止时 f=v/λ。</li>\n            <li>源运动改变 λ；观察者运动改变相对波速。</li>\n            <li>组合得声多普勒公式；光用洛伦兹变换四维波矢。</li>\n          </ol>\n        ", "deep": "\n          <p>医疗彩超、警察测速雷达、卫星测速、宇宙膨胀红移。</p>\n        ", "why": "\n          <p>日常听觉现象 + 精密测速与天文测距的基础工具。</p>\n        ", "try": "\n          <ul>\n            <li>源向你以 0.1v 靠近（v 声速），频率变为原来的多少？</li>\n            <li>红移与蓝移分别对应靠近还是远离？</li>\n          </ul>\n        "}}, "en": {"id": "doppler", "field": "physics", "title": "Doppler effect", "subtitle": "The pitch becomes higher as the source of sound approaches.", "emoji": "🚑", "iconClass": "warm", "diffic
