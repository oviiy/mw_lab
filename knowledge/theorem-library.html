ulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["fluctuation", "acoustics", "astronomical"], "era": "Doppler 1842; Generalization of Acoustics and Optics", "oneLiner": "When the wave source or observer moves relative to the medium/each other, the received frequency changes - most intuitively when an ambulance roars by.", "people": [{"role": "propose", "name": "Christian Doppler", "years": "1842"}], "related": ["snell", "relativity-sr", "photoelectric"], "sections": {"story": "\n<p>The train approaches and the whistle sounds high, and the train departs with a low whistle. In astronomy, the spectral redshift of galaxies is the optical relative of Doppler (the relativistic version is more accurate).</p>\n", "statement": "\n<p>Sound waves (relative to air):</p>\n<div class=\"formula\" data-latex=\"f'=f\\,\\dfrac{v\\pm v_o}{v\\mp v_s}\"></div>\n<p>Numerator: The closer the observer is to the source, the higher the number. The closer the source is to the observer, the lower number (the denominator). Speed ​​of light Doppler (along the line of sight):</p>\n<div class=\"formula\" data-latex=\"f'=f\\sqrt{\\dfrac{1-\\beta}{1+\\beta}}\\quad(\\beta=v/c,\\ \\text{退行})\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Medium vs Relativity</div>\n<p>Sound requires a medium, and the roles of the source and observer are asymmetric; light uses the formula of relativity in a vacuum and only relies on relative speed.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">wavelength image</div>\n<p>The source catches up with its own wavefront → the wavelength in front becomes shorter → the frequency becomes higher.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Count the number of wave peaks that hit the eardrum per unit time; exercise changes the \"encounter rhythm\".</p>\n<ol class=\"steps\">\n<li>At rest f=v/λ.</li>\n<li>Source motion changes λ; observer motion changes the relative wave speed.</li>\n<li>The combination is the acoustic Doppler formula; light uses Lorentz transformation to transform the four-dimensional wave vector.</li>\n</ol>\n", "deep": "\n<p>Medical color ultrasound, police speed radar, satellite speed measurement, universe expansion red shift.</p>\n", "why": "\n<p>Daily auditory phenomena + basic tools for precision speed measurement and astronomical distance measurement.</p>\n", "try": "\n<ul>\n<li>As the source approaches you at 0.1v (v speed of sound), how much does the frequency change?</li>\n<li>Do red shifts and blue shifts correspond to closer or further away?</li>\n</ul>\n"}}}, "title": "Doppler effect", "subtitle": "The pitch becomes higher as the source of sound approaches.", "difficultyLabel": "Spend some time thinking", "tags": ["fluctuation", "acoustics", "astronomical"], "era": "Doppler 1842; Generalization of Acoustics and Optics", "oneLiner": "When the wave source or observer moves relative to the medium/each other, the received frequency changes - most intuitively when an ambulance roars by.", "people": [{"role": "propose", "name": "Christian Doppler", "years": "1842"}], "sections": {"story": "\n<p>The train approaches and the whistle sounds high, and the train departs with a low whistle. In astronomy, the spectral redshift of galaxies is the optical relative of Doppler (the relativistic version is more accurate).</p>\n", "statement": "\n<p>Sound waves (relative to air):</p>\n<div class=\"formula\" data-latex=\"f'=f\\,\\dfrac{v\\pm v_o}{v\\mp v_s}\"></div>\n<p>Numerator: The closer the observer is to the source, the higher the number. The closer the source is to the observer, the lower number (the denominator). Speed ​​of light Doppler (along the line of sight):</p>\n<div class=\"formula\" data-latex=\"f'=f\\sqrt{\\dfrac{1-\\beta}{1+\\beta}}\\quad(\\beta=v/c,\\ \\text{退行})\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Medium vs Relativity</div>\n<p>Sound requires a medium, and the roles of the source and observer are asymmetric; light uses the formula of relativity in a vacuum and only relies on relative speed.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">wavelength image</div>\n<p>The source catches up with its own wavefront → the wavelength in front becomes shorter → the frequency becomes higher.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Count the number of wave peaks that hit the eardrum per unit time; exercise changes the \"encounter rhythm\".</p>\n<ol class=\"steps\">\n<li>At rest f=v/λ.</li>\n<li>Source motion changes λ; observer motion changes the relative wave speed.</li>\n<li>The combination is the acoustic Doppler formula; light uses Lorentz transformation to transform the four-dimensional wave vector.</li>\n</ol>\n", "deep": "\n<p>Medical color ultrasound, police speed radar, satellite speed measurement, universe expansion red shift.</p>\n", "why": "\n<p>Daily auditory phenomena + basic tools for precision speed measurement and astronomical distance measurement.</p>\n", "try": "\n<ul>\n<li>As the source approaches you at 0.1v (v speed of sound), how much does the frequency change?</li>\n<li>Do red shifts and blue shifts correspond to closer or further away?</li>\n</ul>\n"}}, {"id": "young-slit", "field": "physics", "difficulty": "medium", "emoji": "🌈", "iconClass": "purple", "related": ["snell", "de-broglie", "lens-maker", "maxwell"], "__i18n": {"zh": {"id": "young-slit", "field": "physics", "title": "杨氏双缝干涉", "subtitle": "光是波的铁证之一", "emoji": "🌈", "iconClass": "purple", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["光学", "波动", "量子入门"], "era": "托马斯·杨 1801", "oneLiner": "两束相干光在屏上相长/相消，条纹间距 Δx=λL/d。", "people": [{"role": "实验", "name": "托马斯·杨", "years": "1801"}], "related": ["snell", "de-broglie", "lens-maker", "maxwell"], "sections": {"story": "\n          <p>牛顿偏微粒，杨用双缝打出明暗条纹，波动说大胜。电子双缝更诡异：粒子也「自己和自己干涉」——量子的招牌谜题。</p>\n        ", "statement": "\n          <p>双缝间距 d，屏距 L，波长 λ（L≫d）：</p>\n          <div class=\"formula\" data-latex=\"\\Delta x=\\dfrac{\\lambda L}{d}\"></div>\n          <p>明纹：路径差 δ=mλ；暗纹：δ=(m+½)λ。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">相干</div>\n            <p>两列波频率相同、相位差稳定，才能出稳定干涉图样。通常用同一光源分两缝。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">小角近似</div>\n            <p>路径差 ≈ d sinθ ≈ d x/L，用于推导条纹间距。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>两列波到屏上某点路程不同；差整数个波长就一起波峰，差半个就抵消。</p>\n          <ol class=\"steps\">\n            <li>几何给出路径差 δ=d sinθ。</li>\n            <li>δ=mλ 相长，(m+1/2)λ 相消。</li>\n            <li>θ≈x/L 时相邻明纹间距 λL/d。</li>\n          </ol>\n        ", "deep": "\n          <p>单光子双缝：干涉仍在，但落点一个一个来——波动与粒子统计图景。</p>\n        ", "why": "\n          <p>测波长、薄膜测厚、光栅光谱、量子基础实验。</p>\n        ", "try": "\n          <ul>\n            <li>λ 变大，条纹变疏还是变密？</li>\n            <li>d 变大呢？</li>\n          </ul>\n        "}}, "en": {"id": "young-slit", "field": "physics", "title": "Young's double-slit interference", "subtitle": "One of the ironclad proofs that light is a wave", "emoji": "🌈", "iconClass": "purple", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["Optics", "fluctuation", "Introduction to Quantum"], "era": "Thomas Young 1801", "oneLiner": "Two coherent beams of light are constructive/destructive on the screen, and the fringe spacing is Δx=λL/d.", "people": [{"role": "experiment", "name": "Thomas Young", "years": "1801"}], "related": ["snell", "de-broglie", "lens-maker", "maxwell"], "sections": {"story": "\n<p>Newton was partial to particles, and Yang used double seams to create light and dark stripes. The wave said he won a big victory. The electronic double slit is even weirder: particles also \"interfere with themselves\" - the signature puzzle of quantum.</p>\n", "statement": "\n<p>Double slit spacing d, screen distance L, wavelength λ (L≫d):</p>\n<div class=\"formula\" data-latex=\"\\Delta x=\\dfrac{\\lambda L}{d}\"></div>\n<p>Bright pattern: path difference δ=mλ; dark pattern: δ=(m+½)λ.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">coherent</div>\n<p>Only when the two waves have the same frequency and a stable phase difference can a stable interference pattern be produced. Usually use the same light source to separate two slits.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">small angle approximation</div>\n<p>The path difference ≈ d sinθ ≈ d x/L is used to derive the fringe spacing.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The distances between the two waves to a certain point on the screen are different; if they differ by an integer wavelength, they will peak together, if they differ by half, they will cancel out.</p>\n<ol class=\"steps\">\n<li>Geometry gives the path difference δ=d sinθ.</li>\n<li>δ=mλ is constructive, (m+1/2)λ is destructive.</li>\n<li>When θ≈x/L, the distance between adjacent clear lines is λL/d.</li>\n</ol>\n", "deep": "\n<p>Single photon double slit: interference is still there, but the impact points come one by one - the statistical picture of waves and particles.</p>\n", "why": "\n<p>Measure wavelength, film thickness, grating spectrum, and quantum basic experiments.</p>\n", "try": "\n<ul>\n<li>As λ becomes larger, do the stripes become sparser or denser?</li>\n<li>d becomes bigger?</li>\n</ul>\n"}}}, "title": "Young's double-slit interference", "subtitle": "One of the ironclad proofs that light is a wave", "difficultyLabel": "Spend some time thinking", "tags": ["Optics", "fluctuation", "Introduction to Quantum"], "era": "Thomas Young 1801", "oneLiner": "Two coherent beams of light are constructive/destructive on the screen, and the fringe spacing is Δx=λL/d.", "people": [{"role": "experiment", "name": "Thomas Young", "years": "1801"}], "sections": {"story": "\n<p>Newton was partial to particles, and Yang used double seams to create light and dark stripes. The wave said he won a big victory. The electronic double slit is even weirder: particles also \"interfere with themselves\" - the signature puzzle of quantum.</p>\n", "statement": "\n<p>Double slit spacing d, screen distance L, wavelength λ (L≫d):</p>\n<div class=\"formula\" data-latex=\"\\Delta x=\\dfrac{\\lambda L}{d}\"></div>\n<p>Bright pattern: path difference δ=mλ; dark pattern: δ=(m+½)λ.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">coherent</div>\n<p>Only when the two waves have the same frequency and a stable phase difference can a stable interference pattern be produced. Usually use the same light source to separate two slits.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">small angle approximation</div>\n<p>The path difference ≈ d sinθ ≈ d x/L is used to derive the fringe spacing.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The distances between the two waves to a certain point on the screen are different; if they differ by an integer wavelength, they will peak together, if they differ by half, they will cancel out.</p>\n<ol class=\"steps\">\n<li>Geometry gives the path difference δ=d sinθ.</li>\n<li>δ=mλ is constructive, (m+1/2)λ is destructive.</li>\n<li>When θ≈x/L, the distance between adjacent clear lines is λL/d.</li>\n</ol>\n", "deep": "\n<p>Single photon double slit: interference is still there, but the impact points come one by one - the statistical picture of waves and particles.</p>\n", "why": "\n<p>Measure wavelength, film thickness, grating spectrum, and quantum basic experiments.</p>\n", "try": "\n<ul>\n<li>As λ becomes larger, do the stripes become sparser or denser?</li>\n<li>d becomes bigger?</li>\n</ul>\n"}}, {"id": "de-broglie", "field": "physics", "difficulty": "medium", "emoji": "🌊", "iconClass": "rose", "related": ["photoelectric", "planck", "uncertainty", "schrodinger"], "__i18n": {"zh": {"id": "de-broglie", "field": "physics", "title": "德布罗意波", "subtitle": "粒子也有波长", "emoji": "🌊", "iconClass": "rose", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["量子", "物质波", "基础"], "era": "1924 德布罗意；电子衍射证实", "oneLiner": "动量为 p 的粒子对应波长 λ=h/p——电子也能衍射。", "people": [{"role": "提出", "name": "路易·德布罗意", "years": "1924"}, {"role": "电子衍射", "name": "戴维逊–革末等", "years": "1927"}], "related": ["photoelectric", "planck", "uncertainty", "schrodinger"], "sections": {"story": "\n          <p>光既是波也是粒子。德布罗意大胆反问：电子会不会也是波？几年后电子晶体衍射证明：是。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"\\lambda=\\dfrac{h}{p}=\\dfrac{h}{mv}\\quad(\\text{非相对论})\"></div>\n          <p>同时 <span data-latex=\"E=h\\nu\">E=hν</span> 对物质波同样讨论（与色散关系相连）。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">宏观为何看不见</div>\n            <p>人、足球动量大，λ 小到无法察觉；电子、中子刚好合适做波动实验。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">玻尔轨道</div>\n            <p>早期图像：轨道周长 = nλ，与角动量量子化一致（启发性，非最终理论）。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>对称性猜测 + 实验证实；理论地位由量子力学波函数巩固。</p>\n          <ol class=\"steps\">\n            <li>类比光子 p=h/λ，提出物质 λ=h/p。</li>\n            <li>电子束打晶体出现衍射峰，符合布拉格条件与 λ=h/p。</li>\n          </ol>\n        ", "deep": "\n          <p>薛定谔波动力学把「物质波」写成波函数演化方程。</p>\n        ", "why": "\n          <p>电子显微镜、中子散射、量子技术的概念基础。</p>\n        ", "try": "\n          <ul>\n            <li>估 1 eV 电子的德布罗意波长数量级。</li>\n            <li>为何棒球波长不可测？</li>\n          </ul>\n        "}}, "en": {"id": "de-broglie", "field": "physics", "title": "de Broglie wave", "subtitle": "Particles also have wavelengths", "emoji": "🌊", "iconClass": "rose", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["quantum", "matter wave", "Base"], "era": "1924 de Broglie; confirmed by electron diffraction", "oneLiner": "A particle with momentum p corresponds to a wavelength λ=h/p - electrons can also diffract.", "people": [{"role": "propose", "name": "Louis de Broglie", "years": "1924"}, {"role": "electron diffraction", "name": "Davidson-Germer et al.", "years": "1927"}], "related": ["photoelectric", "planck", "uncertainty", "schrodinger"], "sections": {"story": "\n<p>Light is both a wave and a particle. De Broglie boldly asked: Can electrons also be waves? A few years later, electron crystal diffraction proved: yes.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\lambda=\\dfrac{h}{p}=\\dfrac{h}{mv}\\quad(\\text{非相对论})\"></div>\n<p>at the same time <span data-latex=\"E=h\\nu\">E=hν</span> The same is discussed for matter waves (connected to the dispersion relation).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Why can’t we see the macro?</div>\n<p>People and footballs have large momentum, but λ is too small to be detected; electrons and neutrons are just suitable for wave experiments.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">bohr orbit</div>\n<p>Early image: Orbital circumference = nλ, consistent with angular momentum quantization (heuristic, not final theory).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Symmetry guesses + experimental confirmations; theoretical status solidified by quantum mechanical wave functions.</p>\n<ol class=\"steps\">\n<li>By analogy with photon p=h/λ, it is proposed that matter λ=h/p.</li>\n<li>When the electron beam hits the crystal, diffraction peaks appear, which conforms to Bragg conditions and λ=h/p.</li>\n</ol>\n", "deep": "\n<p>Schrödinger wave mechanics writes \"matter waves\" as wave function evolution equations.</p>\n", "why": "\n<p>Conceptual foundations of electron microscopy, neutron scattering, and quantum technologies.</p>\n", "try": "\n<ul>\n<li>Estimate the order of magnitude of the de Broglie wavelength for a 1 eV electron.</li>\n<li>Why is baseball's wavelength unmeasurable?</li>\n</ul>\n"}}}, "title": "de Broglie wave", "subtitle": "Particles also have wavelengths", "difficultyLabel": "Spend some time thinking", "tags": ["quantum", "matter wave", "Base"], "era": "1924 de Broglie; confirmed by electron diffraction", "oneLiner": "A particle with momentum p corresponds to a wavelength λ=h/p - electrons can also diffract.", "people": [{"role": "propose", "name": "Louis de Broglie", "years": "1924"}, {"role": "electron diffraction", "name": "Davidson-Germer et al.", "years": "1927"}], "sections": {"story": "\n<p>Light is both a wave and a particle. De Broglie boldly asked: Can electrons also be waves? A few years later, electron crystal diffraction proved: yes.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\lambda=\\dfrac{h}{p}=\\dfrac{h}{mv}\\quad(\\text{非相对论})\"></div>\n<p>at the same time <span data-latex=\"E=h\\nu\">E=hν</span> The same is discussed for matter waves (connected to the dispersion relation).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Why can’t we see the macro?</div>\n<p>People and footballs have large momentum, but λ is too small to be detected; electrons and neutrons are just suitable for wave experiments.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">bohr orbit</div>\n<p>Early image: Orbital circumference = nλ, consistent with angular momentum quantization (heuristic, not final theory).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Symmetry guesses + experimental confirmations; theoretical status solidified by quantum mechanical wave functions.</p>\n<ol class=\"steps\">\n<li>By analogy with photon p=h/λ, it is proposed that matter λ=h/p.</li>\n<li>When the electron beam hits the crystal, diffraction peaks appear, which conforms to Bragg conditions and λ=h/p.</li>\n</ol>\n", "deep": "\n<p>Schrödinger wave mechanics writes \"matter waves\" as wave function evolution equations.</p>\n", "why": "\n<p>Conceptual foundations of electron microscopy, neutron scattering, and quantum technologies.</p>\n", "try": "\n<ul>\n<li>Estimate the order of magnitude of the de Broglie wavelength for a 1 eV electron.</li>\n<li>Why is baseball's wavelength unmeasurable?</li>\n</ul>\n"}}, {"id": "schrodinger", "field": "physics", "difficulty": "hard", "emoji": "Ψ", "iconClass": "purple", "related": ["de-broglie", "uncertainty", "planck"], "__i18n": {"zh": {"id": "schrodinger", "field": "physics", "title": "薛定谔方程", "subtitle": "量子态如何随时间变", "emoji": "Ψ", "iconClass": "purple", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["量子", "波函数", "基础方程"], "era": "1926 薛定谔", "oneLiner": "波函数 ψ 的演化方程；|ψ|² 给出找到粒子的概率密度。", "people": [{"role": "提出", "name": "埃尔温·薛定谔", "years": "1926"}], "related": ["de-broglie", "uncertainty", "planck"], "sections": {"story": "\n          <p>海森堡矩阵力学难直觉，薛定谔写出波动方程，氢原子能级像琴弦泛音一样算出来——量子力学两种语言随后被证明等价。</p>\n        ", "statement": "\n          <p>含时薛定谔方程：</p>\n          <div class=\"formula\" data-latex=\"i\\hbar\\dfrac{\\partial\\psi}{\\partial t}=\\hat{H}\\psi\"></div>\n          <p>一维非相对论定态：</p>\n          <div class=\"formula\" data-latex=\"-\\dfrac{\\hbar^2}{2m}\\dfrac{d^2\\psi}{dx^2}+V(x)\\psi=E\\psi\"></div>\n          <p>玻恩规则：<span data-latex=\"|\\psi|^2\">|ψ|²</span> 为概率密度。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">算符</div>\n            <p>动量 <span data-latex=\"\\hat{p}=-i\\hbar\\nabla\">p̂=−iℏ∇</span>，哈密顿 <span data-latex=\"\\hat{H}=\\hat{p}^2/2m+V\">Ĥ</span>。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">定态</div>\n            <p>能量本征态时间部分 e^{−iEt/ℏ}，概率密度不随时间变。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>方程本身是公设级；由经典色散关系 + 算符对应启发，靠实验与数学自洽立足。</p>\n          <ol class=\"steps\">\n            <li>从 E=p²/2m+V 与 E=ℏω、p=ℏk 想到波动方程形式。</li>\n            <li>定态解给出量子化能级（如无限深阱、氢原子）。</li>\n            <li>与光谱、隧道效应等实验一致。</li>\n          </ol>\n        ", "deep": "\n          <p>狄拉克方程是相对论电子版；量子场论进一步量子化场本身。</p>\n        ", "why": "\n          <p>化学键、半导体、激光、量子计算——微观世界的动力学语法。</p>\n        ", "try": "\n          <ul>\n            <li>一维无限深阱能级 E_n∝n²，n=1,2,3… 意味着什么？</li>\n            <li>|ψ|² 积分为 1 叫什么条件？</li>\n          </ul>\n        "}}, "en": {"id": "schrodinger", "field": "physics", "title": "Schrödinger equation", "subtitle": "How quantum states change over time", "emoji": "Ψ", "iconClass": "purple", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["quantum", "wave function", "basic equations"], "era": "1926 Schrödinger", "oneLiner": "The evolution equation of the wave function ψ; |ψ|² gives the probability density of finding the particle.", "people": [{"role": "propose", "name": "Erwin Schrödinger", "years": "1926"}], "related": ["de-broglie", "uncertainty", "planck"], "sections": {"story": "\n<p>Heisenberg matrix mechanics is difficult to intuit, Schrödinger wrote the wave equation, and the energy levels of hydrogen atoms were calculated like the overtones of a string - the two languages ​​​​of quantum mechanics were later proven to be equivalent.</p>\n", "statement": "\n<p>Time-dependent Schrödinger equation:</p>\n<div class=\"formula\" data-latex=\"i\\hbar\\dfrac{\\partial\\psi}{\\partial t}=\\hat{H}\\psi\"></div>\n<p>One-dimensional non-relativistic stationary state:</p>\n<div class=\"formula\" data-latex=\"-\\dfrac{\\hbar^2}{2m}\\dfrac{d^2\\psi}{dx^2}+V(x)\\psi=E\\psi\"></div>\n<p>Born's rule:<span data-latex=\"|\\psi|^2\">|ψ|²</span> is the probability density.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">operator</div>\n<p>momentum <span data-latex=\"\\hat{p}=-i\\hbar\\nabla\">p̂=−iℏ∇</span>, Hamilton <span data-latex=\"\\hat{H}=\\hat{p}^2/2m+V\">Ĥ</span>。</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">steady state</div>\n<p>The time part of the energy eigenstate e^{−iEt/ℏ}, the probability density does not change with time.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The equation itself is of postulate level; inspired by the classical dispersion relation + operator correspondence, it is self-consistent based on experiments and mathematics.</p>\n<ol class=\"steps\">\n<li>Think of the wave equation form from E=p²/2m+V and E=ℏω, p=ℏk.</li>\n<li>Stationary solutions give quantized energy levels (e.g. infinitely deep wells, hydrogen atoms).</li>\n<li>It is consistent with experiments such as spectrum and tunnel effect.</li>\n</ol>\n", "deep": "\n<p>Dirac's equations are the electronic version of relativity; quantum field theory further quantizes the fields themselves.</p>\n", "why": "\n<p>Chemical bonds, semiconductors, lasers, quantum computing—the dynamic grammar of the microscopic world.</p>\n", "try": "\n<ul>\n<li>What does the one-dimensional infinite deep well energy level E_n∝n², n=1,2,3… mean?</li>\n<li>|ψ|² What is the condition for the integral to be 1?</li>\n</ul>\n"}}}, "title": "Schrödinger equation", "subtitle": "How quantum states change over time", "difficultyLabel": "Hardcore challenge", "tags": ["quantum", "wave function", "basic equations"], "era": "1926 Schrödinger", "oneLiner": "The evolution equation of the wave function ψ; |ψ|² gives the probability density of finding the particle.", "people": [{"role": "propose", "name": "Erwin Schrödinger", "years": "1926"}], "sections": {"story": "\n<p>Heisenberg matrix mechanics is difficult to intuit, Schrödinger wrote the wave equation, and the energy levels of hydrogen atoms were calculated like the overtones of a string - the two languages ​​​​of quantum mechanics were later proven to be equivalent.</p>\n", "statement": "\n<p>Time-dependent Schrödinger equation:</p>\n<div class=\"formula\" data-latex=\"i\\hbar\\dfrac{\\partial\\psi}{\\partial t}=\\hat{H}\\psi\"></div>\n<p>One-dimensional non-relativistic stationary state:</p>\n<div class=\"formula\" data-latex=\"-\\dfrac{\\hbar^2}{2m}\\dfrac{d^2\\psi}{dx^2}+V(x)\\psi=E\\psi\"></div>\n<p>Born's rule:<span data-latex=\"|\\psi|^2\">|ψ|²</span> is the probability density.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">operator</div>\n<p>momentum <span data-latex=\"\\hat{p}=-i\\hbar\\nabla\">p̂=−iℏ∇</span>, Hamilton <span data-latex=\"\\hat{H}=\\hat{p}^2/2m+V\">Ĥ</span>。</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">steady state</div>\n<p>The time part of the energy eigenstate e^{−iEt/ℏ}, the probability density does not change with time.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The equation itself is of postulate level; inspired by the classical dispersion relation + operator correspondence, it is self-consistent based on experiments and mathematics.</p>\n<ol class=\"steps\">\n<li>Think of the wave equation form from E=p²/2m+V and E=ℏω, p=ℏk.</li>\n<li>Stationary solutions give quantized energy levels (e.g. infinitely deep wells, hydrogen atoms).</li>\n<li>It is consistent with experiments such as spectrum and tunnel effect.</li>\n</ol>\n", "deep": "\n<p>Dirac's equations are the electronic version of relativity; quantum field theory further quantizes the fields themselves.</p>\n", "why": "\n<p>Chemical bonds, semiconductors, lasers, quantum computing—the dynamic grammar of the microscopic world.</p>\n", "try": "\n<ul>\n<li>What does the one-dimensional infinite deep well energy level E_n∝n², n=1,2,3… mean?</li>\n<li>|ψ|² What is the condition for the integral to be 1?</li>\n</ul>\n"}}, {"id": "stefan-boltzmann", "field": "physics", "difficulty": "medium", "emoji": "☀️", "iconClass": "warm", "related": ["planck", "thermo-2", "ideal-gas"], "__i18n": {"zh": {"id": "stefan-boltzmann", "field": "physics", "title": "斯特藩–玻尔兹曼定律", "subtitle": "热辐射功率 ∝ T⁴", "emoji": "☀️", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["热辐射", "黑体", "天体物理"], "era": "斯特藩 1879；玻尔兹曼理论推导", "oneLiner": "黑体单位时间单位面积辐射能量 j*=σT⁴，温度稍微升高，辐射猛增。", "people": [{"role": "经验", "name": "约瑟夫·斯特藩", "years": "1879"}, {"role": "理论", "name": "路德维希·玻尔兹曼", "years": "1884"}], "related": ["planck", "thermo-2", "ideal-gas"], "sections": {"story": "\n          <p>为什么恒星表面温度差一倍，亮度差得不是一倍而是十六倍量级？T⁴ 定律。地球能量平衡、红外遥感都用它。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"j^{\\star}=\\sigma T^4\"></div>\n          <p>σ≈5.67×10⁻⁸ W·m⁻²·K⁻⁴。灰体再乘发射率 ε≤1。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">黑体</div>\n            <p>理想吸收体/辐射体。普朗克公式对频率积分就得到 σT⁴。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">热力学推导梗概</div>\n            <p>玻尔兹曼用电磁辐射压与卡诺循环思想导出 u∝T⁴（能量密度），再联系通量。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>实验先看见 T⁴；理论从热力学 + 辐射压，或从普朗克光谱积分得到。</p>\n          <ol class=\"steps\">\n            <li>测量不同温度黑体总辐射 → 拟合 T⁴。</li>\n            <li>对普朗克能谱积分 ∫B_ν dν ∝ T⁴，定义 σ。</li>\n          </ol>\n        ", "deep": "\n          <p>维恩位移律 λ_max T=const 描述「峰值颜色」随温度移动。</p>\n        ", "why": "\n          <p>气候模型、恒星光度、热成像、白炽灯效率直觉。</p>\n        ", "try": "\n          <ul>\n            <li>T 从 300 K 到 600 K，辐射功率密度变为几倍？</li>\n            <li>人皮肤约 300 K，为何主要是红外？</li>\n          </ul>\n        "}}, "en": {"id": "stefan-boltzmann", "field": "physics", "title": "Stefan-Boltzmann law", "subtitle": "Thermal radiation power ∝ T⁴", "emoji": "☀️", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["thermal radiation", "black body", "astrophysics"], "era": "Stefan 1879; derivation of Boltzmann's theory", "oneLiner": "The radiation energy of a black body per unit area per unit time is j*=σT⁴. When the temperature increases slightly, the radiation increases sharply.", "people": [{"role": "experience", "name": "joseph stefan", "years": "1879"}, {"role": "theory", "name": "Ludwig Boltzmann", "years": "1884"}], "related": ["planck", "thermo-2", "ideal-gas"], "sections": {"story": "\n<p>Why is the star's surface temperature not twice as bright but sixteen times as bright? T⁴ law. It is used in earth energy balance and infrared remote sensing.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"j^{\\star}=\\sigma T^4\"></div>\n<p>σ≈5.67×10⁻⁸ W·m⁻²·K⁻⁴. The gray body is multiplied by the emissivity ε≤1.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">black body</div>\n<p>Ideal absorber/radiator. Integrating Planck's formula over frequency gives σT⁴.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Summary of thermodynamic derivation</div>\n<p>Boltzmann used electromagnetic radiation pressure and Carnot cycle ideas to derive u∝T⁴ (energy density), and then related it to flux.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Experiments first see T⁴; theory is derived from thermodynamics + radiation pressure, or from the integration of the Planck spectrum.</p>\n<ol class=\"steps\">\n<li>Measure total blackbody radiation at different temperatures → fit T⁴.</li>\n<li>Integrating the Planck energy spectrum ∫B_ν dν ∝ T⁴ defines σ.</li>\n</ol>\n", "deep": "\n<p>Wien's displacement law λ_max T=const describes the movement of \"peak color\" with temperature.</p>\n", "why": "\n<p>Climate models, stellar luminosity, thermal imaging, incandescent lamp efficiency intuition.</p>\n", "try": "\n<ul>\n<li>How many times does the radiation power density change from 300 K to 600 K?</li>\n<li>Human skin is about 300 K, why is it mainly infrared?</li>\n</ul>\n"}}}, "title": "Stefan-Boltzmann law", "subtitle": "Thermal radiation power ∝ T⁴", "difficultyLabel": "Spend some time thinking", "tags": ["thermal radiation", "black body", "astrophysics"], "era": "Stefan 1879; derivation of Boltzmann's theory", "oneLiner": "The radiation energy of a black body per unit area per unit time is j*=σT⁴. When the temperature increases slightly, the radiation increases sharply.", "people": [{"role": "experience", "name": "joseph stefan", "years": "1879"}, {"role": "theory", "name": "Ludwig Boltzmann", "years": "1884"}], "sections": {"story": "\n<p>Why is the star's surface temperature not twice as bright but sixteen times as bright? T⁴ law. It is used in earth energy balance and infrared remote sensing.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"j^{\\star}=\\sigma T^4\"></div>\n<p>σ≈5.67×10⁻⁸ W·m⁻²·K⁻⁴. The gray body is multiplied by the emissivity ε≤1.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">black body</div>\n<p>Ideal absorber/radiator. Integrating Planck's formula over frequency gives σT⁴.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Summary of thermodynamic derivation</div>\n<p>Boltzmann used electromagnetic radiation pressure and Carnot cycle ideas to derive u∝T⁴ (energy density), and then related it to flux.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Experiments first see T⁴; theory is derived from thermodynamics + radiation pressure, or from the integration of the Planck spectrum.</p>\n<ol class=\"steps\">\n<li>Measure total blackbody radiation at different temperatures → fit T⁴.</li>\n<li>Integrating the Planck energy spectrum ∫B_ν dν ∝ T⁴ defines σ.</li>\n</ol>\n", "deep": "\n<p>Wien's displacement law λ_max T=const describes the movement of \"peak color\" with temperature.</p>\n", "why": "\n<p>Climate models, stellar luminosity, thermal imaging, incandescent lamp efficiency intuition.</p>\n", "try": "\n<ul>\n<li>How many times does the radiation power density change from 300 K to 600 K?</li>\n<li>Human skin is about 300 K, why is it mainly infrared?</li>\n</ul>\n"}}, {"id": "compton", "field": "physics", "difficulty": "hard", "emoji": "💥", "iconClass": "rose", "related": ["photoelectric", "planck", "relativity-sr", "de-broglie"], "__i18n": {"zh": {"id": "compton", "field": "physics", "title": "康普顿散射", "subtitle": "光子打电子：波长变长", "emoji": "💥", "iconClass": "rose", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["量子", "光子", "相对论"], "era": "康普顿 1923", "oneLiner": "X 射线被电子散射后波长变长，改变量只与散射角有关——光子带着动量 h/λ。", "people": [{"role": "实验与解释", "name": "阿瑟·康普顿", "years": "1923（诺奖 1927）"}], "related": ["photoelectric", "planck", "relativity-sr", "de-broglie"], "sections": {"story": "\n          <p>若光只是波，散射波长不该这么改。康普顿把光子当粒子，与电子做相对论碰撞，完美解释——光有动量。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"\\Delta\\lambda=\\lambda'-\\lambda=\\dfrac{h}{m_e c}(1-\\cos\\theta)\"></div>\n          <p>h/(m_e c) 称康普顿波长（电子）。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">光子四动量</div>\n            <p>E=pc=hc/λ；与电子能量动量守恒联立求解。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">守恒</div>\n            <p>碰撞：能量守恒 + 动量守恒（二维分量）。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>光子撞静止电子，把自己一部分能量给电子，自己波长变长； confer 角越大，丢能越多。</p>\n          <ol class=\"steps\">\n            <li>写光子 E、p 与电子相对论能量。</li>\n            <li>守恒方程消去电子反冲动量。</li>\n            <li>得 Δλ 公式，与 θ 相关、与入射强度无关。</li>\n            <li>实验测不同角度的波长移动验证。</li>\n          </ol>\n        ", "deep": "\n          <p>与光电效应一起，把「光子」从假说变成标准粒子图像。</p>\n        ", "why": "\n          <p>辐射剂量、天体 X 射线、粒子物理散射的教学样板。</p>\n        ", "try": "\n          <ul>\n            <li>θ=90° 时 Δλ 等于多少（用康普顿波长）？</li>\n            <li>θ=0 时为何 Δλ=0？</li>\n          </ul>\n        "}}, "en": {"id": "compton", "field": "physics", "title": "Compton scattering", "subtitle": "Photon hits electron: wavelength becomes longer", "emoji": "💥", "iconClass": "rose", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["quantum", "Photon", "relativity"], "era": "Compton 1923", "oneLiner": "The wavelength of X-rays becomes longer after being scattered by electrons, and the change is only related to the scattering angle - the photon carries momentum h/λ.", "people": [{"role": "Experiments and explanations", "name": "Arthur Compton", "years": "1923 (Nobel Prize 1927)"}], "related": ["photoelectric", "planck", "relativity-sr", "de-broglie"], "sections": {"story": "\n<p>If light were just waves, the scattering wavelength should not change like this. Compton regarded photons as particles, relativistically colliding with electrons, and perfectly explained that light has momentum.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\Delta\\lambda=\\lambda'-\\lambda=\\dfrac{h}{m_e c}(1-\\cos\\theta)\"></div>\n<p>h/(m_e c) is called Compton wavelength (electron).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Photon four momentum</div>\n<p>E=pc=hc/λ; solved simultaneously with the conservation of electron energy and momentum.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">conservation</div>\n<p>Collision: Conservation of energy + conservation of momentum (two-dimensional component).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>When a photon hits a stationary electron, it gives part of its energy to the electron, and its wavelength becomes longer; the larger the confer angle, the more energy is lost.</p>\n<ol class=\"steps\">\n<li>Write photon E, p and electron relativistic energy.</li>\n<li>The conservation equation eliminates the electron recoil momentum.</li>\n<li>Obtain the Δλ formula, which is related to θ and has nothing to do with the incident intensity.</li>\n<li>Experimentally measure the wavelength shift at different angles for verification.</li>\n</ol>\n", "deep": "\n<p>Together with the photoelectric effect, \"photons\" are transformed from a hypothesis into a standard particle image.</p>\n", "why": "\n<p>Teaching samples for radiation dose, celestial X-rays, and particle physics scattering.</p>\n", "try": "\n<ul>\n<li>What is Δλ equal to (in Compton wavelength) when θ=90°?</li>\n<li>Why Δλ=0 when θ=0?</li>\n</ul>\n"}}}, "title": "Compton scattering", "subtitle": "Photon hits electron: wavelength becomes longer", "difficultyLabel": "Hardcore challenge", "tags": ["quantum", "Photon", "relativity"], "era": "Compton 1923", "oneLiner": "The wavelength of X-rays becomes longer after being scattered by electrons, and the change is only related to the scattering angle - the photon carries momentum h/λ.", "people": [{"role": "Experiments and explanations", "name": "Arthur Compton", "years": "1923 (Nobel Prize 1927)"}], "sections": {"story": "\n<p>If light were just waves, the scattering wavelength should not change like this. Compton regarded photons as particles, relativistically colliding with electrons, and perfectly explained that light has momentum.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\Delta\\lambda=\\lambda'-\\lambda=\\dfrac{h}{m_e c}(1-\\cos\\theta)\"></div>\n<p>h/(m_e c) is called Compton wavelength (electron).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Photon four momentum</div>\n<p>E=pc=hc/λ; solved simultaneously with the conservation of electron energy and momentum.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">conservation</div>\n<p>Collision: Conservation of energy + conservation of momentum (two-dimensional component).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>When a photon hits a stationary electron, it gives part of its energy to the electron, and its wavelength becomes longer; the larger the confer angle, the more energy is lost.</p>\n<ol class=\"steps\">\n<li>Write photon E, p and electron relativistic energy.</li>\n<li>The conservation equation eliminates the electron recoil momentum.</li>\n<li>Obtain the Δλ formula, which is related to θ and has nothing to do with the incident intensity.</li>\n<li>Experimentally measure the wavelength shift at different angles for verification.</li>\n</ol>\n", "deep": "\n<p>Together with the photoelectric effect, \"photons\" are transformed from a hypothesis into a standard particle image.</p>\n", "why": "\n<p>Teaching samples for radiation dose, celestial X-rays, and particle physics scattering.</p>\n", "try": "\n<ul>\n<li>What is Δλ equal to (in Compton wavelength) when θ=90°?</li>\n<li>Why Δλ=0 when θ=0?</li>\n</ul>\n"}}, {"id": "pascal", "field": "physics", "difficulty": "easy", "emoji": "🔧", "iconClass": "green", "related": ["archimedes", "newton-laws", "bernoulli"], "__i18n": {"zh": {"id": "pascal", "field": "physics", "title": "帕斯卡原理", "subtitle": "密闭液体：压强会原样传递", "emoji": "🔧", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["流体", "压强", "机械"], "era": "布莱兹·帕斯卡 17 世纪", "oneLiner": "密闭静止流体中，外加压强大小不变地向各个方向传递。", "people": [{"role": "提出", "name": "布莱兹·帕斯卡", "years": "17 世纪"}], "related": ["archimedes", "newton-laws", "bernoulli"], "sections": {"story": "\n          <p>液压千斤顶：小活塞使劲，大活塞抬车——力被放大，压强在液体里「广播」。刹车油路同一个道理。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"\\Delta p=\\mathrm{const}\\ \\text{（密闭流体中附加压强）}\"></div>\n          <p>液压机：</p>\n          <div class=\"formula\" data-latex=\"\\dfrac{F_1}{A_1}=\\dfrac{F_2}{A_2}\"></div>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">不可压近似</div>\n            <p>液体难压缩，体积几乎不变，压强传递效率高。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">功与位移</div>\n            <p>理想无损耗：F₁d₁=F₂d₂，省力费距离。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>流体静止时，任意小面元两侧力平衡；外加的压强增量必须处处相同，否则会流动直到平衡。</p>\n          <ol class=\"steps\">\n            <li>流体静平衡：压强各向同性。</li>\n            <li>外加 Δp 后，若某处不同，会出现净力驱动流动。</li>\n            <li>平衡时附加压强均匀传递 → F/A 相等。</li>\n          </ol>\n        ", "deep": "\n          <p>与深度引起的 ρgh 叠加：总压 = 外压 + ρgh。</p>\n        ", "why": "\n          <p>液压系统、工程机械、汽车刹车。</p>\n        ", "try": "\n          <ul>\n            <li>小活塞面积 1 cm²、力 100 N；大活塞 50 cm²，理论抬力？</li>\n            <li>为何液压系统怕混入气泡？</li>\n          </ul>\n        "}}, "en": {"id": "pascal", "field": "physics", "title": "Pascal's principle", "subtitle": "Sealed liquid: pressure will be transmitted unchanged", "emoji": "🔧", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["fluid", "pressure", "mechanical"], "era": "Blaise Pascal 17th century", "oneLiner": "In a closed stationary fluid, the external pressure is transmitted in all directions unchanged.", "people": [{"role": "propose", "name": "Blaise Pascal", "years": "17th century"}], "related": ["archimedes", "newton-laws", "bernoulli"], "sections": {"story": "\n<p>Hydraulic jack: The small piston exerts force and the large piston lifts the car - the force is amplified and the pressure is \"broadcast\" in the liquid. The same principle applies to the brake oil circuit.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\Delta p=\\mathrm{const}\\ \\text{（密闭流体中附加压强）}\"></div>\n<p>Hydraulic press:</p>\n<div class=\"formula\" data-latex=\"\\dfrac{F_1}{A_1}=\\dfrac{F_2}{A_2}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">incompressible approximation</div>\n<p>Liquid is difficult to compress, its volume is almost unchanged, and its pressure transmission efficiency is high.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">work and displacement</div>\n<p>Ideal loss-free: F₁d₁=F₂d₂, saving effort and distance.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>When the fluid is stationary, the forces on both sides of any small unit are balanced; the external pressure increment must be the same everywhere, otherwise it will flow until equilibrium.</p>\n<ol class=\"steps\">\n<li>Hydrostatic equilibrium: pressure is isotropic.</li>\n<li>When Δp is applied, if something is different, a net force drives the flow.</li>\n<li>At equilibrium, the additional pressure is transferred uniformly → F/A are equal.</li>\n</ol>\n", "deep": "\n<p>Superimposed with depth-induced ρgh: total pressure = external pressure + ρgh.</p>\n", "why": "\n<p>Hydraulic systems, construction machinery, automobile brakes.</p>\n", "try": "\n<ul>\n<li>The area of ​​the small piston is 1 cm², the force is 100 N; the large piston is 50 cm², what is the theoretical lifting force?</li>\n<li>Why are hydraulic systems afraid of air bubbles being mixed in?</li>\n</ul>\n"}}}, "title": "Pascal's principle", "subtitle": "Sealed liquid: pressure will be transmitted unchanged", "difficultyLabel": "Easy to use", "tags": ["fluid", "pressure", "mechanical"], "era": "Blaise Pascal 17th century", "oneLiner": "In a closed stationary fluid, the external pressure is transmitted in all directions unchanged.", "people": [{"role": "propose", "name": "Blaise Pascal", "years": "17th century"}], "sections": {"story": "\n<p>Hydraulic jack: The small piston exerts force and the large piston lifts the car - the force is amplified and the pressure is \"broadcast\" in the liquid. The same principle applies to the brake oil circuit.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\Delta p=\\mathrm{const}\\ \\text{（密闭流体中附加压强）}\"></div>\n<p>Hydraulic press:</p>\n<div class=\"formula\" data-latex=\"\\dfrac{F_1}{A_1}=\\dfrac{F_2}{A_2}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">incompressible approximation</div>\n<p>Liquid is difficult to compress, its volume is almost unchanged, and its pressure transmission efficiency is high.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">work and displacement</div>\n<p>Ideal loss-free: F₁d₁=F₂d₂, saving effort and distance.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>When the fluid is stationary, the forces on both sides of any small unit are balanced; the external pressure increment must be the same everywhere, otherwise it will flow until equilibrium.</p>\n<ol class=\"steps\">\n<li>Hydrostatic equilibrium: pressure is isotropic.</li>\n<li>When Δp is applied, if something is different, a net force drives the flow.</li>\n<li>At equilibrium, the additional pressure is transferred uniformly → F/A are equal.</li>\n</ol>\n", "deep": "\n<p>Superimposed with depth-induced ρgh: total pressure = external pressure + ρgh.</p>\n", "why": "\n<p>Hydraulic systems, construction machinery, automobile brakes.</p>\n", "try": "\n<ul>\n<li>The area of ​​the small piston is 1 cm², the force is 100 N; the large piston is 50 cm², what is the theoretical lifting force?</li>\n<li>Why are hydraulic systems afraid of air bubbles being mixed in?</li>\n</ul>\n"}}, {"id": "equipartition", "field": "physics", "difficulty": "medium", "emoji": "⚖️", "iconClass": "", "related": ["ideal-gas", "thermo-1", "planck"], "__i18n": {"zh": {"id": "equipartition", "field": "physics", "title": "能量均分定理", "subtitle": "每一自由度平均分 ½kT", "emoji": "⚖️", "iconClass": "", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["统计物理", "热学", "微观"], "era": "麦克斯韦、玻尔兹曼经典统计", "oneLiner": "温度 T 时，每个二次型自由度平均能量 ½k_B T——解释气体热容的起点。", "people": [{"role": "发展", "name": "麦克斯韦、玻尔兹曼等", "years": "19 世纪"}], "related": ["ideal-gas", "thermo-1", "planck"], "sections": {"story": "\n          <p>理想气体平动三个方向，每个 ½kT，共 3/2 kT。双原子再加转动……经典均分在低温「冻结」自由度时失败，要靠量子论修正。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"\\Bigl\\langle \\tfrac12 \\alpha q^2\\Bigr\\rangle=\\tfrac12 k_B T\"></div>\n          <p>对哈密顿量中每个平方项（如 ½mv_x²、½kx²、½Iω²）平均贡献 ½kT。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">自由度</div>\n            <p>独立平方项个数。单原子气体 f=3；双原子常温 f≈5。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">与内能</div>\n            <p>理想气体摩尔内能 U≈(f/2)nRT，C_V=(f/2)R。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>在正则系综里对 e^{−βH} 积分，每个二次项贡献同样的平均能量。</p>\n          <ol class=\"steps\">\n            <li>配分函数对二次坐标/动量高斯积分。</li>\n            <li>得 ⟨½αq²⟩=½kT。</li>\n            <li>量子：能级间距 ≫kT 时该自由度不激发，均分失效（紫外灾难相关）。</li>\n          </ol>\n        ", "deep": "\n          <p>布朗运动、热噪声（约翰逊噪声）与 kT 尺度密切相关。</p>\n        ", "why": "\n          <p>热容估算、气体内能、统计物理入门桥梁。</p>\n        ", "try": "\n          <ul>\n            <li>室温下空气分子平均平动动能数量级？</li>\n            <li>为何低温下双原子 C_V 会下降？</li>\n          </ul>\n        "}}, "en": {"id": "equipartition", "field": "physics", "title": "equipartition theorem of energy", "subtitle": "Average score per degree of freedom ½kT", "emoji": "⚖️", "iconClass": "", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["statistical physics", "Thermal science", "microscopic"], "era": "Maxwell and Boltzmann classic statistics", "oneLiner": "The average energy per quadratic degree of freedom at temperature T is ½k_B T – the starting point for interpreting the heat capacity of gases.", "people": [{"role": "develop", "name": "Maxwell, Boltzmann, etc.", "years": "19th century"}], "related": ["ideal-gas", "thermo-1", "planck"], "sections": {"story": "\n<p>An ideal gas translates in three directions, ½ kT each, for a total of 3/2 kT. Two atoms plus rotation... Classical equipartition fails when the degrees of freedom are \"frozen\" at low temperatures, and it needs to be corrected by quantum theory.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\Bigl\\langle \\tfrac12 \\alpha q^2\\Bigr\\rangle=\\tfrac12 k_B T\"></div>\n<p>Contributes ½kT on average to each square term in the Hamiltonian (e.g. ½mv_x², ½kx², ½Iω²).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">degrees of freedom</div>\n<p>The number of independent square terms. Monoatomic gas f=3; diatomic gas f≈5 at room temperature.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">and internal energy</div>\n<p>The molar internal energy of an ideal gas is U≈(f/2)nRT, C_V=(f/2)R.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>When integrating e^{−βH} in a canonical ensemble, each quadratic term contributes the same average energy.</p>\n<ol class=\"steps\">\n<li>The partition function integrates the quadratic coordinate/momentum Gaussian.</li>\n<li>Obtain ⟨½αq²　=½kT.</li>\n<li>Quantum: When the energy level spacing ≫kT, this degree of freedom is not excited and equalization fails (related to ultraviolet disaster).</li>\n</ol>\n", "deep": "\n<p>Brownian motion, thermal noise (Johnson noise) are closely related to the kT scale.</p>\n", "why": "\n<p>Heat capacity estimation, gas internal energy, and introduction to statistical physics.</p>\n", "try": "\n<ul>\n<li>What is the order of magnitude of the average translational kinetic energy of air molecules at room temperature?</li>\n<li>Why does diatomic C_V decrease at low temperatures?</li>\n</ul>\n"}}}, "title": "equipartition theorem of energy", "subtitle": "Average score per degree of freedom ½kT", "difficultyLabel": "Spend some time thinking", "tags": ["statistical physics", "Thermal science", "microscopic"], "era": "Maxwell and Boltzmann classic statistics", "oneLiner": "The average energy per quadratic degree of freedom at temperature T is ½k_B T – the starting point for interpreting the heat capacity of gases.", "people": [{"role": "develop", "name": "Maxwell, Boltzmann, etc.", "years": "19th century"}], "sections": {"story": "\n<p>An ideal gas translates in three directions, ½ kT each, for a total of 3/2 kT. Two atoms plus rotation... Classical equipartition fails when the degrees of freedom are \"frozen\" at low temperatures, and it needs to be corrected by quantum theory.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\Bigl\\langle \\tfrac12 \\alpha q^2\\Bigr\\rangle=\\tfrac12 k_B T\"></div>\n<p>Contributes ½kT on average to each square term in the Hamiltonian (e.g. ½mv_x², ½kx², ½Iω²).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">degrees of freedom</div>\n<p>The number of independent square terms. Monoatomic gas f=3; diatomic gas f≈5 at room temperature.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">and internal energy</div>\n<p>The molar internal energy of an ideal gas is U≈(f/2)nRT, C_V=(f/2)R.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>When integrating e^{−βH} in a canonical ensemble, each quadratic term contributes the same average energy.</p>\n<ol class=\"steps\">\n<li>The partition function integrates the quadratic coordinate/momentum Gaussian.</li>\n<li>Obtain ⟨½αq²　=½kT.</li>\n<li>Quantum: When the energy level spacing ≫kT, this degree of freedom is not excited and equalization fails (related to ultraviolet disaster).</li>\n</ol>\n", "deep": "\n<p>Brownian motion, thermal noise (Johnson noise) are closely related to the kT scale.</p>\n", "why": "\n<p>Heat capacity estimation, gas internal energy, and introduction to statistical physics.</p>\n", "try": "\n<ul>\n<li>What is the order of magnitude of the average translational kinetic energy of air molecules at room temperature?</li>\n<li>Why does diatomic C_V decrease at low temperatures?</li>\n</ul>\n"}}, {"id": "escape-velocity", "field": "physics", "difficulty": "medium", "emoji": "🚀", "iconClass": "warm", "related": ["newton-gravity", "energy-conservation", "kepler"], "__i18n": {"zh": {"id": "escape-velocity", "field": "physics", "title": "逃逸速度", "subtitle": "飞出星球要多快", "emoji": "🚀", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["引力", "航天", "能量"], "era": "牛顿力学推论", "oneLiner": "从星球表面发射，动能够抵消引力势能差到无穷远：v_esc=√(2GM/R)。", "people": [{"role": "经典推导", "name": "牛顿力学", "years": "17 世纪起"}], "related": ["newton-gravity", "energy-conservation", "kepler"], "sections": {"story": "\n          <p>抛多高掉多快；抛够快就不再回来。逃逸速度不是「轨道速度」，而是「能去无穷远」的阈值。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"v_{\\mathrm{esc}}=\\sqrt{\\dfrac{2GM}{R}}=\\sqrt{2gR}\"></div>\n          <p>圆轨道速度 <span data-latex=\"v_{\\mathrm{orb}}=\\sqrt{GM/R}=v_{\\mathrm{esc}}/\\sqrt{2}\">v_orb=v_esc/√2</span>。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">引力势能</div>\n            <p><span data-latex=\"U=-GMm/r\">U=−GMm/r</span>，选无穷远为 0。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">能量条件</div>\n            <p>无穷远动能 ≥0 ⇒ 表面总能量 ≥0 ⇒ ½mv² − GMm/R ≥0。</p>\n          </div>\n        ", "proof": "\n          <ol class=\"steps\">\n            <li>机械能守恒，无推力、无大气阻力。</li>\n            <li>r=R 时 E=½mv²−GMm/R；r→∞ 时 U→0，要能到达需 E≥0。</li>\n            <li>得 v≥√(2GM/R)。</li>\n          </ol>\n          <p class=\"qed\">∎</p>\n        ", "deep": "\n          <p>黑洞的「光都逃不掉」是相对论版本：逃逸速度形式上达 c 的视界。</p>\n        ", "why": "\n          <p>航天发射能量尺度、行星大气是否留得住气体（热速度 vs 逃逸速度）。</p>\n        ", "try": "\n          <ul>\n            <li>地球 v_esc≈11 km/s，圆轨道约 7.9 km/s，差在哪？</li>\n            <li>质量相同半径更小的星，逃逸速度更大还是更小？</li>\n          </ul>\n        "}}, "en": {"id": "escape-velocity", "field": "physics", "title": "escape velocity", "subtitle": "How fast does it take to fly out of the planet?", "emoji": "🚀", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["gravitational", "aerospace", "energy"], "era": "Newtonian mechanics corollary", "oneLiner": "Launched from the surface of the planet, the kinetic energy offsets the gravitational potential energy difference to infinity: v_esc=√(2GM/R).", "people": [{"role": "Classical derivation", "name": "Newtonian mechanics", "years": "17th century onwards"}], "related": ["newton-gravity", "energy-conservation", "kepler"], "sections": {"story": "\n<p>As high as you throw it, it will fall as fast as you throw it; if you throw it fast enough, it will never come back. Escape velocity is not \"orbital speed\", but the threshold of \"going to infinity\".</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"v_{\\mathrm{esc}}=\\sqrt{\\dfrac{2GM}{R}}=\\sqrt{2gR}\"></div>\n<p>circular orbit speed <span data-latex=\"v_{\\mathrm{orb}}=\\sqrt{GM/R}=v_{\\mathrm{esc}}/\\sqrt{2}\">v_orb=v_esc/√2</span>。</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Gravitational potential energy</div>\n<p><span data-latex=\"U=-GMm/r\">U=−GMm/r</span>, choose infinity as 0.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">energy conditions</div>\n<p>Kinetic energy at infinity ≥0 ⇒ Total surface energy ≥0 ⇒ ½mv² − GMm/R ≥0.</p>\n</div>\n", "proof": "\n<ol class=\"steps\">\n<li>Mechanical energy is conserved, no thrust, no atmospheric resistance.</li>\n<li>When r=R, E=½mv²−GMm/R; when r→∞, U→0. To achieve this, E≥0 is required.</li>\n<li>Obtain v≥√(2GM/R).</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>\"Not even light can escape\" from a black hole is the relativistic version: the escape velocity formally reaches the horizon of c.</p>\n", "why": "\n<p>Space launch energy scale and whether the planetary atmosphere can retain gas (thermal velocity vs escape velocity).</p>\n", "try": "\n<ul>\n<li>The earth's v_esc≈11 km/s, the circular orbit is about 7.9 km/s, what's the difference?</li>\n<li>A star with the same mass and smaller radius has a larger or smaller escape velocity?</li>\n</ul>\n"}}}, "title": "escape velocity", "subtitle": "How fast does it take to fly out of the planet?", "difficultyLabel": "Spend some time thinking", "tags": ["gravitational", "aerospace", "energy"], "era": "Newtonian mechanics corollary", "oneLiner": "Launched from the surface of the planet, the kinetic energy offsets the gravitational potential energy difference to infinity: v_esc=√(2GM/R).", "people": [{"role": "Classical derivation", "name": "Newtonian mechanics", "years": "17th century onwards"}], "sections": {"story": "\n<p>As high as you throw it, it will fall as fast as you throw it; if you throw it fast enough, it will never come back. Escape velocity is not \"orbital speed\", but the threshold of \"going to infinity\".</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"v_{\\mathrm{esc}}=\\sqrt{\\dfrac{2GM}{R}}=\\sqrt{2gR}\"></div>\n<p>circular orbit speed <span data-latex=\"v_{\\mathrm{orb}}=\\sqrt{GM/R}=v_{\\mathrm{esc}}/\\sqrt{2}\">v_orb=v_esc/√2</span>。</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Gravitational potential energy</div>\n<p><span data-latex=\"U=-GMm/r\">U=−GMm/r</span>, choose infinity as 0.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">energy conditions</div>\n<p>Kinetic energy at infinity ≥0 ⇒ Total surface energy ≥0 ⇒ ½mv² − GMm/R ≥0.</p>\n</div>\n", "proof": "\n<ol class=\"steps\">\n<li>Mechanical energy is conserved, no thrust, no atmospheric resistance.</li>\n<li>When r=R, E=½mv²−GMm/R; when r→∞, U→0. To achieve this, E≥0 is required.</li>\n<li>Obtain v≥√(2GM/R).</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>\"Not even light can escape\" from a black hole is the relativistic version: the escape velocity formally reaches the horizon of c.</p>\n", "why": "\n<p>Space launch energy scale and whether the planetary atmosphere can retain gas (thermal velocity vs escape velocity).</p>\n", "try": "\n<ul>\n<li>The earth's v_esc≈11 km/s, the circular orbit is about 7.9 km/s, what's the difference?</li>\n<li>A star with the same mass and smaller radius has a larger or smaller escape velocity?</li>\n</ul>\n"}}, {"id": "relativity-gr", "field": "physics", "difficulty": "hard", "emoji": "🌌", "iconClass": "rose", "related": ["relativity-sr", "newton-gravity", "maxwell"], "__i18n": {"zh": {"id": "relativity-gr", "field": "physics", "title": "广义相对论要点", "subtitle": "引力 = 时空弯曲", "emoji": "🌌", "iconClass": "rose", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["相对论", "引力", "爱因斯坦"], "era": "1915 爱因斯坦", "oneLiner": "等效原理：加速与引力本地分不清；物质告诉时空怎么弯，时空告诉物质怎么走。", "people": [{"role": "建立", "name": "阿尔伯特·爱因斯坦", "years": "1915"}], "related": ["relativity-sr", "newton-gravity", "maxwell"], "sections": {"story": "\n          <p>电梯里失重 vs 太空漂浮——爱因斯坦说本地等价。引力不是神秘拉力，而是质量–能量让时空弯曲，自由下落走「直线」（测地线）。</p>\n        ", "statement": "\n          <p><strong>等效原理（弱形式）：</strong>均匀引力场局部等价于加速参考系。</p>\n          <p><strong>爱因斯坦场方程（示意）：</strong></p>\n          <div class=\"formula\" data-latex=\"G_{\\mu\\nu}=\\dfrac{8\\pi G}{c^4}T_{\\mu\\nu}\"></div>\n          <p>左边几何（曲率），右边物质–能量。弱场慢速极限回到牛顿引力。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">经典检验</div>\n            <p>水星近日点进动、光线弯曲、引力红移、引力波（2015 直接探测）。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">测地线</div>\n            <p>自由粒子沿弯曲时空的「最直路径」运动——对应牛顿的惯性运动推广。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>从等效原理与广义协变出发构造场方程；靠观测筛选正确理论，而非课堂式「证明」。</p>\n          <ol class=\"steps\">\n            <li>等效原理 → 光速弯曲、钟慢（引力红移）等思想实验。</li>\n            <li>数学上用度规张量描述时空；场方程联系曲率与 T_μν。</li>\n            <li>求解施瓦西解等，预言可检验效应。</li>\n            <li>实验/观测确认（至今在适用尺度极成功）。</li>\n          </ol>\n        ", "deep": "\n          <p>与量子力学统一仍是开放前沿（量子引力）。</p>\n        ", "why": "\n          <p>GPS 钟修正、黑洞与宇宙学、引力波天文。</p>\n        ", "try": "\n          <ul>\n            <li>用等效原理解释：光经过太阳为何偏折（定性）。</li>\n            <li>牛顿引力在什么极限下够用？</li>\n          </ul>\n        "}}, "en": {"id": "relativity-gr", "field": "physics", "title": "Key points of general relativity", "subtitle": "Gravity = Curvature of Spacetime", "emoji": "🌌", "iconClass": "rose", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["relativity", "gravitational", "einstein"], "era": "1915 Einstein", "oneLiner": "Equivalence principle: Acceleration and gravity cannot be distinguished locally; matter tells space-time how to bend, and space-time tells matter how to move.", "people": [{"role": "Establish", "name": "albert einstein", "years": "1915"}], "related": ["relativity-sr", "newton-gravity", "maxwell"], "sections": {"story": "\n<p>Weightlessness in an elevator vs floating in space - Einstein said local equivalence. Gravity is not a mysterious pulling force, but mass-energy that bends space and time, causing free fall to follow a \"straight line\" (geodesic).</p>\n", "statement": "\n<p><strong>Equivalence principle (weak form):</strong>The uniform gravitational field is locally equivalent to the accelerated reference frame.</p>\n<p><strong>Einstein's field equations (schematic):</strong></p>\n<div class=\"formula\" data-latex=\"G_{\\mu\\nu}=\\dfrac{8\\pi G}{c^4}T_{\\mu\\nu}\"></div>\n<p>Geometry (curvature) on the left, matter-energy on the right. The weak field slow limit returns to Newtonian gravity.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">classical test</div>\n<p>Mercury perihelion precession, light bending, gravitational red shift, gravitational waves (direct detection in 2015).</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">geodesic</div>\n<p>Free particles move along the \"straightest path\" in curved space-time - corresponding to Newton's generalization of inertial motion.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Construct field equations based on the equivalence principle and generalized covariance; rely on observations to select correct theories, rather than classroom-style \"proofs\".</p>\n<ol class=\"steps\">\n<li>Equivalence principle → Thought experiments such as light speed bending, clock slowness (gravitational red shift), etc.</li>\n<li>Mathematically, metric tensors are used to describe space-time; field equations relate curvature to T_μν.</li>\n<li>Solve the Schwarzschild solution, etc., and predict testable effects.</li>\n<li>Experimental/observational confirmation (extremely successful at applicable scales so far).</li>\n</ol>\n", "deep": "\n<p>Unification with quantum mechanics remains an open frontier (quantum gravity).</p>\n", "why": "\n<p>GPS clock corrections, black holes and cosmology, gravitational wave astronomy.</p>\n", "try": "\n<ul>\n<li>Use the equivalence principle to explain: why light is deflected when passing through the sun (qualitative).</li>\n<li>At what limit is Newtonian gravity sufficient?</li>\n</ul>\n"}}}, "title": "Key points of general relativity", "subtitle": "Gravity = Curvature of Spacetime", "difficultyLabel": "Hardcore challenge", "tags": ["relativity", "gravitational", "einstein"], "era": "1915 Einstein", "oneLiner": "Equivalence principle: Acceleration and gravity cannot be distinguished locally; matter tells space-time how to bend, and space-time tells matter how to move.", "people": [{"role": "Establish", "name": "albert einstein", "years": "1915"}], "sections": {"story": "\n<p>Weightlessness in an elevator vs floating in space - Einstein said local equivalence. Gravity is not a mysterious pulling force, but mass-energy that bends space and time, causing free fall to follow a \"straight line\" (geodesic).</p>\n", "statement": "\n<p><strong>Equivalence principle (weak form):</strong>The uniform gravitational field is locally equivalent to the accelerated reference frame.</p>\n<p><strong>Einstein's field equations (schematic):</strong></p>\n<div class=\"formula\" data-latex=\"G_{\\mu\\nu}=\\dfrac{8\ /f; the magnification m=−v/u.", "people": [{"role": "Gaussian form", "name": "Gauss et al.", "years": "19th century systematization"}], "related": ["snell", "young-slit", "maxwell"], "sections": {"story": "\n<p>Glasses, cameras, telescopes: light refracts on both sides of the lens, converging object points (or diverging into virtual images). The thin lens formula is the first engineering ruler.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\dfrac{1}{u}+\\dfrac{1}{v}=\\dfrac{1}{f}\"></div>\n<div class=\"formula\" data-latex=\"m=-\\dfrac{v}{u}\"></div>\n<p>The symbol convention is according to the textbook (real positive, virtual negative, etc.); convex lens f&gt;0 (common convention).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">three special rays</div>\n<p>There is no deflection when passing through the center of light; parallel axes pass through the focus; parallel exit after passing through the focus - the drawing method is consistent with the formula.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">lens maker formula</div>\n<p><span data-latex=\"1/f=(n-1)(1/R_1-1/R_2)\">1/f=(n−1)(1/R₁−1/R₂)</span>(thin lens, air).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Using the law of refraction + paraxial approximation (sinθ≈θ), the single sphere is imaged twice and combined into a thin lens formula.</p>\n<ol class=\"steps\">\n<li>Single sphere object-image relationship.</li>\n<li>Two sides are close together: thrice is like the second side.</li>\n<li>Under the paraxial small angle, it becomes 1/u+1/v=1/f.</li>\n</ol>\n", "deep": "\n<p>Aberrations, thick lenses, apertures and depth of field are the next engineering lessons.</p>\n", "why": "\n<p>Camera focusing, vision correction, and microscope combination system.</p>\n", "try": "\n<ul>\n<li>f=10 cm, the object distance is 15 cm, where is the image? False or true?</li>\n<li>Where is the image when the object distance is equal to f?</li>\n</ul>\n"}}}, "title": "Thin lens imaging formula", "subtitle": "1/u + 1/v = 1/f", "difficultyLabel": "Easy to use", "tags": ["Optics", "geometric optics", "application"], "era": "Geometric optics tradition; Gaussian optics", "oneLiner": "The object distance, image distance and focal length satisfy 1/u+1/v=1/f; the magnification m=−v/u.", "people": [{"role": "Gaussian form", "name": "Gauss et al.", "years": "19th century systematization"}], "sections": {"story": "\n<p>Glasses, cameras, telescopes: light refracts on both sides of the lens, converging object points (or diverging into virtual images). The thin lens formula is the first engineering ruler.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\dfrac{1}{u}+\\dfrac{1}{v}=\\dfrac{1}{f}\"></div>\n<div class=\"formula\" data-latex=\"m=-\\dfrac{v}{u}\"></div>\n<p>The symbol convention is according to the textbook (real positive, virtual negative, etc.); convex lens f&gt;0 (common convention).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">three special rays</div>\n<p>There is no deflection when passing through the center of light; parallel axes pass through the focus; parallel exit after passing through the focus - the drawing method is consistent with the formula.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">lens maker formula</div>\n<p><span data-latex=\"1/f=(n-1)(1/R_1-1/R_2)\">1/f=(n−1)(1/R₁−1/R₂)</span>(thin lens, air).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Using the law of refraction + paraxial approximation (sinθ≈θ), the single sphere is imaged twice and combined into a thin lens formula.</p>\n<ol class=\"steps\">\n<li>Single sphere object-image relationship.</li>\n<li>Two sides are close together: thrice is like the second side.</li>\n<li>Under the paraxial small angle, it becomes 1/u+1/v=1/f.</li>\n</ol>\n", "deep": "\n<p>Aberrations, thick lenses, apertures and depth of field are the next engineering lessons.</p>\n", "why": "\n<p>Camera focusing, vision correction, and microscope combination system.</p>\n", "try": "\n<ul>\n<li>f=10 cm, the object distance is 15 cm, where is the image? False or true?</li>\n<li>Where is the image when the object distance is equal to f?</li>\n</ul>\n"}}];


/* ---- formulas-patch.js ---- */
/**
 * 全站公式补丁：把各定理「陈述/预备/引理/证明」里的关键式子改成 data-latex
 * 主旋律仍是大白话；符号一律 KaTeX
 */
(function () {
  const T = window.THEOREMS;
  if (!T) return;

  function F(latex) {
    return `<div class="formula" data-latex="${latex}"></div>`;
  }
  function C(latex) {
    return `<div class="calc-line" data-latex="${latex}"></div>`;
  }
  function M(latex, fallback) {
    return `<span data-latex="${latex}">${fallback || ""}</span>`;
  }

  const PATCH = {
    /* ---------- 哥德尔（截图页） ---------- */
    godel: {
      statement: `
        <p class="plain-lead" data-plain-stmt><strong>先记住结论：</strong>足够强又一致的数学系统里，总有「真，但系统内证不出来」的句子；系统也不能自己证明自己没矛盾。</p>
        <p><strong>第一不完备定理（人话）：</strong>系统够强、没自相矛盾时，一定存在一句「真话」G，但系统既推不出 G，也推不出「非 G」。</p>
        ${F("T\\nvdash G\\quad\\text{且}\\quad T\\nvdash \\neg G")}
        <p>在标准自然数模型里，G 其实是真的。</p>
        <p><strong>第二不完备定理（人话）：</strong>这样的系统无法在内部证明「我自己是一致的」。</p>
        ${F("T\\nvdash \\mathrm{Con}(T)")}
        <p>其中 ${M("\\mathrm{Con}(T)", "Con(T)")} 表示「T 一致」这句话的形式化。</p>
      `,
      setup: `
        <div class="def-box">
          <div class="def-title">哥德尔编码（在干什么）</div>
          <p>把符号、公式、证明步骤都编成自然数，于是「证明」变成数论关系，系统可以「谈论自己」。</p>
          <p>谓词 ${M("\\mathrm{Proof}_T(y,x)", "Proof_T(y,x)")}：读作「y 是语句 x 的一个 T-证明」。</p>
          ${C("\\mathrm{Provable}_T(x)\\ :=\\ \\exists y\\,\\mathrm{Proof}_T(y,x)")}
          <p>即：存在某个证明码 y，使得 y 证明了 x。</p>
        </div>
      `,
      lemmas: `
        <div class="lemma-box">
          <div class="def-title">对角线引理（不动点引理）</div>
          <p>对任意公式 ${M("\\varphi(x)", "φ(x)")}，都能找到一句话 ${M("\\psi", "ψ")}，使得系统可证：</p>
          ${F("T\\vdash \\psi \\leftrightarrow \\varphi(\\ulcorner\\psi\\urcorner)")}
          <p>其中 ${M("\\ulcorner\\psi\\urcorner", "⌜ψ⌝")} 是 ψ 的哥德尔数（编码）。直觉：ψ 在说「关于我自己的编码，有性质 φ」。</p>
        </div>
      `,
      proof: `
        <p class="plain-lead" data-plain-lead><strong>人话版：</strong>造一句「这句话不可证」；若系统靠谱，它就真，但系统说不出口。</p>
        <div class="proof-nav"><span>构造 G</span><span>不可证</span><span>真理性</span><span>第二定理</span></div>
        <h3>第一定理（纲要）</h3>
        <ol class="steps">
          <li>对 ${M("\\varphi(x)=\\neg\\mathrm{Provable}_T(x)", "φ(x)=¬Provable_T(x)")} 用对角线引理，得到 G 满足
            ${C("T\\vdash G \\leftrightarrow \\neg\\mathrm{Provable}_T(\\ulcorner G\\urcorner)")}
            即 G 说：「G 不可证。」
          </li>
          <li><strong>不能有</strong> ${M("T\\vdash G", "T ⊢ G")}：若有，则 G 可证，与 G 的含义矛盾（在一致系统中）。
            ${C("T\\vdash G \\ \\Rightarrow\\ T\\text{ 不一致}")}
          </li>
          <li><strong>也不能有</strong> ${M("T\\vdash\\neg G", "T ⊢ ¬G")}（在合适的一致性假设下）。罗瑟改进可减弱假设。</li>
          <li>因此 ${M("T\\nvdash G", "T ⊬ G")}，于是「G 不可证」为真，而 G 正说这件事 → G 为真。</li>
        </ol>
        <h3>第二定理（纲要）</h3>
        <ol class="steps">
          <li>可形式化得到：${C("T\\vdash \\mathrm{Con}(T)\\rightarrow G")}</li>
          <li>若 ${M("T\\vdash\\mathrm{Con}(T)", "T ⊢ Con(T)")}，则 ${M("T\\vdash G", "T ⊢ G")}，与第一定理矛盾。</li>
          <li>故 ${C("T\\nvdash \\mathrm{Con}(T)")}</li>
        </ol>
        <p class="qed">∎</p>
      `
    },

    /* ---------- 挂谷 ---------- */
    kakeya: {
      statement: `
        <p class="plain-lead" data-plain-stmt><strong>先记住结论：</strong>每个方向都放一根「针」，集合可以薄到面积为 0，但不能薄到「维数」也塌掉。</p>
        <div class="def-box">
          <div class="def-title">定义：挂谷集 / 贝西科维奇集</div>
          <p>集合 ${M("K\\subset\\mathbb{R}^n", "K ⊂ ℝⁿ")} 叫挂谷集，意思是：每个方向都有一根长为 1 的针躺在里面。</p>
          ${F("\\forall\\,\\omega\\in S^{n-1},\\;\\exists\\,x\\in\\mathbb{R}^n:\\quad\\{x+t\\omega:0\\le t\\le 1\\}\\subset K")}
        </div>

/**
 * 数学奇境 · 交互图示引擎
 * 在页面中查找 [data-widget="..."] 并挂载
 */
window.Diagrams = (function () {
  function el(html) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function mount(root) {
    if (!root) return;
    root.querySelectorAll("[data-widget]").forEach((node) => {
      const name = node.getAttribute("data-widget");
      const factory = widgets[name];
      if (!factory) {
        node.innerHTML = `<p style="color:#94a3b8">（未找到图示组件：${name}）</p>`;
        return;
      }
      node.innerHTML = "";
      node.appendChild(factory(node.dataset));
    });
  }

  /* ========== 挂谷：两管夹角与重叠 ========== */
  function kakeyaTubes() {
    const wrap = el(`<div class="ix-card"></div>`);
    wrap.innerHTML = `
      <div class="ix-title">两管重叠</div>
      <p class="ix-desc">夹角 θ ↑ → 重叠面积 ↓（∝ δ²/sinθ）</p>
      <div class="ix-controls">
        <label>夹角 θ <span data-v="theta">30°</span>
          <input type="range" min="5" max="90" value="30" data-k="theta" />
        </label>
        <label>管宽 δ <span data-v="delta">18</span>
          <input type="range" min="6" max="36" value="18" data-k="delta" />
        </label>
      </div>
      <svg viewBox="0 0 520 320" class="ix-svg" aria-label="两管重叠示意图"></svg>
      <div class="ix-readout" data-out></div>
    `;
    const svg = wrap.querySelector("svg");
    const out = wrap.querySelector("[data-out]");
    const labels = {
      theta: wrap.querySelector('[data-v="theta"]'),
      delta: wrap.querySelector('[data-v="delta"]')
    };

    function tubePolygon(cx, cy, angleDeg, len, halfW) {
      const a = (angleDeg * Math.PI) / 180;
      const dx = Math.cos(a);
      const dy = Math.sin(a);
      const px = -dy * halfW;
      const py = dx * halfW;
      const x0 = cx - (dx * len) / 2;
      const y0 = cy - (dy * len) / 2;
      const x1 = cx + (dx * len) / 2;
      const y1 = cy + (dy * len) / 2;
      return [
        [x0 + px, y0 + py],
        [x1 + px, y1 + py],
        [x1 - px, y1 - py],
        [x0 - px, y0 - py]
      ];
    }

    function polyStr(pts) {
      return pts.map((p) => p.join(",")).join(" ");
    }

    // approximate overlap parallelogram near origin
    function overlapPoly(thetaDeg, halfW) {
      const th = (thetaDeg * Math.PI) / 180;
      const s = Math.sin(th) || 0.05;
      // diamond-like region scale ~ halfW / sin
      const L = halfW / s;
      const a1 = 0;
      const a2 = th;
      // corners of intersection of two infinite strips (approx finite blob)
      const n1 = [-Math.sin(a1), Math.cos(a1)];
      const n2 = [-Math.sin(a2), Math.cos(a2)];
      // four lines n·x = ±halfW
      // Solve intersections
      function solve(nA, cA, nB, cB) {
        const det = nA[0] * nB[1] - nA[1] * nB[0];
        if (Math.abs(det) < 1e-6) return [0, 0];
        const x = (cA * nB[1] - cB * nA[1]) / det;
        const y = (nA[0] * cB - nB[0] * cA) / det;
        return [x, y];
      }
      const corners = [
        solve(n1, halfW, n2, halfW),
        solve(n1, halfW, n2, -halfW),
        solve(n1, -halfW, n2, -halfW),
        solve(n1, -halfW, n2, halfW)
      ];
      // order by angle
      const cx = 0,
        cy = 0;
      corners.sort((p, q) => Math.atan2(p[1] - cy, p[0] - cx) - Math.atan2(q[1] - cy, q[0] - cx));
      // scale for display around center 260,160
      return corners.map(([x, y]) => [260 + x * 2.2, 160 + y * 2.2]);
    }

    function draw() {
      const theta = +wrap.querySelector('[data-k="theta"]').value;
      const delta = +wrap.querySelector('[data-k="delta"]').value;
      labels.theta.textContent = theta + "°";
      labels.delta.textContent = delta + " px";
      const half = delta / 2;
      const len = 260;
      const t1 = tubePolygon(260, 160, 0, len, half);
      const t2 = tubePolygon(260, 160, -theta, len, half);
      const ov = overlapPoly(theta, half);
      const th = (theta * Math.PI) / 180;
      const areaEst = (delta * delta) / Math.max(Math.sin(th), 0.08);
      svg.innerHTML = `
        <rect width="520" height="320" fill="#0f172a" rx="12"/>
        <polygon points="${polyStr(t1)}" fill="rgba(110,181,255,0.35)" stroke="#6eb5ff" stroke-width="2"/>
        <polygon points="${polyStr(t2)}" fill="rgba(255,159,110,0.35)" stroke="#ff9f6e" stroke-width="2"/>
        <polygon points="${polyStr(ov)}" fill="rgba(251,191,36,0.55)" stroke="#fbbf24" stroke-width="2"/>
        <circle cx="260" cy="160" r="3" fill="#fff"/>
        <path d="M 320 160 A 40 40 0 0 0 ${320 + 40 * Math.cos((-theta * Math.PI) / 180)} ${160 + 40 * Math.sin((-theta * Math.PI) / 180)}"

  /* ========== 挂谷：滑动三角形动画 ========== */
  function kakeyaPerron() {
    const wrap = el(`<div class="ix-card"></div>`);
    wrap.innerHTML = `
      <div class="ix-title">滑动三角形</div>
      <p class="ix-desc">细分并滑动 → 面积减小，方向保留</p>
      <div class="ix-controls">
        <label>细分 / 滑动程度 <span data-v="step">0</span>

        <button type="button" class="ix-btn" data-play>自动播放</button>
