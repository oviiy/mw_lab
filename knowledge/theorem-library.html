/ n! = ∑ i^n θ^n / n!.</li>\n<li>Loop for i: i^0=1, i^1=i, i^2=−1, i^3=−i, and repeat.</li>\n<li>Split into four categories: n=4k, 4k+1, 4k+2, 4k+3:\n            <ul class=\"substeps\">\n<li>n=4k: Contribution + θ^{4k}/(4k)! (real)</li>\n<li>n=4k+1: Contribution + i θ^{4k+1}/(4k+1)! (virtual)</li>\n<li>n=4k+2: Contribution − θ^{4k+2}/(4k+2)! (real)</li>\n<li>n=4k+3: Contribution − i θ^{4k+3}/(4k+3)! (virtual)</li>\n</ul>\n</li>\n<li>Overall real part = ∑ (−1)^k θ^{2k}/(2k)! = cos θ.</li>\n<li>Overall imaginary part coefficient = ∑ (−1)^k θ^{2k+1}/(2k+1)! = sin θ.</li>\n<li>Therefore, e^{iθ}=cosθ + i sinθ. The identity is obtained when θ=π.</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>Align with power series</h3>\n<p>Drag θ to observe the unit circle. The point when θ=π is (−1,0). Series proof: The real and imaginary parts of e^{iθ} form the Taylor series of cos/sin respectively.</p>\n</div>", "deep": "\n<h3>differential equation path</h3>\n<p>Let f(θ)=cosθ + i sinθ. Then f'= −sinθ + i cosθ = i f, and f(0)=1. And g(θ)=e^{iθ} satisfies the same ODE and initial value, by the uniqueness f≡g.</p>\n<h3>Geometry: Module length</h3>\n<p>|e^{iθ}|² = cos²θ + sin²θ = 1, so on the unit circle; an increase in θ corresponds to an increase in the argument (angular velocity 1).</p>\n<h3>Demoivre</h3>\n<p>(cosθ+i sinθ)^n = cos(nθ)+i sin(nθ) is immediately obtained from Euler’s formula.</p>\n", "why": "\n<p>Signals, alternating currents, and quantum phases all like to write \"vibration\" as the imaginary exponent of e - the calculation is like multiplication, which is less troublesome than the angle formula.</p>\n", "try": "\n<ul>\n<li>Drag the interactive graph to see where the points fall when θ=90° and 180°.</li>\n<li>Use the first few steps of the series to calculate by hand and feel that it is getting closer to cos+i sin.</li>\n</ul>\n"}}, {"id": "cantor", "field": "math", "difficulty": "medium", "emoji": "♾️", "iconClass": "rose", "related": ["euclid-primes", "godel", "sqrt2"], "__i18n": {"zh": {"id": "cantor", "title": "实数不可数（对角线法）", "subtitle": "无限分档：有的能数完，有的数不完", "emoji": "♾️", "iconClass": "rose", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["集合论", "无限", "康托尔"], "era": "1874–1891", "oneLiner": "自然数能排队，实数却排不完——无限也可以比大小，实数这条「线」更宽。", "people": [{"role": "创立并证明", "name": "格奥尔格·康托尔", "years": "1845–1918"}], "related": ["euclid-primes", "godel", "sqrt2"], "sections": {"story": "\n        <p>偶数和自然数一样多（一个对一个排）。有理数也能排队。但 0 到 1 之间的实数呢？</p>\n        <p>康托尔用对角线法证明：你列出任何名单，我都能造出一个名单里没有的小数。所以实数「严格更多」。</p>\n        <div class=\"fun-box\"><strong>当时：</strong>很多人接受不了「无限还有大小」。后来希尔伯特说：没人能把我们从康托尔的乐园赶走。</div>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>自然数能排队，0 到 1 的实数排不完。</p>\n        <div class=\"formula\" data-latex=\"(0,1)\\text{ 不可数}\\quad\\Rightarrow\\quad\\mathbb{R}\\text{ 不可数}\"></div>\n        <p>即：不存在从 <span data-latex=\"\\mathbb{N}\">ℕ</span> 到 <span data-latex=\"(0,1)\">(0,1)</span> 的一一对应。</p>\n      ", "setup": "\n        <div class=\"def-box\">\n          <div class=\"def-title\">可数</div>\n          <p>集合 S 可数（countable infinite）指存在双射 ℕ→S，或等价：元素可排成无重复的无穷序列 s₁,s₂,s₃,… 穷尽 S。</p>\n          <p>小数约定：避免 0.1999…=0.2000… 的双重表示——证明中构造的 y 只用数字 4 与 5，避开 0 与 9。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>假装名单列完了，专改对角线上的数字，得到一个和每一行都「至少有一位不同」的新数。</p><div class=\"interactive\" data-widget=\"cantor-diagonal\"></div>\n        <div class=\"proof-nav\"><span>反设可列</span><span>造对角线数</span><span>逐位不同</span></div>\n        <ol class=\"steps\">\n          <li>反设 (0,1) 可数，列成 x₁,x₂,x₃,… 写十进位：\n            <div class=\"calc-line\" data-latex=\"x_n = 0.a_{n1}a_{n2}a_{n3}\\ldots ， a_{nj}\\in {0,1,\\ldots ,9}\"></div>\n          </li>\n          <li>定义 y=0.b₁b₂b₃…，其中\n            <div class=\"calc-line\" data-latex=\"b_n = 4 \\text{若} a_{nn} \\ne 4； b_n = 5 \\text{若} a_{nn} = 4\"></div>\n          </li>\n          <li>则 y∈(0,1)，且 y 不含循环全 0/全 9 的双重表示问题（各位是 4 或 5）。</li>\n          <li>对任意 n，y 与 x_n 的第 n 位不同：b_n ≠ a_{nn}。故 y ≠ x_n。</li>\n          <li>y 不在名单中，矛盾。因此 (0,1) 不可数。</li>\n        </ol>\n        <p class=\"qed\">∎</p>\n      ", "deep": "\n        <h3>有理数可数（对比）</h3>\n        <p>正有理数按 p+q 斜线枚举，跳过不既约者，可排成序列。整数 ℤ：0,1,−1,2,−2,… 可数。可数个可数集的并仍可数。</p>\n        <h3>基数</h3>\n        <p>|ℕ|=ℵ₀，|(0,1)|=2^{ℵ₀}=𝔠。康托尔定理：对任何集合 A，|A| lt  |P(A)|（幂集更大）——对角论证的抽象版。</p>\n        <h3>连续统假设 CH</h3>\n        <p>是否存在基数严格介于 ℵ₀ 与 𝔠 之间？哥德尔与科恩证明 CH 相对 ZFC 独立——不可证也不可否。</p>\n      ", "why": "\n        <p>重塑人类对无限的直觉。概率里的「几乎处处」、计算机里的不可判定，都和这条河有关。</p>\n      ", "try": "\n        <ul>\n          <li>自己写三四个小数，按对角线规则造一个和它们都不同的 y。</li>\n          <li>证明偶数和自然数能一一对应：n ↔ 2n。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "cantor", "title": "Real numbers are uncountable (diagonal method)", "subtitle": "Infinite binning: some can be counted, some cannot be counted", "emoji": "♾️", "iconClass": "rose", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["set theory", "unlimited", "Cantor"], "era": "1874–1891", "oneLiner": "Natural numbers can be lined up, but real numbers cannot be lined up - infinity can also be wider than size, and the \"line\" of real numbers is wider.", "people": [{"role": "Create and prove", "name": "Georg Cantor", "years": "1845–1918"}], "related": ["euclid-primes", "godel", "sqrt2"], "sections": {"story": "\n<p>There are as many even numbers as there are natural numbers (one to one row). Rational numbers can also be queued. But what about real numbers between 0 and 1?</p>\n<p>Cantor used the diagonal method to prove: If you make any list, I can create a decimal that is not in the list. So real numbers are \"strictly more\".</p>\n<div class=\"fun-box\"><strong>then:</strong>Many people cannot accept \"infinity and size\". Hilbert later said: No one can drive us away from Cantor's paradise.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Natural numbers can be queued up, but the real numbers from 0 to 1 are endless.</p>\n<div class=\"formula\" data-latex=\"(0,1)\\text{ 不可数}\\quad\\Rightarrow\\quad\\mathbb{R}\\text{ 不可数}\"></div>\n<p>That is: there is no <span data-latex=\"\\mathbb{N}\">ℕ</span> arrive <span data-latex=\"(0,1)\">(0,1)</span> One-to-one correspondence.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">countable</div>\n<p>A set S is countable infinite if there is a bijection ℕ→S, or equivalently: the elements can be arranged into an infinite sequence without repetition s₁,s₂,s₃,… exhausting S.</p>\n<p>Decimal Convention: Avoid the double representation of 0.1999…=0.2000…—the y constructed in the proof only uses the numbers 4 and 5, and avoids 0 and 9.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Pretend that the list is complete and change the numbers on the diagonal to get a new number that is \"at least one different\" from each row.</p><div class=\"interactive\" data-widget=\"cantor-diagonal\"></div>\n<div class=\"proof-nav\"><span>Counterpossible</span><span>number of diagonals</span><span>Different bit by bit</span></div>\n<ol class=\"steps\">\n<li>Suppose (0,1) is countable and listed as x₁,x₂,x₃,... Write in decimal:\n            <div class=\"calc-line\" data-latex=\"x_n = 0.a_{n1}a_{n2}a_{n3}\\ldots ， a_{nj}\\in {0,1,\\ldots ,9}\"></div>\n</li>\n<li>Define y=0.b₁b₂b₃…, where\n            <div class=\"calc-line\" data-latex=\"b_n = 4 \\text{若} a_{nn} \\ne 4； b_n = 5 \\text{若} a_{nn} = 4\"></div>\n</li>\n<li>Then y∈(0,1), and y does not contain the double representation problem of cyclic all 0s/all 9s (each bit is 4 or 5).</li>\n<li>For any n, y differs from the nth bit of x_n: b_n ≠ a_{nn}. Therefore y ≠ x_n.</li>\n<li>y is not in the list, a contradiction. Therefore (0,1) is uncountable.</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<h3>Countable rational numbers (contrast)</h3>\n<p>Positive rational numbers are enumerated according to p+q slashes, and those that are not reduced can be arranged in sequence. Integers ℤ: 0,1,−1,2,−2,… countable. Countable and countable sets are still countable.</p>\n<h3>Cardinality</h3>\n<p>|ℕ|=ℵ₀, |(0,1)|=2^{ℵ₀}=𝔠. Cantor's theorem: For any set A, |A| lt |P(A)| (the power set is larger) - an abstract version of the diagonal argument.</p>\n<h3>Continuum Hypothesis CH</h3>\n<p>Is there a base strictly between ℵ₀ and 𝔠? Gödel and Cohen proved that CH is independent of ZFC - neither provable nor disproof.</p>\n", "why": "\n<p>Reshaping human intuition of infinity. \"Almost everywhere\" in probability and undecidable in computers are all related to this river.</p>\n", "try": "\n<ul>\n<li>Write three or four decimals yourself and use the diagonal rules to create a y that is different from them all.</li>\n<li>Prove that there is a one-to-one correspondence between even numbers and natural numbers: n ↔ 2n.</li>\n</ul>\n"}, "field": "math"}}, "title": "Real numbers are uncountable (diagonal method)", "subtitle": "Infinite binning: some can be counted, some cannot be counted", "difficultyLabel": "Spend some time thinking", "tags": ["set theory", "unlimited", "Cantor"], "era": "1874–1891", "oneLiner": "Natural numbers can be lined up, but real numbers cannot be lined up - infinity can also be wider than size, and the \"line\" of real numbers is wider.", "people": [{"role": "Create and prove", "name": "Georg Cantor", "years": "1845–1918"}], "sections": {"story": "\n<p>There are as many even numbers as there are natural numbers (one to one row). Rational numbers can also be queued. But what about real numbers between 0 and 1?</p>\n<p>Cantor used the diagonal method to prove: If you make any list, I can create a decimal that is not in the list. So real numbers are \"strictly more\".</p>\n<div class=\"fun-box\"><strong>then:</strong>Many people cannot accept \"infinity and size\". Hilbert later said: No one can drive us away from Cantor's paradise.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Natural numbers can be queued up, but the real numbers from 0 to 1 are endless.</p>\n<div class=\"formula\" data-latex=\"(0,1)\\text{ 不可数}\\quad\\Rightarrow\\quad\\mathbb{R}\\text{ 不可数}\"></div>\n<p>That is: there is no <span data-latex=\"\\mathbb{N}\">ℕ</span> arrive <span data-latex=\"(0,1)\">(0,1)</span> One-to-one correspondence.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">countable</div>\n<p>A set S is countable infinite if there is a bijection ℕ→S, or equivalently: the elements can be arranged into an infinite sequence without repetition s₁,s₂,s₃,… exhausting S.</p>\n<p>Decimal Convention: Avoid the double representation of 0.1999…=0.2000…—the y constructed in the proof only uses the numbers 4 and 5, and avoids 0 and 9.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Pretend that the list is complete and change the numbers on the diagonal to get a new number that is \"at least one different\" from each row.</p><div class=\"interactive\" data-widget=\"cantor-diagonal\"></div>\n<div class=\"proof-nav\"><span>Counterpossible</span><span>number of diagonals</span><span>Different bit by bit</span></div>\n<ol class=\"steps\">\n<li>Suppose (0,1) is countable and listed as x₁,x₂,x₃,... Write in decimal:\n            <div class=\"calc-line\" data-latex=\"x_n = 0.a_{n1}a_{n2}a_{n3}\\ldots ， a_{nj}\\in {0,1,\\ldots ,9}\"></div>\n</li>\n<li>Define y=0.b₁b₂b₃…, where\n            <div class=\"calc-line\" data-latex=\"b_n = 4 \\text{若} a_{nn} \\ne 4； b_n = 5 \\text{若} a_{nn} = 4\"></div>\n</li>\n<li>Then y∈(0,1), and y does not contain the double representation problem of cyclic all 0s/all 9s (each bit is 4 or 5).</li>\n<li>For any n, y differs from the nth bit of x_n: b_n ≠ a_{nn}. Therefore y ≠ x_n.</li>\n<li>y is not in the list, a contradiction. Therefore (0,1) is uncountable.</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<h3>Countable rational numbers (contrast)</h3>\n<p>Positive rational numbers are enumerated according to p+q slashes, and those that are not reduced can be arranged in sequence. Integers ℤ: 0,1,−1,2,−2,… countable. Countable and countable sets are still countable.</p>\n<h3>Cardinality</h3>\n<p>|ℕ|=ℵ₀, |(0,1)|=2^{ℵ₀}=𝔠. Cantor's theorem: For any set A, |A| lt |P(A)| (the power set is larger) - an abstract version of the diagonal argument.</p>\n<h3>Continuum Hypothesis CH</h3>\n<p>Is there a base strictly between ℵ₀ and 𝔠? Gödel and Cohen proved that CH is independent of ZFC - neither provable nor disproof.</p>\n", "why": "\n<p>Reshaping human intuition of infinity. \"Almost everywhere\" in probability and undecidable in computers are all related to this river.</p>\n", "try": "\n<ul>\n<li>Write three or four decimals yourself and use the diagonal rules to create a y that is different from them all.</li>\n<li>Prove that there is a one-to-one correspondence between even numbers and natural numbers: n ↔ 2n.</li>\n</ul>\n"}}, {"id": "four-color", "field": "math", "difficulty": "hard", "emoji": "🗺️", "iconClass": "warm", "related": ["euler-polyhedron", "pigeonhole", "kakeya", "euler-bridges"], "__i18n": {"zh": {"id": "four-color", "title": "四色定理", "subtitle": "涂色游戏背后的大定理", "emoji": "🗺️", "iconClass": "warm", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["图论", "计算机证明", "平面图"], "era": "1852 提出；1976 证明", "oneLiner": "平面地图上色，相邻不同色，最多四种颜色就够——不用第五种。", "people": [{"role": "提出", "name": "格思里", "years": "1852"}, {"role": "五色定理", "name": "希伍德", "years": "1890"}, {"role": "四色证明", "name": "阿佩尔、哈肯", "years": "1976"}], "related": ["euler-polyhedron", "pigeonhole", "kakeya", "euler-bridges"], "sections": {"story": "\n        <p>1852 年有人涂英国地图时猜想：好像四种颜色永远够用。听起来像脑筋急转弯，却难倒数学家一百多年。</p>\n        <p>1976 年靠计算机辅助检查大量情形才证完，也引发争论：电脑查过的算不算证明？现在学界普遍接受。</p>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>平面地图相邻不同色，四种颜色总够用。</p>\n        <div class=\"formula\" data-latex=\"\\chi(G)\\le 4\\quad(G\\text{ 为平面图})\"></div>\n        <p><span data-latex=\"\\chi(G)\">χ(G)</span> 是染色数：最少用几种颜色才能让相邻顶点不同色。</p>\n      ", "setup": "\n        <div class=\"def-box\">\n          <div class=\"def-title\">图论语言</div>\n          <ul>\n            <li>平面图：可画在平面上使边仅在顶点相交。</li>\n            <li>k-染色：用 k 种颜色给顶点上色，邻接异色。</li>\n            <li>最小反例：顶点数最少的不可 4-染色平面图。</li>\n          </ul>\n        </div>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理（欧拉推论）</div>\n          <p>简单平面图 E≤3V−6（V≥3），故存在顶点度数 d(v)≤5。</p>\n        </div>\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">五色定理（完整短证）</div>\n          <p>对 V 归纳。取 d(v)≤5。删 v 后 5-染色。若 d(v)≤4，直接染 v。若 d(v)=5 且五个邻居五色俱全：在两不相邻邻居的颜色类上做 Kempe 链切换，可腾出一种颜色给 v。（细节：若 1-3 Kempe 链堵住，则 2-4 链不会同时堵住，可切换。）</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>五色可以手工证；四色更难，要说明「坏地图」一定含某类局部，而这类局部又可被消掉——最后无矛盾。</p><div class=\"interactive\" data-widget=\"four-color-map\"></div>\n        <div class=\"proof-nav\"><span>五色可手工</span><span>四色：不可避+可约</span></div>\n        <h3>A. 五色定理（希伍德，细节纲要）</h3>\n        <ol class=\"steps\">\n          <li>对顶点数 n 归纳。n 小则显然。</li>\n          <li>平面图有 v，deg(v)≤5。G−v 有 5-染色。</li>\n          <li>deg≤4：邻居最多用 4 色，第 5 色给 v。</li>\n          <li>deg=5：设邻居颜色为 1..5 环绕。考虑颜色 1 与 3 的 Kempe 子图：\n            <ul class=\"substeps\">\n              <li>若染 1 的邻居与染 3 的邻居不在同一连通分量，切换分量颜色，使「1」色空出，染 v；</li>\n              <li>若在同一分量，则 1–3 路径把平面分成两侧，此时 2 与 4 的邻居被隔开，对 2–4 切换一定成功。</li>\n            </ul>\n          </li>\n        </ol>\n        <h3>B. 四色定理的战略（阿佩尔–哈肯）</h3>\n        <ol class=\"steps\">\n          <li><strong>最小反例性质：</strong>可证明最小反例是三角剖分、最小度 ≥5 等（可约化掉 deg≤4）。</li>\n          <li><strong>不可避免集：</strong>用放电法（discharging）：给顶点电荷，按欧拉公式总电荷负，重新分配后某些局部构型必然「仍然带电」——这些构型构成不可避免集 U：任何最小反例必须包含 U 中某个构型。</li>\n          <li><strong>可约性：</strong>对 U 中每一构型 C，证明：若 G 含 C 且 G−C（适当收缩）可 4-染色，则染色可延拓回 G。于是含 C 的图不是最小反例。</li>\n          <li>计算机检查 U 中所有构型的可约性（历史上约 1500 个，后经简化）。</li>\n          <li>故最小反例不能存在 ⇒ 所有平面图 4-可染。</li>\n        </ol>\n        <p class=\"qed\">∎（战略完备；可约性机器检查属证明的一部分）</p>\n      <div data-more-detail>\n    <h3>与五色证明的关系</h3>\n    <p>交互地图可用贪心 4-染色。五色定理有纯手工 Kempe 链证明；四色需「不可避免可约构型」+ 机器检验。平面图必有 deg≤5 顶点（欧拉推论）是两种证明的共同起点。</p>\n    </div>", "deep": "\n        <h3>放电法一瞥</h3>\n        <p>初始电荷 σ(v)=deg(v)−6，则 ∑σ=∑(deg−6)=2E−6V≤−12lt 0（由 E≤3V−6）。规定「从高电荷顶点向某些邻域输送电荷」的规则后，若每个可能的局部在输送后电荷 ≤0，则总电荷 ≤0 与 ∑=−12 的精细分析结合，迫使某些构型出现——这就是「不可避免」。</p>\n        <h3>为何四色比五色难</h3>\n        <p>deg=5 时 4 色没有「备用色」，Kempe 在 1879 年的四色「证明」有漏洞；修补漏洞需要系统的构型表，人手难以穷尽。</p>\n      ", "why": "\n        <p>图染色是排课、芯片布线、频率分配的模型。四色也是「人定框架 + 机器穷尽」的里程碑。</p>\n      ", "try": "\n        <ul>\n          <li>在交互地图上点色，看何时出现相邻同色冲突。</li>\n          <li>试证明：树形地图两种颜色就够。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "four-color", "title": "four color theorem", "subtitle": "The Great Theorem Behind the Coloring Game", "emoji": "🗺️", "iconClass": "warm", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["graph theory", "computer proof", "floor plan"], "era": "Proposed in 1852; proved in 1976", "oneLiner": "When coloring a flat map, adjacent colors must be different. A maximum of four colors is enough - no fifth color is needed.", "people": [{"role": "propose", "name": "Guthrie", "years": "1852"}, {"role": "five color theorem", "name": "seawood", "years": "1890"}, {"role": "four color proof", "name": "Appel, Haken", "years": "1976"}], "related": ["euler-polyhedron", "pigeonhole", "kakeya", "euler-bridges"], "sections": {"story": "\n<p>When someone painted a map of Britain in 1852, he surmised that four colors would always be enough. It sounds like a brain teaser, but it has stumped mathematicians for more than a hundred years.</p>\n<p>In 1976, the certification was completed by relying on computer-assisted examination of a large number of situations, which also triggered a debate: Does the computer-aided examination count as certification? It is now generally accepted by academic circles.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Flat maps have adjacent colors of different colors, so four colors are always enough.</p>\n<div class=\"formula\" data-latex=\"\\chi(G)\\le 4\\quad(G\\text{ 为平面图})\"></div>\n<p><span data-latex=\"\\chi(G)\">χ(G)</span> It is the coloring number: at least a few colors are used to make adjacent vertices different colors.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">graph theory language</div>\n<ul>\n<li>Plane graph: It can be drawn on a plane so that the edges intersect only at the vertices.</li>\n<li>k-coloring: Color vertices with k colors, adjacent to different colors.</li>\n<li>Minimal counterexample: an un4-colorable plane graph with the smallest number of vertices.</li>\n</ul>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (Euler's Corollary)</div>\n<p>The simple plane graph E≤3V−6 (V≥3), so there is a vertex degree d(v)≤5.</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Five Color Theorem (Complete Short Proof)</div>\n<p>Generalize V. Take d(v)≤5. 5-stain after deleting v. If d(v)≤4, dye v directly. If d(v)=5 and the five neighbors have all five colors: performing Kempe chain switching on the color classes of two non-adjacent neighbors can free up one color for v. (Details: If the 1-3 Kempe chain is blocked, the 2-4 chain will not be blocked at the same time and can be switched.)</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Five colors can be verified manually; four colors are more difficult. It must be explained that the \"bad map\" must contain certain types of parts, and these parts can be eliminated - in the end there is no contradiction.</p><div class=\"interactive\" data-widget=\"four-color-map\"></div>\n<div class=\"proof-nav\"><span>Five colors can be handmade</span><span>Four colors: Unavoidable + Appointable</span></div>\n<h3>A. The five-color theorem (Heawood, outline of details)</h3>\n<ol class=\"steps\">\n<li>Generalize over the number of vertices n. Obvious if n is small.</li>\n<li>The plan view has v, deg(v)≤5. G−v has 5-staining.</li>\n<li>deg≤4: Neighbors use at most 4 colors, and the 5th color is given to v.</li>\n<li>deg=5: Set the neighbor color to be 1..5 surround. Consider the Kempe subgraph of colors 1 and 3:\n            <ul class=\"substeps\">\n<li>If the neighbor dyed 1 and the neighbor dyed 3 are not in the same connected component, switch the component color so that the \"1\" color is empty and dye v;</li>\n<li>If they are in the same component, the 1–3 path divides the plane into two sides. At this time, the neighbors of 2 and 4 are separated, and the switch to 2–4 must be successful.</li>\n</ul>\n</li>\n</ol>\n<h3>B. Strategy for the four-color theorem (Apel–Hacken)</h3>\n<ol class=\"steps\">\n<li><strong>Minimal counterexample property:</strong>It can be proved that the smallest counterexample is triangulation, minimum degree ≥5, etc. (can be reduced to deg≤4).</li>\n<li><strong>Inevitable set:</strong>Use the discharging method: charge the vertices. According to Euler's formula, the total charge is negative. After redistribution, some local configurations must \"still be charged\" - these configurations constitute the inevitable set U: any minimal counterexample must contain a certain configuration in U.</li>\n<li><strong>Reducibility:</strong>For each configuration C in U, show that if G contains C and G−C (appropriately contracted) can be 4-dyed, then the dyeing can be extended back to G. So the graph containing C is not a minimal counterexample.</li>\n<li>The computer checks the reducibility of all configurations in U (about 1500 historically, later simplified).</li>\n<li>Therefore, the minimal counterexample cannot exist ⇒ All planar graphs are 4-colorable.</li>\n</ol>\n<p class=\"qed\">∎ (Strategy complete; machine check of reducibility is part of the proof)</p>\n<div data-more-detail=\"\">\n<h3>Relationship with the five-color proof</h3>\n<p>Interactive maps can be greedy 4-colored. The five-color theorem is proved by a purely manual Kempe chain; the four-color theorem requires \"inevitable reducible configuration\" + machine verification. The planar graph must have deg≤5 vertices (Euler's corollary) is the common starting point for both proofs.</p>\n</div>", "deep": "\n<h3>Discharge method at a glance</h3>\n<p>The initial charge σ(v)=deg(v)−6, then ∑σ=∑(deg−6)=2E−6V≤−12lt 0 (from E≤3V−6). After stipulating the rule of \"transporting charges from highly charged vertices to certain neighborhoods\", if each possible local charge is ≤0 after transfer, then the total charge ≤0 combined with the fine analysis of ∑=−12 forces certain configurations to appear - this is \"inevitable\".</p>\n<h3>Why is four colors more difficult than five colors?</h3>\n<p>When deg=5, there is no \"spare color\" for the four colors. Kempe's four-color \"proven\" in 1879 has a loophole; fixing the loophole requires a system configuration table, which is difficult to exhaust manually.</p>\n", "why": "\n<p>Graph coloring is a model for class scheduling, chip routing, and frequency allocation. The four colors are also a milestone in \"man-determined framework + machine exhaustion\".</p>\n", "try": "\n<ul>\n<li>Click on colors on the interactive map to see when adjacent colors of the same color conflict.</li>\n<li>Try to prove: Two colors are enough for the tree map.</li>\n</ul>\n"}, "field": "math"}}, "title": "four color theorem", "subtitle": "The Great Theorem Behind the Coloring Game", "difficultyLabel": "Hardcore challenge", "tags": ["graph theory", "computer proof", "floor plan"], "  Proof)</div>\n<p>Generalize V. Take d(v)≤5. 5-stain after deleting v. If d(v)≤4, dye v directly. If d(v)=5 and the five neighbors have all five colors: performing Kempe chain switching on the color classes of two non-adjacent neighbors can free up one color for v. (Details: If the 1-3 Kempe chain is blocked, the 2-4 chain will not be blocked at the same time and can be switched.)</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Five colors can be verified manually; four colors are more difficult. It must be explained that the \"bad map\" must contain certain types of parts, and these parts can be eliminated - in the end there is no contradiction.</p><div class=\"interactive\" data-widget=\"four-color-map\"></div>\n<div class=\"proof-nav\"><span>Five colors can be handmade</span><span>Four colors: Unavoidable + Appointable</span></div>\n<h3>A. The five-color theorem (Heawood, outline of details)</h3>\n<ol class=\"steps\">\n<li>Generalize over the number of vertices n. Obvious if n is small.</li>\n<li>The plan view has v, deg(v)≤5. G−v has 5-staining.</li>\n<li>deg≤4: Neighbors use at most 4 colors, and the 5th color is given to v.</li>\n<li>deg=5: Set the neighbor color to be 1..5 surround. Consider the Kempe subgraph of colors 1 and 3:\n            <ul class=\"substeps\">\n<li>If the neighbor dyed 1 and the neighbor dyed 3 are not in the same connected component, switch the component color so that the \"1\" color is empty and dye v;</li>\n<li>If they are in the same component, the 1–3 path divides the plane into two sides. At this time, the neighbors of 2 and 4 are separated, and the switch to 2–4 must be successful.</li>\n</ul>\n</li>\n</ol>\n<h3>B. Strategy for the four-color theorem (Apel–Hacken)</h3>\n<ol class=\"steps\">\n<li><strong>Minimal counterexample property:</strong>It can be proved that the smallest counterexample is triangulation, minimum degree ≥5, etc. (can be reduced to deg≤4).</li>\n<li><strong>Inevitable set:</strong>Use the discharging method: charge the vertices. According to Euler's formula, the total charge is negative. After redistribution, some local configurations must \"still be charged\" - these configurations constitute the inevitable set U: any minimal counterexample must contain a certain configuration in U.</li>\n<li><strong>Reducibility:</strong>For each configuration C in U, show that if G contains C and G−C (appropriately contracted) can be 4-dyed, then the dyeing can be extended back to G. So the graph containing C is not a minimal counterexample.</li>\n<li>The computer checks the reducibility of all configurations in U (about 1500 historically, later simplified).</li>\n<li>Therefore, the minimal counterexample cannot exist ⇒ All planar graphs are 4-colorable.</li>\n</ol>\n<p class=\"qed\">∎ (Strategy complete; machine check of reducibility is part of the proof)</p>\n<div data-more-detail=\"\">\n<h3>Relationship with the five-color proof</h3>\n<p>Interactive maps can be greedy 4-colored. The five-color theorem is proved by a purely manual Kempe chain; the four-color theorem requires \"inevitable reducible configuration\" + machine verification. The planar graph must have deg≤5 vertices (Euler's corollary) is the common starting point for both proofs.</p>\n</div>", "deep": "\n<h3>Discharge method at a glance</h3>\n<p>The initial charge σ(v)=deg(v)−6, then ∑σ=∑(deg−6)=2E−6V≤−12lt 0 (from E≤3V−6). After stipulating the rule of \"transporting charges from highly charged vertices to certain neighborhoods\", if each possible local charge is ≤0 after transfer, then the total charge ≤0 combined with the fine analysis of ∑=−12 forces certain configurations to appear - this is \"inevitable\".</p>\n<h3>Why is four colors more difficult than five colors?</h3>\n<p>When deg=5, there is no \"spare color\" for the four colors. Kempe's four-color \"proven\" in 1879 has a loophole; fixing the loophole requires a system configuration table, which is difficult to exhaust manually.</p>\n", "why": "\n<p>Graph coloring is a model for class scheduling, chip routing, and frequency allocation. The four colors are also a milestone in \"man-determined framework + machine exhaustion\".</p>\n", "try": "\n<ul>\n<li>Click on colors on the interactive map to see when adjacent colors of the same color conflict.</li>\n<li>Try to prove: Two colors are enough for the tree map.</li>\n</ul>\n"}}, {"id": "fermat", "field": "math", "difficulty": "hard", "emoji": "📜", "iconClass": "rose", "related": ["euclid-primes", "fta-arith", "godel", "fermat-little"], "__i18n": {"zh": {"id": "fermat", "title": "费马大定理", "subtitle": "页边注留下的三百年悬案", "emoji": "📜", "iconClass": "rose", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["数论", "怀尔斯", "椭圆曲线"], "era": "1637 断言；1995 证明完成", "oneLiner": "立方以上，aⁿ+bⁿ=cⁿ 再也找不到正整数解。中学生能听懂题，证明却走了三百年。", "people": [{"role": "断言", "name": "费马", "years": "1637"}, {"role": "n=4 无穷下降", "name": "费马", "years": "17 世纪"}, {"role": "完全证明", "name": "安德鲁·怀尔斯", "years": "1995"}], "related": ["euclid-primes", "fta-arith", "godel", "fermat-little"], "sections": {"story": "\n        <p>勾股数 3²+4²=5² 有的是。费马随手写：指数再大，这种等式就没正整数解了，还说「空白太小写不下妙证」。</p>\n        <p>三百年后怀尔斯用现代工具证完。页边注多半是他对特例的自信；一般情形远超当时工具。</p>\n        <div class=\"fun-box\"><strong>对比：</strong>n=2 解无穷多；n≥3 一个都没有。从「很多」到「没有」，跨过了整个现代数论。</div>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>立方以上，<span data-latex=\"a^n+b^n=c^n\">aⁿ+bⁿ=cⁿ</span> 没有正整数解。</p>\n        <div class=\"formula\" data-latex=\"\\nexists\\,a,b,c\\in\\mathbb{Z}^{+},\\ n\\ge 3:\\quad a^n+b^n=c^n\"></div>\n      ", "setup": "\n        <div class=\"def-box\">\n          <div class=\"def-title\">可化约到素指数</div>\n          <p>若 n=km，aⁿ+bⁿ=cⁿ ⇒ (aᵏ)ᵐ+(bᵏ)ᵐ=(cᵏ)ᵐ。故只需对 n=4 与奇素数 p 证明。n=4 由费马完成；核心是奇素数 p。</p>\n        </div>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">定理（费马，n=4）纲要</div>\n          <p>用无穷下降证明 a⁴+b⁴=c² 无正整数解（更强），从而 a⁴+b⁴=d⁴ 无解。思想：由一组解构造严格更小的正整数解，与「正整数无限下降」矛盾。</p>\n        </div>\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">弗雷曲线</div>\n          <p>若 aᵖ+bᵖ=cᵖ 是非平凡解，可构造椭圆曲线 y² = x(x−aᵖ)(x+bᵖ)，具有极特殊的算术性质（极小判别式等）。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>n=4 可用无穷下降；一般 n 把反例变成一条不该存在的曲线，再用大定理堵住退路。</p><div class=\"interactive\" data-widget=\"fermat-descent\"></div>\n        <div class=\"proof-nav\"><span>n=4 下降</span><span>反例⇒弗雷曲线</span><span>模性⇒矛盾</span></div>\n        <h3>第一部分：n=4 无穷下降（细节骨架）</h3>\n        <ol class=\"steps\">\n          <li>研究更强方程 x⁴ + y⁴ = z²。设有正整数解，取 z 最小者。</li>\n          <li>改写 x⁴ + y⁴ = z² 为 (z−x²)(z+x²)=y⁴ 或视为勾股型：z² − (x²)² = (y²)²，即 (z−x²)(z+x²)=y⁴。</li>\n          <li>利用 gcd(z−x²,z+x²) 整除 2x² 等的精细互素分析（标准数论教材有完整初等证明），可说明存在另一组更小的解 (x₁,y₁,z₁) 满足同型方程。</li>\n          <li>与 z 最小矛盾 ⇒ 无解 ⇒ 费马 n=4 成立。</li>\n        </ol>\n        <h3>第二部分：奇素数的现代战略（怀尔斯）</h3>\n        <ol class=\"steps\">\n          <li>反设奇素数 p 与正整数 a,b,c 互素满足 aᵖ+bᵖ=cᵖ。</li>\n          <li>弗雷（1986 思想）：关联椭圆曲线 E：y²=x(x−aᵖ)(x+bᵖ)。E 是半稳定的，且其模形式对应物若存在会违反某些水平估计（里贝特后来证明：E 不可能是模的——「ε 猜想」/水平降低）。</li>\n          <li>里贝特定理：若 E 模，则可降低水平推出矛盾 ⇒ 弗雷曲线非模。</li>\n          <li>谷山–志村–韦伊猜想（模性猜想）说：有理数域上椭圆曲线都来自模形式。怀尔斯证明了<strong>半稳定</strong>情形（1995，与泰勒修补漏洞）。</li>\n          <li>弗雷曲线半稳定 ⇒ 应是模的 ⇒ 与里贝特矛盾。</li>\n          <li>故反例不存在。费马大定理成立。</li>\n        </ol>\n        <p class=\"qed\">∎（现代路线的逻辑闭链；各黑盒为已证大定理）</p>\n      <div data-more-detail>\n    <h3>逻辑链（现代）</h3>\n    <div class=\"diagram\"><svg viewBox=\"0 0 520 80\" xmlns=\"http://www.w3.org/2000/svg\">\n      <rect width=\"520\" height=\"80\" fill=\"#0f172a\"/>\n      <text x=\"16\" y=\"45\" fill=\"#e2e8f0\" font-size=\"13\">费马反例 → 弗雷曲线 → 里贝特（非模）→ 怀尔斯（半稳定⇒模）→ 矛盾</text>\n    </svg></div>\n    <p>n=4 的无穷下降是初等可完成的部分（上图示意）；一般 n 依赖模形式。</p>\n    </div>", "deep": "\n        <h3>「空白太小」真相</h3>\n        <p>主流认为费马不可能拥有一般 n 的证明；他确实掌握 n=4。页边注更像对特例方法的过度自信。</p>\n        <h3>为什么难</h3>\n        <p>问题表述初等，但解空间受制于深刻的伽罗瓦表示与自守形式对应（朗兰兹纲领的一角）。</p>\n      ", "why": "\n        <p>推动椭圆曲线、模形式几十年发展。也是「把算术问题翻译成几何问题」的样板。</p>\n      ", "try": "\n        <ul>\n          <li>找几组勾股数；试着找 n=3 的小解，体会「找不到」。</li>\n          <li>用自己的话复述：费马反例 → 怪曲线 → 和「模性」打架 → 矛盾。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "fermat", "title": "Fermat's last theorem", "subtitle": "A three-hundred-year-old mystery left in the margin", "emoji": "📜", "iconClass": "rose", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["number theory", "Wiles", "elliptic curve"], "era": "1637 assertion; 1995 proof completed", "oneLiner": "Above cube, aⁿ+bⁿ=cⁿ can no longer find a positive integer solution. Middle school students can understand the questions, but the proof has taken three hundred years.", "people": [{"role": "assertion", "name": "Fermat", "years": "1637"}, {"role": "n=4 infinite decrease", "name": "Fermat", "years": "17th century"}, {"role": "fully proven", "name": "Andrew Wiles", "years": "1995"}], "related": ["euclid-primes", "fta-arith", "godel", "fermat-little"], "sections": {"story": "\n<p>Pythagorean number 3²+4²=5² Yes. Fermat wrote casually: No matter how large the exponent is, there will be no positive integer solution to this equation. He also said that \"the space is too small to write down the magic proof.\"</p>\n<p>Three hundred years later, Wiles proved it using modern tools. The margin notes are mostly his confidence in the special case; the general situation was far superior to the tools of the day.</p>\n<div class=\"fun-box\"><strong>contrast:</strong>There are infinite solutions for n=2; there are none for n≥3. From \"many\" to \"none\", it spans the entire modern number theory.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Cubic or more,<span data-latex=\"a^n+b^n=c^n\">aⁿ+bⁿ=cⁿ</span> There is no positive integer solution.</p>\n<div class=\"formula\" data-latex=\"\\nexists\\,a,b,c\\in\\mathbb{Z}^{+},\\ n\\ge 3:\\quad a^n+b^n=c^n\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">reducible to prime exponents</div>\n<p>If n=km, aⁿ+bⁿ=cⁿ ⇒ (aᵏ)ᵐ+(bᵏ)ᵐ=(cᵏ)ᵐ. Therefore, it only needs to be proved for n=4 and odd prime number p. n=4 was completed by Fermat; the core is the odd prime number p.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Outline of Theorem (Fermat, n=4)</div>\n<p>Prove by infinite descent that a⁴+b⁴=c² has no positive integer solution (stronger) and thus a⁴+b⁴=d⁴ has no solution. Idea: Constructing a strictly smaller positive integer solution from a set of solutions is contradictory to the \"infinite decline of positive integers\".</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Frey Curve</div>\n<p>If aᵖ+bᵖ=cᵖ is a non-trivial solution, the elliptic curve y² = x(x−aᵖ)(x+bᵖ) can be constructed, which has very special arithmetic properties (minimum discriminant, etc.).</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Infinite descent can be used for n=4; generally n turns the counterexample into a curve that should not exist, and then uses the last theorem to block the retreat.</p><div class=\"interactive\" data-widget=\"fermat-descent\"></div>\n<div class=\"proof-nav\"><span>n=4 dropped</span><span>Counterexample ⇒ Frey Curve</span><span>Modularity ⇒ Contradiction</span></div>\n<h3>Part 1: n=4 infinite descent (detailed skeleton)</h3>\n<ol class=\"steps\">\n<li>Study the stronger equation x⁴ + y⁴ = z². Given a positive integer solution, take the one with the smallest z.</li>\n<li>Rewrite x⁴ + y⁴ = z² as (z−x²)(z+x²)=y⁴ or treat it as Pythagorean: z² − (x²)² = (y²)², that is, (z−x²)(z+x²)=y⁴.</li>\n<li>Using the fine coprime analysis that gcd(z−x²,z+x²) divides 2x² and so on (standard number theory textbooks have complete elementary proofs), it can be shown that there is another set of smaller solutions (x₁,y₁,z₁) that satisfy the same type of equation.</li>\n<li>Minimal contradiction with z ⇒ No solution ⇒ Fermat n=4 is established.</li>\n</ol>\n<h3>Part II: Modern Strategies for Odd Primes (Wiles)</h3>\n<ol class=\"steps\">\n<li>Suppose that the odd prime number p and the positive integers a, b, c are coprime such that aᵖ+bᵖ=cᵖ.</li>\n<li>Frey (1986 Thoughts): Associative elliptic curve E: y²=x(x−aᵖ)(x+bᵖ). E is semi-stable, and its modular counterpart would violate certain level estimates if it existed (Libet later proved: E cannot be modular - \"ε conjecture\"/level reduction).</li>\n<li>Libet's theorem: If E is modular, the contradiction can be deduced at a reduced level ⇒ The Frey curve is non-modular.</li>\n<li>The Taniyama-Shimura-Weil conjecture (modularity conjecture) says: Elliptic curves in the rational number field all come from modular forms. Wiles proved<strong>semi-stable</strong>Situation (1995, patching holes with Taylor).</li>\n<li>The Frey curve is semi-stable ⇒ should be modular ⇒ contradicts Ribet.</li>\n<li>Therefore the counterexample does not exist. Fermat's last theorem holds true.</li>\n</ol>\n<p class=\"qed\">∎ (The logical closed chain of the modern route; each black box is a proved theorem)</p>\n<div data-more-detail=\"\">\n<h3>Logical chain (modern)</h3>\n<div class=\"diagram\"><svg viewbox=\"0 0 520 80\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#0f172a\" height=\"80\" width=\"520\"></rect>\n<text fill=\"#e2e8f0\" font-size=\"13\" x=\"16\" y=\"45\">Fermat counterexample → Frey curve → Ribet (non-modular) → Wiles (semi-stable ⇒ modular) → contradiction</text>\n</svg></div>\n<p>The infinite descent of n=4 is an elementary achievable part (illustrated in the figure above); generally n depends on the modular form.</p>\n</div>", "deep": "\n<h3>The truth about \"the white space is too small\"</h3>\n<p>It is generally accepted that Fermat could not have had a proof for general n; he did have n = 4. Marginal notes are more like overconfidence in special-case methods.</p>\n<h3>Why is it difficult</h3>\n<p>The problem formulation is elementary, but the solution space is subject to profound Galois representations and automorphic formal correspondences (a corner of the Langlands program).</p>\n", "why": "\n<p>Promoted the development of elliptic curves and modular forms for decades. It is also a model for \"translating arithmetic problems into geometric problems\".</p>\n", "try": "\n<ul>\n<li>Find several sets of Pythagorean numbers; try to find a small solution for n=3 and experience \"can't find it\".</li>\n<li>Retell in your own words: Fermat’s counterexample → Strange curve → Fighting with “modularity” → Contradiction.</li>\n</ul>\n"}, "field": "math"}}, "title": "Fermat's last theorem", "subtitle": "A three-hundred-year-old mystery left in the margin", "difficultyLabel": "Hardcore challenge", "tags": ["number theory", "Wiles", "elliptic curve"], "era": "1637 assertion; 1995 proof completed", "oneLiner": "Above cube, aⁿ+bⁿ=cⁿ can no longer find a positive integer solution. Middle school students can understand the questions, but the proof has taken three hundred years.", "people": [{"role": "assertion", "name": "Fermat", "years": "1637"}, {"role": "n=4 infinite decrease", "name": "Fermat", "years": "17th century"}, {"role": "fully proven", "name": "Andrew Wiles", "years": "1995"}], "sections": {"story": "\n<p>Pythagorean number 3²+4²=5² Yes. Fermat wrote casually: No matter how large the exponent is, there will be no positive integer solution to this equation. He also said that \"the space is too small to write down the magic proof.\"</p>\n<p>Three hundred years later, Wiles proved it using modern tools. The margin notes are mostly his confidence in the special case; the general situation was far superior to the tools of the day.</p>\n<div class=\"fun-box\"><strong>contrast:</strong>There are infinite solutions for n=2; there are none for n≥3. From \"many\" to \"none\", it spans the entire modern number theory.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Cubic or more,<span data-latex=\"a^n+b^n=c^n\">aⁿ+bⁿ=cⁿ</span> There is no positive integer solution.</p>\n<div class=\"formula\" data-latex=\"\\nexists\\,a,b,c\\in\\mathbb{Z}^{+},\\ n\\ge 3:\\quad a^n+b^n=c^n\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">reducible to prime exponents</div>\n<p>If n=km, aⁿ+bⁿ=cⁿ ⇒ (aᵏ)ᵐ+(bᵏ)ᵐ=(cᵏ)ᵐ. Therefore, it only needs to be proved for n=4 and odd prime number p. n=4 was completed by Fermat; the core is the odd prime number p.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Outline of Theorem (Fermat, n=4)</div>\n<p>Prove by infinite descent that a⁴+b⁴=c² has no positive integer solution (stronger) and thus a⁴+b⁴=d⁴ has no solution. Idea: Constructing a strictly smaller positive integer solution from a set of solutions is contradictory to the \"infinite decline of positive integers\".</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Frey Curve</div>\n<p>If aᵖ+bᵖ=cᵖ is a non-trivial solution, the elliptic curve y² = x(x−aᵖ)(x+bᵖ) can be constructed, which has very special arithmetic properties (minimum discriminant, etc.).</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Infinite descent can be used for n=4; generally n turns the counterexample into a curve that should not exist, and then uses the last theorem to block the retreat.</p><div class=\"interactive\" data-widget=\"fermat-descent\"></div>\n<div class=\"proof-nav\"><span>n=4 dropped</span><span>Counterexample ⇒ Frey Curve</span><span>Modularity ⇒ Contradiction</span></div>\n<h3>Part 1: n=4 infinite descent (detailed skeleton)</h3>\n<ol class=\"steps\">\n<li>Study the stronger equation x⁴ + y⁴ = z². Given a positive integer solution, take the one with the smallest z.</li>\n<li>Rewrite x⁴ + y⁴ = z² as (z−x²)(z+x²)=y⁴ or treat it as Pythagorean: z² − (x²)² = (y²)², that is, (z−x²)(z+x²)=y⁴.</li>\n<li>Using the fine coprime analysis that gcd(z−x²,z+x²) divides 2x² and so on (standard number theory textbooks have complete elementary proofs), it can be shown that there is another set of smaller solutions (x₁,y₁,z₁) that satisfy the same type of equation.</li>\n<li>Minimal contradiction with z ⇒ No solution ⇒ Fermat n=4 is established.</li>\n</ol>\n<h3>Part II: Modern Strategies for Odd Primes (Wiles)</h3>\n<ol class=\"steps\">\n<li>Suppose that the odd prime number p and the positive integers a, b, c are coprime such that aᵖ+bᵖ=cᵖ.</li>\n<li>Frey (1986 Thoughts): Associative elliptic curve E: y²=x(x−aᵖ)(x+bᵖ). E is semi-stable, and its modular counterpart would violate certain level estimates if it existed (Libet later proved: E cannot be modular - \"ε conjecture\"/level reduction).</li>\n<li>Libet's theorem: If E is modular, the contradiction can be deduced at a reduced level ⇒ The Frey curve is non-modular.</li>\n<li>The Taniyama-Shimura-Weil conjecture (modularity conjecture) says: Elliptic curves in the rational number field all come from modular forms. Wiles proved<strong>semi-stable</strong>Situation (1995, patching holes with Taylor).</li>\n<li>The Frey curve is semi-stable ⇒ should be modular ⇒ contradicts Ribet.</li>\n<li>Therefore the counterexample does not exist. Fermat's last theorem holds true.</li>\n</ol>\n<p class=\"qed\">∎ (The logical closed chain of the modern route; each black box is a proved theorem)</p>\n<div data-more-detail=\"\">\n<h3>Logical chain (modern)</h3>\n<div class=\"diagram\"><svg viewbox=\"0 0 520 80\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#0f172a\" height=\"80\" width=\"520\"></rect>\n<text fill=\"#e2e8f0\" font-size=\"13\" x=\"16\" y=\"45\">Fermat counterexample → Frey curve → Ribet (non-modular) → Wiles (semi-stable ⇒ modular) → contradiction</text>\n</svg></div>\n<p>The infinite descent of n=4 is an elementary achievable part (illustrated in the figure above); generally n depends on the modular form.</p>\n</div>", "deep": "\n<h3>The truth about \"the white space is too small\"</h3>\n<p>It is generally accepted that Fermat could not have had a proof for general n; he did have n = 4. Marginal notes are more like overconfidence in special-case methods.</p>\n<h3>Why is it difficult</h3>\n<p>The problem formulation is elementary, but the solution space is subject to profound Galois representations and automorphic formal correspondences (a corner of the Langlands program).</p>\n", "why": "\n<p>Promoted the development of elliptic curves and modular forms for decades. It is also a model for \"translating arithmetic problems into geometric problems\".</p>\n", "try": "\n<ul>\n<li>Find several sets of Pythagorean numbers; try to find a small solution for n=3 and experience \"can't find it\".</li>\n<li>Retell in your own words: Fermat’s counterexample → Strange curve → Fighting with “modularity” → Contradiction.</li>\n</ul>\n"}}, {"id": "fta", "field": "math", "difficulty": "hard", "emoji": "🧩", "iconClass": "", "related": ["euler-identity", "ivt", "ftc"], "__i18n": {"zh": {"id": "fta", "title": "代数基本定理", "subtitle": "解方程不用再发明更新的数", "emoji": "🧩", "iconClass": "", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["代数", "复数", "高斯"], "era": "高斯 1799 等", "oneLiner": "多项式方程在复数里一定有根；n 次方程就算重根也正好 n 个。", "people": [{"role": "重要证明", "name": "高斯", "years": "1777–1855"}, {"role": "更早探索", "name": "达朗贝尔、欧拉", "years": "18 世纪"}], "related": ["euler-identity", "ivt", "ftc"], "sections": {"story": "\n        <p>实数里 x²+1=0 没解。一旦允许虚数 i，每个非常数多项式都有根。复数对「解多项式」来说已经够大了。</p>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>复数里，多项式方程一定有根；n 次就有 n 个根（计重数）。</p>\n        <div class=\"formula\" data-latex=\"p(z)=a_n z^n+\\cdots+a_0,\\ a_n\\ne 0,\\ n\\ge 1\\ \\Rightarrow\\ \\exists z_0:\\ p(z_0)=0\"></div>\n        <div class=\"formula\" data-latex=\"p(z)=a_n(z-r_1)\\cdots(z-r_n)\"></div>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理 1（模长趋于无穷）</div>\n          <p>|z|→∞ 时 |p(z)|→∞。因 |p(z)| ≥ |aₙ| |z|ⁿ (1 − C/|z| − …) 对大 |z| 成立。</p>\n        </div>\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理 2（最小值存在）</div>\n          <p>|p| 连续，在足够大的闭圆盘上达到最小值；由引理 1 最小值不会只在边界外逃逸，故 |p| 在 ℂ 上达到全局最小。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>若没有根，1/p 会处处光滑且在远处很小，从而有最小值；在最小值附近又能把它压得更小——矛盾。</p><div class=\"interactive\" data-widget=\"fta-roots\"></div>\n        <div class=\"proof-nav\"><span>最小模</span><span>若非零则局部可降</span><span>矛盾</span></div>\n        <ol class=\"steps\">\n          <li>由引理 2，存在 z₀ 使 |p(z₀)| 最小。</li>\n          <li>若 p(z₀)=0，完毕。反设 p(z₀)≠0。</li>\n          <li>写 p(z₀+w)=p(z₀) + bₖ wᵏ + 高阶项，其中 bₖ≠0 是第一个非零系数（k≥1）。</li>\n          <li>选择方向 θ 使 bₖ (re^{iθ})ᵏ 与 p(z₀) 反向，即\n            <div class=\"calc-line\" data-latex=\"b_{k} e^{ik\\theta } / |b_{k}| = - p(z_{0})/|p(z_{0})|\"></div>\n            取 w = r e^{iθ}，r 充分小，则\n            <div class=\"calc-line\" data-latex=\"p(z_{0}+w) = p(z_{0}) ( 1 - c r^{k} + o(r^{k}) )\"></div>\n            其中 c>0，从而 |p(z₀+w)| lt  |p(z₀)|。\n          </li>\n          <li>与最小性矛盾。故 p(z₀)=0。</li>\n          <li>用多项式除法提出 (z−z₀)，对次数归纳得完全分解。</li>\n        </ol>\n        <p class=\"qed\">∎</p>\n      ", "deep": "\n        <h3>拓扑证明一句话</h3>\n        <p>对大 R，z↦p(z)/|p(z)| 把 |z|=R 映到单位圆且度数为 n≥1，故不能延拓到圆盘内无零点的连续映射——否则度数应为 0。</p>\n        <h3>与实系数</h3>\n        <p>实系数多项式的非实根成共轭对出现；奇次实多项式必有实根（IVT）。</p>\n      ", "why": "\n        <p>特征方程、电路极点、信号分析，默认在复数上拆因式——都靠这张保票。</p>\n      ", "try": "\n        <ul>\n          <li>解 x²+1=0，认识 i；再解 x²−2x+2=0。</li>\n          <li>看交互图：zⁿ=1 的 n 个根均匀站在单位圆上。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "fta", "title": "fundamental theorem of algebra", "subtitle": "Solve equations without inventing newer numbers", "emoji": "🧩", "iconClass": "", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["algebra", "plural", "Gaussian"], "era": "Gaussian 1799 etc.", "oneLiner": "Polynomial equations must have roots in complex numbers; an equation of degree n has exactly n roots even if it is multiple.", "people": [{"role": "important proof", "name": "Gaussian", "years": "1777–1855"}, {"role": "Explore earlier", "name": "D'Alembert, Euler", "years": "18th century"}], "related": ["euler-identity", "ivt", "ftc"], "sections": {"story": "\n<p>There is no solution for x²+1=0 in real numbers. Once imaginary i is allowed, every non-constant polynomial has roots. Complex numbers are big enough to \"solve polynomials\".</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>In complex numbers, polynomial equations must have roots; n times there are n roots (multiplicity).</p>\n<div class=\"formula\" data-latex=\"p(z)=a_n z^n+\\cdots+a_0,\\ a_n\\ne 0,\\ n\\ge 1\\ \\Rightarrow\\ \\exists z_0:\\ p(z_0)=0\"></div>\n<div class=\"formula\" data-latex=\"p(z)=a_n(z-r_1)\\cdots(z-r_n)\"></div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma 1 (module length tends to infinity)</div>\n<p>|z|→∞ when |p(z)|→∞. Because |p(z)| ≥ |aₙ| |z|ⁿ (1 − C/|z| − …) holds for large |z|.</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma 2 (minimum exists)</div>\n<p>|p| is continuous and reaches the minimum value on a sufficiently large closed disk; according to Lemma 1, the minimum value will not escape only outside the boundary, so |p| reaches the global minimum on ℂ.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>If there are no roots, 1/p will be smooth everywhere and very small in the distance, thus having a minimum value; near the minimum value, it can be pressed even smaller - a contradiction.</p><div class=\"interactive\" data-widget=\"fta-roots\"></div>\n<div class=\"proof-nav\"><span>Minimum module</span><span>If non-zero, it can be reduced locally</span><span>contradiction</span></div>\n<ol class=\"steps\">\n<li>By Lemma 2, there exists z₀ that minimizes |p(z₀)|.</li>\n<li>If p(z₀)=0, finished. Suppose p(z₀)≠0.</li>\n<li>Write p(z₀+w)=p(z₀) + bₖ wᵏ + higher order terms, where bₖ≠0 is the first non-zero coefficient (k≥1).</li>\n<li>Choose the direction θ so that bₖ (re^{iθ})ᵏ is opposite to p(z₀), that is\n            <div class=\"calc-line\" data-latex=\"b_{k} e^{ik\\theta } / |b_{k}| = - p(z_{0})/|p(z_{0})|\"></div>\n            Taking w = r e^{iθ}, r is sufficiently small, then\n            <div class=\"calc-line\" data-latex=\"p(z_{0}+w) = p(z_{0}) ( 1 - c r^{k} + o(r^{k}) )\"></div>\n            where c&gt;0, so |p(z₀+w)| lt |p(z₀)|.\n          </li>\n<li>Contradictory to minimality. Therefore p(z₀)=0.</li>\n<li>Propose (z−z₀) using polynomial division, and get a complete decomposition by induction on degrees.</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<h3>Topological proof in one sentence</h3>\n<p>For large R, z↦p(z)/|p(z)| maps |z|=R to the unit circle with degree n≥1, so it cannot be extended to a continuous mapping without zero points in the disk - otherwise the degree should be 0.</p>\n<h3>and real coefficients</h3>\n<p>The non-real roots of polynomials with real coefficients appear in conjugate pairs; real polynomials of odd degree must have real roots (IVT).</p>\n", "why": "\n<p>Characteristic equations, circuit poles, signal analysis, and factoring complex numbers by default—all rely on this guarantee.</p>\n", "try": "\n<ul>\n<li>Solve x²+1=0 and recognize i; then solve x²−2x+2=0.</li>\n<li>Look at the interaction diagram: the n roots of zⁿ=1 stand uniformly on the unit circle.</li>\n</ul>\n"}, "field": "math"}}, "title": "fundamental theorem of algebra", "subtitle": "Solve equations without inventing newer numbers", "difficultyLabel": "Hardcore challenge", "tags": ["algebra", "plural", "Gaussian"], "era": "Gaussian 1799 etc.", "oneLiner": "Polynomial equations must have roots in complex numbers; an equation of degree n has exactly n roots even if it is multiple.", "people": [{"role": "important proof", "name": "Gaussian", "years": "1777–1855"}, {"role": "Explore earlier", "name": "D'Alembert, Euler", "years": "18th century"}], "sections": {"story": "\n<p>There is no solution for x²+1=0 in real numbers. Once imaginary i is allowed, every non-constant polynomial has roots. Complex numbers are big enough to \"solve polynomials\".</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>In complex numbers, polynomial equations must have roots; n times there are n roots (multiplicity).</p>\n<div class=\"formula\" data-latex=\"p(z)=a_n z^n+\\cdots+a_0,\\ a_n\\ne 0,\\ n\\ge 1\\ \\Rightarrow\\ \\exists z_0:\\ p(z_0)=0\"></div>\n<div class=\"formula\" data-latex=\"p(z)=a_n(z-r_1)\\cdots(z-r_n)\"></div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma 1 (module length tends to infinity)</div>\n<p>|z|→∞ when |p(z)|→∞. Because |p(z)| ≥ |aₙ| |z|ⁿ (1 − C/|z| − …) holds for large |z|.</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma 2 (minimum exists)</div>\n<p>|p| is continuous and reaches the minimum value on a sufficiently large closed disk; according to Lemma 1, the minimum value will not escape only outside the boundary, so |p| reaches the global minimum on ℂ.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>If there are no roots, 1/p will be smooth everywhere and very small in the distance, thus having a minimum value; near the minimum value, it can be pressed even smaller - a contradiction.</p><div class=\"interactive\" data-widget=\"fta-roots\"></div>\n<div class=\"proof-nav\"><span>Minimum module</span><span>If non-zero, it can be reduced locally</span><span>contradiction</span></div>\n<ol class=\"steps\">\n<li>By Lemma 2, there exists z₀ that minimizes |p(z₀)|.</li>\n<li>If p(z₀)=0, finished. Suppose p(z₀)≠0.</li>\n<li>Write p(z₀+w)=p(z₀) + bₖ wᵏ + higher order terms, where bₖ≠0 is the first non-zero coefficient (k≥1).</li>\n<li>Choose the direction θ so that bₖ (re^{iθ})ᵏ is opposite to p(z₀), that is\n            <div class=\"calc-line\" data-latex=\"b_{k} e^{ik\\theta } / |b_{k}| = - p(z_{0})/|p(z_{0})|\"></div>\n            Taking w = r e^{iθ}, r is sufficiently small, then\n            <div class=\"calc-line\" data-latex=\"p(z_{0}+w) = p(z_{0}) ( 1 - c r^{k} + o(r^{k}) )\"></div>\n            where c&gt;0, so |p(z₀+w)| lt |p(z₀)|.\n          </li>\n<li>Contradictory to minimality. Therefore p(z₀)=0.</li>\n<li>Propose (z−z₀) using polynomial division, and get a complete decomposition by induction on degrees.</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<h3>Topological proof in one sentence</h3>\n<p>For large R, z↦p(z)/|p(z)| maps |z|=R to the unit circle with degree n≥1, so it cannot be extended to a continuous mapping without zero points in the disk - otherwise the degree should be 0.</p>\n<h3>and real coefficients</h3>\n<p>The non-real roots of polynomials with real coefficients appear in conjugate pairs; real polynomials of odd degree must have real roots (IVT).</p>\n", "why": "\n<p>Characteristic equations, circuit poles, signal analysis, and factoring complex numbers by default—all rely on this guarantee.</p>\n", "try": "\n<ul>\n<li>Solve x²+1=0 and recognize i; then solve x²−2x+2=0.</li>\n<li>Look at the interaction diagram: the n roots of zⁿ=1 stand uniformly on the unit circle.</li>\n</ul>\n"}}, {"id": "pigeonhole", "field": "math", "difficulty": "easy", "emoji": "🕊️", "iconClass": "green", "related": ["euclid-primes", "crt", "four-color"], "__i18n": {"zh": {"id": "pigeonhole", "title": "鸽巢原理", "subtitle": "最简单却最锋利的「一定存在」", "emoji": "🕊️", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["组合", "离散", "狄利克雷"], "era": "19 世纪明确；思想古老", "oneLiner": "鸽子比笼子多一只，就一定有笼子挤了至少两只——不用说出是哪一只。", "people": [{"role": "数论中系统使用", "name": "狄利克雷", "years": "1805–1859"}], "related": ["euclid-primes", "crt", "four-color"], "sections": {"story": "\n        <p>听起来像废话，却能推出很强的结论：367 人里必有两人生日相同；抽屉里拿袜子保证同色……不用把东西找出来，逻辑保证「一定有」。</p>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>鸽子比笼子多，就一定有笼子挤了至少两只。</p>\n        <div class=\"formula\" data-latex=\"m\\text{ 物放入 }n\\text{ 盒}\\ \\Rightarrow\\ \\text{某盒}\\ge\\left\\lceil\\frac{m}{n}\\right\\rceil\"></div>\n        <p>基本情形：<span data-latex=\"m=n+1\">m=n+1</span> 时某盒至少 2 个。</p>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>反证：如果每盒都很少，总数会装不下你放进去的那些——所以必有一盒够多。</p><div class=\"interactive\" data-widget=\"pigeonhole\"></div>\n        <div class=\"proof-nav\"><span>反证</span><span>加强用求和</span></div>\n        <h3>基本形式</h3>\n        <ol class=\"steps\">\n          <li>反设每盒 ≤1 物 ⇒ 总物 ≤n，与有 n+1 物矛盾。</li>\n        </ol>\n        <h3>加强形式</h3>\n        <ol class=\"steps\">\n          <li>反设每盒 ≤ ⌈m/n⌉ − 1 ≤ m/n 的某整数上界。更干净：设每盒 ≤ k−1，而 k=⌈m/n⌉，则总物 ≤ n(k−1)。</li>\n          <li>因 k−1 lt  m/n，有 n(k−1) lt  m，与总物 =m 矛盾。</li>\n          <li>故某盒 ≥k=⌈m/n⌉。</li>\n        </ol>\n        <p class=\"qed\">∎</p>\n        <h3>典型应用：狄利克雷逼近（细节）</h3>\n        <ol class=\"steps\">\n          <li>设 α 实数。考虑 {0·α}, {1·α}, …, {n·α} 的小数部分，落入 n 个区间 [0,1/n),[1/n,2/n),…。</li>\n          <li>有 n+1 个数、n 个间隔 ⇒ 某两 jgt i 落入同一间隔，| (j−i)α − 整数 | lt  1/n。</li>\n          <li>令 q=j−i≤n，则存在 p 使 |α−p/q| lt  1/(q n) ≤ 1/q²。</li>\n        </ol>\n      ", "deep": "\n        <h3>应用：同一子集和</h3>\n        <p>从 {1,…,2n} 取 n+1 个数，必有两数互素？（不一定用鸽巢直接）— 经典：必有一数整除另一数：按「最大奇因数」分盒，有 n 个奇盒子 1,3,…,2n−1，n+1 个数必两数同盒，则相差 2 的幂倍，较大者被比较者整除关系可建立。</p>\n      ", "why": "\n        <p>训练非构造性存在感。算法下界、哈希碰撞，都是同一类思想。</p>\n      ", "try": "\n        <ul>\n          <li>黑白袜各很多，最少拿几只保证一双同色？</li>\n          <li>用交互图把鸽子一只只放进盒子，看何时被迫挤堆。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "pigeonhole", "title": "pigeonhole principle", "subtitle": "The simplest but sharpest \"must exist\"", "emoji": "🕊️", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["combination", "Discrete", "Dirichlet"], "era": "19th century clear; ancient ideas", "oneLiner": "If there is one more pigeon than a cage, there must be a cage crowded with at least two pigeons - there is no need to tell which one it is.", "people": [{"role": "System usage in number theory", "name": "Dirichlet", "years": "1805–1859"}], "related": ["euclid-primes", "crt", "four-color"], "sections": {"story": "\n<p>It sounds like nonsense, but it can lead to a strong conclusion: there must be two people with the same birthday among 367 people; if you put socks in the drawer, they are guaranteed to be of the same color... There is no need to find the things, logic guarantees that \"there must be\".</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>If there are more pigeons than cages, there must be at least two cages crowded.</p>\n<div class=\"formula\" data-latex=\"m\\text{ 物放入 }n\\text{ 盒}\\ \\Rightarrow\\ \\text{某盒}\\ge\\left\\lceil\\frac{m}{n}\\right\\rceil\"></div>\n<p>Basic situation:<span data-latex=\"m=n+1\">m=n+1</span> There are at least 2 pieces in a certain box.</p>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Counter-evidence: If each box is small, the total will not hold the ones you put in - so there must be one box that is enough.</p><div class=\"interactive\" data-widget=\"pigeonhole\"></div>\n<div class=\"proof-nav\"><span>Counterevidence</span><span>Strengthen the use of summation</span></div>\n<h3>basic form</h3>\n<ol class=\"steps\">\n<li>Contrary to the assumption that each box contains ≤1 items ⇒ the total items ≤n, which is contradictory to the fact that there are n+1 items.</li>\n</ol>\n<h3>strengthen form</h3>\n<ol class=\"steps\">\n<li>Conversely suppose that each box ≤ ⌈m/n⌉ − 1 ≤ some integer upper bound of m/n. Cleaner: Assume each box ≤ k−1, and k=⌈m/n⌉, then the total items ≤ n(k−1).</li>\n<li>Because k−1 lt m/n, there is n(k−1) lt m, which is inconsistent with the total object =m.</li>\n<li>Therefore, a certain box ≥k=⌈m/n⌉.</li>\n</ol>\n<p class=\"qed\">∎</p>\n<h3>Typical application: Dirichlet approximation (details)</h3>\n<ol class=\"steps\">\n<li>Let α be a real number. Consider the decimal part of {0·α}, {1·α}, …, {n·α}, falling into n intervals [0,1/n), [1/n,2/n),….</li>\n<li>There are n+1 numbers and n intervals ⇒ If two jgt i fall into the same interval, | (j−i)α − integer | lt 1/n.</li>\n<li>Let q=j−i≤n, then there exists p such that |α−p/q| lt 1/(q n) ≤ 1/q².</li>\n</ol>\n", "deep": "\n<h3>Application: same subset and</h3>\n<p>Taking n+1 numbers from {1,…,2n}, there must be two numbers that are relatively prime? (Not necessarily directly using pigeonhole) - Classic: One number must be evenly divisible by another number: according to the \"largest odd factor\" box division, there are n odd boxes 1,3,...,2n-1, n+1 numbers must be two in the same box, then the difference is a power of 2, and the larger one can be divisible by the compared one.</p>\n", "why": "\n<p>Training non-constructive presence. Algorithm lower bounds and hash collisions are all the same type of ideas.</p>\n", "try": "\n<ul>\n<li>There are a lot of black and white socks. How many are at least a few to guarantee a pair of the same color?</li>\n<li>Use an interactive diagram to put the pigeons into the box one by one and see when they are forced to crowd.</li>\n</ul>\n"}, "field": "math"}}, "title": "pigeonhole principle", "subtitle": "The simplest but sharpest \"must exist\"", "difficultyLabel": "Easy to use", "tags": ["combination", "Discrete", "Dirichlet"], "era": "19th century clear; ancient ideas", "oneLiner": "If there is one more pigeon than a cage, there must be a cage crowded with at least two pigeons - there is no need to tell which one it is.", "people": [{"role": "System usage in number theory", "name": "Dirichlet", "years": "1805–1859"}], "sections": {"story": "\n<p>It sounds like nonsense, but it can lead to a strong conclusion: there must be two people with the same birthday among 367 people; if you put socks in the drawer, they are guaranteed to be of the same color... There is no need to find the things, logic guarantees that \"there must be\".</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>If there are more pigeons than cages, there must be at least two cages crowded.</p>\n<div class=\"formula\" data-latex=\"m\\text{ 物放入 }n\\text{ 盒}\\ \\Rightarrow\\ \\text{某盒}\\ge\\left\\lceil\\frac{m}{n}\\right\\rceil\"></div>\n<p>Basic situation:<span data-latex=\"m=n+1\">m=n+1</span> There are at least 2 pieces in a certain box.</p>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Counter-evidence: If each box is small, the total will not hold the ones you put in - so there must be one box that is enough.</p><div class=\"interactive\" data-widget=\"pigeonhole\"></div>\n<div class=\"proof-nav\"><span>Counterevidence</span><span>Strengthen the use of summation</span></div>\n<h3>basic form</h3>\n<ol class=\"steps\">\n<li>Contrary to the assumption that each box contains ≤1 items ⇒ the total items ≤n, which is contradictory to the fact that there are n+1 items.</li>\n</ol>\n<h3>strengthen form</h3>\n<ol class=\"steps\">\n<li>Conversely suppose that each box ≤ ⌈m/n⌉ − 1 ≤ some integer upper bound of m/n. Cleaner: Assume each box ≤ k−1, and k=⌈m/n⌉, then the total items ≤ n(k−1).</li>\n<li>Because k−1 lt m/n, there is n(k−1) lt m, which is inconsistent with the total object =m.</li>\n<li>Therefore, a certain box ≥k=⌈m/n⌉.</li>\n</ol>\n<p class=\"qed\">∎</p>\n<h3>Typical application: Dirichlet approximation (details)</h3>\n<ol class=\"steps\">\n<li>Let α be a real number. Consider the decimal part of {0·α}, {1·α}, …, {n·α}, falling into n intervals [0,1/n), [1/n,2/n),….</li>\n<li>There are n+1 numbers and n intervals ⇒ If two jgt i fall into the same interval, | (j−i)α − integer | lt 1/n.</li>\n<li>Let q=j−i≤n, then there exists p such that |α−p/q| lt 1/(q n) ≤ 1/q².</li>\n</ol>\n", "deep": "\n<h3>Application: same subset and</h3>\n<p>Taking n+1 numbers from {1,…,2n}, there must be two numbers that are relatively prime? (Not necessarily directly using pigeonhole) - Classic: One number must be evenly divisible by another number: according to the \"largest odd factor\" box division, there are n odd boxes 1,3,...,2n-1, n+1 numbers must be two in the same box, then the difference is a power of 2, and the larger one can be divisible by the compared one.</p>\n", "why": "\n<p>Training non-constructive presence. Algorithm lower bounds and hash collisions are all the same type of ideas.</p>\n", "try": "\n<ul>\n<li>There are a lot of black and white socks. How many are at least a few to guarantee a pair of the same color?</li>\n<li>Use an interactive diagram to put the pigeons into the box one by one and see when they are forced to crowd.</li>\n</ul>\n"}}, {"id": "godel", "field": "math", "difficulty": "hard", "emoji": "🪞", "iconClass": "purple", "related": ["cantor", "fermat", "euclid-primes"], "__i18n": {"zh": {"id": "godel", "title": "哥德尔不完备定理", "subtitle": "系统没法把所有真话一网打尽", "emoji": "🪞", "iconClass": "purple", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["逻辑", "元数学", "基础"], "era": "1931", "oneLiner": "足够强的数学系统里，总有「真，但系统内证不出来」的句子；系统也不能自己证明自己没矛盾。", "people": [{"role": "证明", "name": "库尔特·哥德尔", "years": "1931"}, {"role": "背景纲领", "name": "希尔伯特", "years": "20 世纪初"}], "related": ["cantor", "fermat", "euclid-primes"], "sections": {"story": "\n        <p>20 世纪初有人希望：定一套公理，从此所有数学真命题都能机械证明，还保证不打架。哥德尔证明：只要系统能谈整数算术且自身一致，这个梦就做不成。</p>\n        <div class=\"fun-box\"><strong>剧透：</strong>他造出一种数学版「这句话不可被证明」——若系统靠谱，这句话就真，但系统说不出口。</div>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>足够强又一致的数学系统里，总有「真，但系统内证不出来」的句子；系统也不能自己证明自己没矛盾。</p>\n        <p><strong>第一不完备定理（人话）：</strong>系统够强、没自相矛盾时，一定存在一句「真话」G，但系统既推不出 G，也推不出「非 G」。</p>\n        <div class=\"formula\" data-latex=\"T\\nvdash G\\quad\\text{且}\\quad T\\nvdash \\neg G\"></div>\n        <p>在标准自然数模型里，G 其实是真的。</p>\n        <p><strong>第二不完备定理（人话）：</strong>这样的系统无法在内部证明「我自己是一致的」。</p>\n        <div class=\"formula\" data-latex=\"T\\nvdash \\mathrm{Con}(T)\"></div>\n        <p>其中 <span data-latex=\"\\mathrm{Con}(T)\">Con(T)</span> 表示「T 一致」这句话的形式化。</p>\n      ", "setup": "\n        <div class=\"def-box\">\n          <div class=\"def-title\">哥德尔编码（在干什么）</div>\n          <p>把符号、公式、证明步骤都编成自然数，于是「证明」变成数论关系，系统可以「谈论自己」。</p>\n          <p>谓词 <span data-latex=\"\\mathrm{Proof}_T(y,x)\">Proof_T(y,x)</span>：读作「y 是语句 x 的一个 T-证明」。</p>\n          <div class=\"calc-line\" data-latex=\"\\mathrm{Provable}_T(x)\\ :=\\ \\exists y\\,\\mathrm{Proof}_T(y,x)\"></div>\n          <p>即：存在某个证明码 y，使得 y 证明了 x。</p>\n        </div>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"def-title\">对角线引理（不动点引理）</div>\n          <p>对任意公式 <span data-latex=\"\\varphi(x)\">φ(x)</span>，都能找到一句话 <span data-latex=\"\\psi\">ψ</span>，使得系统可证：</p>\n          <div class=\"formula\" data-latex=\"T\\vdash \\psi \\leftrightarrow \\varphi(\\ulcorner\\psi\\urcorner)\"></div>\n          <p>其中 <span data-latex=\"\\ulcorner\\psi\\urcorner\">⌜ψ⌝</span> 是 ψ 的哥德尔数（编码）。直觉：ψ 在说「关于我自己的编码，有性质 φ」。</p>\n        </div>\n      ", "proof": "\n        <p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>造一句「这句话不可证」；若系统靠谱，它就真，但系统说不出口。</p>\n        <div class=\"proof-nav\"><span>构造 G</span><span>不可证</span><span>真理性</span><span>第二定理</span></div>\n        <h3>第一定理（纲要）</h3>\n        <ol class=\"steps\">\n          <li>对 <span data-latex=\"\\varphi(x)=\\neg\\mathrm{Provable}_T(x)\">φ(x)=¬Provable_T(x)</span> 用对角线引理，得到 G 满足\n            <div class=\"calc-line\" data-latex=\"T\\vdash G \\leftrightarrow \\neg\\mathrm{Provable}_T(\\ulcorner G\\urcorner)\"></div>\n            即 G 说：「G 不可证。」\n          </li>\n          <li><strong>不能有</strong> <span data-latex=\"T\\vdash G\">T ⊢ G</span>：若有，则 G 可证，与 G 的含义矛盾（在一致系统中）。\n            <div class=\"calc-line\" data-latex=\"T\\vdash G \\ \\Rightarrow\\ T\\text{ 不一致}\"></div>\n          </li>\n          <li><strong>也不能有</strong> <span data-latex=\"T\\vdash\\neg G\">T ⊢ ¬G</span>（在合适的一致性假设下）。罗瑟改进可减弱假设。</li>\n          <li>因此 <span data-latex=\"T\\nvdash G\">T ⊬ G</span>，于是「G 不可证」为真，而 G 正说这件事 → G 为真。</li>\n        </ol>\n        <h3>第二定理（纲要）</h3>\n        <ol class=\"steps\">\n          <li>可形式化得到：<div class=\"calc-line\" data-latex=\"T\\vdash \\mathrm{Con}(T)\\rightarrow G\"></div></li>\n          <li>若 <span data-latex=\"T\\vdash\\mathrm{Con}(T)\">T ⊢ Con(T)</span>，则 <span data-latex=\"T\\vdash G\">T ⊢ G</span>，与第一定理矛盾。</li>\n          <li>故 <div class=\"calc-line\" data-latex=\"T\\nvdash \\mathrm{Con}(T)\"></div></li>\n        </ol>\n        <p class=\"qed\">∎</p>\n      ", "deep": "\n        <h3>罗瑟改进</h3>\n        <p>只需简单一致性，不必 ω-一致性：用「不存在更小编号的 ¬G 证明」构造罗瑟句。</p>\n        <h3>与停机问题</h3>\n        <p>图灵：不存在算法判定任意程序是否停机。证明也用对角自指。两者共同划定「形式/算法」边界。</p>\n        <div class=\"warn-box\">不完备 ≠ 数学无用。它限制的是「单一形式系统包打天下」的野心。</div>\n      ", "why": "\n        <p>划定「形式证明」的边界。和计算机「有些问题算法永远判不完」是表亲。</p>\n      ", "try": "\n        <ul>\n          <li>讨论：「真」「可证」「电脑能判定」是不是一回事——各举生活例子。</li>\n          <li>了解停机问题：程序能否判断另一程序会停。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "godel", "title": "Gödel's incompleteness theorem", "subtitle": "The system cannot catch all the truth in one go", "emoji": "🪞", "iconClass": "purple", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["logic", "metamathematics", "Base"], "era": "1931", "oneLiner": "In a sufficiently strong mathematical system, there will always be sentences that are \"true, but cannot be proven within the system\"; the system cannot prove that it has no contradictions.", "people": [{"role": "prove", "name": "Kurt Gödel", "years": "1931"}, {"role": "Background program", "name": "Hilbert", "years": "early 20th century"}], "related": ["cantor", "fermat", "euclid-primes"], "sections": {"story": "\n<p>At the beginning of the 20th century, some people hoped to establish a set of axioms so that all true mathematical propositions could be mechanically proved, and there would be no fights. Gödel proved that as long as the system can talk about integer arithmetic and is consistent with itself, this dream will not come true.</p>\n<div class=\"fun-box\"><strong>Spoilers:</strong>He created a mathematical version of \"This sentence cannot be proved\" - if the system is reliable, this sentence is true, but the system cannot say it.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>In a sufficiently strong and consistent mathematical system, there will always be sentences that are \"true, but cannot be proven within the system\"; the system cannot prove that it has no contradictions.</p>\n<p><strong>The first incompleteness theorem (in human language):</strong>When the system is strong enough and does not contradict itself, there must be a \"truth\" G, but the system can neither deduce G nor \"not G\".</p>\n<div class=\"formula\" data-latex=\"T\\nvdash G\\quad\\text{且}\\quad T\\nvdash \\neg G\"></div>\n<p>In the standard natural number model, G is actually true.</p>\n<p><strong>The second incompleteness theorem (in human language):</strong>Such a system cannot internally prove \"I am consistent.\"</p>\n<div class=\"formula\" data-latex=\"T\\nvdash \\mathrm{Con}(T)\"></div>\n<p>in <span data-latex=\"\\mathrm{Con}(T)\">Con(T)</span> Represents the formalization of the sentence \"T is consistent\".</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Gödel coding (what is it doing)</div>\n<p>By compiling symbols, formulas, and proof steps into natural numbers, \"proof\" becomes a number theory relationship, and the system can \"talk about itself.\"</p>\n<p>predicate <span data-latex=\"\\mathrm{Proof}_T(y,x)\">Proof_T(y,x)</span>: Read as \"y is a T-proof of statement x\".</p>\n<div class=\"calc-line\" data-latex=\"\\mathrm{Provable}_T(x)\\ :=\\ \\exists y\\,\\mathrm{Proof}_T(y,x)\"></div>\n<p>That is: there is a certain proof code y such that y proves x.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"def-title\">Diagonal Lemma (Fixed Point Lemma)</div>\n<p>for any formula <span data-latex=\"\\varphi(x)\">φ(x)</span>, you can find a sentence <span data-latex=\"\\psi\">ψ</span>, making the system verifiable:</p>\n<div class=\"formula\" data-latex=\"T\\vdash \\psi \\leftrightarrow \\varphi(\\ulcorner\\psi\\urcorner)\"></div>\n<p>in <span data-latex=\"\\ulcorner\\psi\\urcorner\">⌜ψ⌝</span> is the Gödel number (encoding) of ψ. Intuition: ψ is saying \"About my own encoding, it has the property φ\".</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Create a sentence \"This sentence is not provable\"; if the system is reliable, it is true, but the system cannot say it.</p>\n<div class=\"proof-nav\"><span>Construct G</span><span>Not provable</span><span>truth</span><span>second theorem</span></div>\n<h3>First Theorem (Outline)</h3>\n<ol class=\"steps\">\n<li>right <span data-latex=\"\\varphi(x)=\\neg\\mathrm{Provable}_T(x)\">φ(x)=¬Provable_T(x)</span> Using the diagonal lemma, we get that G satisfies\n            <div class=\"calc-line\" data-latex=\"T\\vdash G \\leftrightarrow \\neg\\mathrm{Provable}_T(\\ulcorner G\\urcorner)\"></div>\n            That is, G says: \"G is not provable.\"\n          </li>\n<li><strong>Can't have</strong> <span data-latex=\"T\\vdash G\">T ⊢ G</span>: If so, then G is provable, contradicting the meaning of G (in a consistent system).\n            <div class=\"calc-line\" data-latex=\"T\\vdash G \\ \\Rightarrow\\ T\\text{ 不一致}\"></div>\n</li>\n<li><strong>Nor can there be</strong> <span data-latex=\"T\\vdash\\neg G\">T ⊢ ¬G</span>(Under appropriate consistency assumptions). Rosser's improvement weakens the hypothesis.</li>\n<li>therefore <span data-latex=\"T\\nvdash G\">T ⊬ G</span>, then \"G is not provable\" is true, and G is saying this → G is true.</li>\n</ol>\n<h3>Second Theorem (Outline)</h3>\n<ol class=\"steps\">\n<li>It can be formalized as follows:<div class=\"calc-line\" data-latex=\"T\\vdash \\mathrm{Con}(T)\\rightarrow G\"></div></li>\n<li>like <span data-latex=\"T\\vdash\\mathrm{Con}(T)\">T ⊢ Con(T)</span>,but <span data-latex=\"T\\vdash G\">T ⊢ G</span>, contradicting the first theorem.</li>\n<li>Therefore <div class=\"calc-line\" data-latex=\"T\\nvdash \\mathrm{Con}(T)\"></div></li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<h3>Rother improvements</h3>\n<p>Just simple consistency, not ω-consistency: construct a Rosser sentence using the proof that there is no smaller-numbered ¬G.</p>\n<h3>and downtime issues</h3>\n<p>Turing: There is no algorithm for determining whether any program has halted. The proof also uses diagonal self-reference. The two jointly delineate the \"form/algorithm\" boundary.</p>\n<div class=\"warn-box\">Incomplete ≠ Math is useless. What it limits is the ambition of \"a single system to conquer the world\".</div>\n", "why": "\n<p>Delimiting the boundaries of \"formal proof\". It is a cousin to the computer, \"some problems the algorithm will never be able to solve\".</p>\n", "try": "\n<ul>\n<li>Discussion: Whether \"true\", \"verifiable\" and \"computer can determine\" are the same thing - giving examples from each case.</li>\n<li>Understanding the halting problem: Can a program tell that another program will halt.</li>\n</ul>\n"}, "field": "math"}}, "title": "Gödel's incompleteness theorem", "subtitle": "The system cannot catch all the truth in one go", "difficultyLabel": "Hardcore challenge", "tags": ["logic", "metamathematics", "Base"], "era": "1931", "oneLiner": "In a sufficiently strong mathematical system, there will always be sentences that are \"true, but cannot be proven within the system\"; the system cannot prove that it has no contradictions.", "people": [{"role": "prove", "name": "Kurt Gödel", "years": "1931"}, {"role": "Background program", "name": "Hilbert", "years": "early 20th century"}], "sections": {"story": "\n<p>At the beginning of the 20th century, some people hoped to establish a set of axioms so that all true mathematical propositions could be mechanically proved, and there would be no fights. Gödel proved that as long as the system can talk about integer arithmetic and is consistent with itself, this dream will not come true.</p>\n<div class=\"fun-box\"><strong>Spoilers:</strong>He created a mathematical version of \"This sentence cannot be proved\" - if the system is reliable, this sentence is true, but the system cannot say it.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>In a sufficiently strong and consistent mathematical system, there will always be sentences that are \"true, but cannot be proven within the system\"; the system cannot prove that it has no contradictions.</p>\n<p><strong>The first incompleteness theorem (in human language):</strong>When the system is strong enough and does not contradict itself, there must be a \"truth\" G, but the system can neither deduce G nor \"not G\".</p>\n<div class=\"formula\" data-latex=\"T\\nvdash G\\quad\\text{且}\\quad T\\nvdash \\neg G\"></div>\n<p>In the standard natural number model, G is actually true.</p>\n<p><strong>The second incompleteness theorem (in human language):</strong>Such a system cannot internally prove \"I am consistent.\"</p>\n<div class=\"formula\" data-latex=\"T\\nvdash \\mathrm{Con}(T)\"></div>\n<p>in <span data-latex=\"\\mathrm{Con}(T)\">Con(T)</span> Represents the formalization of the sentence \"T is consistent\".</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Gödel coding (what is it doing)</div>\n<p>By compiling symbols, formulas, and proof steps into natural numbers, \"proof\" becomes a number theory relationship, and the system can \"talk about itself.\"</p>\n<p>predicate <span data-latex=\"\\mathrm{Proof}_T(y,x)\">Proof_T(y,x)</span>: Read as \"y is a T-proof of statement x\".</p>\n<div class=\"calc-line\" data-latex=\"\\mathrm{Provable}_T(x)\\ :=\\ \\exists y\\,\\mathrm{Proof}_T(y,x)\"></div>\n<p>That is: there is a certain proof code y such that y proves x.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"def-title\">Diagonal Lemma (Fixed Point Lemma)</div>\n<p>for any formula <span data-latex=\"\\varphi(x)\">φ(x)</span>, you can find a sentence <span data-latex=\"\\psi\">ψ</span>, making the system verifiable:</p>\n<div class=\"formula\" data-latex=\"T\\vdash \\psi \\leftrightarrow \\varphi(\\ulcorner\\psi\\urcorner)\"></div>\n<p>in <span data-latex=\"\\ulcorner\\psi\\urcorner\">⌜ψ⌝</span> is the Gödel number (encoding) of ψ. Intuition: ψ is saying \"About my own encoding, it has the property φ\".</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Create a sentence \"This sentence is not provable\"; if the system is reliable, it is true, but the system cannot say it.</p>\n<div class=\"proof-nav\"><span>Construct G</span><span>Not provable</span><span>truth</span><span>second theorem</span></div>\n<h3>First Theorem (Outline)</h3>\n<ol class=\"steps\">\n<li>right <span data-latex=\"\\varphi(x)=\\neg\\mathrm{Provable}_T(x)\">φ(x)=¬Provable_T(x)</span> Using the diagonal lemma, we get that G satisfies\n            <div class=\"calc-line\" data-latex=\"T\\vdash G \\leftrightarrow \\neg\\mathrm{Provable}_T(\\ulcorner G\\urcorner)\"></div>\n            That is, G says: \"G is not provable.\"\n
