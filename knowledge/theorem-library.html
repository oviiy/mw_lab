      <p>对气体体积功常有 <span data-latex=\"\\delta W=p\\,dV\">δW=p dV</span>（准静态）。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">状态量 vs 过程量</div>\n            <p>内能 U 是状态量（只取决于状态）。热 Q、功 W 是过程量（看你怎么走）。所以写 δQ、δW 而不是 dQ、dW。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">热功当量</div>\n            <p>焦耳实验：机械功可以定量转化为热，比例固定——热不是一种「热质」，而是能量的一种形式。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>这是能量守恒在热力学语言里的记账法；实验上由热功当量与无数热机循环支持。</p>\n          <ol class=\"steps\">\n            <li>认定内能是状态函数：从状态 A 到 B，ΔU 与路径无关。</li>\n            <li>任意过程中，进入系统的能量以热与功的形式往来，其代数和等于 ΔU。</li>\n            <li>与力学/电磁能量衔接，得到普遍能量守恒图景。</li>\n          </ol>\n        ", "deep": "\n          <p>统计力学里 U 是微观能量的平均；第一定律对应微观哈密顿量的守恒结构在宏观的投影。</p>\n        ", "why": "\n          <p>发动机、冰箱、发电厂效率分析的起点；识破第一类永动机。</p>\n        ", "try": "\n          <ul>\n            <li>等温下理想气体 ΔU=0，吸的热等于对外做的功。</li>\n            <li>绝热 Q=0，则 ΔU=−W。</li>\n          </ul>\n        "}}, "en": {"id": "thermo-1", "field": "physics", "title": "first law of thermodynamics", "subtitle": "Thermal version of conservation of energy", "emoji": "🔥", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["thermodynamics", "energy", "heat engine"], "era": "Joule, Helmholtz, Clausius, etc., mid-19th century", "oneLiner": "Change in internal energy of the system = heat absorbed − work done externally (the symbol convention is subject to the textbook).", "people": [{"role": "Heat equivalent", "name": "joule", "years": "1840s"}, {"role": "Perfect expression", "name": "Clausius et al.", "years": "19th century"}], "related": ["thermo-2", "ideal-gas", "equipartition", "energy-conservation"], "sections": {"story": "\n<p>The perpetual motion dream breaks down here: you can’t create energy out of nothing. When the system is heated and work is done on the system, the internal energy changes; the heat engine turns the hot part into work, but the account must be balanced.</p>\n", "statement": "\n<p>Common conventions (the heat absorbed by the system is positive, and the external work done by the system is positive):</p>\n<div class=\"formula\" data-latex=\"\\Delta U=Q-W\"></div>\n<p>Differential form:</p>\n<div class=\"formula\" data-latex=\"dU=\\delta Q-\\delta W\"></div>\n<p>The function of gas volume is often <span data-latex=\"\\delta W=p\\,dV\">δW=p dV</span>(quasi-static).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">State quantity vs process quantity</div>\n<p>Internal energy U is a state quantity (depends only on the state). Heat Q and work W are process quantities (depending on how you go). So write δQ, δW instead of dQ, dW.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Heat equivalent</div>\n<p>Joule experiment: Mechanical work can be quantitatively converted into heat with a fixed ratio - heat is not a \"thermal mass\", but a form of energy.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>This is the accounting for the conservation of energy in the language of thermodynamics; supported experimentally by thermal work equivalents and countless heat engine cycles.</p>\n<ol class=\"steps\">\n<li>Consider internal energy to be a state function: from state A to B, ΔU is path independent.</li>\n<li>In any process, the energy entering the system comes and goes in the form of heat and work, and the algebraic sum is equal to ΔU.</li>\n<li>Connect with mechanics/electromagnetic energy to obtain a universal energy conservation picture.</li>\n</ol>\n", "deep": "\n<p>In statistical mechanics, U is the average of microscopic energy; the first law corresponds to the projection of the conservation structure of the microscopic Hamiltonian on the macroscopic level.</p>\n", "why": "\n<p>The starting point for efficiency analysis of engines, refrigerators, and power plants; seeing through the first type of perpetual motion machine.</p>\n", "try": "\n<ul>\n<li>Ideal gas ΔU=0 under isothermal conditions, the heat absorbed is equal to the work done to the outside world.</li>\n<li>Adiabatic Q=0, then ΔU=−W.</li>\n</ul>\n"}}}, "title": "first law of thermodynamics", "subtitle": "Thermal version of conservation of energy", "difficultyLabel": "Easy to use", "tags": ["thermodynamics", "energy", "heat engine"], "era": "Joule, Helmholtz, Clausius, etc., mid-19th century", "oneLiner": "Change in internal energy of the system = heat absorbed − work done externally (the symbol convention is subject to the textbook).", "people": [{"role": "Heat equivalent", "name": "joule", "years": "1840s"}, {"role": "Perfect expression", "name": "Clausius et al.", "years": "19th century"}], "sections": {"story": "\n<p>The perpetual motion dream breaks down here: you can’t create energy out of nothing. When the system is heated and work is done on the system, the internal energy changes; the heat engine turns the hot part into work, but the account must be balanced.</p>\n", "statement": "\n<p>Common conventions (the heat absorbed by the system is positive, and the external work done by the system is positive):</p>\n<div class=\"formula\" data-latex=\"\\Delta U=Q-W\"></div>\n<p>Differential form:</p>\n<div class=\"formula\" data-latex=\"dU=\\delta Q-\\delta W\"></div>\n<p>The function of gas volume is often <span data-latex=\"\\delta W=p\\,dV\">δW=p dV</span>(quasi-static).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">State quantity vs process quantity</div>\n<p>Internal energy U is a state quantity (depends only on the state). Heat Q and work W are process quantities (depending on how you go). So write δQ, δW instead of dQ, dW.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Heat equivalent</div>\n<p>Joule experiment: Mechanical work can be quantitatively converted into heat with a fixed ratio - heat is not a \"thermal mass\", but a form of energy.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>This is the accounting for the conservation of energy in the language of thermodynamics; supported experimentally by thermal work equivalents and countless heat engine cycles.</p>\n<ol class=\"steps\">\n<li>Consider internal energy to be a state function: from state A to B, ΔU is path independent.</li>\n<li>In any process, the energy entering the system comes and goes in the form of heat and work, and the algebraic sum is equal to ΔU.</li>\n<li>Connect with mechanics/electromagnetic energy to obtain a universal energy conservation picture.</li>\n</ol>\n", "deep": "\n<p>In statistical mechanics, U is the average of microscopic energy; the first law corresponds to the projection of the conservation structure of the microscopic Hamiltonian on the macroscopic level.</p>\n", "why": "\n<p>The starting point for efficiency analysis of engines, refrigerators, and power plants; seeing through the first type of perpetual motion machine.</p>\n", "try": "\n<ul>\n<li>Ideal gas ΔU=0 under isothermal conditions, the heat absorbed is equal to the work done to the outside world.</li>\n<li>Adiabatic Q=0, then ΔU=−W.</li>\n</ul>\n"}}, {"id": "thermo-2", "field": "physics", "difficulty": "medium", "emoji": "♻️", "iconClass": "rose", "related": ["thermo-1", "ideal-gas", "stefan-boltzmann", "energy-conservation"], "__i18n": {"zh": {"id": "thermo-2", "field": "physics", "title": "热力学第二定律", "subtitle": "熵增：不是所有能量都能随便变功", "emoji": "♻️", "iconClass": "rose", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["热力学", "熵", "不可逆"], "era": "克劳修斯、开尔文，19 世纪", "oneLiner": "孤立系统的熵不会自发减少；热不能全部自动变成功而不留下其他变化。", "people": [{"role": "克劳修斯表述 / 熵", "name": "鲁道夫·克劳修斯", "years": "1850s–1865"}, {"role": "开尔文表述", "name": "开尔文", "years": "1851"}], "related": ["thermo-1", "ideal-gas", "stefan-boltzmann", "energy-conservation"], "sections": {"story": "\n          <p>第一定律只说「能量账要平」，没说「哪些过程能发生」。热自发从高温流向低温，反过来不会自动发生。第二定律管「方向」和「品质」。</p>\n          <div class=\"fun-box\"><strong>永动机：</strong>第一类违背能量守恒；第二类声称把热 100% 变功且无副作用——被第二定律禁止。</div>\n        ", "statement": "\n          <p><strong>克劳修斯：</strong>不可能把热从低温物体传到高温物体而不引起其他变化。</p>\n          <p><strong>开尔文：</strong>不可能从单一热源吸热使之完全变成功而不产生其他影响。</p>\n          <p><strong>熵表述：</strong>孤立系统</p>\n          <div class=\"formula\" data-latex=\"\\Delta S\\ge 0\"></div>\n          <p>可逆过程熵变：</p>\n          <div class=\"formula\" data-latex=\"dS=\\dfrac{\\delta Q_{\\mathrm{rev}}}{T}\"></div>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">熵 S</div>\n            <p>描述「能量分散程度 / 微观可能性多少」的状态量。克劳修斯先给出宏观定义，玻尔兹曼给出微观解释 <span data-latex=\"S=k\\ln\\Omega\">S=k ln Ω</span>。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">卡诺效率</div>\n            <p>工作在 T_h 与 T_c 之间的热机，效率上限</p>\n            <div class=\"calc-line\" data-latex=\"\\eta\\le 1-\\dfrac{T_c}{T_h}\"></div>\n            <p>等号对应可逆卡诺循环——第二定律的定量后果。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>多种表述等价；若能造第二类永动机，就能造出克劳修斯禁止的「自动热流上坡」。</p>\n          <ol class=\"steps\">\n            <li>假设开尔文机存在：从单一热源吸热全部变功。</li>\n            <li>用该功驱动一台制冷机，可把热从低温泵到高温，而整体除了热从低温到高温外无其他变化 → 违背克劳修斯。</li>\n            <li>反之亦然。故两表述等价。</li>\n            <li>引入熵后，不可逆过程对应孤立系熵增；可逆循环 ∮ δQ/T=0。</li>\n          </ol>\n        ", "deep": "\n          <p>统计观点：宏观不可逆来自「可能性一边倒」——破碎的杯子微态远多于完整杯子，不是微观定律禁止倒放录像，而是概率上几乎不会。</p>\n        ", "why": "\n          <p>热机效率上限、信息与熵、宇宙「热寂」讨论、化学自发方向（结合自由能）。</p>\n        ", "try": "\n          <ul>\n            <li>T_h=600K，T_c=300K，卡诺效率上限是多少？</li>\n            <li>解释：为什么冰箱不违背第二定律（看房间整体）。</li>\n          </ul>\n        "}}, "en": {"id": "thermo-2", "field": "physics", "title": "second law of thermodynamics", "subtitle": "Entropy increase: not all energy can be easily converted into work", "emoji": "♻️", "iconClass": "rose", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["thermodynamics", "entropy", "Irreversible"], "era": "Clausius, Kelvin, 19th century", "oneLiner": "The entropy of an isolated system does not decrease spontaneously; heat cannot all be converted into work without leaving other changes.", "people": [{"role": "Clausius expression / entropy", "name": "Rudolf Clausius", "years": "1850s–1865"}, {"role": "Kelvin expression", "name": "Kelvin", "years": "1851"}], "related": ["thermo-1", "ideal-gas", "stefan-boltzmann", "energy-conservation"], "sections": {"story": "\n<p>The first law only says \"the energy account must be balanced\" but does not say \"which processes can occur\". Heat spontaneously flows from high to low temperatures, but not vice versa. The second law governs \"direction\" and \"quality.\"</p>\n<div class=\"fun-box\"><strong>Perpetual motion machine:</strong>The first category violates the conservation of energy; the second category claims to convert heat 100% into work with no side effects - prohibited by the second law.</div>\n", "statement": "\n<p><strong>Clausius:</strong>It is impossible to transfer heat from a low-temperature object to a high-temperature object without causing other changes.</p>\n<p><strong>Kelvin:</strong>It is impossible to absorb heat from a single heat source and make it completely successful without other effects.</p>\n<p><strong>Entropy expression:</strong>isolated system</p>\n<div class=\"formula\" data-latex=\"\\Delta S\\ge 0\"></div>\n<p>Entropy change of reversible process:</p>\n<div class=\"formula\" data-latex=\"dS=\\dfrac{\\delta Q_{\\mathrm{rev}}}{T}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Entropy S</div>\n<p>A state quantity that describes \"the degree of energy dispersion / the microscopic possibility\". Clausius first gave the macro definition, and Boltzmann gave the micro explanation. <span data-latex=\"S=k\\ln\\Omega\">S=k ln Ω</span>。</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Carnot efficiency</div>\n<p>Heat engine operating between T_h and T_c, upper limit of efficiency</p>\n<div class=\"calc-line\" data-latex=\"\\eta\\le 1-\\dfrac{T_c}{T_h}\"></div>\n<p>The equal sign corresponds to the reversible Carnot cycle—a quantitative consequence of the second law.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Multiple expressions are equivalent; if you can build a second type of perpetual motion machine, you can create the \"automatic heat flow uphill\" prohibited by Clausius.</p>\n<ol class=\"steps\">\n<li>Suppose a Kelvin machine exists: absorbing heat from a single heat source and converting it all into work.</li>\n<li>用该功驱动一台制冷机，可把热从低温泵到高温，而整体除了热从低温到高温外无其他变化 → 违背克劳修斯。</li>\n<li>反之亦然。故两表述等价。</li>\n<li>引入熵后，不可逆过程对应孤立系熵增；可逆循环 ∮ δQ/T=0。</li>\n</ol>\n", "deep": "\n<p>统计观点：宏观不可逆来自「可能性一边倒」——破碎的杯子微态远多于完整杯子，不是微观定律禁止倒放录像，而是概率上几乎不会。</p>\n", "why": "\n<p>热机效率上限、信息与熵、宇宙「热寂」讨论、化学自发方向（结合自由能）。</p>\n", "try": "\n<ul>\n<li>T_h=600K, T_c=300K, what is the upper limit of Carnot efficiency?</li>\n<li>Explanation: Why a refrigerator does not violate the second law (look at the room as a whole).</li>\n</ul>\n"}}}, "title": "second law of thermodynamics", "subtitle": "Entropy increase: not all energy can be easily converted into work", "difficultyLabel": "Spend some time thinking", "tags": ["thermodynamics", "entropy", "Irreversible"], "era": "Clausius, Kelvin, 19th century", "oneLiner": "The entropy of an isolated system does not decrease spontaneously; heat cannot all be converted into work without leaving other changes.", "people": [{"role": "Clausius expression / entropy", "name": "Rudolf Clausius", "years": "1850s–1865"}, {"role": "Kelvin expression", "name": "Kelvin", "years": "1851"}], "sections": {"story": "\n<p>The first law only says \"the energy account must be balanced\" but does not say \"which processes can occur\". Heat spontaneously flows from high to low temperatures, but not vice versa. The second law governs \"direction\" and \"quality.\"</p>\n<div class=\"fun-box\"><strong>Perpetual motion machine:</strong>The first category violates the conservation of energy; the second category claims to convert heat 100% into work with no side effects - prohibited by the second law.</div>\n", "statement": "\n<p><strong>Clausius:</strong>It is impossible to transfer heat from a low-temperature object to a high-temperature object without causing other changes.</p>\n<p><strong>Kelvin:</strong>It is impossible to absorb heat from a single heat source and make it completely successful without other effects.</p>\n<p><strong>Entropy expression:</strong>isolated system</p>\n<div class=\"formula\" data-latex=\"\\Delta S\\ge 0\"></div>\n<p>Entropy change of reversible process:</p>\n<div class=\"formula\" data-latex=\"dS=\\dfrac{\\delta Q_{\\mathrm{rev}}}{T}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Entropy S</div>\n<p>A state quantity that describes \"the degree of energy dispersion / the microscopic possibility\". Clausius first gave the macro definition, and Boltzmann gave the micro explanation. <span data-latex=\"S=k\\ln\\Omega\">S=k ln Ω</span>。</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Carnot efficiency</div>\n<p>Heat engine operating between T_h and T_c, upper limit of efficiency</p>\n<div class=\"calc-line\" data-latex=\"\\eta\\le 1-\\dfrac{T_c}{T_h}\"></div>\n<p>The equal sign corresponds to the reversible Carnot cycle—a quantitative consequence of the second law.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Multiple expressions are equivalent; if you can build a second type of perpetual motion machine, you can create the \"automatic heat flow uphill\" prohibited by Clausius.</p>\n<ol class=\"steps\">\n<li>Suppose a Kelvin machine exists: absorbing heat from a single heat source and converting it all into work.</li>\n<li>用该功驱动一台制冷机，可把热从低温泵到高温，而整体除了热从低温到高温外无其他变化 → 违背克劳修斯。</li>\n<li>反之亦然。故两表述等价。</li>\n<li>引入熵后，不可逆过程对应孤立系熵增；可逆循环 ∮ δQ/T=0。</li>\n</ol>\n", "deep": "\n<p>统计观点：宏观不可逆来自「可能性一边倒」——破碎的杯子微态远多于完整杯子，不是微观定律禁止倒放录像，而是概率上几乎不会。</p>\n", "why": "\n<p>热机效率上限、信息与熵、宇宙「热寂」讨论、化学自发方向（结合自由能）。</p>\n", "try": "\n<ul>\n<li>T_h=600K, T_c=300K, what is the upper limit of Carnot efficiency?</li>\n<li>Explanation: Why a refrigerator does not violate the second law (look at the room as a whole).</li>\n</ul>\n"}}, {"id": "ideal-gas", "field": "physics", "difficulty": "easy", "emoji": "🎈", "iconClass": "green", "related": ["thermo-1", "thermo-2", "equipartition"], "__i18n": {"zh": {"id": "ideal-gas", "field": "physics", "title": "理想气体状态方程", "subtitle": "PV=nRT：气体的理想账本", "emoji": "🎈", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["热力学", "气体", "模型"], "era": "波义耳、查理、盖-吕萨克 → 克拉珀龙、门捷列夫形式", "oneLiner": "稀薄气体近似：压强×体积 = 物质的量×R×温度。", "people": [{"role": "经验定律", "name": "波义耳等", "years": "17–19 世纪"}, {"role": "统一形式", "name": "克拉珀龙等", "years": "19 世纪"}], "related": ["thermo-1", "thermo-2", "equipartition"], "sections": {"story": "\n          <p>真实气体会液化、分子有体积；理想气体假设分子是「弹性小弹珠、本身不占体积、除碰撞无力」。常温常压空气常常够用。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"PV=nRT\"></div>\n          <p>或 <span data-latex=\"PV=Nk_B T\">PV=NkT</span>（N 分子数，k_B 玻尔兹曼常量）。R 为普适气体常量。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">三个经典实验律</div>\n            <p>等温：PV=const（波义耳）。等压：V∝T（查理）。等容：P∝T。拼起来就是状态方程。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">微观图像</div>\n            <p>动理学：压强来自分子 thrashing 器壁的动量变化；温度与平均平动动能成正比 <span data-latex=\"\\langle\\tfrac12 mv^2\\rangle\\propto T\">½mv²∝T</span>。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>宏观上由实验定律合并；微观上由分子碰撞模型导出 P=⅓ρv²_rms 再连到温度。</p>\n          <ol class=\"steps\">\n            <li>合并波义耳/查理等，得 PV/T=const，对 1 mol 记为 R。</li>\n            <li>n 摩尔：PV=nRT。</li>\n            <li>动理学导出 <span data-latex=\"PV=\\tfrac13 Nm\\langle v^2\\rangle\">PV=⅓Nm⟨v²⟩</span>，与能量均分衔接得同一形式。</li>\n          </ol>\n        ", "deep": "\n          <p>范德瓦尔斯方程给分子体积与引力修正，是迈向真实气体的一步。</p>\n        ", "why": "\n          <p>气球、引擎循环估算、化学计量与气体计量的基本工具。</p>\n        ", "try": "\n          <ul>\n            <li>温度（开尔文）加倍、体积不变，压强怎么变？</li>\n            <li>为何要用热力学温标而不是摄氏？</li>\n          </ul>\n        "}}, "en": {"id": "ideal-gas", "field": "physics", "title": "ideal gas equation of state", "subtitle": "PV=nRT: The ideal ledger of gases", "emoji": "🎈", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["thermodynamics", "gas", "Model"], "era": "Boyle, Charles, Guy-Lussac → Clapeyron, Mendeleev forms", "oneLiner": "Rare gas approximation: Pressure × Volume = Amount of substance × R × Temperature.", "people": [{"role": "empirical laws", "name": "Boyle et al.", "years": "17th–19th century"}, {"role": "unified form", "name": "Clapeyron et al.", "years": "19th century"}], "related": ["thermo-1", "thermo-2", "equipartition"], "sections": {"story": "\n<p>Real gases will liquefy and their molecules have volume; ideal gas molecules assume that they are \"elastic small marbles that do not take up volume themselves and are powerless except for collisions.\" Air at normal temperature and pressure is often sufficient.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"PV=nRT\"></div>\n<p>or <span data-latex=\"PV=Nk_B T\">PV=NkT</span>(N is the number of molecules, k_B is Boltzmann’s constant). R is the universal gas constant.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Three classic experimental laws</div>\n<p>Isotherm: PV=const (Boyle). Isobaric: V∝T (Charlie). Isovolumetric: P∝T. Put together it is the equation of state.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">microscopic image</div>\n<p>Kinetics: Pressure results from changes in momentum of molecules thrashing the walls; temperature is proportional to average translational kinetic energy <span data-latex=\"\\langle\\tfrac12 mv^2\\rangle\\propto T\">½mv²∝T</span>。</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Macroscopically, it is combined by experimental laws; microscopically, it is derived from the molecular collision model and P=⅓ρv²_rms is then connected to the temperature.</p>\n<ol class=\"steps\">\n<li>Combining Boyle/Charlie, etc., we get PV/T=const, denoted as R for 1 mol.</li>\n<li>n moles: PV=nRT.</li>\n<li>Kinetic derivation <span data-latex=\"PV=\\tfrac13 Nm\\langle v^2\\rangle\">PV=⅓Nm⟨v²⟩</span>, which is the same form as energy equalization.</li>\n</ol>\n", "deep": "\n<p>The van der Waals equation corrects for molecular volume and gravity, which is a step towards real gases.</p>\n", "why": "\n<p>Basic tools for ballooning, engine cycle estimation, stoichiometry and gas metering.</p>\n", "try": "\n<ul>\n<li>If the temperature (Kelvin) doubles and the volume remains the same, how does the pressure change?</li>\n<li>Why use the thermodynamic temperature scale instead of Celsius?</li>\n</ul>\n"}}}, "title": "ideal gas equation of state", "subtitle": "PV=nRT: The ideal ledger of gases", "difficultyLabel": "Easy to use", "tags": ["thermodynamics", "gas", "Model"], "era": "Boyle, Charles, Guy-Lussac → Clapeyron, Mendeleev forms", "oneLiner": "Rare gas approximation: Pressure × Volume = Amount of substance × R × Temperature.", "people": [{"role": "empirical laws", "name": "Boyle et al.", "years": "17th–19th century"}, {"role": "unified form", "name": "Clapeyron et al.", "years": "19th century"}], "sections": {"story": "\n<p>Real gases will liquefy and their molecules have volume; ideal gas molecules assume that they are \"elastic small marbles that do not take up volume themselves and are powerless except for collisions.\" Air at normal temperature and pressure is often sufficient.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"PV=nRT\"></div>\n<p>or <span data-latex=\"PV=Nk_B T\">PV=NkT</span>(N is the number of molecules, k_B is Boltzmann’s constant). R is the universal gas constant.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Three classic experimental laws</div>\n<p>Isotherm: PV=const (Boyle). Isobaric: V∝T (Charlie). Isovolumetric: P∝T. Put together it is the equation of state.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">microscopic image</div>\n<p>Kinetics: Pressure results from changes in momentum of molecules thrashing the walls; temperature is proportional to average translational kinetic energy <span data-latex=\"\\langle\\tfrac12 mv^2\\rangle\\propto T\">½mv²∝T</span>。</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Macroscopically, it is combined by experimental laws; microscopically, it is derived from the molecular collision model and P=⅓ρv²_rms is then connected to the temperature.</p>\n<ol class=\"steps\">\n<li>Combining Boyle/Charlie, etc., we get PV/T=const, denoted as R for 1 mol.</li>\n<li>n moles: PV=nRT.</li>\n<li>Kinetic derivation <span data-latex=\"PV=\\tfrac13 Nm\\langle v^2\\rangle\">PV=⅓Nm⟨v²⟩</span>, which is the same form as energy equalization.</li>\n</ol>\n", "deep": "\n<p>The van der Waals equation corrects for molecular volume and gravity, which is a step towards real gases.</p>\n", "why": "\n<p>Basic tools for ballooning, engine cycle estimation, stoichiometry and gas metering.</p>\n", "try": "\n<ul>\n<li>If the temperature (Kelvin) doubles and the volume remains the same, how does the pressure change?</li>\n<li>Why use the thermodynamic temperature scale instead of Celsius?</li>\n</ul>\n"}}, {"id": "maxwell", "field": "physics", "difficulty": "hard", "emoji": "⚡", "iconClass": "purple", "related": ["faraday", "ampere", "lorentz-force", "coulomb"], "__i18n": {"zh": {"id": "maxwell", "field": "physics", "title": "麦克斯韦方程组", "subtitle": "电与磁的统一语法", "emoji": "⚡", "iconClass": "purple", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["电磁学", "麦克斯韦", "场"], "era": "1860s 麦克斯韦；亥维赛等矢量形式", "oneLiner": "四条方程管住电场、磁场如何互相激发，并预言电磁波以光速传播。", "people": [{"role": "统一理论", "name": "詹姆斯·克拉克·麦克斯韦", "years": "1831–1879"}, {"role": "实验证实电磁波", "name": "赫兹", "years": "1887"}], "related": ["faraday", "ampere", "lorentz-force", "coulomb"], "sections": {"story": "\n          <p>库仑、安培、法拉第各自发现碎片。麦克斯韦把它们写成统一场方程，并大胆加上「位移电流」——于是电场变化也能生磁，电磁波被预言，光被解释为电磁波动。</p>\n        ", "statement": "\n          <p>真空中的微分形式（SI）：</p>\n          <div class=\"formula\" data-latex=\"\\nabla\\cdot\\vec{E}=\\dfrac{\\rho}{\\varepsilon_0}\"></div>\n          <div class=\"formula\" data-latex=\"\\nabla\\cdot\\vec{B}=0\"></div>\n          <div class=\"formula\" data-latex=\"\\nabla\\times\\vec{E}=-\\dfrac{\\partial\\vec{B}}{\\partial t}\"></div>\n          <div class=\"formula\" data-latex=\"\\nabla\\times\\vec{B}=\\mu_0\\vec{J}+\\mu_0\\varepsilon_0\\dfrac{\\partial\\vec{E}}{\\partial t}\"></div>\n          <p>人话：① 电荷产生电发散；② 没有磁单极；③ 变磁生旋电（法拉第）；④ 电流与变电生旋磁（安培–麦克斯韦）。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">场与源</div>\n            <p><span data-latex=\"\\rho\">ρ</span> 电荷密度，<span data-latex=\"\\vec{J}\">J</span> 电流密度。<span data-latex=\"\\varepsilon_0,\\mu_0\">ε₀,μ₀</span> 真空电容率/磁导率，光速 <span data-latex=\"c=1/\\sqrt{\\mu_0\\varepsilon_0}\">c=1/√(μ₀ε₀)</span>。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">位移电流</div>\n            <p>仅有传导电流时，安培定律与电荷守恒冲突。麦克斯韦加入 <span data-latex=\"\\varepsilon_0\\partial\\vec{E}/\\partial t\">ε₀∂E/∂t</span>，方程组自洽并允许真空中的波。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>不是一条「证明题」，而是：归纳实验定律 → 数学统一 → 推出电磁波 → 赫兹实验验证 → 与光学光速吻合。</p>\n          <ol class=\"steps\">\n            <li>高斯电/磁、法拉第、安培定律分别来自实验。</li>\n            <li>补上位移电流，使连续性方程 <span data-latex=\"\\nabla\\cdot\\vec{J}+\\partial\\rho/\\partial t=0\">∇·J+∂ρ/∂t=0</span> 与方程兼容。</li>\n            <li>在无源区取旋度，得波动方程，波速 = 当时测得的光速。</li>\n            <li>赫兹产生并检测无线电波，闭合历史证据链。</li>\n          </ol>\n        ", "deep": "\n          <p>闵可夫斯基把 E、B 合成电磁场张量，狭义相对论与麦克斯韦天然一体。量子电动力学是其量子版。</p>\n        ", "why": "\n          <p>电机、无线电、光纤、雷达、电路——现代文明的隐形操作系统。</p>\n        ", "try": "\n          <ul>\n            <li>说明：为什么「变磁场」能点亮线圈里的灯泡。</li>\n            <li>由 μ₀ε₀ 估算 c 的数量级。</li>\n          </ul>\n        "}}, "en": {"id": "maxwell", "field": "physics", "title": "Maxwell's equations", "subtitle": "A unified grammar of electricity and magnetism", "emoji": "⚡", "iconClass": "purple", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["electromagnetism", "Maxwell", "field"], "era": "1860s Maxwell; Heaviside and other vector forms", "oneLiner": "The four equations govern how electric and magnetic fields excite each other, and predict that electromagnetic waves propagate at the speed of light.", "people": [{"role": "unified theory", "name": "James Clerk Maxwell", "years": "1831–1879"}, {"role": "Experimental confirmation of electromagnetic waves", "name": "hertz", "years": "1887"}], "related": ["faraday", "ampere", "lorentz-force", "coulomb"], "sections": {"story": "\n<p>Coulomb, Ampere, and Faraday each discovered fragments. Maxwell wrote them as unified field equations and boldly added \"displacement current\" - so changes in the electric field can also produce magnetism, electromagnetic waves were predicted, and light was explained as electromagnetic waves.</p>\n", "statement": "\n<p>Differential form in vacuum (SI):</p>\n<div class=\"formula\" data-latex=\"\\nabla\\cdot\\vec{E}=\\dfrac{\\rho}{\\varepsilon_0}\"></div>\n<div class=\"formula\" data-latex=\"\\nabla\\cdot\\vec{B}=0\"></div>\n<div class=\"formula\" data-latex=\"\\nabla\\times\\vec{E}=-\\dfrac{\\partial\\vec{B}}{\\partial t}\"></div>\n<div class=\"formula\" data-latex=\"\\nabla\\times\\vec{B}=\\mu_0\\vec{J}+\\mu_0\\varepsilon_0\\dfrac{\\partial\\vec{E}}{\\partial t}\"></div>\n<p>Human words: ① Electric charge produces electrical divergence; ② There is no magnetic monopole; ③ Changing magnetism produces gyroelectricity (Faraday); ④ Current and changing electricity produce gyromagnetism (Ampere-Maxwell).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">field and source</div>\n<p><span data-latex=\"\\rho\">ρ</span> charge density,<span data-latex=\"\\vec{J}\">J</span> current density.<span data-latex=\"\\varepsilon_0,\\mu_0\">ε₀,μ₀</span> Vacuum permittivity/magnetic permeability, speed of light <span data-latex=\"c=1/\\sqrt{\\mu_0\\varepsilon_0}\">c=1/√(μ₀ε₀)</span>。</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Displacement current</div>\n<p>Ampere's law conflicts with the conservation of charge when there is only conduction of current. Maxwell joins <span data-latex=\"\\varepsilon_0\\partial\\vec{E}/\\partial t\">ε₀∂E/∂t</span>, the system of equations is self-consistent and allows waves in vacuum.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>It is not a \"proof question\", but: induction of experimental laws → mathematical unification → derivation of electromagnetic waves → Hertz experimental verification → consistent with the optical speed of light.</p>\n<ol class=\"steps\">\n<li>Gauss's electricity/magnetism, Faraday's law, and Ampere's law respectively come from experiments.</li>\n<li>Add the displacement current to make the continuity equation <span data-latex=\"\\nabla\\cdot\\vec{J}+\\partial\\rho/\\partial t=0\">∇·J+∂ρ/∂t=0</span> Compatible with Eq.</li>\n<li>Taking the curl in the passive region, we get the wave equation, wave speed = the measured speed of light at that time.</li>\n<li>Hertz generates and detects radio waves, closing the chain of historical evidence.</li>\n</ol>\n", "deep": "\n<p>Minkowski combined E and B into the electromagnetic field tensor, and special relativity is naturally integrated with Maxwell's. Quantum electrodynamics is the quantum version of this.</p>\n", "why": "\n<p>Motors, radios, fiber optics, radars, circuits—the invisible operating systems of modern civilization.</p>\n", "try": "\n<ul>\n<li>Explanation: Why a \"changing magnetic field\" can light up the light bulb in the coil.</li>\n<li>Estimate the magnitude of c from μ₀ε₀.</li>\n</ul>\n"}}}, "title": "Maxwell's equations", "subtitle": "A unified grammar of electricity and magnetism", "difficultyLabel": "Hardcore challenge", "tags": ["electromagnetism", "Maxwell", "field"], "era": "1860s Maxwell; Heaviside and other vector forms", "oneLiner": "The four equations govern how electric and magnetic fields excite each other, and predict that electromagnetic waves propagate at the speed of light.", "people": [{"role": "unified theory", "name": "James Clerk Maxwell", "years": "1831–1879"}, {"role": "Experimental confirmation of electromagnetic waves", "name": "hertz", "years": "1887"}], "sections": {"story": "\n<p>Coulomb, Ampere, and Faraday each discovered fragments. Maxwell wrote them as unified field equations and boldly added \"displacement current\" - so changes in the electric field can also produce magnetism, electromagnetic waves were predicted, and light was explained as electromagnetic waves.</p>\n", "statement": "\n<p>Differential form in vacuum (SI):</p>\n<div class=\"formula\" data-latex=\"\\nabla\\cdot\\vec{E}=\\dfrac{\\rho}{\\varepsilon_0}\"></div>\n<div class=\"formula\" data-latex=\"\\nabla\\cdot\\vec{B}=0\"></div>\n<div class=\"formula\" data-latex=\"\\nabla\\times\\vec{E}=-\\dfrac{\\partial\\vec{B}}{\\partial t}\"></div>\n<div class=\"formula\" data-latex=\"\\nabla\\times\\vec{B}=\\mu_0\\vec{J}+\\mu_0\\varepsilon_0\\dfrac{\\partial\\vec{E}}{\\partial t}\"></div>\n<p>Human words: ① Electric charge produces electrical divergence; ② There is no magnetic monopole; ③ Changing magnetism produces gyroelectricity (Faraday); ④ Current and changing electricity produce gyromagnetism (Ampere-Maxwell).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">field and source</div>\n<p><span data-latex=\"\\rho\">ρ</span> charge density,<span data-latex=\"\\vec{J}\">J</span> current density.<span data-latex=\"\\varepsilon_0,\\mu_0\">ε₀,μ₀</span> Vacuum permittivity/magnetic permeability, speed of light <span data-latex=\"c=1/\\sqrt{\\mu_0\\varepsilon_0}\">c=1/√(μ₀ε₀)</span>。</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Displacement current</div>\n<p>Ampere's law conflicts with the conservation of charge when there is only conduction of current. Maxwell joins <span data-latex=\"\\varepsilon_0\\partial\\vec{E}/\\partial t\">ε₀∂E/∂t</span>, the system of equations is self-consistent and allows waves in vacuum.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>It is not a \"proof question\", but: induction of experimental laws → mathematical unification → derivation of electromagnetic waves → Hertz experimental verification → consistent with the optical speed of light.</p>\n<ol class=\"steps\">\n<li>Gauss's electricity/magnetism, Faraday's law, and Ampere's law respectively come from experiments.</li>\n<li>Add the displacement current to make the continuity equation <span data-latex=\"\\nabla\\cdot\\vec{J}+\\partial\\rho/\\partial t=0\">∇·J+∂ρ/∂t=0</span> Compatible with Eq.</li>\n<li>Taking the curl in the passive region, we get the wave equation, wave speed = the measured speed of light at that time.</li>\n<li>Hertz generates and detects radio waves, closing the chain of historical evidence.</li>\n</ol>\n", "deep": "\n<p>Minkowski combined E and B into the electromagnetic field tensor, and special relativity is naturally integrated with Maxwell's. Quantum electrodynamics is the quantum version of this.</p>\n", "why": "\n<p>Motors, radios, fiber optics, radars, circuits—the invisible operating systems of modern civilization.</p>\n", "try": "\n<ul>\n<li>Explanation: Why a \"changing magnetic field\" can light up the light bulb in the coil.</li>\n<li>Estimate the magnitude of c from μ₀ε₀.</li>\n</ul>\n"}}, {"id": "faraday", "field": "physics", "difficulty": "medium", "emoji": "🧲", "iconClass": "warm", "related": ["maxwell", "lorentz-force", "ampere", "ohm"], "__i18n": {"zh": {"id": "faraday", "field": "physics", "title": "法拉第电磁感应定律", "subtitle": "变磁生电", "emoji": "🧲", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["电磁学", "感应", "技术"], "era": "1831 法拉第；楞次定律定方向", "oneLiner": "穿过回路的磁通量一变，回路里就出现电动势；发电机靠它吃饭。", "people": [{"role": "发现", "name": "迈克尔·法拉第", "years": "1831"}, {"role": "方向", "name": "楞次", "years": "1834"}], "related": ["maxwell", "lorentz-force", "ampere", "ohm"], "sections": {"story": "\n          <p>法拉第发现：动磁铁或改电流，旁边线圈会「感应」出电流。人类第一次大规模把机械运动变成电力，电力系统由此起步。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"\\mathcal{E}=-\\dfrac{d\\Phi_B}{dt}\"></div>\n          <p>磁通量 <span data-latex=\"\\Phi_B=\\int\\vec{B}\\cdot d\\vec{A}\">Φ_B=∫B·dA</span>。负号是楞次定律：感应效果反抗通量的变化。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">三种图像</div>\n            <p>① 磁场变；② 回路面积/取向变；③ 导体在磁场中运动（动生电动势）。都可纳入通量变化。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">动生电动势</div>\n            <p>棒在磁场中切割：<span data-latex=\"\\mathcal{E}=B\\ell v\">ε=Bℓv</span>（合适几何），与洛伦兹力做功图像一致。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>实验定律；方向由「反抗变化」（能量守恒）定下。麦克斯韦方程里的旋度式是其微分版。</p>\n          <ol class=\"steps\">\n            <li>法拉第大量实验：只有通量变化时才稳定出现感应电流。</li>\n            <li>楞次：感应电流的磁场总试图抵消原通量变化——否则可造永动机。</li>\n            <li>写入 <span data-latex=\"\\nabla\\times\\vec{E}=-\\partial\\vec{B}/\\partial t\">∇×E=−∂B/∂t</span>，与电路形式统一。</li>\n          </ol>\n        ", "deep": "\n          <p>感生电场可以是涡旋场，电位不再全局单值——变压器区域要小心。</p>\n        ", "why": "\n          <p>发电机、变压器、电磁炉、无线充电的原理核心。</p>\n        ", "try": "\n          <ul>\n            <li>磁铁插入线圈，电流计如何偏转？拔出呢？</li>\n            <li>为何变压器不能对直流工作？</li>\n          </ul>\n        "}}, "en": {"id": "faraday", "field": "physics", "title": "Faraday's law of electromagnetic induction", "subtitle": "Changing magnetism to generate electricity", "emoji": "🧲", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["electromagnetism", "induction", "technology"], "era": "1831 Faraday; Lenz’s law determines direction", "oneLiner": "As soon as the magnetic flux passing through the loop changes, an electromotive force appears in the loop; the generator depends on it.", "people": [{"role": "Discover", "name": "Michael Faraday", "years": "1831"}, {"role": "direction", "name": "Lenci", "years": "1834"}], "related": ["maxwell", "lorentz-force", "ampere", "ohm"], "sections": {"story": "\n<p>Faraday discovered that if the magnet is moved or the current is changed, the coil next to it will \"induce\" the current. For the first time, humans turned mechanical motion into electricity on a large scale, and this is where the power system started.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\mathcal{E}=-\\dfrac{d\\Phi_B}{dt}\"></div>\n<p>magnetic flux <span data-latex=\"\\Phi_B=\\int\\vec{B}\\cdot d\\vec{A}\">Φ_B=∫B·dA</span>. The negative sign is Lenz's law: the induction effect opposes the change in flux.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">three images</div>\n<p>① The magnetic field changes; ② The loop area/orientation changes; ③ The conductor moves in the magnetic field (kinetic electromotive force). can incorporate flux changes.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">dynamic electromotive force</div>\n<p>Rod cut in magnetic field:<span data-latex=\"\\mathcal{E}=B\\ell v\">ε=Bℓv</span>(appropriate geometry), consistent with the Lorentz force work image.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Experimental law; direction is set by \"resistance to change\" (conservation of energy). The curl expression in Maxwell's equations is its differential version.</p>\n<ol class=\"steps\">\n<li>Faraday's extensive experiments: The induced current appears stably only when the flux changes.</li>\n<li>Lenz: A magnetic field inducing an electric current always tries to cancel out the changes in the original flux - otherwise it would create a perpetual motion machine.</li>\n<li>write <span data-latex=\"\\nabla\\times\\vec{E}=-\\partial\\vec{B}/\\partial t\">∇×E=−∂B/∂t</span>, unified with the circuit form.</li>\n</ol>\n", "deep": "\n<p>Induced electric fields can be vortex fields and the potential is no longer globally single - be careful in the transformer area.</p>\n", "why": "\n<p>The core principles of generators, transformers, induction cookers, and wireless charging.</p>\n", "try": "\n<ul>\n<li>How is the galvanometer deflected when a magnet is inserted into the coil? What about pulling it out?</li>\n<li>Why don't transformers work on DC?</li>\n</ul>\n"}}}, "title": "Faraday's law of electromagnetic induction", "subtitle": "Changing magnetism to generate electricity", "difficultyLabel": "Spend some time thinking", "tags": ["electromagnetism", "induction", "technology"], "era": "1831 Faraday; Lenz’s law determines direction", "oneLiner": "As soon as the magnetic flux passing through the loop changes, an electromotive force appears in the loop; the generator depends on it.", "people": [{"role": "Discover", "name": "Michael Faraday", "years": "1831"}, {"role": "direction", "name": "Lenci", "years": "1834"}], "sections": {"story": "\n<p>Faraday discovered that if the magnet is moved or the current is changed, the coil next to it will \"induce\" the current. For the first time, humans turned mechanical motion into electricity on a large scale, and this is where the power system started.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\mathcal{E}=-\\dfrac{d\\Phi_B}{dt}\"></div>\n<p>magnetic flux <span data-latex=\"\\Phi_B=\\int\\vec{B}\\cdot d\\vec{A}\">Φ_B=∫B·dA</span>. The negative sign is Lenz's law: the induction effect opposes the change in flux.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">three images</div>\n<p>① The magnetic field changes; ② The loop area/orientation changes; ③ The conductor moves in the magnetic field (kinetic electromotive force). can incorporate flux changes.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">dynamic electromotive force</div>\n<p>Rod cut in magnetic field:<span data-latex=\"\\mathcal{E}=B\\ell v\">ε=Bℓv</span>(appropriate geometry), consistent with the Lorentz force work image.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>Experimental law; direction is set by \"resistance to change\" (conservation of energy). The curl expression in Maxwell's equations is its differential version.</p>\n<ol class=\"steps\">\n<li>Faraday's extensive experiments: The induced current appears stably only when the flux changes.</li>\n<li>Lenz: A magnetic field inducing an electric current always tries to cancel out the changes in the original flux - otherwise it would create a perpetual motion machine.</li>\n<li>write <span data-latex=\"\\nabla\\times\\vec{E}=-\\partial\\vec{B}/\\partial t\">∇×E=−∂B/∂t</span>, unified with the circuit form.</li>\n</ol>\n", "deep": "\n<p>Induced electric fields can be vortex fields and the potential is no longer globally single - be careful in the transformer area.</p>\n", "why": "\n<p>The core principles of generators, transformers, induction cookers, and wireless charging.</p>\n", "try": "\n<ul>\n<li>How is the galvanometer deflected when a magnet is inserted into the coil? What about pulling it out?</li>\n<li>Why don't transformers work on DC?</li>\n</ul>\n"}}, {"id": "coulomb", "field": "physics", "difficulty": "easy", "emoji": "➕", "iconClass": "", "related": ["maxwell", "ohm", "faraday", "lorentz-force"], "__i18n": {"zh": {"id": "coulomb", "field": "physics", "title": "库仑定律", "subtitle": "电荷之间的平方反比力", "emoji": "➕", "iconClass": "", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["电磁学", "静电", "基础"], "era": "1785 库仑扭秤", "oneLiner": "两点电荷之间的力 ∝ 电荷乘积 / 距离平方，同号相斥、异号相吸。", "people": [{"role": "实验确立", "name": "查尔斯·库仑", "years": "1785"}], "related": ["maxwell", "ohm", "faraday", "lorentz-force"], "sections": {"story": "\n          <p>与万有引力神似，但电荷有正负，所以可斥可吸。静电学、原子里电子为何不掉进核（经典图像的起点，虽不完整），都从这儿讲。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"F=k\\dfrac{|q_1 q_2|}{r^2},\\quad k=\\dfrac{1}{4\\pi\\varepsilon_0}\"></div>\n          <p>矢量形式：</p>\n          <div class=\"formula\" data-latex=\"\\vec{F}_{12}=\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{q_1 q_2}{r^2}\\hat{r}_{12}\"></div>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">点电荷</div>\n            <p>尺寸远小于间距时，电荷分布可当点。连续分布用积分叠加（电场线性）。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">高斯定理联系</div>\n            <p>库仑平方反比 ↔ 真空中 <span data-latex=\"\\nabla\\cdot\\vec{E}=\\rho/\\varepsilon_0\">∇·E=ρ/ε₀</span>（在各向同性等条件下）。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>扭秤实验测力与距离、电荷量的关系；数学上与引力同型。</p>\n          <ol class=\"steps\">\n            <li>库仑用扭秤比较不同距离、不同电荷的扭转力矩。</li>\n            <li>归纳得平方反比与乘积关系。</li>\n            <li>引入 ε₀ 与现代单位制书写。</li>\n          </ol>\n        ", "deep": "\n          <p>量子电动力学修正极近距离行为；宏观静电库仑仍然极准。</p>\n        ", "why": "\n          <p>电路、电容器、化学键静电模型、打印机与静电除尘。</p>\n        ", "try": "\n          <ul>\n            <li>距离变为 3 倍，力变为多少？</li>\n            <li>比较：同样「平方反比」，引力恒吸引、库仑可排斥。</li>\n          </ul>\n        "}}, "en": {"id": "coulomb", "field": "physics", "title": "Coulomb's law", "subtitle": "inverse square force between charges", "emoji": "➕", "iconClass": "", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["electromagnetism", "static electricity", "Base"], "era": "1785 Coulomb Torsion Scale", "oneLiner": "The force between two point charges is ∝ charge product / distance squared. Same signs repel and different signs attract.", "people": [{"role": "Experiment established", "name": "Charles Coulomb", "years": "1785"}], "related": ["maxwell", "ohm", "faraday", "lorentz-force"], "sections": {"story": "\n<p>It is similar to the force of gravity, but the charges are positive and negative, so it can repel or attract. Electrostatics and why electrons in atoms do not fall into the nucleus (the starting point of the classic image, although it is incomplete), are all discussed here.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"F=k\\dfrac{|q_1 q_2|}{r^2},\\quad k=\\dfrac{1}{4\\pi\\varepsilon_0}\"></div>\n<p>Vector form:</p>\n<div class=\"formula\" data-latex=\"\\vec{F}_{12}=\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{q_1 q_2}{r^2}\\hat{r}_{12}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">point charge</div>\n<p>When the size is much smaller than the spacing, the charge distribution can be used as a point. Continuous distributions are superimposed with integrals (electric field linearity).</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Gauss's theorem connection</div>\n<p>Coulomb inverse square ↔ in vacuum <span data-latex=\"\\nabla\\cdot\\vec{E}=\\rho/\\varepsilon_0\">∇·E=ρ/ε₀</span>(Under conditions such as isotropy).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The torsion scale experiment measures the relationship between force, distance and charge; mathematically it is the same type as gravity.</p>\n<ol class=\"steps\">\n<li>Coulomb uses a torsion scale to compare the torsional torque at different distances and different charges.</li>\n<li>Induction leads to the inverse square and product relationships.</li>\n<li>Introducing ε₀ and modern unit writing.</li>\n</ol>\n", "deep": "\n<p>Quantum electrodynamics corrects extremely close-range behavior; macroscopic electrostatic Coulombs remain extremely accurate.</p>\n", "why": "\n<p>Circuits, capacitors, electrostatic models of chemical bonds, printers and electrostatic dust removal.</p>\n", "try": "\n<ul>\n<li>If the distance is tripled, what will be the force?</li>\n<li>Comparison: In the same \"inverse square ratio\", gravity always attracts and Coulomb repels.</li>\n</ul>\n"}}}, "title": "Coulomb's law", "subtitle": "inverse square force between charges", "difficultyLabel": "Easy to use", "tags": ["electromagnetism", "static electricity", "Base"], "era": "1785 Coulomb Torsion Scale", "oneLiner": "The force between two point charges is ∝ charge product / distance squared. Same signs repel and different signs attract.", "people": [{"role": "Experiment established", "name": "Charles Coulomb", "years": "1785"}], "sections": {"story": "\n<p>It is similar to the force of gravity, but the charges are positive and negative, so it can repel or attract. Electrostatics and why electrons in atoms do not fall into the nucleus (the starting point of the classic image, although it is incomplete), are all discussed here.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"F=k\\dfrac{|q_1 q_2|}{r^2},\\quad k=\\dfrac{1}{4\\pi\\varepsilon_0}\"></div>\n<p>Vector form:</p>\n<div class=\"formula\" data-latex=\"\\vec{F}_{12}=\\dfrac{1}{4\\pi\\varepsilon_0}\\dfrac{q_1 q_2}{r^2}\\hat{r}_{12}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">point charge</div>\n<p>When the size is much smaller than the spacing, the charge distribution can be used as a point. Continuous distributions are superimposed with integrals (electric field linearity).</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Gauss's theorem connection</div>\n<p>Coulomb inverse square ↔ in vacuum <span data-latex=\"\\nabla\\cdot\\vec{E}=\\rho/\\varepsilon_0\">∇·E=ρ/ε₀</span>(Under conditions such as isotropy).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The torsion scale experiment measures the relationship between force, distance and charge; mathematically it is the same type as gravity.</p>\n<ol class=\"steps\">\n<li>Coulomb uses a torsion scale to compare the torsional torque at different distances and different charges.</li>\n<li>Induction leads to the inverse square and product relationships.</li>\n<li>Introducing ε₀ and modern unit writing.</li>\n</ol>\n", "deep": "\n<p>Quantum electrodynamics corrects extremely close-range behavior; macroscopic electrostatic Coulombs remain extremely accurate.</p>\n", "why": "\n<p>Circuits, capacitors, electrostatic models of chemical bonds, printers and electrostatic dust removal.</p>\n", "try": "\n<ul>\n<li>If the distance is tripled, what will be the force?</li>\n<li>Comparison: In the same \"inverse square ratio\", gravity always attracts and Coulomb repels.</li>\n</ul>\n"}}, {"id": "relativity-sr", "field": "physics", "difficulty": "hard", "emoji": "🚀", "iconClass": "rose", "related": ["maxwell", "relativity-gr", "photoelectric", "doppler"], "__i18n": {"zh": {"id": "relativity-sr", "field": "physics", "title": "狭义相对论要点", "subtitle": "光速不变，时空联姻，E=mc²", "emoji": "🚀", "iconClass": "rose", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["相对论", "爱因斯坦", "时空"], "era": "1905 爱因斯坦", "oneLiner": "对所有惯性系，光速相同；同时性相对；质量与能量互通。", "people": [{"role": "提出", "name": "阿尔伯特·爱因斯坦", "years": "1905"}, {"role": "数学形式", "name": "闵可夫斯基等", "years": "1908 前后"}], "related": ["maxwell", "relativity-gr", "photoelectric", "doppler"], "sections": {"story": "\n          <p>麦克斯韦电磁理论给出绝对光速，与伽利略相对性看似打架。爱因斯坦丢掉「绝对时间」，留下两条公设，重写时空观。</p>\n          <div class=\"fun-box\"><strong>两公设：</strong>① 物理定律对所有惯性系形式相同；② 真空光速 c 与光源运动无关。</div>\n        ", "statement": "\n          <p><strong>洛伦兹因子：</strong></p>\n          <div class=\"formula\" data-latex=\"\\gamma=\\dfrac{1}{\\sqrt{1-v^2/c^2}}\"></div>\n          <p><strong>时间膨胀：</strong>运动时钟变慢 <span data-latex=\"\\Delta t=\\gamma\\Delta t_0\">Δt=γΔt₀</span>。</p>\n          <p><strong>长度收缩：</strong>运动尺子变短 <span data-latex=\"L=L_0/\\gamma\">L=L₀/γ</span>（沿运动方向）。</p>\n          <p><strong>质能关系：</strong></p>\n          <div class=\"formula\" data-latex=\"E=\\gamma mc^2,\\quad E_0=mc^2\"></div>\n          <p>动量 <span data-latex=\"\\vec{p}=\\gamma m\\vec{v}\">p=γmv</span>。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">同时性</div>\n            <p>「两地同时」依赖参考系。绝对同时被放弃，换来电磁与力学的统一相对性。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">光速极限</div>\n            <p>有质量粒子 v→c 时 γ→∞，加速越来越难，无法越过 c。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>从两公设推洛伦兹变换；时间膨胀、长度收缩、速度合成、质能关系都是推论。实验（μ子寿命、GPS、粒子加速器）反复确认。</p>\n          <ol class=\"steps\">\n            <li>光信号校准时钟 + 相对性 → 推导洛伦兹变换。</li>\n            <li>由变换读出时间膨胀与长度收缩。</li>\n            <li>要求动量守恒在所有惯性系成立 → 修正 p、E 的表达式 → E²=(pc)²+(mc²)²。</li>\n            <li>低速展开回到牛顿力学 + 动能 ½mv²。</li>\n          </ol>\n        ", "deep": "\n          <p>广义相对论进一步让引力=时空弯曲。狭义相对论是平直时空的「惯性系专版」。</p>\n        ", "why": "\n          <p>核能源、粒子物理、GPS 钟差修正、宇宙线 μ 子能落到地面。</p>\n        ", "try": "\n          <ul>\n            <li>v=0.6c 时 γ 是多少？时间膨胀因子？</li>\n            <li>1 g 质量对应多少能量（用 E=mc² 估数量级）？</li>\n          </ul>\n        "}}, "en": {"id": "relativity-sr", "field": "physics", "title": "Key points of special relativity", "subtitle": "The speed of light remains unchanged, the marriage of time and space, E=mc²", "emoji": "🚀", "iconClass": "rose", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["relativity", "einstein", "time and space"], "era": "1905 Einstein", "oneLiner": "For all inertial systems, the speed of light is the same; simultaneity is relative; mass and energy are interconnected.", "people": [{"role": "propose", "name": "albert einstein", "years": "1905"}, {"role": "mathematical form", "name": "Minkowski et al.", "years": "Around 1908"}], "related": ["maxwell", "relativity-gr", "photoelectric", "doppler"], "sections": {"story": "\n<p>Maxwell's electromagnetic theory gives the absolute speed of light, seemingly fighting with Galilean relativity. Einstein threw away \"absolute time\" and left behind two postulates to rewrite the concept of time and space.</p>\n<div class=\"fun-box\"><strong>Two postulates:</strong>① The physical laws are the same for all inertial systems; ② The speed of light c in vacuum has nothing to do with the movement of the light source.</div>\n", "statement": "\n<p><strong>Lorenz factor:</strong></p>\n<div class=\"formula\" data-latex=\"\\gamma=\\dfrac{1}{\\sqrt{1-v^2/c^2}}\"></div>\n<p><strong>Time dilation:</strong>Exercise clock slows down <span data-latex=\"\\Delta t=\\gamma\\Delta t_0\">Δt=γΔt₀</span>。</p>\n<p><strong>Length shrinkage:</strong>Sports ruler shortened <span data-latex=\"L=L_0/\\gamma\">L=L₀/γ</span>(along the direction of motion).</p>\n<p><strong>Quality-energy relationship:</strong></p>\n<div class=\"formula\" data-latex=\"E=\\gamma mc^2,\\quad E_0=mc^2\"></div>\n<p>momentum <span data-latex=\"\\vec{p}=\\gamma m\\vec{v}\">p=γmv</span>。</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Simultaneity</div>\n<p>\"Two places at the same time\" depends on the reference system. The absolute is simultaneously abandoned in exchange for the unified relativity of electromagnetism and mechanics.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">speed of light limit</div>\n<p>When a particle with mass v→c γ→∞, it becomes increasingly difficult to accelerate and cannot cross c.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The Lorentz transformation can be deduced from the two postulates; time dilation, length contraction, velocity synthesis, and mass-energy relationship are all inferences. Experiments (muon lifetime, GPS, particle accelerator) repeatedly confirmed.</p>\n<ol class=\"steps\">\n<li>Optical signal calibration clock + relativity → derive Lorentz transform.</li>\n<li>Read out time dilation and length contraction from transformations.</li>\n<li>Momentum conservation is required to hold in all inertial systems → correct the expressions of p and E → E²=(pc)²+(mc²)².</li>\n<li>Low speed expansion returns to Newtonian mechanics + kinetic energy ½mv².</li>\n</ol>\n", "deep": "\n<p>General relativity further allows gravity = curvature of space-time. Special theory of relativity is the \"inertial frame special version\" of flat space-time.</p>\n", "why": "\n<p>Nuclear energy, particle physics, GPS clock correction, cosmic ray muons can fall to the ground.</p>\n", "try": "\n<ul>\n<li>What is γ when v=0.6c? Time dilation factor?</li>\n<li>How much energy is associated with 1 g of mass (use E=mc² to estimate the magnitude)?</li>\n</ul>\n"}}}, "title": "Key points of special relativity", "subtitle": "The speed of light remains unchanged, the marriage of time and space, E=mc²", "difficultyLabel": "Hardcore challenge", "tags": ["relativity", "einstein", "time and space"], "era": "1905 Einstein", "oneLiner": "For all inertial systems, the speed of light is the same; simultaneity is relative; mass and energy are interconnected.", "people": [{"role": "propose", "name": "albert einstein", "years": "1905"}, {"role": "mathematical form", "name": "Minkowski et al.", "years": "Around 1908"}], "sections": {"story": "\n<p>Maxwell's electromagnetic theory gives the absolute speed of light, seemingly fighting with Galilean relativity. Einstein threw away \"absolute time\" and left behind two postulates to rewrite the concept of time and space.</p>\n<div class=\"fun-box\"><strong>Two postulates:</strong>① The physical laws are the same for all inertial systems; ② The speed of light c in vacuum has nothing to do with the movement of the light source.</div>\n", "statement": "\n<p><strong>Lorenz factor:</strong></p>\n<div class=\"formula\" data-latex=\"\\gamma=\\dfrac{1}{\\sqrt{1-v^2/c^2}}\"></div>\n<p><strong>Time dilation:</strong>Exercise clock slows down <span data-latex=\"\\Delta t=\\gamma\\Delta t_0\">Δt=γΔt₀</span>。</p>\n<p><strong>Length shrinkage:</strong>Sports ruler shortened <span data-latex=\"L=L_0/\\gamma\">L=L₀/γ</span>(along the direction of motion).</p>\n<p><strong>Quality-energy relationship:</strong></p>\n<div class=\"formula\" data-latex=\"E=\\gamma mc^2,\\quad E_0=mc^2\"></div>\n<p>momentum <span data-latex=\"\\vec{p}=\\gamma m\\vec{v}\">p=γmv</span>。</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Simultaneity</div>\n<p>\"Two places at the same time\" depends on the reference system. The absolute is simultaneously abandoned in exchange for the unified relativity of electromagnetism and mechanics.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">speed of light limit</div>\n<p>When a particle with mass v→c γ→∞, it becomes increasingly difficult to accelerate and cannot cross c.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The Lorentz transformation can be deduced from the two postulates; time dilation, length contraction, velocity synthesis, and mass-energy relationship are all inferences. Experiments (muon lifetime, GPS, particle accelerator) repeatedly confirmed.</p>\n<ol class=\"steps\">\n<li>Optical signal calibration clock + relativity → derive Lorentz transform.</li>\n<li>Read out time dilation and length contraction from transformations.</li>\n<li>Momentum conservation is required to hold in all inertial systems → correct the expressions of p and E → E²=(pc)²+(mc²)².</li>\n<li>Low speed expansion returns to Newtonian mechanics + kinetic energy ½mv².</li>\n</ol>\n", "deep": "\n<p>General relativity further allows gravity = curvature of space-time. Special theory of relativity is the \"inertial frame special version\" of flat space-time.</p>\n", "why": "\n<p>Nuclear energy, particle physics, GPS clock correction, cosmic ray muons can fall to the ground.</p>\n", "try": "\n<ul>\n<li>What is γ when v=0.6c? Time dilation factor?</li>\n<li>How much energy is associated with 1 g of mass (use E=mc² to estimate the magnitude)?</li>\n</ul>\n"}}, {"id": "photoelectric", "field": "physics", "difficulty": "medium", "emoji": "💡", "iconClass": "warm", "related": ["planck", "compton", "de-broglie", "relativity-sr"], "__i18n": {"zh": {"id": "photoelectric", "field": "physics", "title": "光电效应", "subtitle": "光是一份一份的：E=hν", "emoji": "💡", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["量子", "爱因斯坦", "光"], "era": "赫兹发现；爱因斯坦 1905 解释", "oneLiner": "光电子能否打出取决于光的频率，不取决于光强；爱因斯坦用光量子解释。", "people": [{"role": "现象", "name": "赫兹等", "years": "1887 前后"}, {"role": "光量子解释", "name": "爱因斯坦", "years": "1905（诺奖 1921）"}], "related": ["planck", "compton", "de-broglie", "relativity-sr"], "sections": {"story": "\n          <p>经典波动说预言：光再弱，只要照得够久也能积够能量打出电子；频率不该设门槛。实验却是：频率不够，再亮也没电子；频率够了，几乎立刻有。爱因斯坦提出：光是能量为 hν 的量子。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"h\\nu=\\phi+K_{\\max}\"></div>\n          <p><span data-latex=\"\\phi\">φ</span> 逸出功，<span data-latex=\"K_{\\max}\">K_max</span> 光电子最大动能。截止频率 <span data-latex=\"\\nu_0=\\phi/h\">ν₀=φ/h</span>。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">与波动说冲突的三点</div>\n            <p>① 截止频率；② 瞬时发射；③ 饱和电流随光强变、最大动能随频率变。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">普朗克关系</div>\n            <p>能量子 <span data-latex=\"E=h\\nu\">E=hν</span>（普朗克先用于黑体，爱因斯坦用到光本身）。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>一个光子把全部身家 hν 交给一个电子；付完逸出功 φ，剩下变动能。光强只表示光子多寡，不提高单个光子能量。</p>\n          <ol class=\"steps\">\n            <li>假设辐射以能量 hν 的量子被吸收。</li>\n            <li>电子挣脱金属需至少 φ → 需要 ν≥φ/h。</li>\n            <li>K_max=hν−φ，与密强无关；光强影响单位时间光子数 → 光电流。</li>\n            <li>密立根等精密实验验证线性关系与 h 的数值。</li>\n          </ol>\n        ", "deep": "\n          <p>光的波粒二象性由此坐实；康普顿散射进一步支持光子动量 p=h/λ。</p>\n        ", "why": "\n          <p>太阳能电池、光电管、光传感器；量子论的实验基石之一。</p>\n        ", "try": "\n          <ul>\n            <li>若 φ=2 eV，求截止频率数量级（h≈4.14×10⁻¹⁵ eV·s）。</li>\n            <li>为何紫光比红光更容易打出电子？</li>\n          </ul>\n        "}}, "en": {"id": "photoelectric", "field": "physics", "title": "photoelectric effect", "subtitle": "Just one portion at a time: E=hν", "emoji": "💡", "iconClass": "warm", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["quantum", "einstein", "Light"], "era": "Discovered by Hertz; explained by Einstein 1905", "oneLiner": "Whether photoelectrons can be ejected depends on the frequency of light, not the intensity of the light; Einstein explained it using light quanta.", "people": [{"role": "Phenomenon", "name": "Hertz et al.", "years": "Before and after 1887"}, {"role": "Light quantum explanation", "name": "einstein", "years": "1905 (Nobel Prize 1921)"}], "related": ["planck", "compton", "de-broglie", "relativity-sr"], "sections": {"story": "\n<p>The classical wave theory predicts: No matter how weak the light is, as long as it shines for long enough, it can accumulate enough energy to eject electrons; frequency should not set a threshold. The experiment is: if the frequency is not enough, no matter how bright it is, there will be no electrons; if the frequency is enough, there will be electrons almost immediately. Einstein proposed that light is a quantum of energy hν.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"h\\nu=\\phi+K_{\\max}\"></div>\n<p><span data-latex=\"\\phi\">φ</span> Escape from work,<span data-latex=\"K_{\\max}\">K_max</span> Maximum kinetic energy of photoelectrons. cutoff frequency <span data-latex=\"\\nu_0=\\phi/h\">ν₀=φ/h</span>。</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Three points that conflict with the wave theory</div>\n<p>① Cutoff frequency; ② Instantaneous emission; ③ The saturation current changes with light intensity, and the maximum kinetic energy changes with frequency.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Planck relation</div>\n<p>energy quanta <span data-latex=\"E=h\\nu\">E=hν</span>(Planck first used it for black bodies, and Einstein used it for light itself).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>A photon gives its entire value hν to an electron; after paying off the work function φ, the remaining change energy remains. Light intensity only indicates the number of photons and does not increase the energy of a single photon.</p>\n<ol class=\"steps\">\n<li>Suppose radiation is absorbed in quanta of energy hν.</li>\n<li>The electrons need to break away from the metal at least φ → ν≥φ/h is required.</li>\n<li>K_max=hν−φ, has nothing to do with density; light intensity affects the number of photons per unit time → photocurrent.</li>\n<li>Millikan and other precision experiments verified the linear relationship with the value of h.</li>\n</ol>\n", "deep": "\n<p>The wave-particle duality of light is thus confirmed; Compton scattering further supports the photon momentum p=h/λ.</p>\n", "why": "\n<p>Solar cells, phototubes, light sensors; one of the experimental cornerstones of quantum theory.</p>\n", "try": "\n<ul>\n<li>If φ=2 eV, find the order of magnitude of the cutoff frequency (h≈4.14×10⁻¹⁵ eV·s).</li>\n<li>Why does violet light eject electrons more easily than red light?</li>\n</ul>\n"}}}, "title": "photoelectric effect", "subtitle": "Just one portion at a time: E=hν", "difficultyLabel": "Spend some time thinking", "tags": ["quantum", "einstein", "Light"], "era": "Discovered by Hertz; explained by Einstein 1905", "oneLiner": "Whether photoelectrons can be ejected depends on the frequency of light, not the intensity of the light; Einstein explained it using light quanta.", "people": [{"role": "Phenomenon", "name": "Hertz et al.", "years": "Before and after 1887"}, {"role": "Light quantum explanation", "name": "einstein", "years": "1905 (Nobel Prize 1921)"}], "sections": {"story": "\n<p>The classical wave theory predicts: No matter how weak the light is, as long as it shines for long enough, it can accumulate enough energy to eject electrons; frequency should not set a threshold. The experiment is: if the frequency is not enough, no matter how bright it is, there will be no electrons; if the frequency is enough, there will be electrons almost immediately. Einstein proposed that light is a quantum of energy hν.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"h\\nu=\\phi+K_{\\max}\"></div>\n<p><span data-latex=\"\\phi\">φ</span> Escape from work,<span data-latex=\"K_{\\max}\">K_max</span> Maximum kinetic energy of photoelectrons. cutoff frequency <span data-latex=\"\\nu_0=\\phi/h\">ν₀=φ/h</span>。</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Three points that conflict with the wave theory</div>\n<p>① Cutoff frequency; ② Instantaneous emission; ③ The saturation current changes with light intensity, and the maximum kinetic energy changes with frequency.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Planck relation</div>\n<p>energy quanta <span data-latex=\"E=h\\nu\">E=hν</span>(Planck first used it for black bodies, and Einstein used it for light itself).</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>A photon gives its entire value hν to an electron; after paying off the work function φ, the remaining change energy remains. Light intensity only indicates the number of photons and does not increase the energy of a single photon.</p>\n<ol class=\"steps\">\n<li>Suppose radiation is absorbed in quanta of energy hν.</li>\n<li>The electrons need to break away from the metal at least φ → ν≥φ/h is required.</li>\n<li>K_max=hν−φ, has nothing to do with density; light intensity affects the number of photons per unit time → photocurrent.</li>\n<li>Millikan and other precision experiments verified the linear relationship with the value of h.</li>\n</ol>\n", "deep": "\n<p>The wave-particle duality of light is thus confirmed; Compton scattering further supports the photon momentum p=h/λ.</p>\n", "why": "\n<p>Solar cells, phototubes, light sensors; one of the experimental cornerstones of quantum theory.</p>\n", "try": "\n<ul>\n<li>If φ=2 eV, find the order of magnitude of the cutoff frequency (h≈4.14×10⁻¹⁵ eV·s).</li>\n<li>Why does violet light eject electrons more easily than red light?</li>\n</ul>\n"}}, {"id": "planck", "field": "physics", "difficulty": "medium", "emoji": "📦", "iconClass": "purple", "related": ["photoelectric", "stefan-boltzmann", "compton", "de-broglie"], "__i18n": {"zh": {"id": "planck", "field": "physics", "title": "普朗克关系与能量子", "subtitle": "E=hν：能量可以一份一份卖", "emoji": "📦", "iconClass": "purple", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["量子", "黑体", "普朗克"], "era": "1900 普朗克", "oneLiner": "谐振子能量不是连续任意值，而是 hν 的整数倍——量子论敲门砖。", "people": [{"role": "提出", "name": "马克斯·普朗克", "years": "1900"}], "related": ["photoelectric", "stefan-boltzmann", "compton", "de-broglie"], "sections": {"story": "\n          <p>黑体辐射的「紫外灾难」：经典统计把高频能量算爆。普朗克不情愿地假设能量一份份来，公式突然完美拟合实验——量子时代开始。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"E=nh\\nu,\\quad n=0,1,2,\\ldots\"></div>\n          <p>光子语言（爱因斯坦）：每个光子能量</p>\n          <div class=\"formula\" data-latex=\"E=h\\nu=\\dfrac{hc}{\\lambda}\"></div>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">普朗克常量 h</div>\n            <p>约 6.626×10⁻³⁴ J·s。极小，所以日常看不出「一份一份」。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">普朗克光谱</div>\n            <p>黑体辐射能密度按频率分布的普朗克公式，成功压住紫外灾难，并回到瑞利-金斯/维恩两极限。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>为拟合曲线引入的假设，后来被光电效应等实验抬成原理。</p>\n          <ol class=\"steps\">\n            <li>经典均分 → 紫外发散。</li>\n            <li>假设振子能量量子化 E=nhν，改写统计权重。</li>\n            <li>得到与实验吻合的谱；h 由拟合确定。</li>\n          </ol>\n        ", "deep": "\n          <p>量子力学里能量量子化来自边界条件与算符本征值，不再是「为了拟合硬加」。</p>\n        ", "why": "\n          <p>LED、激光、原子光谱、一切量子技术的概念源头。</p>\n        ", "try": "\n          <ul>\n            <li>绿光 λ≈500 nm，一个光子能量约多少 eV？</li>\n            <li>为什么「量子」在宏观被平均掉了？</li>\n          </ul>\n        "}}, "en": {"id": "planck", "field": "physics", "title": "Planck relation and energy quanta", "subtitle": "E=hν: energy can be sold in pieces", "emoji": "📦", "iconClass": "purple", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["quantum", "black body", "Planck"], "era": "1900 Planck", "oneLiner": "The energy of the harmonic oscillator is not a continuous arbitrary value, but an integer multiple of hν - a stepping stone to quantum theory.", "people": [{"role": "propose", "name": "Max Planck", "years": "1900"}], "related": ["photoelectric", "stefan-boltzmann", "compton", "de-broglie"], "sections": {"story": "\n<p>The \"ultraviolet disaster\" of blackbody radiation: Classic statistics calculate the explosion of high-frequency energy. Planck reluctantly assumed that the energy came in one piece, and the formula suddenly fit the experiment perfectly—the quantum era began.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"E=nh\\nu,\\quad n=0,1,2,\\ldots\"></div>\n<p>The language of photons (Einstein): Energy per photon</p>\n<div class=\"formula\" data-latex=\"E=h\\nu=\\dfrac{hc}{\\lambda}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Planck's constant h</div>\n<p>About 6.626×10⁻³⁴ J·s. It's extremely small, so you can't see \"one by one\" in daily life.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Planck spectrum</div>\n<p>Planck's formula for the frequency distribution of blackbody radiant energy density has successfully suppressed the ultraviolet disaster and returned to the Rayleigh-Jeans/Wien limits.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The assumptions introduced for fitting the curve were later developed into principles by experiments such as the photoelectric effect.</p>\n<ol class=\"steps\">\n<li>Classic equalization → UV divergence.</li>\n<li>Assume that the oscillator energy is quantized E=nhν and rewrite the statistical weights.</li>\n<li>A spectrum is obtained that agrees with the experiment; h is determined by fitting.</li>\n</ol>\n", "deep": "\n<p>In quantum mechanics, energy quantization comes from boundary conditions and operator eigenvalues, and is no longer \"hardly added for the sake of fitting.\"</p>\n", "why": "\n<p>LED, laser, atomic spectroscopy, the conceptual source of all quantum technologies.</p>\n", "try": "\n<ul>\n<li>Green light λ≈500 nm, how much eV is the energy of a photon?</li>\n<li>Why is \"quantum\" averaged out at the macroscopic level?</li>\n</ul>\n"}}}, "title": "Planck relation and energy quanta", "subtitle": "E=hν: energy can be sold in pieces", "difficultyLabel": "Spend some time thinking", "tags": ["quantum", "black body", "Planck"], "era": "1900 Planck", "oneLiner": "The energy of the harmonic oscillator is not a continuous arbitrary value, but an integer multiple of hν - a stepping stone to quantum theory.", "people": [{"role": "propose", "name": "Max Planck", "years": "1900"}], "sections": {"story": "\n<p>The \"ultraviolet disaster\" of blackbody radiation: Classic statistics calculate the explosion of high-frequency energy. Planck reluctantly assumed that the energy came in one piece, and the formula suddenly fit the experiment perfectly—the quantum era began.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"E=nh\\nu,\\quad n=0,1,2,\\ldots\"></div>\n<p>The language of photons (Einstein): Energy per photon</p>\n<div class=\"formula\" data-latex=\"E=h\\nu=\\dfrac{hc}{\\lambda}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Planck's constant h</div>\n<p>About 6.626×10⁻³⁴ J·s. It's extremely small, so you can't see \"one by one\" in daily life.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Planck spectrum</div>\n<p>Planck's formula for the frequency distribution of blackbody radiant energy density has successfully suppressed the ultraviolet disaster and returned to the Rayleigh-Jeans/Wien limits.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The assumptions introduced for fitting the curve were later developed into principles by experiments such as the photoelectric effect.</p>\n<ol class=\"steps\">\n<li>Classic equalization → UV divergence.</li>\n<li>Assume that the oscillator energy is quantized E=nhν and rewrite the statistical weights.</li>\n<li>A spectrum is obtained that agrees with the experiment; h is determined by fitting.</li>\n</ol>\n", "deep": "\n<p>In quantum mechanics, energy quantization comes from boundary conditions and operator eigenvalues, and is no longer \"hardly added for the sake of fitting.\"</p>\n", "why": "\n<p>LED, laser, atomic spectroscopy, the conceptual source of all quantum technologies.</p>\n", "try": "\n<ul>\n<li>Green light λ≈500 nm, how much eV is the energy of a photon?</li>\n<li>Why is \"quantum\" averaged out at the macroscopic level?</li>\n</ul>\n"}}, {"id": "uncertainty", "field": "physics", "difficulty": "hard", "emoji": "🌫️", "iconClass": "rose", "related": ["de-broglie", "schrodinger", "planck", "photoelectric"], "__i18n": {"zh": {"id": "uncertainty", "field": "physics", "title": "海森堡不确定原理", "subtitle": "不能同时把位置和动量看得无限准", "emoji": "🌫️", "iconClass": "rose", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["量子", "海森堡", "基础"], "era": "1927 海森堡", "oneLiner": "位置测得越准，动量就越不准；不是仪器太烂，是波的本性。", "people": [{"role": "提出", "name": "维尔纳·海森堡", "years": "1927"}], "related": ["de-broglie", "schrodinger", "planck", "photoelectric"], "sections": {"story": "\n          <p>经典世界观：粒子同时有精确位置和速度。量子世界观：波函数给出概率；位置与动量是「不对易」的一对，精确度互相拆台。</p>\n        ", "statement": "\n          <div class=\"formula\" data-latex=\"\\sigma_x\\,\\sigma_p\\ge \\dfrac{\\hbar}{2}\"></div>\n          <p>更一般：对任意不对易可观测量有类似不等式。能量-时间也有形式 <span data-latex=\"\\Delta E\\Delta t\\gtrsim\\hbar/2\">ΔE Δt ≳ ℏ/2</span>（解释需谨慎）。</p>\n        ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">不是测量扰动那么简单</div>\n            <p>入门比喻「光子踢飞电子」有启发，但原理更深层：态本身不能同时是两者的本征态。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">对易子</div>\n            <p><span data-latex=\"[x,p]=i\\hbar\">[x,p]=iℏ</span>。由柯西-施瓦茨型论证可导出不确定度乘积下限。</p>\n          </div>\n        ", "proof": "\n          <p class=\"plain-lead\"><strong>人话：</strong>波包越窄（位置确定），需要的频率/波数成分越宽（动量不确定）——傅里叶变换的冤家。</p>\n          <ol class=\"steps\">\n            <li>定义方差 <span data-latex=\"\\sigma_x^2=\\langle(x-\\bar x)^2\\rangle\">σ_x²</span> 等。</li>\n            <li>对态矢量用算符不等式（Robertson 关系）。</li>\n            <li>代入 [x,p]=iℏ，得 σ_x σ_p ≥ ℏ/2。</li>\n          </ol>\n        ", "deep": "\n          <p>量子信息里的纠缠、互补原理，都与「不能同时拥有全部经典标签」一脉相承。</p>\n        ", "why": "\n          <p>理解原子稳定性、光谱线宽、隧道效应的概念背景；否定「决定性轨迹」的经典图像。</p>\n        ", "try": "\n          <ul>\n            <li>若把电子限制在 Δx≈0.1 nm，估 Δp 与速度不确定的数量级。</li>\n            <li>用「波包」画草图解释位置-动量权衡。</li>\n          </ul>\n        "}}, "en": {"id": "uncertainty", "field": "physics", "title": "Heisenberg uncertainty principle", "subtitle": "Position and momentum cannot be viewed with infinite accuracy at the same time", "emoji": "🌫️", "iconClass": "rose", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["quantum", "Heisenberg", "Base"], "era": "1927 Heisenberg", "oneLiner": "The more accurate the position measurement, the less accurate the momentum. It’s not because the instrument is bad, it’s just the nature of the wave.", "people": [{"role": "propose", "name": "Werner Heisenberg", "years": "1927"}], "related": ["de-broglie", "schrodinger", "planck", "photoelectric"], "sections": {"story": "\n<p>Classical world view: Particles have precise positions and velocities at the same time. Quantum world view: The wave function gives probability; position and momentum are a \"non-commutable\" pair, and the accuracy undermines each other.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\sigma_x\\,\\sigma_p\\ge \\dfrac{\\hbar}{2}\"></div>\n<p>More generally: there are similar inequalities for any non-commutable observables. Energy-time also has form <span data-latex=\"\\Delta E\\Delta t\\gtrsim\\hbar/2\">ΔE Δt ≳ ℏ/2</span>(Interpret with caution).</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">It’s not as simple as measuring disturbances</div>\n<p>The introductory metaphor of \"photons kicking electrons away\" is inspiring, but the principle is deeper: the state itself cannot be the eigenstate of both at the same time.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Yizi</div>\n<p><span data-latex=\"[x,p]=i\\hbar\">[x,p]=iℏ</span>. A lower bound on the uncertainty product can be derived from the Cauchy-Schwarz type argument.</p>\n</div>\n", "proof": "\n<p class=\"plain-lead\"><strong>Human words:</strong>The narrower the wave packet (position is certain), the wider the frequency/wavenumber component is required (momentum is uncertain) - the enemy of the Fourier transform.</p>\n<ol class=\"steps\">\n<li>Define variance <span data-latex=\"\\sigma_x^2=\\langle(x-\\bar x)^2\\rangle\">σ_x²</span> wait.</li>\n<li>Use operator inequalities (Robertson relations) for state vectors.</li>\n<li>Substituting [x,p]=iℏ, we get σ_x σ_p ≥ ℏ/2.</li>\n</ol>\n", "deep": "\n<p>The entanglement and complementarity principles in quantum information are all in line with \"you cannot have all the classical labels at the same time.\"</p>\n", "why": "\n<p>Understand the conceptual background of atomic stability, spectral line width, and tunneling effects; deny the classic image of \"decisive trajectory\".</p>\n", "try": "\n<ul>\n<li>If the electron is restricted to Δx≈0.1 nm, the estimated magnitude of Δp and velocity is uncertain.</li>\n<li>Use \"wave packet\" sketches to explain the position-momentum trade-off.</li>\n</ul>\n"}}}, "title": "Heisenberg uncertainty principle", "subtitle": "Position and momentum cannot be viewed with infinite accuracy at the same time", "difficultyLabel": "Hardcore challenge", "tags": ["quantum", "Heisenberg", "Base"], "era": "1927 Heisenberg", "oneLiner": "The more accurate the position measurement, the less accurate the momentum. It’s not because the instrument is bad, it’s just the nature of the wave.", "people": [{"role": "propose", "name": "Werner Heisenberg", "years": "1927"}], "sections": {"story": "\n<p>Classical world view: Particles have precise positions and velocities at the same time. Quantum world view: The wave function gives probability; position and momentum are a \"non-commutable\" pair, and the accuracy undermines each other.</p>\n", "statement": "\n<div class=\"formula\" data-latex=\"\\sigma_x\\,\\sigma_p\\ge \\dfrac{\\hbar}{2}\"></div>\n<p>More generally: there are similar inequalities for any non-commutable observables. Energ
