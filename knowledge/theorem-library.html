c lattice triangles of area 1/2 (it can be shown that any simple lattice polygon can be dissected in this way).</li>\n<li>Assuming T basic triangles, Area = T/2.</li>\n<li>Think of the subdivision as a planar graph: V = I+B grid vertices; number of faces F = T + 1 (including external infinite faces).</li>\n<li>For each triangle with 3 sides, each internal edge is counted twice and each boundary edge is counted once: 3T = 2E_int + E_boundary. And E = E_int + E_boundary.</li>\n<li>The boundary has exactly B grid points ⇒ The number of boundary edges E_boundary = B (simple closed polyline).</li>\n<li>Euler: V−E+F=2 (including the outer surface; triangulating the disk V−E+(T+1)=2 ⇒ V−E+T=1).</li>\n<li>Simultaneously 3T = 2(E−B) + B = 2E − B, we get 2E = 3T + B. Substituting Euler:\n            <div class=\"calc-line\" data-latex=\"I+B - (3T+B)/2 + T = 1\"></div>\n            Simplify: I + B/2 − T/2 = 1 ⇒ T/2 = I + B/2 − 1.\n          </li>\n<li>But Area=T/2, so Area = I + B/2 − 1.</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>Interface to Euler's formula</h3>\n<p>Cut into T basic triangles (each area is 1/2) ⇒ Area=T/2. Combining 3T=2E_int+B with V−E+T=1 (V=I+B) gives Area=I+B/2−1. In the interaction diagram, green points = interior points and yellow points = boundary points.</p>\n</div>", "deep": "\n<h3>example</h3>\n<p>Unit square: I=0, B=4, Area=0+2−1=1. right.</p>\n<p>3-4-5 For the right triangle lattice version, you need to count I and B by yourself.</p>\n<h3>High dimensional</h3>\n<p>The volume of a high-dimensional lattice polyhedron cannot be given simply by \"interior boundary points\" (Ehrhart theory is required).</p>\n", "why": "\n<p>Toy models of grid maps and pixel graphics; the shadow of Euler's formula can also be seen in the proof.</p>\n", "try": "\n<ul>\n<li>Switch the interactive diagram shape, count the green points (inside) and the yellow points (sides), and check the formula.</li>\n<li>Unit square: I=0,B=4 → 0+2−1=1, correct.</li>\n</ul>\n"}, "field": "math"}}, "title": "Pick's theorem", "subtitle": "Calculate the area by counting points", "difficultyLabel": "Spend some time thinking", "tags": ["geometry", "combination", "Grid points"], "era": "1899，Georg Pick", "oneLiner": "Polygon on grid paper: area = number of internal grid points + number of boundary grid points/2 − 1.", "people": [{"role": "propose and prove", "name": "Georg Peake", "years": "1899"}], "sections": {"story": "\n<p>The area of ​​a polygon whose vertices are all connected to the grid points is actually only determined by \"a few points inside and a few points on the sides\" - there is no need to cut it out and weigh it. Pick's theorem is a lovely consequence of discrete geometry.</p>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Polygon on grid paper: area = interior points + boundary points/2 − 1.</p>\n<div class=\"formula\" data-latex=\"\\operatorname{Area}(P)=I+\\dfrac{B}{2}-1\"></div>\n<p><span data-latex=\"I\">I</span> The number of internal grid points,<span data-latex=\"B\">B</span> Number of boundary grid points (including vertices).</p>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma 1 (Basic Trigonometry)</div>\n<p>If the lattice triangle has no points inside and only 3 vertices on the boundary (no other boundary points), then the area is 1/2.</p>\n<p>By cross product: Area=|ad−bc|/2 for vertices (0,0),(a,b),(c,d) and no other boundary points + empty interior ⇔ |ad−bc|=1 (Pick or integer geometry).</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma 2 (Additivity)</div>\n<p>If P is divided into P₁, P₂ along the common grid point polyline, then I, B, Area satisfy the additive relationship so that the Pick expression is additive: prove that the formula is true for two blocks and ⇒ is true for merging (the sharing of boundary points needs to be calculated carefully).</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Cut it into many small triangles with an area of ​​1/2, and then combine it with the number of vertices and edges using the Euler relationship, and the formula comes out.</p><div class=\"interactive\" data-widget=\"pick-theorem\"></div>\n<div class=\"proof-nav\"><span>basic triangle</span><span>Dissect</span><span>Euler check</span></div>\n<ol class=\"steps\">\n<li>Dissect P into basic lattice triangles of area 1/2 (it can be shown that any simple lattice polygon can be dissected in this way).</li>\n<li>Assuming T basic triangles, Area = T/2.</li>\n<li>Think of the subdivision as a planar graph: V = I+B grid vertices; number of faces F = T + 1 (including external infinite faces).</li>\n<li>For each triangle with 3 sides, each internal edge is counted twice and each boundary edge is counted once: 3T = 2E_int + E_boundary. And E = E_int + E_boundary.</li>\n<li>The boundary has exactly B grid points ⇒ The number of boundary edges E_boundary = B (simple closed polyline).</li>\n<li>Euler: V−E+F=2 (including the outer surface; triangulating the disk V−E+(T+1)=2 ⇒ V−E+T=1).</li>\n<li>Simultaneously 3T = 2(E−B) + B = 2E − B, we get 2E = 3T + B. Substituting Euler:\n            <div class=\"calc-line\" data-latex=\"I+B - (3T+B)/2 + T = 1\"></div>\n            Simplify: I + B/2 − T/2 = 1 ⇒ T/2 = I + B/2 − 1.\n          </li>\n<li>But Area=T/2, so Area = I + B/2 − 1.</li>\n</ol>\n<p class=\"qed\">∎</p>\n<div data-more-detail=\"\">\n<h3>Interface to Euler's formula</h3>\n<p>Cut into T basic triangles (each area is 1/2) ⇒ Area=T/2. Combining 3T=2E_int+B with V−E+T=1 (V=I+B) gives Area=I+B/2−1. In the interaction diagram, green points = interior points and yellow points = boundary points.</p>\n</div>", "deep": "\n<h3>example</h3>\n<p>Unit square: I=0, B=4, Area=0+2−1=1. right.</p>\n<p>3-4-5 For the right triangle lattice version, you need to count I and B by yourself.</p>\n<h3>High dimensional</h3>\n<p>The volume of a high-dimensional lattice polyhedron cannot be given simply by \"interior boundary points\" (Ehrhart theory is required).</p>\n", "why": "\n<p>Toy models of grid maps and pixel graphics; the shadow of Euler's formula can also be seen in the proof.</p>\n", "try": "\n<ul>\n<li>Switch the interactive diagram shape, count the green points (inside) and the yellow points (sides), and check the formula.</li>\n<li>Unit square: I=0,B=4 → 0+2−1=1, correct.</li>\n</ul>\n"}}, {"id": "pnt", "field": "math", "difficulty": "hard", "emoji": "📊", "iconClass": "warm", "related": ["euclid-primes", "fta-arith", "basel"], "__i18n": {"zh": {"id": "pnt", "title": "素数定理", "subtitle": "质数有多密？大约每隔 ln x 遇到一个", "emoji": "📊", "iconClass": "warm", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["数论", "分析", "渐近"], "era": "猜想 18–19 世纪；1896 证明", "oneLiner": "不超过 x 的质数大约有 x/ln x 个——x 越大，质数越稀，但密度规律很干净。", "people": [{"role": "数值观察 / 猜想", "name": "高斯、勒让德", "years": "约 1792 起"}, {"role": "首次证明", "name": "阿达马、德·拉·瓦莱-普桑", "years": "1896"}, {"role": "初等证明", "name": "塞尔伯格、爱尔特希", "years": "1949"}], "related": ["euclid-primes", "fta-arith", "basel"], "sections": {"story": "\n        <p>质数无穷多已经知道了，更想问：前 x 个正整数里大概几个质数？记作 π(x)。高斯年轻时就猜：大约 x/ln x。</p>\n        <p>严格证明 1896 年才完成，用了复变函数里的 ζ。你可在图上亲眼看 π(x) 和 x/ln x 越来越贴。</p>\n      \n<div class=\"interactive\" data-widget=\"pnt-chart\"></div>", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>不超过 x 的质数大约有 <span data-latex=\"x/\\ln x\">x/ln x</span> 个。</p>\n        <div class=\"formula\" data-latex=\"\\pi(x)\\sim\\dfrac{x}{\\ln x}\"></div>\n        <div class=\"formula\" data-latex=\"\\lim_{x\\to\\infty}\\pi(x)\\cdot\\dfrac{\\ln x}{x}=1\"></div>\n      ", "setup": "\n        <div class=\"def-box\">\n          <div class=\"def-title\">黎曼 ζ 函数（证明需要的角色）</div>\n          <div class=\"calc-line\" data-latex=\"ζ(s) = \\sum_{n=1}^\\infty n^{-s} = \\prod _p (1-p^{-s})^{-1} （Re s \\gt  1）\"></div>\n          <p>欧拉乘积把 ζ 与素数绑在一起。ζ 可解析延拓到复平面（除 s=1 的极点）。</p>\n        </div>\n        <div class=\"def-box\">\n          <div class=\"def-title\">切比雪夫函数</div>\n          <div class=\"calc-line\" data-latex=\"\\psi (x) = \\sum_{p^k \\le x} ln p\"></div>\n          <p>PNT ⇔ ψ(x)∼x。ψ 比 π 更适合做分析。</p>\n        </div>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理（ζ 无零点与素数）</div>\n          <p>若 ζ 在 Re s=1 的直线上无零点，则可推出 ψ(x)∼x。阿达马与德·拉·瓦莱-普桑正是证明了 ζ(1+it)≠0（t≠0）。</p>\n        </div>\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">纽曼 / 维纳–池原 型定理（纲要）</div>\n          <p>由 ζ 的解析性质控制 −ζ'/ζ 的狄利克雷级数，再用陶伯型定理把「生成函数行为」翻译成 ψ(x)∼x。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>把质数编进 ζ 函数，证明 ζ 在某条线上无零点，再翻译回「质数计数」的渐近公式——战略如此，细节是分析大部头。</p>\n        <div class=\"proof-nav\"><span>战略图</span><span>非完整专业证明</span><span>逻辑链闭合说明</span></div>\n        <h3>总体战略（1896 分析证明）</h3>\n        <ol class=\"steps\">\n          <li><strong>编码素数：</strong>对 Re s≥1，\n            <div class=\"calc-line\" data-latex=\"-ζ'(s)/ζ(s) = \\sum_{n\\ge 1} Λ(n) n^{-s}\"></div>\n            其中 Λ(n)=ln p 当 n=p^k，否则 0。这是 ψ 的「生成函数」。\n          </li>\n          <li><strong>解析延拓：</strong>ζ 在 s=1 有简单极点，其余在 Re s≥1 无零点（需证）。于是 −ζ'/ζ 在 Re s≥1 上（除 s=1 的极点）性态可控。</li>\n          <li><strong>关键困难：</strong>证明 ζ(1+it)≠0。若 ζ(1+it₀)=0，则欧拉乘积/三角不等式会出现与 ζ 在 1 附近极点不相容的抵消（经典 3ζ 不等式：ζ(σ)³|ζ(σ+it)|⁴|ζ(σ+2it)|≥1 类型）。</li>\n          <li><strong>陶伯/佩龙：</strong>用复积分（佩龙公式）把 ∑ Λ(n)n^{-s} 变回 ∑_{n≤x} Λ(n)=ψ(x)，主极点 s=1 贡献主项 x，其余积分在左移轮廓后成为误差。</li>\n          <li>得 ψ(x)∼x，再由初等变换得 π(x)∼x/ln x。</li>\n        </ol>\n        <p class=\"qed\">∎（战略完备；ζ 无零与陶伯估计需专书展开）</p>\n\n        <h3>为何「初等证明」也难</h3>\n        <p>1949 塞尔伯格–爱尔特希给出不显式使用复变的证明，但仍依赖精巧的对称公式与渐近，并非「高中初等」。</p>\n      ", "deep": "\n        <h3>误差项与黎曼假设</h3>\n        <p>RH 断言 ζ 的非平凡零点都在 Re s=1/2。若 RH 成立，则\n          π(x) = li(x) + O(√x ln x) 一类强误差。PNT 本身弱于 RH。</p>\n        <h3>数值</h3>\n        <p>π(10³)=168，1000/ln1000≈144.8；π(10⁶)=78498，10⁶/ln(10⁶)≈72382。比值缓慢→1。</p>\n        <div class=\"diagram\">\n          <svg viewBox=\"0 0 480 120\" xmlns=\"http://www.w3.org/2000/svg\">\n            <rect width=\"480\" height=\"120\" fill=\"#0f172a\"/>\n            <text x=\"24\" y=\"40\" fill=\"#e2e8f0\" font-size=\"14\">逻辑链：素数 ↔ 欧拉乘积 ↔ ζ ↔ 无零点 ↔ ψ(x)∼x ↔ PNT</text>\n            <text x=\"24\" y=\"75\" fill=\"#94a3b8\" font-size=\"13\">把「数数」变成「复分析」是 19 世纪的伟大翻译</text>\n          </svg>\n        </div>\n      ", "why": "\n        <p>密码学选大质数的尺度感、随机模型、解析数论，都以它为背景音。</p>\n      ", "try": "\n        <ul>\n          <li>拖 X=50、200、500，看比值 π(x)/(x/ln x) 是否靠近 1。</li>\n          <li>手算 π(30) 是否接近 30/ln30。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "pnt", "title": "prime number theorem", "subtitle": "How dense are prime numbers? Approximately every ln x encounters one", "emoji": "📊", "iconClass": "warm", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["number theory", "analyze", "asymptotically"], "era": "Conjectured 18th–19th centuries; proved 1896", "oneLiner": "There are approximately x/ln x primes up to x - the larger x, the rarer the primes, but the density pattern is clean.", "people": [{"role": "Numerical observations/conjectures", "name": "Gauss, Legendre", "years": "Since about 1792"}, {"role": "Proven for the first time", "name": "Adama, de la Valle-Poussin", "years": "1896"}, {"role": "elementary proof", "name": "Selberg, Eltsey", "years": "1949"}], "related": ["euclid-primes", "fta-arith", "basel"], "sections": {"story": "\n<p>We already know that there are infinite prime numbers, and I would like to ask: How many prime numbers are there among the first x positive integers? Denote it as π(x). Gauss guessed when he was young: about x/ln x.</p>\n<p>The rigorous proof was only completed in 1896, using ζ in the complex function. You can see for yourself on the graph that π(x) and x/ln x are getting closer and closer.</p>\n<div class=\"interactive\" data-widget=\"pnt-chart\"></div>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>The prime numbers up to x are approximately <span data-latex=\"x/\\ln x\">x/ln x</span> indivual.</p>\n<div class=\"formula\" data-latex=\"\\pi(x)\\sim\\dfrac{x}{\\ln x}\"></div>\n<div class=\"formula\" data-latex=\"\\lim_{x\\to\\infty}\\pi(x)\\cdot\\dfrac{\\ln x}{x}=1\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Riemann zeta function (role required for proof)</div>\n<div class=\"calc-line\" data-latex=\"ζ(s) = \\sum_{n=1}^\\infty n^{-s} = \\prod _p (1-p^{-s})^{-1} （Re s \\gt  1）\"></div>\n<p>The Euler product ties ζ to the prime numbers. ζ can be analytically extended to the complex plane (except for the poles with s=1).</p>\n</div>\n<div class=\"def-box\">\n<div class=\"def-title\">Chebyshev function</div>\n<div class=\"calc-line\" data-latex=\"\\psi (x) = \\sum_{p^k \\le x} ln p\"></div>\n<p>PNT ⇔ ψ(x)∼x. ψ is more suitable for analysis than π.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (ζ has no zeros or primes)</div>\n<p>If ζ has no zero point on the straight line with Re s=1, then ψ(x)∼x can be deduced. Adamard and de la Valle-Poussin proved exactly that ζ(1+it)≠0 (t≠0).</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Newman/Wiener-Pond Prototype Theorem (Outline)</div>\n<p>The Dirichlet series of −ζ'/ζ is controlled by the analytical properties of ζ, and then the Tauber type theorem is used to translate the \"generating function behavior\" into ψ(x)∼x.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Program the prime numbers into the ζ function, prove that ζ has no zero points on a certain line, and then translate it back to the asymptotic formula of \"prime number counting\" - this is the strategy, and the details are a large part of the analysis.</p>\n<div class=\"proof-nav\"><span>strategy map</span><span>Incomplete professional certificate</span><span>Logical chain closure instructions</span></div>\n<h3>Overall Strategy (1896 Analytical Evidence)</h3>\n<ol class=\"steps\">\n<li><strong>Encoded primes:</strong>For Re s≥1,\n            <div class=\"calc-line\" data-latex=\"-ζ'(s)/ζ(s) = \\sum_{n\\ge 1} Λ(n) n^{-s}\"></div>\n            where Λ(n)=ln p when n=p^k, 0 otherwise. This is the \"generating function\" of ψ.\n          </li>\n<li><strong>Analytical continuation:</strong>ζ has simple poles at s=1, and the rest have no zeros at Re s≥1 (proof required). So the behavior of −ζ'/ζ is controllable on Re s≥1 (except the poles where s=1).</li>\n<li><strong>Key difficulties:</strong>Prove that ζ(1+it)≠0. If ζ(1+it₀)=0, then the Euler product/triangle inequality has a cancellation that is incompatible with ζ having a pole near 1 (classical 3ζ inequality: ζ(σ)³|ζ(σ+it)|⁴|ζ(σ+2it)|≥1 type).</li>\n<li><strong>Tauber/Perron:</strong>Use complex integral (Perron's formula) to transform ∑ Λ(n)n^{-s} back to ∑_{n≤x} Λ(n)=ψ(x), the main pole s=1 contributes the main term x, and the remaining integrals become errors after shifting the contour to the left.</li>\n<li>We get ψ(x)∼x, and then use elementary transformation to get π(x)∼x/ln x.</li>\n</ol>\n<p class=\"qed\">∎ (The strategy is complete; Wu Zero and Tao Bo probably need a special book to expand it)</p>\n<h3>Why is \"elementary proof\" difficult?</h3>\n<p>1949 Selberg-Altsch gave a proof that did not explicitly use complex variables, but still relied on sophisticated symmetry formulas and asymptotics, which was not \"elementary high school\".</p>\n", "deep": "\n<h3>Error term and Riemann hypothesis</h3>\n<p>RH asserts that the nontrivial zeros of ζ are all at Re s=1/2. If RH holds, then\n          π(x) = li(x) + O(√x ln x) A type of strong error. PNT itself is weaker than RH.</p>\n<h3>numerical value</h3>\n<p>π(10³)=168, 1000/ln1000≈144.8; π(10⁶)=78498, 10⁶/ln(10⁶)≈72382. Ratio slowly → 1.</p>\n<div class=\"diagram\">\n<svg viewbox=\"0 0 480 120\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#0f172a\" height=\"120\" width=\"480\"></rect>\n<text fill=\"#e2e8f0\" font-size=\"14\" x=\"24\" y=\"40\">Logical chain: Prime ↔ Euler product ↔ ζ ↔ No zeros ↔ ψ(x)∼x ↔ PNT</text>\n<text fill=\"#94a3b8\" font-size=\"13\" x=\"24\" y=\"75\">Turning \"counting\" into \"complex analysis\" was the great translation of the 19th century</text>\n</svg>\n</div>\n", "why": "\n<p>The sense of scale, stochastic models, and analytic number theory for choosing large prime numbers in cryptography all use it as the background sound.</p>\n", "try": "\n<ul>\n<li>Drag X=50, 200, 500 to see if the ratio π(x)/(x/ln x) is close to 1.</li>\n<li>Calculate by hand whether π(30) is close to 30/ln30.</li>\n</ul>\n"}, "field": "math"}}, "title": "prime number theorem", "subtitle": "How dense are prime numbers? Approximately every ln x encounters one", "difficultyLabel": "Hardcore challenge", "tags": ["number theory", "analyze", "asymptotically"], "era": "Conjectured 18th–19th centuries; proved 1896", "oneLiner": "There are approximately x/ln x primes up to x - the larger x, the rarer the primes, but the density pattern is clean.", "people": [{"role": "Numerical observations/conjectures", "name": "Gauss, Legendre", "years": "Since about 1792"}, {"role": "Proven for the first time", "name": "Adama, de la Valle-Poussin", "years": "1896"}, {"role": "elementary proof", "name": "Selberg, Eltsey", "years": "1949"}], "sections": {"story": "\n<p>We already know that there are infinite prime numbers, and I would like to ask: How many prime numbers are there among the first x positive integers? Denote it as π(x). Gauss guessed when he was young: about x/ln x.</p>\n<p>The rigorous proof was only completed in 1896, using ζ in the complex function. You can see for yourself on the graph that π(x) and x/ln x are getting closer and closer.</p>\n<div class=\"interactive\" data-widget=\"pnt-chart\"></div>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>The prime numbers up to x are approximately <span data-latex=\"x/\\ln x\">x/ln x</span> indivual.</p>\n<div class=\"formula\" data-latex=\"\\pi(x)\\sim\\dfrac{x}{\\ln x}\"></div>\n<div class=\"formula\" data-latex=\"\\lim_{x\\to\\infty}\\pi(x)\\cdot\\dfrac{\\ln x}{x}=1\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Riemann zeta function (role required for proof)</div>\n<div class=\"calc-line\" data-latex=\"ζ(s) = \\sum_{n=1}^\\infty n^{-s} = \\prod _p (1-p^{-s})^{-1} （Re s \\gt  1）\"></div>\n<p>The Euler product ties ζ to the prime numbers. ζ can be analytically extended to the complex plane (except for the poles with s=1).</p>\n</div>\n<div class=\"def-box\">\n<div class=\"def-title\">Chebyshev function</div>\n<div class=\"calc-line\" data-latex=\"\\psi (x) = \\sum_{p^k \\le x} ln p\"></div>\n<p>PNT ⇔ ψ(x)∼x. ψ is more suitable for analysis than π.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (ζ has no zeros or primes)</div>\n<p>If ζ has no zero point on the straight line with Re s=1, then ψ(x)∼x can be deduced. Adamard and de la Valle-Poussin proved exactly that ζ(1+it)≠0 (t≠0).</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Newman/Wiener-Pond Prototype Theorem (Outline)</div>\n<p>The Dirichlet series of −ζ'/ζ is controlled by the analytical properties of ζ, and then the Tauber type theorem is used to translate the \"generating function behavior\" into ψ(x)∼x.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Program the prime numbers into the ζ function, prove that ζ has no zero points on a certain line, and then translate it back to the asymptotic formula of \"prime number counting\" - this is the strategy, and the details are a large part of the analysis.</p>\n<div class=\"proof-nav\"><span>strategy map</span><span>Incomplete professional certificate</span><span>Logical chain closure instructions</span></div>\n<h3>Overall Strategy (1896 Analytical Evidence)</h3>\n<ol class=\"steps\">\n<li><strong>Encoded primes:</strong>For Re s≥1,\n            <div class=\"calc-line\" data-latex=\"-ζ'(s)/ζ(s) = \\sum_{n\\ge 1} Λ(n) n^{-s}\"></div>\n            where Λ(n)=ln p when n=p^k, 0 otherwise. This is the \"generating function\" of ψ.\n          </li>\n<li><strong>Analytical continuation:</strong>ζ has simple poles at s=1, and the rest have no zeros at Re s≥1 (proof required). So the behavior of −ζ'/ζ is controllable on Re s≥1 (except the poles where s=1).</li>\n<li><strong>Key difficulties:</strong>Prove that ζ(1+it)≠0. If ζ(1+it₀)=0, then the Euler product/triangle inequality has a cancellation that is incompatible with ζ having a pole near 1 (classical 3ζ inequality: ζ(σ)³|ζ(σ+it)|⁴|ζ(σ+2it)|≥1 type).</li>\n<li><strong>Tauber/Perron:</strong>Use complex integral (Perron's formula) to transform ∑ Λ(n)n^{-s} back to ∑_{n≤x} Λ(n)=ψ(x), the main pole s=1 contributes the main term x, and the remaining integrals become errors after shifting the contour to the left.</li>\n<li>We get ψ(x)∼x, and then use elementary transformation to get π(x)∼x/ln x.</li>\n</ol>\n<p class=\"qed\">∎ (The strategy is complete; Wu Zero and Tao Bo probably need a special book to expand it)</p>\n<h3>Why is \"elementary proof\" difficult?</h3>\n<p>1949 Selberg-Altsch gave a proof that did not explicitly use complex variables, but still relied on sophisticated symmetry formulas and asymptotics, which was not \"elementary high school\".</p>\n", "deep": "\n<h3>Error term and Riemann hypothesis</h3>\n<p>RH asserts that the nontrivial zeros of ζ are all at Re s=1/2. If RH holds, then\n          π(x) = li(x) + O(√x ln x) A type of strong error. PNT itself is weaker than RH.</p>\n<h3>numerical value</h3>\n<p>π(10³)=168, 1000/ln1000≈144.8; π(10⁶)=78498, 10⁶/ln(10⁶)≈72382. Ratio slowly → 1.</p>\n<div class=\"diagram\">\n<svg viewbox=\"0 0 480 120\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#0f172a\" height=\"120\" width=\"480\"></rect>\n<text fill=\"#e2e8f0\" font-size=\"14\" x=\"24\" y=\"40\">Logical chain: Prime ↔ Euler product ↔ ζ ↔ No zeros ↔ ψ(x)∼x ↔ PNT</text>\n<text fill=\"#94a3b8\" font-size=\"13\" x=\"24\" y=\"75\">Turning \"counting\" into \"complex analysis\" was the great translation of the 19th century</text>\n</svg>\n</div>\n", "why": "\n<p>The sense of scale, stochastic models, and analytic number theory for choosing large prime numbers in cryptography all use it as the background sound.</p>\n", "try": "\n<ul>\n<li>Drag X=50, 200, 500 to see if the ratio π(x)/(x/ln x) is close to 1.</li>\n<li>Calculate by hand whether π(30) is close to 30/ln30.</li>\n</ul>\n"}}, {"id": "gauss-bonnet", "field": "math", "difficulty": "hard", "emoji": "🌐", "iconClass": "purple", "related": ["euler-polyhedron", "riemann-mapping", "kakeya"], "__i18n": {"zh": {"id": "gauss-bonnet", "title": "高斯–博内定理", "subtitle": "弯度积分 = 拓扑身份证", "emoji": "🌐", "iconClass": "purple", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["微分几何", "拓扑", "曲率"], "era": "高斯 1827；博内；陈省身推广", "oneLiner": "曲面上曲率加总，得到的竟是拓扑量：和「有几个洞」绑定，不跟你怎么揉皮筋绑定。", "people": [{"role": "局部/绝妙定理相关", "name": "高斯", "years": "1827"}, {"role": "全局形式", "name": "博内等", "years": "19 世纪"}, {"role": "高维示性类", "name": "陈省身", "years": "1940s"}], "related": ["euler-polyhedron", "riemann-mapping", "kakeya"], "sections": {"story": "\n        <p>地球上的大三角，内角和大于 180°——多出来的叫角盈，刚好等于那块球面的面积（单位球）。</p>\n        <p>高斯–博内说得更狠：把曲率全部加起来，答案由曲面「有几个洞」决定。球面永远是 4π，甜甜圈（环面）正负曲率抵消得 0。</p>\n      \n<div class=\"interactive\" data-widget=\"gauss-bonnet\"></div>", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>曲率积分等于拓扑量，和「有几个洞」绑定。</p>\n        <p>紧致无边可定向曲面：</p>\n        <div class=\"formula\" data-latex=\"\\iint_\\Sigma K\\,dA=2\\pi\\,\\chi(\\Sigma)\"></div>\n        <p>有边界时还要加上边界测地曲率：</p>\n        <div class=\"formula\" data-latex=\"\\iint_\\Sigma K\\,dA+\\int_{\\partial\\Sigma}k_g\\,ds=2\\pi\\,\\chi(\\Sigma)\"></div>\n      ", "setup": "\n        <div class=\"def-box\">\n          <div class=\"def-title\">高斯曲率 K</div>\n          <p>主曲率乘积。球面半径 R：K=1/R²。平面 K=0。马鞍点 K≤0。</p>\n        </div>\n        <div class=\"def-box\">\n          <div class=\"def-title\">欧拉示性数</div>\n          <p>对三角剖分 χ=V−E+F；同胚不变。球面 2，环面 0，双环面 −2。</p>\n        </div>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">引理（球面三角）</div>\n          <p>单位球上以大圆弧为边的三角形，面积 = 角盈 A+B+C−π。</p>\n        </div>\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">绝妙定理（Gauss Theorema Egregium）</div>\n          <p>K 只依赖于第一基本形式（内蕴度量），与嵌入方式无关——纸不能无皱铺到球上。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>小三角上：角盈=曲率积分；拼满闭曲面后，局部抵消，只剩拓扑贡献 2πχ。</p>\n        <div class=\"proof-nav\"><span>局部角盈</span><span>拼起来</span><span>边界项</span></div>\n        <h3>教学证明纲要（光滑闭曲面）</h3>\n        <ol class=\"steps\">\n          <li><strong>剖分：</strong>把 Σ 分成许多测地三角形（边为测地线），足够细。</li>\n          <li><strong>每个三角形：</strong>在曲面几何中有高斯–博内局部式：\n            <div class=\"calc-line\" data-latex=\"\\iint_{\\Delta } K dA + \\text{边界测地曲率贡献} + \\text{顶点外角} = 2\\pi\"></div>\n            对测地三角形，边的 k_g=0，化为：∬_Δ K + (π − 内角和的补) 形式 → 角盈 = ∬_Δ K。\n          </li>\n          <li><strong>求和：</strong>∑ ∬_Δ K = ∬_Σ K。角盈总和用组合方式计数：每个顶点处内角和为 2π（光滑点），最终只剩下拓扑贡献 2π χ。</li>\n          <li>更组合的路径：对多面体（K 集中在顶点，像角盈的离散版）验证 ∑ 角亏 = 2π χ，再取细密多面体逼近光滑曲面。</li>\n          <li>得 ∬ K dA = 2π χ(Σ)。</li>\n        </ol>\n        <p class=\"qed\">∎（纲要）</p>\n        <h3>多面体离散版（可验算）</h3>\n        <ol class=\"steps\">\n          <li>在顶点 v，角亏 δ_v = 2π − （会聚面角之和）。</li>\n          <li>笛卡尔：∑_v δ_v = 2π χ。对立方体：8 个顶点各角亏 π/2，总和 4π = 2π·2。</li>\n          <li>这是高斯–博内的「曲率原子」版本：光滑时角亏弥散成 K dA。</li>\n        </ol>\n      ", "deep": "\n        <h3>环面为什么平均曲率「正负抵消」</h3>\n        <p>环面外侧 K≥0，内侧洞口附近 K≤0，积分恰为 0，与 χ=0 一致——你不能处处正曲率地实现环面。</p>\n        <h3>陈省身</h3>\n        <p>把示性类与曲率形式联系起来，高维高斯–博内成为整体微分几何的支柱。</p>\n      ", "why": "\n        <p>广义相对论里曲率编码引力；材料缺陷、纯数学里分析与拓扑的桥梁。</p>\n      ", "try": "\n        <ul>\n          <li>拖角盈，看球面三角如何「鼓」起来。</li>\n          <li>数立方体每个角的「角亏」，总和应是 4π（对应 χ=2）。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "gauss-bonnet", "title": "Gauss–Bonnet theorem", "subtitle": "camber integral = topological ID", "emoji": "🌐", "iconClass": "purple", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["differential geometry", "Topology", "curvature"], "era": "Gauss 1827; Bonnet; popularized by Chen Shengshen", "oneLiner": "The sum of the curvatures on the surface turns out to be a topological quantity: it is bound to \"how many holes there are\" and not to how you rub the rubber band.", "people": [{"role": "Local/Brilliant Theorem Related", "name": "Gaussian", "years": "1827"}, {"role": "global form", "name": "Bonnet et al.", "years": "19th century"}, {"role": "High dimensional representation class", "name": "Chen Shengshen", "years": "1940s"}], "related": ["euler-polyhedron", "riemann-mapping", "kakeya"], "sections": {"story": "\n<p>The sum of the interior angles of a large triangle on the earth is greater than 180° - the extra angle is called the angle surplus, which is exactly equal to the area of ​​the spherical surface (unit sphere).</p>\n<p>Gauss-Bonnet said even more harshly: Add up all the curvatures, and the answer depends on \"how many holes\" the surface has. The sphere is always 4π, and the positive and negative curvatures of the donut (torus) cancel out to 0.</p>\n<div class=\"interactive\" data-widget=\"gauss-bonnet\"></div>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>The curvature integral is equal to the topological quantity and is bound to \"how many holes are there\".</p>\n<p>Compact boundless orientable surface:</p>\n<div class=\"formula\" data-latex=\"\\iint_\\Sigma K\\,dA=2\\pi\\,\\chi(\\Sigma)\"></div>\n<p>When there is a boundary, the boundary geodesic curvature must also be added:</p>\n<div class=\"formula\" data-latex=\"\\iint_\\Sigma K\\,dA+\\int_{\\partial\\Sigma}k_g\\,ds=2\\pi\\,\\chi(\\Sigma)\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Gaussian curvature K</div>\n<p>Principal curvature product. Spherical radius R: K=1/R². Plane K=0. Saddle point K≤0.</p>\n</div>\n<div class=\"def-box\">\n<div class=\"def-title\">Euler characteristic number</div>\n<p>For triangulation χ=V−E+F; homeomorphism is unchanged. Sphere 2, torus 0, double torus −2.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (Spherical Trigonometry)</div>\n<p>A triangle on the unit sphere with a great arc as its side has area = angle surplus A+B+C−π.</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Gauss Theorema Egregium</div>\n<p>K depends only on the first fundamental form (the intrinsic metric) and has nothing to do with the embedding method - the paper cannot be laid out wrinkle-free on the ball.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>On the small triangle: angle surplus = integral of curvature; after the closed surface is filled, it is partially offset, leaving only the topological contribution 2πχ.</p>\n<div class=\"proof-nav\"><span>local angle surplus</span><span>Put it together</span><span>boundary term</span></div>\n<h3>Teaching Certificate Outline (Smooth Closed Surface)</h3>\n<ol class=\"steps\">\n<li><strong>Dissection:</strong>Divide Σ into many geodesic triangles (sides are geodesics), thin enough.</li>\n<li><strong>Each triangle:</strong>In surface geometry there are Gauss–Bonnet local formulas:\n            <div class=\"calc-line\" data-latex=\"\\iint_{\\Delta } K dA + \\text{边界测地曲率贡献} + \\text{顶点外角} = 2\\pi\"></div>\n            For a geodesic triangle, k_g=0 of the side becomes: ∬_Δ K + (π − complement of the sum of interior angles) in the form → angle surplus = ∬_Δ K.\n          </li>\n<li><strong>Sum:</strong>∑ ∬_Δ K = ∬_Σ K. The angle sums are counted in a combinatorial manner: the interior angles at each vertex sum to 2π (smooth points), leaving only the topological contribution 2π χ.</li>\n<li>A more combined path: Verify ∑ angular loss = 2π χ for polyhedrons (K is concentrated at the vertices, like the discrete version of angular excess), and then use a dense polyhedron to approximate a smooth surface.</li>\n<li>We get ∬ K dA = 2π χ(Σ).</li>\n</ol>\n<p class=\"qed\">∎(outline)</p>\n<h3>Polyhedral discrete version (can be verified)</h3>\n<ol class=\"steps\">\n<li>At the vertex v, the angle loss δ_v = 2π − (sum of the convergence surface angles).</li>\n<li>Descartes: ∑_v δ_v = 2π χ. For a cube: each of the 8 vertices has a loss of π/2, and the total is 4π = 2π·2.</li>\n<li>This is the Gauss-Bonnet version of the \"atoms of curvature\": when smooth, the angular deficit spreads out to K dA.</li>\n</ol>\n", "deep": "\n<h3>Why does the average curvature of the torus \"positive and negative cancel out\"</h3>\n<p>K≥0 on the outside of the torus, K≤0 near the inside hole, the integral is exactly 0, consistent with χ=0 - you cannot realize the torus with positive curvature everywhere.</p>\n<h3>Chen Shengshen</h3>\n<p>Relating representative classes to forms of curvature, high-dimensional Gauss-Bonnet became the backbone of overall differential geometry.</p>\n", "why": "\n<p>Curvature encodes gravity in general relativity; material defects, the bridge between analysis and topology in pure mathematics.</p>\n", "try": "\n<ul>\n<li>Drag the angle to see how the spherical triangle \"bulges\".</li>\n<li>Count the \"angular deficit\" of each corner of the cube. The sum should be 4π (corresponding to χ=2).</li>\n</ul>\n"}, "field": "math"}}, "title": "Gauss–Bonnet theorem", "subtitle": "camber integral = topological ID", "difficultyLabel": "Hardcore challenge", "tags": ["differential geometry", "Topology", "curvature"], "era": "Gauss 1827; Bonnet; popularized by Chen Shengshen", "oneLiner": "The sum of the curvatures on the surface turns out to be a topological quantity: it is bound to \"how many holes there are\" and not to how you rub the rubber band.", "people": [{"role": "Local/Brilliant Theorem Related", "name": "Gaussian", "years": "1827"}, {"role": "global form", "name": "Bonnet et al.", "years": "19th century"}, {"role": "High dimensional representation class", "name": "Chen Shengshen", "years": "1940s"}], "sections": {"story": "\n<p>The sum of the interior angles of a large triangle on the earth is greater than 180° - the extra angle is called the angle surplus, which is exactly equal to the area of ​​the spherical surface (unit sphere).</p>\n<p>Gauss-Bonnet said even more harshly: Add up all the curvatures, and the answer depends on \"how many holes\" the surface has. The sphere is always 4π, and the positive and negative curvatures of the donut (torus) cancel out to 0.</p>\n<div class=\"interactive\" data-widget=\"gauss-bonnet\"></div>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>The curvature integral is equal to the topological quantity and is bound to \"how many holes are there\".</p>\n<p>Compact boundless orientable surface:</p>\n<div class=\"formula\" data-latex=\"\\iint_\\Sigma K\\,dA=2\\pi\\,\\chi(\\Sigma)\"></div>\n<p>When there is a boundary, the boundary geodesic curvature must also be added:</p>\n<div class=\"formula\" data-latex=\"\\iint_\\Sigma K\\,dA+\\int_{\\partial\\Sigma}k_g\\,ds=2\\pi\\,\\chi(\\Sigma)\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Gaussian curvature K</div>\n<p>Principal curvature product. Spherical radius R: K=1/R². Plane K=0. Saddle point K≤0.</p>\n</div>\n<div class=\"def-box\">\n<div class=\"def-title\">Euler characteristic number</div>\n<p>For triangulation χ=V−E+F; homeomorphism is unchanged. Sphere 2, torus 0, double torus −2.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Lemma (Spherical Trigonometry)</div>\n<p>A triangle on the unit sphere with a great arc as its side has area = angle surplus A+B+C−π.</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Gauss Theorema Egregium</div>\n<p>K depends only on the first fundamental form (the intrinsic metric) and has nothing to do with the embedding method - the paper cannot be laid out wrinkle-free on the ball.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>On the small triangle: angle surplus = integral of curvature; after the closed surface is filled, it is partially offset, leaving only the topological contribution 2πχ.</p>\n<div class=\"proof-nav\"><span>local angle surplus</span><span>Put it together</span><span>boundary term</span></div>\n<h3>Teaching Certificate Outline (Smooth Closed Surface)</h3>\n<ol class=\"steps\">\n<li><strong>Dissection:</strong>Divide Σ into many geodesic triangles (sides are geodesics), thin enough.</li>\n<li><strong>Each triangle:</strong>In surface geometry there are Gauss–Bonnet local formulas:\n            <div class=\"calc-line\" data-latex=\"\\iint_{\\Delta } K dA + \\text{边界测地曲率贡献} + \\text{顶点外角} = 2\\pi\"></div>\n            For a geodesic triangle, k_g=0 of the side becomes: ∬_Δ K + (π − complement of the sum of interior angles) in the form → angle surplus = ∬_Δ K.\n          </li>\n<li><strong>Sum:</strong>∑ ∬_Δ K = ∬_Σ K. The angle sums are counted in a combinatorial manner: the interior angles at each vertex sum to 2π (smooth points), leaving only the topological contribution 2π χ.</li>\n<li>A more combined path: Verify ∑ angular loss = 2π χ for polyhedrons (K is concentrated at the vertices, like the discrete version of angular excess), and then use a dense polyhedron to approximate a smooth surface.</li>\n<li>We get ∬ K dA = 2π χ(Σ).</li>\n</ol>\n<p class=\"qed\">∎(outline)</p>\n<h3>Polyhedral discrete version (can be verified)</h3>\n<ol class=\"steps\">\n<li>At the vertex v, the angle loss δ_v = 2π − (sum of the convergence surface angles).</li>\n<li>Descartes: ∑_v δ_v = 2π χ. For a cube: each of the 8 vertices has a loss of π/2, and the total is 4π = 2π·2.</li>\n<li>This is the Gauss-Bonnet version of the \"atoms of curvature\": when smooth, the angular deficit spreads out to K dA.</li>\n</ol>\n", "deep": "\n<h3>Why does the average curvature of the torus \"positive and negative cancel out\"</h3>\n<p>K≥0 on the outside of the torus, K≤0 near the inside hole, the integral is exactly 0, consistent with χ=0 - you cannot realize the torus with positive curvature everywhere.</p>\n<h3>Chen Shengshen</h3>\n<p>Relating representative classes to forms of curvature, high-dimensional Gauss-Bonnet became the backbone of overall differential geometry.</p>\n", "why": "\n<p>Curvature encodes gravity in general relativity; material defects, the bridge between analysis and topology in pure mathematics.</p>\n", "try": "\n<ul>\n<li>Drag the angle to see how the spherical triangle \"bulges\".</li>\n<li>Count the \"angular deficit\" of each corner of the cube. The sum should be 4π (corresponding to χ=2).</li>\n</ul>\n"}}, {"id": "riemann-mapping", "field": "math", "difficulty": "hard", "emoji": "🔮", "iconClass": "", "related": ["gauss-bonnet", "fta", "euler-identity"], "__i18n": {"zh": {"id": "riemann-mapping", "title": "黎曼映射定理", "subtitle": "奇形怪状，也能抚成圆——还保角度", "emoji": "🔮", "iconClass": "", "difficulty": "hard", "difficultyLabel": "硬核挑战", "tags": ["复分析", "共形", "黎曼"], "era": "1851 黎曼；卡拉西奥多里等严格化", "oneLiner": "平面上任意「连成一片、没有洞」的开区域（不是整个平面），都能保角地变成标准单位圆盘。", "people": [{"role": "提出并论证", "name": "波恩哈德·黎曼", "years": "1851 博士论文"}, {"role": "严格存在性", "name": "卡拉西奥多里、柯西等后人", "years": "20 世纪初完善"}], "related": ["gauss-bonnet", "fta", "euler-identity"], "sections": {"story": "\n        <p>复分析很刚又很柔：全纯函数一点定全局，但区域形状却极度自由——只要单连通、不是整个平面，就存在保角一一映射把它变成单位圆盘。</p>\n        <p>角度（形状的局部样子）保留，长度可以整体缩放。这是「标准化」工具箱里的大杀器。</p>\n      \n<div class=\"interactive\" data-widget=\"riemann-map\"></div>", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>单连通、不是全平面的开区域，都能保角变成单位圆盘。</p>\n        <div class=\"formula\" data-latex=\"\\Omega\\subset\\mathbb{C}\\text{ 单连通},\\ \\Omega\\ne\\mathbb{C}\\ \\Rightarrow\\ \\exists\\ f:\\Omega\\xrightarrow{\\text{双全纯}}\\mathbb{D}\"></div>\n        <p>若再规定 <span data-latex=\"f(z_0)=0\">f(z₀)=0</span> 且 <span data-latex=\"f'(z_0)>0\">f'(z₀)>0</span>，则 f 唯一。</p>\n      ", "setup": "\n        <div class=\"def-box\">\n          <div class=\"def-title\">共形 / 全纯双射</div>\n          <p>f 全纯且 f'≠0 时局部保角。双射 + 全纯 ⇒ 逆也全纯（复分析定理）。</p>\n        </div>\n        <div class=\"def-box\">\n          <div class=\"def-title\">正规族</div>\n          <p>全纯函数族若局部一致有界，则有局部一致收敛子列（蒙泰尔）。用于抽取极限映射。</p>\n        </div>\n      ", "lemmas": "\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">施瓦茨引理</div>\n          <p>f:𝔻→𝔻 全纯，f(0)=0 ⇒ |f(z)|≤|z|，|f'(0)|≤1；等号则旋转。</p>\n        </div>\n        <div class=\"lemma-box\">\n          <div class=\"lemma-title\">黎曼可去 / 双全纯开映射</div>\n          <p>非常数全纯映射为开映射；单叶全纯的逆全纯。</p>\n        </div>\n      ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>在所有「映进圆盘」的候选映射里挑「撑得最开」的那个；若还没盖满圆盘，就能再撑大一点——矛盾，故必满射。</p>\n        <div class=\"proof-nav\"><span>函数族</span><span>极值</span><span>证明是满射</span></div>\n        <h3>现代存在性证明纲要（卡拉西奥多里–克贝路线）</h3>\n        <ol class=\"steps\">\n          <li><strong>化简：</strong>因 Ω≠ℂ，存在 a∉Ω。通过平移与开方/平方根分支等（利用单连通可选分支），可构造单叶全纯映射把 Ω 映入 𝔻，且某点 z₀ 映到 0 附近。即：函数族\n            <div class=\"calc-line\" data-latex=\"ℱ = { f: Ω\\to \\mathbb{D} \\text{全纯单叶} : f(z_{0})=0, f'(z_{0})\\gt 0 }\"></div>\n            非空。\n          </li>\n          <li><strong>取极值：</strong>在 ℱ 中最大化 f'(z₀)（或等价地用蒙泰尔正规族取极限）。得 f∈ℱ 使 f'(z₀) 最大。</li>\n          <li><strong>f 必满射到 𝔻：</strong>反设漏掉某 α∈𝔻。用布拉施克因子与开方构造\n            一个「把 α 挖掉后的圆盘」映回 𝔻 的函数，与 f 复合，得到 g∈ℱ 且 g'(z₀)≥f'(z₀)，矛盾。\n            <ul class=\"substeps\">\n              <li>这一步是证明的几何核心：若像集不是整个圆盘，就能「再撑大一点」导数。</li>\n            </ul>\n          </li>\n          <li><strong>唯一性：</strong>若 f,g 都满足规范化，则 φ = f ∘ g^{-1}: 𝔻→𝔻 是自同构且 φ(0)=0, φ'(0)≥0，由施瓦茨知 φ=id。</li>\n        </ol>\n        <p class=\"qed\">∎（纲要；单连通用于开方分支与单叶性构造）</p>\n      ", "deep": "\n        <h3>边界对应</h3>\n        <p>若 ∂Ω 足够好（若尔当曲线），则 f 可连续延拓到边界的同胚（卡拉西奥多里定理）。</p>\n        <h3>计算现实</h3>\n        <p>显式 f 只对特殊区域可写（半平面、多边形的施瓦茨–克里斯托费尔）。一般靠数值共形映射。</p>\n        <h3>与物理学</h3>\n        <p>二维静电、流体、热平衡中的势线/场线正交网，正是共形网的物理版。</p>\n      ", "why": "\n        <p>二维流体、静电、图形参数化，常把怪区域先映成圆再算。理论上则是复分析的地基之一。</p>\n      ", "try": "\n        <ul>\n          <li>拖「起伏」和「进度」，看边界如何被抚圆。</li>\n          <li>记住：整个平面、有洞的环，都不适用本定理。</li>\n        </ul>\n      "}, "field": "math"}, "en": {"id": "riemann-mapping", "title": "Riemann mapping theorem", "subtitle": "Weird shapes can also be shaped into a round shape - the angles are maintained", "emoji": "🔮", "iconClass": "", "difficulty": "hard", "difficultyLabel": "Hardcore challenge", "tags": ["complex analysis", "Conformal", "Riemann"], "era": "1851 Riemann; Karatheodori et al. Rigorization", "oneLiner": "Any open area on the plane that is \"connected and has no holes\" (not the entire plane) can be transformed into a standard unit disk conformally.", "people": [{"role": "propose and demonstrate", "name": "Bornhard Riemann", "years": "1851 PhD thesis"}, {"role": "strict existence", "name": "Karatheodori, Cauchy and other descendants", "years": "Perfected in the early 20th century"}], "related": ["gauss-bonnet", "fta", "euler-identity"], "sections": {"story": "\n<p>Complex analysis is very rigid and very flexible: a holomorphic function determines the global situation at one point, but the regional shape is extremely free - as long as it is simply connected and not the entire plane, there is a conformal one-to-one mapping to turn it into a unit disk.</p>\n<p>Angles (partial aspects of the shape) are preserved, and lengths can be scaled as a whole. This is the big killer in the \"standardization\" toolbox.</p>\n<div class=\"interactive\" data-widget=\"riemann-map\"></div>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>A singly connected, open area that is not completely flat can be transformed into a unit disk conformally.</p>\n<div class=\"formula\" data-latex=\"\\Omega\\subset\\mathbb{C}\\text{ 单连通},\\ \\Omega\\ne\\mathbb{C}\\ \\Rightarrow\\ \\exists\\ f:\\Omega\\xrightarrow{\\text{双全纯}}\\mathbb{D}\"></div>\n<p>If further stipulated <span data-latex=\"f(z_0)=0\">f(z₀)=0</span> and <span data-latex=\"f'(z_0)&gt;0\">f'(z₀)&gt;0</span>, then f is unique.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">conformal / holomorphic bijection</div>\n<p>f is holomorphic and locally conformal when f'≠0. Bijection + holomorphy ⇒ The inverse is also holomorphic (complex analysis theorem).</p>\n</div>\n<div class=\"def-box\">\n<div class=\"def-title\">regular family</div>\n<p>If a family of holomorphic functions is locally consistent and bounded, it will have locally consistent convergent subsequences (Montell). Used to extract limit maps.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Schwartz's Lemma</div>\n<p>f:𝔻→𝔻 is holomorphic, f(0)=0 ⇒ |f(z)|≤|z|, |f'(0)|≤1; the equal sign means rotation.</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Riemannian reversible / dual pure open mapping</div>\n<p>A non-constant holomorphic map is an open map; a single-leaf holomorphic map is the inverse holomorphic map.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Among all the candidate mappings that are \"reflected into the disk\", choose the one that is \"most spread out\"; if it has not covered the disk, it can be stretched a little wider - a contradiction, so it must be full.</p>\n<div class=\"proof-nav\"><span>function family</span><span>extremum</span><span>Proved to be surjective</span></div>\n<h3>Outline of Modern Existence Proofs (Calla Theodore–Cebbe Line)</h3>\n<ol class=\"steps\">\n<li><strong>Simplify:</strong>Since Ω≠ℂ, there exists a∉Ω. Through translation and square root/square root branches (using simply connected optional branches), a single-leaf holomorphic map can be constructed to map Ω to 𝔻, and a certain point z₀ to be mapped to near 0. Namely: function family\n            <div class=\"calc-line\" data-latex=\"ℱ = { f: Ω\\to \\mathbb{D} \\text{全纯单叶} : f(z_{0})=0, f'(z_{0})\\gt 0 }\"></div>\n            Not empty.\n          </li>\n<li><strong>Take the extreme value:</strong>Maximize f'(z₀) in ℱ (or equivalently take the limit with the Monteil normal family). Obtain f∈ℱ to maximize f'(z₀).</li>\n<li><strong>f must be surjective to 𝔻:</strong>Counter-suppose that some α∈𝔻 is missing. Construction using Braschke factors and square roots\n            A \"disk after digging out α\" reflects the function of 𝔻, and when combined with f, we get g∈ℱ and g'(z₀)≥f'(z₀), which is a contradiction.\n            <ul class=\"substeps\">\n<li>This step is the geometric core of the proof: if the image set is not the entire disk, the derivative can be \"larger\".</li>\n</ul>\n</li>\n<li><strong>Uniqueness:</strong>If f and g both satisfy normalization, then φ = f ∘ g^{-1}: 𝔻→𝔻 is an automorphism and φ(0)=0, φ'(0)≥0, and Schwarz knows that φ=id.</li>\n</ol>\n<p class=\"qed\">∎ (Outline; simple connectivity is used for square root branches and single leaf structures)</p>\n", "deep": "\n<h3>Boundary correspondence</h3>\n<p>If ∂Ω is good enough (Jordan curve), then f can be continued continuously to the homeomorphism of the boundary (Carrastheodory's theorem).</p>\n<h3>computational reality</h3>\n<p>Explicit f is only writable for special regions (Schwarz–Christophel for half-planes, polygons). Generally rely on numerical conformal mapping.</p>\n<h3>and physics</h3>\n<p>The orthogonal network of potential lines/field lines in two-dimensional electrostatic, fluid, and thermal equilibrium is exactly the physical version of the conformal network.</p>\n", "why": "\n<p>For two-dimensional fluids, electrostatics, and graphic parameterization, strange areas are often mapped into circles first and then calculated. Theoretically, it is one of the foundations of complex analysis.</p>\n", "try": "\n<ul>\n<li>Drag \"undulation\" and \"progress\" to see how the border is rounded.</li>\n<li>Remember: this theorem does not apply to the entire plane or the ring with holes.</li>\n</ul>\n"}, "field": "math"}}, "title": "Riemann mapping theorem", "subtitle": "Weird shapes can also be shaped into a round shape - the angles are maintained", "difficultyLabel": "Hardcore challenge", "tags": ["complex analysis", "Conformal", "Riemann"], "era": "1851 Riemann; Karatheodori et al. Rigorization", "oneLiner": "Any open area on the plane that is \"connected and has no holes\" (not the entire plane) can be transformed into a standard unit disk conformally.", "people": [{"role": "propose and demonstrate", "name": "Bornhard Riemann", "years": "1851 PhD thesis"}, {"role": "strict existence", "name": "Karatheodori, Cauchy and other descendants", "years": "Perfected in the early 20th century"}], "sections": {"story": "\n<p>Complex analysis is very rigid and very flexible: a holomorphic function determines the global situation at one point, but the regional shape is extremely free - as long as it is simply connected and not the entire plane, there is a conformal one-to-one mapping to turn it into a unit disk.</p>\n<p>Angles (partial aspects of the shape) are preserved, and lengths can be scaled as a whole. This is the big killer in the \"standardization\" toolbox.</p>\n<div class=\"interactive\" data-widget=\"riemann-map\"></div>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>A singly connected, open area that is not completely flat can be transformed into a unit disk conformally.</p>\n<div class=\"formula\" data-latex=\"\\Omega\\subset\\mathbb{C}\\text{ 单连通},\\ \\Omega\\ne\\mathbb{C}\\ \\Rightarrow\\ \\exists\\ f:\\Omega\\xrightarrow{\\text{双全纯}}\\mathbb{D}\"></div>\n<p>If further stipulated <span data-latex=\"f(z_0)=0\">f(z₀)=0</span> and <span data-latex=\"f'(z_0)&gt;0\">f'(z₀)&gt;0</span>, then f is unique.</p>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">conformal / holomorphic bijection</div>\n<p>f is holomorphic and locally conformal when f'≠0. Bijection + holomorphy ⇒ The inverse is also holomorphic (complex analysis theorem).</p>\n</div>\n<div class=\"def-box\">\n<div class=\"def-title\">regular family</div>\n<p>If a family of holomorphic functions is locally consistent and bounded, it will have locally consistent convergent subsequences (Montell). Used to extract limit maps.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Schwartz's Lemma</div>\n<p>f:𝔻→𝔻 is holomorphic, f(0)=0 ⇒ |f(z)|≤|z|, |f'(0)|≤1; the equal sign means rotation.</p>\n</div>\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Riemannian reversible / dual pure open mapping</div>\n<p>A non-constant holomorphic map is an open map; a single-leaf holomorphic map is the inverse holomorphic map.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Among all the candidate mappings that are \"reflected into the disk\", choose the one that is \"most spread out\"; if it has not covered the disk, it can be stretched a little wider - a contradiction, so it must be full.</p>\n<div class=\"proof-nav\"><span>function family</span><span>extremum</span><span>Proved to be surjective</span></div>\n<h3>Outline of Modern Existence Proofs (Calla Theodore–Cebbe Line)</h3>\n<ol class=\"steps\">\n<li><strong>Simplify:</strong>Since Ω≠ℂ, there exists a∉Ω. Through translation and square root/square root branches (using simply connected optional branches), a single-leaf holomorphic map can be constructed to map Ω to 𝔻, and a certain point z₀ to be mapped to near 0. Namely: function family\n            <div class=\"calc-line\" data-latex=\"ℱ = { f: Ω\\to \\mathbb{D} \\text{全纯单叶} : f(z_{0})=0, f'(z_{0})\\gt 0 }\"></div>\n            Not empty.\n          </li>\n<li><strong>Take the extreme value:</strong>Maximize f'(z₀) in ℱ (or equivalently take the limit with the Monteil normal family). Obtain f∈ℱ to maximize f'(z₀).</li>\n<li><strong>f must be surjective to 𝔻:</strong>Counter-suppose that some α∈𝔻 is missing. Construction using Braschke factors and square roots\n            A \"disk after digging out α\" reflects the function of 𝔻, and when combined with f, we get g∈ℱ and g'(z₀)≥f'(z₀), which is a contradiction.\n            <ul class=\"substeps\">\n<li>This step is the geometric core of the proof: if the image set is not the entire disk, the derivative can be \"larger\".</li>\n</ul>\n</li>\n<li><strong>Uniqueness:</strong>If f and g both satisfy normalization, then φ = f ∘ g^{-1}: 𝔻→𝔻 is an automorphism and φ(0)=0, φ'(0)≥0, and Schwarz knows that φ=id.</li>\n</ol>\n<p class=\"qed\">∎ (Outline; simple connectivity is used for square root branches and single leaf structures)</p>\n", "deep": "\n<h3>Boundary correspondence</h3>\n<p>If ∂Ω is good enough (Jordan curve), then f can be continued continuously to the homeomorphism of the boundary (Carrastheodory's theorem).</p>\n<h3>computational reality</h3>\n<p>Explicit f is only writable for special regions (Schwarz–Christophel for half-planes, polygons). Generally rely on numerical conformal mapping.</p>\n<h3>and physics</h3>\n<p>The orthogonal network of potential lines/field lines in two-dimensional electrostatic, fluid, and thermal equilibrium is exactly the physical version of the conformal network.</p>\n", "why": "\n<p>For two-dimensional fluids, electrostatics, and graphic parameterization, strange areas are often mapped into circles first and then calculated. Theoretically, it is one of the foundations of complex analysis.</p>\n", "try": "\n<ul>\n<li>Drag \"undulation\" and \"progress\" to see how the border is rounded.</li>\n<li>Remember: this theorem does not apply to the entire plane or the ring with holes.</li>\n</ul>\n"}}, {"id": "fermat-little", "field": "math", "difficulty": "easy", "emoji": "🔐", "iconClass": "green", "related": ["euclid-primes", "crt", "fermat"], "__i18n": {"zh": {"id": "fermat-little", "title": "费马小定理", "subtitle": "质数模下的幂次规矩", "emoji": "🔐", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["数论", "密码学", "费马"], "era": "1640 年费马提出；欧拉等给出证明", "oneLiner": "p 是质数、a 不被 p 整除时，a^(p−1) 除以 p 永远余 1。密码和竞赛都爱用。", "people": [{"role": "提出", "name": "皮埃尔·德·费马", "years": "1640"}, {"role": "推广与证明", "name": "欧拉等", "years": "18 世纪"}], "related": ["euclid-primes", "crt", "fermat"], "sections": {"story": "\n        <p>算「某数的很多次方再取余」时，若模是质数，结果会乖乖循环。费马小定理一句话钉死最干净的情况；RSA 那一类密码也站在类似结构上。</p>\n        <div class=\"fun-box\"><strong>别和大定理搞混：</strong>小定理是模运算工具；大定理是 aⁿ+bⁿ=cⁿ 无解，完全两码事。</div>\n      ", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>质数模下，a 的 (p−1) 次方余 1。</p>\n        <div class=\"formula\" data-latex=\"p\\text{ 素数},\\ p\\nmid a\\ \\Rightarrow\\ a^{p-1}\\equiv 1\\pmod{p}\"></div>\n        <div class=\"formula\" data-latex=\"a^{p}\\equiv a\\pmod{p}\"></div>\n      ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">同余</div>\n            <p><span data-latex=\"a\\equiv b\\pmod{p}\">a≡b (mod p)</span> 表示 p 整除 a−b，也就是「除以 p 余数相同」。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">引理</div>\n            <p>在模 p（素数）下，1,2,…,p−1 与 a,2a,…, (p−1)a 是同一批非零剩余的重排（因 a 有逆元）。</p>\n          </div>\n        ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>1 到 p−1 乘上 a 只是重排；乘积相等，约掉 (p−1)! 就得到 a^{p−1}≡1。</p><div class=\"interactive\" data-widget=\"fermat-little\"></div>\n          <p class=\"plain-lead\"><strong>人话版：</strong>把 1 到 p−1 每项乘 a，只是把这些余数重新排了一次，乘积一样；两边约掉相同部分，就剩下 a^{p−1}≡1。</p>\n          <ol class=\"steps\">\n            <li>考虑 1,2,…,p−1。因 p 素且不整除 a，乘 a 后：a,2a,…, (p−1)a 在模 p 下仍是 1,…,p−1 的一个排列。</li>\n            <li>两边连乘：\n              <div class=\"calc-line\" data-latex=\"1\\cdot 2\\cdots(p-1)\\ \\equiv\\ a\\cdot(2a)\\cdots((p-1)a)\\pmod{p}\"></div>\n            </li>\n            <li>右边 = <span data-latex=\"a^{p-1}(p-1)!\">a^{p−1}(p−1)!</span>，故\n              <div class=\"calc-line\" data-latex=\"(p-1)!\\ \\equiv\\ a^{p-1}(p-1)!\\pmod{p}\"></div>\n            </li>\n            <li>p 不整除 (p−1)!，两边同乘逆元约掉，得 <span data-latex=\"a^{p-1}\\equiv 1\\pmod{p}\">a^{p−1}≡1 (mod p)</span>。</li>\n          </ol>\n          <p class=\"qed\">∎</p>\n        ", "deep": "\n          <p>欧拉定理是推广：若 gcd(a,n)=1，则 a^{φ(n)}≡1 (mod n)。RSA 密码的指数运算就建立在这类同余结构上。</p>\n        ", "why": "<p>快速幂、素性测试、公钥密码入门都会碰到它。</p>", "try": "<ul><li>手算 3^6 mod 7 是否为 1。</li><li>合数模为什么会翻车？试 2^3 mod 4。</li></ul>"}, "field": "math"}, "en": {"id": "fermat-little", "title": "Fermat's little theorem", "subtitle": "Power Rules Modulo Prime Numbers", "emoji": "🔐", "iconClass": "green", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["number theory", "cryptography", "Fermat"], "era": "Fermat proposed it in 1640; Euler and others proved it", "oneLiner": "When p is a prime number and a is not divisible by p, a^(p−1) divided by p will always have a remainder of 1. Love it for passwords and competitions.", "people": [{"role": "propose", "name": "Pierre de Fermat", "years": "1640"}, {"role": "Promote and prove", "name": "Euler et al.", "years": "18th century"}], "related": ["euclid-primes", "crt", "fermat"], "sections": {"story": "\n<p>When calculating \"a number raised to the power of many times and then taking the remainder\", if the modulus is a prime number, the result will cycle smoothly. Fermat's Little Theorem crucifies the cleanest situation in one sentence; RSA cryptography also stands on a similar structure.</p>\n<div class=\"fun-box\"><strong>Not to be confused with the Last Theorem:</strong>The small theorem is a tool for modular arithmetic; the big theorem is aⁿ+bⁿ=cⁿ, which has no solution and is completely different.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Modulo prime numbers, a raised to the (p−1) power has remainder 1.</p>\n<div class=\"formula\" data-latex=\"p\\text{ 素数},\\ p\\nmid a\\ \\Rightarrow\\ a^{p-1}\\equiv 1\\pmod{p}\"></div>\n<div class=\"formula\" data-latex=\"a^{p}\\equiv a\\pmod{p}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Congruent</div>\n<p><span data-latex=\"a\\equiv b\\pmod{p}\">a≡b (mod p)</span> It means that p divides a−b, that is, \"the remainder is the same when divided by p\".</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">lemma</div>\n<p>Modulo p (prime number), 1,2,…,p−1 and a,2a,…, (p−1)a are rearrangements of the same batch of non-zero residues (since a has an inverse).</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Multiplying 1 to p−1 by a is just a rearrangement; if the products are equal, subtract (p−1)! to get a^{p−1}≡1.</p><div class=\"interactive\" data-widget=\"fermat-little\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>Multiplying each item from 1 to p−1 by a just rearranges the remainders, and the products are the same; subtract the same parts from both sides, leaving a^{p−1}≡1.</p>\n<ol class=\"steps\">\n<li>Consider 1,2,…,p−1. Since p is prime and does not divide a, after multiplying by a: a,2a,…, (p−1)a is still a permutation of 1,…,p−1 modulo p.</li>\n<li>Multiply both sides:\n              <div class=\"calc-line\" data-latex=\"1\\cdot 2\\cdots(p-1)\\ \\equiv\\ a\\cdot(2a)\\cdots((p-1)a)\\pmod{p}\"></div>\n</li>\n<li>right = <span data-latex=\"a^{p-1}(p-1)!\">a^{p−1}(p−1)!</span>, so\n              <div class=\"calc-line\" data-latex=\"(p-1)!\\ \\equiv\\ a^{p-1}(p-1)!\\pmod{p}\"></div>\n</li>\n<li>p is not divisible by (p−1)!, multiply both sides by the inverse element and reduce it, we get <span data-latex=\"a^{p-1}\\equiv 1\\pmod{p}\">a^{p−1}≡1 (mod p)</span>。</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>Euler's theorem is a generalization: if gcd(a,n)=1, then a^{φ(n)}≡1 (mod n). The exponent operation of the RSA cipher is based on this type of congruence structure.</p>\n", "why": "<p>You will encounter it in fast exponentiation, primality testing, and getting started with public key cryptography.</p>", "try": "<ul><li>Calculate by hand whether 3^6 mod 7 is 1.</li><li>Why does the composite module overturn? Try 2^3 mod 4.</li></ul>"}, "field": "math"}}, "title": "Fermat's little theorem", "subtitle": "Power Rules Modulo Prime Numbers", "difficultyLabel": "Easy to use", "tags": ["number theory", "cryptography", "Fermat"], "era": "Fermat proposed it in 1640; Euler and others proved it", "oneLiner": "When p is a prime number and a is not divisible by p, a^(p−1) divided by p will always have a remainder of 1. Love it for passwords and competitions.", "people": [{"role": "propose", "name": "Pierre de Fermat", "years": "1640"}, {"role": "Promote and prove", "name": "Euler et al.", "years": "18th century"}], "sections": {"story": "\n<p>When calculating \"a number raised to the power of many times and then taking the remainder\", if the modulus is a prime number, the result will cycle smoothly. Fermat's Little Theorem crucifies the cleanest situation in one sentence; RSA cryptography also stands on a similar structure.</p>\n<div class=\"fun-box\"><strong>Not to be confused with the Last Theorem:</strong>The small theorem is a tool for modular arithmetic; the big theorem is aⁿ+bⁿ=cⁿ, which has no solution and is completely different.</div>\n", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Modulo prime numbers, a raised to the (p−1) power has remainder 1.</p>\n<div class=\"formula\" data-latex=\"p\\text{ 素数},\\ p\\nmid a\\ \\Rightarrow\\ a^{p-1}\\equiv 1\\pmod{p}\"></div>\n<div class=\"formula\" data-latex=\"a^{p}\\equiv a\\pmod{p}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Congruent</div>\n<p><span data-latex=\"a\\equiv b\\pmod{p}\">a≡b (mod p)</span> It means that p divides a−b, that is, \"the remainder is the same when divided by p\".</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">lemma</div>\n<p>Modulo p (prime number), 1,2,…,p−1 and a,2a,…, (p−1)a are rearrangements of the same batch of non-zero residues (since a has an inverse).</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>Multiplying 1 to p−1 by a is just a rearrangement; if the products are equal, subtract (p−1)! to get a^{p−1}≡1.</p><div class=\"interactive\" data-widget=\"fermat-little\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>Multiplying each item from 1 to p−1 by a just rearranges the remainders, and the products are the same; subtract the same parts from both sides, leaving a^{p−1}≡1.</p>\n<ol class=\"steps\">\n<li>Consider 1,2,…,p−1. Since p is prime and does not divide a, after multiplying by a: a,2a,…, (p−1)a is still a permutation of 1,…,p−1 modulo p.</li>\n<li>Multiply both sides:\n              <div class=\"calc-line\" data-latex=\"1\\cdot 2\\cdots(p-1)\\ \\equiv\\ a\\cdot(2a)\\cdots((p-1)a)\\pmod{p}\"></div>\n</li>\n<li>right = <span data-latex=\"a^{p-1}(p-1)!\">a^{p−1}(p−1)!</span>, so\n              <div class=\"calc-line\" data-latex=\"(p-1)!\\ \\equiv\\ a^{p-1}(p-1)!\\pmod{p}\"></div>\n</li>\n<li>p is not divisible by (p−1)!, multiply both sides by the inverse element and reduce it, we get <span data-latex=\"a^{p-1}\\equiv 1\\pmod{p}\">a^{p−1}≡1 (mod p)</span>。</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>Euler's theorem is a generalization: if gcd(a,n)=1, then a^{φ(n)}≡1 (mod n). The exponent operation of the RSA cipher is based on this type of congruence structure.</p>\n", "why": "<p>You will encounter it in fast exponentiation, primality testing, and getting started with public key cryptography.</p>", "try": "<ul><li>Calculate by hand whether 3^6 mod 7 is 1.</li><li>Why does the composite module overturn? Try 2^3 mod 4.</li></ul>"}}, {"id": "cauchy-schwarz", "field": "math", "difficulty": "medium", "emoji": "⟨,⟩", "iconClass": "", "related": ["amgm", "pythagoras", "mvt"], "__i18n": {"zh": {"id": "cauchy-schwarz", "title": "柯西–施瓦茨不等式", "subtitle": "内积世界里的「速度上限」", "emoji": "⟨,⟩", "iconClass": "", "difficulty": "medium", "difficultyLabel": "费点脑子", "tags": ["不等式", "线性代数", "分析"], "era": "柯西 1821；布尼亚科夫斯基、施瓦茨推广", "oneLiner": "点积的绝对值 ≤ 两长度相乘——再斜的夹角，余弦也不会超过 1。", "people": [{"role": "有限和形式", "name": "柯西", "years": "1821"}, {"role": "积分等形式", "name": "施瓦茨等", "years": "19 世纪"}], "related": ["amgm", "pythagoras", "mvt"], "sections": {"story": "<p>几何上就是 |cos θ|≤1。写成坐标或函数积分，就成了分析、概率、机器学习里最常用的不等式之一。</p>", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>点积绝对值不超过长度乘积。</p>\n        <div class=\"formula\" data-latex=\"\\Bigl(\\sum a_i b_i\\Bigr)^2\\le\\Bigl(\\sum a_i^2\\Bigr)\\Bigl(\\sum b_i^2\\Bigr)\"></div>\n        <div class=\"formula\" data-latex=\"|\\langle u,v\\rangle|\\le\\|u\\|\\,\\|v\\|\"></div>\n      ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">内积与范数</div>\n            <p><span data-latex=\"\\langle u,v\\rangle=\\sum a_i b_i\">⟨u,v⟩=∑ a_i b_i</span>，<span data-latex=\"\\|u\\|=\\sqrt{\\langle u,u\\rangle}\">‖u‖=√⟨u,u⟩</span>。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">二次函数判别式</div>\n            <p>对任意实数 t，‖u−tv‖² ≥ 0，展开后看成 t 的二次式，判别式 ≤ 0。</p>\n          </div>\n        ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>长度平方 ≥0；用 u−tv 展开，二次式判别式 ≤0，就逼出点积上界。</p><div class=\"interactive\" data-widget=\"cauchy-schwarz\"></div>\n          <p class=\"plain-lead\"><strong>人话版：</strong>长度平方永远非负；用「滑动比例 t」去减另一向量，非负条件逼出点积上界。</p>\n          <ol class=\"steps\">\n            <li>若 v=0，显然成立。下设 v≠0。</li>\n            <li>对任意实数 t：\n              <div class=\"calc-line\" data-latex=\"0\\le \\|u-tv\\|^2=\\|u\\|^2-2t\\langle u,v\\rangle+t^2\\|v\\|^2\"></div>\n            </li>\n            <li>这是关于 t 的二次函数，且永远 ≥0，故判别式 ≤0：\n              <div class=\"calc-line\" data-latex=\"(2\\langle u,v\\rangle)^2-4\\|v\\|^2\\|u\\|^2\\le 0\"></div>\n            </li>\n            <li>化简得 <span data-latex=\"\\langle u,v\\rangle^2\\le\\|u\\|^2\\|v\\|^2\">⟨u,v⟩² ≤ ‖u‖²‖v‖²</span>。</li>\n          </ol>\n          <p class=\"qed\">∎</p>\n        ", "deep": "\n          <p>积分版：⟨f,g⟩=∫fg 时同样成立（施瓦茨）。概率里 |E[XY]|² ≤ E[X²]E[Y²] 也是它。</p>\n        ", "why": "<p>正交、投影、相关系数 |ρ|≤1，背后都是它。</p>", "try": "<ul><li>验证 n=2 的代数形式。</li><li>想：等号何时成立？（两向量共线。）</li></ul>"}, "field": "math"}, "en": {"id": "cauchy-schwarz", "title": "Cauchy–Schwarz inequality", "subtitle": "\"Speed ​​upper limit\" in the inner product world", "emoji": "⟨,⟩", "iconClass": "", "difficulty": "medium", "difficultyLabel": "Spend some time thinking", "tags": ["inequality", "linear algebra", "analyze"], "era": "Cauchy 1821; Bunyakovsky and Schwartz popularized", "oneLiner": "The absolute value of the dot product ≤ the product of the two lengths - no matter how oblique the angle is, the cosine will not exceed 1.", "people": [{"role": "finite and formal", "name": "Cauchy", "years": "1821"}, {"role": "Points and other forms", "name": "Schwartz et al.", "years": "19th century"}], "related": ["amgm", "pythagoras", "mvt"], "sections": {"story": "<p>Geometrically, |cos θ|≤1. Written as coordinates or function integrals, it has become one of the most commonly used inequalities in analysis, probability, and machine learning.</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>The absolute value of the dot product does not exceed the length product.</p>\n<div class=\"formula\" data-latex=\"\\Bigl(\\sum a_i b_i\\Bigr)^2\\le\\Bigl(\\sum a_i^2\\Bigr)\\Bigl(\\sum b_i^2\\Bigr)\"></div>\n<div class=\"formula\" data-latex=\"|\\langle u,v\\rangle|\\le\\|u\\|\\,\\|v\\|\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Inner product and norm</div>\n<p><span data-latex=\"\\langle u,v\\rangle=\\sum a_i b_i\">⟨u,v⟩=∑ a_i b_i</span>，<span data-latex=\"\\|u\\|=\\sqrt{\\langle u,u\\rangle}\">‖u‖=√⟨u,u⟩</span>。</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Quadratic function discriminant</div>\n<p>For any real number t, ‖u−tv‖² ≥ 0, after expansion, it can be seen as the quadratic expression of t, and the discriminant is ≤ 0.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>The square length ≥0; expand with u−tv, the quadratic discriminant ≤0, and the upper bound of the dot product is forced.</p><div class=\"interactive\" data-widget=\"cauchy-schwarz\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>The square of the length is always non-negative; use \"sliding ratio t\" to subtract another vector, and the non-negative condition forces the upper bound of the dot product.</p>\n<ol class=\"steps\">\n<li>If v=0, this is obviously true. Let v≠0.</li>\n<li>For any real number t:\n              <div class=\"calc-line\" data-latex=\"0\\le \\|u-tv\\|^2=\\|u\\|^2-2t\\langle u,v\\rangle+t^2\\|v\\|^2\"></div>\n</li>\n<li>This is a quadratic function about t and is always ≥0, so the discriminant is ≤0:\n              <div class=\"calc-line\" data-latex=\"(2\\langle u,v\\rangle)^2-4\\|v\\|^2\\|u\\|^2\\le 0\"></div>\n</li>\n<li>Simplify <span data-latex=\"\\langle u,v\\rangle^2\\le\\|u\\|^2\\|v\\|^2\">⟨u,v⟩² ≤ ‖u‖²‖v‖²</span>。</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>Integral version: The same holds true when ⟨f,g　=∫fg (Schwartz). In probability, |E[XY]|² ≤ E[X²]E[Y²] is also it.</p>\n", "why": "<p>Orthogonality, projection, and correlation coefficient |ρ|≤1 are all behind it.</p>", "try": "<ul><li>Verify the algebraic form of n=2.</li><li>Think: When does the equal sign hold? (The two vectors are collinear.)</li></ul>"}, "field": "math"}}, "title": "Cauchy–Schwarz inequality", "subtitle": "\"Speed ​​upper limit\" in the inner product world", "difficultyLabel": "Spend some time thinking", "tags": ["inequality", "linear algebra", "analyze"], "era": "Cauchy 1821; Bunyakovsky and Schwartz popularized", "oneLiner": "The absolute value of the dot product ≤ the product of the two lengths - no matter how oblique the angle is, the cosine will not exceed 1.", "people": [{"role": "finite and formal", "name": "Cauchy", "years": "1821"}, {"role": "Points and other forms", "name": "Schwartz et al.", "years": "19th century"}], "sections": {"story": "<p>Geometrically, |cos θ|≤1. Written as coordinates or function integrals, it has become one of the most commonly used inequalities in analysis, probability, and machine learning.</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>The absolute value of the dot product does not exceed the length product.</p>\n<div class=\"formula\" data-latex=\"\\Bigl(\\sum a_i b_i\\Bigr)^2\\le\\Bigl(\\sum a_i^2\\Bigr)\\Bigl(\\sum b_i^2\\Bigr)\"></div>\n<div class=\"formula\" data-latex=\"|\\langle u,v\\rangle|\\le\\|u\\|\\,\\|v\\|\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">Inner product and norm</div>\n<p><span data-latex=\"\\langle u,v\\rangle=\\sum a_i b_i\">⟨u,v⟩=∑ a_i b_i</span>，<span data-latex=\"\\|u\\|=\\sqrt{\\langle u,u\\rangle}\">‖u‖=√⟨u,u⟩</span>。</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">Quadratic function discriminant</div>\n<p>For any real number t, ‖u−tv‖² ≥ 0, after expansion, it can be seen as the quadratic expression of t, and the discriminant is ≤ 0.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>The square length ≥0; expand with u−tv, the quadratic discriminant ≤0, and the upper bound of the dot product is forced.</p><div class=\"interactive\" data-widget=\"cauchy-schwarz\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>The square of the length is always non-negative; use \"sliding ratio t\" to subtract another vector, and the non-negative condition forces the upper bound of the dot product.</p>\n<ol class=\"steps\">\n<li>If v=0, this is obviously true. Let v≠0.</li>\n<li>For any real number t:\n              <div class=\"calc-line\" data-latex=\"0\\le \\|u-tv\\|^2=\\|u\\|^2-2t\\langle u,v\\rangle+t^2\\|v\\|^2\"></div>\n</li>\n<li>This is a quadratic function about t and is always ≥0, so the discriminant is ≤0:\n              <div class=\"calc-line\" data-latex=\"(2\\langle u,v\\rangle)^2-4\\|v\\|^2\\|u\\|^2\\le 0\"></div>\n</li>\n<li>Simplify <span data-latex=\"\\langle u,v\\rangle^2\\le\\|u\\|^2\\|v\\|^2\">⟨u,v⟩² ≤ ‖u‖²‖v‖²</span>。</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p>Integral version: The same holds true when ⟨f,g　=∫fg (Schwartz). In probability, |E[XY]|² ≤ E[X²]E[Y²] is also it.</p>\n", "why": "<p>Orthogonality, projection, and correlation coefficient |ρ|≤1 are all behind it.</p>", "try": "<ul><li>Verify the algebraic form of n=2.</li><li>Think: When does the equal sign hold? (The two vectors are collinear.)</li></ul>"}}, {"id": "bayes", "field": "math", "difficulty": "easy", "emoji": "🎲", "iconClass": "warm", "related": ["pigeonhole", "ftc", "cantor"], "__i18n": {"zh": {"id": "bayes", "title": "贝叶斯定理", "subtitle": "用证据更新看法", "emoji": "🎲", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "好上手", "tags": ["概率", "统计", "日常决策"], "era": "贝叶斯 18 世纪；拉普拉斯发扬", "oneLiner": "先有个判断，再来新证据——公式告诉你「现在该多信一点什么」。", "people": [{"role": "思想来源", "name": "托马斯·贝叶斯", "years": "约 1763 发表"}, {"role": "系统发展", "name": "拉普拉斯等", "years": "18–19 世纪"}], "related": ["pigeonhole", "ftc", "cantor"], "sections": {"story": "<p>验血阳性 ≠ 一定有病：还要看病本来稀不稀、假阳性高不高。贝叶斯就是把「原判断 + 新证据」合成后验概率的规矩。</p>", "statement": "\n        <p class=\"plain-lead\" data-plain-stmt><strong>先记住结论：</strong>用新证据更新对事件的判断。</p>\n        <div class=\"formula\" data-latex=\"P(A\\mid B)=\\dfrac{P(B\\mid A)\\,P(A)}{P(B)}\"></div>\n      ", "setup": "\n          <div class=\"def-box\">\n            <div class=\"def-title\">条件概率</div>\n            <p><span data-latex=\"P(A\\mid B)=P(A\\cap B)/P(B)\">P(A|B)=P(A∩B)/P(B)</span>：已知 B 发生时 A 的概率。</p>\n            <p><strong>先验</strong> P(A)：证据来之前的判断；<strong>后验</strong> P(A|B)：证据来之后的判断。</p>\n          </div>\n        ", "lemmas": "\n          <div class=\"lemma-box\">\n            <div class=\"lemma-title\">乘法公式</div>\n            <p><span data-latex=\"P(A\\cap B)=P(B\\mid A)P(A)=P(A\\mid B)P(B)\">P(A∩B)=P(B|A)P(A)=P(A|B)P(B)</span>。贝叶斯只是把两种写法对一下。</p>\n          </div>\n        ", "proof": "<p class=\"plain-lead\" data-plain-lead><strong>人话版：</strong>联合概率可以两种顺序拆；拆完移项就是贝叶斯公式。</p><div class=\"interactive\" data-widget=\"bayes\"></div>\n          <p class=\"plain-lead\"><strong>人话版：</strong>联合概率可以两种顺序拆；拆完移项就是贝叶斯。</p>\n          <ol class=\"steps\">\n            <li>由定义：<span data-latex=\"P(A\\cap B)=P(A\\mid B)P(B)\">P(A∩B)=P(A|B)P(B)</span>。</li>\n            <li>又有：<span data-latex=\"P(A\\cap B)=P(B\\mid A)P(A)\">P(A∩B)=P(B|A)P(A)</span>。</li>\n            <li>两边相等：<span data-latex=\"P(A\\mid B)P(B)=P(B\\mid A)P(A)\">P(A|B)P(B)=P(B|A)P(A)</span>。</li>\n            <li>P(B)>0 时两边除以 P(B)，得贝叶斯公式。</li>\n          </ol>\n          <p class=\"qed\">∎</p>\n        ", "deep": "\n          <p><strong>经典坑：</strong>疾病患病率 0.1%，检测真阳性 99%、假阳性 1%。测出阳性时，真有病的概率往往只有约 9%，不是 99%。请用全概率公式算一遍分母。</p>\n        ", "why": "<p>医疗检验、垃圾邮件、推荐系统、导航，全是「根据数据改主意」。</p>", "try": "<ul><li>算罕见病检测阳性后的真患病率。</li><li>硬币问题：公平 vs 双面花，掷出花后的后验。</li></ul>"}, "field": "math"}, "en": {"id": "bayes", "title": "Bayes theorem", "subtitle": "Update your views with evidence", "emoji": "🎲", "iconClass": "warm", "difficulty": "easy", "difficultyLabel": "Easy to use", "tags": ["Probability", "statistics", "daily decisions"], "era": "Bayesian 18th century; Laplace developed", "oneLiner": "First make a judgment, then come with new evidence - the formula tells you \"what you should believe more now\".", "people": [{"role": "Source of thought", "name": "Thomas Bayes", "years": "Posted about 1763"}, {"role": "system development", "name": "Laplace et al.", "years": "18th–19th century"}], "related": ["pigeonhole", "ftc", "cantor"], "sections": {"story": "<p>Positive blood test ≠ There must be a disease: it also depends on whether the disease is rare and whether the number of false positives is high. Bayesian is the rule that combines \"original judgment + new evidence\" into posterior probability.</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Update your judgment of an event with new evidence.</p>\n<div class=\"formula\" data-latex=\"P(A\\mid B)=\\dfrac{P(B\\mid A)\\,P(A)}{P(B)}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">conditional probability</div>\n<p><span data-latex=\"P(A\\mid B)=P(A\\cap B)/P(B)\">P(A|B)=P(A∩B)/P(B)</span>: The probability of A when B is known to occur.</p>\n<p><strong>a priori</strong> P(A): Judgment before evidence comes;<strong>posteriori</strong> P(A|B): Judgment after the evidence comes.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">multiplication formula</div>\n<p><span data-latex=\"P(A\\cap B)=P(B\\mid A)P(A)=P(A\\mid B)P(B)\">P(A∩B)=P(B|A)P(A)=P(A|B)P(B)</span>. Bayesian just compares the two ways of writing.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>The joint probability can be split in two orders; after splitting the transfer terms, it is Bayesian formula.</p><div class=\"interactive\" data-widget=\"bayes\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>The joint probability can be split in two orders; after splitting the terms, it is Bayesian.</p>\n<ol class=\"steps\">\n<li>By definition:<span data-latex=\"P(A\\cap B)=P(A\\mid B)P(B)\">P(A∩B)=P(A|B)P(B)</span>。</li>\n<li>Also:<span data-latex=\"P(A\\cap B)=P(B\\mid A)P(A)\">P(A∩B)=P(B|A)P(A)</span>。</li>\n<li>Both sides are equal:<span data-latex=\"P(A\\mid B)P(B)=P(B\\mid A)P(A)\">P(A|B)P(B)=P(B|A)P(A)</span>。</li>\n<li>When P(B)&gt;0, divide both sides by P(B) to get Bayes' formula.</li>\n</ol>\n<p class=\"qed\">∎</p>\n", "deep": "\n<p><strong>Classic pit:</strong>The disease prevalence is 0.1%, the test has a true positive rate of 99% and a false positive rate of 1%. When you test positive, the probability that you actually have the disease is often only about 9%, not 99%. Please use the total probability formula to calculate the denominator.</p>\n", "why": "<p>Medical tests, spam, recommendation systems, and navigation are all about \"changing your mind based on data.\"</p>", "try": "<ul><li>Calculate the true prevalence of a rare disease after testing positive.</li><li>Coin problem: fair vs double-sided, posterior after tossing a suit.</li></ul>"}, "field": "math"}}, "title": "Bayes theorem", "subtitle": "Update your views with evidence", "difficultyLabel": "Easy to use", "tags": ["Probability", "statistics", "daily decisions"], "era": "Bayesian 18th century; Laplace developed", "oneLiner": "First make a judgment, then come with new evidence - the formula tells you \"what you should believe more now\".", "people": [{"role": "Source of thought", "name": "Thomas Bayes", "years": "Posted about 1763"}, {"role": "system development", "name": "Laplace et al.", "years": "18th–19th century"}], "sections": {"story": "<p>Positive blood test ≠ There must be a disease: it also depends on whether the disease is rare and whether the number of false positives is high. Bayesian is the rule that combines \"original judgment + new evidence\" into posterior probability.</p>", "statement": "\n<p class=\"plain-lead\" data-plain-stmt=\"\"><strong>Remember the conclusion first:</strong>Update your judgment of an event with new evidence.</p>\n<div class=\"formula\" data-latex=\"P(A\\mid B)=\\dfrac{P(B\\mid A)\\,P(A)}{P(B)}\"></div>\n", "setup": "\n<div class=\"def-box\">\n<div class=\"def-title\">conditional probability</div>\n<p><span data-latex=\"P(A\\mid B)=P(A\\cap B)/P(B)\">P(A|B)=P(A∩B)/P(B)</span>: The probability of A when B is known to occur.</p>\n<p><strong>a priori</strong> P(A): Judgment before evidence comes;<strong>posteriori</strong> P(A|B): Judgment after the evidence comes.</p>\n</div>\n", "lemmas": "\n<div class=\"lemma-box\">\n<div class=\"lemma-title\">multiplication formula</div>\n<p><span data-latex=\"P(A\\cap B)=P(B\\mid A)P(A)=P(A\\mid B)P(B)\">P(A∩B)=P(B|A)P(A)=P(A|B)P(B)</span>. Bayesian just compares the two ways of writing.</p>\n</div>\n", "proof": "<p class=\"plain-lead\" data-plain-lead=\"\"><strong>Human version:</strong>The joint probability can be split in two orders; after splitting the transfer terms, it is Bayesian formula.</p><div class=\"interactive\" data-widget=\"bayes\"></div>\n<p class=\"plain-lead\"><strong>Human version:</strong>The joint probability can be split in two orders; after splitting the terms, it is Bayesian.</p>\n<ol class=\"steps\">\n<li>By definition:<span data-latex=\"P(A\\cap B)=P(A\\mid B)P(B)\">P(A∩B)=P(A|B)P(B)</span>。</li>\n<li>Also:<span data-latex=\"P(A\\cap B)=P(B\\mid A)P(A)\">P(A∩B)=P(B|A)P(A)</span>。</li>\n<li>Both sides are equal:<span data-latex=\"P(A\\mid B)P(B)=P(B\\mid A)P(A)\">P(A|B)P(B)
