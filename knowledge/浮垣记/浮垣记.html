屿，帮我寄了。\"<\/p>\n<p>祁望接过来。字写得重，每一笔都压进了纸里：琥珀城，第九百零七塔，塔守收。<\/p>\n<p>\"你自己带着。上我的船，到了檀屿你自己寄。\"<\/p>\n<p>\"我一个顶三个人。\"<\/p>\n<p>\"我给你留三个人的地方。\"<\/p>\n<p>\"给孩子。\"石胎站起来，栈桥的木板在他脚底下沉了一沉，\"底下还有一百多个，在托架底下撑着。我们多撑一天，你就能多跑几趟。\"<\/p>\n<p>他转身回去了，慢慢走下井口，队伍又给他让开那条道。<\/p>\n<p>祁望站在码头上，看着那个井口。他想起老辈人的说法，垣民一年记，一钱重。他五十四岁，身上压着五两多的记性，自己从来没觉出来过。那个石胎在井底下过了一辈子，一样都没丢过，身上压着多少，祁望算不出来。<\/p>\n<p>他把信揣进怀里。到了檀屿，信鹭驿门口挤满了人，全是来寄信的，驿里的人站在门槛上喊：鹭都放出去了，明天再来。他回到船上，信还贴着胸口，心想，那就明天。<\/p>\n<p>单程四千二百息。天亮时，叫到二千六百五十二号。<\/p>\n<hr>\n<p>第六日，芹不肯上他的船。<\/p>\n<p>是夜里说的。霞七号最后一趟卸完，靠在东码头，萤潮正旺，整片云海亮得像一只掀了顶的息萤罐。名册摊在桌上，这一天叫到了三千三百二十八号。祁望把剩下的又算了一遍：一百一十二个号，去掉芹和小樯，一百一十个人。霞二、霞七两条船。单程四千七百息，一个来回九千五。照今晚这个沉法，岛撑不到九千五百息以后。明天每条船只够跑一趟。霞二装五十二，霞七得装五十八。<\/p>\n<p>\"再加上你。五十九。\"<\/p>\n<p>\"守衡院的旗长让我跟快艇走。\"芹说，\"名册要交回涡城。他们说，谁上了船、谁没上，得有个记得的人跟着。\"<\/p>\n<p>\"快艇是内环的玩意儿，船身薄得跟张信纸似的，压不住这底下的风。霞七号我飞了二十六年。\"<\/p>\n<p>\"爹。\"<\/p>\n<p>\"你那块牌子还在。三千四百三十九。\"<\/p>\n<p>芹从怀里摸出竹牌，搁在桌上，往他那边推了推，又拿了回去。<\/p>\n<p>\"我给人了。\"<\/p>\n<p>\"给谁了？\"<\/p>\n<p>\"一个该上船的人。\"她把牌子收回怀里，\"那天你替小樯拿了一个号。我还一个。\"<\/p>\n<p>祁望看着她。她小时候坐在霞七号的舵台上替他数息，数到四百就靠着他的腿睡过去了，口水淌了他一裤腿。现在她二十六了，坐在码头一张桌子后头，管着三千四百四十个号，最后一个是她自己的，也让她送人了。<\/p>\n<p>\"你娘要是还在……\"<\/p>\n<p>\"我娘要是在，\"芹说，\"她也坐快艇。\"<\/p>\n<p>他没话说了。远处云海上，一头云鲸翻了个身，背上的息萤哗地散开，又慢慢落回去。<\/p>\n<p>栈桥底下有块岩石松了，掉了下去。过了好一阵，云面上才鼓起一个小包，又平了。<\/p>\n<p>芹回岛务厅腾空的屋子里睡去了。祁望回到船上，点上灯，把航志翻到新的一页。他写下日子，写下风向，写下单程四千七百息，笔停在\"栖霞东码头\"那几个字上。往后这一跳还写不写，往哪儿写，他不知道。他把笔搁下，想起怀里那封信，摸了摸，还在。明天到了檀屿，先寄它。<\/p>\n<p>他坐在舵台上没睡，看萤潮一点一点退下去。底下的云海在退潮的蓝光里一起一伏，平平的，看不出底下有什么，也看不出明天要吞下什么。<\/p>\n<hr>\n<p>第七日，天亮时，码头离云线只剩十八丈。一刻一丈。<\/p>\n<p>祁望不用算了。他站在舵台上就看得见云，就在栈桥底下，白的，平的，伸手差不多就够着了。码头往下那一截岩壁已经没进去了，整座岛坐在云里。<\/p>\n<p>霞二号天一亮就装满走了，它不会再回来了。码头上剩下霞七号，还有守衡院那条快艇。<\/p>\n<p>芹抱着名册箱子从岛务厅出来，在快艇的泊位边站住了。祁望下船，把一个油布包塞进她怀里，九本航志捆在一块儿，三十来斤。<\/p>\n<p>\"这个你带着。\"<\/p>\n<p>\"你自己的船——\"<\/p>\n<p>\"霞七号今天一两也多不起。\"<\/p>\n<p>芹抱着两样东西，看着他。他想说点别的，想了想，就说了一句：\"檀屿的灯偏北半掌，你们起飞往左让一让。\"她点点头。他转身上船，没回头，怕一回头就要把她也拽上来。<\/p>\n<p>队伍还是长。有号的剩六十个，三千三百八十一到三千四百四十，去掉芹和小樯，五十八个。没号的人更多：西头的农户，岛塌到地头了才肯走的；前几天说死也不走、今早又改了主意的；从坡上背着老人下来的；根矿上来的两个石胎女人，抱着孩子。骑士们把他们拦在后头。他们也不闹，就那么站着，往船上看。<\/p>\n<p>祁望叫号。三千三百八十一，三千三百八十二。人挨个上来，阿桑在舷梯口点人头，祁望在舵台上盯着吃水线。四十个，船照上的数。四十五个。五十个，吃水线压到了铜皮上沿。<\/p>\n<p>一个骑士冲他喊：\"还能上多少？\"<\/p>\n<p>他看了一眼吃水线，又看了一眼码头。装五十个，霞七号一离岸就能往上爬。再上十个，离了岸得先往下坠一截，坠多深、坠多久，要看风，看底下的岛往下拽着多少气。他估摸三十丈，四百息。这四百息里，船得贴着栖霞的边走。<\/p>\n<p>他把这两个数在心里掂了掂。<\/p>\n<p>\"只能再上十个人了！\"他扯着嗓子喊，\"只能再上十个人了！\"<\/p>\n<p>队伍往前一涌，骑士们横过胳膊拦住。祁望往下叫，三千四百三十一到三千四百三十八：一个抱着鹅的老太太，两对夫妻，一个瘸腿铁匠，一个背着妹妹的男孩。三千四百三十九号上来的是信鹭驿那个姑娘，怀里抱着鹭笼，笼里是驿站最后一只信鹭，驿规要留它到最后，报岛上的事。她把竹牌交给阿桑，阿桑翻过来一看，背面有炭写的一个字：芹。<\/p>\n<p>还剩一个位子。三千四百四十那块牌子早不在栖霞了，正挂在檀屿一个五岁孩子的脖子上。<\/p>\n<p>祁望朝没号的那段队伍看过去，还没开口，那个旗长从人堆里拽出一个人，一把推上了舷梯。是那个甲带系反的小子。<\/p>\n<p>\"旗长——\"<\/p>\n<p>\"上去。\"<\/p>\n<p>\"我跟你——\"<\/p>\n<p>\"上去！\"<\/p>\n<p>她没再看他，转身往坡上走，往磨坊那边走。骑士们在后头喊她，她头也没回。磨坊里有个老人，这几天谁去劝都不出来。<\/p>\n<p>小子站在船舷边，看着她的背影，手不知道往哪儿放，就去摸胸前的甲带。带扣还在右边，带子从左边绕过来，又是反的。他解开，重系，系完低头一看，还是反的，自己先笑了。<\/p>\n<p>祁望收起舷梯。\"离岸！\"<\/p>\n<p>霞七号一离栈桥就往下坠。<\/p>\n<p>阿桑在桅杆底下放帆，风灌进去，船头抬起来了，船身还是往下走。底下的岛在沉，一沉就把四周的气也往下拽，霞七号正落在这股往下走的风里，贴着栖霞的边。岩壁就在左舷外头，伸篙就能点着。祁望数着息。一百息，船不坠了。二百息，开始爬，一息半尺，慢吞吞的，每一尺都是硬挣上去的。<\/p>\n<p>岩壁上头，那个旗长从磨坊那边跑回来了，肩上扛着一个人。快艇已经解了缆，离泊位一步宽。她没停，连人带肩上那个一起跳了上去。快艇的白帆一张，一口气就升过了霞七号的桅顶。<\/p>\n<p>芹在快艇船舷边，怀里抱着装名册的木箱。祁望看得见她。她也在看他。<\/p>\n<p>三百息。栖霞的边开始往下掉了。<\/p>\n<p>先是码头，栈桥连着桩子从岛上脱下来，整排斜着滑进云里。接着是码头后头的坡，坡上的信鹭驿，驿站的屋顶，一块接一块塌下去，掉进云里就没了。整座岛从根里叫出来，所有的石头一齐在裂，比祁望这辈子听过的哪场风暴都响。船上六十个人也在叫。阿桑在叫。祁望自己也在叫，叫的是\"抓紧\"还是别的什么，他也不知道。<\/p>\n<p>三百五十息。霞七号爬回了码头原先那个高度，从坡顶塌开的豁口里望过去，看得见檀屿的灯了。抱鹅的老太太把鹅搂得死紧，鹅叫得比谁都响；铁匠一只手攥着船舷，一只手揪着背妹妹那个男孩的后领子；甲带系反的小子扒在船舷上，眼睛还在找快艇。<\/p>\n<p>三百八十息，那块石头从头顶下来了。祁望只看见它的影子：磨盘大一块岩石，从坡顶的豁口翻下来，擦过霞七号的船尾。舵没了。船尾往下一沉，船头翘起来，整条船竖了一竖，翻了个身。<\/p>\n<p>天和云换了位置。<\/p>\n<p>祁望挂在舵台的栏杆上，头朝下。云在他头顶上，近得一伸手就够着。栖霞在他脚底下，整座岛倒挂着，朝他这边落。快艇在更远的地方，白帆越来越小。鹭笼从驿站姑娘怀里滚出去，在倒过来的甲板上磕了一下，笼门弹开了，那只信鹭一抖翅膀，朝他脚底的方向飞去。那边是天。<\/p>\n<p>怀里那封信硌着他的肋骨。<\/p>\n<p>麻线捆着，方方正正。琥珀城，第九百零七塔，塔守收。他想起来，他说过明天。那只鸟已经飞出去三丈、五丈，长翅膀在太阳底下白了一下。他张嘴想喊它回来，喊出来的是一声连他自己都认不出的吼。<\/p>\n<p>霞七号船底朝天，滑进了云里。<\/p>\n<p>云灌满了他的嘴和眼睛，冷，湿，白得分不出上下。岛的叫声，六十个人的叫声，岩石砸进云里的闷响，全在这片白里搅成一团，从四面八方压过来。祁望抓着栏杆，张开嘴，拿三十年在风里喊船的那副嗓子，把息数出来，三百九十七，三百九十八，三百九十九，一声比一声响，响得整片云都在震——<\/p>\n<p>\"四百！\"<\/p>"}, {"title": "会合节", "meta": "《浮垣记》之九 · 升历 1137 年 · 秋", "end": "第九篇·完", "html": "<aside class=\"transit\"><div class=\"transit-h\">途经<\/div><p>升历一一三七年秋。航务塔的《今日邻岛》头一行印着：霞群入会合距。两座岛走到三十里以内，就叫会合，能架云桥，能看见对面的灯，能当面签契。不同轨的人平日见不着面，婚约、买卖、分家，都要攒到会合那几天当面签。琥珀城和霞群三十七年才会合一回。这一回，城里涌进来二十万外岛人，整座城矮下去一指。<\/p><\/aside>\n<hr>\n<p>琥珀城的钟是从东往西敲的。航务塔先敲，旁边的塔听见了跟着敲，一座传一座，传到城西第九百零七塔，得走小半刻。东城的人午饭都吃完了，西城还没到午时。乔橘十二岁，就靠这小半刻吃饭。<\/p>\n<p>分钟街是东西两城的缝，宽十五丈，青石铺地。街东第四百八十塔是东城最末一座钟楼，街西第四百八十一塔是西城头一座。四百年前，两城为了到底谁家的钟算数打过一场官司，一打就是十一年，判下来八个字：两城各钟，不相折算。后来又补了一条附例，西城敲钟的守到今天：西不先东。东城末钟最后一响没落，西城头钟不许起槌。<\/p>\n<p>钟浪流到这儿，得在缝上卡一下。琥珀城按时辰敲钟，辰时五响，午时九响，敲几响，就卡几响的工夫。乔橘数着息量过，九响差不多三十来息，够她从街东跑到街西，在瘸三爷的糖人摊跟前站住，把气喘匀了，再来一句\"三爷，捏个云鲸\"。<\/p>\n<p>会合节头一天辰时，她蹲在街东一口腌菜缸后头，盯着一个粟城来的胖商人在告示墙底下数钱。<\/p>\n<p>第四百八十塔敲第一响，天上掉下来一袋面粉。<\/p>\n<p>那是航务塔的信鹭秤砣，全城最肥的一只，每天辰时把《今日邻岛》送到分钟街的告示墙上。它落地从来不会收翅膀，今天正砸在胖商人帽顶上，翅膀先到，身子后到，爪子最后到。商人连帽子带鸟往后一仰，满街的人都笑了。乔橘从缸后头钻出来，扶了他一把。扶完，他的钱袋已经在她袖子里了。<\/p>\n<p>第三响，她到了街心。第五响落定，她已经站在糖人摊前头，西城的头钟这才起槌。<\/p>\n<p>\"三爷，捏个云鲸。\"<\/p>\n<p>瘸三爷眯着眼看她。\"一大早就吃糖。辰时了？\"<\/p>\n<p>\"西城还没呢。\"<\/p>\n<p>三爷年轻时候也吃这碗饭。那会儿分钟街还没有糖人摊，他在东城下手，往西城跑，跑了二十年，一回没让人逮着。有一年会合节，他嫌街上挤，抄近道从第四百八十一塔的钟楼檐上走，正赶上西城头钟起槌，一槌把他从檐上震了下来，腿就是那回瘸的。打那以后他就守着西不先东的这一头，捏糖，看别人跑。乔橘是他看着跑大的。他没教她多少东西，统共三条，头一条最要紧，她到今天也没全弄明白。<\/p>\n<p>约莫一顿饭的工夫，胖商人揪着西城的巡街陶二找来了，帽子上还粘着根鹭毛。陶二认得乔橘，抓过她三回，也放过她三回，三回都是让同一本律书放的。<\/p>\n<p>\"什么时候丢的？\"陶二问。<\/p>\n<p>\"东城辰时头一响！鸟砸我脑袋上那会儿！\"<\/p>\n<p>陶二扭头问瘸三爷：\"这丫头几时来的？\"<\/p>\n<p>\"西城辰时还没敲，她就在这儿嚷着要云鲸了。\"三爷拿糖勺往脚底下一指，\"我这摊子，在西城。\"<\/p>\n<p>陶二叹口气，把律书上那一条背给商人听：案发按案发那地方的钟，人在哪儿按哪儿的钟，两城各钟，不相折算。东城辰时丢的钱，跟西城辰时以前就在西城的人，两个时辰对不上；对不上，就不是一个人。<\/p>\n<p>\"那我的钱呢？\"<\/p>\n<p>\"在东城辰时。\"陶二说，\"你上东城报去。东城要是问你人在哪儿，人在西城，你再回来找我。\"<\/p>\n<p>商人气呼呼往东去了，走得飞快，袍子下摆都兜起了风。陶二低头瞅了瞅乔橘手里的云鲸。<\/p>\n<p>\"过节呢，少弄点。\"<\/p>\n<p>\"过节人多嘛。\"乔橘一口咬掉云鲸的尾巴，\"城都矮了一指，不弄点，对不起这一指。\"<\/p>\n<hr>\n<p>霞群是前天夜里进的会合距。<\/p>\n<p>乔橘这是头一回见它。上一回霞群来是一一〇〇年，奶奶那年十五，在南崖上看了三天灯，回来就许了人家。这回奶奶五十二了，不去南崖，说腿不行，其实是摊子离不了人。<\/p>\n<p>从南崖往外看，霞群十三座岛排成一道弯，两头小，越往中间越大，大岛都在离城最近的那一截。最近的是檀屿，隔着七里天，码头上的旗子是什么颜色都看得清。筑道师天不亮就上了崖，五个人站一排，吸一口，屏住，描纹，云就从崖沿底下凝上来，一层压一层，凝成五道白桥，朝五座岛伸过去。桥面还冒着凉气，脚踩上去先软一下，再硬起来。<\/p>\n<p>二十万外岛人顺着五道桥涌进城。挑梨的，抱孩子的，赶着系红绸的猪来娶亲的，扛着祖宗牌位来分家的。琥珀城的大街小巷一下子多了好些口音。霞群人说话尾音往上挑，句句听着都跟在问路。<\/p>\n<p>正对南崖的那一截却是空的。十三座岛的弯在那儿断了一段，宽得正好能搁下一座比檀屿大好几倍的岛。断口两边的岛都点着灯，断口里只有天，天底下是云海，那片云比别处白。南崖上立着六根云桥桩，石头的，每根刻一个岛名，筑道师只凝了五道桥。第六根桩上刻着\"栖霞\"，桩脚下有人搁了一碗茶，茶早凉了，没人喝，也没人收。<\/p>\n<p>乔橘干活专挑吵的地方。人挤，手就多，多出一只谁也不会去数。南崖桥头本来是全城最吵的，讨价的，认亲哭的，霞群船老大吆喝回程客的，搅成一锅粥。可这些船老大有个毛病：说着说着，眼睛往那截空里一溜，嘴就闭上了，手按住腰上的钱袋，按得死死的。一个闭嘴，边上几个也闭嘴，一闭就是一大片，连带着买梨的都不还价了。<\/p>\n<p>她在南崖转了半天，一个钱袋也没碰，回城了。路过航务塔，看见塔顶栏杆上趴着个学徒，拿长筒镜对着南边那截空，一看老半天，后来让人揪着后领子拽了回去。<\/p>\n<p>分钟街告示墙上那张《今日邻岛》，就是秤砣早上连帽子带商人一块儿撞下来的那张，墨还是新的：<\/p>\n<blockquote><p>今日邻岛 · 升历一一三七年秋 · 会合节第一日<\/p>\n<p>霞群十三岛，入会合距。南崖云桥五道：檀屿、苇屿、榴屿、梭屿、鹭屿。<\/p>\n<p>会合距止于第三日午时，以东城钟为准。<\/p>\n<p>霞群上回会合：一一〇〇年秋。<\/p><\/blockquote>\n<p>最底下有人拿炭添了一行字：住西城的，早走小半刻。<\/p>\n<p>字是乔橘添的。她怕霞群的人照着西城的钟去赶桥，赶到了，桥已经散了，只好留在城里过冬。<\/p>\n<p>头一天下午，乔橘接了桩正经活。<\/p>\n<p>分钟街东口蹲着一溜跑钟浪的孩子，在墙根底下等生意。东城的契要赶西城的钟，东城钟一响，他们就攥着契往西跑，赶在西城钟响以前递进去，一趟五个铜子。乔橘平时瞧不上这个，五个铜子，还不够一只钱袋的零头。可会合节跑钟浪的活多，墙根底下的孩子全被雇走了，就剩她一个坐在腌菜缸沿上啃梨。<\/p>\n<p>雇她的就是那个粟城胖商人。他从东城报完案回来，换了顶新帽子，手里捏着一张货契，得在西城未时以前交进鹭屿商栈，过了未时，一船梨就归别人家了。<\/p>\n<p>\"你，\"他冲乔橘一指，\"腿快不快？\"<\/p>\n<p>乔橘瞄了一眼那顶新帽子。\"快。\"<\/p>\n<p>\"西城鹭屿商栈，未时以前。\"他摸出一只新钱袋，数了五个铜子，想想，又数了五个，\"跑到了，再给五个。\"<\/p>\n<p>东城未时头一响落下来，乔橘攥着契就跑。分钟街十五丈，三响就过去了，过了街还有二里。西城巷子窄，两边晾着霞群客人的衣裳，挂着会合节的纸灯，她猫着腰从纸灯和晾衣竿底下钻过去，最后一截是从一头系红绸的猪肚子底下过的，猪刚叫出声，她已经出了巷口。鹭屿商栈的掌柜趴在柜台上打盹，她把契往他鼻子跟前一拍，西城的未时这才从塔尖上敲过来。<\/p>\n<p>她回去领那五个铜子。商人一边数钱，一边跟旁人夸她，说城东贼多，还是西城的孩子老实。数完，他把新钱袋揣回怀里，揣得老深，隔着衣裳还拍了两下。<\/p>\n<p>乔橘接过铜子，没碰那只袋子。跑了一趟正经活，她觉得这只手今天该歇歇了。<\/p>\n<p>那天夜里，琥珀城的灯点得比哪一年都多。一千零三座塔，檐角都挂上一串纸灯，从塔尖一直垂到瓦顶；霞群十三座岛也把灯点满了，隔着几里天跟城对着亮。萤潮刚起，底下的云海一片蓝，两边的灯光落进蓝里，城和岛中间碎碎地亮了一大片。五道云桥上挂着灯笼，人在桥上走，灯在人头顶上跟着走，从崖上望过去，一道一道全是会挪的光。那截空里没有灯，那一段云海就只是蓝的。<\/p>\n<p>奶奶的茶摊那一夜卖了四百碗苦橘茶。霞群人喝一口，都要咂咂嘴，说味儿不对。奶奶说是不对，给你再添勺糖。<\/p>\n<hr>\n<p>会合契的契棚搭在分钟街正当中。一张长案横跨街心，东头坐一个东城的契吏，西头坐一个西城的契吏。会合契得两座岛的人当面签，签完，东城的吏按东城钟写一个时辰，西城的吏按西城钟再写一个，一张契两个时辰，谁也不让谁。<\/p>\n<p>会合节这三天，两边攒了一整年的婚事、分家、离婚、买卖，全挤到这一张长案上。头一天定的亲，第二天就有人来退。一家霞群人抬着一头系红绸的小猪来娶亲，说这猪是城东一座钟楼底下那头老猪下的崽，那头老猪当年也是来赶会合契的，没赶上，就留在了钟楼底下，所以吉利。一对老两口来分家，分到最后剩一口锅，两人隔着长案吵锅归谁，东头的吏判给坐东边的，西头的吏判给坐西边的，锅就搁在长案正当中，到中午也没人敢碰。一个檀屿姑娘来退婚，婚是她奶奶一一〇〇年替她定的，那年她还没生出来，契上写的是\"檀屿某家长孙女\"。东头的吏说契上有手印，西头的吏说手印是她奶奶按的。姑娘说：\"那让我奶奶嫁过去好了。\"满棚的人笑得条凳都歪了。<\/p>\n<p>乔橘喜欢契棚。来签契的人怀里都揣着钱，眼睛又都盯着对面的人。<\/p>\n<p>第二天快到午时，东头的吏翻出一张发黄的契，念道：<\/p>\n<p>\"一一〇〇年会合契，续契。琥珀城尹记橘皮行，对栖霞西崖果园。栖霞一方，到了没有？\"<\/p>\n<p>人堆里站起来一个老头，拄着拐，衣裳新浆过，领口硬得能自己立住。他把一张同样发黄的契搁到案上。<\/p>\n<p>吏又念了一遍，没人应。再念一遍，还是没人应。<\/p>\n<p>\"栖霞一方不到，\"吏说，\"照例等到会合距止。\"<\/p>\n<p>\"我等。\"老头说。他坐回条凳上，两只手叠在拐杖头上。<\/p>\n<p>乔橘瞟了他一眼，在心里把他从账上划掉了。等人的人掏不得。他什么都不看，就盯着门口，门框上落只苍蝇他都知道。<\/p>\n<p>她挑中的是个霞群小子，十七八岁，个子蹿得太快，袖口短了一截，晒得黢黑。他站在契棚边上看那家娶亲的往猪脖子上系红绸，嘴张着都忘了合。他腰上挂着个布囊，囊口的绳打的是死结，打得很用心，囊底往下坠，不沉，戳出一个方方的硬角。<\/p>\n<p>东城的午时从街东滚过来，头一响落在第四百八十塔上。小子站在长案东头，朝猪那边探了探身子，乔橘从他背后过去，刀片在指缝里一转，囊底开了道口，那个硬角落进她手心，一把铜子跟着往下漏，她拿另一只手接住，一个也没掉地上。<\/p>\n<p>第三响，她绕过了长案东头。第六响，她从西头契吏背后过去，那吏正往一张婚契上写\"西城巳时末\"。第九响落定，她站在瘸三爷的摊子跟前，手里攥着根还没捏糖的竹签。<\/p>\n<p>\"三爷，云鲸。\"<\/p>\n<p>\"昨儿不是吃过了。\"<\/p>\n<p>\"今儿还吃。\"<\/p>\n<p>西城的头钟起了槌，咣的一声，九响里的头一响。<\/p>\n<hr>\n<p>奶奶的茶摊在第九百零七塔脚下。钟浪走到这儿是最后一站，东城的钟声早落了地，这儿的钟才起槌。奶奶老说咱家永远比城东年轻小半刻，这话说了几十年，每回说完自己先乐。<\/p>\n<p>摊子就摆在家门口，摊边的石墩上嵌着个铁环。乔橘的风绳在这上头拴了十二年，今年开春才解。解绳那天奶奶摆了两桌，往她手腕上系了根新红绳，说这根不拴东西，就图好看。乔橘拿它扎过三回钱袋口，扎得又紧又快。<\/p>\n<p>天擦黑，摊上就剩一个客，一个霞群的老船老大，坐在最里头的矮凳上，喝了三碗苦橘茶，一句话没说。<\/p>\n<p>乔橘蹲在灶后头点进项。粟城商人那袋是碎银，昨天已经花掉一半。霞群小子那袋是十一个铜子，外加一块竹牌。<\/p>\n<p>竹牌两指宽，一掌长，磨得发亮，四个角都圆了，系着一根旧绳。正面烙着四个数：三四四〇。背面拿炭画了条船，船身歪着，桅杆比船还长，一看就是小孩画的。炭画早该蹭没了，可船的每一道线都被人重新描过，不知描了多少回，越描越粗，粗线边上还留着旧线的影子，一道挨一道。<\/p>\n<p>她就着灶火翻来覆去地看。竹子的，当不了钱，拿到城东的收货铺子里，连一块骨牌的价都卖不上。<\/p>\n<p>老船老大放下碗，碗底在桌上磕了一声。<\/p>\n<p>\"哪儿来的？\"<\/p>\n<p>\"捡的。\"<\/p>\n<p>他伸出手。她没给，他也不抢，手就那么伸着。乔橘把竹牌搁进他手心。他翻过来看看那条船，又翻回去，看那四个数。<\/p>\n<p>\"三千四百四十。\"<\/p>\n<p>\"三千四百四十什么？\"<\/p>\n<p>\"最后一块。\"<\/p>\n<p>他把竹牌放回她手里，在桌上搁下三碗的茶钱，多搁了一个铜子，起身走了，往南走，往崖那边去了。<\/p>\n<p>乔橘问奶奶，什么最后一块。<\/p>\n<p>奶奶在擦碗，擦完一只，又拿起一只。\"栖霞那年，岛上发了号，一人一块，按号上船。我也是听霞群人说的。\"她把碗摞好，\"打那年起，尹记的橘皮就断了货。尹记的皮是栖霞西崖的。你喝的苦橘茶，都是后来换的檀屿皮，不对。你没喝过对的。\"<\/p>\n<p>\"对的是啥味儿？\"<\/p>\n<p>奶奶想了想。\"也是先苦后甜。檀屿的皮，甜来得急，一口就到；栖霞的皮得等，苦在嘴里压一口气的工夫，甜才从舌根底下慢慢返上来。那年我十五，栖霞就停在南崖正对面，近得能看见人家院子里晒的橘皮，一片挨一片，铺得满院子黄。\"她把最后一只碗摞上去，\"睡觉去。\"<\/p>\n<p>乔橘想起契棚里那个拄拐的老头。想到这儿，她就不往下想了，把竹牌揣进怀里，揣进去又掏出来，换到另一边揣着。<\/p>\n<p>天黑透了，第九百零七塔的塔守从塔门里出来。是个石胎，矮，宽，在这座塔里守了一辈子，天天傍晚爬一遍，乔橘从会走路起就看他爬。他路过茶摊，奶奶递给他一碗茶，他接过去喝了，把碗放回来，石桌往他那边歪了一丝。他进了塔，脚步声顺着台阶往上走，整座塔都跟着轻轻响。<\/p>\n<p>塔身上的窗洞一个接一个亮一下，是他手里的灯走过去。亮到第三百级那一个，灯停住了，比往常停得久。<\/p>\n<p>\"矮了。\"奶奶说。<\/p>\n<p>\"啥矮了？\"<\/p>\n<p>\"城。一来人就矮。\"奶奶头也不抬，\"他在那个窗口站得久，就是矮了。\"<\/p>\n<p>乔橘算了算。一年记，一钱重，一个三十岁的人身上压着三两记性，二十万个三两。算到一半就乱了。她想，这么多记性一股脑儿压到城上，城才矮了一指，算城脾气好。<\/p>\n<p>那盏灯又动了，往上去了。<\/p>\n<p>夜里的更钟隔一更就从东边滚过来一回，滚到第九百零七塔，是全城最后一声。乔橘躺在铺上，手伸在枕头底下，摸那四个烙出来的数，从东城的钟数到西城的钟，一直数到窗纸发白。<\/p>\n<hr>\n<p>第三天一早，南崖挤得比哪天都满。会合距午时就止，霞群的人得赶在这之前过桥回去，五道桥头都排起了长队。<\/p>\n<p>乔橘找人从来不看脸。脸会转，会躲，会钻进人堆里不见了；背不会。她记得那小子的背：两片肩胛骨支棱着，隔着衣裳都看得出来，袖口短一截，后脖颈晒得比脸还黑。<\/p>\n<p>她在檀屿的桥头找到了他。<\/p>\n<p>桥头摆着一张桌子，桌后坐着个女人，三十多岁，头发里已经夹了几缕白。她跟前一只木箱，箱里码着新竹牌，竹青还没退，烙的是过桥的号。霞群的人排着队，到她跟前报名字，她从箱里摸一块递过去，头也不抬，叫下一个。<\/p>\n<p>那小子站在桌子边上，低着头，眼睛贴着地皮挪。两个膝盖上全是泥，腰上的布囊底下缝了一道，针脚有指头宽。他隔一会儿就去摸一下那个囊，摸完，手搁在那儿不动，过一阵又去摸。<\/p>\n<p>女人叫了个号，没抬头，说：\"樯，站好了。\"<\/p>\n<p>小子站好了，眼睛还在地上。<\/p>\n<p>乔橘在人堆里站了一会儿。她干这行五年，只往外拿过，没往里放过。往外拿，手出来是满的，人家一摸就知道少了；往里放，手出来是空的，人家一摸就知道多了。多了少了，一样要命。她把竹牌和铜子攥在手心，铜子是十一个。粟城人借钱要算利，她不知道揣了一夜该算多少，想了想，从自己兜里摸出一个，凑成十二。<\/p>\n<p>头一回她从他左边挤过去，他正好转身去扶一个牵羊的老汉，羊一扭头，在她手背上蹭了一鼻子湿。第二回她从右边绕，桥头的筑道师喊\"让桥\"，人群往后一退，把她一路退出去三丈远。<\/p>\n<p>第三回她还没挤进去，南崖静了。<\/p>\n<p>是霞群的渡舟起航了。会合距要止，霞群的船先走，从崖底的码头一条一条升上来，掉过头，往霞群那道弯里去。要回断口那边的岛，就得从那截空里穿过去。头一条船进了那截空，船上的人一齐闭了嘴。第二条也闭了嘴。桥头排队的霞群人一个接一个转过身，朝那边看，不出声。琥珀城的人不知道出了什么事，也跟着闭嘴，跟着往那边看。<\/p>\n<p>二十万人的南崖，只剩下风声，还有桥面上云在凝的那一点咝咝声。<\/p>\n<p>瘸三爷教乔橘的头一条是：人都往一个方向看的时候，最好下手。她一直以为三爷说的是看杂耍。<\/p>\n<p>她从人缝里钻过去，站到那小子跟前。他比她高一个头，脸朝着那截空，眼皮一下也没眨。他前襟上有个口袋，袋口还连着裁缝缝的假线，一看就从来没往里放过东西。乔橘把竹牌和十二个铜子放了进去，退回来，退到牵羊的老汉身后。<\/p>\n<p>桌后的女人这时候才抬起头。她也朝那边看，看着最后一条渡舟从那截空里穿过去，手里攥着一块还没发出去的牌子。<\/p>\n<p>渡舟过去了。不知谁先咳了一声，南崖一下子又吵起来，比刚才还凶，憋了半天的话一齐往外冒。<\/p>\n<p>小子的手又去摸腰上的囊，摸完，顺手往胸口一按，按住了。他把手伸进前襟，掏出来，摊开，看了一眼，抬头看看那截空，又低头看手。他笑了，笑得肩膀一耸一耸的，像一面刚兜上风的帆。<\/p>\n<p>\"樯，傻笑什么？\"<\/p>\n<p>\"娘，\"小子把手往桌上一摊，\"钱多了一个。\"<\/p>\n<p>女人看了看他手心，竹牌压在一小堆铜子上。她把竹牌拿起来，挂到他脖子上，又把绳结往里塞了塞，免得勒着。<\/p>\n<p>\"那是你数错了。\"她说，低下头，叫了下一个号。<\/p>\n<hr>\n<p>乔橘从南崖往城里走，走到分钟街，东城的午时正好从街东滚过来。<\/p>\n<p>契棚里，东头的吏在那张发黄的契上写了\"对方未到\"，写一个东城的时辰；西头的吏接过去，再写一个西城的。拄拐的老头把契折好，揣进怀里，跟西头的吏打听第九百零七塔怎么走，说要去那底下喝碗茶，听说全城就数那儿的午时来得最晚。他往西走，拐杖点着青石板，走得比钟浪还慢。<\/p>\n<p>第四百八十塔敲到第三响，乔橘在街心。第九响落定，她站在瘸三爷的摊子跟前。<\/p>\n<p>\"三爷，云鲸。\"<\/p>\n<p>\"第三天了啊。\"<\/p>\n<p>\"会合节就三天。\"<\/p>\n<p>陶二从街那头晃过来，在摊子前站住。<\/p>\n<p>\"南崖上有个霞群小子，跟人说他钱多了一个。\"<\/p>\n<p>\"多了还报官？\"<\/p>\n<p>\"没报，我路过听见的。\"陶二盯着她，\"什么时候的事，你知道不？\"<\/p>\n<p>\"那得看南崖归东城还是归西城了。\"<\/p>\n<p>陶二张了张嘴。南崖在城南，不东也不西，四百年前那场官司没打到那儿。他站着想了半天，又看看三爷，三爷低头熬糖。陶二转身走了，走出去几步，回头说了句\"过节嘛……\"，没说完，摆摆手。<\/p>\n<p>三爷捏了条大的，尾巴翘得老高。乔橘举着它回头望，从分钟街的瓦顶缝里能看见南边一角天，霞群那道弯正往后落，断口也跟着往后落，五道云桥从崖沿上松开，化成几缕白，散进云海里去了。<\/p>\n<p>她咬着云鲸算了算：霞群下回来是一一七四年，她四十九。四十九岁的人手慢了，到那时候，得另找一条宽点的缝。<\/p>"}, {"title": "听风台", "meta": "《浮垣记》之十 · 升历 1137 年 · 深秋", "end": "第十篇·完", "html": "<aside class=\"transit\"><div class=\"transit-h\">途经<\/div><p>琥珀城南崖下有一座听台。有话要传的人站到话口前，到了时辰对着风说；几百里外，另一座听台上的听者描一道听纹，就听见了。一台转一台，墙外所有的声音最后都流进内环最里头的静耳屿。那座岛离涡墙只有七十里，墙声日夜灌耳，岛上人人往耳朵里塞蜡。听术和别的息术一样，听一口，忘一点。台上的老人说，听上二十年，忘掉的多半是别人的话，这是福气。<\/p><\/aside>\n<hr>\n<p>静耳屿是内环最靠里的一座岛，离涡墙七十里。<\/p>\n<p>从岛的内沿往外看，墙占了半边天，奶白的云一层压一层往上拧，拧到看不见的地方。墙声日夜不停，耳朵听不大清，牙床听得清清楚楚。新上岛的人头三夜睡不着，到第四夜，会梦见自己睡在一口钟里。<\/p>\n<p>岛上人人往耳朵里塞蜡。蜡是蜂蜡掺息萤灰揉的，豆子大，夜里塞上，天亮取下来。容昙的头一颗是她娘搓的。那年她六岁，娘把蜡搁在手心里搓圆了，按进她耳朵，说：\"塞上，墙就小了。\"那一颗她一直留到现在，几十年的手汗把它从黄浸成了褐，硬得指甲都掐不动。上台听风的时候，她就把它攥在左手里。这是她的坠石。<\/p>\n<p>她娘是岛上的蜡匠，一辈子没用过一口息，天天坐在铺子门口搓蜡，搓好的码在竹匾里晾着，一匾三百颗，晾干了卖给台上，也卖给全岛。她常说，静耳屿的人一半时候在听，一半时候在堵耳朵，哪一半都离不了她。容昙三十岁那年冬天，她娘死在铺子里，竹匾上还剩小半匾没搓圆。<\/p>\n<p>听风台在岛的最里边，是一座石塔，塔顶一圈开着二十四个风口，大的钻得进一个孩子，小的只塞得进一根手指头。听座在正当中，一把石椅，椅背冲着涡墙。容昙在这把椅子上坐了二十六年。她四十四岁，垣民，生在静耳屿，去过最远的地方是圣钟岛。她没见过石胎。内环每座码头都挂着那块牌子，\"石胎止步，承重有限\"，她小时候一直以为石胎是一种货。<\/p>\n<p>听术跟别的息术一个样：吸一口，屏住，在耳边描一道听纹。纹一成，墙声就退下去，远处的声音一层一层冒上来。一口气能听两数息，老听者能拉到七八息。一夜要听上千口。听完吐气，得趁那些声音还在耳朵里，赶紧写下来。<\/p>\n<p>上穹的听风台有一百多座，各管一片天。有话要传的人，到本岛听台的话口前站好，到了时辰对着风说，几百里外的听者在同一个时辰朝这边听。远处的话一台转一台，转进内环，最后都落到静耳屿。静耳屿是离涡城最近的一只耳朵，墙外各台转来的话在这里录好，等风隙开了，由信鹭送进墙里去。<\/p>\n<p>听座背后的石头上刻着台规，四条，二百多年没改过：<\/p>\n<blockquote><p>一、听毕即录，录毕勿记。<br>二、圣环诸岛屋内之声，不听。<br>三、井口不听。<br>四、录簿每夜一封，晨付信鹭。台中只留拍簿。<\/p><\/blockquote>\n<p>台上的老人说，听上二十年，忘掉的多半是别人的话。干这一行的，管这个叫福气。<\/p>\n<hr>\n<blockquote><p>静耳屿听风台 · 录簿<br>升历一一三七年，九月廿四夜。听者容昙，记录樊七。<\/p>\n<p>戌初 · 圣环 · 苇屿码头<br>「石胎！码头上来了个石胎！」<br>「哪个？」<br>「穿蓝袍那个，你看他脚底下那块板——」<br>批：错报。实为琥珀城盐商，三百一十斤，已劝回船上。苇屿收承重钱二百文。<\/p>\n<p>戌正 · 中环 · 琥珀城<br>「会合节都过了半个月，灯笼还挂着做什么。」<br>「霞群那边又没人来，挂给谁看。」<br>批：闲话。不录。（七：已录。）<\/p>\n<p>戌正二刻 · 中环 · 霞群缺口<br>无声。<br>批：船过缺口，照例不语。录\"无声\"。<\/p>\n<p>亥初 · 外环 · 迟屿，转琥珀城听台<br>「……拆。拆成木头石头，一船一船运进来，岛让它自己走。」<br>「坟呢？」<br>「坟也起。」<br>「你起你家的。」<br>批：迟屿议事第十一夜。未定。<\/p>\n<p>亥正 · 九年线外？<br>「……任何人……不宜着地……任何人不宜……」<br>口音古，字字拖长，像庙里念经。只这一句，翻来覆去。<br>批：疑为久客岛。报涡城。（七：老师上月报过一回，涡城没回。）<\/p>\n<p>子初 · 外环 · 铁砧岛听台<br>「第九层的灯也灭了。老人都搬到第十层，跟孩子一块儿睡。致守衡院，请派人查看。请——」<br>批：已转涡城。本年第三十一封。<\/p>\n<p>子初一刻 · 涡城方向，墙内<br>衡钟报子初。<br>批：墙内的钟声一年只透出来几回。照拍簿推，此刻已是子初过一刻。衡钟慢一刻。照例。<\/p>\n<p>子正 · 涡墙<br>墙沉一拍。<br>批：照例。沉前拍五百零四，沉后五百零五。<\/p>\n<p>子正一刻 · 圣环 · 圣钟岛<br>「咔。」<br>一声，在副钟里头。前后无人语。<br>批：圣钟岛夜里修钟。照例。<\/p>\n<p>丑初 · 中环 · 粟城息市<br>「三档涨到十文了。」<br>「缥屿又高了一指，押的人赢了。」<\/p>\n<p>寅初 · 方向不明<br>一个孩子在数息，数到四百一十二，停了。<br>批：不知何处。不录。（七：录了。）<\/p><\/blockquote>\n<hr>\n<p>樊七十七岁，上台第二年，还不够格单独听，只能拿笔。他的字难看，台上的老记录骂他：\"信鹭踩了墨池，踩出来的都比你齐整。\"他就偷着练：每夜录簿封口以前，把一整夜的录一字不落抄进自己的本子，第二天比着改。这是犯台规的。容昙知道，没管他。岛上的学徒待不满一年就走的多，这个肯偷着练字的，倒待到了第二年。<\/p>\n<p>那天快天亮的时候，七把本子推到她跟前，问：\"老师，'照例'照的是哪一例？\"<\/p>\n<p>本子摊着两页，左边是今夜的，右边是他从春天抄到现在的。他拿红笔圈出了两样：一样是\"墙沉一拍\"，一样是\"圣钟岛，咔\"。<\/p>\n<p>容昙这些年写过多少回\"照例\"，她数不清了。墙会沉，墙一直在喘，七天一回小息，七八年一回大息，沉一拍不算什么。圣钟岛的副钟半夜咔一声，是历署在修钟，内环的钟都在那儿校，钟要修，也不算什么。两样她都听惯了，落笔连想都不用想。<\/p>\n<p>七把红圈一个一个指给她看。墙沉的那一夜，后半夜准有一声咔。不沉的夜里，圣钟岛一声不响。容昙起身去拿拍簿。<\/p>\n<p>拍簿是台上唯一不往外送的书，一夜一行，只记两样：涡拍长几息，墙有什么声。从升历九〇二年建台那天记起，换过四十多个听者，一夜没断过。头一百九十多年，拍那一栏全是\"五百\"，一个字压一个字往下排，排成一道白墙。她往后翻。一〇九七年春，拍那一栏头一回冒出一个\"五百零一\"，前后都还是\"五百\"。往后零一越来越密，到一一二五年秋，差不多夜夜都是。今年开春，是五百零二。<\/p>\n<p>她把今年拍簿上的\"墙沉\"一夜一夜挑出来，七在旁边对他本子上的咔。两个人一直对到天亮。<\/p>\n<blockquote><p>容昙手录 · 一一三七年 · 墙沉与咔（拍簿对樊七私抄）<\/p>\n<div class=\"tbl\"><table><thead><tr><th>夜<\/th><th>墙沉<\/th><th>圣钟岛咔<\/th><th>沉后拍<\/th><th>距上回<\/th><\/tr><\/thead><tbody><tr><td>二月十四<\/td><td>子初<\/td><td>子正<\/td><td>五百零二<\/td><td>—<\/td><\/tr><tr><td>四月廿五<\/td><td>亥正<\/td><td>子初<\/td><td>五百零二<\/td><td>七十一日<\/td><\/tr><tr><td>六月十七<\/td><td>子正<\/td><td>丑初<\/td><td>五百零三<\/td><td>五十二日<\/td><\/tr><tr><td>七月廿五<\/td><td>子初<\/td><td>子正<\/td><td>五百零三<\/td><td>三十八日<\/td><\/tr><tr><td>八月廿二<\/td><td>亥正<\/td><td>子初<\/td><td>五百零四<\/td><td>二十七日<\/td><\/tr><tr><td>九月十一<\/td><td>子正<\/td><td>子正二刻<\/td><td>五百零四<\/td><td>十九日<\/td><\/tr><tr><td>九月廿四<\/td><td>子正<\/td><td>子正一刻<\/td><td>五百零五<\/td><td>十三日<\/td><\/tr><\/tbody><\/table><\/div>\n<p>旁批：七十一，五十二，三十八，二十七，十九，十三。每回是上回的七成上下。<br>照此，下一回隔九日，在十月初三。<br>二月以前的，七没抄。拍簿上的墙沉往年也有，一年一两回。<\/p><\/blockquote>\n<p>一拍五百零五息，就是说衡钟走完一刻，天上已经过了一刻又五息。衡钟跟着涡拍走，拍长了，钟就慢。钟慢了，总得有人去拨。这一句容昙没往旁批里写。<\/p>\n<hr>\n<p>十月初三夜里，子初，她把听座转了半圈，朝着圣钟岛。<\/p>\n<p>静耳屿二十天绕涡眼一圈，圣钟岛三十天，这些日子静耳屿正从它背后追上去，两座岛隔着一百多里，圣钟岛的灯在左前方。台规第二条，圣环诸岛屋内之声，不听。她吸了一口气，把听纹描得极窄，窄得只够一根线穿过去，穿进历署钟房的窗缝。<\/p>\n<blockquote><p>十月初三夜 · 圣环 · 圣钟岛历署钟房（违台规第二条，听者自录）<\/p>\n<p>子初二刻<br>脚步，两个人。一个轻，趿着鞋；一个重，靴子。<br>钥匙，三把。第三把转了两回才开。<br>「几刻了？」——老，嗓子哑。<br>「照单子，这是第十九。」——年轻些。<br>「本年的？」<br>「从栖霞那年起算的。」<\/p>\n<p>子正<br>墙沉一拍。（静耳屿台上自听，非钟房内声。）<\/p>\n<p>子正一刻<br>「来了。」<br>「拨吧。」<br>铜擦着铜，一长声。<br>「咔。」<br>「记上。单子照旧三份？」<br>「照旧。」<br>「这回才隔九天。」<br>「九天就九天。写上就是了，用不着说出来。」<br>停了一阵，年轻的那个又开口。<br>「静耳屿离墙那么近，会不会听见？」<br>「他们听风，不听钟。」<br>脚步。钥匙。门。<\/p>\n<p>批：照例。（涂去）<\/p><\/blockquote>\n<p>\"照例\"两个字是手自己写出来的。她把它涂成了一个黑疙瘩。<\/p>\n<p>单子一式三份，一份该是给大衡的，另外两份给谁，她不知道。单子上写的是什么，她现在知道了。七在边上问要不要报，她说先听着。<\/p>\n<hr>\n<blockquote><p>静耳屿听风台 · 录簿（节）<br>十月初五夜。听者容昙，记录樊七。<\/p>\n<p>戌初 · 中环 · 琥珀城城南崖<br>「……忘即赦……忘即赦……」<br>许多人一齐念，念到第几十遍，有一阵叫好，又有人哭。<br>批：轻教崖会。录。<\/p>\n<p>亥初 · 荒带 · 船声，船名听不清<br>「……主帆裂了，驭风师脚离了甲板，谁有压舱的——有没有压舱的——」<br>批：已转琥珀城、粟城两台。荒带无台，再无下文。<\/p>\n<p>亥正 · 圣环 · 苇屿，一户人家<br>一个孩子在背一息诗，一口气背不完，背到\"云下\"两个字就喘了。大人说：再来。<br>批：误入，违第二条。不录。（七：录了一半。）<\/p>\n<p>子初 · 涡墙<br>无沉。拍五百零五。<\/p>\n<p>子正 · 中环 · 琥珀城听台（台与台闲话）<br>「静耳屿，你们那边入冬了没有？」<br>「墙边上不分冬夏。」<br>「上回你托我找的那个人，找着了。」<br>「哪个人？」<br>「你自己托的，倒来问我。」<br>墙声起，没听完。<br>批：不记得托过谁。这一行字是我的。<\/p><\/blockquote>\n<p>七问她托的是谁，她答不上来。琥珀城听台后来也没再提，她也没再问。<\/p>\n<hr>\n<p>墙沉是打哪儿来的，容昙以前没想过，墙沉嘛，自然是墙在沉。初三那一夜等那一拍的时候，她专门对着墙听了一口。墙声平平地转，那一拍一沉，墙自己也给拽了一下。声音是从墙脚底下上来的，从涡眼正当中那口井里上来的。守衡院不许任何船靠近那口井三十里。<\/p>\n<p>台规第三条，井口不听。拍簿记了二百三十多年，没有一个听者录过井下的声音。新来的学徒都要问为什么，老听者回回就答一句：\"听了要忘的。\"听哪儿不忘？这话等于没说，学徒们听过也就不再问了。<\/p>\n<p>照她和七排出来的数，下一回墙沉在十月初九前后。<\/p>\n<p>初九夜里，容昙把风绳一头拴在听座的铁环上，一头系在自己腰上。外环转来的录里常提到压舱人，说石胎把手按在驭风师背上，能替她留住一截轻。内环没有压舱人。七站在她身后，一手捏着笔，一手攥着绳。<\/p>\n<p>\"我每吐一口气，你就问一句：听见什么了。我答什么，你写什么。我要是不答，你就拽绳子。\"<\/p>\n<p>她取出耳朵里的蜡，攥进左手，把听座转过去，对准墙脚底下那片看不见的地方，吸了第一口。<\/p>\n<blockquote><p>十月初九夜 · 井下（违台规第三条）<br>听者容昙口述，樊七记。口数为七所数。<\/p>\n<p>第一口至第三十口：墙。只有墙。<\/p>\n<p>第三十一口：墙底下有雷，一阵一阵，隔着厚东西。<\/p>\n<p>第五十口：雷过去了。底下空。风从下往上走，热。<\/p>\n<p>第八十四口：水从高处落下来，打在叶子上。叶子大，比手掌大。打过好几层才落到地上。<br>（七问：什么叶子？老师说：不知道，内环没有这样的叶子。）<\/p>\n<p>第一百零二口：远处有一片水在推，一推一退，比墙慢。<\/p>\n<p>第一百三十口：一下。闷，钝，像拿什么砸进木头里，木头太大，砸不透。<br>隔四十来息，又一下。<\/p>\n<p>第一百五十五口：人。<br>（七记：老师报完这个字，半天没吸下一口。我拽了一下绳子。）<\/p>\n<p>第一百五十六口：许多人。在唱。<\/p>\n<p>第一百六十口至第二百口：唱的记在下面。老师一口报一句，我照音记。<\/p>\n<p>「亘——哎——亘——」（顿）<br>「亘——哟——哎——」（顿）<br>「亘——哎——亘——」（顿）<br>「嗬——亘——」（顿）<\/p>\n<p>只这几个音，翻来覆去。慢，比墙慢，比我数的息还慢。每一句末尾重重一顿，顿的地方正好是那一下。唱一句，砸一下。<br>字听不出。有一个音回回都在，记作\"亘\"。老师说像\"根\"，又像\"跟\"，又像\"更\"，拿不准。<\/p>\n<p>第一百九十口：砸的不止一处。近处一处，左边远些一处，再远还有，各唱各的，顿在同一下上。<\/p>\n<p>第二百一十口：一个孩子在笑。一个女人叫了一声，是在叫名字，叫了两遍。孩子不笑了。<\/p>\n<p>第二百三十口：唱声底下还有一样声音，长，低，一直在拧，像大船的龙骨在横风里吃劲。<\/p>\n<p>第二百四十四口：唱停了，砸也停了。只剩那一声拧。<\/p>\n<p>第二百四十五口：（老师没报。我拽了绳子。她吐出气，说：断。说完又吸。）<\/p>\n<p>第二百四十六口：底下许多人一齐喊了一声。听不出是怕，还是高兴。<\/p>\n<p>第二百四十七口：墙沉一拍。<br>老师报：不是墙先沉的。是底下先松，墙跟着沉。<\/p>\n<p>子正二刻 · 圣钟岛：咔。<br>（七记：老师这时候在井下，没听圣钟岛。这一声是我自己听的，用了三口小纹。我听见了。）<\/p>\n<p>第二百五十口：唱又起来了。<\/p>\n<p>第三百口：老师不报了。我拽绳子，拽了三回。她脚跟离了地。我把她拽回来，按在椅子上。<\/p><\/blockquote>\n<hr>\n<p>容昙醒过来的时候躺在台顶的石地上，天已经大亮。腰上的风绳还拴着，七蜷在听座底下睡着了，手里攥着绳头。<\/p>\n<p>她坐起来，嘴里一股铁锈味，拿手背抹了一下，手背上没有血，嘴唇却木了，碰一碰发凉。左手攥着，摊开，手心里一颗褐色的蜡丸，豆子大，硬，把掌心硌出一个坑。这是她的坠石，台上的人都有坠石，这一颗是她的。她想了一会儿它是打哪儿来的，想不起来。它在手心里，比一颗豆子沉。<\/p>\n<p>录簿摊在听座上，是七的字，一页接一页。她从第一口读起，读到\"人\"那一个字，读到\"亘\"，读到七写的\"我听见了\"。每一行她都认得，是她报的；可读着读着，就成了外环转来的一份录，一个不认识的听者，在一个不认识的夜里听见的。只有那几句唱，眼睛还没扫到，嘴已经先跟上了。<\/p>\n<p>七醒了，揉着眼睛坐起来，看着她，不敢先吭声。<\/p>\n<p>\"你叫——\"她顿了顿，\"樊七。\"<\/p>\n<p>\"是。\"<\/p>\n<p>\"昨夜我叫过你名字没有？\"<\/p>\n<p>\"没有。您一直叫我'记录的'。\"<\/p>\n<p>那天上午，她把报告写完，封了口。<\/p>\n<blockquote><p>呈涡城衡塔，大衡座下<\/p>\n<p>静耳屿听风台听者容昙谨报：<\/p>\n<p>一、本年二月至十月，墙沉九回，每回之后，圣钟岛副钟必咔一声。相隔七十一、五十二、三十八、二十七、十九、十三、九、六日，每回约为上回七成。<\/p>\n<p>二、十月初三夜，听者违台规第二条，听圣钟岛历署钟房。所咔者，补刻也。历署有单，一式三份。<\/p>\n<p>三、十月初九夜，听者违台规第三条，听井下。井下有雨有水，也有人。人在唱，唱一句，砸一下。墙沉之前，底下有一声长拧，拧断，众人齐喊。所唱照音附后。<\/p>\n<p>四、照七成推，下一回在十月十三前后，再下一回在十六前后。<\/p>\n<p>五、底下是什么人，在砸什么，听者不知。<\/p>\n<p>附：《井下听录》七页。记录樊七私抄一册，台规所禁，一并呈上，所录诸夜可以对看。<\/p><\/blockquote>\n<blockquote><p>十月十一夜 · 外环 · 铁砧岛听台（答本台所问）<br>本台照《井下听录》所附之音，对铁砧岛风口哼了一遍。<br>「……你哼的那个，我们这儿谁都听过。根矿里的老人梦醒了就哼，哼了四十年。你从哪儿听来的？内环也有人做这个——」<br>墙声大起，断。<br>批：根矿里的老人，是石胎。石胎做梦。没听懂。下回再问。<\/p><\/blockquote>\n<p>台上的信鹭叫蜡头，头顶一撮黄毛，名字就是这么来的。它从静耳屿去涡城，得等风隙开，下一回风隙开在十二日。十二日一早，容昙把报告、七页录和七的本子卷成一卷，塞进它腿上的铜管，拧紧。蜡头在塔顶绕了半圈，朝墙那边飞，白翅膀贴着墙根，越飞越小，钻进风隙那道缝里不见了。<\/p>\n<hr>\n<p>十月十三，墙沉在亥正，咔在子初。那天夜里她又把听纹穿进了历署的窗缝，只听了几口。<\/p>\n<blockquote><p>十月十三夜 · 圣环 · 圣钟岛历署钟房（违台规第二条，听者自录）<br>「又来了。」<br>「四天。」<br>「单子写不下了，背面接着写。」<br>「咔。」<br>批：（空）<\/p><\/blockquote>\n<p>十六那天夜里，照七成推的那一回该到了，她又下了一回井。<\/p>\n<blockquote><p>十月十六夜 · 井下，第二回<br>听者容昙口述，樊七记。<\/p>\n<p>第一口至第二百口：（七记：同初九。老师报得比初九快，有几处我还没问，她先报了。）<\/p>\n<p>第二百一十口：唱。<\/p>\n<p>第二百四十口：有一个嗓子离得近，老，单独唱，唱一句，自己砸一下。别人不跟他。<\/p>\n<p>第二百六十口：老师问我：我们在听什么。我说：井。她说：哪口井。<\/p>\n<p>第二百六十一口：拧。断。喊。<\/p>\n<p>第二百六十二口：墙沉一拍。<\/p>\n<p>子初二刻 · 圣钟岛：咔。（七听。）<\/p>\n<p>第二百七十口：老师不报了。我拽了五回绳子。<\/p>\n<p>批（容，次日）：此夜不记得。字是七的。<\/p><\/blockquote>\n<p>第二回以后，初九那一夜也跟着没了。她知道自己往涡城报过一件事，因为七这么说；报的是什么，七讲了一遍，她听着点头，问了两处，问的都是七刚讲过的。只有那几句唱还在。夜里不听风的时候，她的嘴会自己动起来，七在边上听见了，从来不说。<\/p>\n<hr>\n<p>十月二十，蜡头回来了，铜管里卷着两张纸。<\/p>\n<blockquote><p>衡塔 · 批<\/p>\n<p>静耳屿听风台呈报一件，附《井下听录》七页、私抄一册。<\/p>\n<p>览。<\/p>\n<p>入二十九层大书，一一三七年十月下，白一页。副页一张，付听者存。<\/p>\n<p>录七页、私抄一册，留塔，不还。<\/p>\n<p>静耳屿听风台朝井诸风口，以蜡封之，永为例。<\/p>\n<p>听者容昙，调外环长听，即日起，一转。<\/p>\n<p>记录樊七，调圣钟岛历署，充书手。<\/p>\n<p>——执<\/p><\/blockquote>\n<blockquote><p>副页<\/p>\n<p>（白）<\/p>\n<p>右下角朱印一方：衡塔大书 · 二十九层 · 白。<\/p><\/blockquote>\n<p>副页是一张淡黄的薄皮纸，捏着发软，跟台上用的纸不是一路货。正面背面都是白的，只在角上盖了那一方印。容昙把它翻过来，又翻回去，举起来对着墙光照了照，什么也没照出来。白页是什么，内环的孩子都知道：大书里这一页有事，后人读到了，合上就是，别问。可白页还有张副的，要送到事主手里，这个她从没听说过。<\/p>\n<p>七读到最后一行，抬起头：\"历署？就是拨钟的那个历署？\"<\/p>\n<p>容昙没答。她把批文从头又读了一遍。长听她懂。外环的声音远，得一口接一口地拉，一转三十夜，一夜两千口，长听回来的人嘴唇是青的，耳朵里什么都还在，别处什么都没了。台上的老人管长听叫洗耳朵。<\/p>\n<p>封风口用的蜡大，台上没有，她下塔去蜡铺订。铺子在码头后头，门口晾着几只竹匾。掌柜是个中年女人，两只手全是蜡渣，见了她先笑：\"容姐，六块，还照老规矩掺三成灰？你娘那会儿也是掺三成。\"容昙说照老规矩。她站在门口等，看那女人坐在门槛上搓蜡，搓圆一颗，丢进竹匾，再搓一颗。那道门槛，那几只竹匾，她看着眼熟，说不上在哪儿见过。<\/p>\n<p>七走的那天早上，圣钟岛派船来接他。他背着铺盖卷在塔底下站了好一阵，张了几回嘴。容昙在塔顶封风口，没下去。<\/p>\n<p>封风口用的也是蜡，跟塞耳朵的一样，蜂蜡掺息萤灰，就是大得多，一块一块按进朝井的那六个风口，按实，抹平。六个风口封上，塔顶暗了一角，墙声闷下去半成。按最后一块的时候，手里那颗褐色的蜡丸滑了出去，掉在地上，滚到墙根。她捡起来看了看，又攥回左手。<\/p>\n<p>船要开了，七在塔底下喊了一声\"老师\"。她探出身子。他仰着脸看了她一阵，说：\"蜡头的食我搁在第三格了。\"说完上了船。<\/p>\n<hr>\n<p>长听从二十一夜起。外环的声音远，一口拉不到，得把七八口连成一口，中间换气不许断纹。台上没有记录了，她听一阵，停下来自己写，写完再听，一夜下来，录簿比往常厚一倍。头几天早上醒来，她都得先看一眼录簿封皮上的名字，看完了才下塔。到第五天，她不看了。<\/p>\n<blockquote><p>静耳屿听风台 · 录簿<br>升历一一三七年，十月廿七夜。长听第七夜。听者容昙，自录。<\/p>\n<p>戌初 · 外环 · 迟屿，转琥珀城听台<br>「……不拆了。走就走。」<br>批：迟屿议事。定了。<\/p>\n<p>亥初 · 外环 · 铁砧岛听台<br>「……第十层的灯……孩子们挪到井口去睡……请派人——」<br>批：已转涡城。本年第三十四封。<\/p>\n<p>亥正 · 涡墙<br>墙沉一拍。<br>批：照例。拍五百零七。<\/p>\n<p>亥正二刻 · 圣环 · 圣钟岛<br>「咔。」<br>批：圣钟岛夜里修钟。照例。<\/p>\n<p>子正 · 涡墙<br>墙沉一拍。<br>批：照例。拍五百零八。<\/p>\n<p>子正一刻 · 圣环 · 圣钟岛<br>「咔。」<br>批：照例。<\/p>\n<p>丑初 · 外环 · 灰脊听台，船声<br>「灰鹞号离港，没报去向。」<br>「那匹马呢？」<br>「带走了。」<br>批：闲话。录。<\/p>\n<p>丑初二刻 · 中环 · 粟城法庭，转粟城听台<br>「葛穗诉戚有余一案，石证在堂，被告不知己名，改期。」<br>批：录。<\/p>\n<p>丑正 · 九年线外？<br>「……任何人不宜……」<br>批：疑为久客岛。报涡城。<\/p>\n<p>寅初 · 方向不明<br>有人在哼，慢，只几个音，每句末尾敲一下什么。<br>批：近。疑是本岛。不录。<\/p><\/blockquote>\n<p>寅正，容昙吐出最后一口气，把录簿封好，塞进蜡头腿上的铜管。天边发白了，墙从奶白里透出一层灰来。<\/p>\n<p>听座的椅背上，台规底下，钉着一张淡黄的白纸，右下角一方朱印。她不记得是谁钉的。每天坐下之前，她都要看它一眼，像看一扇从里面闩上的窗。<\/p>"}, {"title": "鲸歌", "meta": "《浮垣记》之十一 · 升历 1137 年 · 初冬", "end": "第十一篇·完", "html": "<aside class=\"transit\"><div class=\"transit-h\">途经<\/div><p>入冬，外环走进了朔季，风冷，天透亮。夜里息萤从云海里浮起来，把云面照成一片蓝；云鲸就浮上来吃萤，几十丈长，背脊一道一道露在云上，唱的歌几百里外都听得见。外环有几座岛靠杀鲸过活，熬鲸油，取鲸晶，油运到中环去点灯。膏屿是其中一座。岛上最老的猎人家里，梁上缠着一根三百年的绳子，绳上的结记的是鲸唱过的歌，比升历还准。<\/p><\/aside>\n<hr>\n<p>伍蓼的第二叉扎进那头小鲸的心窝，血顺着叉杆冒出来，往天上走。<\/p>\n<p>云鲸的血是淡青色的，比水还稀，自己带着点光。它不往下淌，一出伤口就聚成珠子，有豌豆大的，有桃核大的，颤颤地往上浮，一串一串越过膏七号的桅顶，叫初冬的冷风一吹，越升越散。膏屿人管这叫倒雨。头一回出船的人看见倒雨，十个里有八个要趴在船舷上吐。伍蓼十四岁头一回出船，愣是没吐，她爹在舵台上看着，说这丫头吃得了这碗饭。<\/p>\n<p>小鲸还在挣。它十二丈长，开春才在鲸群里露的脸，皮是半透的，看得见里头的萤囊一胀一缩，亮一下，暗一下。它想往云里钻，囊憋扁了，身子沉下去半截，又被叉绳拽回来，尾巴一下一下拍着云面，拍出一圈圈白浪，浪头扑上船舷，冰凉。<\/p>\n<p>\"碾！\"<\/p>\n<p>石胎碾已经从船头翻下去了。他落在鲸背上，整头鲸往下一闷，尾巴停了半拍。他不抓也不打，就在萤囊上头盘腿一坐，两手按着鲸皮，往下沉。鲸一死，囊就松了，满满一囊光托着它往天上走，飘起来就追不上了。所以膏屿的船都雇一个石胎，坐在鲸身上，一直坐到刀手割完。镇尸人分一份，叉手分一份半。<\/p>\n<p>伍蓼换了长刀，从鳃后那道褶子下刀，顺着脊背往后拉。刀口一张，底下是一层白膏，一尺厚，冒着热气，膏底下是青的肉，肉里的血珠子一颗颗挤出来往上飘，粘在她睫毛上，凉丝丝的。小鲸叫了一声。那声音没从嘴里出来，整个身子都在响，船板跟着嗡了一下，伍蓼牙根发酸。<\/p>\n<p>这一声没传多远，东北边的鲸群就接了过去。<\/p>\n<p>鲸群离船两三里，四十来头，背脊浮在云面上，一道一道的。往年这时候它们早该散开吃萤了，各吃各的，一夜能游出去几十里。今年它们挤成一团，围着当中最大的那头转圈，已经转了一个多月了。<\/p>\n<p>歌从云底下传过来。先是长长的一声，往下坠，坠到耳朵都听不见了还在坠，船板替人听着，一直在嗡。然后是叠：一短，一长，一短，一长。每一叠收尾的时候，多出一下又闷又短的响，像满载的船底蹭着了一块孤石。<\/p>\n<p>瞿伯坐在舵台上，一只手扶舵，一只手捏着腰上那根绳，过一叠，捻一个结。他左耳冻掉了半只，听鲸歌总拿右半边脸冲着鲸群，脖子拧着，半天不动。捻到一个地方，他停了。<\/p>\n<p>\"多少？\"伍蓼问。<\/p>\n<p>\"四十。\"<\/p>\n<p>跟昨天一样，跟前天也一样。伍蓼没再问，低头接着割那块膏。<\/p>\n<p>萤囊最后取。囊在鲸肚子底下，裹着一层筋膜，有一人高，胀满了比鲸皮还亮。伍蓼和九斤一人一边剥筋膜，碾在上头压着。囊一离身，整头鲸就重了，碾坐的那块往下一塌。九斤今年才满二巡，手生，刀尖在囊上挑了个口子，光从口子里喷出来，把四个人的脸照得一片青，他的眉毛当场燎掉半边。<\/p>\n<p>囊底沉着鲸晶，米粒大小，温的。九斤拿铜勺往罐子里舀，舀一勺，压一回盖。罐盖是铅的，压慢了，鲸晶就一颗颗从罐口飘出去，跟着倒雨走了。一头十二丈的小鲸，舀了小半罐。<\/p>\n<p>骨头和肉都不要了。碾攀着叉绳回到船上，伍蓼一刀把绳割断。掏了萤囊的鲸是沉的，它先侧过身来，露出割得白一块青一块的肚皮，接着头往下一栽，滑进了云里。云面合上，鼓起一个包，又平了。膏屿人管这叫放骨。老辈人说，云鲸死了，都要回底。<\/p>\n<hr>\n<p>膏七号回港的时候天刚擦黑。膏块从船上一块块扔下来，码头上的女人拿钩子钩住，拖进熬膏房，扔进锅里。熬膏房里一溜九口大锅，锅底烧的是鲸油，火苗青白。膏一化就咕嘟咕嘟冒泡，泡一破，溅起来的油星子不往下掉，飘在半空，一层层攒在房梁底下，攒成一片发亮的雾。熬膏的人每隔一个时辰就拿长杆子去搅那片雾，把它赶出天窗，不然人在屋里待久了，脚底下发飘。鲸晶罐另外放，锁进瞿家的地窖，一罐一把锁，钥匙瞿伯挂在脖子上。<\/p>\n<p>伍蓼在锅边一直站到半夜，看着那锅油从白熬到黄，又从黄熬到清。熬清了就舀出来装坛，坛口封蜡，等开春运过荒带，卖到中环去点灯。琥珀城的人点了一辈子这种灯，也不知道油是从哪头鲸身上来的，那头鲸死的时候又唱到了哪一叠。<\/p>\n<p>膏屿在外环，从灰脊往朔方走七八百里，是座小岛，只住得下两千人。岛上一年到头都是熬膏的味儿，腥里带甜，沾在衣裳上洗不掉。膏屿人去别的岛赶集，人还没到，味儿先到了。房梁是鲸肋，门槛是鲸颌骨，街上的灯烧的也是鲸油，火苗青白，比浮晶灯亮，可是短命，一盏只能点一夜。中环人说外环穷，穷到点个灯都得杀生。<\/p>\n<p>瞿家的绳缠在堂屋的鲸肋梁上，一圈一圈，九道梁都缠满了。<\/p>\n<p>绳是麻的，不知道接过多少回了，最老的那截黑得发亮。每年最长的那一夜，鲸群的歌要添一叠，瞿家的人就在绳上打个小结；每逢开云日，一个大息过去，鲸群的叠落回一，瞿家就打一个大结，小结从头数。三百多年，四十几个大结，小结数不清。瞿伯说，打他太爷爷那辈起，就从绳上看出门道来了：添叠那一夜从来不差，升历的冬至会差，鲸不会。<\/p>\n<p>一〇五〇年那个小结底下，多拴了十一根短线头。那年冬天鲸群添叠的那一夜，升历上写的是冬至以后第十一天。瞿家的老人弄不明白升历怎么少了十一天，只知道鲸没少，就拴上十一根线头，交代后人：往后看升历，记得扣掉。<\/p>\n<p>大结更要紧。一个大息走到最后一年，叠数到了头，落腔就开始拖，一夜比一夜长，拖到哪一夜忽然断了，鲸群就不唱了。停唱以后十一到十三天，准有开云日。看萤潮也看得出大息，可只看得出是哪一年；听鲸歌，看得出是哪一天。今年开春，瞿伯算准了日子，托信鹭报给灰脊的沉渊者行会，换回来一袋碎浮晶，够膏屿的船换一回底。开云日那几天，膏屿外头的鲸一头都不剩，全跑到灰脊那边去了，聚在裂口上头。等裂口合上，它们才回来，群里多了十几头小的。<\/p>\n<p>谁也没见过云鲸生崽。开云日以前没有小的，开云日一过就有了，瞿家的绳上三百年都是这么记的。<\/p>\n<p>开春以后叠落回一，起腔、叠、落腔，跟绳上记的一样，一直唱到秋天。起腔往上走，一声比一声高，鲸浮在云面上，嘴冲着天唱，膏屿的老人说那是在跟上头打招呼。到了秋末，有一夜起腔没了。歌从落腔开头，一路往下走，叠里多出那一下闷响，叠数也不对了，一夜之间从一跳到四十，往后夜夜都是四十，不添也不减。<\/p>\n<p>膏屿最老的几个猎人都听过没有起腔的歌。一头老鲸要回底了，鲸群就围着它唱一夜，唱的就是这个，老人管它叫送底腔。唱完，老鲸沉下去，鲸群散开，接着吃萤。<\/p>\n<p>今年这一回，唱了一个多月，围的是钉背。<\/p>\n<hr>\n<p>钉背这名字是膏屿的猎人起的。它六十丈长，群里数它最大，也数它最老。瞿家的绳上头一回记它，是三百一十年前，那会儿它背上就已经有钉了。<\/p>\n<p>钉就是叉头。三百年来，膏屿的、骨屿的，外环哪一座猎鲸岛的叉手都朝它扔过叉，没有一柄要了它的命。叉头扎在背上拔不出来，绳断了，杆烂了，铁锈在皮里头，一年年长进肉里。远远看过去，它脊背上是一片秃了的林子。瞿伯他爷爷那一柄也在上头，叉头根上刻着瞿家的三道印，瞿伯年轻时拿长筒镜找见过。<\/p>\n<p>伍蓼她爹那一柄也在。十年前冬天，伍家的船叉中了钉背，钉背没往云里钻，拖着船在云面上跑，跑了一整夜，跑出了外环的灯火。第二天早上，骨屿的人看见钉背自己回来了，背上多了一柄叉，叉绳上拖着半截船舷。那年伍蓼二十四，在码头上等到天黑。第二年开春，她上了瞿伯的船。<\/p>\n<p>这一个多月，鲸群夜里不散。钉背在当中，别的鲸贴着它绕，每绕一圈，就有一两头离了群，头朝下沉进云里，再没浮上来。伍蓼一直在数，四十来头的群，现在只剩二十九头。<\/p>\n<p>骨屿的信鹭是一天傍晚到的。它落在瞿家门口的鲸颌骨上，顶着朔风飞了三百里，毛都炸开了。瞿伯捧在手里暖了半天，才把铜管解下来。<\/p>\n<blockquote><p>骨屿问膏屿安。本岛外鲸群三夜沉十九头，不浮。群中老鲸亦沉。今冬无鲸。贵岛如何。<\/p><\/blockquote>\n<p>瞿伯把条子念了两遍，抬头看伍蓼。<\/p>\n<p>\"它们都要回底了。\"<\/p>\n<p>\"回底的是老的。\"伍蓼说，\"今天那头小的，开春才露的脸。\"<\/p>\n<p>\"四十叠。\"瞿伯说，\"哪有四十年的大息。它数的不是年。\"<\/p>\n<p>\"那它数的是什么？\"<\/p>\n<p>瞿伯答不上来。他把条子折成细细一条，塞进腰上那根绳的一个结里。<\/p>\n<p>当天夜里，九条船的老大聚在熬膏房。七个人都说，趁鲸还在，多杀几头小的，这一冬的膏够吃两年。瞿伯等他们说完了。<\/p>\n<p>\"我要钉背。\"<\/p>\n<p>熬膏房里一下子没了声。有人笑了一声，没笑下去。<\/p>\n<p>\"钉背一囊鲸晶，顶你们七条船一冬。\"瞿伯说，\"它一回底，群就散了，散了的也得跟着下去。我不要它的命，我要它的囊。\"<\/p>\n<p>\"它可拖走过伍老大。\"<\/p>\n<p>\"所以我带上伍家丫头。\"<\/p>\n<p>伍蓼坐在锅边，脸叫热气熏得发烫。她想起她爹那条船。十年了，她一回也没梦见过它，只是在码头上看见别人家的船舷，偶尔会多看两眼漆色。钉背背上那片林子里，有一柄叉头根上刻着伍家的一道印。<\/p>\n<p>\"我扔。\"她说。<\/p>\n<hr>\n<p>膏七号是第三天夜里出的船。朔季的夜冷得发脆，天透亮，萤潮起得早，上半夜就把云海铺成了一片蓝。船上四个人，两盘叉绳，一盘三百丈；船尾柳条笼里关着一只报鹭。膏屿的船出远门都带一只，万一船被鲸拖走了，就把方位写在纸上放它回去，好让岛上的人知道往哪边不用再找了。<\/p>\n<p>船往鲸群那边摸，摸了小半个时辰，瞿伯一直没吭声。快到的时候，他把舵交给九斤，挪到船头，在伍蓼边上蹲下，拿手掌拢着烟袋锅点火，点了三回才点着。<\/p>\n<p>\"我十六那年，跟我爹去灰脊卖油，正赶上开云日。\"他说，\"沉渊者都扒在断喙上往裂口底下看，我也看。他们看海，看地，我看鲸。裂口边上的云直上直下的，鲸一头一头贴着它往下走，竖着，头朝下，一直下到灰里，看不见了。过了两天，裂口合上，它们又从云里冒出来，多了几头小的。\"<\/p>\n<p>\"你爹怎么说的？\"<\/p>\n<p>\"他说鲸是下去生崽。我问它下去跟谁生，他给了我一巴掌。\"瞿伯嘬了口烟，烟往上飘，在萤光里散了，\"打那年起，我替我爹数叠，一直数到今天，五十年了。\"<\/p>\n<p>伍蓼等他往下说。他没往下说，把烟袋锅往船舷上磕了磕，火星子掉进云里。<\/p>\n<p>\"囊归熬膏房。\"他说，\"我想跟下去听一回。\"<\/p>\n<p>伍蓼没接茬。她把叉绳从绳槽里又理了一遍，看着它一圈圈码好。<\/p>\n<p>钉背浮在群当中吃萤。它张着嘴，嘴有膏屿的码头那么宽，上颌垂着一排须板，息萤叫它吸着，从四面八方往那张嘴里流，在云面上拧成一个慢慢转的蓝涡。别的鲸绕着它，背脊一起一伏，唱着那支没有起腔的歌，船板嗡得人站不稳。<\/p>\n<p>往年船摸到半里以内，鲸群就散了。今年膏七号一直摸进了它们中间，它们也不躲，也不看，照样唱，照样绕。一头二十丈的母鲸从船底下滑过去，背脊离龙骨不到一臂，凉气透过船板往上冒。九斤缩在桅杆底下，大气都不敢喘。<\/p>\n<p>钉背的眼睛长在脑袋侧面，比船舵还大，半闭着，眼皮上也扎着一柄叉。伍蓼站在船头，脚抵住叉架，看着它背上那片林子一柄一柄从眼前过去，骨叉，铜叉，铁叉，全锈成了一个颜色。她找伍家那道印，没找着。<\/p>\n<p>\"心窝在鳍后头三丈。\"瞿伯在后头说，\"斜着往下扔，扔深点。\"<\/p>\n<p>她扔了。叉扎了进去，叉杆没进去一半，叉绳从船头的绳槽里嘶嘶地往外走。钉背没叫。它不跑，也不翻，嘴还张着，息萤还在往里流。过了几十息，它把嘴合上，头往下一沉，绳槽里的绳走得快了。<\/p>\n<p>它往下去了。头朝下，尾朝上，六十丈的身子一寸一寸立起来，倒插着往云里沉。叉绳绷直了，船头被拽得往下一点，船尾翘了起来，柳条笼滑到舵台底下，报鹭在里头扑腾。<\/p>\n<p>\"砍不砍？\"九斤喊。<\/p>\n<p>伍蓼手里已经攥着斧子了。她回头看瞿伯。<\/p>\n<p>瞿伯两手扶着舵，没动，脸冲着钉背沉下去的地方。四周的鲸都停了，二十几头，一齐把头转向钉背，背脊一头接一头立起来，跟着往下去。歌没停，从云面上挪进了云里，越来越闷，船板嗡得发烫。<\/p>\n<p>\"不砍。\"瞿伯说，\"跟。\"<\/p>\n<p>碾走到船当中，在龙骨上坐下，两手按住船板。船身稳了稳，船头还在往下栽。伍蓼放下斧子，从笼里掏出报鹭，九斤递过来炭条和纸，她垫在膝盖上写：<\/p>\n<blockquote><p>膏七随钉背下云。初冬，朔季，夜心。鲸群全下。勿寻。<\/p><\/blockquote>\n<p>写完，她在\"勿寻\"两个字上停了停，没改。铜管拧紧，她把鸟往上一扬，报鹭在萤光里打了个旋，朝膏屿那边去了。膏七号的船头扎进了云里。<\/p>\n<hr>\n<p>先是白。白得分不出上下，也分不出远近，云灌进嘴里，凉，湿，有点腥，是鲸的腥。叉绳在船头嗡嗡地响，船被拽着往下滑，斜着，越滑越陡。伍蓼抱着叉架，什么也看不见，只听得见歌。歌哪儿都是，船底下有，她自己肋骨里也有，一叠一叠的，每叠末尾那一下闷响，船就跟着一颤。<\/p>\n<p>接着是灰。灰层比云冷，四下一下子暗了。远处打雷，一亮就是一大片，照出灰云一团一团往下翻。<\/p>\n<p>灰脊的沉渊者来膏屿买油，喝醉了讲过雷鳗，说灰层里有一闪就没了的长条光；也讲过渊影，说有大影子从灰里游过去，比岛还大，行会不让记进册子。伍蓼两样都当醉话听。这会儿雷鳗就在船两边，一条一条，比膏屿的码头还长，弯着，亮着，从底下伸上来，在灰里摆。雷光一落，它们就亮一回。它们是有根的，根都往下扎，扎进同一个地方。它们摆的样子，跟钉背嘴边那排须板一模一样。<\/p>\n<p>\"伍丫头。\"瞿伯在后面说，\"往下看。\"<\/p>\n<p>鲸群在底下。它们挂在灰里，一头一头，头朝下，尾朝上，一动不动，像膏屿熏房里倒挂着的鲸肉条。起先是二十几头，后来四十几头，再后来她数不过来了：骨屿的鲸，不知道哪座岛外头的鲸，上下好几层，挂满了船底下整片灰。它们都在唱，嘴朝下，唱的是同一叠。钉背拖着叉绳从它们当中穿下去，膏七号跟在后头。一头鲸的尾鳍擦着船边过去，鳍上的萤光蹭在船舷上，青白的一道，好一会儿才灭。<\/p>\n<p>九斤在桅杆底下哭，不出声，鼻涕流进了嘴里。<\/p>\n<p>\"别往上看，\"碾说，\"看你手上。\"<\/p>\n<p>雷光又落了一回，伍蓼看见了底。<\/p>\n<p>她先当是山。沉渊者说过，灰层里有根纪的山顶戳上来。眼前是一道坡，黑的，往两边去，望不到头，坡上长着林子。雷光一灭一亮，她看清了，那林子全是叉。骨的，铜的，铁的；有她认得的样式，膏屿的、骨屿的，也有她不认得的，三股的，弯的，还有一块磨尖的黑石头绑在木杆上。越往坡下叉越老，杆子早烂没了，光剩叉头，一层压一层地码着。最老的那些叉头上长着壳，白的，一圈一圈，硬的，层层叠叠把铁都盖住了。那种壳她一辈子没见过，膏屿没有，天上哪儿都没有。<\/p>\n<p>坡在动。雷光底下，整道坡往上一鼓，鼓起几丈高，又落回去，林子跟着一起一伏，叉头碰着叉头，响成一片，隔着灰传上来，像一千条船的锚链一齐松开。<\/p>\n<p>坡上开着口子，一个挨一个，大的有熬膏房那么大，小的才井口大。口子里蜷着东西，半透明，青的，一胀一缩，有的已经一丈多长，看得出鳍，也看得出尾。伍蓼认得那种胀缩，今天早上她还在一头小鲸的肚子底下见过。<\/p>\n<p>最大的口子在坡顶，边上的叉最密。钉背的头抵到口子边上，停了停，身子一缩，滑了进去。六十丈，一截一截地进去，背上那片秃林子也一截一截地进去，最后是尾巴。口子合上了一半。<\/p>\n<p>叉绳还连着。叉头还扎在钉背心窝里，钉背在口子里头，绳从口子里伸出来，绷得笔直，把膏七号往下拽。坡越来越近。伍蓼看得见坡上的皮了，皮上一道一道的褶，褶里卡着碎骨头，卡着一截船舷，船舷上的漆还剩一点红，膏屿的红。<\/p>\n<p>\"砍！\"她喊，抡起了斧子。<\/p>\n<p>一只手按住了她的胳膊。是瞿伯。不知道什么时候他从舵台上下来了，站在她身后，腰上那根绳解开了，一圈一圈绕在胳膊上。<\/p>\n<p>\"它在唱，\"他说，\"你听。\"<\/p>\n<p>伍蓼听着。整道坡都在唱。找不出是哪一张嘴，歌是从坡底下、从那些口子里出来的，低得她耳朵听不见，只觉得牙在响，眼珠子在眼眶里一跳一跳。挂在灰里的几百头鲸跟着它唱，一叠，又一叠。每叠到了末尾，整道坡从里往外一抽，叉林哗地张开，又合拢。<\/p>\n<p>瞿伯在数。嘴唇动着，没出声。数完了，他看着她。<\/p>\n<p>\"四十。\"<\/p>\n<p>\"瞿伯——\"<\/p>\n<p>\"我爷爷数了一辈子，我也数了一辈子，到底不知道数的是谁。\"他把胳膊上的绳一圈一圈解下来，搭到她肩上。绳是凉的，沉，三百多年的结都在上头。\"冬至那一夜，你替我数。\"<\/p>\n<p>他从她手里拿过斧子，扔在甲板上，抓住叉绳，翻过了船头。<\/p>\n<p>伍蓼伸手去抓，只抓到他一片衣角，衣角从指头缝里溜走了。瞿伯两手攥着叉绳往下滑，一丈，两丈，滑得比船还快。雷光一亮，他在绳上；暗了，再一亮，他小了；又亮的时候，他已经到了坡顶那个口子边上，回头往上看了一眼。口子合上了。<\/p>\n<p>叉绳松了一下，又猛地绷紧，开始往口子里收，一把一把的，把膏七号往下拽，像有人在里头收绳。<\/p>\n<p>碾从龙骨上站起来，一步跨到船头，捡起斧子，一斧子砍在绳槽上。绳断了，断头抽回去，在灰里一甩，没了。<\/p>\n<hr>\n<p>没了绳，膏七号就往上走。船底衬的鲸晶是满的，平时要拿压舱石压着，这会儿什么也压不住它了。碾坐回龙骨上，两手按着船板往下沉，船还是往上冲，冲得九斤趴在甲板上起不来。伍蓼抱着叉架，肩上压着瞿家那根绳。挂着的鲸一头一头从船边往下退，退成一排一排的影子，退进灰里。雷鳗还在摆，歌还在底下。她穿过灰，又穿过白，云一层一层从脸上刮过去，又湿又黏。<\/p>\n<p>膏七号冲出云面的时候，天是蓝的。<\/p>\n<p>萤潮正涨到顶。伍蓼出了二十年船，没见过这么亮的萤潮。息萤从云海里往上升，密得像一场往天上下的雪，铺满了整片天，从这头到那头一条缝都没有，照得云面白里透青，她连自己手背上的汗毛都看得清。云面上一头鲸也没有。往东看，往北看，往骨屿那边看，几百里亮堂堂的云海，平平整整，找不见一道背脊。<\/p>\n<p>九斤坐起来，仰着脑袋，嘴张着合不上。<\/p>\n<p>膏屿在西边，二十几里外，一团青白的鲸油灯光。岛边上站满了人，隔得远，看不清脸，只看得见一排灯笼沿着崖沿排开。报鹭到了。<\/p>\n<p>碾忽然把两只手从船板上拿开，抬起头。<\/p>\n<p>\"它上来了。\"<\/p>\n<p>船底下的云在鼓。先是一道浪，长得看不见两头，浪头平平的，从东南推过来，把膏七号往上一抬，抬了几丈，没再落下去。浪后头还是浪。云面隆起来，隆成一道脊，从船底下往两边伸，往东伸出去十几里，往西一直伸到膏屿的根底下，比膏屿长，比伍蓼这辈子见过的哪座岛都长。云从脊上往两边淌，淌开了，脊就露了出来。<\/p>\n<p>是那片叉林。萤光底下，叉是黑的，银的，锈红的，几十万柄，几百万柄，从云里一排排立起来，叉头朝天，挂着云絮，挂着白壳，挂着碎骨头。林子当中开着口子，一个个往外冒热气，那股腥比熬膏房还冲，顺着风灌进伍蓼嘴里。<\/p>\n<p>整道脊吸了一口气。<\/p>\n<p>离脊最近的萤先动了，一团一团往下落，落进那些口子里；远的也跟着动了。整片天的萤一齐掉头往下流，从四面八方流向这道脊，流成一条一条河，河又汇成一大片，在天上拧成一个慢慢转的涡，比钉背吃萤时那个大上一千倍，转得膏七号的帆都鼓了起来，往那边歪。九斤抱住了桅杆，碾又按住了船板。<\/p>\n<p>天从边上开始黑。先是东边，再是北边，黑一寸一寸往里收，收过膏七号的桅顶，收到那道脊正上方，最后一点蓝被吸了进去，没了。<\/p>\n<p>伍蓼站在船头，什么也看不见。天上一只萤都没剩，她的眼睛叫萤潮晃了半夜，连星星也认不出来。四下里只剩西边一点光：膏屿的鲸油灯，一排一排，青白的，挂在崖沿上。<\/p>"}, {"title": "忆雨", "meta": "《浮垣记》之十二 · 升历 1137 年 · 冬", "end": "全集·完", "html": "<aside class=\"transit\"><div class=\"transit-h\">途经<\/div><p>这一回，鸟不飞了。往下。穿过云海的白，穿过灰层的雷，一直穿到云的底下。上面的人说，那里叫渊，没人去过，律法也不许人去；老沉渊者喝醉了会说，开云日底下下的雨，是从上面落下去的。底下的人不叫它渊。他们管头顶那一整块云叫顶，管脚下叫地。他们不数年，只数日子，从地走的那一天数起，一天也不落。<\/p><\/aside>\n<hr>\n<p>梯爬上塔顶的那天早上，是地走以后第四十万九千二百七十一日。<\/p>\n<p>这个数是灯婆告诉她的。灯婆天天不亮就坐在屋门口，等梯醒了，先说一遍今天是第几日，再叫她跟着说一遍。留民的孩子会说话以后，头一样学的就是这个，学会了就自己往下数，一直数到死。梯数了五千四百多个日子，一天没漏过；灯婆数了两万多个。<\/p>\n<p>她出门的时候，凿脉的人已经扛着锤子往山北去了，一个跟着一个，走在雾里，脚步声闷在湿土里。灯婆走在头里，斧子插在后腰上，回头看了梯一眼，没吭声。今天顶上压着东西，留民走路都比平常轻。<\/p>\n<p>塔在山顶上。下半截埋在土里，露在外头的那截，里面盘着石阶，三百一十一级，好几处被树根拱裂了，一踩就晃。塔顶塌了一半，剩一块石头平台，四面垂着藤。梯小时候以为塔是山自己长出来的，跟洞里的石笋一样。后来绳告诉她，塔是人盖的，上头也有，一千多座，跟这座长得一个样。<\/p>\n<p>\"盖那么多干什么？\"<\/p>\n<p>\"拴船。\"<\/p>\n<p>\"船也要拴？\"<\/p>\n<p>绳想了想：\"上头的船，不拴就跑了。\"<\/p>\n<p>平台当中立着一根木桩，是天开以前她跟灯婆一起栽的。春天以前，桩上挂着绳的钩子；春天以后，桩上就空了。梯还是隔七天上来一趟，拿腰上那把短刀割一把雨脚白，插在桩脚的石缝里。雨脚白只长在下过雨的地方，开小白花，不香，留民拿它送死人。<\/p>\n<p>插好了花，她蹲下去扫石板上的落叶。石板上有两道刻痕。一道是她春天凿的：一只手，一把刀，刀下一根线，线上浮着好些小圆块。灯婆先拿炭画好，她照着凿，凿了两个晚上。另一道是条直槽，从石板东沿一直拉到桩脚，又深又齐，比她凿的哪一笔都深，年头也比她那道久得多。<\/p>\n<p>她站起来，抬头看顶。留民管天叫顶。顶是一整块灰云，压在所有的山上，白天发亮，夜里发黑，梯长这么大只见它破过两回。顶上头有什么，眼睛看不见，可每天头顶上过的是什么，留民心里有数。<\/p>\n<p>今天过的是哑段。<\/p>\n<hr>\n<p>留民认天，靠的是雨。雨从顶上落下来，是暖的，落到谁身上，谁就看见一件事。那件事是上头的人刚丢下的，从那人的眼睛里看出去，带着那人当时的冷热和心跳，一眨眼就化了。上头的人丢东西，跟树掉叶子一样，没个停的时候，所以雨也没个停的时候。只是雨不乱下，它有道。<\/p>\n<p>梯住的这座山，正压在一条道上。这条道上的雨，两千五百多日转回来一回，雨里的人总在数数，总吊在一根绳子底下，又冷又怕，往下看。灯婆管它叫数数雨。同一条道上还有一段，雨稀得差不多没有。它转过来的那些天，顶上沉甸甸的，落下来的却只有零星几滴，都是从过路的飞船上掉的。留民叫它哑段。哑段上头一定有人，灯婆说，人还不少，就是那些人什么都不丢。<\/p>\n<p>往里走，雨就快了。往里走过的人说，走上四十天，有另一条道，那条道上的雨一年转一圈。留民说的\"一年\"，就是它转回来一回。雨里全是尖顶房子，窗户挨着窗户，人挤着人，吆喝着卖东西，空气里一股熬糖的焦香。再往里还有一条，一个月转一圈，雨密得连成了片，住在那底下的人，一辈子看的都是别人的事。<\/p>\n<p>年雨那条道上，有一段雨四千四百多日没停过。它跟着年雨一块儿转，一年回来一回，每回都比年雨晚到几天。留民叫它长雨。长雨下起来那年，梯才三岁。第二年灯婆往里走了四十天，去淋了一回，回来就定了条规矩：凿脉的人，不去淋长雨。那雨里有什么，她从来没说过。<\/p>\n<p>梯还不会走路就被抱出去淋雨。她见过上百个女人俯下脸来看她，见过别人家的饭桌，见过一个男人站在船头，冲着一块越来越小的岸挥手。留民给孩子起名，用的是落地那天雨里看见的头一样东西。灯婆落地那天，雨里有一盏蓝灯。梯落地那天，雨里有个人在爬一道长得望不到头的石阶，一级一级往上，喘得胸口发疼，直到雨化了也没爬到头。<\/p>\n<p>孩子们有个游戏叫猜雨。一场雨下来，大伙冲出去淋，淋完了凑到一块儿，一个说，一个猜。带熬糖味的多半是年雨，有人数数的准是数数雨。最难猜的是旧雨，打老远的地方飘过来，什么也看不清，只觉得心口一凉。梯猜得最准。凭一滴雨的冷热，她就分得出那人是站在船上还是站在地上。上头的地也晃，跟船差不多，就是晃得慢些。<\/p>\n<hr>\n<p>绳是从数数雨底下下来的，那年梯八岁。<\/p>\n<p>这些年，顶每隔七年破一回，回回都破在这座山上头，正是数数雨转到头顶的那几天。灯婆说她小时候不是这样，那时候隔多久没准，破在哪儿也没准。那天顶破了，破开一条长口子，口子里是蓝的，蓝得人膝盖发软。光从口子里斜插下来，落在海上，落在山上。一根线从光里垂下来，线头上吊着一个人，正落在这座塔顶上。<\/p>\n<p>梯那会儿在山北的林子里，跟着大人看脉。大人们扔下锤子往山上跑，她也跟着跑。她爬到半山腰，塔顶上已经站满了人。灯婆站在最前头，手里提着斧子。那人已经解开了身上的皮带子，两只脚踩在石板上，看看灯婆，看看她身后那一群两手沾满蓝粉的人，又扭头去看林子。林子里的脉露着一截，还冒着光。<\/p>\n<p>线在他腰上猛地抽了三下。他慌忙去扣皮带子，才扣上一个，线已经把他往上带起了半人高。<\/p>\n<p>梯记得的是一声响：斧子砍在石板上，当的一下，震得她耳朵里嗡嗡的。那根线往上一弹，缩回光里去了。那人从半空摔回石板上，抱着一条腿。顶慢慢合上了。<\/p>\n<p>打那天起，灯婆的斧子刃口上多了一道缺。她一直用着，没换。<\/p>\n<p>那人在留民中间住了五年。他的腿接歪了，走起路来一边高一边低，留民叫他绳。绳不凿脉。他给凿脉的人挑水，从山脚的泉眼挑到脉边上，一天十几趟，挑了五年，扁担在他肩上磨出一道沟。他没问过灯婆那一斧子，灯婆也没提。两个人在一个火塘边吃了五年饭，说过的话加一块儿，还没有一场雨里的多。<\/p>\n<p>他身上带着一把钩子，铜柄，钩尖淬过火，柄上缠一圈红绳，旧得发了褐。每天傍晚他坐在门口，抓一把灶灰掺上细沙擦那把钩子，擦到亮得能照见人影；第二天落一层露水，傍晚接着擦。梯就蹲在边上看。<\/p>\n<p>他教梯数数。他的数法跟留民数日子不一样，一口气数两下，比喘气还快一倍。他说上头的人下来，就靠这个知道还剩多少工夫。<\/p>\n<p>梯问过他，从上头往下看，下面是什么样子。<\/p>\n<p>\"白的。\"绳说，\"一整片云，什么也看不见。\"<\/p>\n<p>\"那上头的人知道底下有人吗？\"<\/p>\n<p>绳正擦着钩子，手停了一下，又接着擦。\"有人知道。\"<\/p>\n<p>梯又问他上头有没有孩子，绳隔了好一阵才说：\"有一个。\"再问，他就挑水去了。<\/p>\n<p>数数雨两千五百多日才转回来一回。绳每年冬至问灯婆还差多少日，问完就在门框上刻一道。刻到第五道，还差五百多日。<\/p>\n<p>第四十万八千五百一十四日，绳咳了一冬，没熬过去。留民把他埋在塔脚下。临走前他把钩子交给梯，让她下回天开，挂到塔顶上去。<\/p>\n<p>\"挂给谁？\"<\/p>\n<p>\"会有人下来拿。\"<\/p>\n<p>那以后，擦钩子的活儿就归了梯。<\/p>\n<hr>\n<p>脉在山北的林子里，从地底下拱出来一截，有小山那么粗，两头又钻回土里，不知道有多长。它的皮灰白，硬邦邦的，凿开了，里头半透明，泛着淡蓝，光在里面一刻不停地往里流，像春天的树液往树梢上爬。灯婆那辈人找到它的时候，梯的娘还没生下来。打那时起，留民就一直在凿它。<\/p>\n<p>凿脉是重活。凿子往里钉一寸，得十几个人轮着打一上午。大人们站在木架上，一个扶凿，一个抡锤，灯婆起头唱歌。歌就那么几个音，来来回回，唱到每句末尾，所有锤子一齐落下去，重重一顿，整片林子都跟着一跳。梯是在这支歌里睡大的。<\/p>\n<p>凿开的地方，蓝光往外渗，渗进土里。远看，雨道底下的山都是绿的，可留民知道绿只浮在面上：树一年比一年矮，麦穗一年比一年瘪，往下挖一尺，土是灰的，一捏就散。只有蓝光渗过的地方，土是黑的，软的，第二年种什么长什么。脉两边一里宽的地，就是留民的田。<\/p>\n<p>春天天开的前一夜，梯和灯婆在塔顶上守着一堆火，把绳的钩子挂上了木桩。梯摘了一把雨脚白，压在钩柄底下。<\/p>\n<p>火烧到半夜，灯婆往里添柴，梯盯着石板上新凿的那幅画看。<\/p>\n<p>\"灯婆，线上头那些圆的，是什么？\"<\/p>\n<p>\"上头的。\"<\/p>\n<p>\"上头的人看得懂吗？\"<\/p>\n<p>\"有人看得懂。\"灯婆说，\"早先有人画过一样的。\"<\/p>\n<p>梯想了一会儿，又问：\"我们要是凿到底了，会怎么样？\"<\/p>\n<p>灯婆拿根树枝拨火，拨起一串火星，往上飘，飘到顶底下就看不见了。<\/p>\n<p>\"地会软。\"她说。<\/p>\n<p>天亮前灯婆下山，临走说：\"天开了，你躲在藤后头，别出来。\"又说，\"我们接着凿。让他听见。\"<\/p>\n<p>第四十万九千零二十六日，过了晌午，顶又破了。<\/p>\n<p>这一回梯十五岁。她蹲在塔顶东边的藤后面，从叶缝里看着那道口子一点点拉开，蓝从里头漏下来，漏到海上，海亮得睁不开眼。她开始数，照绳教的，一口气两下。数到四百多，一根线从光里垂了下来。<\/p>\n<p>线上吊着一个人。他的靴子停在石板上方一寸，停了好半天，才往下一沉，落了地。梯看清他的脸，气都不敢出。那张脸跟绳一个样，只是年轻，腿是直的。<\/p>\n<p>他朝木桩走过去，腿直打颤。走到桩跟前，他没伸手，就那么站着，雨落了他一肩膀。他蹲下去看她凿的那幅画，蹲着半天没动。山北的林子里，灯婆的歌隔着树传过来，每句末尾重重一顿。<\/p>\n<p>线在他腰上抽了三下。<\/p>\n<p>他站起来，摘下钩子攥在手里，从自己腰上解下一把短刀，挂上木桩。又掏出一只铜罐，接满了雨，封好。线把他拽起来的时候，他回头看了一眼塔顶，眼睛从藤上扫过去，没有停。<\/p>\n<p>梯数到一千七百九十，顶合上了。<\/p>\n<p>那天落在她身上的雨有好几滴，她记住了一滴。<\/p>\n<p>她很小，坐在谁的膝盖上，两只手捧着一只杯子。铜杯，旧了，杯口一道裂，裂缝里补着银，像旱地上裂开的口子灌满了亮水。杯里的茶是苦的，咽下去又回甜，有一股果皮味，她从来没尝过。头顶上有个女人在哼歌，每一句都跑调，回回跑在同一个地方，跑得不慌不忙。<\/p>\n<p>那一滴化了，她在藤后头一直蹲到天黑。<\/p>\n<p>打那以后，她常梦见这只杯子，梦里的歌跟雨里一样，一句一跑。她挑水的时候一不留神哼了出来，脉上的大人听了直乐，说梯把凿歌唱坏了。灯婆没笑，问她是哪场雨里听来的，她说天开那天。灯婆点点头，过了一会儿才说，那是上头的人哄孩子的歌。<\/p>\n<p>木桩上那把刀，梯摘了下来，一直带在身上。刀比她见过的哪一把都好，刃上一层水纹，柄上的皮磨得发亮，握上去是一个大人的手形。<\/p>\n<p>夏天傍晚，她坐在门口，抓一把灶灰掺上细沙擦那把刀，擦完了对着天光照。灯婆从脉上回来，在她边上站住，看了一眼刀，又看了一眼她的手。<\/p>\n<p>\"他长得像绳？\"<\/p>\n<p>\"像。\"<\/p>\n<p>\"他看见你没有？\"<\/p>\n<p>\"没有。\"<\/p>\n<p>灯婆嗯了一声，进屋去了。梯听见她在里头把斧子靠到墙角，靠得很轻，跟平常不一样。那一夜灯婆屋里的火一直没熄。<\/p>\n<hr>\n<p>入冬以后雨就少了，冬天总这样。哑段从外头那边一天天转过来，灯婆掐着日子算，它要在第四十万九千二百六十几日前后过山顶。<\/p>\n<p>上个月，西段的凿口凿穿了一层。那天蓝光往外涌，涌了大半个下午，林子里的雾都成了蓝的。灯婆让人宰了两头羊，凿脉的人围着凿口吃到半夜。梯记事以来，从没凿得这么深过。<\/p>\n<p>第四十万九千二百六十三日，哑段底下下雨了。<\/p>\n<p>起先只有几滴。梯淋到的一滴里，有人在码头上把一个孩子往船上推；另一滴里是一盏本该发蓝的灯，灰扑扑的，看着看着又暗了一层。往后几天，雨一天比一天密，哑段底下从来没下过这么多雨。雨里全是忙乱，船来了又走，有人在空中一遍又一遍画同一个记号，画到嘴唇发青。有一滴落在梯的后脖颈上，她脚底下的地猛地往下一坐，她伸手去扶，扶了个空。雨化了，脚底下还是山。<\/p>\n<p>灯婆站在山顶上看顶，从早上站到天黑，饭端上去也没动。<\/p>\n<p>第四十万九千二百七十日夜里，灯婆把人全叫起来，让住在北边河谷里的几户连夜搬上山。有人问为什么，灯婆说：\"要下来了。\"就再没人问了。<\/p>\n<hr>\n<p>第二天过了晌午，梯还守在塔上。头顶的灰云有一块暗了。起先只有巴掌大，像雨季里土墙上洇开的水印，往四面洇，洇到小半个顶都发了黑。黑的正当中透出一点蓝，隔着云，一明一灭。<\/p>\n<p>声音最先到。它从顶上压下来，又低又长，梯先是脚底板觉出来，后来是牙。那声音像一棵千年的老树叫人连根往外拔，根须在土里一根接一根地断。林子里的鸟全飞了起来，又不知道往哪儿飞，在树梢上打转。山坡上，从河谷搬上来的人家站在昨夜搭的草棚外头，一个孩子仰着脸喊顶要塌了，他娘把他的脑袋按进怀里，自己也仰着脸。<\/p>\n<p>顶鼓起一个包，往下坠，坠成一个越来越尖的口袋。口袋破了，先出来一个尖，黑的，朝下指着，从云里慢慢探出来。尖上还有一点蓝，一闪，暗下去，又一闪。<\/p>\n<p>跟着尖下来的是它的身子。梯先当那是一座山，后来才看出来是座倒过来的山：底下尖，越往上越宽，顶上平平的一大片，比她脚下这座山还宽。它四壁全是洞，大大小小，一层压一层，洞口往外淌着碎石和土。它把顶扯开了，口子边上的云跟着往下塌，像泡软的河岸一块块塌进水里。<\/p>\n<p>口子里是蓝的。这是梯今年第二回看见天。<\/p>\n<p>它下来得慢，慢得梯以为它会在半空里停一停，再往下一沉，那根线吊着的人当年就是这样。它没停。下到半道，它侧过身，平的那一面歪向西边，上头有房子，有路，一排一排的东西被甩了出去，落得比它还快。北边林子里一阵接一阵地响，像夏天头一场冰雹，只是每一颗都有屋子大。<\/p>\n<p>它落进了北边的河谷。<\/p>\n<p>地往上一跳。梯被颠了起来，膝盖磕在石板上。塔身里的石头哗哗往下掉，木桩歪了，雨脚白撒了一地。一阵风从北边推过来，所有的树一齐朝南弯下腰，好半天才直起来。<\/p>\n<p>河谷里腾起一片灰，灰底下透着蓝，蓝光从灰里往外漫，漫过河，漫上两边的山坡，一层一层往外推。推到梯脚下已经淡了，只剩薄薄一层，从她脚面上流过去，凉的，钻进土里不见了。<\/p>\n<p>四下里静了下来，静得听得见藤叶上滴水。接着，雨来了。<\/p>\n<hr>\n<p>这一场雨，跟梯这辈子淋过的哪一场都不一样。它重。头一滴落在她手背上，就按在那儿不走了。第二滴、第三滴跟着来，来不及化，一滴压一滴，梯在雨里站不住，跪了下去。<\/p>\n<p>她在一条黑坑道里，手里攥着凿子。手不是她的，又宽又厚，皮上有石头的纹路。凿子落下去的样子她认得，跟脉上的大人一模一样。坑道墙上嵌着灯，灯是灰的。<\/p>\n<p>她在往一面墙上贴纸。墙上已经贴满了，一张压一张，纸黄了，卷了边，上面是又大又笨的字。她手里这张字不多，落笔太重，纸都快戳透了。她不认得字，那只手认得。<\/p>\n<p>她坐在一间圆屋里，屋子正当中嵌着一块蓝石头，发着暗光。她老了，老得手都抬不起来，闭着眼哼一支歌。几个音，来来回回，每句末尾重重一顿。梯在雨里张开嘴，跟着那老人哼，哼到那一顿，嗓子一噎。这歌是从上头唱下来的，从一个她从没见过的老人嘴里，一个音也没错。老人闭着的眼睛里有个梦，梦里下着暖雨，满眼是绿，远处好多人一边干活一边唱，唱的就是这个。梦里有个声音在叫她回去，叫了她一辈子。<\/p>\n<p>她站在码头上，身子重得把木板踩得直响。船一条接一条地走，船上的人冲她摆手，说石胎等下一趟。她就等着，看着最后一条船的帆越来越小，脚底下的码头一寸一寸往下沉。<\/p>\n<p>还有好多。一个男人拿肩膀扛着一根木梁，让别人从他身子底下爬过去；一个孩子蹲在地上数石子，数一颗，抬头看一眼大人；一个女人给另一个女人梳头，梳子卡在头发里的石屑上；一个老头坐在井口，把一封信叠了又叠。哑段在顶上转了不知多少年，一滴都没舍得落，今天全落下来了。<\/p>\n<p>雨里掉下来一只鸟，砸在梯脚边的泥里。白的，翅膀长得出奇，浑身湿透，一只翅膀拖在地上，胸口一起一伏。这种鸟她在雨里见过，在尖顶中间飞来飞去，替人送东西。鸟腿上绑着一截铜管，脚环上烫着一个金色的记号。梯把它捡起来揣进怀里，它在她胸口直哆嗦，是暖的。<\/p>\n<p>她从塔顶往下看。半山坡上，留民全站在雨里，没一个往屋里躲。灯婆站在最前头，脸朝着顶，雨顺着她的脸往下淌。凿脉的人不淋长雨，这规矩是她定的。这一场，她没躲。<\/p>\n<p>雨下到天黑，小了，可一直没停。<\/p>\n<p>梯在塔顶上坐着，没下去。一滴化了，下一滴又来，她身上一阵接一阵地疼，疼在别人疼的地方：有时在肩膀上，那是扛木梁的；有时在嗓子眼底下，那是码头上等船的。她分不清哪一阵是哪一个，就由它们疼去。<\/p>\n<p>夜里，灯婆上了塔。三百一十一级她爬得慢，到了顶上坐下，等气喘匀。两个人都湿透了，谁也没去生火。<\/p>\n<p>\"长雨里，\"灯婆说，\"也是这样。\"<\/p>\n<p>梯等她往下说，灯婆没再说。她把手搁在石板那道直槽上，一直搁着，没拿开。雨落在她手背上，积成一小汪，顺着那道槽往桩脚流。<\/p>\n<hr>\n<p>第二天天刚亮，梯坐在塔顶上，把那只鸟从怀里掏出来。它活过来了，歪着脑袋看她，眼睛是一粒黑亮的籽。她用短刀挑开铜管上的绳结，抽出一张纸。纸湿过又干了，皱巴巴的，上面有字，一行半，末尾压着一方金印。她一个字也不认得，翻过来看，背面是空的。<\/p>\n<p>她割了一朵雨脚白，跟那张纸卷在一起，塞回铜管，系好。<\/p>\n<p>鸟在她手心里站着，不肯走。她把手往上一送，它扑腾两下，往下掉，又扑腾，翅膀总算张开了，一下一下往上够，越来越小，钻进灰里不见了。梯仰着脖子看那块灰，看到脖子发酸，也没看出它是从哪儿钻进去的。<\/p>\n<p>她下了塔。三百一十一级，一级一级往下走，膝盖上昨天磕的那块疼得发胀。走到底，她在绳的坟前站了一会儿，往北去了。<\/p>\n<p>北边的河谷绿了。冬天的河谷，前天还是灰的，一夜工夫草长到了脚踝，枯了一冬的树枝上爆出了芽。绿从那座倒插的山脚底下往外铺，一直铺到两边坡上，越往外越淡。那座山斜插在河谷当中，尖扎进土里不知道多深，平的那面朝着顶，歪着，四壁的洞口一层压一层，有的还在往外淌水。它身上的雨没停，细细的，暖的，从它头顶那一小块天里落下来。<\/p>\n<p>留民都来了，站在坡上看那一片绿。有人笑出了声，又赶紧捂住嘴。<\/p>\n<p>靠得最近的几个人说，石头里头有声音。<\/p>\n<p>灯婆走过去，梯跟在后头。石壁是凉的，湿的，梯把耳朵贴上去，半天什么也没有。后来里头响了一下，闷闷的，隔着不知道多厚的石头。又一下。不快不慢，响几下，就重重一顿。<\/p>\n<p>梯抬头看灯婆。灯婆也在听，脸贴着石头，闭着眼。听完了，她退后一步，低头看手里那把斧子，看刃口上那道缺。<\/p>\n<p>\"拿锤子来。\"<\/p>\n<p>那天早上，没有一个人往脉那边去。<\/p>\n<p>大人们在石壁底下搭起木架，一个扶凿，一个抡锤。梯也分到一把锤。这把锤她抡了三年，早抡惯了，今天举过头顶，胳膊却往下一坠，差点没举住。<\/p>\n<p>灯婆起了头。还是那几个音，来来回回。第一句唱到末尾，所有锤子一齐落下去，重重一顿。<\/p>\n<p>石头深处隔了一口气，也重重地应了一声，正落在那一顿上。<\/p>"}], "world": {"guide": "<h2>岛在天上<\/h2>\n<p>一千一百多年前的某一夜，大地裂成了上千块，一块一块浮上了天。为什么会这样，到今天也没人说得清。后来的人从那一夜开始数年份，叫升历。这本书里的故事，都发生在升历一一三七年。<\/p>\n<p>现在大家都住在这些浮着的岛上。大的像琥珀城，从城东走到城西要大半天，一千零三座尖塔，橙红的屋顶一直铺到岛边上；小的像空带里的一人石，只够一个人躺下，翻身翻猛了会掉下去。<\/p>\n<p>站在岛边往下看，是白茫茫一片云，叫云海，一年到头不散。<\/p>\n<h2>云底下有什么<\/h2>\n<p>云海很厚，底下一层整天打雷，叫灰层。再往下，是当年没飞起来、留在原地的大地和海，叫渊。<\/p>\n<p>几乎没人下去过，律法也不许，守衡院的规矩第一条就是：任何人不得着地。只有一伙人偏要往下跑，叫沉渊者。他们从船上放几千丈长的绳子，吊着人下去，从刺出灰层的山尖上捞些老东西上来卖。<\/p>\n<p>每隔几年，云海会裂开一道口子，从口子里能直接看见下面的海和陆地，那一天叫开云日。沉渊者等开云日，像渔民等鱼汛。<\/p>\n<h2>正中间那场风暴<\/h2>\n<p>天空正中有一场刮了一千年的风暴，叫涡眼。远远看过去，是一根顶天立地的白柱子，慢慢地拧。<\/p>\n<p>风暴中心反倒是静的，那里有全天下唯一一座不动的岛，叫涡城，城里立着一座白塔，叫衡塔。管着整片天空的守衡院就在塔里。守衡院的长老大多什么都不记得了，靠读自己从前写下的东西办事。<\/p>\n<p>进涡眼只有一条路。云墙每七天喘一口气，墙最薄的那一刻，有人在墙里凝出一条窄窄的云道，叫风隙。走得慢了，墙一合上，就出不去了。<\/p>\n<h2>一年有多长<\/h2>\n<p>所有的岛都绕着涡眼转，像水沟里打旋的落叶，靠里的转得快，靠外的转得慢：<\/p>\n<ul><li>最里一圈叫内环，一个月转一圈，岛高，人少，大多是守衡院的人。<\/li><li>中间叫中环，正好一年转一圈，最热闹，琥珀城、粟城都在这里。<\/li><li>外面叫外环，七年才转一圈，都是矿岛、穷岛，沉渊者的老窝灰脊也在这儿。<\/li><li>再往外的岛被风甩了出去，没了轨道，叫散岛，没人管。<\/li><\/ul>\n<p>\"一年\"就是照琥珀城转一圈定的。所以外环人说自己\"活了九巡\"，意思是六十三岁；内环的债主在借据上写\"年息一分\"，中环人得先问一句：你说的是哪个年？<\/p>\n<p>邻居也一直在换，今年隔壁是这座岛，明年就转走了。两座岛靠近到能搭桥的那几天叫会合，是天上最热闹的日子：嫁人、分家、打官司、做买卖，全挤在这几天办，错过了，下一回也许要等三十七年。<\/p>\n<h2>会让人忘事的魔法<\/h2>\n<p>天上流着一种看不见的气，叫苍息，岛就是靠它浮着的。有些人能把它吸进身体里用：让自己变轻、飞起来，把云捏成能走的路，推着船跑，或者听见几百里外有人说话。这样的人叫息术师。<\/p>\n<p>代价是，每用一口，人就轻一点，也忘掉一点。先忘的是不打紧的事，比如哪年米卖多少钱；用多了，就轮到要紧的，比如母亲长什么样。用到最后，有一天早上醒来，整个人会飘起来，往天顶上去，再也回不来，这叫升逝。用得太多的人嘴唇发青，一眼就看得出来。<\/p>\n<p>所以息术师身上都揣着一样旧东西，施术的时候攥在手里，能少忘一点，叫坠石。不一定是石头：伊璃的坠石是一只摔裂过、又用银补好的铜杯。他们还天天写记书，把怕忘的事写下来。可是读自己写的记书，就像读别人的事：你知道了，但你不记得。<\/p>\n<p>雇息术师要付\"借息钱\"。粟城的息市有一面挂牌墙，每个息术师占一行：用过多少口，每口多少钱。用得越多的越贵，因为他们每一口付出去的，都是更舍不得的东西。<\/p>\n<h2>三种人<\/h2>\n<p>垣民就是普通人，人数最多。大多数垣民一辈子不碰苍息，所以什么都记得，好事坏事都背着。<\/p>\n<p>风裔耳朵长，骨头轻，头发颜色浅，能活三百年。他们天生会用苍息，也天生会忘。风裔见面不问\"你多大了\"，问\"你写到第几册了\"。老了以后什么都不记得，族人像照顾孩子一样照顾他们，最后挑两座岛会合的日子，把他们放到风里送走，叫放风。<\/p>\n<p>石胎又矮又宽，重得出奇，皮肤像石头，生在岛根底下的矿洞里。他们一口苍息也用不了，可一辈子不忘一件事。船上遇到风暴，石胎蹲下来把手按在甲板上，船就稳了，这活儿叫压舱。不少人叫他们\"沉物\"，内环的码头上还挂着牌子：石胎止步，承重有限。<\/p>\n<h2>天上的人怎么过日子<\/h2>\n<p>琥珀城的小孩出门，腰上系一根风绳，另一头拴在家门口的铁环上，免得刮大风被吹跑。十二岁那天解绳，家里要摆酒。<\/p>\n<p>城里的钟从东往西，一座塔传一座塔地敲，传到最西头要小半刻。所以东城和西城永远差着小半刻，有个小扒手就专靠这小半刻吃饭。<\/p>\n<p>送信靠信鹭，一种白羽长翅膀的鸟，靠听风认路，能飞过七百里没有一座岛的空带，也能等风隙开了飞进涡眼。这本书每一篇里都有一只。<\/p>\n<p>外环有几座岛靠杀云鲸过活。云鲸几十丈长，夜里浮到云面上，吃一种发蓝光的小东西，叫息萤，唱的歌几百里外都听得见。鲸油运到中环点灯，琥珀城的人点了一辈子，也不知道灯油是从哪头鲸身上来的。<\/p>\n<h2>这几年不太对劲<\/h2>\n<p>托着岛的浮晶，光一年比一年暗，领航师管这个叫褪光。岛跟着一年比一年矮。外环矿洞里的石胎给守衡院写了一封又一封信，一封回音也没有。<\/p>\n<p>十二年前，中环的栖霞岛掉了下去，守衡院说是意外。<\/p>\n<p>故事从这一年春天开始。<\/p>", "words": "<blockquote><p>给读者查的，不剧透。哪个词读不懂，来这里找。完整设定（含秘密）在世界集里，读完全书再看。<\/p><\/blockquote>\n<hr>\n<h2>词语<\/h2>\n<div class=\"tbl\"><table><thead><tr><th>词<\/th><th>意思<\/th><th>第一次出现<\/th><\/tr><\/thead><tbody><tr><td>苍息<\/td><td>天上看不见的气，托着岛，也是息术的来源<\/td><td>序章<\/td><\/tr><tr><td>浮晶<\/td><td>苍息在岛根里结成的晶体，岛靠它浮着；也做成灯<\/td><td>第 1 篇<\/td><\/tr><tr><td>息术 / 息术师<\/td><td>魔法 / 会魔法的人。分五门：抬、凝、驭、听、镇<\/td><td>序章<\/td><\/tr><tr><td>云纹<\/td><td>施术时用手指在空中描的图案，如抬纹、驭纹、听纹<\/td><td>第 1 篇<\/td><\/tr><tr><td>青唇<\/td><td>用息术太多，嘴唇发青<\/td><td>第 1 篇<\/td><\/tr><tr><td>轻化 / 升逝<\/td><td>用息术后变轻并遗忘 / 轻到飘走，飞向天顶<\/td><td>序章<\/td><\/tr><tr><td>坠石<\/td><td>息术师随身攥着的旧物，能让人少忘一点（不一定是石头）<\/td><td>第 1 篇<\/td><\/tr><tr><td>记书<\/td><td>记录记忆的本子。读它只能\"知道\"，不能\"记得\"<\/td><td>第 1 篇<\/td><\/tr><tr><td>借息钱<\/td><td>雇息术师的钱。用息越多的人越贵，叫\"老息贵\"<\/td><td>第 1 篇<\/td><\/tr><tr><td>驭风师<\/td><td>驾风推船的息术师<\/td><td>第 1 篇<\/td><\/tr><tr><td>压舱人<\/td><td>船上按着甲板和驭风师、帮船稳住的石胎<\/td><td>第 2 篇<\/td><\/tr><tr><td>信鹭 / 信鹭驿<\/td><td>送信的白色长翼鸟 / 管送信的行会<\/td><td>序章<\/td><\/tr><tr><td>沉渊者<\/td><td>放绳子下到云海里打捞旧物的人，大本营在灰脊<\/td><td>第 1 篇<\/td><\/tr><tr><td>开云日<\/td><td>云海裂开、能望见渊的日子，几年才有一次<\/td><td>第 1 篇<\/td><\/tr><tr><td>着地<\/td><td>双脚踩到渊的土地上，律法禁止<\/td><td>第 2 篇<\/td><\/tr><tr><td>守衡院 / 大衡<\/td><td>管整个天空的机构 / 它的首领<\/td><td>第 2 篇<\/td><\/tr><tr><td>风隙<\/td><td>穿过涡眼风墙的唯一通道，七天开一次<\/td><td>第 4 篇<\/td><\/tr><tr><td>领航师 / 航务塔<\/td><td>计算岛的轨道的人 / 他们工作的塔（琥珀城第一塔）<\/td><td>第 3 篇<\/td><\/tr><tr><td>正衡<\/td><td>琥珀城一年的起点，正午看见衡塔正在北方的那一刻<\/td><td>第 3 篇<\/td><\/tr><tr><td>褪光<\/td><td>浮晶的光在变暗，岛跟着下沉<\/td><td>第 1、6 篇<\/td><\/tr><tr><td>会合 / 会合契<\/td><td>两岛靠近 / 只能在会合时当面签的契约<\/td><td>第 9 篇<\/td><\/tr><tr><td>钟浪<\/td><td>琥珀城的钟从东往西一座传一座地敲，两头差小半刻<\/td><td>第 9 篇<\/td><\/tr><tr><td>风绳<\/td><td>孩子系在腰上、拴在门口铁环上的绳子，免得被风吹走<\/td><td>第 3 篇<\/td><\/tr><tr><td>放风<\/td><td>风裔老人升逝时的送别仪式<\/td><td>第 5 篇<\/td><\/tr><tr><td>轻教 / 白衣 / 白岛<\/td><td>相信\"忘即赦\"的教派 / 它的信徒 / 他们聚居、年年变轻上浮的岛<\/td><td>第 7 篇<\/td><\/tr><tr><td>听风台 / 听者<\/td><td>用\"听\"门息术远距离传话的台站 / 在台上听的人<\/td><td>第 10 篇<\/td><\/tr><tr><td>白页<\/td><td>守衡院大书里故意留空的页：这里有事，不该问<\/td><td>第 4 篇<\/td><\/tr><tr><td>云鲸 / 息萤<\/td><td>在云海上游的巨鲸 / 夜里浮在云海上发蓝光的小光点，鲸吃它<\/td><td>第 1、11 篇<\/td><\/tr><tr><td>渊梦 / 凿歌<\/td><td>所有石胎都做的同一个梦 / 梦里那首每句末尾重重一顿的歌<\/td><td>第 6 篇<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2>大事年表<\/h2>\n<div class=\"tbl\"><table><thead><tr><th>升历<\/th><th>事<\/th><\/tr><\/thead><tbody><tr><td>元年<\/td><td>大升腾<\/td><\/tr><tr><td>213<\/td><td>\"锚定\"：岛进入天轨，守衡院成立<\/td><\/tr><tr><td>400 前后<\/td><td>琥珀城兴起，千塔陆续建成<\/td><\/tr><tr><td>612<\/td><td>沉默之年：石胎一整年不下矿<\/td><\/tr><tr><td>1101<\/td><td>轻教创立<\/td><\/tr><tr><td>1125 秋<\/td><td>栖霞岛坠落（第 8 篇）<\/td><\/tr><tr><td>1130<\/td><td>开云日，沈渡的父亲下潜未归<\/td><\/tr><tr><td>1131<\/td><td>外环首次报告褪光<\/td><\/tr><tr><td>1137 春末<\/td><td>七年来第一个开云日（第 2 篇）<\/td><\/tr><tr><td>1137 秋<\/td><td>琥珀城与霞群三     layer(ctx, g => { ridge(g, N, { y: 690, amp: 140, f: .003, grad: [[0, "#7FA081"], [1, "#4D6A4B"]], off: 3 }); }, { fog: ["#C2CCC4", 560, 780, .6, .2] });
    const vg = ctx.createRadialGradient(820, 780, 20, 820, 780, 420); vg.addColorStop(0, css("#C8F28E", .85)); vg.addColorStop(1, css("#6FA65A", 0));
    ridge(ctx, N, { y: 780, amp: 90, f: .004, grad: [[0, "#5E8E4E"], [1, "#2F4E2B"]], off: 7, tex: ["#1E3420", "#9CC27E", .25, .02] });
    ctx.fillStyle = vg; ctx.fillRect(400, 640, 840, 260);
    ctx.strokeStyle = css("#B9D8E6", .7); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(1600, 820); ctx.bezierCurveTo(1300, 860, 1060, 800, 900, 850); ctx.stroke();
    const hill = new Path2D(); hill.moveTo(-10, 910); hill.lineTo(-10, 600); hill.bezierCurveTo(120, 560, 220, 540, 300, 556); hill.bezierCurveTo(370, 572, 430, 660, 480, 910); hill.closePath(); ctx.fillStyle = vgrad(ctx, 540, 900, [[0, "#4E7A44"], [1, "#203820"]]); ctx.fill(hill); ctx.save(); ctx.clip(hill); rockTex(ctx, N, [-10, 540, 490, 370], "#142414", "#8CB872", .25, .02); ctx.restore();
    const tw = new Path2D(); tw.moveTo(208, 560); tw.lineTo(212, 446); tw.lineTo(226, 440); tw.lineTo(240, 452); tw.lineTo(256, 438); tw.lineTo(276, 446); tw.lineTo(280, 560); tw.closePath(); ctx.fillStyle = hgrad(ctx, 208, 280, [[0, "#A59D90"], [1, "#4E4840"]]); ctx.fill(tw); ctx.save(); ctx.clip(tw); rockTex(ctx, N, [200, 430, 90, 140], "#2A2622", "#E2DACB", .45, .05); ctx.restore();
    figure(ctx, "stand", 236, 440, .85, "#1E2A20", ["#E6F2DE", -1]);
    ctx.strokeStyle = "#5B4A3A"; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(262, 440); ctx.lineTo(262, 414); ctx.stroke(); [[262, 412], [267, 416], [258, 416]].forEach(([x, y]) => { ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(x, y, 3, 0, TAU); ctx.fill(); });
    ctx.lineCap = "round";
    for (let i = 0; i < 900; i++) { const x = R(r, -100, 1650), y = R(r, 150, 900), l = R(r, 14, 34), gold = i % 41 === 0; ctx.strokeStyle = gold ? css("#FFC879", .95) : css("#DDE7EE", R(r, .18, .45)); ctx.lineWidth = gold ? 2.2 : 1; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - l * .2, y + l); ctx.stroke(); if (gold) glow(ctx, x - l * .1, y + l * .5, 16, "#FFC879", .6); }
    finish(ctx, { bloom: .3, vig: .3, vigCol: "#1A2228" });
  };

  /* ------------------------------------------------ 绘制调度：按需、可见时才画、画过的缓存起来 */
  const cache = new Map();
  function render(n, w) {
    const key = n + "@" + w; if (cache.has(key)) return cache.get(key);
    const c = newCanvas(w, Math.round(w * H0 / W0)), ctx = c.getContext("2d");
    ctx.setTransform(w / W0, 0, 0, w / W0, 0, 0);
    try { S[n](ctx); } catch (e) { console.error("插画绘制出错", n, e); }
    cache.set(key, c); return c;
  }
  const queue = []; let busy = false;
  function pump() {
    if (busy || !queue.length) return; busy = true;
    const el = queue.shift();
    setTimeout(() => {
      if (el.isConnected && !el.dataset.done) {
        const want = Math.min(1600, Math.max(400, Math.ceil(el.getBoundingClientRect().width * Math.min(2, window.devicePixelRatio || 1))));
        const w = want > 1100 ? 1600 : want > 700 ? 1000 : 640;
        const src = render(+el.dataset.n, w);
        el.width = src.width; el.height = src.height; el.getContext("2d").drawImage(src, 0, 0); el.dataset.done = "1"; el.classList.add("painted");
      }
      busy = false; pump();
    }, 16);
  }
  const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); queue.push(e.target); pump(); } }), { rootMargin: "300px" }) : null;
  function mount(root = document) { root.querySelectorAll("canvas.art:not([data-seen])").forEach(c => { c.dataset.seen = "1"; if (io) io.observe(c); else { queue.push(c); pump(); } }); }
  new MutationObserver(() => mount()).observe(document.documentElement, { childList: true, subtree: true });

  function scene(n) {
    const t = typeof STORIES !== "undefined" && STORIES[n] ? STORIES[n].title : "";
    return `<canvas class="art" data-n="${n}" width="160" height="90" role="img" aria-label="${t}插画"></canvas>`;
  }

  /* 人物印章（不变） */
  function seal(name, race) {
    const c = RACE[race] || RACE["垣民"], ch = name[0];
    return `<svg viewBox="0 0 96 96" role="img" aria-label="${name}"><circle cx="48" cy="48" r="46" fill="${c.c}"/><circle cx="48" cy="48" r="40" fill="none" stroke="#fff" stroke-width="1.5" opacity=".7"/>
      <text x="48" y="52" text-anchor="middle" dominant-baseline="middle" font-family="Kaiti SC,STKaiti,KaiTi,serif" font-size="46" fill="#fff">${ch}</text>
      <text x="48" y="84" text-anchor="middle" font-family="Songti SC,serif" font-size="10" fill="#fff" opacity=".9">${race}</text></svg>`;
  }
  return { scene, seal, mount, render };
})();

</script>

<script>
/* ================================================================ map */

  // islands: id, name, r, a0 (deg at day 0), T (days), size, kind, label size
  const ISL = [

    if(kind==="city") for(let i=-3;i<=3;i++) el("path",{d:`M${i*s*.24-1.6} ${-s*.1} L${i*s*.24} ${-s*.1-s*(.5+.3*((i+5)%3))} L${i*s*.24+1.6} ${-s*.1}Z`, fill:"#C9773A"}, g);
  }

  function build(){
    svg.innerHTML = "";
    const defs = el("defs");

    el("rect",{x:-560,y:-520,width:1120,height:1040,filter:"url(#mCloud)",opacity:.9});
    const bands = [[RING.inner,"内环，三十日一周"],[RING.mid,"中环，一年一周"],[RING.outer,"外环，七年一周"]];
    bands.forEach(([[a,b]])=>{ el("circle",{r:(a+b)/2, fill:"none", stroke:"#fff", "stroke-width":b-a, opacity:.42}); });
    [RING.inner[0],RING.inner[1],RING.mid[0],RING.mid[1],RING.outer[0],RING.outer[1]].forEach(r=>el("circle",{r, fill:"none", stroke:"#9FBCD6", "stroke-width":.8}));
    el("circle",{r:RING.nine, fill:"none", stroke:"#8EA9C2", "stroke-dasharray":"5 7", "stroke-width":1});
    const zl = [[-(RING.inner[0]+RING.inner[1])/2+5,"内环"],[-(RING.gap[0]+RING.gap[1])/2+5,"空带"],[-(RING.mid[0]+RING.mid[1])/2+5,"中环"],[-(RING.wild[0]+RING.wild[1])/2+5,"荒带"],[-(RING.outer[0]+RING.outer[1])/2+5,"外环"],[-RING.nine-6,"九年线"]];
    zl.forEach(([y,t])=>{const n=el("text",{x:0,y,"text-anchor":"middle",class:"zone"}); n.textContent=t;});
    const sz = el("text",{x:-500,y:-470,class:"zone"}); sz.textContent="散岛";

    for(let i=0;i<7;i++){ const r1=18+i*5.5; el("path",{d:`M${r1} 0 A${r1} ${r1} 0 0 1 ${-r1*.7} ${r1*.7}`, stroke:"#fff", "stroke-width":3.2, fill:"none", opacity:.85, transform:`rotate(${i*51})`}, eye); }
    el("path",{d:"M-4 4 L0 -16 L4 4Z", fill:"#fff", stroke:"#2F5D8A", "stroke-width":.8});
    const eyel = el("text",{x:0,y:24,"text-anchor":"middle",class:"lbl"}); eyel.textContent="涡城";
    // islands layer
    const lay = el("g",{id:"isl"});
    const rnd = mul(42);
    const deco = [];
    const decoRing = (n,[a,b],T,kind,s0,s1) => {for(let i=0;i<n;i++) deco.push({r:a+rnd()*(b-a), a0:rnd()*360, T:T*(.92+rnd()*.16), s:s0+rnd()*(s1-s0), k:kind});};
    decoRing(14,RING.inner,30,"pale",2.5,4.5); decoRing(42,RING.mid,360,"town",2,5); decoRing(6,RING.gap,140,"rock",1.4,2.2);
    decoRing(10,RING.wild,1200,"rock",1.4,2.6); decoRing(52,RING.outer,2520,"rock",2,4.5); decoRing(14,[372,500],9000,"rock",1.6,3.2);
    deco.forEach(d=>{ d.g = el("g",{},lay); glyph(d.g,d.s,d.k); });

  function pos(){

  }

  function loop(ts){
    if(!last) last = ts; const dt = Math.min(.1,(ts-last)/1000); last = ts;

  function list(){
    $("#panel").innerHTML = `<h2>十二个故事</h2><p class="hint">点一篇，看它发生在哪儿。</p>
      <ol class="slist">${STORIES.slice(1).map(s=>`<li><button data-n="${s.n}"><span class="num">${s.n}</span><span><span class="t">${s.title}</span><span class="p">${s.place}</span></span></button></li>`).join("")}</ol>`;
    $("#panel").querySelectorAll(".slist button").forEach(b=>{ const n=+b.dataset.n; b.onclick=()=>select(n); b.onmouseenter=()=>hl(n,true); b.onmouseleave=()=>hl(n,false); });

  function select(n){
    if(sel) MAP.mk[sel].classList.remove("sel");

      <dl><dt>在哪儿</dt><dd>${s.place}</dd><dt>谁的故事</dt><dd>${s.pov}</dd><dt>什么时候</dt><dd>${s.season}</dd></dl>
      <p class="hook">${s.hook}</p>
      <a class="btn" href="#read/${n}">开始读</a><button class="btn ghost" id="back">返回</button></div>`;
    $("#back").onclick = () => { MAP.mk[sel].classList.remove("sel"); sel=null; list(); };
  }

  function init(){
    build();
    pos(); list();
    const pb=$("#play"), fb=$("#fast");
    const sync=()=>{pb.textContent=playing?"暂停":"继续"; pb.setAttribute("aria-pressed",String(!playing)); fb.setAttribute("aria-pressed",String(fast));};
    pb.onclick=()=>{playing=!playing; sync();}; fb.onclick=()=>{fast=!fast; if(fast) playing=true; sync();};
    sync(); requestAnimationFrame(loop);
    setInterval(()=>store.set("day",Math.floor(day)),5000);
  }
  return {init, select};
})();
</script>

<script>
/* ================================================================ app */
const CH = BOOK ? BOOK.chapters : [];
function seasonOf(meta){ const m = meta.match(/升历\s*(\d+)\s*年\s*·\s*(.+)$/); return m ? `升历${cnYear(+m[1])}年，${m[2]}` : meta; }

function renderTOC(){
  $("#toc").innerHTML = CH.map((c,i)=>`<li><a href="#read/${i}" data-i="${i}"><span class="n">${i===0?"序":i}</span><span><span class="t">${c.title}</span><span class="p">${STORIES[i]?STORIES[i].place:""}</span></span></a></li>`).join("");
  $("#tocsel").innerHTML = CH.map((c,i)=>`<option value="${i}">${i===0?"序章":i+"　"+c.title}</option>`).join("");
  $("#tocsel").onchange = e => location.hash = "#read/"+e.target.value;
}
let curCh = null, saveT = null;
function readChapter(i){
  i = Math.max(0, Math.min(CH.length-1, i|0));
  const c = CH[i], s = STORIES[i] || {};
  curCh = i; store.set("last", i);
  document.querySelectorAll("#toc a").forEach(a=>a.setAttribute("aria-current", String(+a.dataset.i===i)));
  $("#tocsel").value = i;
  const meta = i===0 ? "读小说之前，先看两分钟" : `${s.pov}的故事。${s.season}，${s.place.replace(/，/g,"、")}`;
  const prev = i>0 ? `<a href="#read/${i-1}"><small>上一篇</small><span>${CH[i-1].title}</span></a>` : "<span></span>";
  const next = i<CH.length-1 ? `<a class="nx" href="#read/${i+1}"><small>下一篇</small><span>${CH[i+1].title}</span></a>` : `<a class="nx" href="#art"><small>全书完</small><span>去看画</span></a>`;
  $("#page").innerHTML = `<div class="banner">${ART.scene(i)}<div class="cap"><h1>${c.title}</h1><div class="meta">${meta}${i>0?`<a href="#map/${i}">看地图</a>`:""}</div></div></div>
    <div class="prose">${c.html}${c.end?`<p class="end">${c.end}</p>`:""}</div><nav class="pager" aria-label="翻篇">${prev}${next}</nav>`;
  const pos = store.get("pos-"+i, 0);
  requestAnimationFrame(()=>window.scrollTo(0, pos));
}
window.addEventListener("scroll", ()=>{ if(curCh==null || !$("#v-read").classList.contains("on")) return; clearTimeout(saveT); saveT=setTimeout(()=>store.set("pos-"+curCh, window.scrollY), 300); }, {passive:true});

function renderPeople(){
  $("#pov").innerHTML = POV.map(p=>`<article class="who"><div class="seal">${ART.seal(p.name,p.race)}</div><div>
    <h3>${p.name}</h3><div class="id">${p.race}，${p.id}</div><p>${p.text}</p><div class="token">身上总带着：${p.token}</div>
    <div class="chips">${p.in.map(n=>`<a href="#read/${n}">${n}　${STORIES[n].title}</a>`).join("")}</div></div></article>`).join("");
  $("#others").innerHTML = OTHERS.map(([n,t,ins])=>`<li><b>${n}</b><span>${t}<span class="chips" style="margin-top:6px">${ins.map(k=>`<a href="#read/${k}">${k}　${STORIES[k].title}</a>`).join("")}</span></span></li>`).join("");
}
function renderWorld(w){
  w = BOOK.world[w] ? w : "guide";
  document.querySelectorAll(".subnav a").forEach(a=>a.setAttribute("aria-current", a.dataset.w===w?"page":"false"));
  $("#worlddoc").innerHTML = BOOK.world[w];
}
function renderArt(){
  $("#gallery").innerHTML = STORIES.map(s=>`<figure><button data-n="${s.n}" aria-label="看大图：${s.title}">${ART.scene(s.n)}</button>
    <figcaption><b>${s.n===0?"":s.n+"　"}${s.title}</b><span>${s.place}</span><a href="#read/${s.n}">读这一篇</a></figcaption></figure>`).join("");
  $("#gallery").querySelectorAll("button").forEach(b=>b.onclick=()=>openLB(+b.dataset.n, b));
}
let lbReturn=null;
function openLB(n, from){ lbReturn=from; $("#lbframe").innerHTML = ART.scene(n); $("#lbcap").textContent = (n?n+"　":"")+STORIES[n].title+"，"+STORIES[n].place; $("#lb").classList.add("on"); $("#lbclose").focus(); }
function closeLB(){ $("#lb").classList.remove("on"); $("#lbframe").innerHTML=""; lbReturn && lbReturn.focus(); }
$("#lbclose").onclick = closeLB; $("#lb").onclick = e => { if(e.target.id==="lb") closeLB(); };
document.addEventListener("keydown", e => { if(e.key==="Escape" && $("#lb").classList.contains("on")) closeLB(); });

/* reading prefs */
let fsz = store.get("font", 19);
const applyPrefs = () => { document.documentElement.style.setProperty("--read-size", fsz+"px"); document.body.classList.toggle("night", store.get("night", false)); $("#theme").textContent = store.get("night",false) ? "昼读" : "夜读"; };
$("#fplus").onclick = () => { fsz = Math.min(26, fsz+1); store.set("font", fsz); applyPrefs(); };
$("#fminus").onclick = () => { fsz = Math.max(15, fsz-1); store.set("font", fsz); applyPrefs(); };
$("#theme").onclick = () => { store.set("night", !store.get("night", false)); applyPrefs(); };

/* router */
let built = {};
function route(){
  const h = location.hash.replace(/^#/,"") || "map";
  const [v, arg] = h.split("/");
  const view = ["map","read","people","world","art"].includes(v) ? v : "map";
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on", s.id==="v-"+view));
  document.querySelectorAll(".nav a").forEach(a=>a.setAttribute("aria-current", a.dataset.v===view ? "page" : "false"));
  if(view!=="read") document.body.classList.remove("night"); else applyPrefs();
  if(view==="map"){ if(!built.map){ MAP.init(); built.map=1; } if(arg) MAP.select(+arg); window.scrollTo(0,0); }
  if(view==="read"){ readChapter(arg!=null && arg!=="" ? +arg : store.get("last",0)); }
  if(view==="people"){ if(!built.people){ renderPeople(); built.people=1; } window.scrollTo(0,0); }
  if(view==="world"){ renderWorld(arg||"guide"); window.scrollTo(0,0); }
  if(view==="art"){ if(!built.art){ renderArt(); built.art=1; } window.scrollTo(0,0); }
}
if(!BOOK){ document.body.innerHTML = "<p style='padding:80px;font-size:18px'>这个文件缺少书的内容。请运行 tools/build_html.py 重新生成。</p>"; }
else { renderTOC(); applyPrefs(); window.addEventListener("hashchange", route); route(); }
</script>
</body>
</html>
