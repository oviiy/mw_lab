managers:
  - cik: 1067983
    name: Berkshire Hathaway
    person: Warren Buffett / Greg Abel
    style: [价值, 长期持有]
    founded: null
    bio:
      - Warren Buffett 自 1965 年起掌控伯克希尔，把一家纺织企业改造成以保险为核心的控股集团。
      - Greg Abel 于 2026 年 1 月 1 日接任 CEO，Buffett 继续担任董事长。
    bio_en:
      - "Warren Buffett took control of Berkshire in 1965 and turned a textile mill into an insurance-centred holding company."
      - "Greg Abel became CEO on January 1, 2026; Buffett remains chairman."
    sources:
      - {label: Wikipedia · Berkshire Hathaway, url: "https://en.wikipedia.org/wiki/Berkshire_Hathaway"}
