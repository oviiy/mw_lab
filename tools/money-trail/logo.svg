<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Money Trail">
  <defs>
    <radialGradient id="seal" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#93402c"/>
      <stop offset="1" stop-color="#5e2216"/>
    </radialGradient>
    <radialGradient id="coin" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#f0cf7e"/>
      <stop offset="1" stop-color="#b48a35"/>
    </radialGradient>
  </defs>
  <!-- oxblood seal with a brass rim -->
  <circle cx="32" cy="32" r="29.5" fill="url(#seal)" stroke="#b8923f" stroke-width="3"/>
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#d9c08a" stroke-width="1" opacity=".45"/>
  <!-- the trail: a dashed route winding up to the right -->
  <path d="M14.5 46 C 23 46.5, 21.5 35.5, 30 35.5 S 36.5 27, 39.5 25" fill="none" stroke="#f3e3bf" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="4.2 4.6"/>
  <circle cx="14.5" cy="46" r="3.6" fill="#f3e3bf"/>
  <!-- destination: a brass coin -->
  <circle cx="44.5" cy="20" r="8.6" fill="url(#coin)" stroke="#f3e3bf" stroke-width="1.8"/>
  <circle cx="44.5" cy="20" r="4.9" fill="none" stroke="#8a6420" stroke-width="1.5"/>
</svg>
